<!DOCTYPE html>
<!-- ICU Unit Board · v1 · Claude Code · 25-Aug-2026
     Reuses the real ICU Daily tool (embedded below as base64, injected per bed into an iframe).
     Build with build-board.sh (injects the tool + roundsheet.js + version). Self-contained, opens as a local file.
     Storage model: beds[n] = { d:<D schema>, stay:<id>, state:'preround'|'rounded', overnight:'', taskDone:[] }. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU Unit Board</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif}
  body{display:flex;flex-direction:column;background:#eef2f8;color:#1a1d21;font-size:15px}
  header{background:#1a3c8f;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:700}
  .fzb{font:inherit;font-weight:800;background:#2a4ea0;color:#fff;border:0;border-radius:5px;width:26px;height:24px;cursor:pointer;line-height:1}
  header select{font:inherit;padding:4px 8px;border-radius:5px;border:0}
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tabs button{font:inherit;font-weight:600;background:#2a4ea0;color:#cfe;border:0;border-radius:6px 6px 0 0;padding:6px 14px;cursor:pointer}
  .tabs button.on{background:#eef2f8;color:#1a3c8f}
  #wrap{flex:1;display:flex;min-height:0}
  #rail{flex:0 0 156px;background:#dbe6f6;padding:8px 7px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .raillbl{font-size:10px;font-weight:800;color:#1a3c8f;text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:2px 0 1px}
  .railgrp{display:flex;flex-direction:column;gap:6px;border:2px solid #9fbce8;border-radius:8px;padding:6px;background:#eaf1fb}
  .bedbtn{position:relative;display:block;width:100%;font:inherit;background:#fff;border:1px solid #b6cff0;border-radius:8px;padding:7px 8px 8px;cursor:pointer;text-align:left;color:#1a3c8f;line-height:1.25}
  .bedbtn.cur{background:#1a73e8;color:#fff;border-color:#1a73e8}
  .bedbtn.cur .idl,.bedbtn.cur .chip{color:#fff;background:rgba(255,255,255,.18)}
  .bedbtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#cbd5e6}
  .bedbtn.filled .dot{background:#28a745}
  .bedbtn .bn{font-weight:800;font-size:13px}
  .bedbtn .st{position:absolute;top:23px;right:6px;font-size:9px;font-weight:800;border-radius:4px;padding:0 3px}
  .bedbtn .st.pr{background:#ffe6b3;color:#8a5a00}
  .bedbtn .st.done{background:#cdeccd;color:#155f2e}
  .bedbtn .idl{display:block;font-weight:400;font-size:10px;opacity:.85;margin-top:1px}
  .bedbtn .idl.empty{opacity:.5;font-style:italic}
  .bedbtn .meta{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
  .bedbtn .chip{font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px;background:#e6ecf7;color:#1a3c8f}
  .bedbtn .chip.tsk{background:#ffd9d9;color:#a11}
  .bedbtn .chip.tx{background:#dfeee0;color:#1a6b2e}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  #pastebar{background:#dbe6f6;border-bottom:1px solid #c3d4ee;padding:11px 14px;display:flex;gap:10px;align-items:stretch}
  #pjson{flex:1;font-family:'Consolas','Courier New',monospace;font-size:12px;min-height:54px;padding:10px 12px;border:2px dashed #a9c4ec;border-radius:8px;resize:vertical;background:#fff;line-height:1.45}
  #pjson:focus{outline:none;border-color:#1a73e8}
  #pastebar button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:8px;padding:0 20px;cursor:pointer;font-size:14px}
  #msg{font-size:11px;color:#666;align-self:center;min-width:110px}
  #bedbar{display:none;gap:8px;align-items:center;background:#eaf1fb;border-bottom:1px solid #c3d4ee;padding:7px 14px;flex-wrap:wrap}
  #bedbar .bbtag{font-weight:800;color:#1a3c8f}
  #bedbar button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
  #bedbar button.sec{background:#6b7a90}
  #bedbar button.rnd{background:#6e40c9}
  #bedbar .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  #bedbar .spacer{flex:1}
  .taskchip{font-size:11px;font-weight:600;border-radius:12px;padding:3px 9px;cursor:pointer;background:#e6ecf7;color:#1a3c8f;border:1px solid #cdd9ee}
  .taskchip.k-new{background:#e3f0ff} .taskchip.k-stop{background:#f3e0e0} .taskchip.k-watch{background:#fff0d6}
  .taskchip.done{text-decoration:line-through;opacity:.5}
  #view{flex:1;min-height:0;position:relative}
  iframe{width:100%;height:100%;border:0;background:#fff;position:absolute;inset:0}
  .panel{position:absolute;inset:0;overflow:auto;padding:20px;background:#eef2f8}
  .census{background:#fff;border:1px solid #d7e0ee;border-radius:8px;padding:14px 18px;max-width:680px}
  .census b{color:#1a3c8f}
  .stub{color:#667;background:#fff;border:1px dashed #b6cff0;border-radius:8px;padding:18px;max-width:680px}
  code{background:#e6ecf7;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>🏥 ICU Unit Board <span style="font-weight:400;opacity:.7;font-size:11px">v1.3 · 25-Aug-2026</span></h1>
  Unit <select id="unitSel" onchange="switchUnit()"></select>
  <span id="dateLbl" style="opacity:.85"></span>
  <span style="display:flex;gap:4px;align-items:center;font-size:12px;margin-left:10px">Text <button class="fzb" onclick="fz(-0.08)">A&minus;</button><button class="fzb" onclick="fz(0.08)">A+</button></span>
  <div class="tabs">
    <button data-sec="daily" class="on" onclick="showSec('daily')">Daily</button>
    <button data-sec="handover" onclick="showSec('handover')">Handover</button>
    <button data-sec="prompts" onclick="showSec('prompts')">Prompts</button>
  </div>
</header>
<div id="wrap">
  <aside id="rail"></aside>
  <section id="stage">
    <div id="pastebar">
      <textarea id="pjson" placeholder='Paste a bed&#39;s JSON here — it loads automatically on paste (or press ⌘/Ctrl+Enter). Routes by the "bed" field.'></textarea>
      <button onclick="loadPaste()">⤵ Load bed</button>
      <span id="msg"></span>
    </div>
    <div id="bedbar"></div>
    <div id="view"></div>
  </section>
</div>

<script>/* roundsheet.js — §23 Rounding Sheet renderer for the Unit Board.
   renderRoundingSheet(d) -> full A4-print-optimised HTML string, matching the
   24-Aug Bed-4 gold standard. Deterministic from the bed's structured data (d).
   The "Today / tasks" callout is a best-effort heuristic from plan/overnight lines
   (chat-Claude's `icu rounds` produces the full-judgment version). Print-CSS
   invariants (§23) are baked in and must not be removed. */
function rsEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function rsDay(admit){ if(!admit)return '?'; var a=new Date(admit),t=new Date(); t.setHours(0,0,0,0); var n=Math.floor((t-a)/86400000)+1; return isNaN(n)?'?':n; }
function rsDate(){ var d=new Date(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(); }
function rsFile(){ var d=new Date(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return String(d.getDate()).padStart(2,'0')+'-'+m[d.getMonth()]+'-'+d.getFullYear(); }
function rsLines(v){ if(!v)return []; if(Array.isArray(v))return v.filter(function(x){return x!=null&&String(x).trim();}); return String(v).split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean); }
function rsWarn(t){ return /^⚠|threshold|avoid|risk|allerg|airway|unsecured|bleed|deteriorat|watch/i.test(t); }
function rsFlag(v){ // wrap (H)/(L) etc in colour spans
  return rsEsc(v).replace(/\((HH|LL|H|L)\)/g,function(m,g){ var c=(g[0]==='H')?'hi':'lo'; return '<span class="'+c+'">('+g+')</span>'; }); }

function rsFlagsBlock(d){
  var aro=(d.aro&&String(d.aro).trim())?d.aro:'None';
  var alg=(d.allergies&&String(d.allergies).trim())?d.allergies:'NKA';
  var gocP=(d.problems||[]).filter(function(p){return p&&p.type==='goc';})[0];
  var goc=gocP?((gocP.goc_status||'?')+(gocP.goc_note?' — '+gocP.goc_note:'')):'Unknown';
  var aroCls=/none|neg/i.test(aro)?'ok':'';
  var algCls=/^nka|none|nil/i.test(alg)?'ok':'warn';
  return '<div class="flags">'
    +'<div class="flag '+aroCls+'"><span class="lbl">ARO / Isolation</span><span class="val">'+rsEsc(aro)+'</span></div>'
    +'<div class="flag '+algCls+'"><span class="lbl">Allergies</span><span class="val">'+rsEsc(alg)+'</span></div>'
    +'<div class="flag"><span class="lbl">Goals of Care</span><span class="val">'+rsEsc(goc)+'</span></div></div>';
}

function rsTodayBlock(d){
  // heuristic bucket from all plan lines + overnight text
  var pend=[],mods=[],warns=[];
  (d.problems||[]).forEach(function(p){
    rsLines(p&&p.plan).forEach(function(l){
      if(rsWarn(l)){ warns.push(l); return; }
      if(/pending|await|f\/u|follow.?up|repeat|echo|consult|refer|result|culture|reassess|recheck/i.test(l)){ pend.push(l); }
      else if(/^start|^new|^begin|^add |^increase|^up-?titrat|^stop|^hold|^d\/?c|^discontinu|^decreas|^wean/i.test(l)){ mods.push(l); }
    });
  });
  if(d.overnight){ rsLines(d.overnight).forEach(function(l){ pend.push(l); }); }
  function ul(arr){ return arr.length?('<ul>'+arr.map(function(l){ return '<li'+(rsWarn(l)?' class="warn"':'')+'>'+rsFlag(l.replace(/^⚠\s*/,''))+'</li>'; }).join('')+'</ul>'):'<ul><li style="color:#999">—</li></ul>'; }
  return '<div class="today"><h2>⚡ Today · Key changes &amp; tasks <span style="font-weight:400;font-size:6.5pt;color:#a06a1a">(auto-draft — verify &amp; edit)</span></h2>'
    +'<div class="today-grid">'
    +'<div class="today-cell"><span class="k">Pending / awaiting</span>'+ul(pend)+'</div>'
    +'<div class="today-cell"><span class="k">New / stop / warn</span>'+ul(mods.concat(warns))+'</div>'
    +'</div></div>';
}

function rsSnapBlock(d){
  var v=d.vitals||{}, fl=d.fluids||{};
  function rows(pairs){ return pairs.filter(function(p){return p[1]!=null&&String(p[1]).trim();}).map(function(p){ return '<div class="r"><span class="l">'+rsEsc(p[0])+'</span><span class="v">'+rsFlag(p[1])+'</span></div>'; }).join('')||'<div class="r"><span class="l">—</span><span class="v"></span></div>'; }
  // pull an ABG/VBG section from labs if present
  var abg=(d.labs||[]).filter(function(s){return /abg|vbg|gas/i.test(s.section||'');})[0];
  var abgRows=abg?abg.items.slice(0,6).map(function(it){return [it.l,(it.v||'')+(it.f==='hi'?' (H)':it.f==='lo'?' (L)':'')];}):[['','—']];
  return '<div class="snap">'
    +'<div class="snap-box"><h3>Vitals</h3><div class="rows">'+rows([['BP',v.bp&&v.map?v.bp+' ('+v.map+')':v.bp],['HR',v.hr],['SpO2',v.sats],['Tmax',v.tmax],['RR',v.rr],['GCS',v.gcs]])+'</div></div>'
    +'<div class="snap-box"><h3>Airway / Support</h3><div class="rows">'+rows([['Resp',v.resp],['Diet',(d.fluids&&d.fluids.note)?'':''],['CVS',v.cvs],['Abd',v.abd],['Other',v.other]])+'</div></div>'
    +'<div class="snap-box"><h3>ABG / VBG</h3><div class="rows">'+rows(abgRows)+'</div></div>'
    +'<div class="snap-box"><h3>Fluid Balance</h3><div class="rows">'+rows([['Balance',fl.fb],['Urine out',fl.uo],['Note',fl.note]])+'</div></div>'
    +'</div>';
}

function rsLabsBlock(d){
  var labs=(d.labs||[]).filter(function(s){return !/abg|vbg|gas/i.test(s.section||'');});
  if(!labs.length)return '';
  var lines=labs.map(function(sec){
    var items=(sec.items||[]).filter(function(it){return it&&(it.v!=null&&String(it.v).trim());}).map(function(it){
      var val=String(it.v); var suf=(it.f==='hi'&&!/\(H/.test(val))?' (H)':(it.f==='lo'&&!/\(L/.test(val))?' (L)':'';
      var disp=rsFlag(val+suf);
      return (it.l?rsEsc(it.l)+' ':'')+disp;
    });
    if(!items.length)return '';
    return '<div class="line"><span class="pn">'+rsEsc((sec.section||'').replace(/\s*\(.*\)$/,''))+'</span> '+items.join(' &nbsp;·&nbsp; ')+'</div>';
  }).filter(Boolean).join('');
  return lines?('<div class="labs"><h3>Labs</h3>'+lines+'</div>'):'';
}

function rsProblemsBlock(d){
  var rows=(d.problems||[]).map(function(p,i){
    if(!p||!p.name)return '';
    var isGoc=p.type==='goc', isDispo=p.type==='dispo';
    var cls=isGoc?' class="goc"':isDispo?' class="dispo"':'';
    var badge=p.badge&&p.badge.text?'<span class="badge '+({b:'bl',g:'gr',o:'',r:''}[(p.badge.type||'o')]||'')+'">'+rsEsc(p.badge.text)+'</span>':'';
    // doing now = tx (+ key_labs summary); plan = plan (+ bp)
    var doing=rsLines(p.tx);
    if(p.key_labs&&p.key_labs.length){ var kl=p.key_labs.filter(function(k){return k&&k.v;}).map(function(k){return (k.l?k.l+' ':'')+k.v;}); if(kl.length)doing.push(kl.join(' | ')); }
    if(isGoc){ doing=rsLines(p.goc_status? (p.goc_status+(p.goc_note?' — '+p.goc_note:'')) : p.context); }
    if(isDispo){ doing=rsLines(p.dispo_summary||p.context); }
    var plan=rsLines(p.plan).concat(rsLines(p.bp).map(function(b){return b;}));
    function ul(arr){ return arr.length?('<ul>'+arr.map(function(l){return '<li'+(rsWarn(l)?' class="warn"':'')+'>'+rsFlag(l.replace(/^⚠\s*/,''))+'</li>';}).join('')+'</ul>'):''; }
    return '<tr'+cls+'>'
      +'<td class="name">'+(i+1)+'. '+rsEsc(p.name)+badge+'</td>'
      +'<td class="doing">'+ul(doing)+'</td>'
      +'<td class="plan">'+ul(plan)+'</td></tr>';
  }).filter(Boolean).join('');
  return '<table class="prob"><thead><tr><th>Problem</th><th>Doing now</th><th>Plan</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderRoundingSheet(d){
  d=d||{};
  var day=rsDay(d.icu_admit);
  var unit=(d.unit||'').toUpperCase();
  var dx=d.subtitle||((d.diagnoses||[]).join(' · '))||'';
  var admitStr=d.icu_admit?(' · ICU admit '+d.icu_admit):'';
  var CSS='*{box-sizing:border-box;margin:0;padding:0}'
   +'@page{size:A4 portrait;margin:12mm 8mm 8mm 8mm}'
   +"html,body{background:#fff;color:#000;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}"
   +'body{font-size:8.3pt;line-height:1.23;padding:6px 4px}'
   +'@media print{body{padding:0}.print-instructions{display:none!important}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}'
   +'.hdr{border:1.5px solid #000;padding:5px 8px;margin-bottom:5px;break-after:avoid;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}'
   +'.hdr-l h1{font-size:13pt;font-weight:800;line-height:1.1;margin-bottom:2px}.hdr-l .sub{font-size:8pt;color:#333;font-weight:600}.hdr-l .dx{font-size:8.5pt;font-weight:600;margin-top:3px;max-width:520px}'
   +'.hdr-r{text-align:right;font-size:7.5pt;color:#333;line-height:1.3}.hdr-r .date{font-size:11pt;font-weight:800;color:#000}.hdr-r .day{background:#000;color:#fff;padding:2px 6px;border-radius:2px;display:inline-block;margin-top:2px;font-weight:700;font-size:8pt}'
   +'.flags{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:4px;margin-bottom:5px;break-inside:avoid}'
   +'.flag{border:1px solid #666;padding:3px 6px;font-size:8pt;background:#f5f5f5}.flag .lbl{font-size:6.8pt;text-transform:uppercase;font-weight:700;letter-spacing:.4px;color:#555;margin-bottom:1px}.flag .val{font-weight:700}'
   +'.flag.warn{background:#fde8e8;border-color:#b02020}.flag.warn .val{color:#b02020}.flag.ok{background:#eaf5ea;border-color:#2c7a2c}'
   +'.today{border:1.5px solid #d97706;background:#fff7e6;padding:5px 8px;margin-bottom:5px;break-inside:avoid}'
   +'.today h2{font-size:8.5pt;font-weight:800;color:#7a3f00;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}'
   +'.today-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;row-gap:2px;font-size:8pt}'
   +'.today-cell .k{font-weight:700;color:#7a3f00;text-transform:uppercase;font-size:6.8pt;letter-spacing:.3px;display:block;margin-bottom:1px}'
   +'.today-cell ul{list-style:none;padding:0;margin:0}.today-cell li{padding:1px 0;line-height:1.25}.today-cell li.warn{color:#b02020;font-weight:600}.today-cell li.warn::before{content:"⚠ ";font-weight:800}'
   +'.snap{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin-bottom:5px;break-inside:avoid}'
   +'.snap-box{border:1px solid #666;padding:3px 6px}.snap-box h3{font-size:6.8pt;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#333;margin-bottom:2px;border-bottom:1px solid #ccc;padding-bottom:1px}'
   +'.snap-box .rows{font-size:7.8pt;line-height:1.35}.snap-box .rows .r{display:flex;justify-content:space-between;gap:4px}.snap-box .rows .r .l{color:#555;font-weight:600}.snap-box .rows .r .v{font-weight:700;text-align:right}'
   +'.labs{border:1px solid #666;padding:3px 6px;margin-bottom:5px;break-inside:avoid;background:#fafafa}.labs h3{font-size:6.8pt;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#333;margin-bottom:2px}'
   +'.labs .line{font-size:7.7pt;line-height:1.35;margin-bottom:1px}.labs .line .pn{font-weight:700;color:#333;display:inline-block;min-width:70px}'
   +'.hi{color:#b02020;font-weight:700}.lo{color:#0d47a1;font-weight:700}'
   +'table.prob{width:100%;border-collapse:collapse;margin-bottom:5px;font-size:8pt}'
   +'table.prob thead{display:table-header-group;background:#000;color:#fff}table.prob thead th{padding:3px 6px;text-align:left;font-weight:700;text-transform:uppercase;font-size:7pt;letter-spacing:.5px}'
   +'table.prob tbody tr{page-break-inside:avoid;break-inside:avoid;border-bottom:1px solid #999}table.prob tbody td{padding:4px 6px;vertical-align:top;line-height:1.28}'
   +'table.prob tbody td.name{font-weight:800;width:22%}table.prob tbody td.doing{width:34%;font-size:7.8pt}table.prob tbody td.plan{width:44%;font-size:7.8pt}table.prob tbody td.plan .warn{color:#b02020;font-weight:700}'
   +'table.prob tbody tr.goc td.name{color:#0d47a1}table.prob tbody tr.dispo td.name{color:#1b5e20}table.prob tbody td ul{margin:0;padding-left:12px}table.prob tbody td li{padding:0;margin:0;line-height:1.25}'
   +'.badge{display:inline-block;background:#f0883e;color:#fff;padding:0 4px;border-radius:2px;font-size:6.5pt;font-weight:700;margin-left:4px;vertical-align:middle}.badge.bl{background:#1a73e8}.badge.gr{background:#28a745}'
   +'.foot{border-top:1px solid #999;padding-top:4px;margin-top:5px;font-size:7.2pt;color:#444;break-inside:avoid;display:flex;justify-content:space-between;gap:8px}.foot .legend{font-style:italic}'
   +'.print-instructions{background:#fff9e6;border:1px solid #d97706;padding:8px 12px;margin-top:14px;font-size:9pt;border-radius:4px}.print-instructions strong{color:#7a3f00}.print-instructions ul{margin-top:4px;padding-left:20px}';
  var body='<div class="hdr"><div class="hdr-l"><h1>BED '+rsEsc(d.bed)+'</h1>'
    +'<div class="sub">'+rsEsc(d.age_sex||'')+' · Day '+day+' '+rsEsc(unit)+rsEsc(admitStr)+'</div>'
    +(dx?'<div class="dx">'+rsEsc(dx)+'</div>':'')+'</div>'
    +'<div class="hdr-r"><div class="date">'+rsDate()+'</div><div class="day">ICU Day '+day+'</div>'
    +'<div style="margin-top:4px">Rounding sheet<br>Not an SCM note</div></div></div>'
    +rsFlagsBlock(d)+rsTodayBlock(d)+rsSnapBlock(d)+rsLabsBlock(d)+rsProblemsBlock(d)
    +'<div class="foot"><div class="legend">† = inferred / not in signed SCM &nbsp;·&nbsp; (H) high &nbsp;·&nbsp; (L) low &nbsp;·&nbsp; (HH)/(LL) markedly abnormal &nbsp;·&nbsp; ⚠ safety flag</div>'
    +'<div>Bed '+rsEsc(d.bed)+' · '+rsEsc(unit)+' · '+rsDate()+' · board-generated §23</div></div>'
    +'<div class="print-instructions"><strong>Before printing:</strong><ul>'
    +'<li><strong>Margins:</strong> Default (NOT None / NOT Minimum)</li><li><strong>Scale:</strong> Default or 100% (NOT Fit-to-Page)</li>'
    +'<li><strong>Headers and footers:</strong> OFF (most common cause of top-clipping)</li><li><strong>Background graphics:</strong> ON (so flag colours + callout print)</li></ul></div>';

function toolHTML(){ // decode base64 -> UTF-8 string
  var bin=atob(TOOL_B64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
var NEEDLE="var D=null,SCM='';";

// ---- unit config (bed counts) ----
var UNITS={
  'PICU+PICUSU':{ groups:[ {label:'PICU', beds:[1,2,3,4,5,6,7]}, {label:'PICUSU', beds:[8,9,10,11]} ] },
  MICU:{n:10,from:1}, SICU:{n:12,from:1}, CCU:{n:12,from:1}, CSU:{n:8,from:1}
};
var UNIT_ALIAS={ PICU:'PICU+PICUSU', PICUSU:'PICU+PICUSU' };  // either name routes to the combined Pasqua board
function normUnit(u){ u=String(u||'').toUpperCase(); return UNIT_ALIAS[u]||u; }
function unitGroups(u){ var c=UNITS[u]; if(c&&c.groups)return c.groups; var a=[]; if(c){for(var i=0;i<c.n;i++)a.push(c.from+i);} return [{label:'',beds:a}]; }

var unit='PICU+PICUSU', beds={}, current=null, section='daily';
var fontScale=parseFloat(localStorage.getItem('ub_fontscale')||'1.2');

// ---- small helpers ----
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function bd(n){ return beds[n]?beds[n].d:null; }               // the D (schema) object for a bed
function mintStay(){ return 's'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function fz(d){ fontScale=Math.max(0.9,Math.min(2.0, Math.round((fontScale+d)*100)/100)); try{localStorage.setItem('ub_fontscale',fontScale);}catch(e){} renderView(); }
function today(){var d=new Date(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(d.getDate()).padStart(2,'0')+'-'+m[d.getMonth()]+'-'+d.getFullYear();}
function storeKey(){return 'unitboard_'+unit+'_'+today();}
function histKey(){return 'unitboard_hist_'+unit;}

function taskCount(w){ if(!w||!w.d||!w.d.tasks)return 0; var done=w.taskDone||[],c=0;
  w.d.tasks.forEach(function(t,i){ if(done.indexOf(i)<0)c++; }); return c; }
function dispoMark(d){ if(!d)return ''; var s=''; (d.problems||[]).forEach(function(p){ if(p&&p.type==='dispo')s+=' '+(p.dispo_summary||''); });
  s=(s+' '+(d.subtitle||'')).toLowerCase();
  if(/step[\s-]?down|\bsd\b/.test(s))return '→SD';
  if(/\bward\b|\bfloor\b/.test(s))return '→W';
  if(/\bhome\b|discharge/.test(s))return '→home';
  return ''; }

function init(){
  var sel=document.getElementById('unitSel');
  Object.keys(UNITS).forEach(function(u){var o=document.createElement('option');o.value=u;o.textContent=u;sel.appendChild(o);});
  document.getElementById('dateLbl').textContent='· '+today();
  load(); renderRail(); showSec('daily');
}
function switchUnit(){ unit=document.getElementById('unitSel').value; beds={}; current=null; load(); renderRail(); showSec('daily'); }

function load(){
  try{ var raw=localStorage.getItem(storeKey()); beds=raw?JSON.parse(raw):{}; }catch(e){ beds={}; }
  // migrate any legacy records (beds[n] stored as a raw D object) into the stay-day wrapper
  Object.keys(beds).forEach(function(k){ var v=beds[k];
    if(v && v.d===undefined && (v.bed!==undefined||v.age_sex!==undefined)){
      beds[k]={ d:v, stay:mintStay(), state:'preround', overnight:'', taskDone:[] };
    }
  });
}
function save(){ try{ localStorage.setItem(storeKey(), JSON.stringify(beds)); }catch(e){} }

function bedList(){ var a=[]; unitGroups(unit).forEach(function(gr){ a=a.concat(gr.beds); }); return a; }

function renderRail(){
  var rail=document.getElementById('rail'); rail.innerHTML='';
  unitGroups(unit).forEach(function(gr){
    if(gr.label){ var h=document.createElement('div'); h.className='raillbl'; h.textContent=gr.label; rail.appendChild(h); }
    var box=document.createElement('div'); box.className='railgrp';
    gr.beds.forEach(function(n){
      var w=beds[n], b=document.createElement('button');
      b.className='bedbtn'+(w?' filled':'')+(current===n?' cur':'');
      var inner='<span class="dot"></span><span class="bn">Bed '+n+'</span>';
      if(w){ var d=w.d;
        inner+='<span class="st '+(w.state==='rounded'?'done':'pr')+'">'+(w.state==='rounded'?'✓':'PR')+'</span>';
        inner+='<span class="idl">'+(d.age_sex?esc(d.age_sex):'&mdash;')+(d.subtitle?' · '+esc((''+d.subtitle).slice(0,22)):'')+'</span>';
        var meta=[]; var code=esc(d.goc_status||d.goc||''); var tc=taskCount(w); var dm=dispoMark(d);
        if(code)meta.push('<span class="chip">'+code+'</span>');
        if(tc)meta.push('<span class="chip tsk">⚑'+tc+'</span>');
        if(dm)meta.push('<span class="chip tx">'+dm+'</span>');
        if(meta.length)inner+='<span class="meta">'+meta.join('')+'</span>';
      } else { inner+='<span class="idl empty">— open —</span>'; }
      b.innerHTML=inner;
      b.onclick=function(){ openBed(n); };
      box.appendChild(b);
    });
    rail.appendChild(box);
  });
}

function renderBedBar(){
  var bar=document.getElementById('bedbar');
  if(section!=='daily' || current==null || !beds[current]){ bar.style.display='none'; bar.innerHTML=''; return; }
  var w=beds[current], d=w.d, done=w.taskDone||[];
  var chips=(d.tasks||[]).map(function(t,i){
    return '<span class="taskchip k-'+(t.kind||'pending')+(done.indexOf(i)>=0?' done':'')+'" onclick="toggleTask('+i+')" title="'+esc(t.kind||'')+' — click to toggle done">'+esc(t.text||'')+'</span>';
  }).join('');
  bar.style.display='flex';
  bar.innerHTML=
    '<span class="bbtag">Bed '+current+'</span>'+
    '<button class="rnd" onclick="toggleRounded()">'+(w.state==='rounded'?'↺ Pre-round':'✓ Mark rounded')+'</button>'+
    '<button onclick="roundSheetForCurrent()" title="§23 A4 rounding sheet">🖨 Rounding</button>'+
    '<button class="sec" onclick="addTask()">＋ Task</button>'+
    '<span class="chips">'+chips+'</span>'+
    '<span class="spacer"></span>'+
    '<button class="sec" onclick="newAdmission('+current+')" title="Archive this note & start a new patient in this bed">＋ New pt</button>'+
    '<button class="sec" onclick="transferBed('+current+')" title="Transfer/discharge: archive note & clear bed">⇥ Transfer / DC</button>';
}

function loadPaste(){
  var t=document.getElementById('pjson').value.trim(), msg=document.getElementById('msg');
  if(!t){ msg.textContent='Paste a bed JSON first.'; return; }
  var d; try{ d=JSON.parse(t); }catch(e){ msg.textContent='⚠ Not valid JSON: '+e.message; return; }
  var n=d.bed; if(n==null){ msg.textContent='⚠ JSON has no "bed" field — can\'t route it.'; return; }
  var U=normUnit(d.unit);
  if(d.unit && UNITS[U] && U!==unit){ unit=U; document.getElementById('unitSel').value=unit; load(); }
  if(beds[n]){ beds[n].d=d; }                                   // update existing stay, keep its meta/state/tasks
  else { beds[n]={ d:d, stay:mintStay(), state:'preround', overnight:'', taskDone:[] }; }
  save();
  document.getElementById('pjson').value='';
  msg.textContent='✓ Loaded Bed '+n;
  renderRail(); openBed(n);
}

function setTab(s){ document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.sec===s); }); }
function renderView(){
  var view=document.getElementById('view'); view.innerHTML='';
  if(section==='daily'){
    if(current!=null){
      if(!beds[current]){ view.innerHTML='<div class="panel"><div class="stub">Bed '+current+' is empty — paste this bed&rsquo;s JSON in the box above to load it.</div></div>'; }
      else {
        var f=document.createElement('iframe');
        // board owns persistence → neutralise the tool's autosave/resume + hide its own paste box; inject zoom
        var html=toolHTML()
          .replace("if(D){","checkSavedState=function(d){return d;};saveState=function(){};attachSaveListeners=function(){};if(D){")
          .replace("</head>","<style>body{zoom:"+fontScale+"}#jp{display:none!important}</style></head>")
          .replace(NEEDLE, "var D="+JSON.stringify(bd(current))+",SCM='';");
        f.srcdoc=html; view.appendChild(f);
      }
    } else {
      view.innerHTML='<div class="panel"><div class="stub">Pick a bed on the left, or paste a bed JSON above. It auto-routes by the <code>bed</code> field.</div></div>';
    }
  } else if(section==='handover'){ view.innerHTML=handoverPanel(); }
  else if(section==='prompts'){ view.innerHTML=promptsPanel(); }
  renderBedBar();
}
function openBed(n){ current=n; section='daily'; setTab('daily'); renderRail(); renderView(); }
function showSec(s){ section=s; setTab(s); renderView(); }

// ---- bed lifecycle ----
function toggleRounded(){ var w=beds[current]; if(!w)return; w.state=(w.state==='rounded')?'preround':'rounded'; save(); renderRail(); renderBedBar(); }
function toggleTask(i){ var w=beds[current]; if(!w)return; w.taskDone=w.taskDone||[]; var k=w.taskDone.indexOf(i);
  if(k>=0)w.taskDone.splice(k,1); else w.taskDone.push(i); save(); renderRail(); renderBedBar(); }
function addTask(){ var w=beds[current]; if(!w)return; var t=prompt('New task / watch-item for Bed '+current+':'); if(!t)return;
  w.d.tasks=w.d.tasks||[]; w.d.tasks.push({text:t,kind:'pending'}); save(); renderRail(); renderBedBar(); }
function archiveBed(n,reason){ try{ var h=JSON.parse(localStorage.getItem(histKey())||'[]'); var w=beds[n];
  h.push({date:today(),unit:unit,bed:n,reason:reason,stay:w.stay,state:w.state,overnight:w.overnight||'',d:w.d,archivedAt:Date.now()});
  localStorage.setItem(histKey(), JSON.stringify(h)); }catch(e){} }
function newAdmission(n){ if(!beds[n])return; if(!confirm('Start a NEW admission in Bed '+n+'?\nThe current note is archived to history and the bed is cleared.'))return;
  archiveBed(n,'new-admission'); delete beds[n]; save(); renderRail(); renderView();
  document.getElementById('msg').textContent='Bed '+n+' cleared — paste the new patient’s JSON.'; }
function transferBed(n){ if(!beds[n])return; var r=prompt('Transfer / discharge Bed '+n+' — reason?\n(ward / step-down / home / died)','ward'); if(r===null)return;
  archiveBed(n, r||'transfer'); delete beds[n]; if(current===n)current=n; save(); renderRail(); renderView();
  document.getElementById('msg').textContent='Bed '+n+' transferred ('+(r||'—')+') → archived to history.'; }

// ---- handover (v1 aggregation; gold-format render lands next increment) ----
function handoverPanel(){
  var filled=bedList().filter(function(n){return beds[n];});
  var rows=filled.map(function(n){var w=beds[n],d=w.d;
    return '<tr style="border-top:1px solid #eef"><td style="padding:4px 8px"><b>Bed '+n+'</b> '+(w.state==='rounded'?'✓':'<span style=color:#8a5a00>PR</span>')+'</td>'+
      '<td style="padding:4px 8px">'+esc(d.age_sex||'?')+'</td>'+
      '<td style="padding:4px 8px">'+esc(d.handover_line||d.subtitle||'')+'</td>'+
      '<td style="padding:4px 8px">'+esc(d.goc_status||d.goc||'')+'</td>'+
      '<td style="padding:4px 8px;color:#a11">'+(taskCount(w)?('⚑'+taskCount(w)):'')+'</td></tr>';
  }).join('');
  var goc={}; filled.forEach(function(n){var g=(bd(n).goc_status||bd(n).goc||'?');goc[g]=(goc[g]||0)+1;});
  var gocLine=Object.keys(goc).map(function(k){return k+': '+goc[k];}).join(' · ')||'—';
  return '<div class="panel">'+
    '<div class="census"><b>'+unit+' · '+today()+' — census</b><br>'+
      filled.length+' bed(s) loaded · GoC: '+gocLine+'</div><br>'+
    '<div class="census"><b>Beds</b><table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:13px">'+
      '<tr style="text-align:left;color:#556"><th style="padding:4px 8px">Bed</th><th style="padding:4px 8px">Pt</th><th style="padding:4px 8px">Summary</th><th style="padding:4px 8px">GoC</th><th style="padding:4px 8px">Tasks</th></tr>'+
      (rows||'<tr><td style="padding:8px">No beds loaded yet.</td></tr>')+'</table></div><br>'+
    '<div class="stub">Next increment: render this in your gold-standard <b>ICU-Handover-Universal</b> format, add the per-bed overnight/update box, colleague-bed paste, and sickest-first ordering.</div></div>';
}

function promptsPanel(){
  var rows=[
    ['icu daily Bed N:','Consolidate a bed’s notes into a daily SCM note (then paste the JSON here).'],
    ['icu daily update Bed N:','Update an existing daily note.'],
    ['icu admission Bed N:','New ICU admission note.'],
    ['icu admission update Bed N:','Update an admission note.'],
    ['daily handover','Build the unit handover.'],
    ['feedback log:','Log a mid-shift tweak/observation.'],
    ['feedback review:','Review & consolidate feedback off-shift.'],
    ['start shift: DD Mon YYYY UNIT','Open the shift anchor tab.']
  ].map(function(p){return '<tr style="border-top:1px solid #eef"><td style="padding:6px 10px"><code>'+esc(p[0])+'</code></td><td style="padding:6px 10px;color:#445">'+esc(p[1])+'</td></tr>';}).join('');

// §23 rounding sheet for the current bed (uses live edits via the tool's captureToD when reachable)
function roundSheetForCurrent(){
  if(current==null||!beds[current]){ alert('Load a bed first (paste its JSON).'); return; }
  var d=bd(current);
  try{ var ifr=document.querySelector('#view iframe'); if(ifr&&ifr.contentWindow&&typeof ifr.contentWindow.captureToD==='function'){ var ed=ifr.contentWindow.captureToD(); if(ed&&ed.bed!=null)d=ed; } }catch(e){}
  var html=renderRoundingSheet(d);
  var w=window.open('','_blank');
  if(w){ w.document.open(); w.document.write(html); w.document.close(); }
  else { alert('Popup blocked — allow popups for this page to open the rounding sheet.'); }
}

// convenience: paste auto-loads; Cmd/Ctrl+Enter also loads
var pj=document.getElementById('pjson');
pj.addEventListener('paste', function(){ setTimeout(loadPaste, 40); });
pj.addEventListener('keydown', function(e){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); loadPaste(); } });
init();
