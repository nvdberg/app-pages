onfirmed\n\n## Definitive management pathway\n- [ ] **Type A (ascending): emergent cardiothoracic surgery consultation** — surgical emergency, mortality ~1–2%/hour untreated\n- [ ] **Type A with malperfusion** (renal/mesenteric/limb): urgent surgery still indicated; involve surgery immediately regardless\n- [ ] **Type B uncomplicated: medical management first-line** (anti-impulse therapy as above)\n- [ ] **Type B complicated** (rupture, malperfusion, extension, refractory pain, uncontrolled HTN despite therapy) → **TEVAR preferred over open repair** when anatomy suitable\n- [ ] Involve **vascular/CT surgery early** even for \"uncomplicated\" Type B to establish surveillance plan\n\n## Malperfusion surveillance & serial exams\n- [ ] Serial neuro exams — **cerebral** malperfusion (stroke, syncope, altered LOC)\n- [ ] Serial cardiac markers/ECG — **coronary** malperfusion (dissection can occlude coronary ostia, mimic MI)\n- [ ] Neuro checks of lower extremities/back — **spinal cord** malperfusion (paraparesis/paraplegia)\n- [ ] Abdominal exam, lactate trend — **mesenteric** malperfusion\n- [ ] Renal function trend, urine output — **renal** malperfusion\n- [ ] Pulses/perfusion all four limbs — **limb** malperfusion\n- [ ] Repeat imaging if new deficit, hemodynamic change, or refractory pain — treat as evolving until proven stable\n\n## Goals of care\n- [ ] Discuss **high mortality of untreated Type A** and surgical risk with patient/family early\n- [ ] Document **goals-of-care / surrogate decision-maker** discussion, especially if surgical candidacy uncertain or comorbidity-limited\n\n## Pearls & pitfalls\n- [ ] **Consider AAS whenever chest/back pain is accompanied by a new or evolving neurological\n  deficit** — don't anchor solely on classic \"tearing\" pain, which may be absent (LITFL)\n- [ ] **A \"normal\" CXR occurs in ~11–16% of confirmed cases**, and a widened mediastinum is seen in only\n  ~56–63% despite dissection being present — normal CXR does not exclude AAS *(verify)* (LITFL)\n- [ ] **Transthoracic echo sensitivity is limited** — roughly 75% for Type A, only ~40% for Type B —\n  a negative TTE does not rule out dissection; proceed to CTA/TEE as indicated *(verify)* (LITFL)\n- [ ] **In a hypotensive patient, confirm the low BP isn't a limb-occlusion artifact** — check the arm\n  with the best pulse, and generally measure/treat off the limb with the *highest* reading, since\n  dissection can occlude a subclavian/limb vessel and falsely lower a distal cuff reading (LITFL, EMCrit IBCC)\n- [ ] **Hypotension is far more common in Type A (~25%) than Type B (<5%)** and is a red flag for\n  tamponade, severe AR, coronary occlusion, or free rupture — treat as a surgical emergency, not simple\n  volume depletion *(verify)* (EMCrit IBCC)\n- [ ] **About half of dissection patients under 40 have Marfan syndrome** — screen young patients for\n  connective-tissue stigmata, family history, and (in women) pregnancy status *(verify)* (EMCrit IBCC)\n- [ ] **If echo shows a clotted (not simple) pericardial effusion in tamponade physiology, bedside\n  needle drainage will likely fail** — and rapid pressure normalization after drainage can trigger\n  rebound hypertension that worsens the dissection; this scenario needs the OR, not the bedside (EMCrit IBCC)\n- [ ] **Beta-blocker before vasodilator, every time** — starting a vasodilator first causes reflex\n  tachycardia and increases aortic wall stress/dP-dt, the opposite of the goal (LITFL, EMCrit IBCC)\n\n## Commonly-missed on documentation (what the gap-check flags)\nInterarm BP differential checked? · classification (A vs B) stated? · beta-blocker documented BEFORE vasodilator? ·\nHR/BP targets stated? · anticoagulation/thrombolytics explicitly held? · surgery/vascular consult timestamped for Type A? ·\nmalperfusion systems reviewed (coronary/cerebral/spinal/mesenteric/renal/limb)? · GoC discussion documented?\n\n*Sources: [2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001106) · [Full text (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC9876736/) · [2022 Guideline on Aortic Disease — Key Perspectives, Part 2 — ACC.org](https://www.acc.org/latest-in-cardiology/ten-points-to-remember/2022/11/01/12/21/2022-guideline-on-aortic-disease-2-gl-ad) · [LITFL — Acute Aortic Dissection](https://litfl.com/acute-aortic-dissection/) · [EMCrit IBCC — Aortic dissection](https://emcrit.org/ibcc/aortic-dissection/)*\n"}, {"file": "ards-ats-esicm-sccm-2017.md", "title": "ARDS", "system": "Respiratory", "body": "# ARDS — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** An Official American Thoracic Society/European Society of Intensive Care Medicine/Society\n> of Critical Care Medicine Clinical Practice Guideline: Mechanical Ventilation in Adult Patients with\n> Acute Respiratory Distress Syndrome (Fan E et al., ATS/ESICM/SCCM), *American Journal of Respiratory\n> and Critical Care Medicine* 2017.\n> https://www.atsjournals.org/doi/full/10.1164/rccm.201703-0548ST\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2017 (check for a newer edition periodically —\n> ESICM/ATS focused updates have circulated since; verify no superseding version exists locally)\n\n## Why — physiology / first principles\n- Diffuse alveolar damage → capillary leak, alveolar flooding, surfactant dysfunction → collapsed/flooded\n  units shrink the aerated lung to a small, low-compliance **\"baby lung\"** rather than a uniformly stiff one.\n- Ventilating that small compartment at normal tidal volumes overdistends the aerated units (volutrauma) and\n  cyclically opens/closes unstable ones (atelectrauma) → biotrauma — the mechanistic basis for **low tidal\n  volume (≈6 mL/kg PBW)**.\n- **Driving pressure** (Vt/Crs) approximates strain per unit of aerated lung rather than raw Vt or plateau\n  pressure alone, which is why it tracks mortality independent of Vt.\n- **Prone positioning** improves V/Q matching and offloads dependent (dorsal) atelectasis via the\n  gravitational gradient; **PEEP** recruits collapsed alveoli but must be balanced against overdistension.\n\n## Diagnosis / definition\n- [ ] **Berlin definition** applied — onset within 1 week of insult, bilateral opacities not fully\n  explained by effusion/collapse/nodules, respiratory failure not fully explained by cardiac\n  failure/fluid overload *(verify criteria)*\n- [ ] Severity graded by **PaO₂/FiO₂ on PEEP ≥5**: **mild 200–300**, **moderate 100–200**, **severe <100**\n  *(verify cutoffs)*\n- [ ] Consider **pseudo-ARDS/rapidly-improving ARDS** as a differential before committing to severe-ARDS\n  therapies — a patient who improves substantially within the first ~12–24 h of optimized ventilation may\n  not have true ARDS *(verify)*\n\n## Key labs & workup\n- [ ] **ABG** — calculate **PaO₂/FiO₂ ratio** on a defined PEEP (≥5) to stage severity *(verify PEEP at\n  time of sampling is documented, not just the ratio)*\n- [ ] **Chest imaging** (CXR or CT) — bilateral opacities consistent with Berlin criteria, not fully\n  explained by effusion/lobar or lung collapse/nodules *(verify)*\n- [ ] **Echocardiogram** (or clinical judgment) to help exclude cardiogenic pulmonary edema/hydrostatic\n  cause as the primary driver *(verify — required to satisfy Berlin's \"not fully explained by cardiac\n  failure\" clause)*\n- [ ] **BNP/NT-proBNP** considered as an adjunct (not a replacement for echo) when cardiogenic component\n  is uncertain *(verify utility/threshold — limited specificity in critical illness)*\n\n## Management\n\n## Lung-protective ventilation — apply to ALL ARDS\n- [ ] **Tidal volume 4–8 mL/kg predicted body weight** — start ~**6 mL/kg**, titrate up only for side\n  effects *(strong rec — verify PBW calculation)*\n- [ ] **Plateau pressure < 30 cmH₂O** *(strong rec — verify measurement technique, end-inspiratory hold)*\n- [ ] **Higher PEEP strategy** for moderate–severe ARDS (PaO₂/FiO₂ <200) — per PEEP/FiO₂ table *(conditional\n  rec — verify table used)*\n- [ ] **Avoid high-frequency oscillatory ventilation (HFOV)** for routine use — strong rec against\n  (associated with harm)\n\n## Severe ARDS adjuncts\n- [ ] **Prone positioning ≥12 h/day** for severe ARDS (PaO₂/FiO₂ <150) *(strong rec — verify institutional\n  protocol/expertise before initiating)*\n- [ ] **Recruitment maneuvers** — conditional rec; avoid in hypovolemia/shock *(verify technique — sustained\n  high pressure vs stepwise PEEP)*\n- [ ] **Neuromuscular blockade** — consider short early course in severe ARDS with ventilator dyssynchrony\n  refractory to sedation *(evidence mixed post-ROSE trial — verify current local practice)*\n- [ ] **ECMO referral** for refractory severe hypoxemia despite optimized conventional strategy — refer\n  early to an ECMO center *(no formal for/against recommendation in this guideline — verify institutional\n  threshold)*\n\n## Supportive care bundle\n- [ ] **Conservative fluid strategy** once shock resolved (net-even/negative balance) *(verify targets)*\n- [ ] Sedation minimization / daily interruption paired with SBT screening\n- [ ] VTE prophylaxis · stress-ulcer prophylaxis unless contraindicated\n- [ ] Early enteral nutrition when feasible\n- [ ] Identify and treat the underlying precipitant (sepsis, aspiration, pancreatitis, transfusion, etc.)\n\n## Pearls & pitfalls\n- Distinguish rapidly-improving ARDS (\"pseudoARDS\") from true ARDS before proning — a patient who\n  improves substantially within the first ~12–24 h of optimized ventilation may not need proning\n  *(verify — EMCrit IBCC)*\n- In obesity, higher PEEP is often \"spent\" overcoming abdominal/chest-wall load rather than recruiting\n  lung — accept higher plateau pressures if driving pressure stays reasonable, since transpulmonary\n  pressure (not airway pressure alone) is what determines safety *(verify threshold — EMCrit IBCC)*\n- Driving pressure correlates with mortality but no RCT proves that intentionally targeting a lower\n  driving pressure improves outcomes — treat it as a safety marker to keep in view (commonly <15 cmH₂O),\n  not a primary ventilator-adjustment target *(verify — EMCrit IBCC)*\n- Refer potential ECMO candidates to a regional ECMO center early, not once in extremis — inclusion\n  criteria and circuit availability vary and can change quickly *(EMCrit IBCC)*\n- If proning, ensure the patient is deeply sedated or paralyzed to reduce the risk of endotracheal tube\n  dislodgement during the turn *(EMCrit IBCC)*\n- Avoid reflexive/prolonged neuromuscular blockade — reserve it for ventilator dyssynchrony refractory to\n  sedation rather than using it by default in all severe ARDS *(evidence mixed post-ROSE trial — verify\n  current local practice — EMCrit IBCC)*\n- Routine recruitment maneuvers have not been shown to improve outcomes in unselected ARDS (ART trial) —\n  the evidence base has shifted toward PEEP-table optimization rather than active recruitment as\n  first-line strategy *(verify current local practice — EMCrit IBCC)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nPlateau pressure recorded (not just peak)? · PEEP/FiO₂ table used and cited? · prone positioning\nduration ≥12h documented? · fluid balance strategy stated post-shock? · ECMO referral considered/declined\nwith reasoning for refractory hypoxemia? · precipitating cause identified?\n\n*Sources: [ATS/ESICM/SCCM 2017 ARDS mechanical ventilation guideline — AJRCCM](https://www.atsjournals.org/doi/full/10.1164/rccm.201703-0548ST) · [Summary for Clinicians — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC5566274/) · [EMCrit IBCC — ARDS chapter](https://emcrit.org/ibcc/ards/)*\n"}, {"file": "aspiration-pneumonitis-pneumonia-general-2024.md", "title": "Aspiration pneumonitis / aspiration pneumonia", "system": "Respiratory", "body": "# Aspiration pneumonitis / aspiration pneumonia — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **No single dedicated society bundle guideline was identified for aspiration pneumonitis/pneumonia** —\n> this checklist is compiled as **general standard-of-care**, drawn from NCBI Bookshelf (StatPearls)\n> reviews and the relevant statement on anaerobic coverage in the 2019 ATS/IDSA CAP guideline. **Confirm\n> against local protocol.**\n> **Sources:** Aspiration Pneumonia, StatPearls (NCBI Bookshelf), updated periodically —\n> https://www.ncbi.nlm.nih.gov/books/NBK470459/ ; Diagnosis and Treatment of Adults with\n> Community-acquired Pneumonia (ATS/IDSA), *AJRCCM* 2019.\n> **Compiled:** 06-Sep-2026 · Claude Code · no fixed guideline year (general standard-of-care)\n\n## Why — physiology / first principles\n- **Aspiration pneumonitis** = chemical injury from acidic gastric contents → direct epithelial injury,\n  surfactant destruction, and an inflammatory cascade producing an ARDS-like picture that typically peaks\n  within 24–48 h and, if sterile, can resolve without antibiotics.\n- **Aspiration pneumonia** = bacterial infection from oropharyngeal flora seeded into dependent lung segments\n  (posterior/superior lower lobes, worse in the recumbent/supine position) → true infection needing\n  antibiotics.\n- Distinguishing which mechanism dominates (chemical vs. bacterial) is the physiologic basis for why\n  witnessed aspiration alone does not automatically warrant antibiotics.\n\n## Diagnosis / definition\n- [ ] **Aspiration pneumonitis** = chemical injury from aspirated gastric contents — largely\n  **noninfectious**, managed supportively; symptoms/infiltrate typically appear **within hours** of the\n  event; reassess at ~48 h for secondary infection\n- [ ] **Aspiration pneumonia** = infectious process in a patient with dysphagia/risk factors — symptoms\n  typically develop **over days**, not hours; treat as pneumonia (community- or hospital-acquired\n  pattern per setting)\n- [ ] **Classic dependent-segment location** supports the diagnosis on imaging: **posterior segments of\n  the upper lobes / superior segments of the lower lobes** if aspiration occurred **supine**; **basal\n  segments of the lower lobes** if aspiration occurred **upright/semi-recumbent** *(verify — right side\n  more common than left given bronchial anatomy)*\n\n## Key labs & workup\n- [ ] **CXR** — look for infiltrate in the dependent segment(s) above; may lag clinically in early\n  pneumonitis *(verify timing)*\n- [ ] **Sputum and blood cultures** if aspiration **pneumonia** (infectious process) suspected — low\n  yield and not required to diagnose pneumonitis\n- [ ] **No lab reliably distinguishes pneumonitis from early pneumonia acutely** — the distinction is\n  largely clinical/temporal (see Diagnosis above); do not let a normal or elevated WBC/CRP alone drive\n  the antibiotic decision *(verify)*\n- [ ] **Bronchoscopy** considered if large-particulate/foreign-body aspiration or airway obstruction\n  suspected *(verify indication)*\n\n## Management\n\n## Immediate management (witnessed/suspected aspiration event)\n- [ ] Positioning to limit further aspiration — lateral positioning, oropharyngeal suction *(verify\n  local protocol)*\n- [ ] Supplemental oxygen targeting **94–98% SpO₂** *(verify)*\n- [ ] **Do not give prophylactic antibiotics** for a witnessed aspiration event without evidence of\n  infection — pneumonitis is chemical, not infectious *(verify against local practice)*\n\n## Antibiotic therapy — aspiration pneumonia only\n- [ ] **Anaerobic coverage NOT routinely required** — outdated practice; cover per standard\n  CAP/HAP pathogens for the care setting *(verify per current local CAP/HAP protocol)*\n- [ ] Reserve **added anaerobic coverage** for classic aspiration pleuropulmonary syndrome (witnessed\n  loss of consciousness + gingival disease/esophageal motility disorder) *(verify)*\n- [ ] Regimen chosen per severity and community- vs hospital-acquired setting *(agents — verify local\n  antibiogram)*\n- [ ] **Duration ≥5 days**, longer if abscess/empyema develops *(verify)*\n\n## Adjunctive / supportive care\n- [ ] **No routine corticosteroids** — unproven benefit in either pneumonitis or pneumonia *(verify)*\n- [ ] **Swallowing evaluation** (bedside screen → formal SLP assessment) before resuming oral intake\n- [ ] Aspiration precautions: **HOB elevation** *(angle — verify, commonly ≥30–45°)*, diet-texture\n  modification, oral hygiene/toothbrushing\n- [ ] Nutrition: **enteral feeding** if NPO >3 days or <50% of nutritional needs met for >10 days\n  *(verify)*\n- [ ] Interprofessional input — SLP, dietitian, nursing, pharmacy\n\n## Pearls & pitfalls\n- **Radiographic trajectory helps retrospectively**: an infiltrate that improves within a few days\n  favors chemical **pneumonitis**; one that is slow to resolve or worsens over 1–2 days points toward\n  superimposed bacterial **pneumonia** (IBCC — EMCrit, Aspiration Pneumonia chapter) *(verify)*\n- **Don't start antibiotics reflexively at the time of a witnessed aspiration event** — reserve them for\n  clinical deterioration over the following 1–2 days, when superimposed pneumonia becomes likely (IBCC —\n  EMCrit) *(verify)*\n- **Avoid bronchoscopic lavage in pure aspiration pneumonitis** — irrigation can push aspirated material\n  deeper into the lung and worsen chemical injury; reserve bronchoscopy for suspected large-airway\n  obstruction from particulate matter (IBCC — EMCrit)\n- **Procalcitonin does not reliably distinguish sterile aspiration pneumonitis from bacterial\n  pneumonia** — don't let a rising PCT alone drive the antibiotic decision (IBCC — EMCrit) *(verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nPneumonitis vs pneumonia explicitly distinguished in the note? · unnecessary prophylactic antibiotics\navoided for a witnessed event without infection evidence? · anaerobic coverage justified only for\nclassic aspiration syndrome, not by default? · swallow evaluation ordered before oral intake resumed? ·\nHOB elevation + oral care documented as precautions?\n\n*Sources: [Aspiration Pneumonia — StatPearls, NCBI Bookshelf](https://www.ncbi.nlm.nih.gov/books/NBK470459/) · [Aspiration Pneumonia (Nursing) — StatPearls](https://www.ncbi.nlm.nih.gov/books/NBK568770/) · [Aspiration syndromes: aspiration pneumonia and pneumonitis — PubMed](https://pubmed.ncbi.nlm.nih.gov/20469622/) · [ATS/IDSA 2019 CAP guideline — AJRCCM](https://www.atsjournals.org/doi/10.1164/rccm.201908-1581ST) · [IBCC — EMCrit, Aspiration Pneumonia chapter](https://emcrit.org/ibcc/aspiration/)*\n"}, {"file": "bradyarrhythmia-chb-acchrs-2018.md", "title": "Bradyarrhythmia / complete heart block", "system": "Cardiac", "body": "# Bradyarrhythmia / complete heart block — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2018 ACC/AHA/HRS Guideline on the Evaluation and Management of Patients With Bradycardia\n> and Cardiac Conduction Delay (Kusumoto FM et al., ACC/AHA Task Force on Clinical Practice Guidelines\n> + Heart Rhythm Society), *Circulation* 2019;140:e382–e482 / *J Am Coll Cardiol* 2019;74(7):e51–e156.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000000628 — acute drug/pacing steps cross-referenced\n> against the AHA ACLS Adult Bradycardia Algorithm (cpr.heart.org).\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2018 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- CO = HR × SV — below a patient-specific HR floor, SV cannot compensate enough and CO falls, producing\n  hypoperfusion symptoms; this is why symptomatic/hemodynamically-significant bradycardia, not the number\n  alone, is the treatment trigger.\n- Complete heart block = AV dissociation, with a subsidiary escape rhythm (junctional or ventricular)\n  taking over — the lower/more distal the escape focus, the slower and less reliable it is, and the\n  higher the risk of asystole.\n- Atropine works by blocking vagal (parasympathetic) tone at the SA/AV node — it fails in infranodal\n  (His-Purkinje) block because that tissue isn't vagally innervated, which is why atropine-refractory\n  block goes straight to pacing, not repeat dosing.\n- Pacing (transcutaneous → transvenous) bypasses the diseased conduction tissue entirely by directly\n  depolarizing distal myocardium — restoring rate-dependent CO regardless of the underlying lesion.\n\n## Diagnosis / definition\n- [ ] **Sinus bradycardia** — sinus rate **<50 bpm (verify)**; ectopic atrial bradycardia = non-sinus\n  atrial pacemaker at **<50 bpm (verify)**\n- [ ] **Sinus pause** — sinus node fails to depolarize for **>3 s (verify)** after last atrial beat;\n  **sinus arrest** = no sinus depolarization at all\n- [ ] **Chronotropic incompetence** — failure to reach **80% of expected HR reserve (verify)** on\n  exertion (max predicted HR = 220 − age)\n- [ ] **Tachy-brady syndrome** — sinus brady/pause alternating with AT/AFl/AF\n- [ ] **1st-degree AV block** — 1:1 conduction, PR **>200 ms (verify)** (guideline notes this is really\n  \"AV delay\" — no P wave blocked)\n- [ ] **2nd-degree, Mobitz I (Wenckebach)** — constant atrial rate (**<100 bpm (verify)**), periodic\n  single non-conducted P, **inconstant PR** around the dropped beat\n- [ ] **2nd-degree, Mobitz II** — constant atrial rate, periodic single non-conducted P, **constant PR**\n  around the dropped beat\n- [ ] **2:1 AV block** — its own category: every other P conducts, so Mobitz I vs II cannot be told apart\n  from a single 2:1 strip\n- [ ] **Advanced / high-grade AV block** — **≥2 consecutive (verify)** non-conducted P waves at a constant\n  physiologic rate, but *some* conduction still present (distinguishes from complete block)\n- [ ] **3rd-degree / complete heart block** — **no** AV conduction at all\n- [ ] **Site-of-block clue** — AV-nodal more likely with Mobitz I + narrow QRS, or marked 1st-degree\n  (PR **>0.30 s (verify)**) + narrow QRS; **infranodal** block is less atropine-responsive, more malignant\n- [ ] **No universal \"symptomatic bradycardia\" rate/pause cutoff** — for SND and Mobitz I, pacing is driven\n  by **symptom–bradycardia temporal correlation**, not a threshold *(verify)*\n- [ ] **PPM by block type (not-reversible):** Mobitz II / high-grade / complete AV block → pace **regardless\n  of symptoms (Class I — verify)**; symptomatic Mobitz I or marked 1st-degree → **Class IIa (verify)**;\n  Lamin A/C or neuromuscular disease with PR >240 ms / QRS >120 ms / fascicular block → **Class IIa–IIb\n  (verify)**; asymptomatic physiologic/sleep-related bradycardia → pacing is **Class III: Harm (verify)**\n\n## Key labs & workup\n- [ ] Workup is **targeted, not a routine panel** — guideline directs \"directed blood testing\"\n  (**Class IIa (verify)**) at suspected specific etiologies; no proven value to broad screening labs\n- [ ] **Electrolytes (esp. K+), acid-base** — hyper/hypokalaemia and acidosis are reversible causes;\n  correction is part of the Class I \"treat reversible causes\" step\n- [ ] **TSH / thyroid** — when hypothyroidism suspected as the cause *(verify COR/LOE)*\n- [ ] **Digoxin level / toxicity** — digoxin immune Fab **Class IIa (verify)** for symptomatic/unstable\n  digoxin-toxic bradycardia (~0.5 mg bound per vial *(verify)*)\n- [ ] **Lyme serology** — young patient / endemic-area new AV block (Lyme carditis) *(verify)*\n- [ ] **Troponin / ischaemia** — acute MI as cause; aminophylline **Class IIb (verify)** (250 mg IV bolus\n  *(verify)*) for AV block complicating acute inferior MI\n- [ ] **Sleep apnea screening — Class I, B-NR (verify)** when brady/conduction disorder occurs in sleep\n  (screen + confirmatory testing); **Class IIa (verify)** if PPM planned; nocturnal bradycardia alone is\n  **not** a pacing indication\n- [ ] **Echocardiography (TTE) — Class I, B-NR (verify)** for newly identified LBBB, Mobitz II, high-grade,\n  or 3rd-degree AV block; **Class IIa** if structural disease otherwise suspected; advanced imaging\n  (TEE/CT/MRI/nuclear) **Class IIa, C-LD (verify)** if structural disease suspected but unconfirmed —\n  cardiac MRI / FDG-PET for sarcoid/amyloid; routine imaging **not** indicated in asymptomatic sinus\n  bradycardia or 1st-degree block without structural-disease signs (**Class III (verify)**)\n- [ ] **Genetic evaluation** — relevant for SCN5A / Lamin A/C-associated conduction disease (changes the\n  pacing threshold for marked 1st-degree block) *(verify — no discrete standalone recommendation)*\n- [ ] Also consider on the reversible-cause checklist: hypoglycaemia, hypoxaemia/hypercarbia, hypothermia,\n  and infections beyond Lyme (Legionella, typhoid, malaria, leptospirosis, Guillain-Barré)\n\n## First: is this patient unstable, and what block is it?\n- [ ] **Assess for instability driving urgency** — hypotension, altered mental status, signs of shock,\n      ischemic chest pain/ECG changes, acute heart-failure signs — symptomatic bradycardia mandates\n      immediate treatment regardless of rate\n- [ ] **Classify the block on the 12-lead/telemetry** — Mobitz I (Wenckebach) vs Mobitz II vs\n      complete/3rd-degree AV block — type changes both urgency and permanent-pacemaker indication\n- [ ] **Continuous telemetry** for the duration of the acute episode and while any reversible cause is\n      being corrected\n- [ ] Mobitz II, high-grade AV block, and 3rd-degree/complete block **not due to a reversible cause** →\n      permanent pacing indicated **regardless of symptoms** *(verify against current recommendation\n      class)*; Mobitz I is usually lower urgency unless symptomatic\n\n## Identify and correct reversible causes (before committing to permanent pacing when possible)\n- [ ] **Acute MI, especially inferior** (AV-nodal ischemia) — ECG + troponin\n- [ ] **Hyperkalemia** — stat electrolytes; treat per hyperkalemia protocol if present\n- [ ] **Drug toxicity** — beta-blocker, calcium-channel blocker, digoxin (levels if suspected); review\n      MAR for recent doses/overdose\n- [ ] **Hypothyroidism** — TSH if suspected\n- [ ] **Lyme carditis** — Lyme titers in young patients / endemic-area exposure with new AV block\n- [ ] **Increased vagal tone** — situational (pain, vomiting, suctioning, straining)\n- [ ] **Post-cardiac-surgery** conduction injury (recent valve/CABG — often transient, may need\n      temporary epicardial wires already in place)\n- [ ] **Infiltrative disease** — sarcoidosis, amyloidosis (consider if unexplained/progressive)\n\n## Acute pharmacologic therapy (symptomatic bradycardia)\n- [ ] **Atropine** first-line — **1 mg IV, verify** q3–5min, max **3 mg — verify** *(dose per current\n      ACLS; confirm against local protocol)*\n- [ ] **Limited/unreliable efficacy** in high-grade AV block (Mobitz II, complete/3rd-degree, wide-complex\n      escape) and in the **transplanted (denervated) heart** — do not delay pacing awaiting response\n- [ ] If atropine fails or is inappropriate → **second-line infusion**: dopamine **2–10 mcg/kg/min —\n      verify** or epinephrine **2–10 mcg/min — verify**, titrated to response, as a temporizing bridge\n      while pacing is arranged\n\n## Transcutaneous pacing (bridge)\n- [ ] Apply pads promptly for symptomatic high-grade block unresponsive to atropine — do not wait for\n      drug titration to fail completely if instability is significant\n- [ ] **Analgesia/sedation** before/during capture — transcutaneous pacing is painful\n- [ ] Confirm **mechanical capture** (palpable pulse/arterial waveform matching paced rate), not just\n      electrical spikes\n- [ ] Treat as a **bridge only** — proceed to transvenous pacing if ongoing pacing need anticipated\n\n## Transvenous pacing\n- [ ] Indicated for **hemodynamically significant bradycardia refractory to atropine/second-line drugs**,\n      or as definitive bridge when transcutaneous capture is unreliable/poorly tolerated\n- [ ] Insert under continuous ECG/hemodynamic monitoring; confirm capture and stable threshold; secure\n      and document threshold, sensing, rate settings\n- [ ] Reassess need daily; do not leave in longer than necessary (infection/perforation risk)\n\n## Disposition and permanent pacing pathway\n- [ ] **Cardiology/EP consultation** for any high-grade or complete AV block, or if temporary pacing is\n      required, to evaluate for **permanent pacemaker**\n- [ ] Document whether the cause is **reversible** (treat first) vs **irreversible/structural**\n      (proceed toward PPM per guideline-directed indications)\n- [ ] If reversible cause corrected and block resolves, document resolution and ongoing monitoring plan\n      before deferring PPM\n- [ ] Document block type, symptom correlation, and reversible-cause workup clearly — these drive the\n      PPM indication class\n\n## Pearls & pitfalls\n- A **normal BP can mask** bradycardic shock — an endogenous sympathetic response causes vasoconstriction,\n  so don't be reassured by pressure alone (EMCrit IBCC)\n- Atropine is a **limited tool** — only ~25% *(verify)* show a complete response, and it fails in\n  high-grade/infranodal AV block (and is contraindicated post-transplant); give it while *simultaneously*\n  prepping epinephrine and transcutaneous pacing rather than waiting to see if it works (EMCrit IBCC)\n- **Mobitz II can paradoxically worsen with atropine/sympathomimetics** — speeding the atrial rate drives\n  more P waves into a diseased infranodal system; low-dose atropine can itself cause paradoxical\n  bradycardia via M1 effects (EMCrit IBCC)\n- **Transcutaneous \"pseudo-capture\" is a real trap** — the monitor can show a paced rhythm while the\n  myocardium isn't contracting; confirm true mechanical capture with a pulse-ox waveform, bedside echo,\n  or a palpable pulse, never the ECG trace alone (EMCrit IBCC)\n- Start pacing and chronotropic drugs **in parallel, not sequentially**; hunt reversible causes with the\n  \"Drugs, Ischemia, Electrolytes\" (D.I.E.) mnemonic; avoid RSI/positive-pressure ventilation where possible\n  (sedatives + PPV further depress a marginal bradycardic circulation); arrange transvenous pacing early\n  rather than late (First10EM)\n- Categorize the strip **regular/irregular and narrow/wide-complex** before chasing a differential, and\n  remember non-cardiac culprits: hypoxia, hypothermia, electrolytes, raised ICP (Cushing response), Lyme,\n  diphtheria (LITFL)\n- On a paced patient, **absence of pacing spikes does not by itself mean pacer failure** — native\n  conduction may be taking over (fusion/capture beats are expected); magnet-mode asynchronous pacing\n  carries a small risk of pacemaker-mediated VT (LITFL)\n\n## Commonly-missed on documentation (what the gap-check flags)\nBlock type (Mobitz I/II/complete) documented? · instability/symptoms explicitly linked to bradycardia? ·\nreversible-cause workup (K+, TSH, drug levels, troponin, Lyme if applicable) charted? · atropine response\n(or noted unreliable in high-grade block) · pacing modality + capture confirmation + analgesia for\ntranscutaneous · EP/cardiology consult for PPM evaluation · telemetry continuity documented\n\n*Sources: [2018 ACC/AHA/HRS Guideline on Bradycardia and Cardiac Conduction Delay — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000000628) · [Executive Summary — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000000627) · [AHA Adult Bradycardia Algorithm — cpr.heart.org](https://cpr.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/2025-Algorithms/Algorithm-ACLS-Bradycardia-250514.pdf) · [ACC Guidelines Made Simple 2018 — Bradycardia (companion tables/algorithms)](https://www.acc.org/-/media/Non-Clinical/Files-PDFs-Excel-MS-Word-etc/Guidelines/2018/Guidelines_Made_Simple_2018_Bradycardia.pdf) · [EMCrit IBCC — Bradycardia](https://emcrit.org/ibcc/brady/) · [First10EM — Bradycardia](https://first10em.com/bradycardia/) · [LITFL — Bradycardia DDx](https://litfl.com/bradycardia-ddx/) · [LITFL — Pacemaker Rhythms](https://litfl.com/pacemaker-rhythms-normal-patterns/)*\n"}, {"file": "cardiac-tamponade-esc-2025.md", "title": "Cardiac tamponade", "system": "Cardiac", "body": "# Cardiac tamponade — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2025 ESC Guidelines for the management of myocarditis and pericarditis, European Society\n> of Cardiology (ESC), *European Heart Journal* 2025 (supersedes the tamponade content of the 2015 ESC\n> Guidelines for the diagnosis and management of pericardial diseases).\n> https://academic.oup.com/eurheartj/article/46/40/3952/8234483\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Pericardial pressure rising to meet/exceed intracardiac diastolic pressure externally compresses all\n  chambers equally, impairing diastolic filling of the whole heart — not a single-chamber problem.\n- The pericardium's pressure-volume curve is steep once its limited compliance is exceeded — a **rapidly**\n  accumulating small effusion (e.g. post-cardiac-surgery, traumatic) tamponades at a far smaller volume\n  than a slowly accumulating large one, because slow accumulation lets the sac stretch and adapt.\n- Equal diastolic pressures across chambers + exaggerated ventricular interdependence (inspiration shifts\n  the septum leftward as RV filling transiently outcompetes LV filling) produce **pulsus paradoxus** —\n  an exaggerated normal physiologic finding, not a new mechanism.\n- The heart is preload-dependent in tamponade (external constraint, not pump failure) — fluid can\n  transiently support CO, but only pericardiocentesis/drainage relieves the actual constraint.\n\n## Diagnosis / definition\n- [ ] **Definition (ESC §11.8):** a pericardial syndrome in which the effusion impairs diastolic filling\n  until cardiac output falls — a **clinical diagnosis confirmed by echo**, based on history + signs\n- [ ] **Rate-dependent, not volume-dependent** — rapid accumulation (haemopericardium) can tamponade at\n  **200–300 mL (verify)**; slow accumulation may reach **1–2 L (verify)** before tamponade (\"last-drop\n  phenomenon\")\n- [ ] **Beck's triad** (hypotension, raised JVP, muffled heart sounds) — classic in acute *surgical*\n  tamponade; often **absent** in slow *medical* tamponade\n- [ ] **Pulsus paradoxus** — inspiratory fall in systolic BP **≥10 mmHg (verify)**\n- [ ] **Pericardiocentesis triage score (ESC Fig 12):** immediate pericardiocentesis considered if\n  **≥6 points (verify)** drawn from **≥2 of the 3 categories** *(caption says \">6 from at least two\n  categories\"; flowchart box says \"≥6\" — verify)*\n  - **Aetiology:** malignancy **+2**, TB **+2**, recent radiotherapy **+1**, recent viral infection **+1**,\n    recurrent effusion **+1**, chronic terminal renal failure **+1**, immunosuppression **+1**,\n    dysthyroidism **−1**, systemic autoimmune disease **−1** *(verify all)*\n  - **Clinical:** orthopnoea **+3**, rapid worsening **+2**, pulsus paradoxus >10 mmHg **+2**,\n    dyspnoea/tachypnoea **+1**, progressive sinus tachycardia **+1**, oliguria **+1**, hypotension\n    (SBP <95) **+0.5**, pericardial pain **+0.5**, friction rub **+0.5**, slow evolution **−1** *(verify all)*\n  - **Imaging:** circumferential large effusion **+3**, LA collapse **+2**, RV collapse **+1.5**, IVC\n    dilated/non-collapsible **+1.5**, moderate effusion **+1**, cardiomegaly (CXR) **+1**, microvoltage\n    (ECG) **+1**, RA collapse **+1**, mitral/tricuspid respiratory flow variation **+1**, swinging heart\n    **+1**, electrical alternans **+0.5**, small effusion **−1** *(verify all)*\n  - Caveat: a 2025 EHJ:ACC critique notes **aetiology is often unknown pre-drainage**, limiting the score\n    in acute care *(verify)*\n- [ ] **Echo signs — sens/spec (ESC Table 17, verify all):** RA diastolic collapse **50–100% / 33–100%**\n  (RA collapse **>0.34 of cardiac cycle** → sens **>90% / spec 100%**); RV diastolic collapse\n  **48–100% / 72–100%**; IVC plethora (dilated **>20 mm**, **<50%** respiratory reduction) **97% / 40%**;\n  respiratory variation mitral E **>25–30%** / tricuspid E **>40–60%** (guideline lists sens/spec as\n  **n.a.** for this sign — do not attach a figure); large effusion + swinging heart (sens/spec n.a.)\n- [ ] Loculated/regional effusion (post-surgery, post-trauma, post-procedural) can cause **regional\n  tamponade** despite a modest global effusion — maintain suspicion\n- [ ] **Note:** immediate \"bypass-the-score\" indications (type A dissection, free-wall rupture, trauma)\n  are **not spelled out** in the 2025 ESC tamponade section — treat as clinical convention, not\n  guideline-sourced *(verify)*\n\n## Key labs & workup\n- [ ] **Pericardial fluid — send:** cytology (mandatory for malignancy, **Class I,C — verify**),\n  bacterial/fungal/TB culture, cell count with differential, glucose; **TB PCR (Xpert MTB/RIF, RIF-Ultra)**\n  where available\n- [ ] **Fluid discriminating values (ESC, verify all)** — pericardial:serum glucose ratio + cell count:\n  purulent ratio **~0.3**, count **~2.8 ×10⁹/mL**, **~92% neutrophils**; TB ratio **~0.7**, count\n  **~1.7 ×10⁹/mL**, **~50% neutrophils**; neoplastic ratio **~0.8**, count **~3.3 ×10⁹/mL**,\n  **~55% neutrophils**. Do **not** apply Light criteria to pericardial fluid (high misclassification)\n- [ ] **TB markers (verify all):** ADA sens **90%** / spec **86%**; unstimulated IFN-γ (14–200 pg/mL) sens\n  **97%** / spec **99%** (superior to ADA/Xpert); Xpert MTB/RIF spec **100%** / sens **64%** (→ **78%**\n  on biopsy); fluid culture sens only **53–75%**, takes >3 weeks\n- [ ] **Serum panel:** troponin (may be mildly ↑ even in pure pericarditis/tamponade), NT-proBNP, CRP,\n  differential blood count; renal function for uraemic aetiology\n- [ ] **CRP before the procedure** — pericardiocentesis is believed to confound later CRP interpretation;\n  note this is general practice, **not explicitly stated in the 2025 ESC text** *(verify)*\n- [ ] **ANA in pericardial fluid** is **not** endorsed by the 2025 guideline — treat as unsourced *(verify)*\n- [ ] **Effusive-constrictive physiology:** suspect if RAP fails to fall by **≥50%** or to **<10 mmHg**\n  after adequate drainage *(verify)* — non-invasive imaging diagnosis now also accepted\n\n## Clinical recognition & bedside echo confirmation\n- [ ] Suspect with hypotension + raised JVP + muffled heart sounds (**Beck's triad**) — classic in acute *\"surgical\"* tamponade (trauma/rupture); often **absent in slow \"medical\" tamponade** — low sensitivity, do not rely on it alone\n- [ ] Check for **pulsus paradoxus** — inspiratory fall in systolic BP **≥10 mmHg** *(verify)* — reflects exaggerated ventricular interdependence\n- [ ] Other clues: tachycardia, BP <90 mmHg (more pronounced in acute vs subacute/chronic tamponade), enlarged cardiac silhouette (CXR), low-voltage/electrical alternans + \"swinging heart\" (ECG)\n- [ ] Diagnosis is a **clinical diagnosis confirmed by echo** — no single sign is sufficient; the guideline's triage tool weighs aetiology + clinical + imaging findings together rather than effusion size alone *(cumulative score ≥6 → immediate pericardiocentesis — verify scoring)*\n- [ ] Urgent bedside TTE: effusion size/circumferential vs loculated + swinging heart; **RA diastolic collapse** (sens 50–100%, spec 33–100% *(verify)*); **RV diastolic collapse** (sens 48–100%, spec 72–100% *(verify)*); **IVC plethora** — dilated >20 mm with <50% respiratory collapse (sens ~97%, spec ~40% *(verify)*); respiratory variation mitral E >25–30% / tricuspid E >40–60% *(verify)*\n- [ ] Loculated/regional effusion (post-cardiac-surgery, post-trauma, post-procedural) can cause **regional tamponade** despite a modest-looking global effusion — maintain suspicion\n\n## Hemodynamic support while awaiting drainage\n- [ ] Cautious IV fluid may transiently support preload/BP while drainage is arranged — temporizing only, not a substitute for drainage\n- [ ] **Avoid positive-pressure ventilation/intubation before drainage whenever possible** — positive intrathoracic pressure further impairs venous return and RV filling and can precipitate cardiovascular collapse; if intubation is unavoidable, drain first if feasible or proceed with full resuscitation readiness\n- [ ] **Avoid vasodilators and diuretics** — both reduce preload and can precipitate collapse\n- [ ] Treat as time-critical once tamponade is diagnosed or strongly suspected, especially in the hemodynamically unstable patient — do not defer drainage for further work-up\n\n## Urgent drainage & fluid analysis\n- [ ] Definitive therapy = **drainage without delay in unstable patients** — preferably **echo- or fluoroscopy-guided needle pericardiocentesis** by an operator experienced/certified in acute cardiovascular care *(procedural complication rate ~4–10% — verify)*\n- [ ] **Surgical drainage/pericardial window** preferred for: suspected purulent pericarditis (urgent pericardiocentesis and/or surgical window regardless of hemodynamic status), loculated/complex effusion, or active bleeding into the pericardium (e.g. post-cardiac-surgery, trauma, aortic rupture)\n- [ ] **Aortic dissection with tamponade** — pericardiocentesis is high-risk and controversial (can worsen bleeding); prioritize urgent surgical/cardiothoracic consultation over percutaneous drainage — confirm local protocol *(verify)*\n- [ ] Send pericardial fluid for: cytology (malignancy), Gram stain + bacterial/fungal/TB culture, cell count with differential, glucose (pericardial:serum ratio helps separate purulent vs TB vs neoplastic effusion) *(verify thresholds)*\n- [ ] Check **CRP before the procedure** — it rises after pericardiocentesis and will confound post-procedure interpretation\n- [ ] Consider **intrapericardial fibrinolysis** for purulent or loculated effusion to achieve complete drainage and reduce risk of constriction *(verify)*\n\n## Etiology workup, treat underlying cause, post-drainage follow-up\n- [ ] Work up etiology in parallel with drainage — leading causes: malignancy, iatrogenic/trauma (incl. post-procedural), pericarditis (viral/idiopathic), tuberculosis (esp. endemic areas); also consider uraemia, autoimmune/collagen-vascular disease, post-MI (Dressler), aortic dissection, bacterial/purulent\n- [ ] Direct therapy at the cause: systemic antineoplastic treatment for malignant effusion; anti-TB therapy; optimize dialysis for uraemic effusion; targeted antibiotics ± surgical drainage for purulent pericarditis; anti-inflammatory therapy for idiopathic/autoimmune pericarditis\n- [ ] Malignant effusion: **extended pericardial drainage (~3–6 days)** reduces recurrence *(verify)*; consider intrapericardial therapy in refractory/recurrent cases\n- [ ] Post-drainage, watch for **effusive-constrictive physiology** — suspect if right atrial pressure fails to fall by ≥50% or to <10 mmHg despite adequate drainage *(verify)* — needs further management (medical therapy vs surgery)\n- [ ] Admit and monitor after any confirmed tamponade — it is a marker of high complication risk and non-viral aetiology; follow with serial echo per clinical trajectory and watch for recurrence\n\n## Pearls & pitfalls\n- The **effusion-size paradox**: rapid development of a small effusion can tamponade, while a gradual\n  large effusion may not — a ~50 mL haemorrhagic effusion can tamponade acutely because the pericardium\n  hasn't had time to stretch (EMCrit IBCC)\n- **RV diastolic collapse is the hallmark echo finding** — distinguish true diastolic collapse from\n  normal systolic collapse by reviewing the loop in slow motion and confirming it's timed to mitral-valve\n  opening (EMCrit IBCC)\n- **Low-pressure tamponade** occurs with rapid haemorrhagic accumulation, or a chronic effusion plus an\n  acute volume-loss event (dehydration, bleeding) that unmasks tamponade physiology at lower-than-usual\n  pressures (EMCrit IBCC)\n- **Post-CABG tamponade** is often a focal/localized clot compressing one chamber that \"may be impossible\n  to see\" on some echo views — keep suspicion high despite a reassuring-looking TTE (EMCrit IBCC)\n- **Don't over-resuscitate with fluid** — excessive volume can over-distend the RV and secondarily\n  compress the LV, worsening output; fluid is a weak bridge, not a fix (EMCrit IBCC)\n- In arrest thought due to tamponade, draining the pericardium \"should probably be prioritized ahead of\n  chest compressions\"; never delay drainage in a deteriorating patient to finish a complete echo (EMCrit IBCC)\n- **Drain slowly / staged** — rapid removal of pericardial fluid can precipitate acute pulmonary oedema\n  from a surge in LV preload and risks acute ventricular dilatation; use a cannula + 3-way tap (LITFL)\n- Bedside checks to confirm you're not in the ventricle: **pericardial blood doesn't clot** (intracardiac\n  blood does), or attach a V-lead ECG to the needle — ST elevation / ventricular ectopy signals myocardial\n  contact (LITFL)\n\n## Commonly-missed on documentation (what the gap-check flags)\nBeck's triad absent noted (esp. medical/slow tamponade)? · pulsus paradoxus checked and documented? · echo signs beyond effusion size (RA/RV collapse, IVC plethora, inflow variation) recorded? · PPV/intubation avoided pre-drainage? · vasodilators/diuretics avoided? · aortic dissection considered/excluded before pericardiocentesis? · fluid sent for cytology/cultures/glucose ratio? · CRP drawn before tap? · etiology work-up initiated? · effusive-constrictive physiology screened post-drainage?\n\n*Sources: [2025 ESC Guidelines for the management of myocarditis and pericarditis — European Society of Cardiology (ESC), European Heart Journal](https://academic.oup.com/eurheartj/article/46/40/3952/8234483) · [ESC Guidelines webpage](https://www.escardio.org/guidelines/clinical-practice-guidelines/all-esc-practice-guidelines/myocarditis-and-pericarditis/) · [2015 ESC Guidelines for the diagnosis and management of pericardial diseases (prior edition, for reference)](https://academic.oup.com/eurheartj/article/36/42/2921/2293375) · [EMCrit IBCC — Pericardial tamponade](https://emcrit.org/ibcc/tamponade/) · [LITFL — Pericardiocentesis](https://litfl.com/pericardiocentesis/)*\n"}, {"file": "cardiogenic-shock-scai-2022.md", "title": "Cardiogenic shock", "system": "Cardiac", "body": "# Cardiogenic shock — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2025 Concise Clinical Guidance: An ACC Expert Consensus Statement on the Evaluation and\n> Management of Cardiogenic Shock (Sinha SS et al., American College of Cardiology Solution Set\n> Oversight Committee), *JACC* 2025 — https://www.jacc.org/doi/10.1016/j.jacc.2025.02.018\n> **Staging framework:** SCAI SHOCK Stage Classification Expert Consensus Update 2022 (endorsed\n> ACC/ACEP/AHA/ESC-ACVC/ISHLT/SCCM/STS) — https://www.jacc.org/doi/10.1016/j.jacc.2022.01.018\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (staging: 2022)\n\n## Why — physiology / first principles\n- Primary pump failure drops CO → compensatory tachycardia/vasoconstriction (SNS, RAAS) preserves BP\n  initially but raises afterload and MVO2 — worsening the ischemia/dysfunction that caused the shock in\n  the first place (a self-reinforcing \"shock spiral\").\n- Falling CO + rising SVR → end-organ hypoperfusion (lactate rise, renal/hepatic injury), while backward\n  failure raises filling pressures → congestion — most cardiogenic shock is mixed hypoperfusion +\n  congestion, which is why the SCAI stages track a hemodynamic **trajectory**, not a fixed snapshot.\n- Inotropes/vasopressors buy time by augmenting contractility or perfusion pressure but increase MVO2;\n  mechanical circulatory support (IABP, Impella, ECMO) unloads the ventricle and/or supports CO without\n  that myocardial oxygen cost — the physiologic rationale for early MCS escalation when inotropes stall.\n\n## Diagnosis / definition\n- [ ] **Hemodynamic concept of CS (SCAI 2022):** low cardiac output / low cardiac power output **+**\n  high filling pressures **+** increased O₂ extraction (low mixed/central venous O₂ sat), despite\n  adequate volume — not a single number\n- [ ] **Classic invasive thresholds for *classic* CS (Stage C):** cardiac index **<2.2 L/min/m² (verify)**,\n  PCWP **>15 mmHg (verify)**; normal-range anchors (Stage A): CI **≥2.5 L/min/m² (verify)**, CVP\n  **≤10 mmHg (verify)**, PCWP **≤15 mmHg (verify)**, PA sat **≥65% (verify)**\n- [ ] **SCAI SHOCK Stage A — At risk:** no CS now; normal JVP, warm, well-perfused, normal mentation;\n  normal lactate; SBP **≥100 mmHg** or at baseline **(verify)**\n- [ ] **Stage B — Beginning:** hemodynamic instability *without* hypoperfusion — SBP **<90**, MAP\n  **<60**, or **>30 mmHg** drop from baseline **(verify)**, and/or HR **≥100 (verify)**; elevated JVP;\n  normal lactate\n- [ ] **Stage C — Classic:** hypoperfusion needing ≥1 intervention **beyond volume** — cold/clammy,\n  mottled, altered mentation, urine output **<30 mL/h (verify)**; **lactate ≥2 mmol/L (verify)**;\n  creatinine ↑ **1.5× baseline** or GFR drop **>50% (verify)**\n- [ ] **Stage D — Deteriorating:** Stage C failing to stabilize on initial support — needs escalating\n  pressor dose or an added vasoactive/MCS device; **lactate rising and persistently >2 mmol/L (verify)**\n- [ ] **Stage E — Extremis:** actual/impending collapse — near-pulseless, refractory to maximal\n  support; **lactate ≥8 mmol/L (verify)**; severe acidosis pH **<7.2**, base deficit **>10 mEq/L (verify)**\n- [ ] **Cardiac-arrest \"A\" modifier (refined 2022):** apply only if post-arrest patient **fails to\n  follow verbal command AND/OR GCS <9 (verify)** (anoxic-injury concern) — brief VF with good neuro\n  recovery does **not** trigger it\n- [ ] **Re-stage on trajectory**, not only at presentation — if a patient needs vasoactive therapy to\n  reverse hypoperfusion they are Stage C (not B) *(verify against source)*\n\n## Key labs & workup\n- [ ] **Lactate = central staging biomarker** — normal (A/B) → **≥2 mmol/L** hypoperfusion cutoff (C)\n  → rising/persistently **>2** (D) → **≥8 mmol/L** (E) *(verify)*; may be dissociated from hemodynamics\n  in chronic HF, and exclude non-shock causes (mesenteric ischaemia, etc.) before attributing\n- [ ] **Creatinine / GFR** — **1.5× baseline** rise or **>50%** GFR drop marks Stage C, worsening at D\n  *(verify)*\n- [ ] **LFTs** — elevated at C, worsening at D (hepatic congestion/hypoperfusion)\n- [ ] **BNP / natriuretic peptide** — congestion marker, elevated from Stage B onward (not a core\n  severity marker)\n- [ ] **Arterial pH / base deficit** — formally enter at Stage E (pH **<7.2**, base deficit\n  **>10 mEq/L (verify)**); full **arterial/venous blood gas** at baseline\n- [ ] Baseline panel: **CBC, CMP, troponin, natriuretic peptide, lactate, ABG/VBG**\n- [ ] **Invasive hemodynamics (PA catheter)** to phenotype and guide MCS: CI, PCWP, CVP, PA sat; RV-failure\n  adjuncts **PAPi** (pulmonary artery pulsatility index) and **RA:PCWP ratio** — specific cutoffs\n  *(verify — not stated in accessible source)*; **cardiac power output** named as a severity marker\n  (threshold *(verify)*)\n- [ ] Imaging: **12-lead ECG, CXR, TTE / POCUS** — EF, RV function, valvulopathy, effusion/tamponade,\n  mechanical complication\n\n## Recognition & staging (first hour)\n- [ ] Screen with congestion + hypoperfusion signs — **\"SUSPECT CS\"** pattern: pulm. edema/JVD/edema\n  + cool extremities, altered mentation, oliguria, rising lactate *(verify exact mnemonic criteria)*\n- [ ] Assign **SCAI SHOCK stage A–E** and re-stage on trajectory, not just at presentation:\n  **A** at risk (no current CS) · **B** beginning (relative hypotension/tachycardia, no hypoperfusion)\n  · **C** classic (hypoperfusion needing intervention beyond volume) · **D** deteriorating (despite\n  initial support) · **E** extremis (refractory/arrest) *(verify exact stage criteria against source)*\n- [ ] Baseline labs: **CBC, CMP, troponin, natriuretic peptide, lactate, arterial/venous blood gas**\n- [ ] Baseline imaging: **12-lead ECG, CXR, TTE and/or point-of-care ultrasound** — assess EF, RV\n  function, valvulopathy, effusion/tamponade, mechanical complication\n- [ ] Consider **invasive hemodynamic monitoring (pulmonary artery catheter)** early for diagnosis\n  *and* to guide management/de-escalation — not reserved for refractory cases only *(verify local threshold for placement)*\n\n## Etiology workup & revascularization\n- [ ] Determine **ischemic vs non-ischemic** etiology promptly (ECG + troponin trend + echo ± angiography)\n- [ ] If **AMI-CS**: urgent **coronary angiography with revascularization** (PCI/CABG) — verify\n  door-to-intervention timing against local STEMI/NSTEMI pathway\n- [ ] Screen for **mechanical complications** (VSD, papillary muscle rupture, free wall rupture) and\n  **tamponade** — these change the management path entirely\n- [ ] If non-ischemic (myocarditis, decompensated HF, arrhythmia, valvular, RV failure, PE) —\n  route workup accordingly\n\n## Pharmacologic & fluid management\n- [ ] **Avoid indiscriminate fluid boluses** — most CS patients are congested, not volume-depleted;\n  reassess before each bolus with hemodynamic/exam data\n- [ ] Select **vasopressor/inotrope by hemodynamic profile** (not reflexively) — e.g. norepinephrine\n  for predominant hypotension, dobutamine/milrinone for low-output with adequate pressure —\n  agent/dose *(verify against hemodynamic profile and local protocol)*\n- [ ] Minimize **inotrope/vasopressor exposure duration** where feasible — associated with harm at\n  high dose/duration *(verify)*\n- [ ] Reassess ventilation, sedation, and acid-base status as contributors to shock physiology\n\n## Mechanical circulatory support escalation & monitoring\n- [ ] Escalate to **temporary MCS (IABP → Impella → VA-ECMO, or combinations)** when pharmacologic\n  support is inadequate or stage is worsening — device choice *(verify against hemodynamic profile,\n  RV involvement, and local shock-team protocol)*\n- [ ] Reassess **early and serially** — explicit \"reassess, reassess, reassess\" through the first\n  **6–24 hours**; document trajectory, not a single snapshot\n- [ ] Track **serial lactate and end-organ perfusion** (urine output, mentation, hepatic/renal function)\n  as response-to-therapy markers\n- [ ] Activate **multidisciplinary cardiogenic shock team** early (interventional cardiology,\n  cardiac surgery, advanced HF/MCS, critical care) — community centers: identify a **shock\n  champion** and set **transfer criteria** (refractory shock post-revasc, arrest with tenuous\n  neuro status, ≥1 vasoactive started, temporary MCS being considered)\n- [ ] Discuss **goals of care / palliative involvement** early given reported **in-hospital\n  mortality ~30–50%** *(verify current figure)* — especially before/at MCS escalation decisions\n\n## Pearls & pitfalls\n- If a patient needs vasoactive therapy to reverse hypoperfusion, classify as **SCAI-C, not SCAI-B** —\n  a common staging slip (EMCrit IBCC)\n- Inotropes buy a short-term hemodynamic bump but their use \"is associated with worse outcomes\"; digoxin\n  is noted as the one positive inotrope whose use doesn't correlate with increased mortality (EMCrit IBCC)\n- Dobutamine vs milrinone showed **no outcome difference** (DoReMi) — individualize: dobutamine's shorter\n  half-life is easier to titrate, milrinone's pulmonary vasodilation favours RV failure; DoReMi enrolled\n  mostly late Stage C–D, so a null result may reflect therapy started too late (REBEL EM, EMCrit IBCC)\n- IABP has repeatedly failed to improve outcomes (IABP-SHOCK II) and is less effective with tachycardia\n  or irregular rhythm — don't expect much from it (EMCrit IBCC, REBEL EM)\n- DanGer Shock: microaxial pump (Impella CP) cut 180-day mortality in STEMI-CS (~58% → ~46%, NNT ~8\n  *(verify)*) but roughly quadrupled serious adverse events (bleeding, limb ischaemia, haemolysis) and\n  doubled RRT-requiring AKI — benefit signal strongest with MAP <64 and multivessel disease (The Bottom Line)\n- Norepinephrine can drop cardiac output via excess afterload; low-dose epinephrine (0–5 mcg/min *(verify)*)\n  behaves predominantly as an inotrope (EMCrit IBCC)\n- Peri-intubation is a danger zone — optimize hemodynamics (small bolus, early vasoactives) before RSI to\n  avoid the \"HOp killers\" (hypotension, hypoxia, acidosis); use POCUS to exclude mimics (massive PE,\n  tamponade, tension pneumothorax) (REBEL EM)\n\n## Commonly-missed on documentation (what the gap-check flags)\nSCAI stage assigned + re-staged? · etiology (ischemic/non-ischemic) documented? · mechanical\ncomplication/tamponade excluded? · fluid status reassessed before bolus? · vasopressor/inotrope choice\ntied to hemodynamic profile? · MCS escalation trigger/timing documented? · shock team activated? ·\nserial lactate/perfusion trend charted? · GoC/palliative discussion documented?\n\n*Sources: [2025 Concise Clinical Guidance on Cardiogenic Shock — JACC/ACC](https://www.jacc.org/doi/10.1016/j.jacc.2025.02.018) · [ACC press release summary](https://www.acc.org/About-ACC/Press-Releases/2025/03/18/19/19/American-College-of-Cardiology-Issues-Concise-Clinical-Guidance-on-Evaluation-and-Management-of-Cardiogenic-Shock) · [SCAI SHOCK Stage Classification Expert Consensus Update 2022 — JACC](https://www.jacc.org/doi/10.1016/j.jacc.2022.01.018) · [SCAI SHOCK Stage Classification 2022 — open-access JSCAI PDF](https://doi.org/10.1016/j.jscai.2021.100008) · [EMCrit IBCC — CHF & cardiogenic shock](https://emcrit.org/ibcc/chf/) · [EMCrit PulmCrit — severe heart failure & cardiogenic shock](https://emcrit.org/pulmcrit/heart-failure/) · [REBEL EM — Cardiogenic Shock](https://rebelem.com/cardiogenic-shock/) · [REBEL EM — DoReMi Trial](https://rebelem.com/doremi-trial-milrinone-vs-dobutamine-for-treatment-of-cardiogenic-shock/) · [The Bottom Line — DanGer Shock](https://www.thebottomline.org.uk/summaries/danger-shock-microaxial-flow-pump-in-infarct-related-cardiogenic-shock/)*\n"}, {"file": "cdiff-idsa-shea-2021.md", "title": "C. difficile infection", "system": "ID", "body": "# C. difficile infection — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Clinical Practice Guideline by the IDSA and SHEA: 2021 Focused Update Guidelines on\n> Management of *Clostridioides difficile* Infection in Adults (Johnson S et al.), *Clinical Infectious\n> Diseases* 2021;73:e1029–44.\n> https://academic.oup.com/cid/article/73/5/e1029/6298219\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2021 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Antibiotic exposure disrupts colonic microbiota → loss of colonization resistance → germination of ingested *C. diff* spores and toxigenic overgrowth.\n- Toxin A/B are the pathogenic mediators — glucosylate Rho-family GTPases in colonocytes → cytoskeletal collapse, tight-junction breakdown, apoptosis → colitis, fluid secretion, pseudomembrane formation.\n- Disease severity tracks toxin burden and host inflammatory response, not organism burden alone — hence a purely quantitative \"colonization\" (asymptomatic carriage) is not treated.\n- Why stop the inciting antibiotic when possible: removes the ongoing driver of dysbiosis.\n- Why **oral** vancomycin/fidaxomicin, not IV: efficacy depends on high **luminal** (not systemic) concentration against a luminal/mucosal pathogen.\n- Why FMT for recurrence: restores microbial diversity/colonization resistance that antibiotics cannot rebuild.\n\n## Diagnosis / definition\n- [ ] Test **only symptomatic patients** (≥3 unformed stools/24 h, no other explanation) — do not test formed stool / test-of-cure (stool PCR/NAAT remains positive long after clinical cure — repeat testing to \"confirm cure\" is not recommended)\n- [ ] Confirm local **testing algorithm** (NAAT vs toxin EIA vs multistep) — interpret per local lab; **NAAT-only algorithms carry a false-positive rate of roughly 10%** from asymptomatic colonization (~3% of the general population carries toxigenic *C. diff*) — two-step (GDH/NAAT + confirmatory toxin EIA) reduces overtreatment but toxin EIA sensitivity is only **~80%** *(verify)*\n- [ ] **Discontinue unnecessary antimotility agents** and, where possible, the inciting antibiotic\n\n### Severity classification — drives therapy choice\n- [ ] **Non-severe**: WBC ≤15 ×10⁹/L and Cr <1.5 mg/dL *(verify exact cutoffs)*\n- [ ] **Severe**: WBC >15 ×10⁹/L or Cr ≥1.5 mg/dL *(verify)*\n- [ ] **Fulminant** (severe complicated): hypotension/shock, ileus, or megacolon — treat as a surgical + ICU emergency\n\n## Key labs & workup\n- [ ] **CBC with differential and Cr trend** — the WBC/Cr values above are both a diagnostic-severity input and a marker to trend serially, not a one-off check\n- [ ] **Lactate** — fulminant/surgical decision-making marker; some series flag **lactate >5 mmol/L combined with WBC >25–50 ×10⁹/L** as a threshold where outcomes worsen sharply — consider surgery **before** reaching this range rather than at it *(verify local threshold)*\n- [ ] **Abdominal imaging (KUB/CT)** if ileus or megacolon suspected — **megacolon = cecal diameter >12 cm or colonic diameter >7 cm**, with dilation **>6 cm** already a concern for impending perforation *(verify)*; a single normal film does not exclude later development — repeat serially if clinical concern persists\n- [ ] **Note**: patients with ileus/megacolon may have no diarrhea to test — stool testing may be impossible, and empiric treatment can be reasonable in this setting\n\n## Management\n### Treatment by severity\n- [ ] **Initial episode, non-severe or severe**: **fidaxomicin preferred** over vancomycin (reduced recurrence) — <200 mg PO BID ×10 d — verify>; **vancomycin** an acceptable alternative — <125 mg PO QID ×10 d — verify>\n- [ ] **Fulminant CDI**: **oral/NG vancomycin** (not fidaxomicin — no fulminant-disease data) — <500 mg PO/NG QID — verify> **+ IV metronidazole** if ileus/megacolon — <500 mg IV q8h — verify> **+ consider vancomycin retention enema** if complete ileus\n- [ ] **Surgical consult early** for fulminant disease — colectomy vs diverting loop ileostomy with colonic lavage per surgical/local practice\n- [ ] **Recurrent CDI**: fidaxomicin (standard or extended-pulse) or vancomycin taper/pulse preferred over repeat standard vancomycin course; consider **bezlotoxumab** or **fecal microbiota transplant** for multiply-recurrent disease — *verify eligibility*\n\n### Ongoing management\n- [ ] **Contact precautions** for duration of diarrhea (soap-and-water hand hygiene — alcohol gel does not kill spores)\n- [ ] **Avoid antimotility/opioid agents** that mask worsening ileus — diarrhea itself is not the enemy here; it helps clear organism burden from the colon\n- [ ] **Daily reassessment for fulminant progression** (lactate, abdominal exam, distension, hemodynamics) in any inpatient CDI\n- [ ] **Review need for ongoing/future antibiotics** and PPI — de-escalate where possible; **secondary prophylaxis** (low-dose oral vancomycin, e.g. 125 mg daily ×5 d, during/after a future systemic antibiotic course) is reasonable in patients with CDI within the prior 3–6 months *(verify dose/duration)* — IBCC\n- [ ] **Nutrition and volume status** — high-output diarrhea losses\n\n## Pearls & pitfalls\n- [ ] **Piperacillin-tazobactam appears to be one of the lower-CDI-risk broad-spectrum agents**; national shortages of it have been associated with a rise in CDI rates on some units — a reminder that antibiotic *choice*, not just duration, matters — IBCC (EMCrit) *(verify local antibiogram/formulary relevance)*\n- [ ] **Vancomycin retention enema carries a real perforation risk** with only limited case-series support — avoid in suspected/confirmed toxic megacolon specifically — IBCC (EMCrit)\n- [ ] **A patient already on CDI therapy can have a false-negative toxin assay** (suppressed organism replication) — don't use a negative repeat test to \"rule out\" ongoing disease in a patient already being treated — IBCC (EMCrit)\n- [ ] **Bezlotoxumab was discontinued by its manufacturer (Merck) as of 2025** — confirm current local/regional availability before counting on it for recurrence prevention *(verify)* — IBCC (EMCrit)\n- [ ] Involve **surgery early rather than at the point of overt perforation/peritonitis** — outcomes are reported as better when colectomy happens before organ failure is established, not after — IBCC (EMCrit)\n\n## Commonly-missed on documentation (what the gap-check flags)\nTesting only in symptomatic patient (not test-of-cure)? · severity classified (non-severe/severe/fulminant)? ·\nfidaxomicin considered before defaulting to vancomycin? · surgical consult documented if fulminant? ·\ncontact precautions + hand hygiene noted? · antimotility agents stopped? · inciting antibiotic reviewed?\n\n*Sources: [IDSA/SHEA 2021 Focused Update on CDI — Oxford Academic](https://academic.oup.com/cid/article/73/5/e1029/6298219) · [Navigating the 2021 update — ethical approach (PMC)](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9726573/) · **Pearls & pitfalls:** [C. difficile — IBCC (EMCrit)](https://emcrit.org/ibcc/cdiff/)*\n"}, {"file": "copd-exacerbation-gold-2026.md", "title": "COPD exacerbation", "system": "Respiratory", "body": "# COPD exacerbation — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Global Strategy for the Diagnosis, Management, and Prevention of Chronic Obstructive\n> Pulmonary Disease — 2026 Report, Global Initiative for Chronic Obstructive Lung Disease (GOLD),\n> published December 2025.\n> https://goldcopd.org/2026-gold-report-and-pocket-guide/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026 (annually revised — check for newer edition)\n\n## Why — physiology / first principles\n- Baseline small-airway inflammation/fibrosis plus emphysematous loss of elastic recoil → chronic expiratory\n  flow limitation and dynamic hyperinflation (auto-PEEP).\n- Exacerbation triggers (viral/bacterial infection, pollutants) increase airway inflammation/mucus → worsens\n  expiratory flow limitation → higher auto-PEEP and inspiratory threshold load → hypercapnic respiratory\n  failure from an overwhelmed respiratory pump, not primarily from failed gas exchange.\n- Hypoxemia is driven mainly by **V/Q mismatch** (not shunt), which is why modest supplemental O₂ usually\n  suffices and why over-oxygenation can worsen hypercapnia (V/Q redistribution + Haldane effect).\n- Bronchodilators cut airway resistance, corticosteroids reduce inflammatory edema, and NIV offloads\n  inspiratory muscles by counterbalancing auto-PEEP and augmenting tidal volume.\n\n## Diagnosis / definition\n- [ ] **Exacerbation defined**: acute worsening of respiratory symptoms resulting in additional therapy,\n  graded using **Anthonisen-type criteria** — increased dyspnea, increased sputum volume, increased sputum\n  purulence *(verify current GOLD wording)*\n- [ ] Severity classified — mild (bronchodilators only) / moderate (+ steroids ± antibiotics) / severe\n  (requires ED/hospitalization or respiratory failure) *(verify)*\n- [ ] Rule out mimics/complications — pneumonia, pneumothorax, PE, heart failure, arrhythmia — GOLD 2026\n  adds a dedicated figure on **conditions that may mimic or worsen exacerbation-like symptoms** (new\n  for 2026) — use it to structure the differential\n- [ ] **Place-of-management decision** (outpatient vs ED vs admission) made using GOLD 2026's revised\n  criteria for outpatient-vs-inpatient treatment *(verify current criteria — new dedicated figure for 2026)*\n\n## Key labs & workup\n- [ ] **ABG** for patients with severe exacerbation or altered mentation — grades hypercapnia/acidosis and\n  identifies need for ventilatory support *(pH/PaCO₂ thresholds — verify)*\n- [ ] **CXR** to exclude pneumothorax, pneumonia, and effusion as an alternative/co-existing cause\n- [ ] **ECG ± troponin/BNP** if a cardiac contributor (arrhythmia, ischemia, decompensated heart failure)\n  is suspected *(verify indication threshold)*\n- [ ] **Blood eosinophil count** — GOLD uses this as a biomarker to guide corticosteroid-responsiveness and\n  inhaled-therapy escalation decisions *(cutoff — verify, commonly ≥300 cells/µL favors ICS benefit)*\n- [ ] **Sputum culture** if purulent sputum and risk factors for resistant organisms *(verify indication)*\n\n## Management\n\n## Pharmacologic bundle\n- [ ] **Short-acting bronchodilators** (SABA ± SAMA) — increased dose/frequency as first-line\n- [ ] **Systemic corticosteroids** — short course, **~5 days** *(dose — verify, commonly prednisone/\n  prednisolone equivalent)*\n- [ ] **Antibiotics** if patient has **all 3 cardinal symptoms**, or **2 symptoms including increased\n  sputum purulence**, or **requires mechanical ventilation (invasive or noninvasive)** *(verify agent/\n  duration per local antibiogram)*\n\n## Oxygen & ventilatory support\n- [ ] **Controlled oxygen therapy** titrated to a conservative target — avoid hyperoxia-driven\n  hypercapnia *(target — verify, commonly SpO₂ 88–92%)*\n- [ ] **High-Flow Nasal Therapy (HFNT) — new first-line-tier respiratory support option in GOLD 2026.**\n  Consider specifically for: **persistent hypoxemia**, **NIV intolerance**, **contraindication to NIV**,\n  or **weaning off supplemental oxygen after NIV** *(verify local device availability/protocol — this is\n  the single biggest exacerbation-management change from GOLD 2025)*\n- [ ] **NIV first-line** for acute or acute-on-chronic hypercapnic respiratory failure with respiratory\n  acidosis *(pH/PaCO₂ threshold — verify)* — reduces need for intubation and mortality\n- [ ] **Invasive mechanical ventilation** indications: NIV failure/intolerance, respiratory or cardiac\n  arrest, depressed consciousness, massive aspiration, hemodynamic instability, life-threatening hypoxemia\n  *(verify full criteria list)*\n\n## Disease-activity framing — new in GOLD 2026\n- [ ] **Exacerbation frequency and recovery time documented** as indicators of disease activity and\n  future risk, not just as a discrete resolved event\n- [ ] **Treatment-escalation threshold lowered**: GOLD 2026 uses **one moderate exacerbation** (not\n  requiring ≥2 moderate or any severe exacerbation) as sufficient justification to **escalate maintenance\n  therapy**, aiming for a low-disease-activity state characterized by no further exacerbations — *verify\n  against current ABE/GOLD grade assessment tool and local practice*\n\n## Discharge / follow-up bundle\n- [ ] Maintenance inhaled therapy reviewed/optimized before discharge — reassessed against the\n  lowered (one-moderate-exacerbation) escalation threshold above\n- [ ] **Inhaler technique** checked\n- [ ] Follow-up visit arranged *(timeframe — verify, commonly 1–4 weeks)*\n- [ ] Smoking-cessation counseling offered\n- [ ] Vaccination status reviewed (influenza, pneumococcal, RSV, pertussis/COVID per local schedule —\n  GOLD 2026 vaccination guidance updated specifically re: RSV/influenza)\n- [ ] Pulmonary rehabilitation referral considered\n\n## Pearls & pitfalls\n- Blood eosinophil count is a useful biomarker for steroid/ICS responsiveness, but very low counts\n  (<100 cells/µL) have been associated with increased pneumonia risk from ICS use — don't treat eosinophils\n  as a one-directional \"more is always better\" signal when reviewing discharge inhaled therapy *(verify\n  cutoff)* (IBCC — EMCrit, Josh Farkas, COPD chapter).\n- COPD–OSA overlap can be mistaken for uncomplicated COPD; treating with oxygen alone in these patients\n  risks worsening hypercapnia — consider the overlap when a patient decompensates faster than expected on\n  simple O₂ *(verify)* (IBCC — EMCrit, Josh Farkas, COPD chapter).\n- A normal FEV1/FVC ratio does not exclude significant emphysema/COPD physiology — don't anchor the\n  diagnosis (or dismiss it) on spirometry alone during an acute presentation *(verify)* (IBCC — EMCrit,\n  Josh Farkas, COPD chapter).\n\n## Commonly-missed on documentation (what the gap-check flags)\nCardinal symptom count documented to justify antibiotic decision? · steroid course duration specified\nand ≤ ~5–7 days? · HFNT considered/documented as an option before or alongside NIV where indicated\n(persistent hypoxemia, NIV intolerance/contraindication, post-NIV weaning)? · NIV trialled before\ninvasive ventilation with reasoning if skipped? · O₂ target stated (not just \"O₂ as needed\")? ·\nexacerbation counted toward the one-moderate-exacerbation escalation threshold and maintenance therapy\nreassessed accordingly? · discharge bundle (technique, follow-up, vaccination, smoking) completed?\n\n*Sources: [GOLD 2026 Report and Pocket Guide — GOLD](https://goldcopd.org/2026-gold-report-and-pocket-guide/) · [GOLD 2026 Key Changes Summary (PDF)](https://goldcopd.org/wp-content/uploads/2025/11/KEY-CHANGES-GOLD-2026-10Nov2025.pdf) · [GOLD 2026 Report: What is New and What is Noteworthy for the Practicing Clinician](https://www.tandfonline.com/doi/full/10.1080/15412555.2026.2622744) · [GOLD 2026 updates in global strategy for diagnosis, management, and prevention of COPD — Chest Physician](https://www.chestphysician.org/gold-2026-updates-in-global-strategy-for-diagnosis-management-and-prevention-of-copd/) · [IBCC — COPD chapter, EMCrit (Josh Farkas)](https://emcrit.org/ibcc/copd/)*\n"}, {"file": "decompensated-cirrhosis-aasld-2021.md", "title": "Decompensated cirrhosis (variceal bleed / hepatic encephalopathy / SBP)", "system": "GI / Hepatic", "body": "# Decompensated cirrhosis (variceal bleed / hepatic encephalopathy / SBP) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** AASLD 2021 Practice Guidance: Diagnosis, Evaluation and Management of Ascites,\n> Spontaneous Bacterial Peritonitis and Hepatorenal Syndrome (Biggins SW et al.), *Hepatology* 2021 —\n> https://pubmed.ncbi.nlm.nih.gov/33942342/\n> Hepatic encephalopathy: EASL Clinical Practice Guidelines on the Management of Hepatic\n> Encephalopathy, 2022 — https://pubmed.ncbi.nlm.nih.gov/35724930/ (joint AASLD/EASL 2014 guideline\n> still widely referenced)\n> Variceal bleed / TIPS: AASLD Practice Guidance on Portal Hypertension and Varices in Cirrhosis, 2023 —\n> https://pubmed.ncbi.nlm.nih.gov/37870298/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2021 (SBP/HRS) / 2022 (HE) / 2023 (varices)\n\n## Why — physiology / first principles\n- Progressive fibrosis → increased intrahepatic resistance → portal hypertension → splanchnic vasodilation\n  (NO-mediated) → **effective arterial underfilling** → compensatory RAAS/SNS activation → sodium/water\n  retention (ascites) and, when severe, renal vasoconstriction (hepatorenal physiology).\n- Portal hypertension also drives portosystemic collaterals (varices) at risk of hemorrhage, and gut bacterial\n  translocation across a congested, permeable gut wall predisposes to spontaneous bacterial peritonitis.\n- Loss of hepatic synthetic function underlies coagulopathy and, via impaired ammonia handling, hepatic\n  encephalopathy.\n- Each decompensating event (bleed, infection, AKI) further drops effective circulating volume, pushing the\n  same underlying hemodynamic derangement further — the mechanistic reason complications cluster and cascade.\n\n## Diagnosis / definition\n- [ ] **SBP** defined by ascitic fluid **PMN ≥250 cells/mm³** *(verify)*\n- [ ] **HRS-AKI** diagnostic criteria (ICA-AKI framework): cirrhosis + ascites, creatinine rise per AKI staging that fails to improve after ≥2 days of diuretic withdrawal + volume expansion with albumin (**1 g/kg/day**, up to ~100 g/day), absence of shock, no current/recent nephrotoxins, no macroscopic evidence of structural kidney injury *(exact staging/version — verify)*\n  - **Type 1** HRS: rapid, doubling-or-worse creatinine within ~2 weeks; **Type 2**: slower, steadier decline *(verify)*\n- [ ] Grade **hepatic encephalopathy** via West Haven criteria (grade I: mild confusion/asterixis → grade IV: coma) and trend serially *(verify)*\n\n## Key labs & workup\n- [ ] Diagnostic paracentesis: cell count/differential, culture (bedside inoculation of blood-culture bottles improves yield), albumin (for SAAG), total protein\n- [ ] Renal: creatinine trend, urinalysis/urine sediment to help exclude intrinsic renal disease, renal ultrasound if structural disease suspected\n- [ ] **Ammonia** for HE — trend, not a stand-alone diagnostic test; poor isolated sensitivity/specificity, so don't use a single value to confirm or exclude mild-moderate HE *(verify)*\n- [ ] Coagulation panel — note cirrhotic \"rebalanced\" hemostasis; INR does not reliably predict bleeding risk in this population *(verify)*\n- [ ] Doppler ultrasound for portal vein patency (exclude thrombosis) as part of the decompensation workup\n\n## Management\n### Spontaneous bacterial peritonitis (SBP)\n- [ ] Diagnostic paracentesis on admission for any cirrhotic with ascites plus any sign of decompensation (fever, abdominal pain, encephalopathy, AKI, GI bleed) — low threshold to tap\n- [ ] Empiric **broad-spectrum IV antibiotics** started promptly once diagnosed — regimen per local resistance patterns *(agent/dose — verify)*\n- [ ] **IV albumin** on day 1 and day 3 for SBP with risk factors (e.g. elevated creatinine/BUN/bilirubin) to reduce AKI and mortality risk *(dose — verify)*\n- [ ] Secondary SBP prophylaxis (e.g. norfloxacin) after an episode *(agent — verify)*\n- [ ] Consider primary prophylaxis in high-risk subgroups (low ascitic-fluid protein with advanced liver/renal dysfunction, or prior GI bleed) *(criteria — verify)*\n\n### Hepatorenal syndrome (HRS) / AKI in cirrhosis\n- [ ] Volume challenge with albumin + stop diuretics/nephrotoxins + treat precipitants (infection, GI bleed) **before** labeling as HRS\n- [ ] HRS-AKI treatment: **vasoconstrictor (e.g. terlipressin) + albumin** as first-line where available *(agent/dose — verify local availability)*\n- [ ] Early transplant hepatology involvement; renal replacement therapy as a bridge if indicated\n\n### Hepatic encephalopathy (HE)\n- [ ] **Identify and treat the precipitant** first-line — infection, GI bleed, constipation, dehydration/diuretic overuse, electrolyte disturbance, sedatives/opioids, TIPS — precipitant correction resolves most episodes\n- [ ] **Lactulose** titrated to **2-3 soft stools/day** as first-line therapy *(dose — verify)*\n- [ ] Add **rifaxi
