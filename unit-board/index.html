<!DOCTYPE html>
<!-- ICU Unit Board · v1 · Claude Code · 25-Aug-2026
     Reuses the real ICU Daily tool (embedded below as base64, injected per bed into an iframe).
     Build with build-board.sh (injects the tool + roundsheet.js + version). Self-contained, opens as a local file.
     Storage model: beds[n] = { d:<D schema>, stay:<id>, state:'preround'|'rounded', overnight:'', taskDone:[] }. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU Unit Board</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif}
  body{display:flex;flex-direction:column;background:#eef2f8;color:#1a1d21;font-size:15px}
  header{background:#1a3c8f;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:700}
  .fzb{font:inherit;font-weight:800;background:#2a4ea0;color:#fff;border:0;border-radius:5px;width:26px;height:24px;cursor:pointer;line-height:1}
  header select{font:inherit;padding:4px 8px;border-radius:5px;border:0}
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tabs button{font:inherit;font-weight:600;background:#2a4ea0;color:#cfe;border:0;border-radius:6px 6px 0 0;padding:6px 14px;cursor:pointer}
  .tabs button.on{background:#eef2f8;color:#1a3c8f}
  #wrap{flex:1;display:flex;min-height:0}
  #rail{flex:0 0 212px;background:#dbe6f6;padding:8px 7px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .raillbl{font-size:10px;font-weight:800;color:#1a3c8f;text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:2px 0 1px}
  .railgrp{display:flex;flex-direction:column;gap:6px;border:2px solid #9fbce8;border-radius:8px;padding:6px;background:#eaf1fb}
  .bedbtn{position:relative;display:block;width:100%;font:inherit;background:#fff;border:1px solid #b6cff0;border-radius:8px;padding:7px 8px 8px;cursor:pointer;text-align:left;color:#1a3c8f;line-height:1.25}
  .bedbtn.cur{background:#1a73e8;color:#fff;border-color:#1a73e8}
  .bedbtn.cur .idl,.bedbtn.cur .chip{color:#fff;background:rgba(255,255,255,.18)}
  .bedbtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#cbd5e6}
  .bedbtn.filled .dot{background:#28a745}
  .bedbtn .bn{font-weight:800;font-size:13px}
  .bedbtn .st{position:absolute;top:23px;right:6px;font-size:9px;font-weight:800;border-radius:4px;padding:0 3px}
  .bedbtn .st.pr{background:#ffe6b3;color:#8a5a00}
  .bedbtn .st.done{background:#cdeccd;color:#155f2e}
  .bedbtn .st.hv{background:#dbeafe;color:#1a5aa8}
  .bedbtn .idl{display:block;font-weight:400;font-size:10px;opacity:.85;margin-top:1px}
  .bedbtn .idl.empty{opacity:.5;font-style:italic}
  .bedbtn .meta{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
  .bedbtn .chip{font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px;background:#e6ecf7;color:#1a3c8f}
  .bedbtn .chip.tsk{background:#ffd9d9;color:#a11}
  .bedbtn .chip.tx{background:#dfeee0;color:#1a6b2e}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  #pastebar{background:#dbe6f6;border-bottom:1px solid #c3d4ee;padding:11px 14px;display:flex;gap:10px;align-items:stretch}
  #pjson{flex:1;font-family:'Consolas','Courier New',monospace;font-size:12px;min-height:54px;padding:10px 12px;border:2px dashed #a9c4ec;border-radius:8px;resize:vertical;background:#fff;line-height:1.45}
  #pjson:focus{outline:none;border-color:#1a73e8}
  #pastebar button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:8px;padding:0 20px;cursor:pointer;font-size:14px}
  #msg{font-size:11px;color:#666;align-self:center;min-width:110px}
  #bedbar{display:none;gap:8px;align-items:center;background:#eaf1fb;border-bottom:1px solid #c3d4ee;padding:7px 14px;flex-wrap:wrap}
  #bedbar .bbtag{font-weight:800;color:#1a3c8f}
  #bedbar button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
  #bedbar button.sec{background:#6b7a90}
  #bedbar button.rnd{background:#6e40c9}
  #bedbar button.asg{background:#28a745}
  #bedbar .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  #bedbar .spacer{flex:1}
  .taskchip{font-size:11px;font-weight:600;border-radius:12px;padding:3px 9px;cursor:pointer;background:#e6ecf7;color:#1a3c8f;border:1px solid #cdd9ee}
  .taskchip.k-new{background:#e3f0ff} .taskchip.k-stop{background:#f3e0e0} .taskchip.k-watch{background:#fff0d6}
  .taskchip.done{text-decoration:line-through;opacity:.5}
  #view{flex:1;min-height:0;position:relative}
  iframe{width:100%;height:100%;border:0;background:#fff;position:absolute;inset:0}
  #hvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eaf1fb;border-bottom:1px solid #c3d4ee;padding:8px 14px;font-size:12.5px}
  #hvbar b{color:#1a3c8f}
  #hvbar .hvsp{flex:1}
  #hvbar .grp{display:flex;align-items:center;gap:3px;color:#556}
  #hvbar span.val{font-weight:700;color:#1a3c8f;min-width:40px;text-align:center}
  #hvbar button.go{font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
  #hvbar button.prt{background:#6e40c9}
  #hvbar button.sec2{background:#e6ecf7;color:#1a3c8f;border:1px solid #cdd9ee;border-radius:5px;padding:4px 9px;cursor:pointer;font-weight:600}
  #hvview{flex:1;position:relative;background:#e9edf3}
  #hvview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #collarea{background:#f3f7fd;border-top:1px solid #c3d4ee;padding:8px 14px;max-height:150px;overflow:auto;flex:0 0 auto}
  #collarea .collhdr{font-size:11px;color:#556;margin-bottom:6px;font-weight:600}
  #collarea .collrow{display:flex;align-items:flex-start;gap:8px}
  #collarea select{font:inherit;padding:5px;border-radius:5px;border:1px solid #b6cff0}
  #collarea textarea{flex:1;font-family:'Consolas','Courier New',monospace;font-size:11px;min-height:34px;padding:6px 8px;border:1px dashed #a9c4ec;border-radius:6px;resize:vertical}
  #collarea button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:0 14px;cursor:pointer}
  .panel{position:absolute;inset:0;overflow:auto;padding:20px;background:#eef2f8}
  .census{background:#fff;border:1px solid #d7e0ee;border-radius:8px;padding:14px 18px;max-width:680px}
  .census b{color:#1a3c8f}
  .stub{color:#667;background:#fff;border:1px dashed #b6cff0;border-radius:8px;padding:18px;max-width:680px}
  code{background:#e6ecf7;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>🏥 ICU Unit Board <span style="font-weight:400;opacity:.7;font-size:11px">v1.7 · 25-Aug-2026</span></h1>
  Unit <select id="unitSel" onchange="switchUnit()"></select>
  <span id="dateLbl" style="opacity:.85"></span>
  <span style="display:flex;gap:4px;align-items:center;font-size:12px;margin-left:10px">Text <button class="fzb" onclick="fz(-0.08)">A&minus;</button><button class="fzb" onclick="fz(0.08)">A+</button></span>
  <div class="tabs">
    <button data-sec="daily" class="on" onclick="showSec('daily')">Daily</button>
    <button data-sec="handover" onclick="showSec('handover')">Handover</button>
    <button data-sec="prompts" onclick="showSec('prompts')">Prompts</button>
  </div>
</header>
<div id="wrap">
  <aside id="rail"></aside>
  <section id="stage">
    <div id="pastebar">
      <textarea id="pjson" placeholder='Paste a bed&#39;s JSON here — it loads automatically on paste (or press ⌘/Ctrl+Enter). Routes by the "bed" field.'></textarea>
      <button onclick="loadPaste()">⤵ Load bed</button>
      <span id="msg"></span>
    </div>
    <div id="bedbar"></div>
    <div id="view"></div>
  </section>
</div>

<script>/* roundsheet.js — §23 Rounding Sheet renderer for the Unit Board.
   renderRoundingSheet(d) -> full A4-print-optimised HTML string, matching the
   24-Aug Bed-4 gold standard. Deterministic from the bed's structured data (d).
   The "Today / tasks" callout is a best-effort heuristic from plan/overnight lines
   (chat-Claude's `icu rounds` produces the full-judgment version). Print-CSS
   invariants (§23) are baked in and must not be removed. */
function rsEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function rsDay(admit){ if(!admit)return '?'; var a=new Date(admit),t=new Date(); t.setHours(0,0,0,0); var n=Math.floor((t-a)/86400000)+1; return isNaN(n)?'?':n; }
function rsDate(){ var d=new Date(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(); }
function rsFile(){ var d=new Date(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return String(d.getDate()).padStart(2,'0')+'-'+m[d.getMonth()]+'-'+d.getFullYear(); }
function rsLines(v){ if(!v)return []; if(Array.isArray(v))return v.filter(function(x){return x!=null&&String(x).trim();}); return String(v).split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean); }
function rsWarn(t){ return /^⚠|threshold|avoid|risk|allerg|airway|unsecured|bleed|deteriorat|watch/i.test(t); }
function rsFlag(v){ // wrap (H)/(L) etc in colour spans
  return rsEsc(v).replace(/\((HH|LL|H|L)\)/g,function(m,g){ var c=(g[0]==='H')?'hi':'lo'; return '<span class="'+c+'">('+g+')</span>'; }); }

function rsFlagsBlock(d){
  var aro=(d.aro&&String(d.aro).trim())?d.aro:'None';
  var alg=(d.allergies&&String(d.allergies).trim())?d.allergies:'NKA';
  var gocP=(d.problems||[]).filter(function(p){return p&&p.type==='goc';})[0];
  var goc=gocP?((gocP.goc_status||'?')+(gocP.goc_note?' — '+gocP.goc_note:'')):'Unknown';
  var aroCls=/none|neg/i.test(aro)?'ok':'';
  var algCls=/^nka|none|nil/i.test(alg)?'ok':'warn';
  return '<div class="flags">'
    +'<div class="flag '+aroCls+'"><span class="lbl">ARO / Isolation</span><span class="val">'+rsEsc(aro)+'</span></div>'
    +'<div class="flag '+algCls+'"><span class="lbl">Allergies</span><span class="val">'+rsEsc(alg)+'</span></div>'
    +'<div class="flag"><span class="lbl">Goals of Care</span><span class="val">'+rsEsc(goc)+'</span></div></div>';
}

function rsTodayBlock(d){
  var pend=[],mods=[],warns=[],fromTasks=false;
  // Preferred: structured tasks[] (kind: new|stop|pending|watch)
  if(Array.isArray(d.tasks)&&d.tasks.length){
    fromTasks=true;
    d.tasks.forEach(function(t){ if(!t)return; var txt=(t.text||'').trim(); if(!txt)return;
      var k=(t.kind||'pending').toLowerCase();
      if(k==='watch')warns.push(txt);
      else if(k==='pending')pend.push(txt);
      else mods.push((k==='stop'?'STOP: ':k==='new'?'NEW: ':'')+txt);
    });
  } else {
    // Fallback heuristic: bucket from plan lines + overnight text
    (d.problems||[]).forEach(function(p){
      rsLines(p&&p.plan).forEach(function(l){
        if(rsWarn(l)){ warns.push(l); return; }
        if(/pending|await|f\/u|follow.?up|repeat|echo|consult|refer|result|culture|reassess|recheck/i.test(l)){ pend.push(l); }
        else if(/^start|^new|^begin|^add |^increase|^up-?titrat|^stop|^hold|^d\/?c|^discontinu|^decreas|^wean/i.test(l)){ mods.push(l); }
      });
    });
    if(d.overnight){ rsLines(d.overnight).forEach(function(l){ pend.push(l); }); }
  }
  function ul(arr){ return arr.length?('<ul>'+arr.map(function(l){ return '<li'+(rsWarn(l)?' class="warn"':'')+'>'+rsFlag(l.replace(/^⚠\s*/,''))+'</li>'; }).join('')+'</ul>'):'<ul><li style="color:#999">—</li></ul>'; }
  var note=fromTasks?'':' <span style="font-weight:400;font-size:7.4pt;color:#a06a1a">(auto-draft — verify &amp; edit)</span>';
  return '<div class="today"><h2>⚡ Today · Key changes &amp; tasks'+note+'</h2>'
    +'<div class="today-grid">'
    +'<div class="today-cell"><span class="k">Pending / awaiting</span>'+ul(pend)+'</div>'
    +'<div class="today-cell"><span class="k">New / stop / watch</span>'+ul(mods.concat(warns))+'</div>'
    +'</div></div>';
}

function rsSnapBlock(d){
  var v=d.vitals||{}, fl=d.fluids||{};
  function rows(pairs){ return pairs.filter(function(p){return p[1]!=null&&String(p[1]).trim();}).map(function(p){ return '<div class="r"><span class="l">'+rsEsc(p[0])+'</span><span class="v">'+rsFlag(p[1])+'</span></div>'; }).join('')||'<div class="r"><span class="l">—</span><span class="v"></span></div>'; }
  // pull an ABG/VBG section from labs if present
  var abg=(d.labs||[]).filter(function(s){return /abg|vbg|gas/i.test(s.section||'');})[0];
  var abgRows=abg?abg.items.slice(0,6).map(function(it){return [it.l,(it.v||'')+(it.f==='hi'?' (H)':it.f==='lo'?' (L)':'')];}):[['','—']];
  return '<div class="snap">'
    +'<div class="snap-box"><h3>Vitals</h3><div class="rows">'+rows([['BP',v.bp&&v.map?v.bp+' ('+v.map+')':v.bp],['HR',v.hr],['SpO2',v.sats],['Tmax',v.tmax],['RR',v.rr],['GCS',v.gcs]])+'</div></div>'
    +'<div class="snap-box"><h3>Airway / Support</h3><div class="rows">'+rows([['Resp',v.resp],['Diet',(d.fluids&&d.fluids.note)?'':''],['CVS',v.cvs],['Abd',v.abd],['Other',v.other]])+'</div></div>'
    +'<div class="snap-box"><h3>ABG / VBG</h3><div class="rows">'+rows(abgRows)+'</div></div>'
    +'<div class="snap-box"><h3>Fluid Balance</h3><div class="rows">'+rows([['Balance',fl.fb],['Urine out',fl.uo],['Note',fl.note]])+'</div></div>'
    +'</div>';
}

function rsLabsBlock(d){
  var labs=(d.labs||[]).filter(function(s){return !/abg|vbg|gas/i.test(s.section||'');});
  if(!labs.length)return '';
  var lines=labs.map(function(sec){
    var items=(sec.items||[]).filter(function(it){return it&&(it.v!=null&&String(it.v).trim());}).map(function(it){
      var val=String(it.v); var suf=(it.f==='hi'&&!/\(H/.test(val))?' (H)':(it.f==='lo'&&!/\(L/.test(val))?' (L)':'';
      var disp=rsFlag(val+suf);
      return (it.l?rsEsc(it.l)+' ':'')+disp;
    });
    if(!items.length)return '';
    return '<div class="line"><span class="pn">'+rsEsc((sec.section||'').replace(/\s*\(.*\)$/,''))+'</span> '+items.join(' &nbsp;·&nbsp; ')+'</div>';
  }).filter(Boolean).join('');
  return lines?('<div class="labs"><h3>Labs</h3>'+lines+'</div>'):'';
}

function rsProblemsBlock(d){
  var rows=(d.problems||[]).map(function(p,i){
    if(!p||!p.name)return '';
    var isGoc=p.type==='goc', isDispo=p.type==='dispo';
    var cls=isGoc?' class="goc"':isDispo?' class="dispo"':'';
    var badge=p.badge&&p.badge.text?'<span class="badge '+({b:'bl',g:'gr',o:'',r:''}[(p.badge.type||'o')]||'')+'">'+rsEsc(p.badge.text)+'</span>':'';
    // doing now = tx (+ key_labs summary); plan = plan (+ bp)
    var doing=rsLines(p.tx);
    if(p.key_labs&&p.key_labs.length){ var kl=p.key_labs.filter(function(k){return k&&k.v;}).map(function(k){return (k.l?k.l+' ':'')+k.v;}); if(kl.length)doing.push(kl.join(' | ')); }
    if(isGoc){ doing=rsLines(p.goc_status? (p.goc_status+(p.goc_note?' — '+p.goc_note:'')) : p.context); }
    if(isDispo){ doing=rsLines(p.dispo_summary||p.context); }
    var plan=rsLines(p.plan).concat(rsLines(p.bp).map(function(b){return b;}));
    function ul(arr){ return arr.length?('<ul>'+arr.map(function(l){return '<li'+(rsWarn(l)?' class="warn"':'')+'>'+rsFlag(l.replace(/^⚠\s*/,''))+'</li>';}).join('')+'</ul>'):''; }
    return '<tr'+cls+'>'
      +'<td class="name">'+(i+1)+'. '+rsEsc(p.name)+badge+'</td>'
      +'<td class="doing">'+ul(doing)+'</td>'
      +'<td class="plan">'+ul(plan)+'</td></tr>';
  }).filter(Boolean).join('');
  return '<table class="prob"><thead><tr><th>Problem</th><th>Doing now</th><th>Plan</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderRoundingSheet(d){
  d=d||{};
  var day=rsDay(d.icu_admit);
  var unit=(d.unit||'').toUpperCase();
  var dx=d.subtitle||((d.diagnoses||[]).join(' · '))||'';
  var admitStr=d.icu_admit?(' · ICU admit '+d.icu_admit):'';
  var CSS='*{box-sizing:border-box;margin:0;padding:0}'
   +'@page{size:A4 portrait;margin:12mm 8mm 8mm 8mm}'
   +"html,body{background:#fff;color:#000;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}"
   +'body{font-size:9.6pt;line-height:1.38;padding:8px 7px}'
   +'@media print{body{padding:0}.print-instructions{display:none!important}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}'
   +'.hdr{border:1.5px solid #000;padding:7px 11px;margin-bottom:7px;break-after:avoid;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}'
   +'.hdr-l h1{font-size:16pt;font-weight:800;line-height:1.1;margin-bottom:2px}.hdr-l .sub{font-size:9.6pt;color:#222;font-weight:600}.hdr-l .dx{font-size:10.2pt;font-weight:600;margin-top:4px;max-width:520px}'
   +'.hdr-r{text-align:right;font-size:8.2pt;color:#333;line-height:1.3}.hdr-r .date{font-size:12.5pt;font-weight:800;color:#000}.hdr-r .day{background:#000;color:#fff;padding:2px 7px;border-radius:2px;display:inline-block;margin-top:3px;font-weight:700;font-size:9.4pt}'
   +'.flags{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:5px;margin-bottom:7px;break-inside:avoid}'
   +'.flag{border:1px solid #666;padding:4px 8px;font-size:9.6pt;background:#f5f5f5}.flag .lbl{font-size:7.6pt;text-transform:uppercase;font-weight:700;letter-spacing:.4px;color:#555;margin-bottom:2px}.flag .val{font-weight:700}'
   +'.flag.warn{background:#fde8e8;border-color:#b02020}.flag.warn .val{color:#b02020}.flag.ok{background:#eaf5ea;border-color:#2c7a2c}'
   +'.today{border:1.5px solid #d97706;background:#fff7e6;padding:7px 10px;margin-bottom:7px;break-inside:avoid}'
   +'.today h2{font-size:9.8pt;font-weight:800;color:#7a3f00;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}'
   +'.today-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:3px;font-size:9.4pt}'
   +'.today-cell .k{font-weight:700;color:#7a3f00;text-transform:uppercase;font-size:7.6pt;letter-spacing:.3px;display:block;margin-bottom:2px}'
   +'.today-cell ul{list-style:none;padding:0;margin:0}.today-cell li{padding:1.5px 0;line-height:1.35}.today-cell li.warn{color:#b02020;font-weight:600}.today-cell li.warn::before{content:"⚠ ";font-weight:800}'
   +'.snap{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:7px;break-inside:avoid}'
   +'.snap-box{border:1px solid #666;padding:4px 8px}.snap-box h3{font-size:7.6pt;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#333;margin-bottom:3px;border-bottom:1px solid #ccc;padding-bottom:2px}'
   +'.snap-box .rows{font-size:9pt;line-height:1.45}.snap-box .rows .r{display:flex;justify-content:space-between;gap:5px}.snap-box .rows .r .l{color:#555;font-weight:600}.snap-box .rows .r .v{font-weight:700;text-align:right}'
   +'.labs{border:1px solid #666;padding:4px 8px;margin-bottom:7px;break-inside:avoid;background:#fafafa}.labs h3{font-size:7.6pt;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#333;margin-bottom:3px}'
   +'.labs .line{font-size:8.9pt;line-height:1.45;margin-bottom:2px}.labs .line .pn{font-weight:700;color:#333;display:inline-block;min-width:82px}'
   +'.hi{color:#b02020;font-weight:700}.lo{color:#0d47a1;font-weight:700}'
   +'table.prob{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:9.4pt}'
   +'table.prob thead{display:table-header-group;background:#000;color:#fff}table.prob thead th{padding:4px 7px;text-align:left;font-weight:700;text-transform:uppercase;font-size:8pt;letter-spacing:.5px}'
   +'table.prob tbody tr{page-break-inside:avoid;break-inside:avoid;border-bottom:1px solid #999}table.prob tbody td{padding:5px 7px;vertical-align:top;line-height:1.38}'
   +'table.prob tbody td.name{font-weight:800;width:22%}table.prob tbody td.doing{width:34%;font-size:9pt}table.prob tbody td.plan{width:44%;font-size:9pt}table.prob tbody td.plan .warn{color:#b02020;font-weight:700}'
   +'table.prob tbody tr.goc td.name{color:#0d47a1}table.prob tbody tr.dispo td.name{color:#1b5e20}table.prob tbody td ul{margin:0;padding-left:14px}table.prob tbody td li{padding:1px 0;margin:0;line-height:1.35}'
   +'.badge{display:inline-block;background:#f0883e;color:#fff;padding:0 5px;border-radius:2px;font-size:7.4pt;font-weight:700;margin-left:4px;vertical-align:middle}.badge.bl{background:#1a73e8}.badge.gr{background:#28a745}'
   +'.foot{border-top:1px solid #999;padding-top:5px;margin-top:6px;font-size:8pt;color:#444;break-inside:avoid;display:flex;justify-content:space-between;gap:8px}.foot .legend{font-style:italic}'
   +'.print-instructions{background:#fff9e6;border:1px solid #d97706;padding:8px 12px;margin-top:14px;font-size:9.5pt;border-radius:4px}.print-instructions strong{color:#7a3f00}.print-instructions ul{margin-top:4px;padding-left:20px}';
  var body='<div class="hdr"><div class="hdr-l"><h1>BED '+rsEsc(d.bed)+'</h1>'
    +'<div class="sub">'+rsEsc(d.age_sex||'')+' · Day '+day+' '+rsEsc(unit)+rsEsc(admitStr)+'</div>'
    +(dx?'<div class="dx">'+rsEsc(dx)+'</div>':'')+'</div>'
    +'<div class="hdr-r"><div class="date">'+rsDate()+'</div><div class="day">ICU Day '+day+'</div>'
    +'<div style="margin-top:4px">Rounding sheet<br>Not an SCM note</div></div></div>'
    +rsFlagsBlock(d)+rsTodayBlock(d)+rsSnapBlock(d)+rsLabsBlock(d)+rsProblemsBlock(d)
    +'<div class="foot"><div class="legend">† = inferred / not in signed SCM &nbsp;·&nbsp; (H) high &nbsp;·&nbsp; (L) low &nbsp;·&nbsp; (HH)/(LL) markedly abnormal &nbsp;·&nbsp; ⚠ safety flag</div>'
    +'<div>Bed '+rsEsc(d.bed)+' · '+rsEsc(unit)+' · '+rsDate()+' · board-generated §23</div></div>'
    +'<div class="print-instructions"><strong>Before printing:</strong><ul>'
    +'<li><strong>Margins:</strong> Default (NOT None / NOT Minimum)</li><li><strong>Scale:</strong> Default or 100% (NOT Fit-to-Page)</li>'
    +'<li><strong>Headers and footers:</strong> OFF (most common cause of top-clipping)</li><li><strong>Background graphics:</strong> ON (so flag colours + callout print)</li></ul></div>';
  return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Bed '+rsEsc(d.bed)+' — '+rsEsc(unit)+' Rounding Sheet — '+rsFile()+'</title><style>'+CSS+'</style></head><body>'+body+'</body></html>';
}

<script>/* handover.js — build the ICU-Handover-Universal D object from the board's per-bed Daily data.
   buildHandoverD(boardUnit, bedsMap) -> {unit, beds:{ "1":{...}|{empty:true} }} or null (CSU/MSU = no handover).
   The transform is a best-effort AUTO-DRAFT of the §2 editorial rules (pipeline + judgment briefs, 25-Aug-2026);
   the rendered handover tool is fully contenteditable, so the receiving physician fixes anything imperfect.
   Ordering is POSITIONAL (bed number) — never re-sorted. Privacy: pt = "Age·Sex·Day N" only. */

function hvClean(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
function hvLines(v){ if(!v)return []; if(Array.isArray(v))return v.map(hvClean).filter(Boolean);
  return String(v).split(/\r?\n/).map(hvClean).filter(Boolean); }
function hvJoin(arr, sep, cap){ var s=arr.filter(Boolean).join(sep); return cap&&s.length>cap ? s.slice(0,cap-1).replace(/[·\s]+$/,'')+'…' : s; }
function hvDay(admit){ if(!admit)return '?'; var a=new Date(admit),t=new Date(); t.setHours(0,0,0,0);
  var n=Math.floor((t-a)/86400000)+1; return (isNaN(n)||n<1)?'?':n; }

// Principle-10 filters: drop continuations / monitor-only / nursing routines; keep decisions + safety flags.
function hvTxKeep(l){
  if(/^\*\*/.test(l)) return true;                                             // safety flag — always keep
  if(/^\s*(continue|cont\.|ongoing|routine|standing|per protocol)\b/i.test(l)) return false;
  if(/foley|hob\s*\d|oral care|turn q|skin care|pressure area|nursing|mouth care/i.test(l)) return false;
  if(/^\s*(stopped|discontinued|d\/?c'?d|completed)\b/i.test(l)) return false;  // fully stopped
  return true;
}
function hvPlanKeep(l){
  if(/^\*\*/.test(l)) return true;                                             // safety flag
  if(/^\s*(continue|cont\.|monitor|observe|reassess|ongoing|routine|maintain|keep )\b/i.test(l)) return false;
  if(/^\s*consider\b.*\bif\b/i.test(l)) return false;                          // conditional pre-emptive
  return /transfer|wean|extubat|consult|discharg|chase|review|follow|start|stop|d\/?c|repeat|refer|book|call|optimi|titrat|target|await|trial|escalat|de-?escalat|switch|convert|remove|insert|plan for|for /i.test(l);
}
function hvGocClass(status){
  var s=hvClean(status).toUpperCase();
  if(/^FULL/.test(s)) return 'goc-full';
  if(/^R1/.test(s) || /^M1/.test(s)) return 'goc-r1';
  if(/^R2/.test(s)) return 'goc-r2';
  if(/^R3/.test(s) || /^C1/.test(s) || /^C2/.test(s) || /^M2/.test(s) || /COMFORT/.test(s)) return 'goc-r3';
  return 'goc-uk';
}

function bedToHandover(d, overnight){
  d=d||{};
  var day=hvDay(d.icu_admit);
  var probs=(d.problems||[]);
  var goc=probs.filter(function(p){return p&&p.type==='goc';})[0];
  var dispo=probs.filter(function(p){return p&&p.type==='dispo';})[0];
  var active=probs.filter(function(p){return p&&!p.type&&p.name;});

  var pt=hvClean(d.age_sex)+' · Day '+day;
  var admit=hvClean(d.subtitle||(d.diagnoses||[])[0]||'').replace(/^\d+[.)]\s*/,'');
  if(admit.length>90) admit=admit.slice(0,89)+'…';

  // event: prefer Claude's handover_line; else presentation + first hospital-course line
  var event=hvClean(d.handover_line);
  if(!event){
    var pres=hvLines(d.presentation).slice(0,2).join(' ');
    var hc=hvLines(d.hospital_course)[0]||'';
    event=hvClean(pres+(hc?' '+hc:''));
  }
  if(event.length>200) event=event.slice(0,199)+'…';

  var dx=hvJoin(active.map(function(p){return hvClean(p.name);}), ' · ', 150);
  var pmhx=hvJoin(hvLines(d.pmhx).slice(0,3), ' · ', 150);

  var txAll=[]; active.forEach(function(p){ hvLines(p.tx).filter(hvTxKeep).forEach(function(l){txAll.push(l);}); });
  var tx=hvJoin(txAll, ' · ', 150);

  var planAll=[]; active.forEach(function(p){ hvLines(p.plan).filter(hvPlanKeep).forEach(function(l){planAll.push(l);}); });
  (d.tasks||[]).forEach(function(t){ if(t&&t.kind==='new')planAll.push(hvClean(t.text)); else if(t&&t.kind==='stop')planAll.push('Stop '+hvClean(t.text)); });
  if(dispo&&dispo.dispo_summary) planAll.push(hvClean(dispo.dispo_summary));
  var plan=hvJoin(planAll, ' · ', 160);

  var gocClass=hvGocClass(goc&&goc.goc_status);
  var goc_text=goc?hvClean((goc.goc_status||'')+(goc.goc_note?' — '+goc.goc_note:'')):'';

  // tags (scarcity — cap 3): transfer / new / ARO
  var tags=[];
  if(dispo&&dispo.dispo_summary){ var s=dispo.dispo_summary.toLowerCase(), t='→ Transfer';
    if(/step[\s-]?down/.test(s))t='→ Step-down'; else if(/ward|floor/.test(s))t='→ Ward';
    else if(/home|discharge/.test(s))t='→ Home'; else if(/\bor\b|theatre|operat/.test(s))t='→ OR';
    tags.push({cls:'transfer-tag',text:t}); }
  if(day===1) tags.push({cls:'new-tag',text:'New Admit'});
  if(hvClean(d.aro)) tags.push({cls:'aro-tag',text:'ARO: '+hvClean(d.aro)});

  // overnight: from the board's per-bed overnight box (green strip shows only when populated)
  var ovn=hvClean(overnight);

  var bed={ pt:pt, goc:gocClass, alert:false, tags:tags.slice(0,3),
    admit:admit, event:event, overnight:ovn, dx:dx, pmhx:pmhx, tx:tx, goc_text:goc_text, plan:plan };
  if(ovn) bed._ovn_show=true;   // auto-reveal the green strip
  return bed;
}

// board unit -> handover tool unit + bed count (CSU/MSU = no handover sheet)
function hvUnitCfg(boardUnit){
  var u=String(boardUnit||'').toUpperCase();
  if(u.indexOf('PICU')>=0) return {tool:'picu', n:11};   // PICU+PICUSU combined 1–11
  if(u==='MICU') return {tool:'micu', n:10};
  if(u==='SICU') return {tool:'sicu', n:12};
  if(u==='CCU')  return {tool:'ccu', n:12};
  return null;                                            // CSU, MSU → admission-only
}

// a Claude-condensed mini-card (hv:1) — normalise to the tool's bed shape, apply board overnight
function normHvCard(c, overnight){
  c=c||{};
  var ovn=hvClean(overnight||c.overnight);
  var bed={ pt:hvClean(c.pt), goc:c.goc||'goc-uk', alert:!!c.alert, tags:(c.tags||[]).slice(0,3),
    admit:hvClean(c.admit), event:hvClean(c.event), overnight:ovn, dx:hvClean(c.dx),
    pmhx:hvClean(c.pmhx), tx:hvClean(c.tx), goc_text:hvClean(c.goc_text), plan:hvClean(c.plan) };
  if(ovn) bed._ovn_show=true;
  return bed;
}

function buildHandoverD(boardUnit, bedsMap){
  var cfg=hvUnitCfg(boardUnit); if(!cfg) return null;
  var beds={};
  for(var n=1;n<=cfg.n;n++){
    var w=bedsMap&&bedsMap[n];
    beds[String(n)] = (w&&w.hvcard) ? normHvCard(w.hvcard, w.overnight)
                    : (w&&w.d)      ? bedToHandover(w.d, w.overnight)
                    :                 {empty:true};
  }
  return {unit:cfg.tool, beds:beds};
}
</script>

var UNITS={
  'PICU+PICUSU':{ groups:[ {label:'PICU', beds:[1,2,3,4,5,6,7]}, {label:'PICUSU', beds:[8,9,10,11]} ] },
  MICU:{n:10,from:1}, SICU:{n:12,from:1}, CCU:{n:12,from:1},

};

function unitGroups(u){ var c=UNITS[u]; if(c&&c.groups)return c.groups; var a=[]; if(c){for(var i=0;i<c.n;i++)a.push(c.from+i);} return [{label:'',beds:a}]; }

if(hvOpts.font==null)hvOpts.font=1; if(hvOpts.rowmm==null)hvOpts.rowmm=67; if(hvOpts.margin==null)hvOpts.margin=7;

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function bd(n){ return beds[n]?beds[n].d:null; }               // the D (schema) object for a bed
function mintStay(){ return 's'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function fz(d){ fontScale=Math.max(0.9,Math.min(2.0, Math.round((fontScale+d)*100)/100)); try{localStorage.setItem('ub_fontscale',fontScale);}catch(e){} renderView(); }
function today(){var d=new Date(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(d.getDate()).padStart(2,'0')+'-'+m[d.getMonth()]+'-'+d.getFullYear();}
function storeKey(){return 'unitboard_'+unit+'_'+today();}
function histKey(){return 'unitboard_hist_'+unit;}

function taskCount(w){ if(!w||!w.d||!w.d.tasks)return 0; var done=w.taskDone||[],c=0;
  w.d.tasks.forEach(function(t,i){ if(done.indexOf(i)<0)c++; }); return c; }
function dispoMark(d){ if(!d)return ''; var s=''; (d.problems||[]).forEach(function(p){ if(p&&p.type==='dispo')s+=' '+(p.dispo_summary||''); });
  s=(s+' '+(d.subtitle||'')).toLowerCase();
  if(/step[\s-]?down|\bsd\b/.test(s))return '→SD';
  if(/\bward\b|\bfloor\b/.test(s))return '→W';
  if(/\bhome\b|discharge/.test(s))return '→home';
  return ''; }

function init(){
  var sel=document.getElementById('unitSel');
  Object.keys(UNITS).forEach(function(u){var o=document.createElement('option');o.value=u;o.textContent=u;sel.appendChild(o);});
  document.getElementById('dateLbl').textContent='· '+today();
  load(); renderRail(); showSec('daily');
}
function switchUnit(){ unit=document.getElementById('unitSel').value; beds={}; current=null; load(); renderRail(); showSec('daily'); }

function load(){
  try{ var raw=localStorage.getItem(storeKey()); beds=raw?JSON.parse(raw):{}; }catch(e){ beds={}; }
  // migrate any legacy records (beds[n] stored as a raw D object) into the stay-day wrapper
  Object.keys(beds).forEach(function(k){ var v=beds[k];
    if(v && v.d===undefined && (v.bed!==undefined||v.age_sex!==undefined)){
      beds[k]={ d:v, stay:mintStay(), state:'preround', overnight:'', taskDone:[] };
    }
  });
}
function save(){ try{ localStorage.setItem(storeKey(), JSON.stringify(beds)); }catch(e){} }

function bedList(){ var a=[]; unitGroups(unit).forEach(function(gr){ a=a.concat(gr.beds); }); return a; }

function renderRail(){
  var rail=document.getElementById('rail'); rail.innerHTML='';
  unitGroups(unit).forEach(function(gr){
    if(gr.label){ var h=document.createElement('div'); h.className='raillbl'; h.textContent=gr.label; rail.appendChild(h); }
    var box=document.createElement('div'); box.className='railgrp';
    gr.beds.forEach(function(n){
      var w=beds[n], b=document.createElement('button');
      b.className='bedbtn'+(w?' filled':'')+(current===n?' cur':'');
      var inner='<span class="dot"></span><span class="bn">Bed '+n+'</span>';
      if(w && w.hvcard && !w.d){ // handover-only (colleague / uncharted) bed
        inner+='<span class="st hv" title="Handover-only — not charted by you">H</span>';
        inner+='<span class="idl">'+esc((w.hvcard.pt||'handover-only').slice(0,26))+'</span>';
        var g=esc((''+(w.hvcard.goc||'')).replace('goc-','').toUpperCase());
        if(g&&g!=='UK')inner+='<span class="meta"><span class="chip">'+g+'</span></span>';
      } else if(w){ var d=w.d;
        inner+='<span class="st '+(w.state==='rounded'?'done':'pr')+'">'+(w.state==='rounded'?'✓':'PR')+'</span>';
        inner+='<span class="idl">'+(d.age_sex?esc(d.age_sex):'&mdash;')+(d.subtitle?' · '+esc((''+d.subtitle).slice(0,22)):'')+'</span>';
        var meta=[]; var code=esc(d.goc_status||d.goc||''); var tc=taskCount(w); var dm=dispoMark(d);
        if(code)meta.push('<span class="chip">'+code+'</span>');
        if(tc)meta.push('<span class="chip tsk">⚑'+tc+'</span>');
        if(dm)meta.push('<span class="chip tx">'+dm+'</span>');
        if(meta.length)inner+='<span class="meta">'+meta.join('')+'</span>';
      } else { inner+='<span class="idl empty">— open —</span>'; }
      b.innerHTML=inner;
      b.onclick=function(){ openBed(n); };
      box.appendChild(b);
    });
    rail.appendChild(box);
  });
  // Unassigned area (patients with no bed number yet) — bottom of the rail
  var uns=Object.keys(beds).filter(function(k){ return /^U\d+$/.test(k); });
  if(uns.length){
    var uh=document.createElement('div'); uh.className='raillbl'; uh.textContent='Unassigned'; rail.appendChild(uh);
    var ubox=document.createElement('div'); ubox.className='railgrp';
    uns.forEach(function(k){
      var w=beds[k], b=document.createElement('button'), d=w.d;
      b.className='bedbtn filled'+(current===k?' cur':'');
      var label=(w.hvcard&&w.hvcard.pt)||(d&&d.age_sex)||'admission';
      b.innerHTML='<span class="dot"></span><span class="bn">'+esc(k.replace('U','Unassigned '))+'</span>'
        +'<span class="st hv" title="No bed assigned yet">?</span>'
        +'<span class="idl">'+esc((''+label).slice(0,22))+(d&&d.note_type==='admission'?' · admit':'')+'</span>';
      b.onclick=function(){ openBed(k); };
      ubox.appendChild(b);
    });
    rail.appendChild(ubox);
  }
}

function renderBedBar(){
  var bar=document.getElementById('bedbar');
  if(section!=='daily' || current==null || !beds[current]){ bar.style.display='none'; bar.innerHTML=''; return; }
  var w=beds[current], d=w.d||{}, done=w.taskDone||[];
  var isUn=/^U\d+$/.test(String(current));
  var tag=isUn?String(current).replace('U','Unassigned '):('Bed '+current);
  var chips=(d.tasks||[]).map(function(t,i){
    return '<span class="taskchip k-'+(t.kind||'pending')+(done.indexOf(i)>=0?' done':'')+'" onclick="toggleTask('+i+')" title="'+esc(t.kind||'')+' — click to toggle done">'+esc(t.text||'')+'</span>';
  }).join('');
  bar.style.display='flex';
  bar.innerHTML=
    '<span class="bbtag">'+esc(tag)+'</span>'+
    (isUn?'<button class="asg" onclick="assignUnassigned()" title="Give this patient a bed number">⇱ Assign bed</button>':'')+
    '<button class="rnd" onclick="toggleRounded()">'+(w.state==='rounded'?'↺ Pre-round':'✓ Mark rounded')+'</button>'+
    '<button onclick="roundSheetForCurrent()" title="§23 A4 rounding sheet">🖨 Rounding</button>'+
    '<button class="sec" onclick="addTask()">＋ Task</button>'+
    '<span class="chips">'+chips+'</span>'+
    '<span class="spacer"></span>'+
    '<button class="sec" onclick="newAdmission(\''+current+'\')" title="Archive this note & start a new patient here">＋ New pt</button>'+
    '<button class="sec" onclick="transferBed(\''+current+'\')" title="Transfer/discharge: archive note & clear">⇥ Transfer / DC</button>';
}
function assignUnassigned(){
  if(!/^U\d+$/.test(String(current))||!beds[current])return;
  var num=prompt('Assign '+String(current).replace('U','Unassigned ')+' to which bed number?');
  if(num===null)return; num=parseInt(num,10);
  if(!num||num<1){ alert('Enter a valid bed number.'); return; }
  if(beds[num]&&!confirm('Bed '+num+' already has a patient — overwrite it?'))return;
  beds[num]=beds[current]; delete beds[num].unassigned; delete beds[current];
  current=num; save(); renderRail(); renderView();
  document.getElementById('msg').textContent='✓ Assigned to Bed '+num;
}

function isHvCard(d){ // a Claude-condensed handover mini-card
  return !!(d && (d.hv===1 || d.hv===true || (d.admit!==undefined && d.plan!==undefined && d.problems===undefined && d.age_sex===undefined && d.vitals===undefined)));
}
function nextUnassignedKey(){ var i=1; while(beds['U'+i])i++; return 'U'+i; }
function routeEntry(d){ // slot one parsed object into its bed; returns {ok,bed} or {ok:false,err}
  if(!d||typeof d!=='object'||Array.isArray(d)) return {ok:false,err:'not an object'};
  var n=d.bed;
  var isUn = (n==null) || /^(unassigned|pending|tbd|none|u\d*)$/i.test(String(n).trim());
  var hv=isHvCard(d);
  if(isUn){ // no bed yet → a fresh slot in the unit's Unassigned area (never merge)
    var key=nextUnassignedKey();
    beds[key]={ d:hv?null:d, hvcard:hv?d:null, stay:mintStay(), state:'preround', overnight:'', taskDone:[], unassigned:true };
    return {ok:true, bed:key, hv:hv};
  }
  if(beds[n]){ if(hv){beds[n].hvcard=d;} else {beds[n].d=d; beds[n].hvcard=null;} }
  else { beds[n]={ d:hv?null:d, hvcard:hv?d:null, stay:mintStay(), state:'preround', overnight:'', taskDone:[] }; }
  return {ok:true, bed:n, hv:hv};
}
function loadJSONText(t, srcMsg){
  var msg=document.getElementById('msg');
  var parsed; try{ parsed=JSON.parse(t); }catch(e){ if(msg)msg.textContent='⚠ Not valid JSON: '+e.message; return {loaded:[],err:e.message}; }
  var arr=Array.isArray(parsed)?parsed:[parsed];
  // switch unit once, from the first entry that names a known unit
  for(var i=0;i<arr.length;i++){ var u=arr[i]&&normUnit(arr[i].unit); if(arr[i]&&arr[i].unit&&UNITS[u]&&u!==unit){ unit=u; document.getElementById('unitSel').value=unit; load(); break; } }
  var loaded=[], errs=[];
  arr.forEach(function(d){ var r=routeEntry(d); if(r.ok)loaded.push(r.bed); else errs.push(r.err); });
  save();
  if(msg) msg.textContent=(loaded.length?'✓ '+(srcMsg||'Loaded')+' '+loaded.length+' bed'+(loaded.length>1?'s':'')+' ('+loaded.join(', ')+')':'')+(errs.length?' · ⚠ '+errs.join('; '):'');
  return {loaded:loaded, errs:errs};
}
function loadPaste(){
  var t=document.getElementById('pjson').value.trim();
  if(!t){ document.getElementById('msg').textContent='Paste a bed JSON (or an array) first.'; return; }
  var res=loadJSONText(t);
  if(res.loaded===undefined) return;
  document.getElementById('pjson').value='';
  renderRail();
  if(res.loaded.length===1 && section==='daily') openBed(res.loaded[0]); else renderView();
}

function setTab(s){ document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.sec===s); }); }
function renderView(){
  var view=document.getElementById('view'); view.innerHTML='';
  if(section==='daily'){
    if(current!=null){
      if(!beds[current]){ view.innerHTML='<div class="panel"><div class="stub">Bed '+current+' is empty — paste this bed&rsquo;s JSON in the box above to load it.</div></div>'; }
      else if(beds[current].hvcard && !beds[current].d){
        view.innerHTML='<div class="panel"><div class="stub"><b>Bed '+current+' — handover-only.</b><br>A colleague / uncharted bed (mini handover card, <code>hv:1</code>). It appears on the <b>Handover</b> tab. To add a full daily note, paste this bed&rsquo;s §10 JSON.</div></div>';
      }
      else {
        var d=bd(current), f=document.createElement('iframe'), html;
        if(d && d.note_type==='admission'){
          // board owns persistence → neutralise the admission tool's resume/autosave; inject zoom
          html=admissionToolHTML()
            .replace("if(D&&typeof D==='object'){","maybeRestoreState=function(){};saveState=function(){};if(D&&typeof D==='object'){")
            .replace("</head>","<style>body{zoom:"+fontScale+"}#jp{display:none!important}</style></head>")
            .replace(ADM_NEEDLE, "var D="+JSON.stringify(d)+",SCM='',U='"+admUnitCode(d)+"';");
        } else {
          html=toolHTML()
            .replace("if(D){","checkSavedState=function(d){return d;};saveState=function(){};attachSaveListeners=function(){};if(D){")
            .replace("</head>","<style>body{zoom:"+fontScale+"}#jp{display:none!important}</style></head>")
            .replace(NEEDLE, "var D="+JSON.stringify(d)+",SCM='';");
        }
        f.srcdoc=html; view.appendChild(f);
      }
    } else {
      view.innerHTML='<div class="panel"><div class="stub">Pick a bed on the left, or paste a bed JSON above. It auto-routes by the <code>bed</code> field.</div></div>';
    }
  } else if(section==='handover'){ renderHandover(view); }
  else if(section==='prompts'){ view.innerHTML=promptsPanel(); }
  renderBedBar();
}
function openBed(n){ current=n; section='daily'; setTab('daily'); renderRail(); renderView(); }
function showSec(s){ section=s; setTab(s); renderView(); }

// ---- bed lifecycle ----
function toggleRounded(){ var w=beds[current]; if(!w)return; w.state=(w.state==='rounded')?'preround':'rounded'; save(); renderRail(); renderBedBar(); }
function toggleTask(i){ var w=beds[current]; if(!w)return; w.taskDone=w.taskDone||[]; var k=w.taskDone.indexOf(i);
  if(k>=0)w.taskDone.splice(k,1); else w.taskDone.push(i); save(); renderRail(); renderBedBar(); }
function addTask(){ var w=beds[current]; if(!w)return; var t=prompt('New task / watch-item for Bed '+current+':'); if(!t)return;
  w.d.tasks=w.d.tasks||[]; w.d.tasks.push({text:t,kind:'pending'}); save(); renderRail(); renderBedBar(); }
function archiveBed(n,reason){ try{ var h=JSON.parse(localStorage.getItem(histKey())||'[]'); var w=beds[n];
  h.push({date:today(),unit:unit,bed:n,reason:reason,stay:w.stay,state:w.state,overnight:w.overnight||'',d:w.d,archivedAt:Date.now()});
  localStorage.setItem(histKey(), JSON.stringify(h)); }catch(e){} }
function newAdmission(n){ if(!beds[n])return; if(!confirm('Start a NEW admission in Bed '+n+'?\nThe current note is archived to history and the bed is cleared.'))return;
  archiveBed(n,'new-admission'); delete beds[n]; save(); renderRail(); renderView();
  document.getElementById('msg').textContent='Bed '+n+' cleared — paste the new patient’s JSON.'; }
function transferBed(n){ if(!beds[n])return; var r=prompt('Transfer / discharge Bed '+n+' — reason?\n(ward / step-down / home / died)','ward'); if(r===null)return;
  archiveBed(n, r||'transfer'); delete beds[n]; if(current===n)current=n; save(); renderRail(); renderView();
  document.getElementById('msg').textContent='Bed '+n+' transferred ('+(r||'—')+') → archived to history.'; }

// ---- handover: gold-format render (embedded ICU-Handover-Universal) + print options + colleague paste ----
function renderHandover(view){
  var D=buildHandoverD(unit, beds);
  if(!D){
    view.innerHTML='<div class="panel"><div class="stub"><b>'+esc(unit)+'</b> is admission-only — no handover sheet. Handover is for MICU · SICU · CCU · PICU+PICUSU.</div></div>';
    return;
  }
  var occ=Object.keys(D.beds).filter(function(k){return !D.beds[k].empty;}).length;
  var emptyNums=[]; Object.keys(D.beds).forEach(function(k){ if(D.beds[k].empty)emptyNums.push(k); });
  var opts=emptyNums.map(function(k){return '<option value="'+k+'">Bed '+k+'</option>';}).join('');
  var bar='<div id="hvbar">'
    +'<b>Handover — '+esc(unit)+' · '+today()+'</b> <span style="color:#667">'+occ+' occupied</span>'
    +'<span class="hvsp"></span>'
    +'<span class="grp">Font <button class="fzb" onclick="hvAdj(\'font\',-0.05)">A&minus;</button><button class="fzb" onclick="hvAdj(\'font\',0.05)">A+</button></span>'
    +'<span class="grp">Row <button class="fzb" onclick="hvAdj(\'rowmm\',-2)">&minus;</button><span class="val">'+hvOpts.rowmm+'mm</span><button class="fzb" onclick="hvAdj(\'rowmm\',2)">+</button></span>'
    +'<span class="grp">Margin <button class="fzb" onclick="hvAdj(\'margin\',-1)">&minus;</button><span class="val">'+hvOpts.margin+'mm</span><button class="fzb" onclick="hvAdj(\'margin\',1)">+</button></span>'
    +'<button class="sec2" onclick="hvReset()">reset</button>'
    +'<button class="sec2" onclick="hvTips()">Print tips</button>'
    +'<button class="go prt" onclick="printHandover()">🖨 Print</button>'
    +'</div>';
  var coll='<div id="collarea"><div class="collhdr">Add a bed you didn’t chart — paste a mini-JSON / an array (from <code>handover beds:</code>, routes by bed) or a raw progress note (pick the bed):</div>'
    +'<div class="collrow"><select id="collbed">'+(opts||'<option>—</option>')+'</select>'
    +'<textarea id="collta" placeholder="Paste mini-JSON, an array, or a progress note…"></textarea>'
    +'<button onclick="loadColleagueBox()">⤵ Add</button></div></div>';
  view.innerHTML='<div style="position:absolute;inset:0;display:flex;flex-direction:column">'+bar+'<div id="hvview"></div>'+coll+'</div>';
  var host=document.getElementById('hvview');
  var f=document.createElement('iframe'); f.id='hvframe';
  var over='<style>.unit-btns{display:none!important}body{zoom:'+hvOpts.font+'}'
    +'@page{size:A4 portrait;margin:'+hvOpts.margin+'mm 3mm}'
    +'.bed-card,.notes-cell-content{height:'+hvOpts.rowmm+'mm!important;max-height:'+hvOpts.rowmm+'mm!important}'
    +'</style></head>';
  var html=handoverToolHTML().replace('</head>',over).replace('var D = null;','var D = '+JSON.stringify(D)+';');
  f.srcdoc=html; host.appendChild(f);
}
function hvAdj(k,delta){
  var lo={font:0.7,rowmm:55,margin:2}[k], hi={font:1.4,rowmm:85,margin:20}[k];
  hvOpts[k]=Math.max(lo,Math.min(hi, Math.round(((hvOpts[k]||0)+delta)*100)/100));
  hvSave(); renderView();
}
function hvReset(){ hvOpts={font:1,rowmm:67,margin:7}; hvSave(); renderView(); }
function printHandover(){ var f=document.getElementById('hvframe');
  if(f&&f.contentWindow){ try{f.contentWindow.focus();f.contentWindow.print();}catch(e){alert('Use the sheet’s own Print button, or Ctrl/Cmd+P inside it.');} } }
function hvTips(){ alert('Print settings (Chrome print dialog):\n• Paper: A4 · Portrait\n• Margins: Default\n• Scale: 100%  (NOT Fit to page)\n• Headers and footers: OFF   ← the usual top-clipping culprit\n• Background graphics: ON     ← colours + GoC badges\n\nIf cards clip at the bottom, nudge Row − or Font − in the bar above.'); }
function loadColleagueBox(){
  var ta=document.getElementById('collta'); if(!ta)return; var t=(ta.value||'').trim(); if(!t)return;
  var isJson=false; try{ JSON.parse(t); isJson=true; }catch(e){}
  if(isJson){ loadJSONText(t,'Added'); ta.value=''; renderRail(); renderView(); return; }
  var sel=document.getElementById('collbed'); var k=sel?sel.value:null;
  if(!k||k==='—'){ alert('Pick a bed for the pasted progress note.'); return; }
  routeEntry({ bed:parseInt(k,10), hv:1, pt:'Bed '+k, event:t.replace(/\s+/g,' ').slice(0,1500), _raw:true });
  save(); ta.value=''; renderRail(); renderView();
}

function promptsPanel(){
  var rows=[
    ['icu daily Bed N:','Consolidate a bed’s notes into a daily SCM note (then paste the JSON here).'],
    ['icu daily update Bed N:','Update an existing daily note.'],
    ['icu admission Bed N:','New ICU admission note.'],
    ['icu admission update Bed N:','Update an admission note.'],
    ['icu admission Bed unassigned:','Admission with no bed yet → Unassigned area (also accepts "pending").'],
    ['handover bed N:','Colleague/uncharted bed → condense a note into a handover mini-JSON (hv:1). Paste into the board.'],
    ['handover beds:','Batch: paste several notes → get a JSON array of mini-cards → one paste loads them all.'],
    ['daily handover','Build the unit handover (or use the board Handover tab).'],
    ['feedback log:','Log a mid-shift tweak/observation.'],
    ['feedback review:','Review & consolidate feedback off-shift.'],
    ['start shift: DD Mon YYYY UNIT','Open the shift anchor tab.']
  ].map(function(p){return '<tr style="border-top:1px solid #eef"><td style="padding:6px 10px"><code>'+esc(p[0])+'</code></td><td style="padding:6px 10px;color:#445">'+esc(p[1])+'</td></tr>';}).join('');
  return '<div class="panel"><div class="census" style="max-width:760px"><b>ICU prompts / triggers</b>'+
    '<table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:13px">'+rows+'</table></div></div>';
}

// §23 rounding sheet for the current bed (uses live edits via the tool's captureToD when reachable)
function roundSheetForCurrent(){
  if(current==null||!beds[current]){ alert('Load a bed first (paste its JSON).'); return; }
  var d=bd(current);
  try{ var ifr=document.querySelector('#view iframe'); if(ifr&&ifr.contentWindow&&typeof ifr.contentWindow.captureToD==='function'){ var ed=ifr.contentWindow.captureToD(); if(ed&&ed.bed!=null)d=ed; } }catch(e){}
  var html=renderRoundingSheet(d);
  var w=window.open('','_blank');
  if(w){ w.document.open(); w.document.write(html); w.document.close(); }
  else { alert('Popup blocked — allow popups for this page to open the rounding sheet.'); }
}

// convenience: paste auto-loads; Cmd/Ctrl+Enter also loads
var pj=document.getElementById('pjson');
pj.addEventListener('paste', function(){ setTimeout(loadPaste, 40); });
pj.addEventListener('keydown', function(e){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); loadPaste(); } });
init();
</script>
