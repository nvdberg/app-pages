n (what the gap-check flags)\nThiamine given before/with glucose? · CIWA-Ar (or equivalent) scoring documented? · symptom-triggered vs fixed dosing rationale stated? ·\nelectrolytes (Mg/K/PO4) corrected? · escalation plan for refractory DTs (phenobarbital/propofol) documented? ·\naddiction medicine/social work referral arranged?\n\n*Sources: [ASAM Clinical Practice Guideline on Alcohol Withdrawal Management (PubMed)](https://pubmed.ncbi.nlm.nih.gov/32511109/) · [Executive Summary — ASAM Guideline (PubMed)](https://pubmed.ncbi.nlm.nih.gov/32909985/)*\n"}, {"file": "anaphylaxis-aaaai-acaai-2023.md", "title": "Anaphylaxis", "system": "Other", "body": "# Anaphylaxis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Anaphylaxis: A 2023 Practice Parameter Update (Golden DBK, Wang J, Waserman S, Akin C, et\n> al., Joint Task Force on Practice Parameters: AAAAI/ACAAI/JCAAI), *Annals of Allergy, Asthma &\n> Immunology* 2023 (in press/2024).\n> https://www.annallergy.org/article/S1081-1206(23)01304-2/fulltext\n> **This 2023 update explicitly COMPLEMENTS, and does NOT replace, the 2020 GRADE guideline** (Anaphylaxis\n> — A 2020 Practice Parameter Update, Systematic Review, and GRADE Analysis) — the authors state it is\n> \"meant to update the selected topics ... does not entirely replace or supersede\" the 2020 document.\n> **This checklist therefore integrates both**: the 2020 GRADE guideline remains the base for immediate\n> management, refractory treatment, and disposition; the 2023 update adds/revises the 7 areas below\n> (diagnosis/tryptase, infants/toddlers, community settings, epinephrine autoinjectors, beta-blockers/ACEIs,\n> mast cell disorders, perioperative anaphylaxis) where new evidence has emerged since 2020.\n> **Compiled:** 06-Sep-2026 · Claude Code · base guideline 2020 GRADE + 2023 practice parameter update\n> (check for a newer edition periodically)\n\n## Immediate management — epinephrine is first-line, do not delay for anything *(2020 GRADE base, unchanged)*\n- [ ] **Recognize anaphylaxis** — acute onset with skin/mucosal + respiratory, cardiovascular, or severe GI involvement (severe GI alone can qualify); 2023 update notes **revised harmonized criteria** (WAO/Brighton/Delphi consensus work in progress) toward more universally accepted definitions — *verify current wording in use locally*\n- [ ] **Epinephrine IM, anterolateral thigh, immediately** — standard dosing **0.01 mg/kg**, up to **0.3 mg** for children/teens <30 kg (2023 update notes a **0.1 mg** dose option available for infants/toddlers **7.5–15 kg**), **0.5 mg max for ≥30 kg/adults** *(verify weight-based dose against device availability)* — **first-line, no absolute contraindication**\n- [ ] **Repeat epinephrine every 5–15 min** if inadequate response — *verify interval*\n- [ ] **Position supine (or per tolerance/respiratory status) with legs elevated** unless respiratory distress dictates otherwise; avoid sudden standing (empty ventricle syndrome risk)\n- [ ] **High-flow oxygen** and **IV access** established immediately\n- [ ] **IV crystalloid bolus** for hypotension/poor perfusion\n\n## Refractory anaphylaxis *(2020 GRADE base, unchanged)*\n- [ ] **Epinephrine infusion** if inadequate response to repeated IM doses — <dose/titration — verify local protocol>\n- [ ] **Glucagon** if patient on beta-blockers and refractory to epinephrine — <dose — verify>\n- [ ] **Vasopressor support** if shock persists despite epinephrine + fluids\n- [ ] **Bronchodilators (inhaled beta-agonist)** as adjunct for persistent bronchospasm — **not a substitute for epinephrine**\n\n## Adjunctive therapy (secondary — never delay epinephrine for these) *(2020 GRADE base, unchanged)*\n- [ ] **H1 antihistamine** for cutaneous symptom relief only — does not treat airway/hemodynamic compromise\n- [ ] **H2 antihistamine** — adjunctive, weak evidence\n- [ ] **Corticosteroids** — adjunctive, **not first-line and not proven to prevent biphasic reactions** — *verify institutional practice*\n\n## Diagnosis & tryptase — new in 2023\n- [ ] **Serum total tryptase (bST) measured** in patients presenting with **recurrent, idiopathic, or\n  severe anaphylaxis**, **Hymenoptera venom anaphylaxis**, or **suspected mastocytosis** — not a\n  routine test for every mild/first-episode presentation\n- [ ] **Hereditary alpha-tryptasemia (HaT) / clonal mast cell disease evaluation** considered if\n  baseline serum tryptase **>8 ng/mL** *(verify against local lab reference range/timing)*\n- [ ] **Acute (peri-event) tryptase** interpreted relative to the patient's own **baseline** — an acute\n  rise supports the diagnosis; a normal acute tryptase does **not** rule out anaphylaxis\n\n## Special populations — infants/toddlers and community settings — new in 2023\n- [ ] **Infant/toddler anaphylaxis**: age is **not correlated with reaction severity**; anaphylaxis is\n  **unlikely to be the first reaction on first allergen exposure**; use **NIAID/FAAN or WAO** age-appropriate\n  diagnostic criteria (no infant-specific criteria set exists) — signs may be non-specific/age-atypical\n- [ ] **Community-setting preparedness** (school, childcare, dining, travel) counseled — undesignated\n  epinephrine autoinjector stocking supported for childcare/schools; caregivers counseled on early\n  administration — **early epinephrine use reduces biphasic-reaction risk and hospitalization need**,\n  there is no evidence pre-emptive epinephrine in an asymptomatic patient prevents anaphylaxis\n\n## Beta-blockers / ACE inhibitors — updated guidance in 2023\n- [ ] **Do NOT reflexively stop beta-blockers/ACEIs** in patients at anaphylaxis risk — for most\n  indications the risk of stopping/changing the medication may **exceed** the risk of more severe\n  anaphylaxis if continued, especially for **insect-sting anaphylaxis on venom immunotherapy (VIT)**\n- [ ] **Shared decision-making** applied when balancing cardiac indication vs theoretical anaphylaxis-severity\n  risk — document the discussion rather than stopping/continuing by default\n\n## Mast cell disorders — new in 2023\n- [ ] **Suspected mastocytosis/clonal mast cell disease evaluated** in adults with **severe insect sting\n  anaphylaxis** (particularly with hypotension and/or absence of urticaria) or **recurrent idiopathic\n  anaphylaxis** — consider **REMA score** to guide bone marrow biopsy decision\n- [ ] Patients with mastocytosis **continue VIT indefinitely** if on it (higher systemic-reaction rate\n  but reduced frequency/severity of reactions vs no VIT)\n\n## Perioperative anaphylaxis (POA) — new in 2023\n- [ ] **Acute tryptase rise interpreted against baseline** — a value ≥120% of baseline bST + 2 ng/mL\n  supports systemic mast cell activation *(verify exact formula against source)*\n- [ ] **Skin testing (percutaneous/intradermal) and/or in-vitro specific-IgE testing** performed for all\n  potential pharmacologic/nonpharmacologic culprits used during the perioperative period, where available\n- [ ] **Repeat anesthesia** proceeds via **shared decision-making**, informed by testing/challenge results\n  when feasible; avoidance of culprit agents considered if testing/challenge not feasible\n\n## Observation & disposition *(2020 GRADE base, unchanged)*\n- [ ] **Individualize observation duration by severity/risk factors** — 2020 update moved away from a universal fixed period; consider risk factors: need for >1 epinephrine dose, delayed initial epinephrine, severe initial presentation\n- [ ] **Extended observation (up to 6 h or longer)** for higher biphasic-reaction risk; **~1 h** may suffice for a mild, fully-resolved reaction with no risk factors — *verify against source and local practice*\n- [ ] **Prescribe/ensure epinephrine auto-injector** and teach use before discharge\n- [ ] **Allergy follow-up referral** for trigger identification and testing\n- [ ] **Document trigger, timeline, and treatment response** clearly for future risk counseling\n\n## Commonly-missed on documentation (what the gap-check flags)\nEpinephrine IM given first (not antihistamine/steroid first)? · time-to-first-epinephrine documented? ·\nrepeat dosing/infusion escalation documented if refractory? · glucagon considered if on beta-blocker? ·\nbeta-blocker/ACEI continued/stopped decision explicitly reasoned (not reflexive)? · tryptase drawn when\nindicated (recurrent/idiopathic/severe/venom/suspected mastocytosis)? · observation duration\nindividualized by risk factors (not just fixed default)? · auto-injector prescribed + allergy follow-up\narranged?\n\n*Sources: [Anaphylaxis: A 2023 Practice Parameter Update — Ann Allergy Asthma Immunol](https://www.annallergy.org/article/S1081-1206(23)01304-2/fulltext) · [Anaphylaxis: A 2023 practice parameter update — PubMed](https://pubmed.ncbi.nlm.nih.gov/38108678/) · [Anaphylaxis — A 2020 Practice Parameter Update, Systematic Review, and GRADE Analysis (AAAAI PDF)](https://www.aaaai.org/Aaaai/media/MediaLibrary/PDF%20Documents/Practice%20and%20Parameters/Anaphylaxis-2020-grade-document.pdf) · [A Clinical Practice Guideline for the Emergency Management of Anaphylaxis (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC8996305/)*\n"}, {"file": "aortic-dissection-accaha-2022.md", "title": "Acute aortic dissection", "system": "Cardiac", "body": "# Acute aortic dissection — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease (Isselbacher EM et al.,\n> ACC/AHA Joint Committee on Clinical Practice Guidelines), *Circulation* / *JACC* 2022.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001106\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022\n\n## Rapid recognition\n- [ ] Suspect with **abrupt, severe chest/back/abdominal pain** (\"tearing\"/\"ripping\") — pain intensity peaks at onset (unlike ACS)\n- [ ] Check **pulse and BP in both arms** — pulse deficit or **>20 mmHg interarm SBP differential** raises suspicion\n- [ ] Auscultate for **new diastolic murmur of aortic regurgitation**\n- [ ] CXR may show **widened mediastinum** — normal CXR does NOT exclude AAS\n- [ ] Consider acute aortic syndrome (dissection / intramural hematoma / penetrating ulcer) in any undifferentiated shock, syncope, stroke, or MI-mimic with atypical features\n\n## Emergent imaging & classification\n- [ ] **CT angiography chest/abdomen/pelvis** — first-line if patient stable enough to transport\n- [ ] **TEE at bedside** if hemodynamically unstable / cannot leave resuscitation area\n- [ ] MRI generally avoided acutely (acquisition time, limited monitoring access)\n- [ ] Classify **Stanford A (ascending involved) vs Stanford B (descending only)** — drives the management pathway\n- [ ] Note DeBakey type, entry tear location, extent, and any periaortic/pericardial fluid\n\n## Immediate stabilization — anti-impulse therapy & pain control\n- [ ] **Arterial line** for continuous BP monitoring as soon as feasible (do not delay initial therapy to place)\n- [ ] **IV beta-blocker first** to control heart rate and reduce dP/dt/aortic wall stress — target HR **60–80 bpm** *(verify)*\n- [ ] **Add IV vasodilator** (e.g. nitroprusside/nicardipine) only after beta-blockade if BP remains elevated — target SBP **<120 mmHg or lowest tolerated preserving end-organ perfusion** *(verify)*\n- [ ] Do **not** start a vasodilator alone first (unopposed vasodilation → reflex tachycardia → increased wall stress)\n- [ ] **Adequate analgesia** (IV opioids) — pain itself drives sympathetic tone/HR/BP\n- [ ] Avoid **anticoagulants/antiplatelets/thrombolytics** once dissection is suspected/confirmed\n\n## Definitive management pathway\n- [ ] **Type A (ascending): emergent cardiothoracic surgery consultation** — surgical emergency, mortality ~1–2%/hour untreated\n- [ ] **Type A with malperfusion** (renal/mesenteric/limb): urgent surgery still indicated; involve surgery immediately regardless\n- [ ] **Type B uncomplicated: medical management first-line** (anti-impulse therapy as above)\n- [ ] **Type B complicated** (rupture, malperfusion, extension, refractory pain, uncontrolled HTN despite therapy) → **TEVAR preferred over open repair** when anatomy suitable\n- [ ] Involve **vascular/CT surgery early** even for \"uncomplicated\" Type B to establish surveillance plan\n\n## Malperfusion surveillance & serial exams\n- [ ] Serial neuro exams — **cerebral** malperfusion (stroke, syncope, altered LOC)\n- [ ] Serial cardiac markers/ECG — **coronary** malperfusion (dissection can occlude coronary ostia, mimic MI)\n- [ ] Neuro checks of lower extremities/back — **spinal cord** malperfusion (paraparesis/paraplegia)\n- [ ] Abdominal exam, lactate trend — **mesenteric** malperfusion\n- [ ] Renal function trend, urine output — **renal** malperfusion\n- [ ] Pulses/perfusion all four limbs — **limb** malperfusion\n- [ ] Repeat imaging if new deficit, hemodynamic change, or refractory pain — treat as evolving until proven stable\n\n## Goals of care\n- [ ] Discuss **high mortality of untreated Type A** and surgical risk with patient/family early\n- [ ] Document **goals-of-care / surrogate decision-maker** discussion, especially if surgical candidacy uncertain or comorbidity-limited\n\n## Commonly-missed on documentation (what the gap-check flags)\nInterarm BP differential checked? · classification (A vs B) stated? · beta-blocker documented BEFORE vasodilator? ·\nHR/BP targets stated? · anticoagulation/thrombolytics explicitly held? · surgery/vascular consult timestamped for Type A? ·\nmalperfusion systems reviewed (coronary/cerebral/spinal/mesenteric/renal/limb)? · GoC discussion documented?\n\n*Sources: [2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001106) · [Full text (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC9876736/) · [2022 Guideline on Aortic Disease — Key Perspectives, Part 2 — ACC.org](https://www.acc.org/latest-in-cardiology/ten-points-to-remember/2022/11/01/12/21/2022-guideline-on-aortic-disease-2-gl-ad)*\n"}, {"file": "ards-ats-esicm-sccm-2017.md", "title": "ARDS", "system": "Respiratory", "body": "# ARDS — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** An Official American Thoracic Society/European Society of Intensive Care Medicine/Society\n> of Critical Care Medicine Clinical Practice Guideline: Mechanical Ventilation in Adult Patients with\n> Acute Respiratory Distress Syndrome (Fan E et al., ATS/ESICM/SCCM), *American Journal of Respiratory\n> and Critical Care Medicine* 2017.\n> https://www.atsjournals.org/doi/full/10.1164/rccm.201703-0548ST\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2017 (check for a newer edition periodically —\n> ESICM/ATS focused updates have circulated since; verify no superseding version exists locally)\n\n## Diagnosis & severity\n- [ ] **Berlin definition** applied — onset within 1 week of insult, bilateral opacities not fully\n  explained by effusion/collapse/nodules, respiratory failure not fully explained by cardiac\n  failure/fluid overload *(verify criteria)*\n- [ ] Severity graded by **PaO₂/FiO₂ on PEEP ≥5** — mild / moderate / severe thresholds *(verify cutoffs)*\n\n## Lung-protective ventilation — apply to ALL ARDS\n- [ ] **Tidal volume 4–8 mL/kg predicted body weight** — start ~**6 mL/kg**, titrate up only for side\n  effects *(strong rec — verify PBW calculation)*\n- [ ] **Plateau pressure < 30 cmH₂O** *(strong rec — verify measurement technique, end-inspiratory hold)*\n- [ ] **Higher PEEP strategy** for moderate–severe ARDS (PaO₂/FiO₂ <200) — per PEEP/FiO₂ table *(conditional\n  rec — verify table used)*\n- [ ] **Avoid high-frequency oscillatory ventilation (HFOV)** for routine use — strong rec against\n  (associated with harm)\n\n## Severe ARDS adjuncts\n- [ ] **Prone positioning ≥12 h/day** for severe ARDS (PaO₂/FiO₂ <150) *(strong rec — verify institutional\n  protocol/expertise before initiating)*\n- [ ] **Recruitment maneuvers** — conditional rec; avoid in hypovolemia/shock *(verify technique — sustained\n  high pressure vs stepwise PEEP)*\n- [ ] **Neuromuscular blockade** — consider short early course in severe ARDS with ventilator dyssynchrony\n  refractory to sedation *(evidence mixed post-ROSE trial — verify current local practice)*\n- [ ] **ECMO referral** for refractory severe hypoxemia despite optimized conventional strategy — refer\n  early to an ECMO center *(no formal for/against recommendation in this guideline — verify institutional\n  threshold)*\n\n## Supportive care bundle\n- [ ] **Conservative fluid strategy** once shock resolved (net-even/negative balance) *(verify targets)*\n- [ ] Sedation minimization / daily interruption paired with SBT screening\n- [ ] VTE prophylaxis · stress-ulcer prophylaxis unless contraindicated\n- [ ] Early enteral nutrition when feasible\n- [ ] Identify and treat the underlying precipitant (sepsis, aspiration, pancreatitis, transfusion, etc.)\n\n## Commonly-missed on documentation (what the gap-check flags)\nPlateau pressure recorded (not just peak)? · PEEP/FiO₂ table used and cited? · prone positioning\nduration ≥12h documented? · fluid balance strategy stated post-shock? · ECMO referral considered/declined\nwith reasoning for refractory hypoxemia? · precipitating cause identified?\n\n*Sources: [ATS/ESICM/SCCM 2017 ARDS mechanical ventilation guideline — AJRCCM](https://www.atsjournals.org/doi/full/10.1164/rccm.201703-0548ST) · [Summary for Clinicians — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC5566274/)*\n"}, {"file": "aspiration-pneumonitis-pneumonia-general-2024.md", "title": "Aspiration pneumonitis / aspiration pneumonia", "system": "Respiratory", "body": "# Aspiration pneumonitis / aspiration pneumonia — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **No single dedicated society bundle guideline was identified for aspiration pneumonitis/pneumonia** —\n> this checklist is compiled as **general standard-of-care**, drawn from NCBI Bookshelf (StatPearls)\n> reviews and the relevant statement on anaerobic coverage in the 2019 ATS/IDSA CAP guideline. **Confirm\n> against local protocol.**\n> **Sources:** Aspiration Pneumonia, StatPearls (NCBI Bookshelf), updated periodically —\n> https://www.ncbi.nlm.nih.gov/books/NBK470459/ ; Diagnosis and Treatment of Adults with\n> Community-acquired Pneumonia (ATS/IDSA), *AJRCCM* 2019.\n> **Compiled:** 06-Sep-2026 · Claude Code · no fixed guideline year (general standard-of-care)\n\n## Distinguish the two entities first\n- [ ] **Aspiration pneumonitis** = chemical injury from aspirated gastric contents — largely\n  **noninfectious**, managed supportively; reassess at ~48 h for secondary infection\n- [ ] **Aspiration pneumonia** = infectious process in a patient with dysphagia/risk factors — treat as\n  pneumonia (community- or hospital-acquired pattern per setting)\n\n## Immediate management (witnessed/suspected aspiration event)\n- [ ] Positioning to limit further aspiration — lateral positioning, oropharyngeal suction *(verify\n  local protocol)*\n- [ ] Supplemental oxygen targeting **94–98% SpO₂** *(verify)*\n- [ ] Bronchoscopy considered if suspected large-particulate aspiration or airway obstruction *(verify\n  indication)*\n- [ ] **Do not give prophylactic antibiotics** for a witnessed aspiration event without evidence of\n  infection — pneumonitis is chemical, not infectious *(verify against local practice)*\n\n## Antibiotic therapy — aspiration pneumonia only\n- [ ] **Anaerobic coverage NOT routinely required** — outdated practice; cover per standard\n  CAP/HAP pathogens for the care setting *(verify per current local CAP/HAP protocol)*\n- [ ] Reserve **added anaerobic coverage** for classic aspiration pleuropulmonary syndrome (witnessed\n  loss of consciousness + gingival disease/esophageal motility disorder) *(verify)*\n- [ ] Regimen chosen per severity and community- vs hospital-acquired setting *(agents — verify local\n  antibiogram)*\n- [ ] **Duration ≥5 days**, longer if abscess/empyema develops *(verify)*\n\n## Adjunctive / supportive care\n- [ ] **No routine corticosteroids** — unproven benefit in either pneumonitis or pneumonia *(verify)*\n- [ ] **Swallowing evaluation** (bedside screen → formal SLP assessment) before resuming oral intake\n- [ ] Aspiration precautions: **HOB elevation** *(angle — verify, commonly ≥30–45°)*, diet-texture\n  modification, oral hygiene/toothbrushing\n- [ ] Nutrition: **enteral feeding** if NPO >3 days or <50% of nutritional needs met for >10 days\n  *(verify)*\n- [ ] Interprofessional input — SLP, dietitian, nursing, pharmacy\n\n## Commonly-missed on documentation (what the gap-check flags)\nPneumonitis vs pneumonia explicitly distinguished in the note? · unnecessary prophylactic antibiotics\navoided for a witnessed event without infection evidence? · anaerobic coverage justified only for\nclassic aspiration syndrome, not by default? · swallow evaluation ordered before oral intake resumed? ·\nHOB elevation + oral care documented as precautions?\n\n*Sources: [Aspiration Pneumonia — StatPearls, NCBI Bookshelf](https://www.ncbi.nlm.nih.gov/books/NBK470459/) · [Aspiration Pneumonia (Nursing) — StatPearls](https://www.ncbi.nlm.nih.gov/books/NBK568770/) · [Aspiration syndromes: aspiration pneumonia and pneumonitis — PubMed](https://pubmed.ncbi.nlm.nih.gov/20469622/) · [ATS/IDSA 2019 CAP guideline — AJRCCM](https://www.atsjournals.org/doi/10.1164/rccm.201908-1581ST)*\n"}, {"file": "bradyarrhythmia-chb-acchrs-2018.md", "title": "Bradyarrhythmia / complete heart block", "system": "Cardiac", "body": "# Bradyarrhythmia / complete heart block — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2018 ACC/AHA/HRS Guideline on the Evaluation and Management of Patients With Bradycardia\n> and Cardiac Conduction Delay (Kusumoto FM et al., ACC/AHA Task Force on Clinical Practice Guidelines\n> + Heart Rhythm Society), *Circulation* 2019;140:e382–e482 / *J Am Coll Cardiol* 2019;74(7):e51–e156.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000000628 — acute drug/pacing steps cross-referenced\n> against the AHA ACLS Adult Bradycardia Algorithm (cpr.heart.org).\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2018 (check for a newer edition periodically)\n\n## First: is this patient unstable, and what block is it?\n- [ ] **Assess for instability driving urgency** — hypotension, altered mental status, signs of shock,\n      ischemic chest pain/ECG changes, acute heart-failure signs — symptomatic bradycardia mandates\n      immediate treatment regardless of rate\n- [ ] **Classify the block on the 12-lead/telemetry** — Mobitz I (Wenckebach) vs Mobitz II vs\n      complete/3rd-degree AV block — type changes both urgency and permanent-pacemaker indication\n- [ ] **Continuous telemetry** for the duration of the acute episode and while any reversible cause is\n      being corrected\n- [ ] Mobitz II, high-grade AV block, and 3rd-degree/complete block **not due to a reversible cause** →\n      permanent pacing indicated **regardless of symptoms** *(verify against current recommendation\n      class)*; Mobitz I is usually lower urgency unless symptomatic\n\n## Identify and correct reversible causes (before committing to permanent pacing when possible)\n- [ ] **Acute MI, especially inferior** (AV-nodal ischemia) — ECG + troponin\n- [ ] **Hyperkalemia** — stat electrolytes; treat per hyperkalemia protocol if present\n- [ ] **Drug toxicity** — beta-blocker, calcium-channel blocker, digoxin (levels if suspected); review\n      MAR for recent doses/overdose\n- [ ] **Hypothyroidism** — TSH if suspected\n- [ ] **Lyme carditis** — Lyme titers in young patients / endemic-area exposure with new AV block\n- [ ] **Increased vagal tone** — situational (pain, vomiting, suctioning, straining)\n- [ ] **Post-cardiac-surgery** conduction injury (recent valve/CABG — often transient, may need\n      temporary epicardial wires already in place)\n- [ ] **Infiltrative disease** — sarcoidosis, amyloidosis (consider if unexplained/progressive)\n\n## Acute pharmacologic therapy (symptomatic bradycardia)\n- [ ] **Atropine** first-line — **1 mg IV, verify** q3–5min, max **3 mg — verify** *(dose per current\n      ACLS; confirm against local protocol)*\n- [ ] **Limited/unreliable efficacy** in high-grade AV block (Mobitz II, complete/3rd-degree, wide-complex\n      escape) and in the **transplanted (denervated) heart** — do not delay pacing awaiting response\n- [ ] If atropine fails or is inappropriate → **second-line infusion**: dopamine **2–10 mcg/kg/min —\n      verify** or epinephrine **2–10 mcg/min — verify**, titrated to response, as a temporizing bridge\n      while pacing is arranged\n\n## Transcutaneous pacing (bridge)\n- [ ] Apply pads promptly for symptomatic high-grade block unresponsive to atropine — do not wait for\n      drug titration to fail completely if instability is significant\n- [ ] **Analgesia/sedation** before/during capture — transcutaneous pacing is painful\n- [ ] Confirm **mechanical capture** (palpable pulse/arterial waveform matching paced rate), not just\n      electrical spikes\n- [ ] Treat as a **bridge only** — proceed to transvenous pacing if ongoing pacing need anticipated\n\n## Transvenous pacing\n- [ ] Indicated for **hemodynamically significant bradycardia refractory to atropine/second-line drugs**,\n      or as definitive bridge when transcutaneous capture is unreliable/poorly tolerated\n- [ ] Insert under continuous ECG/hemodynamic monitoring; confirm capture and stable threshold; secure\n      and document threshold, sensing, rate settings\n- [ ] Reassess need daily; do not leave in longer than necessary (infection/perforation risk)\n\n## Disposition and permanent pacing pathway\n- [ ] **Cardiology/EP consultation** for any high-grade or complete AV block, or if temporary pacing is\n      required, to evaluate for **permanent pacemaker**\n- [ ] Document whether the cause is **reversible** (treat first) vs **irreversible/structural**\n      (proceed toward PPM per guideline-directed indications)\n- [ ] If reversible cause corrected and block resolves, document resolution and ongoing monitoring plan\n      before deferring PPM\n- [ ] Document block type, symptom correlation, and reversible-cause workup clearly — these drive the\n      PPM indication class\n\n## Commonly-missed on documentation (what the gap-check flags)\nBlock type (Mobitz I/II/complete) documented? · instability/symptoms explicitly linked to bradycardia? ·\nreversible-cause workup (K+, TSH, drug levels, troponin, Lyme if applicable) charted? · atropine response\n(or noted unreliable in high-grade block) · pacing modality + capture confirmation + analgesia for\ntranscutaneous · EP/cardiology consult for PPM evaluation · telemetry continuity documented\n\n*Sources: [2018 ACC/AHA/HRS Guideline on Bradycardia and Cardiac Conduction Delay — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000000628) · [Executive Summary — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000000627) · [AHA Adult Bradycardia Algorithm — cpr.heart.org](https://cpr.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/2025-Algorithms/Algorithm-ACLS-Bradycardia-250514.pdf)*\n"}, {"file": "cardiac-tamponade-esc-2025.md", "title": "Cardiac tamponade", "system": "Cardiac", "body": "# Cardiac tamponade — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2025 ESC Guidelines for the management of myocarditis and pericarditis, European Society\n> of Cardiology (ESC), *European Heart Journal* 2025 (supersedes the tamponade content of the 2015 ESC\n> Guidelines for the diagnosis and management of pericardial diseases).\n> https://academic.oup.com/eurheartj/article/46/40/3952/8234483\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (check for a newer edition periodically)\n\n## Clinical recognition & bedside echo confirmation\n- [ ] Suspect with hypotension + raised JVP + muffled heart sounds (**Beck's triad**) — classic in acute *\"surgical\"* tamponade (trauma/rupture); often **absent in slow \"medical\" tamponade** — low sensitivity, do not rely on it alone\n- [ ] Check for **pulsus paradoxus** — inspiratory fall in systolic BP **≥10 mmHg** *(verify)* — reflects exaggerated ventricular interdependence\n- [ ] Other clues: tachycardia, BP <90 mmHg (more pronounced in acute vs subacute/chronic tamponade), enlarged cardiac silhouette (CXR), low-voltage/electrical alternans + \"swinging heart\" (ECG)\n- [ ] Diagnosis is a **clinical diagnosis confirmed by echo** — no single sign is sufficient; the guideline's triage tool weighs aetiology + clinical + imaging findings together rather than effusion size alone *(cumulative score ≥6 → immediate pericardiocentesis — verify scoring)*\n- [ ] Urgent bedside TTE: effusion size/circumferential vs loculated + swinging heart; **RA diastolic collapse** (sens 50–100%, spec 33–100% *(verify)*); **RV diastolic collapse** (sens 48–100%, spec 72–100% *(verify)*); **IVC plethora** — dilated >20 mm with <50% respiratory collapse (sens ~97%, spec ~40% *(verify)*); respiratory variation mitral E >25–30% / tricuspid E >40–60% *(verify)*\n- [ ] Loculated/regional effusion (post-cardiac-surgery, post-trauma, post-procedural) can cause **regional tamponade** despite a modest-looking global effusion — maintain suspicion\n\n## Hemodynamic support while awaiting drainage\n- [ ] Cautious IV fluid may transiently support preload/BP while drainage is arranged — temporizing only, not a substitute for drainage\n- [ ] **Avoid positive-pressure ventilation/intubation before drainage whenever possible** — positive intrathoracic pressure further impairs venous return and RV filling and can precipitate cardiovascular collapse; if intubation is unavoidable, drain first if feasible or proceed with full resuscitation readiness\n- [ ] **Avoid vasodilators and diuretics** — both reduce preload and can precipitate collapse\n- [ ] Treat as time-critical once tamponade is diagnosed or strongly suspected, especially in the hemodynamically unstable patient — do not defer drainage for further work-up\n\n## Urgent drainage & fluid analysis\n- [ ] Definitive therapy = **drainage without delay in unstable patients** — preferably **echo- or fluoroscopy-guided needle pericardiocentesis** by an operator experienced/certified in acute cardiovascular care *(procedural complication rate ~4–10% — verify)*\n- [ ] **Surgical drainage/pericardial window** preferred for: suspected purulent pericarditis (urgent pericardiocentesis and/or surgical window regardless of hemodynamic status), loculated/complex effusion, or active bleeding into the pericardium (e.g. post-cardiac-surgery, trauma, aortic rupture)\n- [ ] **Aortic dissection with tamponade** — pericardiocentesis is high-risk and controversial (can worsen bleeding); prioritize urgent surgical/cardiothoracic consultation over percutaneous drainage — confirm local protocol *(verify)*\n- [ ] Send pericardial fluid for: cytology (malignancy), Gram stain + bacterial/fungal/TB culture, cell count with differential, glucose (pericardial:serum ratio helps separate purulent vs TB vs neoplastic effusion) *(verify thresholds)*\n- [ ] Check **CRP before the procedure** — it rises after pericardiocentesis and will confound post-procedure interpretation\n- [ ] Consider **intrapericardial fibrinolysis** for purulent or loculated effusion to achieve complete drainage and reduce risk of constriction *(verify)*\n\n## Etiology workup, treat underlying cause, post-drainage follow-up\n- [ ] Work up etiology in parallel with drainage — leading causes: malignancy, iatrogenic/trauma (incl. post-procedural), pericarditis (viral/idiopathic), tuberculosis (esp. endemic areas); also consider uraemia, autoimmune/collagen-vascular disease, post-MI (Dressler), aortic dissection, bacterial/purulent\n- [ ] Direct therapy at the cause: systemic antineoplastic treatment for malignant effusion; anti-TB therapy; optimize dialysis for uraemic effusion; targeted antibiotics ± surgical drainage for purulent pericarditis; anti-inflammatory therapy for idiopathic/autoimmune pericarditis\n- [ ] Malignant effusion: **extended pericardial drainage (~3–6 days)** reduces recurrence *(verify)*; consider intrapericardial therapy in refractory/recurrent cases\n- [ ] Post-drainage, watch for **effusive-constrictive physiology** — suspect if right atrial pressure fails to fall by ≥50% or to <10 mmHg despite adequate drainage *(verify)* — needs further management (medical therapy vs surgery)\n- [ ] Admit and monitor after any confirmed tamponade — it is a marker of high complication risk and non-viral aetiology; follow with serial echo per clinical trajectory and watch for recurrence\n\n## Commonly-missed on documentation (what the gap-check flags)\nBeck's triad absent noted (esp. medical/slow tamponade)? · pulsus paradoxus checked and documented? · echo signs beyond effusion size (RA/RV collapse, IVC plethora, inflow variation) recorded? · PPV/intubation avoided pre-drainage? · vasodilators/diuretics avoided? · aortic dissection considered/excluded before pericardiocentesis? · fluid sent for cytology/cultures/glucose ratio? · CRP drawn before tap? · etiology work-up initiated? · effusive-constrictive physiology screened post-drainage?\n\n*Sources: [2025 ESC Guidelines for the management of myocarditis and pericarditis — European Society of Cardiology (ESC), European Heart Journal](https://academic.oup.com/eurheartj/article/46/40/3952/8234483) · [ESC Guidelines webpage](https://www.escardio.org/guidelines/clinical-practice-guidelines/all-esc-practice-guidelines/myocarditis-and-pericarditis/) · [2015 ESC Guidelines for the diagnosis and management of pericardial diseases (prior edition, for reference)](https://academic.oup.com/eurheartj/article/36/42/2921/2293375)*\n"}, {"file": "cardiogenic-shock-scai-2022.md", "title": "Cardiogenic shock", "system": "Cardiac", "body": "# Cardiogenic shock — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2025 Concise Clinical Guidance: An ACC Expert Consensus Statement on the Evaluation and\n> Management of Cardiogenic Shock (Sinha SS et al., American College of Cardiology Solution Set\n> Oversight Committee), *JACC* 2025 — https://www.jacc.org/doi/10.1016/j.jacc.2025.02.018\n> **Staging framework:** SCAI SHOCK Stage Classification Expert Consensus Update 2022 (endorsed\n> ACC/ACEP/AHA/ESC-ACVC/ISHLT/SCCM/STS) — https://www.jacc.org/doi/10.1016/j.jacc.2022.01.018\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (staging: 2022)\n\n## Recognition & staging (first hour)\n- [ ] Screen with congestion + hypoperfusion signs — **\"SUSPECT CS\"** pattern: pulm. edema/JVD/edema\n  + cool extremities, altered mentation, oliguria, rising lactate *(verify exact mnemonic criteria)*\n- [ ] Assign **SCAI SHOCK stage A–E** and re-stage on trajectory, not just at presentation:\n  **A** at risk (no current CS) · **B** beginning (relative hypotension/tachycardia, no hypoperfusion)\n  · **C** classic (hypoperfusion needing intervention beyond volume) · **D** deteriorating (despite\n  initial support) · **E** extremis (refractory/arrest) *(verify exact stage criteria against source)*\n- [ ] Baseline labs: **CBC, CMP, troponin, natriuretic peptide, lactate, arterial/venous blood gas**\n- [ ] Baseline imaging: **12-lead ECG, CXR, TTE and/or point-of-care ultrasound** — assess EF, RV\n  function, valvulopathy, effusion/tamponade, mechanical complication\n- [ ] Consider **invasive hemodynamic monitoring (pulmonary artery catheter)** early for diagnosis\n  *and* to guide management/de-escalation — not reserved for refractory cases only *(verify local threshold for placement)*\n\n## Etiology workup & revascularization\n- [ ] Determine **ischemic vs non-ischemic** etiology promptly (ECG + troponin trend + echo ± angiography)\n- [ ] If **AMI-CS**: urgent **coronary angiography with revascularization** (PCI/CABG) — verify\n  door-to-intervention timing against local STEMI/NSTEMI pathway\n- [ ] Screen for **mechanical complications** (VSD, papillary muscle rupture, free wall rupture) and\n  **tamponade** — these change the management path entirely\n- [ ] If non-ischemic (myocarditis, decompensated HF, arrhythmia, valvular, RV failure, PE) —\n  route workup accordingly\n\n## Pharmacologic & fluid management\n- [ ] **Avoid indiscriminate fluid boluses** — most CS patients are congested, not volume-depleted;\n  reassess before each bolus with hemodynamic/exam data\n- [ ] Select **vasopressor/inotrope by hemodynamic profile** (not reflexively) — e.g. norepinephrine\n  for predominant hypotension, dobutamine/milrinone for low-output with adequate pressure —\n  agent/dose *(verify against hemodynamic profile and local protocol)*\n- [ ] Minimize **inotrope/vasopressor exposure duration** where feasible — associated with harm at\n  high dose/duration *(verify)*\n- [ ] Reassess ventilation, sedation, and acid-base status as contributors to shock physiology\n\n## Mechanical circulatory support escalation & monitoring\n- [ ] Escalate to **temporary MCS (IABP → Impella → VA-ECMO, or combinations)** when pharmacologic\n  support is inadequate or stage is worsening — device choice *(verify against hemodynamic profile,\n  RV involvement, and local shock-team protocol)*\n- [ ] Reassess **early and serially** — explicit \"reassess, reassess, reassess\" through the first\n  **6–24 hours**; document trajectory, not a single snapshot\n- [ ] Track **serial lactate and end-organ perfusion** (urine output, mentation, hepatic/renal function)\n  as response-to-therapy markers\n- [ ] Activate **multidisciplinary cardiogenic shock team** early (interventional cardiology,\n  cardiac surgery, advanced HF/MCS, critical care) — community centers: identify a **shock\n  champion** and set **transfer criteria** (refractory shock post-revasc, arrest with tenuous\n  neuro status, ≥1 vasoactive started, temporary MCS being considered)\n- [ ] Discuss **goals of care / palliative involvement** early given reported **in-hospital\n  mortality ~30–50%** *(verify current figure)* — especially before/at MCS escalation decisions\n\n## Commonly-missed on documentation (what the gap-check flags)\nSCAI stage assigned + re-staged? · etiology (ischemic/non-ischemic) documented? · mechanical\ncomplication/tamponade excluded? · fluid status reassessed before bolus? · vasopressor/inotrope choice\ntied to hemodynamic profile? · MCS escalation trigger/timing documented? · shock team activated? ·\nserial lactate/perfusion trend charted? · GoC/palliative discussion documented?\n\n*Sources: [2025 Concise Clinical Guidance on Cardiogenic Shock — JACC/ACC](https://www.jacc.org/doi/10.1016/j.jacc.2025.02.018) · [ACC press release summary](https://www.acc.org/About-ACC/Press-Releases/2025/03/18/19/19/American-College-of-Cardiology-Issues-Concise-Clinical-Guidance-on-Evaluation-and-Management-of-Cardiogenic-Shock) · [SCAI SHOCK Stage Classification Expert Consensus Update 2022 — JACC](https://www.jacc.org/doi/10.1016/j.jacc.2022.01.018)*\n"}, {"file": "cdiff-idsa-shea-2021.md", "title": "C. difficile infection", "system": "ID", "body": "# C. difficile infection — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Clinical Practice Guideline by the IDSA and SHEA: 2021 Focused Update Guidelines on\n> Management of *Clostridioides difficile* Infection in Adults (Johnson S et al.), *Clinical Infectious\n> Diseases* 2021;73:e1029–44.\n> https://academic.oup.com/cid/article/73/5/e1029/6298219\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2021 (check for a newer edition periodically)\n\n## Diagnosis\n- [ ] Test **only symptomatic patients** (≥3 unformed stools/24 h, no other explanation) — do not test formed stool / test-of-cure\n- [ ] Confirm local **testing algorithm** (NAAT vs toxin EIA vs multistep) — interpret per local lab; NAAT-only in a low-pretest-probability patient can overcall colonization — *verify local assay*\n- [ ] **Discontinue unnecessary antimotility agents** and, where possible, the inciting antibiotic\n\n## Severity classification — drives therapy choice\n- [ ] **Non-severe**: WBC ≤15 ×10⁹/L and Cr <1.5 mg/dL *(verify exact cutoffs)*\n- [ ] **Severe**: WBC >15 ×10⁹/L or Cr ≥1.5 mg/dL *(verify)*\n- [ ] **Fulminant** (severe complicated): hypotension/shock, ileus, or megacolon — treat as a surgical + ICU emergency\n\n## Treatment by severity\n- [ ] **Initial episode, non-severe or severe**: **fidaxomicin preferred** over vancomycin (reduced recurrence) — <200 mg PO BID ×10 d — verify>; **vancomycin** an acceptable alternative — <125 mg PO QID ×10 d — verify>\n- [ ] **Fulminant CDI**: **oral/NG vancomycin** (not fidaxomicin — no fulminant-disease data) — <500 mg PO/NG QID — verify> **+ IV metronidazole** if ileus/megacolon — <500 mg IV q8h — verify> **+ consider vancomycin retention enema** if complete ileus\n- [ ] **Surgical consult early** for fulminant disease — colectomy vs diverting loop ileostomy with colonic lavage per surgical/local practice\n- [ ] **Recurrent CDI**: fidaxomicin (standard or extended-pulse) or vancomycin taper/pulse preferred over repeat standard vancomycin course; consider **bezlotoxumab** or **fecal microbiota transplant** for multiply-recurrent disease — *verify eligibility*\n\n## Ongoing management\n- [ ] **Contact precautions** for duration of diarrhea (soap-and-water hand hygiene — alcohol gel does not kill spores)\n- [ ] **Avoid antimotility/opioid agents** that mask worsening ileus\n- [ ] **Daily reassessment for fulminant progression** (lactate, abdominal exam, distension, hemodynamics) in any inpatient CDI\n- [ ] **Review need for ongoing/future antibiotics** and PPI — de-escalate where possible\n- [ ] **Nutrition and volume status** — high-output diarrhea losses\n\n## Commonly-missed on documentation (what the gap-check flags)\nTesting only in symptomatic patient (not test-of-cure)? · severity classified (non-severe/severe/fulminant)? ·\nfidaxomicin considered before defaulting to vancomycin? · surgical consult documented if fulminant? ·\ncontact precautions + hand hygiene noted? · antimotility agents stopped? · inciting antibiotic reviewed?\n\n*Sources: [IDSA/SHEA 2021 Focused Update on CDI — Oxford Academic](https://academic.oup.com/cid/article/73/5/e1029/6298219) · [Navigating the 2021 update — ethical approach (PMC)](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9726573/)*\n"}, {"file": "copd-exacerbation-gold-2026.md", "title": "COPD exacerbation", "system": "Respiratory", "body": "# COPD exacerbation — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Global Strategy for the Diagnosis, Management, and Prevention of Chronic Obstructive\n> Pulmonary Disease — 2026 Report, Global Initiative for Chronic Obstructive Lung Disease (GOLD),\n> published December 2025.\n> https://goldcopd.org/2026-gold-report-and-pocket-guide/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026 (annually revised — check for newer edition)\n\n## Assessment\n- [ ] Exacerbation defined/graded using **Anthonisen-type criteria**: increased dyspnea, increased sputum\n  volume, increased sputum purulence *(verify current GOLD wording)*\n- [ ] Severity classified — mild (bronchodilators only) / moderate (+ steroids ± antibiotics) / severe\n  (requires ED/hospitalization or respiratory failure) *(verify)*\n- [ ] Rule out mimics/complications — pneumonia, pneumothorax, PE, heart failure, arrhythmia — GOLD 2026\n  adds a dedicated figure on **conditions that may mimic or worsen exacerbation-like symptoms** (new\n  for 2026) — use it to structure the differential\n- [ ] **Place-of-management decision** (outpatient vs ED vs admission) made using GOLD 2026's revised\n  criteria for outpatient-vs-inpatient treatment *(verify current criteria — new dedicated figure for 2026)*\n\n## Pharmacologic bundle\n- [ ] **Short-acting bronchodilators** (SABA ± SAMA) — increased dose/frequency as first-line\n- [ ] **Systemic corticosteroids** — short course, **~5 days** *(dose — verify, commonly prednisone/\n  prednisolone equivalent)*\n- [ ] **Antibiotics** if patient has **all 3 cardinal symptoms**, or **2 symptoms including increased\n  sputum purulence**, or **requires mechanical ventilation (invasive or noninvasive)** *(verify agent/\n  duration per local antibiogram)*\n\n## Oxygen & ventilatory support\n- [ ] **Controlled oxygen therapy** titrated to a conservative target — avoid hyperoxia-driven\n  hypercapnia *(target — verify, commonly SpO₂ 88–92%)*\n- [ ] **High-Flow Nasal Therapy (HFNT) — new first-line-tier respiratory support option in GOLD 2026.**\n  Consider specifically for: **persistent hypoxemia**, **NIV intolerance**, **contraindication to NIV**,\n  or **weaning off supplemental oxygen after NIV** *(verify local device availability/protocol — this is\n  the single biggest exacerbation-management change from GOLD 2025)*\n- [ ] **NIV first-line** for acute or acute-on-chronic hypercapnic respiratory failure with respiratory\n  acidosis *(pH/PaCO₂ threshold — verify)* — reduces need for intubation and mortality\n- [ ] **Invasive mechanical ventilation** indications: NIV failure/intolerance, respiratory or cardiac\n  arrest, depressed consciousness, massive aspiration, hemodynamic instability, life-threatening hypoxemia\n  *(verify full criteria list)*\n\n## Disease-activity framing — new in GOLD 2026\n- [ ] **Exacerbation frequency and recovery time documented** as indicators of disease activity and\n  future risk, not just as a discrete resolved event\n- [ ] **Treatment-escalation threshold lowered**: GOLD 2026 uses **one moderate exacerbation** (not\n  requiring ≥2 moderate or any severe exacerbation) as sufficient justification to **escalate maintenance\n  therapy**, aiming for a low-disease-activity state characterized by no further exacerbations — *verify\n  against current ABE/GOLD grade assessment tool and local practice*\n\n## Discharge / follow-up bundle\n- [ ] Maintenance inhaled therapy reviewed/optimized before discharge — reassessed against the\n  lowered (one-moderate-exacerbation) escalation threshold above\n- [ ] **Inhaler technique** checked\n- [ ] Follow-up visit arranged *(timeframe — verify, commonly 1–4 weeks)*\n- [ ] Smoking-cessation counseling offered\n- [ ] Vaccination status reviewed (influenza, pneumococcal, RSV, pertussis/COVID per local schedule —\n  GOLD 2026 vaccination guidance updated specifically re: RSV/influenza)\n- [ ] Pulmonary rehabilitation referral considered\n\n## Commonly-missed on documentation (what the gap-check flags)\nCardinal symptom count documented to justify antibiotic decision? · steroid course duration specified\nand ≤ ~5–7 days? · HFNT considered/documented as an option before or alongside NIV where indicated\n(persistent hypoxemia, NIV intolerance/contraindication, post-NIV weaning)? · NIV trialled before\ninvasive ventilation with reasoning if skipped? · O₂ target stated (not just \"O₂ as needed\")? ·\nexacerbation counted toward the one-moderate-exacerbation escalation threshold and maintenance therapy\nreassessed accordingly? · discharge bundle (technique, follow-up, vaccination, smoking) completed?\n\n*Sources: [GOLD 2026 Report and Pocket Guide — GOLD](https://goldcopd.org/2026-gold-report-and-pocket-guide/) · [GOLD 2026 Key Changes Summary (PDF)](https://goldcopd.org/wp-content/uploads/2025/11/KEY-CHANGES-GOLD-2026-10Nov2025.pdf) · [GOLD 2026 Report: What is New and What is Noteworthy for the Practicing Clinician](https://www.tandfonline.com/doi/full/10.1080/15412555.2026.2622744) · [GOLD 2026 updates in global strategy for diagnosis, management, and prevention of COPD — Chest Physician](https://www.chestphysician.org/gold-2026-updates-in-global-strategy-for-diagnosis-management-and-prevention-of-copd/)*\n"}, {"file": "decompensated-cirrhosis-aasld-2021.md", "title": "Decompensated cirrhosis (variceal bleed / hepatic encephalopathy / SBP)", "system": "GI / Hepatic", "body": "# Decompensated cirrhosis (variceal bleed / hepatic encephalopathy / SBP) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** AASLD 2021 Practice Guidance: Diagnosis, Evaluation and Management of Ascites,\n> Spontaneous Bacterial Peritonitis and Hepatorenal Syndrome (Biggins SW et al.), *Hepatology* 2021 —\n> https://pubmed.ncbi.nlm.nih.gov/33942342/\n> Hepatic encephalopathy: EASL Clinical Practice Guidelines on the Management of Hepatic\n> Encephalopathy, 2022 — https://pubmed.ncbi.nlm.nih.gov/35724930/ (joint AASLD/EASL 2014 guideline\n> still widely referenced)\n> Variceal bleed / TIPS: AASLD Practice Guidance on Portal Hypertension and Varices in Cirrhosis, 2023 —\n> https://pubmed.ncbi.nlm.nih.gov/37870298/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2021 (SBP/HRS) / 2022 (HE) / 2023 (varices)\n\n## Spontaneous bacterial peritonitis (SBP)\n- [ ] Diagnostic paracentesis on admission for any cirrhotic with ascites plus any sign of decompensation (fever, abdominal pain, encephalopathy, AKI, GI bleed) — low threshold to tap\n- [ ] SBP defined by ascitic fluid **PMN ≥250 cells/mm³**; send culture (bedside inoculation of blood-culture bottles improves yield)\n- [ ] Empiric **broad-spectrum IV antibiotics** started promptly once diagnosed — regimen per local resistance patterns *(agent/dose — verify)*\n- [ ] **IV albumin** on day 1 and day 3 for SBP with risk factors (e.g. elevated creatinine/BUN/bilirubin) to reduce AKI and mortality risk *(dose — verify)*\n- [ ] Secondary SBP prophylaxis (e.g. norfloxacin) after an episode *(agent — verify)*\n- [ ] Consider primary prophylaxis in high-risk subgroups (low ascitic-fluid protein with advanced liver/renal dysfunction, or prior GI bleed) *(criteria — verify)*\n\n## Hepatorenal syndrome (HRS) / AKI in cirrhosis\n- [ ] Apply cirrhosis-AKI diagnostic staging criteria (creatinine rise per ICA-AKI definitions) *(criteria — verify)*\n- [ ] Volume challenge with albumin + stop diuretics/nephrotoxins + treat precipitants (infection, GI bleed) **before** labeling as HRS\n- [ ] HRS-AKI treatment: **vasoconstrictor (e.g. terlipressin) + albumin** as first-line where available *(agent/dose — verify local availability)*\n- [ ] Early transplant hepatology involvement; renal replacement therapy as a bridge if indicated\n\n## Hepatic encephalopathy (HE)\n- [ ] Grade HE (e.g. West Haven criteria) and document trend\n- [ ] **Identify and treat the precipitant** first-line — infection, GI bleed, constipation, dehydration/diuretic overuse, electrolyte disturbance, sedatives/opioids, TIPS — precipitant correction resolves most episodes\n- [ ] **Lactulose** titrated to **2-3 soft stools/day** as first-line therapy *(dose — verify)*\n- [ ] Add **rifaximin** for recurrent HE or inadequate response to lactulose alone *(dose — verify)*\n- [ ] Airway protection if high-grade HE (grade III-IV) impairs protective reflexes\n- [ ] Avoid protein restriction — maintain adequate nutrition throughout\n\n## Variceal bleed in decompensated cirrhosis (rescue / ongoing care)\n- [ ] Initial UGIB bundle applies (see `upper-gi-bleed-acg-2021.md`) — vasoactive drug + antibiotics + EVL within 12 h\n- [ ] For refractory/recurrent bleeding or a high-risk profile (e.g. Child-Pugh C, or B with active bleeding at endoscopy): consider **early/pre-emptive TIPS** *(criteria — verify)*\n- [ ] Assess candidacy for TIPS/variceal embolization/BRTO per hepatic reserve and shunt-related risk (especially HE risk)\n- [ ] Establish secondary prophylaxis (non-selective beta-blocker + EVL) before discharge\n\n## Commonly-missed on documentation (what the gap-check flags)\nDiagnostic paracentesis performed on admission for any decompensation sign? · SBP albumin given on the\ncorrect days? · secondary SBP prophylaxis planned? · HRS work-up includes precipitant search + volume\nchallenge before vasoconstrictor started? · HE precipitant actively searched (not just lactulose given\nreflexively)? · rifaximin considered for recurrent HE? · TIPS candidacy addressed for high-risk variceal\nbleed?\n\n*Sources: [AASLD 2021 Practice Guidance: Ascites, SBP, and Hepatorenal Syndrome](https://pubmed.ncbi.nlm.nih.gov/33942342/) · [EASL Clinical Practice Guidelines: Hepatic Encephalopathy 2022](https://pubmed.ncbi.nlm.nih.gov/35724930/) · [AASLD Practice Guidance: Portal Hypertension and Varices in Cirrhosis 2023](https://pubmed.ncbi.nlm.nih.gov/37870298/)*\n"}, {"file": "dic-isth-2025.md", "title": "Disseminated intravascular coagulation (DIC)", "system": "Other", "body": "# Disseminated intravascular coagulation (DIC) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Updated definition and scoring of disseminated intravascular coagulation in 2025:\n> communication from the ISTH SSC Subcommittee on Disseminated Intravascular Coagulation,\n> *Journal of Thrombosis and Haemostasis* 2025 (DOI 10.1016/j.jtha.2025.03.038).\n> https://pubmed.ncbi.nlm.nih.gov/40216223/\n> **Supersedes** the 2013 harmonized ISTH/Wada criteria (previous file, archived) — the 2001 fixed\n> \"overt-DIC-only\" model is replaced by a **phase-based framework** (pre-DIC → early-phase DIC → overt\n> DIC) intended to enable earlier detection and treatment.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (check for a newer edition periodically)\n\n## Diagnosis — updated definition & phase-based framework\n- [ ] **Treat DIC as a clinical + laboratory diagnosis** — never lab values in isolation\n- [ ] New ISTH definition applied: DIC is an **acquired, life-threatening intravascular disorder**\n  characterized by **systemic coagulation activation, dysregulated fibrinolysis, and endothelial\n  injury**, resulting in **microthrombosis** — progressing from a potentially asymptomatic early\n  phase to an advanced phase with hemorrhage and/or organ dysfunction\n- [ ] **Phase assigned and documented** — pre-DIC / early-phase / overt — not just \"DIC present/absent\"\n- [ ] **Identify and document the underlying trigger** (sepsis, trauma, malignancy/APL, obstetric\n  catastrophe, severe trauma/burns) — this determines both prognosis and specific management\n- [ ] **Serial coagulation panels** (platelets, PT/INR, fibrinogen, D-dimer) to trend trajectory and\n  phase transition — not a one-off test\n\n### Pre-DIC (at-risk stage)\n- [ ] Patient identified as **at-risk by underlying condition** (e.g. sepsis, major trauma, APL) before\n  any formal score threshold is met — triggers heightened surveillance, not yet treatment *(verify —\n  no dedicated ISTH point-score for this stage; identification is clinical/risk-factor based)*\n\n### Early-phase DIC — use the ISTH **SIC (Sepsis-Induced Coagulopathy) score** as the early marker\n- [ ] Platelet count: **<100 ×10⁹/L = 2 pts**, **100–<150 ×10⁹/L = 1 pt**\n- [ ] PT-INR: **>1.4 = 2 pts**, **>1.2–≤1.4 = 1 pt**\n- [ ] SOFA score: **≥2 = 2 pts**, **1 = 1 pt**\n- [ ] **SIC score ≥4** (with platelet + PT-INR subtotal **>2**) **= early-phase DIC / SIC** *(verify —\n  D-dimer/fibrinogen intentionally omitted at this stage)*\n\n### Overt DIC — updated ISTH score (max 8 pts; ≥5 = overt DIC)\n- [ ] Platelet count: **<50 ×10⁹/L = 2 pts**, **50–<100 ×10⁹/L = 1 pt**\n- [ ] **D-dimer** (revised for 2025): **>7× ULN = 3 pts**, **>3× ULN = 2 pts** *(replaces the old\n  qualitative \"moderate/strong rise\" fibrin-marker scoring)*\n- [ ] PT prolongation: **≥6 s = 2 pts**, **≥3–<6 s = 1 pt**\n- [ ] Fibrinogen (Clauss): **<1 g/L (100 mg/dL) = 1 pt**\n- [ ] **Total ≥5 = consistent with overt DIC** *(verify against source; modified score exists for pregnancy)*\n\n## Cornerstone of management\n- [ ] **Treat the underlying condition aggressively** — this is the single most important intervention;\n  DIC will not resolve on transfusion alone\n- [ ] Classify the patient as **bleeding-predominant** vs **thrombosis-predominant** vs **non-bleeding\n  critically ill** — management diverges significantly regardless of phase\n\n## Bleeding-predominant DIC\n- [ ] **Transfuse platelets/plasma/cryoprecipitate only in patients who are actively bleeding** (or at\n  high procedural bleeding risk) — **do not correct labs alone in a non-bleeding patient**\n- [ ] **Fresh frozen plasma** to replace clotting factors if bleeding with prolonged PT/aPTT — *verify dose/trigger*\n- [ ] **Cryoprecipitate/fibrinogen concentrate** if fibrinogen critically low and bleeding — *verify trigger, e.g. <1.5 g/L*\n- [ ] **Platelet transfusion** if bleeding and thrombocytopenic — *verify institutional threshold*\n- [ ] **Avoid antifibrinolytics (e.g. tranexamic acid)** in typical DIC — reserve for specific\n  hyperfibrinolysis-predominant presentations (e.g. APL-associated DIC) under specialist guidance\n\n## Non-bleeding / thrombosis-predominant DIC (incl. early-phase/SIC)\n- [ ] **VTE prophylaxis with prophylactic-dose heparin or LMWH** in critically ill, non-bleeding\n  DIC/SIC patients — *verify contraindications*\n- [ ] **Do not withhold VTE prophylaxis** purely because the coagulation panel is abnormal, if the\n  patient is not actively bleeding\n- [ ] Consider **antithrombin or recombinant thrombomodulin** only per specialist/hematology guidance\n  in select cases — evidence limited, **not routine** — *verify local availability/indication*\n- [ ] **Early-phase/pre-DIC identification prompts earlier hematology discussion**, consistent with the\n  2025 rationale that earlier detection/treatment may reduce DIC-associated mortality *(verify local uptake)*\n\n## Ongoing ICU management\n- [ ] **Hematology consult** for complex/refractory DIC, any early-phase/SIC score trending up, or when\n  the underlying trigger is unclear\n- [ ] **Reassess coagulation panel trend and phase** with each change in clinical status, not on a fixed\n  schedule alone\n- [ ] **Avoid unnecessary invasive procedures** while actively coagulopathic; plan product support\n  proactively if a procedure is required\n\n## Commonly-missed on documentation (what the gap-check flags)\nUnderlying trigger identified and being treated? · phase (pre-DIC/early-phase/overt) explicitly staged,\nnot just \"DIC yes/no\"? · SIC score used to flag early-phase disease in sepsis? · updated D-dimer\nthresholds applied in the overt score? · bleeding vs non-bleeding phenotype stated? · transfusion given\nonly for bleeding/procedural risk (not lab-value alone)? · VTE prophylaxis addressed in non-bleeding\npatients? · hematology consulted for refractory/unclear/early-phase cases?\n\n*Sources: [Updated definition and scoring of disseminated intravascular coagulation in 2025 — J Thromb Haemost / PubMed](https://pubmed.ncbi.nlm.nih.gov/40216223/) · [ISTH DIC Score 2025 — Practical Haemostasis](https://practical-haemostasis.com/Clinical%20Prediction%20Scores/Formulae%20code%20and%20formulae/Formulae/DIC/isth_dic_score_2025.html) · [ISTH SIC Score 2025 — Practical Haemostasis](https://practical-haemostasis.com/Clinical%20Prediction%20Scores/Formulae%20code%20and%20formulae/Formulae/DIC/isth_sic_score_2025.html) · [Introducing the New Definition and Diagnostic Criteria of DIC Released by ISTH in 2025 — PubMed](https://pubmed.ncbi.nlm.nih.gov/40829630/)*\n"}, {"file": "dka-hhs-ada-2024.md", "title": "Diabetic ketoacidosis / hyperosmolar hyperglycemic state", "system": "Renal / Metabolic / Endo", "body": "# Diabetic ketoacidosis / hyperosmolar hyperglycemic state — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Hyperglycemic Crises in Adults With Diabetes: A Consensus Report (ADA/EASD/JBDS/AACE/DTS),\n> *Diabetes Care* 2024;47:1257–1275.\n> https://diabetesjournals.org/care/article/47/8/1257/156808/Hyperglycemic-Crises-in-Adults-With-Diabetes-A\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2024\n\n## Diagnosis & initial classification\n- [ ] **DKA** — glucose **≥11.1 mmol/L (200 mg/dL)** (or known diabetes) + ketosis (**β-hydroxybutyrate ≥3.0 mmol/L** *(verify)* or significant ketonuria) + acidosis (**pH <7.30** or **HCO₃⁻ <18 mmol/L**)\n- [ ] **HHS** — glucose **>22.2 mmol/L (400 mg/dL)** *(verify)* + **serum osmolality >320 mOsm/kg** + minimal/absent ketosis + **pH ≥7.30**, **HCO₃⁻ ≥18 mmol/L**\n- [ ] Mixed DKA/HHS picture recognized and documented where present\n- [ ] Precipitant identified and treated (infection, MI, non-adherence, new-onset, SGLT2i, other)\n\n## Fluids\n- [ ] Initial isotonic crystalloid (0.9% saline or balanced) — **500–1000 mL/h for first 2–4 h** *(verify against volume status/cardiac/renal function)*\n- [ ] Ongoing rate individualized to correct estimated deficit over **24–48 h**\n- [ ] Switch to **dextrose-containing fluid (5–10%)** once glucose **<13.9 mmol/L (250 mg/dL)**, continuing insulin until resolution\n- [ ] HHS — avoid dropping glucose faster than **~5 mmol/L/h (≈90 mg/dL/h)** *(verify)* given osmotic risk\n\n## Insulin\n- [ ] IV regular insulin infusion — **0.1 U/kg/h** (DKA) or **0.05 U/kg/h** (HHS without significant ketosis) *(verify — initial bolus of 0.1 U/kg optional if infusion start delayed)*\n- [ ] **Do not start insulin if K+ <3.5 mmol/L** — replete potassium first *(verify threshold)*\n- [ ] Reduce infusion (e.g. to ~0.05 U/kg/h) once glucose **<13.9 mmol/L**, keeping glucose ~**11.1 mmol/L** until DKA resolved\n- [ ] Basal insulin started **1–2 h before** stopping IV infusion to prevent rebound ketosis/hyperglycemia *(verify dose ~0.15–0.3 U/kg/day)*\n- [ ] Mild/moderate uncomplicated DKA — subcutaneous rapid-acting insulin protocol acceptable in appropriate settings; **not for severe DKA or HHS**\n\n## Electrolytes\n- [ ] **Potassium** — start repletion once K+ **<5.0 mmol/L** (with adequate urine output), target **4–5 mmol/L**; typical **20–30 mmol per L** of IV fluid *(verify against local protocol)*; recheck **q2–4h**\n- [ ] **Phosphate** — routine replacement **not indicated**; consider only with severe hypophosphatemia (**<1.0 mmol/L** *(verify)*) plus muscle weakness/respiratory compromise/cardiac dysfunction\n- [ ] **Bicarbonate** — routine use **not recommended**; consider only for severe acidosis **pH <7.0** *(verify)*, with careful re-dosing and monitoring\n\n## Resolution & transition\n- [ ] DKA resolution: ketones/β-hydroxybutyrate normalized, venous **pH ≥7.30** or **HCO₃⁻ ≥18 mmol/L**, anion gap closed\n- [ ] HHS resolution: osmolality **<300 mOsm/kg**, glucose **<13.9 mmol/L**, mental status improved, adequate urine output\n- [ ] Transition to subcutaneous basal-bolus insulin with overlap; total daily dose estimated (**~0.5–0.6 U/kg/day** insulin-naive; lower if hypoglycemia risk) *(verify)*\n- [ ] Precipitant fully addressed; diabetes education / follow-up arranged before discharge\n- [ ] VTE prophylaxis considered per usual critical-care practice\n\n## Commonly-missed on documentation (what the gap-check flags)\nPrecipitant named? · K+ checked before first insulin dose? · dextrose added at correct glucose threshold? ·\nresolution criteria explicitly met before stopping infusion? · basal insulin overlap with IV insulin documented? ·\nphosphate/bicarbonate use justified (not routine)?\n\n*Sources: [Hyperglycemic Crises in Adults With Diabetes: A Consensus Report — Diabetes Care 2024](https://diabetesjournals.org/care/article/47/8/1257/156808/Hyperglycemic-Crises-in-Adults-With-Diabetes-A) · [PMC full text](https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/)*\n"}, {"file": "electrolyte-emergencies-hyperk-hypona-hyperca-2024.md", "title": "Severe electrolyte derangements (hyperkalemia · hyponatremia · hypercalcemia)", "system": "Renal / Metabolic / Endo", "body": "# Severe electrolyte derangements (hyperkalemia · hyponatremia · hypercalcemia) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Sources:** UK Kidney Association Clinical Practice Guideline — Treatment of Acute Hyperkalaemia in\n> Adults, 2023 (ukkidney.org); European Society of Endocrinology Clinical Practice Guideline on Hyponatraemia,\n> 2014 (*Eur J Endocrinol*); Endocrine Society Clinical Practice Guideline — Treatment of Hypercalcemia of\n> Malignancy in Adults, 2022 (*J Clin Endocrinol Metab* 2023).\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2023 / 2014 / 2022 (three separate society\n> guidelines combined into one checklist — verify each section against its own primary source)\n\n## Hyperkalemia\n- [ ] Severity classified: **mild** ~5.5–5.9, **moderate** **6.0–6.4 mmol/L** (treat if any cardiac instability), **severe** **>6.5 mmol/L** or any ECG changes *(verify thresholds against UKKA/local protocol)*\n- [ ] **12-lead ECG** obtained — peaked T waves, widened QRS, loss of P waves, sine wave → treat as emergency regardless of exact level\n- [ ] **Membrane stabilization**: **calcium gluconate 10%, ~30 mL (or per local: 10 mL repeated)** IV if ECG changes; repeat at **~5 min** if changes persist *(verify dose/product — chloride vs gluconate differ)*\n- [ ] **Shift K+ intracellularly**: insulin-dextrose (e.g. **10 units soluble insulin + 25 g glucose**, some protocols use lower insulin dose) *(verify local dose — hypoglycemia risk, monitor glucose)*\n- [ ] **Adjunct**: nebulized salbutamol **10–20 mg** *(verify dose)*\n- [ ] Sodium bicarbonate considered only if concurrent metabolic acidosis *(verify — not first-line for K+ shift alone)*\n- [ ] **Remove potassium**: loop diuretic if volume replete/overloaded; potassium binder (patiromer/SZC) for sustained lowering *(verify agent/dose)*; **dialysis** if refractory, severe AKI, or life-threatening\n- [ ] Underlying cause addressed (AKI, RAASi, acidosis, tissue breakdown, adrenal insufficiency); repeat K+ **1 h and hourly** until stable *(verify interval)*\n- [ ] Culprit medications (ACEi/ARB/MRA/NSAIDs) held/reviewed\n\n## Hyponatremia\n- [ ] Severity + acuity classified: mild/moderate/severe by symptoms **and** onset (<48 h acute vs chronic/unknown)\n- [ ] **Severe symptomatic** hyponatremia → **hypertonic saline (3%) bolus, e.g. ~150 mL over ~20 min**, repeated up to 2–3× while reassessing symptoms *(verify dose/volume — low-quality evidence per ESE 2014)*\n- [ ] Target correction: **~5 mmol/L rise (or symptom relief) within first hour**, cumulative **≤10 mmol/L in 24 h**, **≤8 mmol/L per subsequent 24 h** *(verify limits — high risk of osmotic demyelination if exceeded)*\n- [ ] Frequent Na+ recheck (e.g. **q2–4h** during active correction) with explicit stop/slow rules if trending too fast *(verify interval)*\n- [ ] If overcorrection occurs — re-lowering strategy considered (e.g. desmopressin ± free water) *(verify institutional protocol)*\n- [ ] Etiology work-up (volume status, urine osmolality/sodium, SIADH vs hypovolemic vs hypervolemic) documented before choosing fluid-restriction vs saline vs vaptan strategy\n- [ ] Chronic/asymptomatic hyponatremia — avoid overly rapid correction; treat underlying cause, fluid restriction as first line where appropriate *(verify)*\n\n## Hypercalcemia (malignancy-associated / severe)\n- [ ] Severity/symptom-based urgency assessed (corrected calcium level **and** neuro/cardiac/renal symptoms, not number alone)\n- [ ] **IV isotonic saline** to restore volume — e.g. **~1.5–2 L bolus** then maintenance **~100–150 mL/h**, targeting **~3–4 L/24 h** *(verify rate against cardiac/renal reserve)*\n- [ ] **Calcitonin ~4 IU/kg** IM/SC for rapid but short-lived effect while bisphosphonate takes effect *(verify dose — tachyphylaxis expected within days)*\n- [ ] **IV bisphosphonate** (e.g. **zoledronic acid 4 mg IV over 15–30 min**, dose-adjusted for renal function) OR **denosumab** (e.g. **120 mg SC**), denosumab preferred if bisphosphonate-refractory or significant renal impairment *(verify agent/dose/renal adjustment)*\n- [ ] Loop diuretic **only** after volume repletion and **only** for fluid overload — not routine to lower calcium *(verify)*\n- [ ] Glucocorticoids considered if calcitriol-mediated (lymphoma, granulomatous disease)\n- [ ] Hemodialysis considered for severe/refractory hypercalcemia with renal failure or if fluids/bisphosphonates contraindicated\n- [ ] Underlying malignancy/cause treatment addressed as the definitive measure to prevent recurrence\n\n## Commonly-missed on documentation (what the gap-check flags)\nECG done for hyperkalemia? · repeat K+ timing documented? · hyponatremia acuity (acute vs chronic) stated before choosing correction speed? ·\n24 h correction limit explicitly tracked? · hypercalcemia — volume repletion done before/with calcitonin? · bisphosphonate renal-dose-adjusted? · underlying cause named for all three?\n\n*Sources: [UK Kidney Association — Management of Hyperkalaemia in Adults](https://www.ukkidney.org/health-professionals/guidelines) · [Recommendations for the management of hyperkalemia in the emergency department — PubMed](https://pubmed.ncbi.nlm.nih.gov/35833768/) · [Clinical practice guideline on diagnosis and treatment of hyponatraemia — ESE/ERA-EDTA 2014 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC4276109/) · [Treatment of Hypercalcemia of Malignancy in Adults: An Endocrine Society Clinical Practice Guideline — PubMed](https://pubmed.ncbi.nlm.nih.gov/36545746/)*\n"}, {"file": "endocarditis-esc-2023.md", "title": "Infective endocarditis", "system": "ID", "body": "# Infective endocarditis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2023 ESC Guidelines for the management of endocarditis, developed by the Task Force on the\n> Management of Endocarditis of the European Society of Cardiology (ESC), endorsed by EACTS and EANM,\n> *European Heart Journal* 2023;44(39):3948–4042. **Different body from the prior source**\n> (`endocarditis-aha-2015.md`, 2015 AHA Scientific Statement, superseded/removed) — adopted as primary\n> here as the newer, more current guideline; the AHA 2015 statement was the prior operative source.\n> https://academic.oup.com/eurheartj/article/44/39/3948/7243107\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Diagnosis\n- [ ] **Blood cultures ×3** from separate sites **before antibiotics** (if patient stable enough to permit brief delay)\n- [ ] Apply **modified Duke criteria** (clinical + microbiologic + imaging) to classify definite/possible/rejected — 2023 update **incorporates advanced imaging (CT, PET/CT, nuclear imaging) as major criteria**, not just adjunctive, alongside echo and microbiology *(verify per current criteria table)*\n- [ ] **Echocardiography** — **TTE first**; **TEE** if TTE non-diagnostic, prosthetic valve, suspected complication, or high clinical suspicion despite negative TTE\n- [ ] Use the **2023 diagnostic algorithm appropriate to valve type** — native valve, prosthetic valve, and cardiac-device-related (CIED) endocarditis now each have **distinct pathways** *(verify which applies)*\n- [ ] Consider **PET/CT or cardiac CT** — now a **formal diagnostic criterion**, especially for prosthetic-valve/device-related IE where echo is equivocal *(verify local availability)*\n- [ ] **Screen for embolic phenomena** (neuro imaging if any neuro symptom; consider even if asymptomatic per local practice)\n\n## Antimicrobial therapy & source control\n- [ ] **Empiric regimen** selected per suspected organism (native vs prosthetic valve, community vs healthcare-associated) — <agents/doses, EUCAST-based> — verify against guideline tables and local antibiogram\n- [ ] **Targeted therapy** once organism/susceptibilities known; document **planned total duration** (native vs prosthetic valve durations differ) — *verify*\n- [ ] **Outpatient parenteral antibiotic therapy (OPAT)**, incl. partial oral step-down, now **formally supported** for stable patients completing therapy after the acute/complication-prone phase — screen eligibility before discharge planning *(new emphasis in 2023 — verify local OPAT pathway)*\n- [ ] **Identify and control any removable source** (line, device, abscess) — early ID/cardiology/CT surgery involvement\n- [ ] **Serial blood cultures** to confirm clearance\n\n## Surgical evaluation — do not defer this decision\n- [ ] **Early cardiac surgery consult** — do not wait for antibiotic course completion if any indication present\n- [ ] **Surgical urgency now explicitly categorized**: **emergency** (within 24 h), **urgent** (within 3–5 days), **non-urgent** (within the same hospital stay) — document which applies *(new explicit definitions in 2023 — verify)*\n- [ ] **Class I: urgent surgery (3–5 days)** for **vegetation ≥10 mm plus another surgical indication**; also a **new urgent-surgery indication for early prosthetic-valve endocarditis** *(verify criteria)*\n- [ ] Indications to actively screen for: **heart failure due to valve dysfunction**, **uncontrolled infection** (perivalvular abscess, persistent bacteremia/fever despite appropriate abx, fungal/resistant organism), **high embolic risk** (large/mobile vegetation ≥10 mm, prior embolic event) — *verify exact thresholds against source*\n- [ ] **Ischemic stroke**: surgery should **not be delayed** — upgraded to a **Class I** recommendation in 2023 *(verify timing specifics)*\n- [ ] **Hemorrhagic stroke**: waiting **~1 month** before surgery is generally preferred (**Class IIa**) *(verify per case — neurosurgery/neurology input)*\n- [ ] Document the **multidisciplinary Endocarditis Team** discussion/decision, even if surgery deferred — structured team framework is a core emphasis of the 2023 guideline\n\n## Ongoing ICU management\n- [ ] **Monitor for new murmur, conduction abnormality (new heart block → abscess), or heart failure** — daily exam ± telemetry\n- [ ] **Repeat echo** if clinical change or to guide surgical timing\n- [ ] **Anticoagulation management** — individualize in patients on chronic anticoagulation (bleeding vs embolic risk) — *verify per case, avoid new initiation in most acute native-valve IE*\n- [ ] **Dental/hygiene and prophylaxis counseling** before discharge per current ESC/AHA prophylaxis indications\n\n## Commonly-missed on documentation (what the gap-check flags)\n3 sets of cultures before abx? · Duke criteria classification stated (incl. imaging as major criterion where used)? ·\nTEE and/or PET-CT done/considered when TTE negative but suspicion high? · surgical urgency category\n(emergency/urgent/non-urgent) explicitly documented? · surgical indications actively screened (HF /\nuncontrolled infection / embolic risk ≥10 mm)? · stroke-timing rule followed (ischemic — don't delay;\nhemorrhagic — ~1 month)? · antibiotic duration + de-escalation + OPAT-eligibility plan? · source\n(line/device) addressed? · endocarditis team discussion documented?\n\n*Sources: [2023 ESC Guidelines for the management of endocarditis — European Heart Journal](https://academic.oup.com/eurheartj/article/44/39/3948/7243107) · [2023 ESC Clinical Practice Guidelines for endocarditis — ESC Congress news](https://www.escardio.org/Congresses-Events/ESC-Congress/Congress-resources/Congress-news/2023-ESC-Clinical-Practice-Guidelines-for-the-management-of-endocarditis) · [Surgical Implications of the 2023 ESC Endocarditis Guidelines Endorsed by EACTS — European Journal of Cardio-Thoracic Surgery](https://academic.oup.com/ejcts/article-abstract/67/7/ezaf225/8185406) · *(prior source, retained for reference only:* [Infective Endocarditis in Adults — AHA Scientific Statement 2015 (Circulation)](https://www.ahajournals.org/doi/10.1161/CIR.0000000000000296)*)*\n"}, {"file": "febrile-neutropenia-asco-idsa-2018.md", "title": "Febrile neutropenia", "system": "ID", "body": "# Febrile neutropenia — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Outpatient Management of Fever and Neutropenia in Adults Treated for Malignancy: American\n> Society of Clinical Oncology and Infectious Diseases Society of America Clinical Practice Guideline\n> Update (Taplitz RA, Kennedy EB, Bow EJ, et al.), *Journal of Clinical Oncology* 2018;36(14):1443–1453.\n> https://www.idsociety.org/practice-guideline/fever-and-neutropenia-in-adults-with-cancer/\n> **This is an outpatient-management-focused update — it does NOT replace the inpatient/empiric-IV-antibiotic\n> guidance.** The **2018 ASCO/IDSA update governs risk stratification and outpatient (oral) therapy**;\n> the **empiric IV antibiotic selection, cultures, and inpatient escalation structure below is retained\n> from the 2010 IDSA guideline** (Freifeld AG et al., *Clin Infect Dis* 2011;52:e56–93), which has not\n> been superseded for that scope — say so explicitly in any output using this checklist.\n> **Compiled:** 06-Sep-2026 · Claude Code · outpatient guidance year 2018; inpatient/empiric structure\n> year 2010 (check periodically for a full inpatient-scope update)\n\n## Recognition & risk stratification\n- [ ] Confirm **fever** (single temp ≥38.3°C, or ≥38.0°C sustained ≥1 h — *verify exact threshold*) **+ neutropenia** (ANC <500, or <1000 with expected fall — *verify*)\n- [ ] Calculate **MASCC score** (or CISNE for solid-tumor outpatients) — **≥21 = low risk**, **<21 = high risk** *(verify cutoff/tool against source)*
