\n- [ ] High-risk patients → **admit for IV empiric therapy**; low-risk patients evaluated against 2018\n  ASCO/IDSA outpatient eligibility (below) — *verify eligibility criteria*\n\n## Outpatient pathway — low-risk patients (ASCO/IDSA 2018)\n- [ ] **Formal risk assessment documented** (clinical judgment or validated tool, e.g. MASCC) before\n  committing to outpatient management\n- [ ] **Logistic/psychosocial suitability confirmed** — reliable access to care, caregiver support,\n  ability to return promptly if worsening — explicitly part of the 2018 selection criteria\n- [ ] **First dose of empirical antibacterial therapy given within 1 hour of triage**, same as inpatient timing\n- [ ] **Observed ≥4 hours** after first dose before discharge home\n- [ ] **Oral empiric regimen**: **fluoroquinolone (e.g. ciprofloxacin) PLUS amoxicillin-clavulanate**\n  (or **clindamycin** if penicillin-allergic) *(verify dose against local antibiogram/allergy)*\n- [ ] **Do NOT use this oral fluoroquinolone-based regimen** in patients who were already receiving\n  **fluoroquinolone prophylaxis** — treat as high-risk/inpatient instead\n- [ ] **Re-evaluated at 48–72 hours** (in person or by structured follow-up) — persistent fever or\n  clinical deterioration → **escalate to inpatient IV therapy**\n\n## Immediate empiric therapy (inpatient / high-risk) — treat before source is known *(retained: 2010 IDSA scope, not updated by 2018)*\n- [ ] **Blood cultures ×2** (incl. from any central line + peripheral) **before antibiotics**; other cultures per site of symptoms\n- [ ] **Empiric antibiotics within 1 hour** of triage/presentation\n- [ ] **Antipseudomonal beta-lactam monotherapy** — e.g. cefepime, piperacillin-tazobactam, or a carbapenem — <agent/dose — verify against local antibiogram/allergy>\n- [ ] **Add vancomycin/MRSA coverage** only for specific indications (hemodynamic instability, suspected line infection, skin/soft-tissue infection, known MRSA colonization, severe mucositis) — not routine — *verify indications*\n- [ ] **Add antifungal coverage** if persistent fever ≥4–7 days despite broad-spectrum antibiotics and no identified source — *verify timing/agent*\n\n## Source evaluation & ongoing management\n- [ ] **Focused exam + imaging** for likely sources (line site, lungs, perianal, skin) — avoid rectal exam/manipulation if profoundly neutropenic\n- [ ] **Daily reassessment** — de-escalate/narrow once culture data and clinical trajectory allow (inpatient), or confirm improvement at 48–72h reassessment (outpatient)\n- [ ] **Central line management** — evaluate for removal if line-associated infection suspected (esp. *S. aureus*, fungal, persistent bacteremia)\n- [ ] **G-CSF** — consider per hematology/oncology if not already on it and high-risk features — *verify indication, not routine for uncomplicated FN*\n- [ ] **Antifungal/antiviral prophylaxis review** — confirm patient's prior prophylaxis regimen and whether breakthrough is a concern\n- [ ] **Duration of therapy** — continue until ANC recovery **and** afebrile **and** source addressed; document plan — *verify*\n\n## Commonly-missed on documentation (what the gap-check flags)\nMASCC/risk stratification documented, including logistic/psychosocial suitability if outpatient path\nconsidered? · cultures before antibiotics? · door-to-antibiotic time ≤1 h (either pathway)? · fluoroquinolone\nprophylaxis status checked before choosing oral outpatient regimen? · 48–72h outpatient reassessment\nscheduled and documented? · rationale for/against vancomycin stated (not reflexive)? · antifungal\nescalation timing considered if fever persists (inpatient)? · line source actively assessed? · G-CSF\nindication addressed? · daily de-escalation review (inpatient)?\n\n*Sources: [ASCO/IDSA 2018 Outpatient Fever and Neutropenia Guideline — IDSA](https://www.idsociety.org/practice-guideline/fever-and-neutropenia-in-adults-with-cancer/) · [Outpatient Management of Fever and Neutropenia in Adults Treated for Malignancy — J Clin Oncol 2018 (PubMed)](https://pubmed.ncbi.nlm.nih.gov/29461916/) · [IDSA 2010 Update: Antimicrobial Agents in Neutropenic Patients with Cancer (retained inpatient/empiric scope) — PubMed](https://pubmed.ncbi.nlm.nih.gov/21258094/) · [Clinical Implications of Febrile Neutropenia Guidelines (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC6333383/)*\n"}, {"file": "hypertensive-emergency-aha-2024.md", "title": "Hypertensive emergency", "system": "Cardiac", "body": "# Hypertensive emergency — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** The Management of Elevated Blood Pressure in the Acute Care Setting: A Scientific\n> Statement From the American Heart Association (Bress AP et al., AHA), *Hypertension* 2024;81(8):e94–e106.\n> https://www.ahajournals.org/doi/10.1161/HYP.0000000000000238\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2024\n\n## Classify before treating\n- [ ] **Hypertensive emergency** = severe BP elevation (commonly cited threshold **≥180/110–120 mmHg** *(verify)*) **WITH acute target-organ damage** — treat emergently\n- [ ] No end-organ damage → **\"asymptomatic markedly elevated BP\"** (2024 AHA statement retires the term \"hypertensive urgency\") — do **NOT** rapidly lower; resume/optimize oral therapy, arrange outpatient follow-up\n- [ ] Identify the **specific end-organ syndrome** driving management (below) — this sets the target BP, agent, and rate, not the number alone\n\n## Initial workup\n- [ ] Targeted exam for end-organ damage: neuro deficit/AMS, chest/back pain, dyspnea/rales, decreased UOP, vision change, fundoscopy (papilledema/hemorrhage), pregnancy status\n- [ ] Labs/imaging as indicated: BMP/creatinine + UA, troponin, BNP, ECG in all; head CT for any neuro sign; CXR ± CT-angiogram chest/abdo if dissection suspected\n- [ ] Screen for a reversible cause/precipitant: medication non-adherence, NSAID/illicit stimulant (cocaine/amphetamine) use, abrupt clonidine withdrawal, renal artery stenosis, pheochromocytoma\n\n## General BP-reduction strategy (default — absent a specific syndrome below)\n- [ ] **IV, titratable, short-acting agent** (e.g. labetalol, nicardipine, clevidipine, esmolol, nitroglycerin, nitroprusside — verify choice/dose) in a monitored/ICU bed\n- [ ] **Arterial line** for continuous BP monitoring while titrating *(verify institutional threshold for placement)*\n- [ ] Reduce **MAP by ≤25% in the first hour** *(verify)*, then toward ~160/100–110 mmHg over 2–6 h, normalize over 24–48 h — avoid overshoot/hypotension\n- [ ] **Avoid rapid-acting oral/sublingual agents** (e.g. sublingual nifedipine) — unpredictable, precipitous drops\n\n## Syndrome-specific overrides — supersede the general rule\n- [ ] **Aortic dissection**: SBP target **<120 mmHg**, HR 60–80, within minutes; IV **beta-blocker first** (esmolol/labetalol) before any vasodilator to blunt reflex tachycardia/shear; treat pain as part of hemodynamic control\n- [ ] **Ischemic stroke, thrombolysis/thrombectomy candidate**: BP **<185/110** pre-treatment, **<180/105** for 24 h after *(verify)* — nicardipine/labetalol\n- [ ] **Ischemic stroke, not receiving reperfusion therapy**: withhold antihypertensives unless **>220/120** *(verify)* — permissive hypertension\n- [ ] **Intracerebral hemorrhage**: SBP target **~140 mmHg** (range 130–150), reached within ~1 h if feasible *(verify)* — nicardipine\n- [ ] **Acute pulmonary edema/ADHF**: nitroglycerin ± nitroprusside, loop diuretic; avoid beta-blockade in decompensated failure\n- [ ] **ACS**: nitroglycerin ± beta-blocker (if not contraindicated) to reduce myocardial O2 demand\n- [ ] **Eclampsia/severe preeclampsia**: IV labetalol or hydralazine (or oral nifedipine); **magnesium sulfate for seizure prophylaxis**; obstetric consult re: delivery; avoid ACEi/ARB\n- [ ] **Pheochromocytoma / catecholamine excess / sympathomimetic toxicity (e.g. cocaine)**: **alpha-blockade before beta-blockade** (phentolamine) — unopposed alpha-stimulation risk if a beta-blocker is given first\n\n## Precipitant, transition, disposition\n- [ ] Address the identified precipitant (see workup) before discharge\n- [ ] Once controlled and stable, **transition to oral agents with overlap** before stopping the IV infusion\n- [ ] Restart/optimize home antihypertensives; arrange follow-up (nephrology/cardiology/obstetrics as relevant) before discharge\n\n## Commonly-missed on documentation (what the gap-check flags)\nEnd-organ syndrome named explicitly (not just \"elevated BP\")? · target BP/rate stated, not generic \"lower BP\"? ·\narterial line documented? · sublingual/oral rapid agent avoided? · beta-before-alpha error screened in\npheo/stimulant cases? · precipitant/secondary-cause workup documented? · magnesium given if eclampsia? ·\noral overlap + follow-up arranged?\n\n*Sources: [The Management of Elevated Blood Pressure in the Acute Care Setting — AHA Scientific Statement, Hypertension 2024](https://www.ahajournals.org/doi/10.1161/HYP.0000000000000238) · [Hypertensive Emergency — StatPearls, NCBI Bookshelf](https://www.ncbi.nlm.nih.gov/books/NBK470371/) · [2017 ACC/AHA Hypertension Guideline — Hypertension](https://www.ahajournals.org/doi/10.1161/hyp.0000000000000065)*\n"}, {"file": "ich-aha-asa-2022-eso-2025.md", "title": "Intracerebral hemorrhage (ICH)", "system": "Neuro", "body": "# Intracerebral hemorrhage (ICH) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Primary source (unchanged, still current — 4y old, retained):** 2022 Guideline for the Management of\n> Patients With Spontaneous Intracerebral Hemorrhage, American Heart Association/American Stroke\n> Association, *Stroke* 2022. https://www.ahajournals.org/doi/10.1161/STR.0000000000000407\n> **Complementary source (added):** European Stroke Organisation (ESO) & European Association of\n> Neurosurgical Societies (EANS) Guideline on Stroke Due to Spontaneous Intracerebral Haemorrhage,\n> *European Stroke Journal* 2025 (Steiner T, Purrucker JC, Aguiar de Sousa D, et al.), an update of the\n> 2014 ESO ICH guideline. DOI 10.1177/23969873251340815 · PMID 40401775 ·\n> https://journals.sagepub.com/doi/full/10.1177/23969873251340815 — citation verified directly against\n> the ESO guideline directory at https://eso-stroke.org/guidelines/eso-guideline-directory/. A related\n> companion document, *2025 update to the ESO guideline on blood pressure management in acute ischaemic\n> stroke and intracerebral haemorrhage* (*European Stroke Journal* 2025), covers BP specifically —\n> flagged separately below where its BP framing differs from AHA/ASA's.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022 (AHA/ASA, primary) + 2025 (ESO/EANS,\n> complementary) · applies to spontaneous ICH only (not trauma, AVM, aneurysm, or tumor-related hemorrhage)\n\n## ⚠ Where AHA/ASA 2022 and ESO/EANS 2025 differ — verify locally before acting\n- **BP lowering strength of evidence**: AHA/ASA gives a fairly assertive **SBP 130–140 mmHg** target\n  (below). ESO/EANS 2025 grades the evidence for **acute BP lowering as weak** and frames it with more\n  caution — a genuine area of trans-Atlantic divergence, not just phrasing. *Follow your unit's adopted\n  standard; do not silently average the two.*\n- **Surgical evacuation evidence**: ESO/EANS 2025 explicitly grades **open craniotomy, minimally invasive\n  surgery, and decompressive surgery for supratentorial ICH as weak-evidence**, and **cerebellar ICH\n  evacuation for volume >15 mL as weak-evidence** — a **volume-based** cerebellar threshold, vs. AHA/ASA's\n  **diameter-based (>3 cm)** threshold below. *(verify both — they are not necessarily numerically\n  equivalent; confirm which your neurosurgical service uses)*\n\n## First hour — limit hematoma expansion\n- [ ] **Non-contrast head CT** ± CTA (\"spot sign\") to assess expansion risk *(verify local protocol)*\n- [ ] **BP lowering initiated within the first hour** — AHA/ASA target **SBP 130–140 mmHg** for presenting SBP\n      150–220 mmHg *(verify — do not treat below ~130 acutely; ESO/EANS 2025 grades this evidence as\n      weak — see divergence note above)*; smooth, sustained control preferred over\n      bolus dosing — continuous infusion agent\n- [ ] **Anticoagulant identified and stopped immediately**\n- [ ] **Rapid reversal of anticoagulation**:\n  - [ ] Warfarin + INR ≥2.0 → **4-factor PCC + vitamin K** *(verify dose)*\n  - [ ] DOAC → **specific reversal agent** (e.g. andexanet/idarucizumab) or PCC per agent *(verify)*\n  - [ ] Antiplatelet-associated ICH → **platelet transfusion NOT routinely recommended** *(verify — guideline direction, confirm current stance)*\n- [ ] **Coagulopathy correction** (factor deficiency, severe thrombocytopenia) if present\n- [ ] **Repeat CT** if neurologic decline or to confirm stability of hematoma size\n\n## ICP / mass effect / hydrocephalus\n- [ ] **Neuro checks** (GCS + focal exam) at frequency per severity *(verify interval)*\n- [ ] **EVD placed** for hydrocephalus with decreased level of consciousness\n- [ ] **ICP monitoring/treatment** considered for GCS ≤8, evidence of transtentorial herniation, or\n      significant IVH/hydrocephalus *(verify indication)*\n- [ ] **Surgical evacuation considered** — posterior fossa/cerebellar ICH **>3 cm** (AHA/ASA, diameter) /\n      **>15 mL** (ESO/EANS 2025, volume) with brainstem compression or hydrocephalus is a **surgical\n      emergency**; supratentorial evacuation individualized — **minimally invasive evacuation may be\n      considered** per AHA/ASA 2022, though **ESO/EANS 2025 grades supratentorial surgical evidence\n      (open, minimally invasive, and decompressive) as weak across the board** *(verify criteria and which\n      society's framing your neurosurgical service follows)*\n- [ ] **Head of bed ≥30°**, midline positioning\n\n## Medical management\n- [ ] **Seizure prophylaxis NOT routine** — treat clinical seizures; continuous **EEG** if depressed\n      consciousness out of proportion to injury *(verify)*\n- [ ] **Glucose management** — avoid hypo- and hyperglycemia *(target per protocol — verify)*\n- [ ] **Temperature control** — treat fever aggressively\n- [ ] **VTE prophylaxis** — intermittent pneumatic compression from admission; pharmacologic ppx once\n      bleeding stability documented (commonly ~48 h) *(verify timing)*\n- [ ] **Avoid hypotonic/hypoosmolar IV fluids**\n- [ ] **Nutrition** — dysphagia screen before oral intake; early enteral if NPO prolonged\n- [ ] **Organized stroke-unit level of care** — ESO/EANS 2025 notes this carries **strong evidence** for\n      improved outcomes; confirm ICU/stroke-unit pathway is engaged, not just \"medical ICU generic care\"\n\n## Anticipatory / disposition\n- [ ] **Etiology workup** — vascular imaging if suspicion of secondary cause (young age, lobar location, atypical pattern)\n- [ ] **Goals-of-care discussion** — avoid premature \"do-not-resuscitate\" driven early withdrawal bias; use\n      validated prognostic scores cautiously, not as sole basis for care limitation\n- [ ] **Anticoagulation resumption timing** discussed with relevant specialty if indication persists (e.g. mechanical valve, high-risk AF) *(verify — individualized, no single fixed interval)*\n- [ ] **Secondary-prevention BP control** — ESO/EANS 2025 notes **strong evidence** for long-term BP\n      lowering to prevent recurrence; ensure this is distinguished in documentation from acute-phase BP\n      management above\n- [ ] **Rehab/PT/OT/speech** evaluation\n\n## Commonly-missed on documentation (what the gap-check flags)\nBP-lowering started within 1h + target documented (and which society's target/evidence grade was used)? ·\nanticoagulant identified/reversed with agent+dose? · hydrocephalus/EVD need assessed? ·\ncerebellar/posterior-fossa surgical criteria checked (diameter AND/OR volume threshold)? · seizure ppx NOT\ngiven without indication? · VTE mechanical ppx from admission? · organized stroke-unit care confirmed? ·\nsecondary-prevention BP plan distinct from acute-phase plan? · GoC conversation timing (not premature)?\n\n*Sources: [2022 AHA/ASA Guideline for Spontaneous ICH — Stroke](https://www.ahajournals.org/doi/10.1161/STR.0000000000000407) · [AHA/ASA Clinical Update slide deck — stroke.org](https://www.stroke.org/-/media/Files/Professional/Quality-Improvement/Hemorrhagic--Stroke/2022-Guideline-for-the-Management-of-Patients-With-Spontaneous-ICH-Clinical-Update-Slides.pdf) · [ESO/EANS 2025 Guideline on Stroke Due to Spontaneous Intracerebral Haemorrhage — European Stroke Journal](https://journals.sagepub.com/doi/full/10.1177/23969873251340815) · [ESO/EANS 2025 ICH guideline — PubMed](https://pubmed.ncbi.nlm.nih.gov/40401775/) · [2025 update to ESO guideline on BP management in acute ischaemic stroke and ICH — European Stroke Journal (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/) · [ESO Guideline Directory](https://eso-stroke.org/guidelines/eso-guideline-directory/)*\n"}, {"file": "icu-delirium-sccm-padis-2025.md", "title": "ICU delirium — assessment, prevention & management checklist", "system": "Neuro", "body": "# ICU delirium — assessment, prevention & management checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** A Focused Update to the SCCM Clinical Practice Guidelines for the Prevention and\n> Management of Pain, Agitation/Sedation, Delirium, Immobility, and Sleep Disruption in Adult Patients\n> in the ICU (**PADIS 2025 Focused Update** — now covering **P**ain, **A**gitation/sedation, **D**elirium,\n> **I**mmobility, **S**leep disruption **+ Anxiety**), Society of Critical Care Medicine, 2025.\n> https://www.sccm.org/clinical-resources/guidelines/guidelines/focused-update-padis-guideline\n> **Builds on, does not discard**, the parent PADIS 2018 guideline (*Critical Care Medicine* 2018) —\n> the 2018 document remains the base framework; the 2025 focused update adds a **new anxiety domain**\n> and issues **5 new/revised statements** (dexmedetomidine, anxiety, delirium antipsychotics, immobility,\n> sleep) rather than re-litigating the whole guideline.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 focused update (base: PADIS 2018)\n\n## Assessment\n- [ ] **Validated delirium screening tool used** (e.g. CAM-ICU or ICDSC) at regular intervals *(frequency — verify local protocol, typically each shift)*\n- [ ] **Sedation depth assessed first** (RASS or SAS) — delirium assessment interpreted in context of arousal level, not scored if deeply sedated\n- [ ] **Pain assessed** with a validated tool (e.g. CPOT, BPS) — untreated pain is a delirium driver\n- [ ] **Anxiety assessed** — new 2025 domain; use a validated approach where available *(no single\n  preferred tool specified by the update — verify local protocol)*\n- [ ] **Subsyndromal delirium** also flagged, not just full CAM-ICU-positive delirium\n\n## Prevention — multicomponent, non-pharmacologic (ABCDEF-bundle framing)\n- [ ] **Reorientation** — clocks, calendars, family involvement, explain plan of care\n- [ ] **Cognitive stimulation**\n- [ ] **Early mobilization/rehabilitation** — performed unless contraindicated; **2025 update suggests\n  *enhanced* mobilization/rehabilitation over usual-care mobilization** (moderate certainty, conditional\n  recommendation) to mitigate ICU-acquired weakness — *verify what \"enhanced\" means locally (intensity/frequency)*\n- [ ] **Sleep optimization** — reduce night-time noise/light, cluster cares, minimize unnecessary awakenings\n      *(bright light therapy specifically NOT supported by evidence — do not rely on it)*\n- [ ] **Melatonin** — **2025 update suggests melatonin over no melatonin** for sleep (low certainty,\n  conditional recommendation) *(dose/timing — verify local protocol)*\n- [ ] **Hearing/vision aids** provided if used at baseline\n- [ ] **Minimize modifiable risk factors** — benzodiazepines, unnecessary blood transfusion\n- [ ] **Daily sedation interruption / spontaneous awakening trial** paired with spontaneous breathing trial\n- [ ] **Family presence/engagement** encouraged\n\n## Sedation choice — updated 2025 recommendation\n- [ ] **Dexmedetomidine suggested over propofol** for sedation in mechanically ventilated adults, where\n  **light sedation and delirium reduction are priorities** (moderate certainty, conditional\n  recommendation) — *this is a sedation-strategy recommendation, distinct from delirium-prevention\n  claims below; verify against hemodynamic tolerance and local protocol*\n\n## Pharmacologic — what NOT to do / where evidence remains insufficient\n- [ ] **Do NOT use dexmedetomidine, statins, or ketamine specifically to *prevent* delirium** — not\n  supported as a prevention strategy (distinct from the sedation-choice recommendation above)\n- [ ] **Do NOT use haloperidol or atypical antipsychotics to *prevent* delirium** (not supported)\n- [ ] **Antipsychotics for treating established delirium** — 2025 update is **unable to recommend for\n  or against** antipsychotics vs usual care (low certainty) — treat as an unresolved question, not a\n  green light for routine use\n- [ ] **Do NOT treat subsyndromal delirium with haloperidol/atypical antipsychotics**\n- [ ] **Benzodiazepines for anxiety** — 2025 update is **unable to recommend for or against** (insufficient\n  evidence) — do not treat this as tacit endorsement\n- [ ] **Benzodiazepines avoided** as primary sedative where feasible (delirium risk factor)\n\n## Pharmacologic — management once delirium present\n- [ ] **Treat the underlying driver first** — pain, hypoxia, metabolic derangement, infection, withdrawal, polypharmacy review\n- [ ] **Antipsychotics reserved**, not routine, for delirium itself — use only if severe agitation/distress\n      threatens safety, and only briefly *(agent/dose — verify; 2025 update explicitly does not endorse\n      routine use, consistent with 2018)*\n- [ ] **Dexmedetomidine considered** specifically when agitation is impeding extubation/ventilator weaning,\n      and now also supported as a first-choice sedative over propofol when light sedation/delirium\n      reduction is the goal *(verify local protocol)*\n- [ ] **Avoid physical restraints** where possible — use as last resort, reassess frequently\n\n## Monitoring / follow-through\n- [ ] **Daily reassessment** of ongoing need for any sedative/antipsychotic started\n- [ ] **Document delirium duration** — persistent delirium prompts broadened workup\n- [ ] **Anxiety course documented** alongside delirium/sedation course (new domain)\n- [ ] **Discharge/handover note** flags delirium (and anxiety) course for post-ICU follow-up (cognitive impairment risk)\n\n## Commonly-missed on documentation (what the gap-check flags)\nValidated screening tool + sedation level charted (not skipped when deeply sedated)? · anxiety assessed\nas its own domain? · pain scored with validated tool? · SAT/SBT paired trial documented? · mobilization\nattempted, and \"enhanced\" mobilization considered where feasible? · melatonin considered for sleep? ·\ndexmedetomidine-vs-propofol sedation choice documented with rationale? · antipsychotic (if any) justified\nby safety indication, not delirium-prevention or reflexive treatment, and time-limited? · reversible\ndriver workup documented before/alongside pharmacologic treatment?\n\n*Sources: [A Focused Update to SCCM PADIS Guidelines — SCCM](https://www.sccm.org/clinical-resources/guidelines/guidelines/focused-update-padis-guideline) · [PADIS 2018 Guidelines — SCCM](https://www.sccm.org/clinical-resources/guidelines/guidelines/guidelines-for-the-prevention-and-management-of-pa)*\n"}, {"file": "ischemic-stroke-aha-asa-2026.md", "title": "Acute ischemic stroke", "system": "Neuro", "body": "# Acute ischemic stroke — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2026 Guideline for the Early Management of Patients With Acute Ischemic Stroke, American\n> Heart Association/American Stroke Association, *Stroke* 2026 — supersedes the prior 2019 update to the\n> 2018 guideline (`ischemic-stroke-aha-asa-2019.md`, superseded/removed).\n> https://www.ahajournals.org/doi/10.1161/STR.0000000000000513\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026\n\n## Hyperacute — first hour\n- [ ] **Time last-known-well** established; **NIHSS** documented\n- [ ] **Non-contrast head CT** (± CTA/CT perfusion for LVO screen) completed emergently\n- [ ] **Glucose checked**; correct if abnormal *(hypoglycemia is a stroke mimic)*\n- [ ] **BP <185/110 mmHg** before IV thrombolysis *(verify)* — treat with IV antihypertensive if above threshold, do not delay thrombolysis unnecessarily\n- [ ] **IV thrombolysis given if eligible** — **either tenecteplase (0.25 mg/kg, single bolus) or alteplase\n  (0.9 mg/kg, bolus + infusion)** within **≤4.5 h** — 2026 update gives **both agents a Class 1\n  recommendation** for this window *(verify current agent/dose choice at your site — tenecteplase's\n  single-bolus dosing is operationally attractive, esp. for transfers)*\n- [ ] **Rapid thrombolysis for disabling deficits** — treat within the 4.5 h window regardless of NIHSS\n  score, without requiring advanced imaging selection *(verify \"disabling\" definition/local practice)*\n- [ ] **Extended-window thrombolysis** considered for **4.5–9 h** from onset, or **wake-up/unknown-onset**\n  stroke, using advanced imaging (DWI-FLAIR mismatch or perfusion mismatch) selection *(verify imaging\n  criteria/availability)*\n- [ ] **Thrombolysis given before thrombectomy** in patients eligible for both — do not withhold or delay\n  one to pursue the other\n\n## Endovascular therapy screen\n- [ ] **LVO confirmed on CTA** (anterior circulation) → **mechanical thrombectomy** if **≤6 h** from\n  last-known-well\n- [ ] **Extended window (6–24 h)** thrombectomy considered if perfusion/clinical-core mismatch criteria\n  met (DAWN/DEFUSE-3-type criteria) *(verify current criteria)*\n- [ ] **Large-core infarcts** — thrombectomy eligibility now **expanded** per 2026 update reflecting recent\n  large-core trials; do not exclude on core size alone *(verify current core-volume thresholds)*\n- [ ] **Basilar artery occlusion** → thrombectomy within **24 h** carries a **strong (Class 1-tier)**\n  recommendation when **NIHSS ≥10** *(verify exact criteria — new in 2026)*\n- [ ] **Transport decision**: direct-to-nearest-EVT-capable-center vs. drip-and-ship per **local system of\n  care** characteristics (transfer-process speed) *(verify local pathway)* — **mobile stroke units**\n  endorsed where available\n\n## Post-reperfusion / in-hospital\n- [ ] **BP <180/105 mmHg** maintained for **≥24 h** after IV thrombolysis *(verify)*\n- [ ] **No antiplatelet/anticoagulant** for 24 h post-thrombolysis until repeat imaging excludes hemorrhage\n- [ ] **Repeat head CT/MRI** if neuro decline or before starting antithrombotics\n- [ ] **Dysphagia screen before any oral intake**\n- [ ] **Continuous cardiac monitoring** (≥24 h) for AF detection\n- [ ] **Permissive hypertension** in non-thrombolysed patients unless BP extreme or comorbid indication for lowering *(verify threshold)*\n- [ ] **Temperature control** — treat fever, source-search if present\n- [ ] **Glucose target** per protocol — avoid hypo/hyperglycemia *(verify)*\n- [ ] **VTE prophylaxis** — mechanical ± pharmacologic per timing rules post-thrombolysis\n- [ ] **Early mobilization** unless contraindicated\n\n## Secondary prevention (initiated in-hospital)\n- [ ] **Antiplatelet** initiated (typically 24 h post-thrombolysis) — dual antiplatelet short-course considered for minor stroke/high-risk TIA *(verify regimen)*\n- [ ] **Statin** (high-intensity) initiated\n- [ ] **Etiologic workup** — echocardiogram, carotid imaging, telemetry/Holter for AF\n- [ ] **Anticoagulation** if cardioembolic source confirmed — timing individualized to infarct size/hemorrhagic transformation risk\n- [ ] **Swallowing/PT/OT/speech evaluation**; rehab planning\n- [ ] **Goals of care / disposition planning**\n\n## Commonly-missed on documentation (what the gap-check flags)\nLast-known-well time documented? · NIHSS recorded? · BP threshold met/documented before lytic? ·\nthrombolytic agent + dose stated (tenecteplase vs alteplase)? · door-to-needle time? · thrombectomy\neligibility screened (LVO on CTA; large-core and basilar-occlusion pathways not overlooked)? · 24h\npost-lytic BP + no-antithrombotic window honored? · dysphagia screen before oral intake? · statin +\nantiplatelet started? · AF monitoring ordered?\n\n*Sources: [2026 AHA/ASA Guideline for the Early Management of Acute Ischemic Stroke — Stroke](https://www.ahajournals.org/doi/10.1161/STR.0000000000000513) · [2026 Guideline — Top Things to Know (AHA Professional Heart Daily)](https://professional.heart.org/en/science-news/2026-guideline-for-the-early-management-of-patients-with-acute-ischemic-stroke/top-things-to-know) · [New guideline expands stroke treatment for adults — AHA Newsroom](https://newsroom.heart.org/news/new-guideline-expands-stroke-treatment-for-adults-offers-first-pediatric-stroke-guidance)*\n"}, {"file": "lower-gi-bleed-acg-2023.md", "title": "Lower GI bleed", "system": "GI / Hepatic", "body": "# Lower GI bleed — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Management of Patients With Acute Lower Gastrointestinal Bleeding: An Updated ACG\n> Guideline (Sengupta N et al., American College of Gastroenterology), *Am J Gastroenterol* 2023 —\n> https://pubmed.ncbi.nlm.nih.gov/36735555/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Initial assessment & risk stratification\n- [ ] Hemodynamic assessment + volume resuscitation started as needed\n- [ ] Risk-stratify with a validated tool to separate high- vs. low-risk patients *(tool choice — verify local practice)*\n- [ ] RBC transfusion threshold **7 g/dL** (consider **8 g/dL** if unstable cardiovascular disease) *(verify)*\n- [ ] Hematochezia with **hemodynamic instability** → consider an **upper GI source**; perform upper endoscopy first if suspected\n- [ ] Anticoagulant/antiplatelet management individualized; reversal agents selected per severity *(agent — verify)*\n\n## Diagnostic pathway\n- [ ] **Colonoscopy** as the initial diagnostic procedure for most patients, within **24 h** of presentation after adequate bowel preparation\n- [ ] **CT angiography** for high-risk ongoing hemorrhage or instability precluding prep/colonoscopy — used to localize source before intervention *(institutional pathway — verify)*\n- [ ] Radionuclide/tagged RBC scan role limited relative to CTA where CTA is available *(verify)*\n\n## Therapeutic management\n- [ ] Endoscopic hemostasis for stigmata of recent hemorrhage (diverticular bleed, post-polypectomy, etc.) using thermal/mechanical/injection modality as appropriate\n- [ ] Interventional radiology (angioembolization) for an actively bleeding source identified on CTA\n- [ ] Surgery reserved and individualized — the source must be **carefully localized** before any resection\n- [ ] Antithrombotic resumption planned post-hemostasis, individualized risk-benefit — avoid indefinite blanket withholding *(timing — verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nUpper-GI source excluded when instability + hematochezia present? · time-to-colonoscopy documented? ·\nCTA considered when hemodynamically unstable or prep not feasible? · bleeding source localized before\nany surgical referral? · antithrombotic resumption plan documented at discharge?\n\n*Sources: [Management of Acute Lower GI Bleeding: An Updated ACG Guideline — Sengupta et al. 2023](https://pubmed.ncbi.nlm.nih.gov/36735555/)*\n"}, {"file": "massive-hemoptysis-scii-2023.md", "title": "Massive (life-threatening) hemoptysis", "system": "Respiratory", "body": "# Massive (life-threatening) hemoptysis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Society of Chest Imaging and Interventions (SCII) Consensus Guidelines for the\n> Interventional Radiology Management of Hemoptysis, 2023.\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC10289864/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Immediate stabilization — airway first\n- [ ] **Lateralize and protect the non-bleeding lung** — position bleeding side dependent once source\n  side known *(verify)*\n- [ ] For ongoing bleeding: **selective bronchial intubation**, **bronchial blocker/balloon\n  tamponade**, or **double-lumen endotracheal tube** to isolate the airway *(verify indication/technique)*\n- [ ] **Correct coagulopathy**: hold anticoagulants/antiplatelets, transfuse PRBC/FFP/platelets as\n  indicated\n- [ ] Consider **IV tranexamic acid** *(dose — verify)*\n\n## Diagnostic imaging\n- [ ] **CT angiography** once stabilized — extended field (neck to renal arteries), biphasic/\n  split-bolus contrast, thin slices (**≤1.5 mm**) *(verify protocol)*\n- [ ] Identify bleeding source territory: **bronchial artery** (~90% of cases) vs nonbronchial systemic\n  vs pulmonary artery *(verify)*\n\n## Bronchoscopy\n- [ ] **Flexible bronchoscopy** at bedside for unstable patients — lateralize bleeding, clear clot,\n  local tamponade/medication instillation\n- [ ] **Rigid bronchoscopy** if available/needed — better airway control and clot evacuation; requires\n  OR/general anesthesia\n- [ ] Best diagnostic yield **during active bleeding or within 24–48 h** of cessation *(verify timing)*\n\n## Definitive hemostasis\n- [ ] **Bronchial artery embolization (BAE)** — first-line definitive therapy after initial\n  stabilization *(verify institutional pathway/access to IR)*\n- [ ] **Surgery** reserved for localized disease in good surgical candidates, or BAE/bronchoscopy\n  failure — emergent surgery during active bleeding carries substantially higher mortality than elective\n  surgery *(verify mortality data currency)*\n\n## Post-stabilization\n- [ ] Address the **underlying etiology** (TB, bronchiectasis, malignancy, aspergilloma, etc.)\n- [ ] Follow-up schedule after BAE arranged *(verify — commonly 1 week, then 1/3/6/12 months)*\n- [ ] Monitor for recurrence; recurrence risk factors reviewed (cavitation, necrosis, aspergilloma,\n  cavitary/MDR-TB, malignancy) *(verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nNon-bleeding lung actively protected before other maneuvers? · coagulopathy reversal documented? · CTA\nobtained (when patient stable enough) before/alongside bronchoscopy? · BAE considered as first-line\nbefore emergent surgery? · underlying-etiology workup planned post-stabilization?\n\n*Sources: [SCII Consensus Guidelines for IR Management of Hemoptysis — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC10289864/) · [Bronchial Artery Embolization in Life-Threatening Massive Hemoptysis — PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3955516/)*\n"}, {"file": "meningitis-encephalitis-idsa-2004-2008.md", "title": "Bacterial meningitis / encephalitis", "system": "ID", "body": "# Bacterial meningitis / encephalitis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Practice Guidelines for the Management of Bacterial Meningitis (Tunkel AR et al., IDSA),\n> *Clinical Infectious Diseases* 2004;39:1267–84 — and The Management of Encephalitis: Clinical Practice\n> Guidelines by the IDSA (Tunkel AR et al.), *Clinical Infectious Diseases* 2008;47:303–27.\n> https://academic.oup.com/cid/article/39/9/1267/402080 · https://academic.oup.com/cid/article/47/3/303/313455\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2004 / 2008 (both due for a newer edition — check periodically)\n\n## Immediate actions (do not wait on imaging/LP to treat)\n- [ ] **Empiric antibiotics within 1 hour** of suspicion *(verify institutional target)* — do not delay for CT/LP if that would push therapy past this window\n- [ ] **Blood cultures before antibiotics** (does not delay abx)\n- [ ] **CT head before LP** only if focal neuro deficit, papilledema, seizure, immunocompromise, or reduced GCS — otherwise proceed to LP directly\n- [ ] **LP**: cell count/diff, glucose (+ paired serum), protein, Gram stain, culture; consider **PCR panel** (HSV, enterovirus, VZV, bacterial multiplex) — *verify local panel*\n- [ ] **Empiric regimen** — age/exposure-adjusted (e.g. vancomycin + 3rd-gen cephalosporin ± ampicillin for *Listeria* coverage) — <agents/doses> — verify against local antibiogram and guideline table\n- [ ] **Empiric IV acyclovir** if encephalitis / HSV cannot be excluded — <10–20 mg/kg IV q8h — verify by age/renal function> — start **pending** diagnostics, do not wait for PCR\n\n## Adjunctive therapy\n- [ ] **Dexamethasone** — give **with or just before the first antibiotic dose** (benefit lost if given after); continue only if CSF/blood confirms *S. pneumoniae* (or *H. influenzae* in children) — <dose/schedule — verify>\n- [ ] **De-escalate/stop dexamethasone** if a non-indicated pathogen is identified\n\n## Ongoing ICU management\n- [ ] **Neuro checks / seizure watch** — treat seizures per unit protocol; consider EEG if unexplained decreased consciousness (esp. encephalitis)\n- [ ] **ICP management** if signs of raised ICP / herniation risk — head of bed, osmotherapy per protocol\n- [ ] **Isolation/droplet precautions** until meningococcus excluded; **chemoprophylaxis for close contacts** if meningococcal — notify public health\n- [ ] **De-escalate antibiotics** once organism + sensitivities known; confirm **total duration** per organism (varies by pathogen) — *verify*\n- [ ] **Repeat LP** only if indicated (poor response, resistant organism, ongoing fever) — not routine\n- [ ] **Hearing assessment / neuro follow-up** planned before discharge (pneumococcal/H. flu meningitis)\n\n## Commonly-missed on documentation (what the gap-check flags)\nDoor-to-antibiotic time documented? · dexamethasone timed with first dose (not after)? · steroids stopped if non-indicated organism? ·\nempiric acyclovir given if encephalitis possible? · seizure/ICP surveillance documented? · isolation + contact prophylaxis addressed (meningococcus)? ·\nantibiotic duration + de-escalation plan stated?\n\n*Sources: [Practice Guidelines for the Management of Bacterial Meningitis — IDSA 2004 (Oxford Academic)](https://academic.oup.com/cid/article/39/9/1267/402080) · [The Management of Encephalitis: IDSA Guidelines 2008 (Oxford Academic)](https://academic.oup.com/cid/article/47/3/303/313455)*\n"}, {"file": "mesenteric-ischemia-bowel-obstruction-wses-2022.md", "title": "Acute mesenteric ischemia / bowel obstruction", "system": "GI / Hepatic", "body": "# Acute mesenteric ischemia / bowel obstruction — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Acute Mesenteric Ischemia: Updated Guidelines of the World Society of Emergency Surgery\n> (Bala M et al., WSES), *World J Emerg Surg* 2022 — https://pubmed.ncbi.nlm.nih.gov/36261857/\n> Bowel obstruction: Bologna Guidelines for Diagnosis and Management of Adhesive Small Bowel\n> Obstruction (ASBO): 2017 Update, WSES ASBO Working Group —\n> https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6006983/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2022 (AMI) / 2017 (ASBO)\n\n## Acute mesenteric ischemia — recognition & diagnosis\n- [ ] High suspicion for AMI with pain-out-of-proportion-to-exam, especially with atrial fibrillation/embolic risk, known PVD/prior mesenteric thrombosis, or a low-flow/vasopressor-dependent state (NOMI)\n- [ ] **CT angiography** as the first-line diagnostic study — do not delay for lactate or other labs if suspicion is high\n- [ ] Classify mechanism: embolic (~50%), arterial thrombotic (~15-25%), venous thrombosis (~5-15%), or non-occlusive (NOMI) — mechanism drives treatment choice\n- [ ] Correct the precipitating low-flow state (optimize hemodynamics, minimize vasopressor exposure if NOMI) in parallel with workup\n\n## Acute mesenteric ischemia — treatment\n- [ ] Early **revascularization** — endovascular (thrombectomy/thrombolysis/stenting) vs. open surgical, chosen per anatomy, center expertise, and hemodynamic stability *(approach — verify per institutional capability)*\n- [ ] Resect clearly necrotic bowel; reassess viability of borderline segments before committing to the extent of resection\n- [ ] Use **damage-control technique** (temporary abdominal closure, planned re-look laparotomy) when bowel viability is uncertain or the patient is unstable\n- [ ] Broad-spectrum antibiotics for bowel ischemia/perforation risk *(agent — verify)*\n- [ ] Anticoagulation for embolic/thrombotic AMI once bleeding risk from any planned intervention allows *(timing/agent — verify)*\n- [ ] Multidisciplinary involvement (vascular surgery, interventional radiology) from time of diagnosis\n\n## Small bowel obstruction — assessment\n- [ ] CT with contrast to confirm diagnosis, identify the transition point, and look specifically for **signs of strangulation** (free fluid, mesenteric edema, small-bowel-feces sign, reduced/absent wall enhancement)\n- [ ] Distinguish adhesive (ASBO) from other etiologies (hernia, malignancy, virgin abdomen) — management pathway differs\n- [ ] Any peritonitis, strangulation signs, or closed-loop obstruction → proceed to **surgery**, do not trial non-operative management\n\n## Small bowel obstruction — management\n- [ ] Nasogastric decompression + IV fluid/electrolyte correction for all non-operative-management (NOM) candidates\n- [ ] **Water-soluble contrast challenge** — both diagnostic and therapeutic; passage into the colon within 24 h predicts non-operative resolution\n- [ ] NOM duration, in the absence of strangulation/peritonitis, may extend up to **72 h**; if unresolved by then → surgery *(threshold — verify local practice)*\n- [ ] Laparoscopic approach may be considered in selected patients with appropriate expertise; open surgery preferred for strangulating ASBO or after failed NOM\n\n## Commonly-missed on documentation (what the gap-check flags)\nAMI suspected early in pain-out-of-proportion presentations? · CTA obtained without diagnostic delay? ·\nmechanism (embolic/thrombotic/venous/NOMI) documented and driving treatment choice? · damage-control\nconsidered when viability is uncertain? · SBO CT specifically reviewed for strangulation signs? ·\nwater-soluble contrast challenge used for NOM candidates? · 72 h NOM ceiling respected/documented?\n\n*Sources: [Acute Mesenteric Ischemia: Updated Guidelines of the World Society of Emergency Surgery 2022](https://pubmed.ncbi.nlm.nih.gov/36261857/) · [Bologna Guidelines for Diagnosis and Management of ASBO: 2017 WSES Update](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6006983/)*\n"}, {"file": "nsti-wses-2022.md", "title": "Necrotizing soft-tissue infection", "system": "ID", "body": "# Necrotizing soft-tissue infection — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** WSES/GAIS/WSIS/SIS-E/AAST global clinical pathways for patients with skin and soft-tissue\n> infections (Sartelli M et al.; World Society of Emergency Surgery, Global Alliance for Infections in\n> Surgery, World Surgical Infection Society, Surgical Infection Society-Europe, American Association for\n> the Surgery of Trauma), *World Journal of Emergency Surgery* 2022.\n> https://pubmed.ncbi.nlm.nih.gov/35033131/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022 (supersedes the 2018 WSES/SIS-E consensus\n> document — check for a newer edition periodically)\n\n## Recognition & diagnosis — do not let this stall surgery\n- [ ] **Clinical suspicion first**: pain out of proportion to exam, edema extending beyond erythema, fever, rapid progression, crepitus/bullae/skin necrosis (late signs — absence does NOT exclude)\n- [ ] **LRINEC score** may support suspicion but **lacks sensitivity to be a reliable diagnostic adjunct**\n  *(2022 pathway explicitly downgrades reliance on LRINEC vs. 2018 — verify)* — **a low score does not\n  rule out NSTI**\n- [ ] **CT** preferred if diagnosis unclear and patient stable — fat stranding, fluid/gas tracking along\n  fascial planes; **point-of-care ultrasound** reasonable for rapid bedside assessment (fascial thickening,\n  \"cobblestoning\") if unstable *(verify local availability)*\n- [ ] **Do not delay operative exploration** for imaging in a clinically obvious/deteriorating case — surgical exploration is the diagnostic gold standard\n\n## Source control — the dominant driver of survival\n- [ ] **Emergent surgical debridement** — target **as soon as possible, within 6 h of admission** for\n  suspected cases *(2022 pathway tightens the target from 12h to 6h — mortality 19% if <6h vs 32% if >6h\n  — verify local target)*\n- [ ] Remove **all devitalized tissue**; **skin-sparing technique** where feasible to preserve viable tissue; leave wound open\n- [ ] **Planned re-exploration at 12–24 h** (or sooner if deteriorating), repeated until no further necrosis found\n- [ ] **Negative-pressure wound therapy** applied after debridement to manage exudate *(verify local practice)*\n- [ ] Involve **surgery early** — do not wait for antibiotics/resuscitation to \"catch up\" before consult\n- [ ] Consider **amputation** if limb non-salvageable / life-threatening\n\n## Antimicrobials & resuscitation\n- [ ] **Empiric broad-spectrum coverage ASAP** — aerobic + anaerobic + gram-positive (incl. MRSA) —\n  regimen individualized to local antibiogram *(verify)*\n- [ ] **Add clindamycin/linezolid** for antitoxin effect if streptococcal/clostridial NSTI suspected — *verify*\n- [ ] **Fluid resuscitation & hemodynamic support** per shock physiology; treat as a surgical sepsis emergency\n- [ ] **Duration individualized** to clinical response and adequacy of source control — *verify local\n  protocol (no fixed universal day-count specified)*\n- [ ] **Multidisciplinary team** — surgery, critical care, ID — involved from presentation through rehab\n\n## Adjuncts (do not delay definitive care for these)\n- [ ] Consider **IVIG** specifically for **streptococcal (GAS) NSTI** *(weak/conditional recommendation — verify dose/criteria)*\n- [ ] Consider **hyperbaric oxygen where readily available** and **never** in place of/delaying debridement *(weak recommendation — verify)*\n- [ ] **Nutrition, VTE ppx, analgesia, wound care planning** per general critical-care bundle\n\n## Commonly-missed on documentation (what the gap-check flags)\nTime-to-OR documented against the **6-hour** target (not the older 12h benchmark)? · LRINEC/imaging noted\nas adjunct only (not used to exclude)? · re-exploration planned/booked? · antibiotic regimen covers\nstrep/clostridial toxin (clindamycin)? · IVIG considered specifically for streptococcal NSTI? ·\nmultidisciplinary team named?\n\n*Sources: [WSES/GAIS/WSIS/SIS-E/AAST global clinical pathways for SSTI 2022 — World J Emerg Surg (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC8761341/) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/35033131/) · [Prior edition — 2018 WSES/SIS-E consensus conference — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC6295010/)*\n"}, {"file": "pe-massive-submassive-aha-multisociety-2026.md", "title": "Pulmonary embolism (acute PE — risk-stratified)", "system": "Respiratory", "body": "# Pulmonary embolism (acute PE — risk-stratified) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2026 AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN Guideline for the Evaluation and\n> Management of Acute Pulmonary Embolism in Adults — the **first ACC/AHA guideline on this topic**,\n> *Circulation*/*JACC* 2026. **Different body from the prior source** (`pe-massive-submassive-esc-2019.md`,\n> 2019 ESC/ERS guideline, superseded/removed) — adopted as primary here as the newer, more comprehensive,\n> multisociety guideline; the 2019 ESC document was the prior operative source and used \"massive/\n> submassive\" terminology.\n> https://www.jacc.org/doi/10.1016/j.jacc.2025.12.023 (Guideline-at-a-Glance; full guideline also at\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001415)\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026\n\n## ⚠ Terminology change — \"massive/submassive\" retired\nThe 2026 AHA/ACC guideline **replaces \"massive/submassive/low-risk\" with the AHA/ACC Acute PE Clinical\nCategories A–E** (with subcategories, e.g. D1–2, E1). Update local order-sets/documentation language\naccordingly *(verify local EHR/order-set terminology has been updated — old terms may still appear in\ncharts during the transition)*.\n\n## Risk stratification / categorization — drives all subsequent decisions\n- [ ] **Category A (asymptomatic)** — incidental PE, no hospitalization needed *(verify)*\n- [ ] **Category B (symptomatic, low clinical severity score)** — early hospital discharge generally\n  appropriate *(verify score used and eligibility)*\n- [ ] **Category C (elevated biomarkers and/or RV dysfunction on imaging)** — hospitalize; ≈ prior\n  \"intermediate-low/intermediate\" risk *(verify)*\n- [ ] **Category D (incipient cardiopulmonary failure, subcategories D1–2)** — hospitalize; ≈ prior\n  \"intermediate-high (submassive)\" risk *(verify subcategory criteria)*\n- [ ] **Category E (cardiopulmonary failure with persistent hypotension, subcategory E1 = most severe)** —\n  hospitalize; ≈ prior \"high-risk (massive)\" *(verify)*\n- [ ] Document the **category explicitly** (not just \"PE\") — drives biomarker/imaging workup (troponin ±\n  BNP, RV assessment on echo/CT) and the therapy decisions below\n\n## Category E (cardiopulmonary failure / persistent hypotension — formerly \"massive\")\n- [ ] **Immediate anticoagulation** — unfractionated heparin preferred initially *(verify dosing)*\n- [ ] Hemodynamic/respiratory support: cautious fluid administration (avoid RV overload), vasopressors\n  (norepinephrine first-line) *(verify)*\n- [ ] **Advanced therapies are \"reasonable\" for Category E1**: systemic thrombolysis, catheter-directed\n  thrombolysis/thrombectomy, mechanical thrombectomy, or surgical embolectomy — select per\n  contraindications/availability *(verify institutional pathway/agent-dose)*\n- [ ] Consider **ECMO** as bridge in refractory shock or cardiac arrest *(verify institutional criteria)*\n- [ ] **PE Response Team (PERT) activation** — now a **Class 1 recommendation** for multidisciplinary PE\n  response teams *(verify local PERT availability/activation criteria)*\n\n## Category D (incipient cardiopulmonary failure — formerly \"submassive/intermediate-high\")\n- [ ] Anticoagulation + **close monitoring** (monitored bed/ICU) for hemodynamic deterioration\n- [ ] **Advanced therapies \"can be considered\" for Category D1–2** (individualized — not routine) *(verify\n  local criteria/availability; routine systemic thrombolysis remains generally NOT recommended — reserve\n  as rescue if deteriorating)*\n- [ ] **PERT input** for complex/borderline cases\n\n## Category C (elevated biomarkers/RV dysfunction) and Category A/B (asymptomatic/low severity)\n- [ ] Anticoagulation; hospitalize Category C for monitoring\n- [ ] Consider **early discharge/outpatient treatment** for Category A/B patients per validated score\n  *(verify eligibility criteria)*\n\n## General / adjunct\n- [ ] **Anticoagulant choice**: DOAC preferred over VKA for most patients *(verify contraindications —\n  renal function, pregnancy, antiphospholipid syndrome, cancer-associated thrombosis)*\n- [ ] **Duration**: minimum 3 months; reassess for extended therapy based on provoked/unprovoked status\n  and bleeding risk *(verify)*\n- [ ] **IVC filter** only if absolute contraindication to anticoagulation, or recurrent PE despite\n  adequate anticoagulation *(verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nAHA/ACC Category (A–E, with subcategory) explicitly documented — not legacy \"massive/submassive\" language?\nRV function/biomarkers assessed to assign category? thrombolysis/advanced-therapy contraindications\nactively checked before treatment decision? PERT activated for Category D/E or complex cases (Class 1)?\nanticoagulation duration/extended-therapy plan documented at discharge?\n\n*Sources: [2026 Acute Pulmonary Embolism Guideline-at-a-Glance — JACC](https://www.jacc.org/doi/10.1016/j.jacc.2025.12.023) · [2026 AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN Guideline for Acute PE — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001415) · [First AHA/ACC Guideline for Acute PE Introduces Risk-Based Clinical Framework](https://www.cardiometabolichealth.org/first-aha-acc-guideline-for-acute-pulmonary-embolism-introduces-risk-based-clinical-framework/) · [2026 Guideline — AHA Professional Heart Daily](https://professional.heart.org/en/science-news/2026-guideline-for-the-evaluation-and-management-of-acute-pulmonary-embolism-in-adults) · *(prior source, retained for reference only:* [2019 ESC/ERS Guidelines for acute PE](https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Acute-Pulmonary-Embolism-Diagnosis-and-Management-of)*)*\n"}, {"file": "pneumothorax-bts-2023.md", "title": "Pneumothorax (incl. tension)", "system": "Respiratory", "body": "# Pneumothorax (incl. tension) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** BTS Pleural Disease Guideline / Statement on Pleural Disease and Procedures 2023, British\n> Thoracic Society, 2023.\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC11037506/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Tension pneumothorax — act immediately, do not wait for imaging\n- [ ] **Clinical diagnosis**: hypotension/shock, severe hypoxia, tracheal deviation, distended neck\n  veins, hyper-resonance *(verify full criteria — this is a bedside diagnosis)*\n- [ ] **Immediate needle or finger decompression** — do NOT delay for a chest X-ray *(needle site/\n  length — verify local protocol)*\n- [ ] Follow with **tube thoracostomy** promptly after decompression *(verify)*\n\n## Non-tension pneumothorax — assessment\n- [ ] **Symptom-based approach** (2023 BTS shift away from pure size-based classification)\n- [ ] **High-risk features screened**: hemodynamic compromise, significant hypoxia, bilateral\n  pneumothorax, underlying lung disease, age >50 with significant smoking history, hemopneumothorax\n  *(verify full list)*\n\n## Management options\n- [ ] **Conservative management** (observation) if asymptomatic/mild symptoms, no high-risk features,\n  and reliable follow-up available\n- [ ] **Needle aspiration** vs **ambulatory device** vs **chest drain** chosen per symptoms, risk\n  features, and local resources/expertise *(verify decision pathway)*\n- [ ] **Chest drain indicated**: secondary pneumothorax with respiratory compromise, large/symptomatic\n  primary pneumothorax, traumatic pneumothorax, tension pneumothorax (after decompression) *(size\n  thresholds — verify)*\n\n## Persistent air leak / recurrence\n- [ ] **Thoracic surgery referral (VATS)** for persistent air leak *(duration threshold — verify,\n  commonly ~3–5 days)* or recurrent pneumothorax\n- [ ] Chemical pleurodesis considered if surgery not an option *(verify)*\n\n## Special populations\n- [ ] **Pregnancy**: multidisciplinary approach; consider surgical evaluation before labor if continuous\n  air leak present *(verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nTension diagnosed and treated clinically without waiting for imaging? · decompression time documented? ·\nhigh-risk feature screen completed to justify conservative vs invasive choice? · surgical referral\ntriggered at a defined air-leak duration (not left open-ended)? · follow-up imaging arranged after drain\nremoval?\n\n*Sources: [Updates on BTS Statement on Pleural Disease and Procedures 2023 — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC11037506/) · [Management of spontaneous pneumothorax: a mini-review — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC11320271/) · [Pneumothorax: an update on clinical spectrum, diagnosis and management — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC12159893/)*\n"}, {"file": "post-arrest-neuroprognostication-erc-esicm-2025.md", "title": "Post-cardiac-arrest neuroprognostication", "system": "Neuro", "body": "# Post-cardiac-arrest neuroprognostication — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** European Resuscitation Council and European Society of Intensive Care Medicine (ERC-ESICM)\n> Guidelines 2025: Post-Resuscitation Care (Nolan JP, Sandroni C, et al.), *Resuscitation* 2025;215:110809\n> (co-published in *Intensive Care Medicine*) — neuroprognostication section specifically; supersedes the\n> 2021 ERC-ESICM post-resuscitation guideline.\n> https://pubmed.ncbi.nlm.nih.gov/41123621/\n> **Companion file:** `post-cardiac-arrest-ercesicm-2025.md` covers the full post-ROSC ICU bundle (this file\n> is the neuroprognostication-focused excerpt).\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025\n\n## Preconditions before any prognostication\n- [ ] **Confounders excluded first**: residual sedation/neuromuscular blockade, hypothermia, severe\n      metabolic derangement (incl. hypoglycaemia, sepsis), shock — do not prognosticate through an active\n      confounder\n- [ ] **Fever-avoidance / temperature-control** delivered per unit protocol; note course (affects sedative\n      clearance and exam timing) *(verify local target — terminology changed from \"TTM\" in 2025)*\n- [ ] **Minimum wait ≥72 hours after ROSC** before finalizing a \"poor outcome likely\" determination in\n      unconscious patients (GCS-M <6) *(verify — longer if confounders persist)*\n\n## Step 1 — clinical screen\n- [ ] **GCS motor score documented** — motor score **≤2** at ≥72 h carries 70–80% sensitivity (low\n      specificity) as the screening trigger to proceed to multimodal testing *(verify — refined threshold\n      vs. 2021's \"≤3\"; confirm exact cut-off against source)*\n- [ ] **Pupillary and corneal reflexes** assessed — **bilaterally absent at ≥72 h** is highly specific\n      (>99%) for poor outcome *(use quantitative pupillometry where available)*\n- [ ] **Status myoclonus** documented if present within **≤72 h** — early myoclonus (<48 h) predicts poor\n      outcome **only when paired with a malignant EEG background**, not in isolation *(2025 refinement —\n      verify)*\n\n## Step 2 — multimodal testing (require ≥2 independent concordant findings before predicting poor outcome)\n- [ ] **EEG** — **continuous EEG initiated within 24 h**; check for **highly malignant patterns**\n      (suppression, burst-suppression, status epilepticus on suppressed background) persisting off sedation;\n      **BIS ≤6 during temperature control** supports poor prognosis *(2025 adds BIS as an adjunct — verify\n      availability)*\n- [ ] **SSEP** — bilateral absence of **N20 cortical response at ≥48–72 h**: **>99% specificity** for poor\n      outcome; **N20 amplitude >4 µV** favors good outcome *(verify local timing convention)*\n- [ ] **Serum NSE** — serial measurements at **24/48/72 h**; **rising trend with value >60 µg/L at 48 h**\n      supports poor prognosis; **≤17 µg/L** suggests good outcome *(thresholds — verify, lab-dependent;\n      neurofilament light chain still **not recommended** — no validated threshold)*\n- [ ] **Neuroimaging** — **CT within 24 h** (reduced grey/white matter ratio, diffuse oedema); **MRI at\n      2–5 days** (extensive DWI/diffusion-restriction hyperintensities) → poor prognosis; repeat imaging if\n      initially unremarkable but still unconscious *(verify)*\n- [ ] **≥2 independent concordant pathological findings** required before communicating a \"poor outcome\n      likely\" determination — no single test used in isolation\n\n## Communication / disposition\n- [ ] **Multidisciplinary discussion** (intensivist, neurology, nursing) before family conversation\n- [ ] **Timeframe for further observation** explicitly stated if prognosis still uncertain at 72 h\n      (indeterminate is a valid interim conclusion — avoid premature withdrawal)\n- [ ] **Family goals-of-care conversation** documents which findings were used and their concordance;\n      **WLST decision-making kept separate from pure neuro-prognosis** — factor in age, comorbidity, overall\n      organ function, and patient preferences\n- [ ] **Organ donation discussion** per local policy if withdrawal is being considered\n\n## Commonly-missed on documentation (what the gap-check flags)\nConfounders (sedation/NMB/temp/metabolic) explicitly excluded before prognostication note? · ≥72h-post-ROSC\ntiming documented? · ≥2 independent concordant multimodal findings recorded (not a single test)? · EEG\nstarted within 24h and timing relative to sedation wean specified? · early myoclonus (<48h) not treated as\npoor-outcome-predictive without a concordant malignant EEG? · indeterminate prognosis at 72h prompts\nre-assessment plan rather than early closure? · WLST discussion documented as separate from the prognosis\nitself?\n\n*Sources: [ERC-ESICM Guidelines 2025: Post-Resuscitation Care — Resuscitation 215:110809](https://www.erc.edu/media/atqopqm4/gl2025-07-post-resus-e.pdf) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/41123621/) · [Neuroprognostication after cardiac arrest: Updated insights from the 2025 ERC-ESICM guidelines — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC13138817/) · [Prior edition — ERC-ESICM 2021 Post-Resuscitation Care](https://pubmed.ncbi.nlm.nih.gov/33773827/)*\n"}, {"file": "post-cardiac-arrest-ercesicm-2025.md", "title": "Post-cardiac-arrest care (post-ROSC ICU management)", "system": "Other", "body": "# Post-cardiac-arrest care (post-ROSC ICU management) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** European Resuscitation Council and European Society of Intensive Care Medicine (ERC-ESICM)\n> Guidelines 2025: Post-Resuscitation Care (Nolan JP, Sandroni C, et al.), *Resuscitation* 2025;215:110809\n> (co-published in *Intensive Care Medicine*) — supersedes the 2021 ERC-ESICM post-resuscitation guideline.\n> https://www.erc.edu/media/atqopqm4/gl2025-07-post-resus-e.pdf\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (check for a newer edition periodically)\n\n## Diagnosis of cause & immediate airway/breathing\n- [ ] **Prioritise immediate coronary angiography** if clear ST-elevation on ECG or high suspicion of\n  coronary occlusion (haemodynamic/electrical instability)\n- [ ] If angiography negative for a culprit lesion → **head-to-pelvis CT** (incl. CT pulmonary angiography)\n- [ ] If pre-arrest signs suggest a **non-coronary cause** (headache/seizure/neuro deficit, dyspnoea,\n  abdominal pain) → **whole-body CT** (head/neck/chest/abdo/pelvis + CTPA) before or after angiography\n- [ ] Secure airway if comatose/ventilated indication persists; confirm tube placement with\n  **waveform capnography**\n\n## Oxygenation & ventilation\n- [ ] **100% (or max available) FiO₂ immediately post-ROSC** until SpO₂/PaO₂ reliably measured\n- [ ] Then titrate to **SpO₂ 94–98%** or **PaO₂ 10–13 kPa (75–100 mmHg)** — *(verify)*; note pulse\n  oximetry can overestimate saturation in darker skin tones\n- [ ] **Avoid hypoxaemia** (PaO₂ < 8 kPa/60 mmHg) **and avoid hyperoxaemia**\n- [ ] Target **normocapnia — PaCO₂ 4.7–6.0 kPa (~35–45 mmHg)** — *(verify)*; extra caution/monitor\n  frequently in hypothermic patients (risk of hypocapnia) — use temperature-corrected or uncorrected\n  blood gas values **consistently**\n- [ ] **Lung-protective ventilation**: tidal volume **6–8 mL/kg ideal body weight** — *(verify)*\n\n## Haemodynamics & coronary/circulatory support\n- [ ] **Arterial line** for continuous BP in all patients; consider **cardiac output monitoring** if unstable\n- [ ] **Echocardiography ASAP** in all patients (underlying pathology, degree of myocardial dysfunction)\n- [ ] **Avoid hypotension** — target **MAP >60–65 mmHg** — *(verify — narrower/individualized targets\n  per BOX-trial-informed local protocol)*\n- [ ] Maintain perfusion with **fluids, noradrenaline and/or dobutamine** per volume/vasoconstriction/\n  inotropy need; **do not give steroids routinely**\n- [ ] **Avoid hypokalaemia and hyperkalaemia** (arrhythmia risk)\n- [ ] In OHCA **without ST-elevation**: **delay cath lab** unless clinical context suggests high likelihood\n  of acute coronary occlusion *(2025 change from 2021 — verify local pathway)*\n- [ ] Consider **mechanical circulatory support** (IABP/LVAD/VA-ECMO) in select refractory cardiogenic\n  shock or recurrent VT/VF despite optimal therapy (e.g. GCS ≤8, STEMI, arrest <10 min)\n- [ ] **Post-ROSC arrhythmias**: manage per peri-arrest arrhythmia algorithm; treat underlying cause\n  (coronary occlusion, electrolytes); **no routine anti-arrhythmic prophylaxis** if arrhythmia-free\n\n## Temperature control (fever avoidance — terminology change from \"TTM\")\n- [ ] **Actively prevent fever**: target temperature **≤37.5°C** in comatose patients — *(verify)*, for\n  **36–72 h post-ROSC** — *(verify duration per local protocol)*\n- [ ] Comatose patients who are **mildly hypothermic (32–36°C)** on arrival should **not be actively\n  warmed** to normothermia\n- [ ] **Against routine prehospital cooling** with rapid large-volume cold IV fluid\n- [ ] Use **surface or endovascular** temperature-control device with **feedback-based continuous\n  monitoring** if a device is used\n\n## Neurological — seizures, sedation, general ICU care\n- [ ] **EEG to diagnose/monitor electrographic seizures** in patients with clinical convulsions\n- [ ] First-line antiepileptics: **levetiracetam or sodium valproate** + sedative — *(verify dose)*;\n  **no seizure prophylaxis** if seizure-free\n- [ ] **Wake-up trial** (days post-arrest) if myoclonus with **benign EEG background**\n- [ ] **Short-acting sedatives + daily sedation holds** to enable earlier unconfounded neuro exam\n- [ ] **No routine neuromuscular blockade** (consider only if severe ARDS)\n- [ ] **30° head-up positioning**; **trophic/low-rate enteral feeding**, advance as tolerated\n- [ ] **Stress-ulcer prophylaxis** (high GI ulceration incidence, esp. with anticoagulant/antiplatelet use);\n  individualize anticoagulation per general ICU practice\n- [ ] **Standard glucose management protocol** — avoid extremes — *(target per local protocol — verify)*\n- [ ] **No routine prophylactic antibiotics**; low threshold if clinical suspicion of aspiration/pneumonia\n\n## Neuroprognostication (multimodal — do not shortcut)\n- [ ] **Do not prognosticate before ≥72 h post-ROSC** in unconscious patients (GCS-M <6), after excluding\n  confounders (sedation, NMB, hypothermia, severe hypotension, hypoglycaemia, sepsis, metabolic/\n  respiratory derangement)\n- [ ] **Multimodal** — no single test is sufficient; combine:\n  - [ ] **Clinical exam**: bilateral absent pupillary + corneal reflexes at ≥72 h; myoclonus within 96 h\n    (status myoclonus within 72 h) — use pupillometer where available\n  - [ ] **EEG** from day 1 (seizure detection + prognostic); **highly malignant patterns**\n    (suppressed background ± burst suppression) after 24 h → poor prognosis indicator\n  - [ ] **SSEP**: bilateral absence of N20 cortical potential at 24 h → poor prognosis (consider NMB\n    during recording to reduce artifact)\n  - [ ] **Biomarkers**: serial **NSE at 24/48/72 h** — rising trend + high absolute values\n    (**>60 µg/L at 48–72 h** — *(verify)*) → poor prognosis; **neurofilament light chain not recommended**\n    (no validated threshold)\n  - [ ] **Imaging**: brain CT (reduced grey/white matter ratio) or MRI (extensive diffusion restriction) →\n    poor prognosis; repeat CT at 72–96 h if initially unremarkable but still unconscious\n- [ ] **Poor outcome likely** if ≥2 of: absent pupil/corneal reflex, absent SSEP N20, highly malignant\n  EEG, NSE threshold exceeded, status myoclonus ≥72 h, diffuse anoxic injury on CT/MRI\n\n## Withdrawal of care, organ donation, family/follow-up\n- [ ] **Separate** WLST decision-making from pure neuro-prognosis — factor in age, comorbidity, overall\n  organ function, and patient preferences\n- [ ] Allocate adequate time for **team + family communication** around level-of-treatment decisions\n- [ ] After WLST decision, use a **structured curative-to-palliative transition**; consider **organ donation**\n- [ ] **Evaluate all patients progressing to death post-ROSC for organ donation** per local legal/ethical\n  requirements (including donation after circulatory death pathway)\n- [ ] **Early mobilisation, delirium management, ICU diaries**; functional assessment pre-discharge;\n  structured follow-up within **3 months** (cognitive/physical/emotional screening, co-survivors included)\n- [ ] Consider **cardiac rehabilitation** if cause was cardiac; investigate **unexplained arrest** (toxicology,\n  genetic testing, cardiac MRI, extended ECG monitoring) with long-term follow-up\n\n## Commonly-missed on documentation (what the gap-check flags)\nCause-of-arrest workup documented (angiography/CT pathway)? · SpO₂/PaCO₂ targets stated + avoiding\nhyper-/hypoxaemia and hyper-/hypocapnia? · MAP target explicit? · fever-avoidance target + duration\ndocumented? · sedation-hold plan for neuro exam? · seizure EEG + antiepileptic choice? · 72h rule\nrespected before any prognostic statement? · multimodal prognostication (≥2 modalities) not single-test? ·\nWLST discussion separated from prognosis and time allotted for family? · organ donation considered?\n\n*Sources: [ERC-ESICM Guidelines 2025: Post-Resuscitation Care — Resuscitation 215:110809](https://www.erc.edu/media/atqopqm4/gl2025-07-post-resus-e.pdf) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/41123621/) · [Prior edition — ERC-ESICM 2021 Post-Resuscitation Care (Resuscitation 161:220-269)](https://pubmed.ncbi.nlm.nih.gov/33773827/)*\n"}, {"file": "rhabdomyolysis-aast-2022.md", "title": "Rhabdomyolysis", "system": "Renal / Metabolic / Endo", "body": "# Rhabdomyolysis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Rhabdomyolysis: an American Association for the Surgery of Trauma Critical Care Committee\n> Clinical Consensus Document (Long B et al.), *Trauma Surg Acute Care Open* 2022;7:e000836. Supplemented\n> by general-review consensus on pigment nephropathy prevention — no single-body numeric-threshold\n> guideline exists; **confirm against local trauma/critical-care protocol.**\n> https://pubmed.ncbi.nlm.nih.gov/35136842/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022\n\n## Diagnosis & risk assessment\n- [ ] **CK diagnostic threshold**: generally **CK >1000 U/L or ≥5× ULN** *(verify — AKI risk rises further above ~5000 U/L)*\n- [ ] Cause identified (crush/trauma, exertional, toxic/drug, immobilization, seizure, compartment syndrome, metabolic myopathy)\n- [ ] Baseline renal function, K+, Ca²⁺, phosphate, urate, CK, myoglobin (if available) sent\n- [ ] **Compartment syndrome** actively excluded/monitored in crush or prolonged-immobilization mechanisms — clinical exam ± compartment pressures\n\n## Fluid resuscitation (primary intervention)\n- [ ] **Early, aggressive isotonic IV fluids** started as soon as diagnosis suspected — do not wait for peak CK\n- [ ] Example regimen: **~1–2 L/h for first 1–2 h**, then titrate to **~500 mL/h** *(verify against cardiac/renal reserve and local protocol — rates vary widely across sources)*\n- [ ] **Urine output target ~200–300 mL/h** while CK remains markedly elevated *(verify)*\n- [ ] Fluid choice — isotonic saline most studied; some protocols alternate saline with bicarbonate-containing dextrose solution *(verify local practice)*\n- [ ] Ongoing fluid therapy reassessed against urine output, weight, and signs of volume overload — avoid fixed-rate infusion without reassessment\n\n## Adjuncts (evidence limited — do not use routinely without indication)\n- [ ] **Sodium bicarbonate** — only to correct systemic acidosis, not routine urinary alkalinization *(verify indication/dose)*\n- [ ] **Mannitol** — only if urine output remains inadequate (e.g. **<300 mL/h**) despite adequate fluids; discontinue if diuresis not achieved or serum osmolal gap rises excessively *(verify threshold — evidence weak, avoid combining routinely with bicarbonate)*\n- [ ] No high-quality evidence supports routine mannitol+bicarbonate combination — reserve for select refractory cases per local protocol\n\n## Electrolyte & complication management\n- [ ] **Hyperkalemia** monitored closely and treated per hyperkalemia protocol — can be rapid and life-threatening in crush injury\n- [ ] **Hypocalcemia** — generally do NOT correct unless symptomatic/severe (risk of rebound hypercalcemia during recovery) *(verify)*\n- [ ] Hyperphosphatemia and hyperuricemia monitored\n- [ ] **AKI** tracked per AKI protocol; RRT indications as per AKI guideline (refractory hyperkalemia, acidosis, volume overload, uremia)\n- [ ] Cardiac monitoring while K+ abnormal or CK markedly elevated\n\n## Commonly-missed on documentation (what the gap-check flags)\nCK trend documented (not just one value)? · fluids started before peak CK confirmed? · urine output target explicitly tracked? ·\ncompartment syndrome considered in crush mechanism? · hypocalcemia left uncorrected unless symptomatic? · mannitol/bicarb use justified, not routine?\n\n*Sources: [Rhabdomyolysis: an American Association for the Surgery of Trauma Critical Care Committee Clinical Consensus Document — PubMed](https://pubmed.ncbi.nlm.nih.gov/35136842/) · [Rhabdomyolysis: Pathogenesis, Diagnosis, and Treatment — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC4365849/) · [Role of Bicarbonates and Mannitol in Rhabdomyolysis: A Comprehensive Review — PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7490772/)*\n"}, {"file": "sah-aha-asa-2023.md", "title": "Aneurysmal subarachnoid hemorrhage (SAH)", "system": "Neuro", "body": "# Aneurysmal subarachnoid hemorrhage (SAH) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2023 Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage,\n> American Heart Association/American Stroke Association, *Stroke* 2023.\n> https://www.ahajournals.org/doi/10.1161/STR.0000000000000436\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023 · see also Neurocritical Care Society\n> 2023 statement on seizure prophylaxis in aSAH (cited below)\n\n## Diagnosis & rebleeding prevention (first hours)\n- [ ] **Non-contrast head CT** → **CTA** (or catheter angiography) to identify aneurysm\n- [ ] **LP** if CT negative but high clinical suspicion *(verify local protocol/timing)*\n- [ ] **SBP <160 mmHg** *(verify)* maintained with titratable agent (nicardipine/labetalol/esmolol)\n      until aneurysm secured — avoid hypotension\n- [ ] **Aneurysm-treatment center transfer** if not already at a high-volume neurosurgical/neuroendovascular\n      center — outcomes are volume/expertise-dependent\n- [ ] **Aneurysm secured ASAP** — clipping or coiling, preferably **within 24 h** of presentation, to\n      reduce rebleeding *(verify timing per case)*\n- [ ] **Antifibrinolytic (short-course)** considered only if securing will be delayed >24–72h and no\n      contraindication *(verify — not routine once aneurysm secured)*\n- [ ] **Grade documented** (Hunt-Hess and/or WFNS) and **modified Fisher** for vasospasm-risk stratification\n\n## Hydrocephalus / ICP\n- [ ] **EVD placed** for acute symptomatic hydrocephalus\n- [ ] **ICP monitoring** if depressed consciousness/thick clot burden *(verify indication)*\n- [ ] **Neuro checks** at frequency per grade/course *(verify interval)*\n\n## Delayed cerebral ischemia (DCI) / vasospasm prevention & surveillance\n- [ ] **Oral nimodipine 60 mg q4h × 21 days** started on admission (dose-reduce for hypotension rather\n      than discontinue) *(verify dose/duration)*\n- [ ] **Euvolemia maintained** — avoid prophylactic hypervolemia and avoid hypovolemia/hypotension\n- [ ] **Daily clinical exams** for new focal deficit or decline; **daily TCD** surveillance *(verify frequency)*\n- [ ] **Threshold for vascular imaging/CT perfusion** defined if TCD/exam concerning for DCI\n- [ ] **Induced hypertension** (± other hemodynamic augmentation) considered first-line if DCI develops,\n      before endovascular rescue therapy *(verify)*\n\n## Medical management / complications\n- [ ] **Seizure prophylaxis NOT routine/continued** — short perioperative course only if used, per\n      NCS 2023 statement; no ongoing ASM without a clinical seizure *(verify local practice)*\n- [ ] **Hyponatremia monitoring** — daily sodium; distinguish SIADH vs cerebral salt wasting before\n      choosing fluid restriction vs. salt/volume repletion (fluid restriction risks worsening DCI — verify approach)\n- [ ] **Glucose management**, **temperature control** (avoid fever), **DVT prophylaxis** (mechanical\n      immediately; pharmacologic once aneurysm secured — verify timing)\n- [ ] **Cardiac monitoring** — troponin/ECG/echo screen for neurogenic stunned myocardium if indicated\n- [ ] **Rebleeding precautions** maintained until secured (stool softeners, pain/ag
