m BP\n      lowering to prevent recurrence; ensure this is distinguished in documentation from acute-phase BP\n      management above\n- [ ] **Rehab/PT/OT/speech** evaluation\n\n## Pearls & pitfalls\n- **Don't wait on labs to reverse.** Empiric anticoagulation reversal should start immediately on suspicion of anticoagulant-associated ICH — don't delay for INR/coag panel to result *(EMCrit IBCC — Spontaneous ICH)*\n- **The BP-lowering window is narrow, not just a floor.** SBP drops **>70 mmHg within the first hour** may themselves cause harm via penumbral hypoperfusion — smooth, gradual titration is the goal, not the fastest possible drop *(verify magnitude — EMCrit IBCC)*\n- **Treat pain/agitation before treating \"hypertension.\"** In intubated patients, elevated BP often reflects inadequate analgosedation rather than primary hypertension — address comfort first, then reach for the antihypertensive *(EMCrit IBCC)*\n- **EVD saves lives, not necessarily function.** Ventriculostomy for hydrocephalus reduces mortality but does not reliably improve functional outcome — sets expectations for the family conversation *(EMCrit IBCC)*\n- **Cerebellar ICH is a different surgical animal.** Ventriculostomy alone (without evacuation) is not recommended for cerebellar hemorrhage — risk of upward transtentorial herniation from unopposed supratentorial pressure; go to evacuation, not just drainage, when surgical criteria are met *(verify local threshold — EMCrit IBCC)*\n- **Supratentorial surgery has repeatedly failed to beat medical therapy in RCTs** (STICH/STICH-II) — reserve for refractory ICP or progressive deterioration despite maximal medical management, not as a reflexive early intervention *(EMCrit IBCC)*\n- **Don't let a reversible confounder deflate the prognosis.** Sedation-blunted exam or untreated hydrocephalus can artificially worsen GCS/ICH-Score inputs — correct reversible factors before using the score to frame goals-of-care discussions *(EMCrit IBCC)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nBP-lowering started within 1h + target documented (and which society's target/evidence grade was used)? ·\nanticoagulant identified/reversed with agent+dose? · hydrocephalus/EVD need assessed? ·\ncerebellar/posterior-fossa surgical criteria checked (diameter AND/OR volume threshold)? · seizure ppx NOT\ngiven without indication? · VTE mechanical ppx from admission? · organized stroke-unit care confirmed? ·\nsecondary-prevention BP plan distinct from acute-phase plan? · GoC conversation timing (not premature)?\n\n*Sources: [2022 AHA/ASA Guideline for Spontaneous ICH — Stroke](https://www.ahajournals.org/doi/10.1161/STR.0000000000000407) · [AHA/ASA Clinical Update slide deck — stroke.org](https://www.stroke.org/-/media/Files/Professional/Quality-Improvement/Hemorrhagic--Stroke/2022-Guideline-for-the-Management-of-Patients-With-Spontaneous-ICH-Clinical-Update-Slides.pdf) · [ESO/EANS 2025 Guideline on Stroke Due to Spontaneous Intracerebral Haemorrhage — European Stroke Journal](https://journals.sagepub.com/doi/full/10.1177/23969873251340815) · [ESO/EANS 2025 ICH guideline — PubMed](https://pubmed.ncbi.nlm.nih.gov/40401775/) · [2025 update to ESO guideline on BP management in acute ischaemic stroke and ICH — European Stroke Journal (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/) · [ESO Guideline Directory](https://eso-stroke.org/guidelines/eso-guideline-directory/) · [Spontaneous Intracerebral Hemorrhage (ICH) — EMCrit IBCC](https://emcrit.org/ibcc/ich/)*\n"}, {"file": "icu-delirium-sccm-padis-2025.md", "title": "ICU delirium — assessment, prevention & management checklist", "system": "Neuro", "body": "# ICU delirium — assessment, prevention & management checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** A Focused Update to the SCCM Clinical Practice Guidelines for the Prevention and\n> Management of Pain, Agitation/Sedation, Delirium, Immobility, and Sleep Disruption in Adult Patients\n> in the ICU (**PADIS 2025 Focused Update** — now covering **P**ain, **A**gitation/sedation, **D**elirium,\n> **I**mmobility, **S**leep disruption **+ Anxiety**), Society of Critical Care Medicine, 2025.\n> https://www.sccm.org/clinical-resources/guidelines/guidelines/focused-update-padis-guideline\n> **Builds on, does not discard**, the parent PADIS 2018 guideline (*Critical Care Medicine* 2018) —\n> the 2018 document remains the base framework; the 2025 focused update adds a **new anxiety domain**\n> and issues **5 new/revised statements** (dexmedetomidine, anxiety, delirium antipsychotics, immobility,\n> sleep) rather than re-litigating the whole guideline.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 focused update (base: PADIS 2018)\n\n## Why — physiology / first principles\n- Delirium = acute diffuse cerebral dysfunction from neurotransmitter imbalance (relative dopaminergic excess / cholinergic deficiency), neuroinflammation, and disrupted circadian/sleep-wake signaling.\n- It arises from the interaction of **predisposing vulnerability** (age, baseline cognitive impairment) with **precipitating insults** — GABAergic sedatives (especially benzodiazepines), infection/systemic inflammation, hypoxia, metabolic derangement, immobility, pain, and sleep deprivation.\n- Because sedative drugs and disrupted sleep/circadian cues are modifiable precipitants, prevention beats pharmacologic treatment after the fact.\n- Rationale for the ABCDEF bundle: minimize deep sedation/benzodiazepines (remove the GABAergic driver), pair spontaneous awakening/breathing trials, mobilize early, protect sleep, and engage family (restore normal orienting and circadian cues) — this addresses the precipitants rather than masking the resulting confusion.\n\n## Diagnosis / definition\n- [ ] **Delirium (DSM-5 framing, as used by PADIS)** — an acute, fluctuating disturbance of attention and\n      awareness plus an additional disturbance in cognition, not better explained by a pre-existing or\n      evolving neurocognitive disorder, and not scorable in the context of severely reduced arousal (e.g.\n      coma) *(verify exact wording against current tool documentation)*\n- [ ] **CAM-ICU** — 4 features: (1) acute onset or fluctuating course, (2) inattention, (3) altered level\n      of consciousness (any RASS ≠ 0), (4) disorganized thinking. **Positive = features 1 + 2, plus either\n      3 or 4** *(verify against the current CAM-ICU worksheet/algorithm)*\n- [ ] **ICDSC** — alternative 8-item checklist; **score 0–8, ≥4 = delirium** *(verify cutoff and local\n      preference vs CAM-ICU)*\n- [ ] **RASS documented before delirium screening** — scale runs **-5 (unarousable) to +4 (combative)**;\n      delirium **cannot be reliably assessed at RASS ≤ -4** (patient not arousable enough to test attention)\n      *(verify threshold — this is why sedation depth is always checked first, below)*\n- [ ] **Subsyndromal delirium** — some but not all CAM-ICU-positive criteria present; still associated\n      with worse outcomes and should be flagged, not just full CAM-ICU-positive delirium *(verify definition)*\n\n## Key labs & workup\n- [ ] **Delirium is a clinical diagnosis — no lab test confirms or excludes it.** Workup targets\n      reversible drivers, not the diagnosis itself\n- [ ] **Metabolic panel** — sodium, glucose, calcium, renal and hepatic function\n- [ ] **Infectious workup if new-onset delirium** — CBC, blood cultures, CXR, urinalysis as clinically indicated\n- [ ] **Toxicology / drug-level screen** if withdrawal (alcohol, benzodiazepine, opioid) or toxicity is suspected\n- [ ] **ABG / SpO2** — exclude hypoxia or hypercapnia as a driver\n- [ ] **Medication reconciliation** — review for deliriogenic agents (benzodiazepines, anticholinergics, corticosteroids)\n\n## Management\n\n### Assessment\n- [ ] **Validated delirium screening tool used** (CAM-ICU or ICDSC — see Diagnosis/definition above) at\n      regular intervals *(frequency — verify local protocol, typically each shift)*\n- [ ] **Sedation depth (RASS) checked first**, every time — delirium not scored if too deeply sedated (see above)\n- [ ] **Pain assessed** with a validated tool (e.g. CPOT, BPS) — untreated pain is a delirium driver\n- [ ] **Anxiety assessed** — new 2025 domain; use a validated approach where available *(no single\n  preferred tool specified by the update — verify local protocol)*\n- [ ] **Subsyndromal delirium** also flagged, not just full CAM-ICU-positive delirium\n\n### Prevention — multicomponent, non-pharmacologic (ABCDEF-bundle framing)\n- [ ] **Reorientation** — clocks, calendars, family involvement, explain plan of care\n- [ ] **Cognitive stimulation**\n- [ ] **Early mobilization/rehabilitation** — performed unless contraindicated; **2025 update suggests\n  *enhanced* mobilization/rehabilitation over usual-care mobilization** (moderate certainty, conditional\n  recommendation) to mitigate ICU-acquired weakness — *verify what \"enhanced\" means locally (intensity/frequency)*\n- [ ] **Sleep optimization** — reduce night-time noise/light, cluster cares, minimize unnecessary awakenings\n      *(bright light therapy specifically NOT supported by evidence — do not rely on it)*\n- [ ] **Melatonin** — **2025 update suggests melatonin over no melatonin** for sleep (low certainty,\n  conditional recommendation) *(dose/timing — verify local protocol)*\n- [ ] **Hearing/vision aids** provided if used at baseline\n- [ ] **Minimize modifiable risk factors** — benzodiazepines, unnecessary blood transfusion\n- [ ] **Daily sedation interruption / spontaneous awakening trial** paired with spontaneous breathing trial\n- [ ] **Family presence/engagement** encouraged\n\n### Sedation choice — updated 2025 recommendation\n- [ ] **Dexmedetomidine suggested over propofol** for sedation in mechanically ventilated adults, where\n  **light sedation and delirium reduction are priorities** (moderate certainty, conditional\n  recommendation) — *this is a sedation-strategy recommendation, distinct from delirium-prevention\n  claims below; verify against hemodynamic tolerance and local protocol*\n\n### Pharmacologic — what NOT to do / where evidence remains insufficient\n- [ ] **Do NOT use dexmedetomidine, statins, or ketamine specifically to *prevent* delirium** — not\n  supported as a prevention strategy (distinct from the sedation-choice recommendation above)\n- [ ] **Do NOT use haloperidol or atypical antipsychotics to *prevent* delirium** (not supported)\n- [ ] **Antipsychotics for treating established delirium** — 2025 update is **unable to recommend for\n  or against** antipsychotics vs usual care (low certainty) — treat as an unresolved question, not a\n  green light for routine use\n- [ ] **Do NOT treat subsyndromal delirium with haloperidol/atypical antipsychotics**\n- [ ] **Benzodiazepines for anxiety** — 2025 update is **unable to recommend for or against** (insufficient\n  evidence) — do not treat this as tacit endorsement\n- [ ] **Benzodiazepines avoided** as primary sedative where feasible (delirium risk factor)\n\n### Pharmacologic — management once delirium present\n- [ ] **Treat the underlying driver first** — pain, hypoxia, metabolic derangement, infection, withdrawal, polypharmacy review\n- [ ] **Antipsychotics reserved**, not routine, for delirium itself — use only if severe agitation/distress\n      threatens safety, and only briefly *(agent/dose — verify; 2025 update explicitly does not endorse\n      routine use, consistent with 2018)*\n- [ ] **Dexmedetomidine considered** specifically when agitation is impeding extubation/ventilator weaning,\n      and now also supported as a first-choice sedative over propofol when light sedation/delirium\n      reduction is the goal *(verify local protocol)*\n- [ ] **Avoid physical restraints** where possible — use as last resort, reassess frequently\n\n### Monitoring / follow-through\n- [ ] **Daily reassessment** of ongoing need for any sedative/antipsychotic started\n- [ ] **Document delirium duration** — persistent delirium prompts broadened workup\n- [ ] **Anxiety course documented** alongside delirium/sedation course (new domain)\n- [ ] **Discharge/handover note** flags delirium (and anxiety) course for post-ICU follow-up (cognitive impairment risk)\n\n## Pearls & pitfalls *(FOAMed — tips/pitfalls, not directives; verify before acting)*\n- [ ] **Don't mistake akathisia for worsening agitation.** Antipsychotic-induced akathisia can look like\n      escalating agitation and prompt further antipsychotic dosing, which makes it worse rather than\n      better — distinguish before pushing the dose up *(EMCrit IBCC — Delirium chapter, Farkas)*\n- [ ] **Haloperidol has a practical ceiling.** If there's no response by roughly **10 mg cumulative dose**\n      *(verify)*, the agitation likely isn't primarily dopamine-mediated — switch agents rather than\n      continuing to escalate *(EMCrit IBCC — Delirium chapter)*\n- [ ] **Olanzapine is a QTc-friendly option** for agitation when QT prolongation is a concern, and can\n      bridge from IV to oral dosing; commonly capped around **30 mg/24h** *(verify dose/availability)*\n      *(EMCrit IBCC — Delirium chapter)*\n- [ ] **Quetiapine's sedating effect plateaus** — pushing doses above roughly **100 mg BID** *(verify)*\n      doesn't buy more sedation, and high-dose quetiapine's alpha-2 antagonism can blunt a concurrent\n      dexmedetomidine infusion *(EMCrit IBCC — Delirium chapter)*\n- [ ] **Antipsychotics don't treat hypoactive delirium** — reserve them for dangerous agitation, not for\n      delirium itself, consistent with PADIS not endorsing routine antipsychotic use above\n      *(EMCrit IBCC — Delirium chapter)*\n- [ ] **Keep antipsychotic courses short and don't let them follow the patient home** — get a psychiatric\n      history to guide agent choice, resume home psychiatric regimens where appropriate, and actively\n      stop any antipsychotic started acutely for delirium before discharge if not otherwise indicated\n      *(EMCrit IBCC — Delirium chapter)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nValidated screening tool + sedation level charted (not skipped when deeply sedated)? · anxiety assessed\nas its own domain? · pain scored with validated tool? · SAT/SBT paired trial documented? · mobilization\nattempted, and \"enhanced\" mobilization considered where feasible? · melatonin considered for sleep? ·\ndexmedetomidine-vs-propofol sedation choice documented with rationale? · antipsychotic (if any) justified\nby safety indication, not delirium-prevention or reflexive treatment, and time-limited? · reversible\ndriver workup documented before/alongside pharmacologic treatment?\n\n*Sources: [A Focused Update to SCCM PADIS Guidelines — SCCM](https://www.sccm.org/clinical-resources/guidelines/guidelines/focused-update-padis-guideline) · [PADIS 2018 Guidelines — SCCM](https://www.sccm.org/clinical-resources/guidelines/guidelines/guidelines-for-the-prevention-and-management-of-pa) · [EMCrit IBCC — Delirium chapter (Farkas)](https://emcrit.org/ibcc/delirium/)*\n"}, {"file": "ischemic-stroke-aha-asa-2026.md", "title": "Acute ischemic stroke", "system": "Neuro", "body": "# Acute ischemic stroke — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2026 Guideline for the Early Management of Patients With Acute Ischemic Stroke, American\n> Heart Association/American Stroke Association, *Stroke* 2026 — supersedes the prior 2019 update to the\n> 2018 guideline (`ischemic-stroke-aha-asa-2019.md`, superseded/removed).\n> https://www.ahajournals.org/doi/10.1161/STR.0000000000000513\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026\n\n## Why — physiology / first principles\n- Arterial occlusion produces an infarct **core** (tissue below the threshold for viability — dies within minutes) surrounded by a **penumbra** (hypoperfused but structurally intact tissue kept alive only by collateral flow).\n- The penumbra converts to core progressively over hours — \"time is brain\" — so outcome depends on how fast flow is restored, not merely whether it is restored.\n- Rationale for thrombolysis/thrombectomy: salvage the penumbra before it becomes irreversibly infarcted.\n- Rationale for permissive hypertension pre-reperfusion: autoregulation is disrupted in ischemic tissue, so collateral perfusion of the penumbra becomes passively pressure-dependent — dropping BP can starve salvageable tissue.\n- Rationale for BP control after reperfusion: newly reperfused, injured microvasculature is fragile — high pressure now risks hemorrhagic transformation instead.\n\n## Diagnosis / definition\n- [ ] **NIHSS (National Institutes of Health Stroke Scale)** documented — 0–42 point exam scored across\n      consciousness, gaze, visual fields, motor/sensory, language, neglect; drives thrombolysis eligibility\n      framing (\"disabling\" deficit) and thrombectomy triage (e.g. basilar-occlusion pathway below) *(verify\n      scoring against current NIHSS reference card)*\n- [ ] **Last-known-well (LKW) time** established as the definitional anchor for every time-window decision\n      below (4.5 h lytic window, 6 h/extended-window thrombectomy) — distinct from \"time found\" or\n      \"time symptoms noticed\" *(verify how wake-up/unwitnessed onset is documented locally)*\n- [ ] **ASPECTS (Alberta Stroke Program Early CT Score)** on NCCT — 0–10, 1 point deducted per affected MCA\n      territory region (10 = normal); used for early-ischemic-change quantification feeding into large-core\n      thrombectomy eligibility *(verify current core-volume/ASPECTS cutoffs — 2026 update expands eligibility)*\n- [ ] **LVO (large-vessel occlusion) defined** — ICA terminus, M1 (± proximal M2), basilar artery; confirms\n      which vessels qualify for thrombectomy triage *(verify which distal/medium-vessel occlusions your\n      center now treats)*\n- [ ] **Clinical stroke syndrome noted** — anterior-circulation signs (unilateral weakness, aphasia, neglect,\n      gaze deviation) vs posterior/basilar signs (vertigo, diplopia, dysarthria, crossed deficits, depressed\n      consciousness) — basilar occlusion especially easy to under-recognize *(verify against exam findings, not pattern alone)*\n\n## Key labs & workup\n- [ ] **Non-contrast head CT** — first test, always; rules out hemorrhage before any thrombolysis decision\n- [ ] **CTA head/neck** — LVO screening, informs thrombectomy pathway\n- [ ] **CT perfusion or MRI DWI-FLAIR mismatch** — core/penumbra or mismatch imaging for extended-window\n      (4.5–9 h / wake-up) and large-core selection *(verify local imaging protocol/availability)*\n- [ ] **Fingerstick glucose** — mandatory; hypoglycemia is a stroke mimic and must be corrected first\n- [ ] **Coagulation panel (INR/PTT)** and **platelet count** — INR **<1.7 (verify)** required before\n      thrombolysis in patients on warfarin; do not delay lytic pending labs in patients with no history\n      suggesting coagulopathy *(verify local point-of-care turnaround practice)*\n- [ ] **ECG + troponin** — screen for atrial fibrillation and concurrent cardiac cause\n- [ ] **Basic metabolic panel** — renal function (contrast planning), electrolytes\n\n## Management\n\n### Hyperacute — first hour\n- [ ] **Time last-known-well** established; **NIHSS** documented\n- [ ] **Non-contrast head CT** (± CTA/CT perfusion for LVO screen) completed emergently\n- [ ] **Glucose checked**; correct if abnormal *(hypoglycemia is a stroke mimic)*\n- [ ] **BP <185/110 mmHg** before IV thrombolysis *(verify)* — treat with IV antihypertensive if above threshold, do not delay thrombolysis unnecessarily\n- [ ] **IV thrombolysis given if eligible** — **either tenecteplase (0.25 mg/kg, single bolus) or alteplase\n  (0.9 mg/kg, bolus + infusion)** within **≤4.5 h** — 2026 update gives **both agents a Class 1\n  recommendation** for this window *(verify current agent/dose choice at your site — tenecteplase's\n  single-bolus dosing is operationally attractive, esp. for transfers)*\n- [ ] **Rapid thrombolysis for disabling deficits** — treat within the 4.5 h window regardless of NIHSS\n  score, without requiring advanced imaging selection *(verify \"disabling\" definition/local practice)*\n- [ ] **Extended-window thrombolysis** considered for **4.5–9 h** from onset, or **wake-up/unknown-onset**\n  stroke, using advanced imaging (DWI-FLAIR mismatch or perfusion mismatch) selection *(verify imaging\n  criteria/availability)*\n- [ ] **Thrombolysis given before thrombectomy** in patients eligible for both — do not withhold or delay\n  one to pursue the other\n\n### Endovascular therapy screen\n- [ ] **LVO confirmed on CTA** (anterior circulation) → **mechanical thrombectomy** if **≤6 h** from\n  last-known-well\n- [ ] **Extended window (6–24 h)** thrombectomy considered if perfusion/clinical-core mismatch criteria\n  met (DAWN/DEFUSE-3-type criteria) *(verify current criteria)*\n- [ ] **Large-core infarcts** — thrombectomy eligibility now **expanded** per 2026 update reflecting recent\n  large-core trials; do not exclude on core size alone *(verify current core-volume thresholds)*\n- [ ] **Basilar artery occlusion** → thrombectomy within **24 h** carries a **strong (Class 1-tier)**\n  recommendation when **NIHSS ≥10** *(verify exact criteria — new in 2026)*\n- [ ] **Transport decision**: direct-to-nearest-EVT-capable-center vs. drip-and-ship per **local system of\n  care** characteristics (transfer-process speed) *(verify local pathway)* — **mobile stroke units**\n  endorsed where available\n\n### Post-reperfusion / in-hospital\n- [ ] **BP <180/105 mmHg** maintained for **≥24 h** after IV thrombolysis *(verify)*\n- [ ] **No antiplatelet/anticoagulant** for 24 h post-thrombolysis until repeat imaging excludes hemorrhage\n- [ ] **Repeat head CT/MRI** if neuro decline or before starting antithrombotics\n- [ ] **Dysphagia screen before any oral intake**\n- [ ] **Continuous cardiac monitoring** (≥24 h) for AF detection\n- [ ] **Permissive hypertension** in non-thrombolysed patients unless BP extreme or comorbid indication for lowering *(verify threshold)*\n- [ ] **Temperature control** — treat fever, source-search if present\n- [ ] **Glucose target** per protocol — avoid hypo/hyperglycemia *(verify)*\n- [ ] **VTE prophylaxis** — mechanical ± pharmacologic per timing rules post-thrombolysis\n- [ ] **Early mobilization** unless contraindicated\n\n### Secondary prevention (initiated in-hospital)\n- [ ] **Antiplatelet** initiated (typically 24 h post-thrombolysis) — dual antiplatelet short-course considered for minor stroke/high-risk TIA *(verify regimen)*\n- [ ] **Statin** (high-intensity) initiated\n- [ ] **Etiologic workup** — echocardiogram, carotid imaging, telemetry/Holter for AF\n- [ ] **Anticoagulation** if cardioembolic source confirmed — timing individualized to infarct size/hemorrhagic transformation risk\n- [ ] **Swallowing/PT/OT/speech evaluation**; rehab planning\n- [ ] **Goals of care / disposition planning**\n\n## Pearls & pitfalls\n*(FOAMed — pearls/pitfalls only, not a substitute for society guidance above; numbers `(verify)`)*\n- **Orolingual angioedema** after alteplase/tenecteplase occurs in ~2% *(verify)*, typically **30–120 min**\n  post-lytic (vs <30 min for classic anaphylaxis) — asymmetric, often contralateral to the stroke side;\n  risk factors include ACE-inhibitor use and insular involvement — stop the infusion, hold ACE-I, consider\n  icatibant/C1-esterase concentrate; steroids/epinephrine are typically ineffective — IBCC/EMCrit\n  (emcrit.org/ibcc/ais/)\n- **Post-thrombectomy BP**: avoid over-aggressive lowering — SBP <140 mmHg has been associated with worse\n  outcomes after successful recanalization; a reasonable post-EVT range cited is **SBP 140–180 mmHg**\n  *(verify against current local protocol)* — IBCC/EMCrit (emcrit.org/ibcc/ais/)\n- **Pre-thrombectomy hypotension is dangerous** — even brief BP drops (>10% cited) correlate with worse\n  outcomes; avoid over-treating pressure while awaiting the procedure — IBCC/EMCrit (emcrit.org/ibcc/ais/)\n- **\"Neuroworsening\" after thrombolysis has a differential** — don't reflexively assume hemorrhagic\n  transformation: recheck glucose (hypoglycemia mimics), consider seizure (including nonconvulsive),\n  infarct extension/reocclusion, cerebral edema, and sedating-medication effect before concluding bleed —\n  IBCC/EMCrit (emcrit.org/ibcc/ais/)\n- **Dense MCA sign** on NCCT (hyperdense vessel, sensitivity ~33%, specificity ~95% *(verify)*) can support\n  LVO suspicion but can be mimicked by atherosclerotic calcification, prior contrast, or polycythemia —\n  compare with the contralateral vessel before over-interpreting — IBCC/EMCrit (emcrit.org/ibcc/ais/)\n- **Hyperglycemia correlates with worse outcomes, but tight control can harm** — the SHINE trial found\n  intensive glucose control (target ~80–130 mg/dL) increased hypoglycemia without improving outcomes;\n  favor a moderate glucose target rather than tight control post-stroke *(verify local target)* —\n  IBCC/EMCrit (emcrit.org/ibcc/ais/)\n- **Contrast-nephropathy concern should not delay CTA/CTP** — withholding vascular/perfusion imaging over\n  theoretical contrast-induced nephropathy risk is not evidence-supported and costs time-sensitive triage\n  information — IBCC/EMCrit (emcrit.org/ibcc/ais/)\n- **The thrombolysis evidence base is genuinely contested** — be aware the mortality/functional-outcome\n  benefit of IV lytics has real critics (allocation/observer bias concerns raised about NINDS, ECASS-3,\n  IST-3); this doesn't change the guideline recommendation above but explains why some clinicians hedge\n  language with patients/family — First10EM (first10em.com/thrombolytics-for-stoke/), LITFL\n  (litfl.com/stroke-thrombolysis/)\n\n## Commonly-missed on documentation (what the gap-check flags)\nLast-known-well time documented? · NIHSS recorded? · BP threshold met/documented before lytic? ·\nthrombolytic agent + dose stated (tenecteplase vs alteplase)? · door-to-needle time? · thrombectomy\neligibility screened (LVO on CTA; large-core and basilar-occlusion pathways not overlooked)? · 24h\npost-lytic BP + no-antithrombotic window honored? · dysphagia screen before oral intake? · statin +\nantiplatelet started? · AF monitoring ordered?\n\n*Sources: [2026 AHA/ASA Guideline for the Early Management of Acute Ischemic Stroke — Stroke](https://www.ahajournals.org/doi/10.1161/STR.0000000000000513) · [2026 Guideline — Top Things to Know (AHA Professional Heart Daily)](https://professional.heart.org/en/science-news/2026-guideline-for-the-early-management-of-patients-with-acute-ischemic-stroke/top-things-to-know) · [New guideline expands stroke treatment for adults — AHA Newsroom](https://newsroom.heart.org/news/new-guideline-expands-stroke-treatment-for-adults-offers-first-pediatric-stroke-guidance) · FOAMed pearls: [IBCC — Acute Ischemic Stroke (EMCrit)](https://emcrit.org/ibcc/ais/) · [LITFL — Stroke Thrombolysis](https://litfl.com/stroke-thrombolysis/) · [First10EM — Thrombolytics for stroke: the evidence](https://first10em.com/thrombolytics-for-stoke/)*\n"}, {"file": "lower-gi-bleed-acg-2023.md", "title": "Lower GI bleed", "system": "GI / Hepatic", "body": "# Lower GI bleed — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Management of Patients With Acute Lower Gastrointestinal Bleeding: An Updated ACG\n> Guideline (Sengupta N et al., American College of Gastroenterology), *Am J Gastroenterol* 2023 —\n> https://pubmed.ncbi.nlm.nih.gov/36735555/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Why — physiology / first principles\n- Bleeding distal to the ligament of Treitz, most often from a **diverticular vessel** (a penetrating vasa\n  recta stretched thin over a diverticulum, covered by only mucosa/submucosa) or **angiodysplasia** (fragile\n  submucosal vascular ectasias, often right colon).\n- Diverticular bleeding is typically abrupt and painless because the source is arterial, not inflammatory.\n- Hemodynamic instability reflects the rate/volume of blood loss, not the underlying lesion — the reason\n  resuscitation and localization strategy (CT angiography for brisk bleeding, colonoscopy for slower or\n  intermittent bleeding) are triaged by hemodynamic status rather than lesion type.\n\n## Diagnosis / definition\n- [ ] Risk-stratify with a validated tool (e.g. Oakland score) to separate high- vs. low-risk patients — a sufficiently low score may support outpatient management *(tool/cutoff — verify local practice)*\n- [ ] Clinical clues favoring an **upper GI source** despite hematochezia: hemodynamic instability, melena on exam, elevated BUN:Cr ratio, history of peptic ulcer disease or decompensated liver disease *(individual likelihood ratios/cutoffs — verify)*\n- [ ] Clots per rectum are a strong bedside clue favoring a **lower** GI source *(verify)*\n\n## Key labs & workup\n- [ ] Hgb/Hct trend, coagulation panel, type & crossmatch\n- [ ] BUN:Cr ratio as an adjunct clue to distinguish upper vs. lower source (an elevated ratio favors an upper source) *(cutoff — verify)*\n- [ ] NG aspirate/lavage — a negative aspirate does not fully exclude an upper source; use as one input alongside hemodynamics, not a gatekeeper that delays definitive imaging *(role — verify local pathway)*\n- [ ] **Colonoscopy** as the initial diagnostic procedure for most patients, within **24 h** of presentation after adequate bowel preparation\n- [ ] **CT angiography** for high-risk ongoing hemorrhage or instability precluding prep/colonoscopy — used to localize source before intervention *(institutional pathway — verify)*\n- [ ] Radionuclide/tagged RBC scan role limited relative to CTA where CTA is available *(verify)*\n\n## Management\n### Initial assessment & risk stratification\n- [ ] Hemodynamic assessment + volume resuscitation started as needed\n- [ ] RBC transfusion threshold **7 g/dL** (consider **8 g/dL** if unstable cardiovascular disease) *(verify)*\n- [ ] Hematochezia with **hemodynamic instability** → consider an **upper GI source**; perform upper endoscopy first if suspected\n- [ ] Anticoagulant/antiplatelet management individualized; reversal agents selected per severity *(agent — verify)*\n\n### Therapeutic management\n- [ ] Endoscopic hemostasis for stigmata of recent hemorrhage (diverticular bleed, post-polypectomy, etc.) using thermal/mechanical/injection modality as appropriate\n- [ ] Interventional radiology (angioembolization) for an actively bleeding source identified on CTA\n- [ ] Surgery reserved and individualized — the source must be **carefully localized** before any resection\n- [ ] Antithrombotic resumption planned post-hemostasis, individualized risk-benefit — avoid indefinite blanket withholding *(timing — verify)*\n\n## Pearls & pitfalls\n- [ ] Shock index (HR/SBP) **>0.9** is a more sensitive early marker of significant blood loss than isolated vital signs; **<0.9** is reassuring *(cutoff — verify)* — EMCrit IBCC: \"GI Bleeding\"\n- [ ] A full/non-collapsing IVC in a patient with apparent shock argues against hemorrhagic shock as the primary problem — reconsider the diagnosis *(verify)* — EMCrit IBCC: \"GI Bleeding\"\n- [ ] In an unstable patient with a negative or unhelpful NG aspirate, consider going straight to CT angiography rather than waiting on GI consult or a tagged RBC scan — tagged RBC scans are viewed as non-specific and don't directly guide interventional radiology *(local pathway — verify)* — EMCrit IBCC: \"GI Bleeding\"\n- [ ] When IR is available, embolization is favored as first-line definitive therapy for a localized, actively bleeding lower GI source — reported success rates as high as ~98% in some series, and colonoscopy is often unhelpful in a briskly bleeding, unprepped colon *(local capability/numbers — verify)* — EMCrit IBCC: \"GI Bleeding\"\n- [ ] Aggressive transfusion aiming for a normal hemoglobin is a pitfall outside variceal bleeding too — target the restrictive threshold rather than chasing a number *(verify)* — EMCrit IBCC: \"GI Bleeding\"\n\n## Commonly-missed on documentation (what the gap-check flags)\nUpper-GI source excluded when instability + hematochezia present? · time-to-colonoscopy documented? ·\nCTA considered when hemodynamically unstable or prep not feasible? · bleeding source localized before\nany surgical referral? · antithrombotic resumption plan documented at discharge?\n\n*Sources: [Management of Acute Lower GI Bleeding: An Updated ACG Guideline — Sengupta et al. 2023](https://pubmed.ncbi.nlm.nih.gov/36735555/) · FOAMed pearls: [EMCrit IBCC — GI Bleeding](https://emcrit.org/ibcc/gib/)*\n"}, {"file": "massive-hemoptysis-scii-2023.md", "title": "Massive (life-threatening) hemoptysis", "system": "Respiratory", "body": "# Massive (life-threatening) hemoptysis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Society of Chest Imaging and Interventions (SCII) Consensus Guidelines for the\n> Interventional Radiology Management of Hemoptysis, 2023.\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC10289864/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Why — physiology / first principles\n- Most massive hemoptysis arises from the **bronchial circulation** (systemic, high-pressure) supplying\n  inflamed/neovascularized airways (bronchiectasis, cancer, chronic infection, prior TB), not the low-pressure\n  pulmonary circulation — a high-pressure bleed into a low-volume airway system.\n- Death is from **asphyxiation** (blood flooding and obstructing airways/impairing gas exchange), not\n  exsanguination — the physiologic basis for prioritizing airway protection/positioning (bleeding lung\n  dependent) and airway isolation over hemodynamic resuscitation alone.\n- **Bronchial artery embolization** targets the systemic (not pulmonary) circulation because that is almost\n  always the bleeding source.\n\n## Diagnosis / definition\n- [ ] **Massive / life-threatening hemoptysis** — definitions vary; older **volume-based** thresholds\n  cite **>100–600 mL blood expectorated over 24 h** *(verify — wide range reflects lack of consensus)*,\n  while the modern preferred framing is **physiologic**: hemodynamic instability, **airway compromise**,\n  or significant **gas-exchange abnormality**, regardless of measured/estimated volume *(verify current\n  SCII wording)*\n- [ ] Recognize that **hypoxemia from airway flooding, not exsanguination, is the usual proximate cause\n  of death** — this should drive the urgency of airway-protection maneuvers over volume resuscitation\n  alone *(verify)*\n\n## Key labs & workup\n- [ ] **CBC** (baseline Hgb, platelets), **coagulation panel** (INR/PTT, fibrinogen), **type &\n  crossmatch** *(verify local massive-hemoptysis order set)*\n- [ ] **Renal function** checked before iodinated CT contrast *(verify)*\n- [ ] **CT angiography** once stabilized — extended field (neck to renal arteries), biphasic/\n  split-bolus contrast, thin slices (**≤1.5 mm**) *(verify protocol)*\n- [ ] Identify bleeding source territory: **bronchial artery** (~90% of cases) vs nonbronchial systemic\n  vs pulmonary artery *(verify)*\n\n## Management\n\n### Immediate stabilization — airway first\n- [ ] **Lateralize and protect the non-bleeding lung** — position bleeding side dependent once source\n  side known *(verify)*\n- [ ] For ongoing bleeding: **selective bronchial intubation**, **bronchial blocker/balloon\n  tamponade**, or **double-lumen endotracheal tube** to isolate the airway *(verify indication/technique)*\n- [ ] **Correct coagulopathy**: hold anticoagulants/antiplatelets, transfuse PRBC/FFP/platelets as\n  indicated\n- [ ] Consider **IV tranexamic acid** *(dose — verify)*\n\n### Bronchoscopy\n- [ ] **Flexible bronchoscopy** at bedside for unstable patients — lateralize bleeding, clear clot,\n  local tamponade/medication instillation\n- [ ] **Rigid bronchoscopy** if available/needed — better airway control and clot evacuation; requires\n  OR/general anesthesia\n- [ ] Best diagnostic yield **during active bleeding or within 24–48 h** of cessation *(verify timing)*\n\n### Definitive hemostasis\n- [ ] **Bronchial artery embolization (BAE)** — first-line definitive therapy after initial\n  stabilization *(verify institutional pathway/access to IR)*\n- [ ] **Surgery** reserved for localized disease in good surgical candidates, or BAE/bronchoscopy\n  failure — emergent surgery during active bleeding carries substantially higher mortality than elective\n  surgery *(verify mortality data currency)*\n\n### Post-stabilization\n- [ ] Address the **underlying etiology** (TB, bronchiectasis, malignancy, aspergilloma, etc.)\n- [ ] Follow-up schedule after BAE arranged *(verify — commonly 1 week, then 1/3/6/12 months)*\n- [ ] Monitor for recurrence; recurrence risk factors reviewed (cavitation, necrosis, aspergilloma,\n  cavitary/MDR-TB, malignancy) *(verify)*\n\n## Pearls & pitfalls\n- Reflexively intubating a briskly bleeding patient can backfire — a strong natural cough often clears\n  blood better than suction, so reserve intubation for ineffective cough, worsening hypoxemia, or a\n  logistical need to secure the airway for a procedure (IBCC/EMCrit — Hemoptysis chapter) *(verify against\n  local practice — this is a judgment call, not a blanket rule)*\n- If intubation is needed, use a **large-bore single-lumen tube** (≥8.5 mm) rather than a double-lumen\n  tube — double-lumen tubes malposition easily and impair both bronchoscopy and blood clearance (IBCC/\n  EMCrit) *(verify size against local airway equipment)*\n- CT is favored as the **first diagnostic step over bronchoscopy** when feasible — cited diagnostic yield\n  is higher for CT (~75%) vs bronchoscopy (~50%), and clot accumulation over time can obscure bronchoscopic\n  findings, so don't let \"let's just scope it\" delay imaging (IBCC/EMCrit) *(verify — figures cited are\n  approximate)*\n- Nebulized **tranexamic acid** (e.g. 1000 mg initial, then 500 mg q8h) is described as a supportive\n  adjunct while awaiting definitive embolization/bronchoscopy, not a substitute for it (IBCC/EMCrit)\n  *(verify dose/route against local formulary — differs from the IV dosing referenced in Management above)*\n- Don't stop at correcting INR/platelets alone — hypofibrinogenemia is an easy-to-miss contributor;\n  some sources suggest targeting fibrinogen **>150 mg/dL** and platelets **>50,000/µL** in active bleeding\n  (IBCC/EMCrit) *(verify targets against local massive-transfusion/coagulopathy protocol)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nNon-bleeding lung actively protected before other maneuvers? · coagulopathy reversal documented? · CTA\nobtained (when patient stable enough) before/alongside bronchoscopy? · BAE considered as first-line\nbefore emergent surgery? · underlying-etiology workup planned post-stabilization?\n\n*Sources: [SCII Consensus Guidelines for IR Management of Hemoptysis — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC10289864/) · [Bronchial Artery Embolization in Life-Threatening Massive Hemoptysis — PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3955516/) · [IBCC (EMCrit) — Hemoptysis chapter](https://emcrit.org/ibcc/hemoptysis/)*\n"}, {"file": "meningitis-encephalitis-idsa-2004-2008.md", "title": "Bacterial meningitis / encephalitis", "system": "ID", "body": "# Bacterial meningitis / encephalitis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Practice Guidelines for the Management of Bacterial Meningitis (Tunkel AR et al., IDSA),\n> *Clinical Infectious Diseases* 2004;39:1267–84 — and The Management of Encephalitis: Clinical Practice\n> Guidelines by the IDSA (Tunkel AR et al.), *Clinical Infectious Diseases* 2008;47:303–27.\n> https://academic.oup.com/cid/article/39/9/1267/402080 · https://academic.oup.com/cid/article/47/3/303/313455\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2004 / 2008 (both due for a newer edition — check periodically)\n\n## Why — physiology / first principles\n- Bacterial meningitis: pathogen seeds the subarachnoid space (hematogenous or contiguous spread) → bacterial lysis releases cell-wall components (LPS, teichoic acid) → cytokine cascade (TNF, IL-1) → increased blood-brain-barrier permeability → vasogenic + cytotoxic + interstitial edema → raised ICP and impaired cerebral perfusion, plus vasculitis that can cause ischemic stroke.\n- Rationale for empiric antibiotics without waiting for imaging/LP: bacterial killing and lysis begin the injury cascade — delay directly worsens outcome.\n- Rationale for dexamethasone given **with or before** the first antibiotic dose, not after: it blunts the cytokine surge triggered by bacterial lysis, so it must be on board before antibiotics cause that lysis.\n- Encephalitis (e.g. HSV): direct viral cytopathic injury to temporal/limbic parenchyma, not an immune/pressure phenomenon — rationale for empiric acyclovir pending PCR, since delay allows irreversible necrosis that antivirals cannot reverse.\n\n## Diagnosis / definition\n- [ ] **Classic triad** (fever, nuchal rigidity, altered mental status) — **present in a minority of\n      patients (~44%)** *(verify)*; absence does NOT exclude meningitis — maintain suspicion on\n      clinical gestalt\n- [ ] **Kernig's / Brudzinski's signs** — low sensitivity; a negative exam does not rule out meningitis\n      *(verify)*\n- [ ] **CT-before-LP formal criteria** (IDSA 2004) — obtain CT first only if: focal neurologic deficit,\n      new seizure, papilledema, immunocompromised state, or moderate-to-severe impairment of\n      consciousness/GCS depression — otherwise proceed directly to LP\n- [ ] **Meningitis vs. encephalitis distinction** — meningitis = meningeal inflammation (headache, neck\n      stiffness, photophobia dominate); encephalitis = brain parenchymal involvement (altered mentation,\n      seizure, or focal deficit dominate, often with lower-grade meningismus) — the two overlap\n      clinically (meningoencephalitis) and empiric coverage for both is standard until CSF differentiates\n\n## Key labs & workup\n- [ ] **CSF profile** (society-sourced, all values *(verify)* lab-dependent):\n  - [ ] Bacterial: WBC often **>1000/µL, neutrophil-predominant**; glucose **low** (CSF:serum ratio\n        **<0.4**); protein **high**\n  - [ ] Viral/aseptic: WBC lower, **lymphocyte-predominant**; glucose **normal**; protein **mildly\n        elevated**\n- [ ] **Opening pressure** measured (supine) at LP\n- [ ] **Blood cultures ×2** drawn before antibiotics\n- [ ] **CSF PCR panel** — HSV, enterovirus, VZV, bacterial multiplex *(verify local panel)*\n- [ ] **MRI brain with contrast** for suspected encephalitis — more sensitive than CT; **temporal lobe\n      changes** suggest HSV encephalitis\n- [ ] **Procalcitonin/CRP** as adjuncts to distinguish bacterial vs. viral etiology *(verify local\n      utility/threshold — adjunct only, not a substitute for CSF analysis)*\n\n## Management\n### Immediate actions (do not wait on imaging/LP to treat)\n- [ ] **Empiric antibiotics within 1 hour** of suspicion *(verify institutional target)* — do not delay for CT/LP if that would push therapy past this window\n- [ ] **Blood cultures before antibiotics** (does not delay abx)\n- [ ] **CT head before LP** only if focal neuro deficit, papilledema, seizure, immunocompromise, or reduced GCS — otherwise proceed to LP directly\n- [ ] **LP**: cell count/diff, glucose (+ paired serum), protein, Gram stain, culture; consider **PCR panel** (HSV, enterovirus, VZV, bacterial multiplex) — *verify local panel*\n- [ ] **Empiric regimen** — age/exposure-adjusted (e.g. vancomycin + 3rd-gen cephalosporin ± ampicillin for *Listeria* coverage) — <agents/doses> — verify against local antibiogram and guideline table\n- [ ] **Empiric IV acyclovir** if encephalitis / HSV cannot be excluded — <10–20 mg/kg IV q8h — verify by age/renal function> — start **pending** diagnostics, do not wait for PCR\n\n### Adjunctive therapy\n- [ ] **Dexamethasone** — give **with or just before the first antibiotic dose** (benefit lost if given after); continue only if CSF/blood confirms *S. pneumoniae* (or *H. influenzae* in children) — <dose/schedule — verify>\n- [ ] **De-escalate/stop dexamethasone** if a non-indicated pathogen is identified\n\n### Ongoing ICU management\n- [ ] **Neuro checks / seizure watch** — treat seizures per unit protocol; consider EEG if unexplained decreased consciousness (esp. encephalitis)\n- [ ] **ICP management** if signs of raised ICP / herniation risk — head of bed, osmotherapy per protocol\n- [ ] **Isolation/droplet precautions** until meningococcus excluded; **chemoprophylaxis for close contacts** if meningococcal — notify public health\n- [ ] **De-escalate antibiotics** once organism + sensitivities known; confirm **total duration** per organism (varies by pathogen) — *verify*\n- [ ] **Repeat LP** only if indicated (poor response, resistant organism, ongoing fever) — not routine\n- [ ] **Hearing assessment / neuro follow-up** planned before discharge (pneumococcal/H. flu meningitis)\n\n## Pearls & pitfalls\n- **\"2-10-10\" empiric bundle** — a memory aid for the initial suspected-CNS-infection push: ceftriaxone\n  2 g IV, dexamethasone 10 mg IV, acyclovir 10 mg/kg IV, all started together without waiting for\n  imaging or LP *(verify doses/weight-basis locally)* — EMCrit IBCC\n- **Don't reflexively add vancomycin + ampicillin to every empiric regimen** — resistant pneumococcus\n  and *Listeria* are a small minority of suspected-CNS-infection presentations; it may be reasonable to\n  optimize coverage once CSF/culture data return rather than broad-covering everyone by default\n  *(verify against local antibiogram/host risk factors — age >50, immunocompromise still favor\n  ampicillin coverage)* — EMCrit IBCC\n- **CT-before-LP is over-used in practice** — LP without prior imaging is generally considered safe in\n  patients with a normal mental status, no focal deficit, and no signs of mass effect; routing\n  low-risk patients through CT anyway is a recognized source of antibiotic delay — EMCrit IBCC\n- **Every hour of antibiotic delay costs outcome** — pre-LP CT has been associated with roughly a\n  1–2 hour delay to first antibiotic dose in some series, and delay itself (not the CT per se) is the\n  harm — give antibiotics (and dexamethasone) after blood cultures, before/regardless of imaging, when\n  suspicion is high *(verify institutional workflow)* — EMCrit IBCC\n- **CSF lactate as an adjunct in equivocal cases** — an elevated CSF lactate favors bacterial over viral\n  etiology and a normal/low lactate can support stopping empiric antibacterials when the picture is\n  ambiguous; not a replacement for Gram stain/culture *(verify local threshold and availability)* —\n  EMCrit IBCC\n- **Routine seizure prophylaxis is a pitfall, not a pearl** — it is not recommended; instead, keep a low\n  threshold for EEG in obtunded patients without another explanation, since non-convulsive status\n  epilepticus is easy to miss in this population — EMCrit IBCC\n- **Fever control is itself a neuroprotective intervention** — scheduled antipyretics (not PRN-only)\n  plus external cooling if needed to maintain normothermia, since fever independently worsens\n  neurologic injury in this population *(verify dosing)* — EMCrit IBCC\n\n## Commonly-missed on documentation (what the gap-check flags)\nDoor-to-antibiotic time documented? · dexamethasone timed with first dose (not after)? · steroids stopped if non-indicated organism? ·\nempiric acyclovir given if encephalitis possible? · seizure/ICP surveillance documented? · isolation + contact prophylaxis addressed (meningococcus)? ·\nantibiotic duration + de-escalation plan stated?\n\n*Sources: [Practice Guidelines for the Management of Bacterial Meningitis — IDSA 2004 (Oxford Academic)](https://academic.oup.com/cid/article/39/9/1267/402080) · [The Management of Encephalitis: IDSA Guidelines 2008 (Oxford Academic)](https://academic.oup.com/cid/article/47/3/303/313455) · [Approach to CNS infection (meningitis & encephalitis) — EMCrit IBCC](https://emcrit.org/ibcc/meningitis/)*\n"}, {"file": "mesenteric-ischemia-bowel-obstruction-wses-2022.md", "title": "Acute mesenteric ischemia / bowel obstruction", "system": "GI / Hepatic", "body": "# Acute mesenteric ischemia / bowel obstruction — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Acute Mesenteric Ischemia: Updated Guidelines of the World Society of Emergency Surgery\n> (Bala M et al., WSES), *World J Emerg Surg* 2022 — https://pubmed.ncbi.nlm.nih.gov/36261857/\n> Bowel obstruction: Bologna Guidelines for Diagnosis and Management of Adhesive Small Bowel\n> Obstruction (ASBO): 2017 Update, WSES ASBO Working Group —\n> https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6006983/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2022 (AMI) / 2017 (ASBO)\n\n## Why — physiology / first principles\n- **Mesenteric ischemia**: acute arterial occlusion (embolic — often a cardiac source lodging at the SMA\n  takeoff — or thrombotic on atherosclerosis) or a low-flow state (non-occlusive ischemia in shock/vasopressor\n  use) → interrupted mucosal oxygen delivery → mucosal necrosis progressing transmurally if uncorrected →\n  bacterial translocation, perforation, septic shock. Pain out of proportion to exam reflects visceral\n  ischemic pain that precedes the peritoneal signs of transmural necrosis.\n- **Bowel obstruction**: mechanical blockage → proximal dilation from trapped gas/fluid and impaired\n  absorption/increased secretion → rising intraluminal pressure → once pressure exceeds capillary perfusion\n  pressure (closed-loop or strangulating obstruction), the same ischemia-to-perforation cascade follows.\n- The shared thread is why closed-loop/strangulation and ischemic features (pain out of proportion, lactate,\n  peritonism) — not obstruction alone — define the true emergency in both conditions.\n\n## Diagnosis / definition\n- [ ] High suspicion for AMI with pain-out-of-proportion-to-exam, especially with atrial fibrillation/embolic risk, known PVD/prior mesenteric thrombosis, or a low-flow/vasopressor-dependent state (NOMI)\n- [ ] Classify mechanism: embolic (~50%), arterial thrombotic (~15-25%), venous thrombosis (~5-15%), or non-occlusive (NOMI) — mechanism drives treatment choice\n- [ ] Distinguish adhesive SBO (ASBO) from other etiologies (hernia, malignancy, virgin abdomen) — management pathway differs\n- [ ] Any peritonitis, strangulation signs, or closed-loop obstruction → proceed to **surgery**, do not trial non-operative management\n\n## Key labs & workup\n- [ ] **CT angiography** (two-phase/biphasic protocol preferred) as the first-line diagnostic study — do not delay for lactate or other labs if suspicion is high; a single-phase study can miss venous thrombosis *(protocol availability — verify)*\n- [ ] Lactate is **insensitive early** — a normal lactate does **not** exclude AMI, particularly in early/venous disease, since portal venous lactate rises before systemic levels (hepatic clearance masks early elevation) *(verify)*\n- [ ] D-dimer as an adjunct marker — reported higher sensitivity than lactate in some series, but not yet a validated stand-alone rule-out test *(verify)*\n- [ ] Troponin is frequently elevated in AMI from myocardial demand ischemia — don't let it anchor the workup toward primary ACS and delay AMI diagnosis *(verify)*\n- [ ] SBO: CT with contrast to confirm diagnosis, identify the transition point, and look specifically for **signs of strangulation** (free fluid, mesenteric edema, small-bowel-feces sign, reduced/absent wall enhancement)\n- [ ] **Water-soluble contrast challenge** — both diagnostic and therapeutic; passage into the colon within 24 h predicts non-operative resolution *(reported sensitivity/specificity in the ~95%+ range in some meta-analyses — verify exact figures and local protocol)*\n\n## Management\n### Acute mesenteric ischemia — treatment\n- [ ] Correct the precipitating low-flow state (optimize hemodynamics, minimize vasopressor exposure if NOMI) in parallel with workup\n- [ ] Early **revascularization** — endovascular (thrombectomy/thrombolysis/stenting) vs. open surgical, chosen per anatomy, center expertise, and hemodynamic stability *(approach — verify per institutional capability)*\n- [ ] Resect clearly necrotic bowel; reassess viability of borderline segments before committing to the extent of resection\n- [ ] Use **damage-control technique** (temporary abdominal closure, planned re-look laparotomy) when bowel viability is uncertain or the patient is unstable\n- [ ] Broad-spectrum antibiotics for bowel ischemia/perforation risk *(agent — verify)*\n- [ ] Anticoagulation for embolic/thrombotic AMI once bleeding risk from any planned intervention allows *(timing/agent — verify)*\n- [ ] Multidisciplinary involvement (vascular surgery, interventional radiology) from time of diagnosis\n\n### Small bowel obstruction — management\n- [ ] Nasogastric decompression + IV fluid/electrolyte correction for all non-operative-management (NOM) candidates\n- [ ] NOM duration, in the absence of strangulation/peritonitis, may extend up to **72 h**; if unresolved by then → surgery *(threshold — verify local practice)*\n- [ ] Laparoscopic approach may be considered in selected patients with appropriate expertise; open surgery preferred for strangulating ASBO or after failed NOM\n\n## Pearls & pitfalls\n- [ ] Severe abdominal pain out of proportion to exam findings should be assumed AMI until disproven — a low threshold for imaging in this presentation improves outcomes *(verify)* — Deranged Physiology: \"Mesenteric ischaemia\"\n- [ ] Lactate is an unreliable rule-out test — reported sensitivity as low as ~50% depending on disease stage; because portal venous lactate rises before systemic levels (hepatic clearance), early/venous disease can present with a normal systemic lactate *(verify)* — Deranged Physiology: \"Mesenteric ischaemia\"\n- [ ] D-dimer may outperform lactate as a screening marker in some series (reported sensitivity ~96%, negative LR ~0.12) but is not yet a validated stand-alone rule-out test *(verify)* — Deranged Physiology: \"Mesenteric ischaemia\"\n- [ ] Troponin elevation is common in AMI from myocardial demand ischemia and can misdirect the workup toward primary ACS, delaying AMI diagnosis — keep AMI on the differential even with a positive troponin in the right clinical context *(verify)* — Deranged Physiology: \"Mesenteric ischaemia\"\n- [ ] Two-phase (biphasic) CT angiography is the preferred protocol — a single-phase study can miss venous thrombosis *(local protocol availability — verify)* — Deranged Physiology: \"Mesenteric ischaemia\"\n- [ ] NOMI occurring in the context of cardiogenic shock carries a very poor prognosis, and these patients often cannot tolerate bowel resection — goals-of-care discussion may be as important as revascularization attempts in this subgroup *(verify)* — Deranged Physiology: \"Mesenteric ischaemia\"\n\n## Commonly-missed on documentation (what the gap-check flags)\nAMI suspected early in pain-out-of-proportion presentations? · CTA obtained without diagnostic delay? ·\nmechanism (embolic/thrombotic/venous/NOMI) documented and driving treatment choice? · damage-control\nconsidered when viability is uncertain? · SBO CT specifically reviewed for strangulation signs? ·\nwater-soluble contrast challenge used for NOM candidates? · 72 h NOM ceiling respected/documented?\n\n*Sources: [Acute Mesenteric Ischemia: Updated Guidelines of the World Society of Emergency Surgery 2022](https://pubmed.ncbi.nlm.nih.gov/36261857/) · [Bologna Guidelines for Diagnosis and Management of ASBO: 2017 WSES Update](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6006983/) · FOAMed pearls: [Deranged Physiology — Mesenteric ischaemia](https://derangedphysiology.com/main/required-reading/gastrointestinal-intensive-care/Chapter-26/mesenteric-ischaemia)*\n"}, {"file": "nsti-wses-2022.md", "title": "Necrotizing soft-tissue infection", "system": "ID", "body": "# Necrotizing soft-tissue infection — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** WSES/GAIS/WSIS/SIS-E/AAST global clinical pathways for patients with skin and soft-tissue\n> infections (Sartelli M et al.; World Society of Emergency Surgery, Global Alliance for Infections in\n> Surgery, World Surgical Infection Society, Surgical Infection Society-Europe, American Association for\n> the Surgery of Trauma), *World Journal of Emergency Surgery* 2022.\n> https://pubmed.ncbi.nlm.nih.gov/35033131/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022 (supersedes the 2018 WSES/SIS-E consensus\n> document — check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Bacteria (often via a minor skin breach; frequently polymicrobial synergy, sometimes toxin-producing monomicrobial strains like Group A strep) invade along fascial planes, spreading fast through a relatively avascular, low-resistance tissue plane.\n- Bacterial exotoxins/enzymes plus host thrombosis of the small vessels crossing the fascia → progressive ischemic necrosis of fascia, fat, and eventually skin — the destruction **outpaces and precedes** visible surface changes.\n- Nerve involvement in the ischemic/inflamed tissue produces pain out of proportion to exam findings **before** skin necrosis, bullae, or crepitus appear (late signs).\n- Systemic absorption of exotoxins can produce toxic-shock physiology independent of bacteremia.\n- Why surgical debridement is the only definitive treatment: antibiotics cannot penetrate necrotic, non-perfused tissue — source control (removing dead/infected tissue) is required to halt spread, and delay directly costs viable tissue and life.\n\n## Diagnosis / definition — do not let this stall surgery\n- [ ] **Clinical suspicion first**: pain out of proportion to exam, edema extending beyond erythema, fever, rapid progression, crepitus/bullae/skin necrosis (late signs — absence does NOT exclude)\n- [ ] **LRINEC score** may support suspicion but **lacks sensitivity to be a reliable diagnostic adjunct**\n  *(2022 pathway explicitly downgrades reliance on LRINEC vs. 2018 — verify)* — **a low score does not\n  rule out NSTI**\n- [ ] **CT** preferred if diagnosis unclear and patient stable — fat stranding, fluid/gas tracking along\n  fascial planes; **point-of-care ultrasound** reasonable for rapid bedside assessment (fascial thickening,\n  \"cobblestoning\") if unstable *(verify local availability)*\n- [ ] **Do not delay operative exploration** for imaging in a clinically obvious/deteriorating case — surgical exploration is the diagnostic gold standard\n\n## Key labs & workup\n- [ ] **CK** — muscle/fascial involvement marker\n- [ ] **Lactate** — severity/perfusion marker, trend serially\n- [ ] **CRP** and **CBC** (leukocytosis/left shift — also LRINEC components, cross-referenced above, don't treat as a substitute for clinical judgment)\n- [ ] **Blood cultures** before antibiotics where feasible\n- [ ] **Intraoperative tissue/fluid gram stain and culture** — sent at debridement, guides de-escalation\n- [ ] Imaging as above (CT/POCUS) — this section covers *what to send*, not a diagnostic gate — see Diagnosis section for the \"don't delay for imaging\" rule\n\n## Management\n\n### Source control — the dominant driver of survival\n- [ ] **Emergent surgical debridement** — target **as soon as possible, within 6 h of admission** for\n  suspected cases *(2022 pathway tightens the target from 12h to 6h — mortality 19% if <6h vs 32% if >6h\n  — verify local target)*\n- [ ] Remove **all devitalized tissue**; **skin-sparing technique** where feasible to preserve viable tissue; leave wound open\n- [ ] **Planned re-exploration at 12–24 h** (or sooner if deteriorating), repeated until no further necrosis found\n- [ ] **Negative-pressure wound therapy** applied after debridement to manage exudate *(verify local practice)*\n- [ ] Involve **surgery early** — do not wait for antibiotics/resuscitation to \"catch up\" before consult\n- [ ] Consider **amputation** if limb non-salvageable / life-threatening\n\n### Antimicrobials & resuscitation\n- [ ] **Empiric broad-spectrum coverage ASAP** — aerobic + anaerobic + gram-positive (incl. MRSA) —\n  regimen individualized to local antibiogram *(verify)*\n- [ ] **Add clindamycin/linezolid** for antitoxin effect if streptococcal/clostridial NSTI suspected — *verify*\n- [ ] **Fluid resuscitation & hemodynamic support** per shock physiology; treat as a surgical sepsis emergency\n- [ ] **Duration individualized** to clinical response and adequacy of source control — *verify local\n  protocol (no fixed universal day-count specified)*\n- [ ] **Multidisciplinary team** — surgery, critical care, ID — involved from presentation through rehab\n\n### Adjuncts (do not delay definitive care for these)\n- [ ] Consider **IVIG** specifically for **streptococcal (GAS) NSTI** *(weak/conditional recommendation — verify dose/criteria)*\n- [ ] Consider **hyperbaric oxygen where readily available** and **never** in place of/delaying debridement *(weak recommendation — verify)*\n- [ ] **Nutrition, VTE ppx, analgesia, wound care planning** per general critical-care bundle\n\n## Pearls & pitfalls\n- [ ] **Pain out of proportion to exam** (and extending beyond visible erythema) is the single most sensitive early clue (**~90% sensitive**) — more reliable than any late sign — *EMCrit/IBCC (Farkas)* `(verify %)`\n- [ ] Four high-risk scenarios warrant a very low threshold for surgical exploration: skin infection **with septic shock** (cellulitis alone shouldn't cause shock), severe pain/violaceous bullae, septic shock **with focal pain but no obvious skin findings**, and **any scrotal involvement** (near-zero threshold for urgent urology/surgery consult for suspected Fournier's) — *EMCrit/IBCC*\n- [ ] LRINEC performance is poor enough that some national guidelines recommend **against using it at all**, calling reliance on it \"a waste of time [and] potentially dangerous\" — a reassuring LRINEC must never delay surgical consultation — *EMCrit/IBCC* `(verify — echoes the WSES 2022 downgrade already noted above)`\n- [ ] On POCUS, fascial thickening **>4 mm** has only ~40–80% sensitivity/93% specificity; subcutaneous gas is highly specific but **<30% sensitive** — absence of gas on imaging does not exclude NSTI — *EMCrit/IBCC* `(verify)`\n- [ ] Initial surgical exploration misses disease in up to **~20%** of cases — plan for re-exploration proactively rather than treating one negative/limited exploration as reassuring — *EMCrit/IBCC* `(verify %)`\n- [ ] **Linezolid** may be preferable to vancomycin for MRSA coverage in NSTI — comparable/superior efficacy plus toxin-synthesis suppression and no nephrotoxicity concern during concurrent resuscitation — *EMCrit/IBCC* `(verify)`\n- [ ] The intraoperative **\"dishwater\" sign** — thin grey turbid fluid without frank pus, fascia that separates easily from muscle with minimal bleeding — supports the diagnosis when found at exploration — *EMCrit/IBCC*\n\n## Commonly-missed on documentation (what the gap-check flags)\nTime-to-OR documented against the **6-hour** target (not the older 12h benchmark)? · LRINEC/imaging noted\nas adjunct only (not used to exclude)? · re-exploration planned/booked? · antibiotic regimen covers\nstrep/clostridial toxin (clindamycin)? · IVIG considered specifically for streptococcal NSTI? ·\nmultidisciplinary team named?\n\n*Sources: [WSES/GAIS/WSIS/SIS-E/AAST global clinical pathways for SSTI 2022 — World J Emerg Surg (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC8761341/) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/35033131/) · [Prior edition — 2018 WSES/SIS-E consensus conference — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC6295010/) · [IBCC — Necrotizing Soft Tissue Infection (EMCrit, Josh Farkas)](https://emcrit.org/ibcc/necfas/)*\n"}, {"file": "pe-massive-submassive-aha-multisociety-2026.md", "title": "Pulmonary embolism (acute PE — risk-stratified)", "system": "Respiratory", "body": "# Pulmonary embolism (acute PE — risk-stratified) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2026 AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN Guideline for the Evaluation and\n> Management of Acute Pulmonary Embolism in Adults — the **first ACC/AHA guideline on this topic**,\n> *Circulation*/*JACC* 2026. **Different body from the prior source** (`pe-massive-submassive-esc-2019.md`,\n> 2019 ESC/ERS guideline, superseded/removed) — adopted as primary here as the newer, more comprehensive,\n> multisociety guideline; the 2019 ESC document was the prior operative source and used \"massive/\n> submassive\" terminology.\n> https://www.jacc.org/doi/10.1016/j.jacc.2025.12.023 (Guideline-at-a-Glance; full guideline also at\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001415)\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026\n\n## Why — physiology / first principles\n- Acute clot burden mechanically obstructs the pulmonary vasculature and triggers reflex hypoxic\n  vasoconstriction, causing a sudden rise in RV afterload — the thin-walled RV, built for a low-pressure\n  circuit, is poorly tolerant of acute pressure load (unlike the LV, which handles chronic afterload).\n- The RV dilates against a non-compliant pericardium → the interventricular septum bows/shifts into the\n  LV cavity → LV preload/filling falls → CO drops — obstructive shock from **RV failure**, not primary\n  hypoxemia, is the lethal mechanism in massive PE.\n- Systemic thrombolysis/catheter-directed therapy or surgical embolectomy relieve the mechanical\n  obstruction directly, reversing RV afterload acutely; anticoagulation alone only prevents propagation\n  and lets endogenous fibrinolysis catch up — which is why unstable patients need clot removal, not\n  anticoagulation alone.\n\n## ⚠ Terminology change — \"massive/submassive\" retired\nThe 2026 AHA/ACC guideline **replaces \"massive/submassive/low-risk\" with the AHA/ACC Acute PE Clinical\nCategories A–E** (with subcategories, e.g. D1–2, E1). Update local order-sets/documentation language\naccordingly *(verify local EHR/order-set terminology has been updated — old terms may still appear in\ncharts during the transition)*.\n\n## Diagnosis / definition\n- [ ] **AHA/ACC Acute PE Clinical Categories (A–E)** replace legacy risk tiers — assign using\n  **validated severity score + biomarkers + RV assessment**, not gestalt\n- [ ] **Category A/B (low severity)**: use **Hestia, PESI, or sPESI** to confirm low-risk status\n  *(verify score cutoffs — e.g. PESI class I–II, sPESI 0)*\n- [ ] **Category C (elevated-risk)**: symptomatic PE **with** elevated severity score (**PESI >85,\n  sPESI ≥1, or Hestia ≥1**) *(verify)* **and/or** elevated biomarkers/RV dysfunction — subdivided\n  (e.g. C1–3) by combination of findings *(verify subcategory definitions)*\n- [ ] **Category D (incipient cardiopulmonary failure)**: transient hypotension, tachycardia out of\n  proportion, or worsening RV function **without sustained shock** *(verify D1 vs D2 distinction)*\n- [ ] **Category E (cardiopulmonary failure)**: **persistent hypotension** (SBP <90 mmHg for >15 min,\n  or drop >40 mmHg from baseline, or need for vasopressors), **or cardiac arrest** — E1 = most severe\n  *(verify)*\n- [ ] Legacy terms still useful for cross-referencing older literature/FOAMed: **\"massive\" ≈ Category\n  E**, **\"submassive\" ≈ Category D** (± high-biomarker Category C) *(verify mapping)*\n\n## Key labs & workup\n- [ ] **Biomarkers**: troponin I/T, BNP/NT-proBNP, lactate — used for risk-category assignment, not\n  diagnosis of PE itself\n- [ ] **CT pulmonary angiogram**: confirms PE + assess **RV/LV ratio** (**>1.0 = RV strain**)\n  *(verify threshold)* — CT RV/LV ratio has limited specificity for true RV dysfunction; correlate\n  with echo\n- [ ] **CT contrast reflux grading** — flags severe RV failure even before formal RV/LV ratio:\n  **hepatic-vein reflux (grade 2) ≈ 3-fold mortality**, **subhepatic reflux (grade 3) ≈ 8–15-fold\n  mortality** *(verify)*\n- [ ] **Bedside echocardiography** for RV function/dysfunction — more sensitive than CT alone for\n  functional RV assessment; obtain in all Category C+ patients\n- [ ] **ECG**: S1Q3T3, new RBBB, or RV strain (anterior T-wave inversion V1–V4) support RV strain\n- [ ] **D-dimer** — diagnostic use only in low-pretest-probability patients; not used for risk\n  stratification once PE is confirmed\n- [ ] **Severity score**: calculate **PESI/sPESI or Hestia** on every confirmed PE to help assign\n  category\n\n## Management\n\n## Risk stratification / categorization — drives all subsequent decisions\n- [ ] **Category A (asymptomatic)** — incidental PE, no hospitalization needed *(verify)*\n- [ ] **Category B (symptomatic, low clinical severity score)** — early hospital discharge generally\n  appropriate *(verify score used and eligibility)*\n- [ ] **Category C (elevated biomarkers and/or RV dysfunction on imaging)** — hospitalize; ≈ prior\n  \"intermediate-low/intermediate\" risk *(verify)*\n- [ ] **Category D (incipient cardiopulmonary failure, subcategories D1–2)** — hospitalize; ≈ prior\n  \"intermediate-high (submassive)\" risk *(verify subcategory criteria)*\n- [ ] **Category E (cardiopulmonary failure with persistent hypotension, subcategory E1 = most severe)** —\n  hospitalize; ≈ prior \"high-risk (massive)\" *(verify)*\n- [ ] Document the **category explicitly** (not just \"PE\") — drives biomarker/imaging workup (troponin ±\n  BNP, RV assessment on echo/CT) and the therapy decisions below\n\n## Category E (cardiopulmonary failure / persistent hypotension — formerly \"massive\")\n- [ ] **Immediate anticoagulation** — unfractionated heparin preferred initially *(verify dosing)*\n- [ ] Hemodynamic/respiratory support: cautious fluid administration (avoid RV overload), vasopressors\n  (norepinephrine first-line) *(verify)*\n- [ ] **Advanced therapies are \"reasonable\" for Category E1**: systemic thrombolysis, catheter-directed\n  thrombolysis/thrombectomy, mechanical thrombectomy, or surgical embolectomy — select per\n  contraindications/availability *(verify institutional pathway/agent-dose)*\n- [ ] Consider **ECMO** as bridge in refractory shock or cardiac arrest *(verify institutional criteria)*\n- [ ] **PE Response Team (PERT) activation** — now a **Class 1 recommendation** for multidisciplinary PE\n  response teams *(verify local PERT availability/activation criteria)*\n\n## Category D (incipient cardiopulmonary failure — formerly \"submassive/intermediate-high\")\n- [ ] Anticoagulation + **close monitoring** (monitored bed/ICU) for hemodynamic deterioration\n- [ ] **Advanced therapies \"can be considered\" for Category D1–2** (individualized — not routine) *(verify\n  local criteria/availability; routine systemic thrombolysis remains generally NOT recommended — reserve\n  as rescue if deteriorating)*\n- [ ] **PERT input** for complex/borderline cases\n\n## Category C (elevated biomarkers/RV dysfunction) and Category A/B (asymptomatic/low severity)\n- [ ] Anticoagulation; hospitalize Category C for monitoring\n- [ ] Consider **early discharge/outpatient treatment** for Category A/B patients per validated score\n  *(verify eligibility criteria)*\n\n## General / adjunct\n- [ ] **Anticoagulant choice**: DOAC preferred over VKA for most patients *(verify contraindications —\n  renal function, pregnancy, antiphospholipid syndrome, cancer-associated thrombosis)*\n- [ ] **Duration**: minimum 3 months; reassess for extended therapy based on provoked/unprovoked status\n  and bleeding risk *(verify)*\n- [ ] **IVC filter** only if absolute contraindication to anticoagulation, or recurrent PE despite\n  adequate anticoagulation *(verify)*\n\n## Pearls & pitfalls\n> Note: much of the FOAMed literature below predates the 2026 AHA/ACC A–E terminology and uses legacy\n> \"massive/submassive\" language — pearls map approximately to **Category E / Category D** respectively.\n- [ ] RV/LV ratio >1 on CT **plus** troponin elevation or ischemic ECG changes, with clot burden that\n  plausibly explains the RV findings, are the practical \"does this patient need escalation\" trio many\n  PERT teams use (EMCrit IBCC) *(verify local criteria)*\n- [ ] CT contrast reflux into the hepatic veins (grade 2) or subhepatically (grade 3) correlates with\n  steeply rising mortality (~3-fold and 8–15-fold respectively) — worth flagging even before a formal\n  RV/LV ratio is measured (EMCrit IBCC) *(verify)*\n- [ ] Avoid **routine volume loading** in a failing RV — the RV is already overloaded and further\n  fluid worsens tricuspid regurgitation; reserve fluids for confirmed hypovolemia (collapsed IVC)\n  (First10EM)\n- [ ] **Intubation can be lethal** in PE-related shock — positive-pressure ventilation further\n  compromises a failing RV; avoid if possible and favour HFNC, establishing vasopressor support first\n  if intubation is unavoidable (First10EM / EMCrit IBCC)\n- [ ] **Dopamine is a poor vasopressor choice** in PE shock — norepinephrine or epinephrine preferred\n  (First10EM)\n- [ ] **PESI/sPESI predicts mortality but does not reliably predict acute hemodynamic collapse** or\n  identify who will benefit from thrombolysis — do not use the score alone to drive the thrombolysis\n  decision (First10EM)\n- [ ] If thrombolysis is being considered, favour **unfractionated heparin (reversible) over LMWH**,\n  and avoid arterial punctures/intracranial procedures while a lytic remains possible (First10EM)\n- [ ] **Half-dose systemic thrombolysis** (e.g. alteplase 50 mg) has shown comparable efficacy to\n  full-dose with less bleeding across small trials (MOPETT); full-dose (PEITHO) reduced haemodynamic\n  collapse but at a ~5-fold bleeding / ~10-fold ICH cost — weigh bleeding risk heavily in the\n  thrombolysis decision (REBEL EM) *(verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nAHA/ACC Category (A–E, with subcategory) explicitly documented — not legacy \"massive/submassive\" language?\nRV function/biomarkers assessed to assign category? thrombolysis/advanced-therapy contraindications\nactively checked before treatment decision? PERT activated for Category D/E or complex cases (Class 1)?\nanticoagulation duration/extended-therapy plan documented at discharge?\n\n*Sources: [2026 Acute Pulmonary Embolism Guideline-at-a-Glance — JACC](https://www.jacc.org/doi/10.1016/j.jacc.2025.12.023) · [2026 AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN Guideline for Acute PE — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001415) · [First AHA/ACC Guideline for Acute PE Introduces Risk-Based Clinical Framework](https://www.cardiometabolichealth.org/first-aha-acc-guideline-for-acute-pulmonary-embolism-introduces-risk-based-clinical-framework/) · [2026 Guideline — AHA Professional Heart Daily](https://professional.heart.org/en/science-news/2026-guideline-for-the-evaluation-and-management-of-acute-pulmonary-embolism-in-adults) · *(prior source, retained for reference only:* [2019 ESC/ERS Guidelines for acute PE](https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Acute-Pulmonary-Embolism-Diagnosis-and-Management-of)*)* · [IBCC — Submassive & Massive PE, EMCrit](https://emcrit.org/ibcc/pe/) · [Management of Intermediate and High-Risk Pulmonary Embolism — First10EM](https://first10em.com/management-of-intermediate-and-high-risk-pulmonary-embolism/) · [Treatment of Submassive PE: Full Dose, Half Dose, or No Dose? — REBEL EM](https://rebelem.com/treatment-of-submassive-pe-full-dose-half-dose-or-no-dose/)\n"}, {"file": "pneumothorax-bts-2023.md", "title": "Pneumothorax (incl. tension)", "system": "Respiratory", "body": "# Pneumothorax (incl. tension) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** BTS Pleural Disease Guideline / Statement on Pleural Disease and Procedures 2023, British\n> Thoracic Society, 2023.\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC11037506/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Why — physiology / first principles\n- A breach in visceral or parietal pleura lets air enter the pleural space → loss of the normally negative\n  intrapleural pressure → the lung collapses per its own elastic recoil.\n- Primary spontaneous PTX arises from subpleural bleb rupture in otherwise normal lung; secondary PTX arises\n  on top of structural lung disease.\n- **Tension physiology**: a one-way valve lets air in on inspiration without egress → progressively rising\n  pleural pressure → mediastinal shift and caval compression → reduced venous return → obstructive shock —\n  which is why tension PTX is a clinical diagnosis demanding immediate decompression, not a radiographic one.\n\n## Diagnosis / definition\n- [ ] **Type classified**: primary spontaneous (no underlying lung disease) · secondary spontaneous\n  (underlying lung disease, e.g. COPD/ILD) · traumatic · iatrogenic (post-procedure) *(verify classification)*\n- [ ] **Tension pneumothorax — clinical diagnosis, act immediately, do not wait for imaging**:\n  hypotension/shock, severe hypoxia, tracheal deviation, distended neck veins, hyper-resonance\n  *(verify full criteria — this is a bedside diagnosis)*\n- [ ] **Non-tension pneumothorax — symptom-based approach** (2023 BTS shift away from pure size-based\n  classification)\n- [ ] **High-risk features screened**: hemodynamic compromise, significant hypoxia, bilateral\n  pneumothorax, underlying lung disease, age >50 with significant smoking history, hemopneumothorax\n  *(verify full list)*\n\n## Key labs & workup\n- [ ] **CXR (erect)** — first-line imaging *(verify view/technique)*\n- [ ] **CT chest** for occult pneumothorax (e.g. post-trauma) or precise sizing where management hinges\n  on size *(verify indication)*\n- [ ] **Bedside ultrasound** — absence of lung sliding, \"lung point\" sign — useful in trauma/supine\n  patients where CXR may miss it *
