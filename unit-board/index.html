(verify operator expertise/local protocol)*\n- [ ] **ABG** if hypoxic or respiratory failure suspected *(verify indication)*\n\n## Management\n\n### Tension pneumothorax — act immediately\n- [ ] **Immediate needle or finger decompression** — do NOT delay for a chest X-ray *(needle site/\n  length — verify local protocol)*\n- [ ] Follow with **tube thoracostomy** promptly after decompression *(verify)*\n\n### Non-tension pneumothorax\n- [ ] **Conservative management** (observation) if asymptomatic/mild symptoms, no high-risk features,\n  and reliable follow-up available\n- [ ] **Needle aspiration** vs **ambulatory device** vs **chest drain** chosen per symptoms, risk\n  features, and local resources/expertise *(verify decision pathway)*\n- [ ] **Chest drain indicated**: secondary pneumothorax with respiratory compromise, large/symptomatic\n  primary pneumothorax, traumatic pneumothorax, tension pneumothorax (after decompression) *(size\n  thresholds — verify)*\n\n### Persistent air leak / recurrence\n- [ ] **Thoracic surgery referral (VATS)** for persistent air leak *(duration threshold — verify,\n  commonly ~3–5 days)* or recurrent pneumothorax\n- [ ] Chemical pleurodesis considered if surgery not an option *(verify)*\n\n### Special populations\n- [ ] **Pregnancy**: multidisciplinary approach; consider surgical evaluation before labor if continuous\n  air leak present *(verify)*\n\n## Pearls & pitfalls\n- Tension pneumothorax is a **pathophysiologic (clinical) diagnosis**, not a radiological one —\n  hemodynamic compromise plus respiratory failure defines it; mediastinal shift on imaging alone does\n  not confirm tension physiology, and plenty of shifted mediastina occur without hemodynamic compromise\n  *(verify — EMCrit/IBCC)*\n- Standard 2nd-intercostal-space midclavicular needle decompression frequently fails to reach the\n  pleura, especially in larger patients — mid-axillary line, 5th intercostal space is suggested as a\n  more reliable site *(verify local protocol before changing practice — EMCrit/IBCC)*\n- Needle decompression carries real trade-offs: risk of lung laceration if the pneumothorax is small,\n  inadequate drainage in ventilated patients with a large bronchopleural fistula, and it can complicate\n  subsequent chest tube placement — treat it as a temporizing measure, not definitive therapy\n  *(EMCrit/IBCC)*\n- Small-bore pigtail catheters appeared equivalent to larger surgical chest tubes for traumatic\n  pneumothorax in at least one RCT, but avoid pigtails for very small pneumothoraces (finder-needle\n  lung-laceration risk) and for ventilated patients with large air leaks, where flow may be inadequate\n  *(verify institutional tube-size protocol — EMCrit/IBCC)*\n- High-FiO₂ oxygen to \"resorb\" a pneumothorax faster is only marginally effective and is not a\n  substitute for definitive management — maintaining SpO₂ this way can also mask a clinically expanding\n  pneumothorax *(EMCrit/IBCC)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nTension diagnosed and treated clinically without waiting for imaging? · decompression time documented? ·\nhigh-risk feature screen completed to justify conservative vs invasive choice? · surgical referral\ntriggered at a defined air-leak duration (not left open-ended)? · follow-up imaging arranged after drain\nremoval?\n\n*Sources: [Updates on BTS Statement on Pleural Disease and Procedures 2023 — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC11037506/) · [Management of spontaneous pneumothorax: a mini-review — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC11320271/) · [Pneumothorax: an update on clinical spectrum, diagnosis and management — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC12159893/) · [EMCrit IBCC — Pneumothorax chapter](https://emcrit.org/ibcc/pneumothorax/)*\n"}, {"file": "post-arrest-neuroprognostication-erc-esicm-2025.md", "title": "Post-cardiac-arrest neuroprognostication", "system": "Neuro", "body": "# Post-cardiac-arrest neuroprognostication — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** European Resuscitation Council and European Society of Intensive Care Medicine (ERC-ESICM)\n> Guidelines 2025: Post-Resuscitation Care (Nolan JP, Sandroni C, et al.), *Resuscitation* 2025;215:110809\n> (co-published in *Intensive Care Medicine*) — neuroprognostication section specifically; supersedes the\n> 2021 ERC-ESICM post-resuscitation guideline.\n> https://pubmed.ncbi.nlm.nih.gov/41123621/\n> **Companion file:** `post-cardiac-arrest-ercesicm-2025.md` covers the full post-ROSC ICU bundle (this file\n> is the neuroprognostication-focused excerpt).\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025\n\n## Why — physiology / first principles\n- Cardiac arrest causes global cerebral ischemia-reperfusion injury; neuronal death proceeds via excitotoxicity, oxidative stress, and delayed apoptosis that continues to evolve over **72+ hours** — the injury is not \"complete\" at ROSC.\n- This is why prognostication requires waiting a minimum ~72h off sedation after rewarming: confounders (residual sedatives/opioids, hypothermia, neuromuscular blockade) and the still-evolving injury both make the picture look falsely worse earlier.\n- No single test/marker is both fully sensitive and specific for irreversible injury (each reflects a different mechanism — electrical, structural, biochemical), which is why guidelines mandate a **multimodal** approach rather than any single test.\n- Sedation, temperature, and metabolic confounders must be actively excluded before pupillary/motor exam or EEG findings are trusted as prognostic.\n\n## Diagnosis / definition\n- [ ] **\"Poor neurological outcome\"** — as used in prognostication, defined per the guideline as a\n      composite unfavorable outcome (severe disability/unresponsive wakefulness/death, roughly CPC 3–5 or\n      mRS 4–6 equivalent) at longer-term follow-up, **not** a bedside diagnosis made in isolation *(verify\n      exact composite definition used in the 2025 document)*\n- [ ] **Confounder framework (definitional, not optional)** — a \"poor outcome likely\" call is only valid\n      once residual sedation/neuromuscular blockade, hypothermia, severe metabolic derangement, and shock\n      are excluded (see Preconditions below) — this is a precondition of the algorithm, not a step that\n      can be skipped under time pressure\n- [ ] **Algorithm logic** — ≥72 h post-ROSC timing **and** ≥2 independent concordant multimodal findings\n      are both required before a poor-outcome determination is made; **no single test, at any timepoint,\n      is sufficient on its own** *(verify — core structural principle of the 2025 update)*\n\n## Key labs & workup\n- [ ] See **Step 1 (clinical screen)** and **Step 2 (multimodal testing)** below for the full detail on\n      GCS-motor, pupillary/corneal reflexes, myoclonus, EEG, SSEP, serum NSE, and neuroimaging — not\n      repeated here to avoid duplication\n- [ ] **Sedative/opioid/NMB drug levels or clearance estimate** — confirm agent, last dose/infusion stop\n      time, and hepatic/renal clearance status before trusting a clinical exam; **consider a\n      reversal-agent trial (naloxone/flumazenil) only if genuinely uncertain whether residual drug effect\n      explains unresponsiveness** *(verify institutional practice — flumazenil use is controversial,\n      seizure risk)*\n- [ ] **Metabolic panel** (glucose, sodium, renal/hepatic function, ammonia if hepatic encephalopathy\n      possible, ABG for severe acidosis) — rule out a metabolic mimic of poor neuro status before it\n      contaminates the prognostic picture\n\n## Management\n\n### Preconditions before any prognostication\n- [ ] **Confounders excluded first**: residual sedation/neuromuscular blockade, hypothermia, severe\n      metabolic derangement (incl. hypoglycaemia, sepsis), shock — do not prognosticate through an active\n      confounder\n- [ ] **Fever-avoidance / temperature-control** delivered per unit protocol; note course (affects sedative\n      clearance and exam timing) *(verify local target — terminology changed from \"TTM\" in 2025)*\n- [ ] **Minimum wait ≥72 hours after ROSC** before finalizing a \"poor outcome likely\" determination in\n      unconscious patients (GCS-M <6) *(verify — longer if confounders persist)*\n\n### Step 1 — clinical screen\n- [ ] **GCS motor score documented** — motor score **≤2** at ≥72 h carries 70–80% sensitivity (low\n      specificity) as the screening trigger to proceed to multimodal testing *(verify — refined threshold\n      vs. 2021's \"≤3\"; confirm exact cut-off against source)*\n- [ ] **Pupillary and corneal reflexes** assessed — **bilaterally absent at ≥72 h** is highly specific\n      (>99%) for poor outcome *(use quantitative pupillometry where available)*\n- [ ] **Status myoclonus** documented if present within **≤72 h** — early myoclonus (<48 h) predicts poor\n      outcome **only when paired with a malignant EEG background**, not in isolation *(2025 refinement —\n      verify)*\n\n### Step 2 — multimodal testing (require ≥2 independent concordant findings before predicting poor outcome)\n- [ ] **EEG** — **continuous EEG initiated within 24 h**; check for **highly malignant patterns**\n      (suppression, burst-suppression, status epilepticus on suppressed background) persisting off sedation;\n      **BIS ≤6 during temperature control** supports poor prognosis *(2025 adds BIS as an adjunct — verify\n      availability)*\n- [ ] **SSEP** — bilateral absence of **N20 cortical response at ≥48–72 h**: **>99% specificity** for poor\n      outcome; **N20 amplitude >4 µV** favors good outcome *(verify local timing convention)*\n- [ ] **Serum NSE** — serial measurements at **24/48/72 h**; **rising trend with value >60 µg/L at 48 h**\n      supports poor prognosis; **≤17 µg/L** suggests good outcome *(thresholds — verify, lab-dependent;\n      neurofilament light chain still **not recommended** — no validated threshold)*\n- [ ] **Neuroimaging** — **CT within 24 h** (reduced grey/white matter ratio, diffuse oedema); **MRI at\n      2–5 days** (extensive DWI/diffusion-restriction hyperintensities) → poor prognosis; repeat imaging if\n      initially unremarkable but still unconscious *(verify)*\n- [ ] **≥2 independent concordant pathological findings** required before communicating a \"poor outcome\n      likely\" determination — no single test used in isolation\n\n### Communication / disposition\n- [ ] **Multidisciplinary discussion** (intensivist, neurology, nursing) before family conversation\n- [ ] **Timeframe for further observation** explicitly stated if prognosis still uncertain at 72 h\n      (indeterminate is a valid interim conclusion — avoid premature withdrawal)\n- [ ] **Family goals-of-care conversation** documents which findings were used and their concordance;\n      **WLST decision-making kept separate from pure neuro-prognosis** — factor in age, comorbidity, overall\n      organ function, and patient preferences\n- [ ] **Organ donation discussion** per local policy if withdrawal is being considered\n\n## Pearls & pitfalls\n*Tips below, not directives — reputable FOAMed, cross-check against the society guideline and local\nprotocol. Numeric thresholds `(verify)`.*\n- **Self-fulfilling prophecy is the single biggest systemic pitfall**: a \"poor outcome\" call followed by\n  withdrawal of life-sustaining therapy prevents the prediction from ever being falsified — treat every\n  prognostic call as provisional until it clears the full multimodal bar *(EMCrit IBCC — Post-Cardiac\n  Arrest Care, emcrit.org/ibcc/post-arrest)*\n- **Propofol needs >24 h off before the exam is trustworthy** *(verify against renal/hepatic function)*;\n  benzodiazepines and opioid infusions can delay awakening further and are best avoided/minimized once\n  prognostication is the goal *(EMCrit IBCC — Post-Cardiac Arrest Care)*\n- **EEG timing matters as much as the pattern** — ~24 h post-arrest is described as the best single\n  timepoint; a malignant pattern that persists past 24 h carries more weight than one seen only early\n  *(verify local cEEG scheduling can support this)* *(EMCrit IBCC — Post-Cardiac Arrest Care)*\n- **Don't conflate status myoclonus with Lance-Adams syndrome** — status myoclonus (onset <48–72 h,\n  generalized, persistent, comatose, malignant EEG) tracks with poor outcome, but later-onset,\n  intention-triggered myoclonus in an awakening patient (Lance-Adams) does **not** carry the same\n  implication and roughly half of those patients may recover *(EMCrit IBCC — Post-Cardiac Arrest Care)*\n- **\"Normal\" SSEP is not reassuring** — bilateral absent N20 is highly specific for poor outcome, but a\n  preserved N20 is nonspecific and many such patients still fare poorly; low-amplitude N20 (<0.5 µV\n  *(verify)*) also trends toward unfavorable outcome despite technically being \"present\" *(EMCrit IBCC —\n  Post-Cardiac Arrest Care)*\n- **An unremarkable MRI in a still-unconscious patient should raise suspicion of an alternative\n  diagnosis**, not just be read as reassuring — reconsider non-anoxic causes of coma *(EMCrit IBCC —\n  Post-Cardiac Arrest Care)*\n- **0–1 unfavorable findings = indeterminate, not reassuring** — the ≥2-concordant-finding rule exists\n  specifically so a borderline picture defaults to \"wait and reassess,\" not to a soft \"probably okay\"\n  *(EMCrit IBCC — Post-Cardiac Arrest Care)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nConfounders (sedation/NMB/temp/metabolic) explicitly excluded before prognostication note? · ≥72h-post-ROSC\ntiming documented? · ≥2 independent concordant multimodal findings recorded (not a single test)? · EEG\nstarted within 24h and timing relative to sedation wean specified? · early myoclonus (<48h) not treated as\npoor-outcome-predictive without a concordant malignant EEG? · indeterminate prognosis at 72h prompts\nre-assessment plan rather than early closure? · WLST discussion documented as separate from the prognosis\nitself?\n\n*Sources: [ERC-ESICM Guidelines 2025: Post-Resuscitation Care — Resuscitation 215:110809](https://www.erc.edu/media/atqopqm4/gl2025-07-post-resus-e.pdf) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/41123621/) · [Neuroprognostication after cardiac arrest: Updated insights from the 2025 ERC-ESICM guidelines — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC13138817/) · [Prior edition — ERC-ESICM 2021 Post-Resuscitation Care](https://pubmed.ncbi.nlm.nih.gov/33773827/) · [EMCrit IBCC — Post-Cardiac Arrest Care (pearls & pitfalls)](https://emcrit.org/ibcc/post-arrest/)*\n"}, {"file": "post-cardiac-arrest-ercesicm-2025.md", "title": "Post-cardiac-arrest care (post-ROSC ICU management)", "system": "Other", "body": "# Post-cardiac-arrest care (post-ROSC ICU management) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** European Resuscitation Council and European Society of Intensive Care Medicine (ERC-ESICM)\n> Guidelines 2025: Post-Resuscitation Care (Nolan JP, Sandroni C, et al.), *Resuscitation* 2025;215:110809\n> (co-published in *Intensive Care Medicine*) — supersedes the 2021 ERC-ESICM post-resuscitation guideline.\n> https://www.erc.edu/media/atqopqm4/gl2025-07-post-resus-e.pdf\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Global whole-body ischemia during arrest, followed by reperfusion at ROSC, produces the \"post-cardiac\n  arrest syndrome\": myocardial stunning (reversible over 24-72h), a systemic ischemia-reperfusion/\n  inflammatory response resembling sepsis (vasoplegia, capillary leak), and ongoing neuronal injury that\n  evolves over hours-to-days rather than being fixed at the moment of ROSC.\n- Because brain injury is the dominant driver of post-arrest mortality and is **evolving, not static**,\n  interventions target secondary-injury prevention: avoiding hyperthermia/fever (raises cerebral MVO2),\n  avoiding hyperoxia/hypoxia and hypo/hypercapnia (each independently worsens neuronal outcome), and\n  maintaining MAP high enough to perfuse a brain with impaired autoregulation post-arrest.\n- Myocardial stunning is reversible but transiently reduces CO — hemodynamic support (fluids, inotropes,\n  MCS as needed) bridges this window rather than reflecting fixed structural damage, which is why early\n  echo and trend, not a single snapshot, guides support.\n\n## Diagnosis / definition\n- [ ] **Post-cardiac arrest syndrome** = combination of **anoxic brain injury, myocardial dysfunction,\n  systemic ischaemia/reperfusion response, and the persistent precipitating pathology** that caused\n  the arrest — manage all four domains, not ROSC alone\n- [ ] **ERC-ESICM three-phase framework**: (1) immediate treatment/stabilisation, (2) establishing the\n  cause, (3) recovery-focused care — sequence drives the order of interventions below *(verify)*\n- [ ] **\"Comatose\" for guideline purposes** = **motor component of GCS <6 (GCS-M <6)**, i.e. no\n  purposeful response to pain — this threshold triggers the neuroprognostication pathway and\n  temperature-control protocol\n- [ ] **Post-cardiac-arrest shock**: haemodynamic instability from myocardial stunning ± the\n  precipitating cause — distinguish from a purely rhythm-driven or volume-driven picture, as\n  management (inotrope vs fluid vs revascularisation) differs\n\n## Key labs & workup\n- [ ] **Initial**: ABG/VBG + lactate (clearance trend), electrolytes (K⁺, Mg²⁺, PO₄³⁻), glucose, CBC,\n  coagulation panel, CK/troponin trend\n- [ ] **ECG** immediately on arrival (guides angiography decision) + serial troponin\n- [ ] **EEG**: start **within 24 h** in comatose patients (seizure detection + baseline for\n  prognostication) — continue per local protocol\n- [ ] **SSEP**: bilateral cortical (N20) response at **~24 h** — absence supports poor prognosis\n  *(verify timing/technique)*\n- [ ] **NSE**: serial draws at **24/48/72 h** — rising trend or **>60 µg/L at 48–72 h** *(verify)*\n  supports poor prognosis; avoid haemolysed samples (false elevation)\n- [ ] **Imaging**: non-contrast brain CT early (grey/white ratio) — low sensitivity acutely, repeat at\n  72–96 h if still unconscious; **MRI diffusion sequences at 2–7 days** have better positive/negative\n  predictive value than early CT *(verify)*\n- [ ] **Coronary work-up**: ECG ± bedside echo drives the urgent-angiography decision (see next\n  section) — reserve for STEMI/shock/recurrent arrhythmia rather than reflexive angiography in every\n  arrest\n\n## Diagnosis of cause & immediate airway/breathing\n- [ ] **Prioritise immediate coronary angiography** if clear ST-elevation on ECG or high suspicion of\n  coronary occlusion (haemodynamic/electrical instability)\n- [ ] If angiography negative for a culprit lesion → **head-to-pelvis CT** (incl. CT pulmonary angiography)\n- [ ] If pre-arrest signs suggest a **non-coronary cause** (headache/seizure/neuro deficit, dyspnoea,\n  abdominal pain) → **whole-body CT** (head/neck/chest/abdo/pelvis + CTPA) before or after angiography\n- [ ] Secure airway if comatose/ventilated indication persists; confirm tube placement with\n  **waveform capnography**\n\n## Oxygenation & ventilation\n- [ ] **100% (or max available) FiO₂ immediately post-ROSC** until SpO₂/PaO₂ reliably measured\n- [ ] Then titrate to **SpO₂ 94–98%** or **PaO₂ 10–13 kPa (75–100 mmHg)** — *(verify)*; note pulse\n  oximetry can overestimate saturation in darker skin tones\n- [ ] **Avoid hypoxaemia** (PaO₂ < 8 kPa/60 mmHg) **and avoid hyperoxaemia**\n- [ ] Target **normocapnia — PaCO₂ 4.7–6.0 kPa (~35–45 mmHg)** — *(verify)*; extra caution/monitor\n  frequently in hypothermic patients (risk of hypocapnia) — use temperature-corrected or uncorrected\n  blood gas values **consistently**\n- [ ] **Lung-protective ventilation**: tidal volume **6–8 mL/kg ideal body weight** — *(verify)*\n\n## Haemodynamics & coronary/circulatory support\n- [ ] **Arterial line** for continuous BP in all patients; consider **cardiac output monitoring** if unstable\n- [ ] **Echocardiography ASAP** in all patients (underlying pathology, degree of myocardial dysfunction)\n- [ ] **Avoid hypotension** — target **MAP >60–65 mmHg** — *(verify — narrower/individualized targets\n  per BOX-trial-informed local protocol)*\n- [ ] Maintain perfusion with **fluids, noradrenaline and/or dobutamine** per volume/vasoconstriction/\n  inotropy need; **do not give steroids routinely**\n- [ ] **Avoid hypokalaemia and hyperkalaemia** (arrhythmia risk)\n- [ ] In OHCA **without ST-elevation**: **delay cath lab** unless clinical context suggests high likelihood\n  of acute coronary occlusion *(2025 change from 2021 — verify local pathway)*\n- [ ] Consider **mechanical circulatory support** (IABP/LVAD/VA-ECMO) in select refractory cardiogenic\n  shock or recurrent VT/VF despite optimal therapy (e.g. GCS ≤8, STEMI, arrest <10 min)\n- [ ] **Post-ROSC arrhythmias**: manage per peri-arrest arrhythmia algorithm; treat underlying cause\n  (coronary occlusion, electrolytes); **no routine anti-arrhythmic prophylaxis** if arrhythmia-free\n\n## Temperature control (fever avoidance — terminology change from \"TTM\")\n- [ ] **Actively prevent fever**: target temperature **≤37.5°C** in comatose patients — *(verify)*, for\n  **36–72 h post-ROSC** — *(verify duration per local protocol)*\n- [ ] Comatose patients who are **mildly hypothermic (32–36°C)** on arrival should **not be actively\n  warmed** to normothermia\n- [ ] **Against routine prehospital cooling** with rapid large-volume cold IV fluid\n- [ ] Use **surface or endovascular** temperature-control device with **feedback-based continuous\n  monitoring** if a device is used\n\n## Neurological — seizures, sedation, general ICU care\n- [ ] **EEG to diagnose/monitor electrographic seizures** in patients with clinical convulsions\n- [ ] First-line antiepileptics: **levetiracetam or sodium valproate** + sedative — *(verify dose)*;\n  **no seizure prophylaxis** if seizure-free\n- [ ] **Wake-up trial** (days post-arrest) if myoclonus with **benign EEG background**\n- [ ] **Short-acting sedatives + daily sedation holds** to enable earlier unconfounded neuro exam\n- [ ] **No routine neuromuscular blockade** (consider only if severe ARDS)\n- [ ] **30° head-up positioning**; **trophic/low-rate enteral feeding**, advance as tolerated\n- [ ] **Stress-ulcer prophylaxis** (high GI ulceration incidence, esp. with anticoagulant/antiplatelet use);\n  individualize anticoagulation per general ICU practice\n- [ ] **Standard glucose management protocol** — avoid extremes — *(target per local protocol — verify)*\n- [ ] **No routine prophylactic antibiotics**; low threshold if clinical suspicion of aspiration/pneumonia\n\n## Neuroprognostication (multimodal — do not shortcut)\n- [ ] **Do not prognosticate before ≥72 h post-ROSC** in unconscious patients (GCS-M <6), after excluding\n  confounders (sedation, NMB, hypothermia, severe hypotension, hypoglycaemia, sepsis, metabolic/\n  respiratory derangement)\n- [ ] **Multimodal** — no single test is sufficient; combine:\n  - [ ] **Clinical exam**: bilateral absent pupillary + corneal reflexes at ≥72 h; myoclonus within 96 h\n    (status myoclonus within 72 h) — use pupillometer where available\n  - [ ] **EEG** from day 1 (seizure detection + prognostic); **highly malignant patterns**\n    (suppressed background ± burst suppression) after 24 h → poor prognosis indicator\n  - [ ] **SSEP**: bilateral absence of N20 cortical potential at 24 h → poor prognosis (consider NMB\n    during recording to reduce artifact)\n  - [ ] **Biomarkers**: serial **NSE at 24/48/72 h** — rising trend + high absolute values\n    (**>60 µg/L at 48–72 h** — *(verify)*) → poor prognosis; **neurofilament light chain not recommended**\n    (no validated threshold)\n  - [ ] **Imaging**: brain CT (reduced grey/white matter ratio) or MRI (extensive diffusion restriction) →\n    poor prognosis; repeat CT at 72–96 h if initially unremarkable but still unconscious\n- [ ] **Poor outcome likely** if ≥2 of: absent pupil/corneal reflex, absent SSEP N20, highly malignant\n  EEG, NSE threshold exceeded, status myoclonus ≥72 h, diffuse anoxic injury on CT/MRI\n\n## Withdrawal of care, organ donation, family/follow-up\n- [ ] **Separate** WLST decision-making from pure neuro-prognosis — factor in age, comorbidity, overall\n  organ function, and patient preferences\n- [ ] Allocate adequate time for **team + family communication** around level-of-treatment decisions\n- [ ] After WLST decision, use a **structured curative-to-palliative transition**; consider **organ donation**\n- [ ] **Evaluate all patients progressing to death post-ROSC for organ donation** per local legal/ethical\n  requirements (including donation after circulatory death pathway)\n- [ ] **Early mobilisation, delirium management, ICU diaries**; functional assessment pre-discharge;\n  structured follow-up within **3 months** (cognitive/physical/emotional screening, co-survivors included)\n- [ ] Consider **cardiac rehabilitation** if cause was cardiac; investigate **unexplained arrest** (toxicology,\n  genetic testing, cardiac MRI, extended ECG monitoring) with long-term follow-up\n\n## Pearls & pitfalls\n- [ ] The TTM2 trial found **no mortality/functional benefit from cooling to 33°C** versus targeted\n  normothermia with fever avoidance — many now target normothermia (~36–37.5°C) and treat fever\n  reactively rather than proactively cooling to 33°C (The Bottom Line — TTM2 summary) *(verify local\n  protocol)*\n- [ ] Hypothermia has its own haemodynamic cost — arrhythmia with instability was **more frequent at\n  33°C than at normothermia** (24% vs 16% in TTM2) (The Bottom Line — TTM2 summary) *(verify)*\n- [ ] ESICM's fever-avoidance threshold (**<37.5°C**) is stricter than AHA's — pick one guideline's\n  target and apply it consistently rather than mixing thresholds (EMCrit PulmCrit)\n- [ ] Minimising sedation/paralytics once temperature is controlled both eases haemodynamics and\n  enables an **earlier, less-confounded neuro exam** for prognostication (EMCrit PulmCrit)\n- [ ] Consider **avoiding emergency coronary angiography** in a comatose patient without STEMI, shock,\n  or recurrent malignant arrhythmia — reflexive cath-lab-first delays neuroprognostication without\n  proven benefit in this group (EMCrit PulmCrit)\n- [ ] Pulse oximetry can read **falsely reassuring in darker skin tones** — favour the stricter\n  oxygenation target/an arterial sample when relying on SpO₂ alone (EMCrit PulmCrit)\n\n## Commonly-missed on documentation (what the gap-check flags)\nCause-of-arrest workup documented (angiography/CT pathway)? · SpO₂/PaCO₂ targets stated + avoiding\nhyper-/hypoxaemia and hyper-/hypocapnia? · MAP target explicit? · fever-avoidance target + duration\ndocumented? · sedation-hold plan for neuro exam? · seizure EEG + antiepileptic choice? · 72h rule\nrespected before any prognostic statement? · multimodal prognostication (≥2 modalities) not single-test? ·\nWLST discussion separated from prognosis and time allotted for family? · organ donation considered?\n\n*Sources: [ERC-ESICM Guidelines 2025: Post-Resuscitation Care — Resuscitation 215:110809](https://www.erc.edu/media/atqopqm4/gl2025-07-post-resus-e.pdf) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/41123621/) · [Prior edition — ERC-ESICM 2021 Post-Resuscitation Care (Resuscitation 161:220-269)](https://pubmed.ncbi.nlm.nih.gov/33773827/) · [PulmCrit — 2025 AHA & ESICM guidelines on post-arrest care, EMCrit](https://emcrit.org/pulmcrit/2025-arrest/) · [TTM2 Trial Summary — The Bottom Line](https://www.thebottomline.org.uk/summaries/ttm2/)*\n"}, {"file": "post-cardiac-surgery-bleeding-sts-sca-2021.md", "title": "Post-cardiac-surgery bleeding & coagulopathy (SICU)", "system": "Other", "body": "# Post-cardiac-surgery bleeding & coagulopathy (SICU) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Primary source:** STS/SCA/AmSECT/SABM Update to the Clinical Practice Guidelines on Patient Blood\n> Management, Society of Thoracic Surgeons / Society of Cardiovascular Anesthesiologists / American\n> Society of ExtraCorporeal Technology / Society for the Advancement of Blood Management, *Journal of\n> Extra-Corporeal Technology* 2021;53(2):97–124. DOI 10.1182/ject-2100053.\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC8220901/\n> **Complementary source:** 2024 EACTS/EACTAIC Guidelines on Patient Blood Management in Adult Cardiac\n> Surgery (in collaboration with EBCP), Casselman FPA et al., *European Journal of Cardio-Thoracic\n> Surgery* 2025;67(5):ezae352. DOI 10.1093/ejcts/ezae352. https://pmc.ncbi.nlm.nih.gov/articles/PMC12257489/\n> **FOAMed pearls layer:** Deranged Physiology (Alex Yartsev) — cited explicitly in the Pearls section, not authoritative for dosing.\n> **Compiled:** 06-Sep-2026 · Claude Code · applies to adult post-CPB cardiac surgery (CABG/valve); not\n> validated for VAD/ECMO-associated bleeding, which has a distinct coagulopathy profile\n\n## Why — physiology / first principles\n- CPB itself is coagulopathic by several parallel mechanisms: contact activation of the clotting cascade\n  by the extracorporeal circuit, hemodilution from pump priming, hypothermia (slows enzymatic clotting\n  reactions), heparin (reversed by protamine, but residual/rebound occurs), and acquired platelet\n  dysfunction from circuit shear/mechanical trauma — most post-bypass bleeding is multifactorial, not a\n  single deficiency.\n- Distinguishing **surgical** (a mechanical source — anastomosis, cannulation site) from **medical**\n  (coagulopathic/diffuse) bleeding matters because they need opposite first moves — surgical bleeding\n  worsens or fails to slow despite lab-guided correction and needs re-exploration, while coagulopathic\n  ooze responds to targeted factor/platelet replacement — treating one as the other delays the fix.\n- Targeted correction (guided by TEG/panel) beats empiric \"shotgun\" transfusion because each defect\n  (fibrinogen, platelets, residual heparin, hypothermia, ionized calcium) impairs clot formation by a\n  different mechanism — replacing the wrong factor does not fix a deficit in another.\n\n## ⭐ Approach to significant chest-tube drainage (stepwise)\n1. **Quantify output + trend** — mL/h over the last 1–4 h, not a single spot value; compare against\n   re-exploration triggers below *(verify institutional threshold)*\n2. **Characterize the pattern** — surgical vs coagulopathic (see Diagnosis below); a sudden step-up\n   after a period of low, stable output is more suspicious for a surgical source than a gradual ooze\n3. **Send the panel immediately** — CBC/platelets, fibrinogen, PT/INR/aPTT, ACT, ionized Ca, core temp,\n   ABG, ± TEG6s (CK vs CKH channel — see `teg-interpretation-guide.md`)\n4. **Correct targeted defects** in parallel — protamine (residual heparin) / platelets ± DDAVP / cryo or\n   fibrinogen concentrate / FFP or PCC / TXA / calcium / rewarming — guided by the panel, not empiric\n   \"shotgun\" transfusion\n5. **Reassess response** — if output does not slow despite correction, or the bleeding pattern looks\n   surgical, or hemodynamics are compromised → **call cardiac surgery back**; do not wait on lab\n   correction if there is tamponade physiology or hemodynamic collapse\n\n## Diagnosis / definition\n- [ ] **Surgical bleeding** — brisk, often sudden-onset, frequently localized to a single site/anastomosis;\n      may present as a step-up from a previously low, stable chest-tube output *(Deranged Physiology —\n      practice pattern, not a validated discriminator — verify against clinical gestalt)*\n- [ ] **Coagulopathic bleeding** — diffuse oozing from chest tube, line sites, and wound edges together;\n      gradual onset; associated with deranged coagulation panel/TEG\n- [ ] **Chest-tube output thresholds prompting concern/re-exploration** *(verify against your unit's\n      protocol — no single universal number)*: **>400 mL in any 1 h**, or **>200 mL/h for 4 consecutive\n      hours**, cited as a common institutional/Kirklin–Barratt-Boyes-derived convention (Yamashita G et al.,\n      *JTCVS Open* 2024, PMC11704565) — plus hemodynamic compromise, imaging evidence of large clot/\n      pericardial collection, or frank tamponade physiology regardless of volume\n- [ ] **Post-CPB coagulopathy picture** — multifactorial, usually several factors together:\n  - Incomplete surgical hemostasis (not a \"medical\" cause — always keep on the differential)\n  - Residual heparin effect after CPB\n  - Platelet dysfunction / thrombocytopenia — bypass-circuit consumption, preop antiplatelet agents\n  - Hypofibrinogenemia — consumption + hemodilution\n  - Hyperfibrinolysis — activated during CPB\n  - Hypothermia — impairs enzymatic clotting-cascade kinetics and platelet function\n  - Hemodilution — pump-priming volume, resuscitation fluid\n  - (Deranged Physiology, Chapter 106 — cause list; hyperfibrinolysis addition per TEG literature, Chapter 107)\n\n## Key labs & workup\n- [ ] **CBC/platelet count** — thrombocytopenia (consumption, dilution, preop antiplatelet load)\n- [ ] **Fibrinogen (Clauss)** — hypofibrinogenemia; cross-check against TEG6s CFF-MA if available\n- [ ] **PT/INR, aPTT** — factor deficiency, residual/rebound heparin, warfarin/DOAC effect if applicable\n- [ ] **ACT** — fastest bedside check for residual/rebound heparin effect; trend after protamine\n- [ ] **TEG6s (viscoelastic, CK vs CKH channel)** — distinguishes residual heparin effect from true factor\n      deficiency in minutes; **see `teg-interpretation-guide.md` for full pattern interpretation**\n- [ ] **Ionized calcium** — citrate load from CPB priming/blood products; calcium is a required cofactor\n      for the clotting cascade *and* for cardiac contractility post-cardiotomy — correct early\n- [ ] **Core temperature** — hypothermia independently impairs both enzymatic clotting and platelet function\n- [ ] **ABG** — acidosis impairs clotting-factor enzymatic activity; correct the underlying driver\n\n## Management\n\n### Immediate correction of contributing factors\n- [ ] **Rewarm to normothermia** *(verify target, e.g. core temp >36°C)*\n- [ ] **Correct ionized calcium** *(verify target, e.g. iCa >1.1 mmol/L)* — CaCl₂ preferred over gluconate\n      if hemodynamically unstable *(verify dose)*\n- [ ] **Correct acidosis** by treating the underlying cause; avoid empiric bicarbonate without indication *(verify)*\n\n### Reverse residual heparin\n- [ ] **Protamine** to reverse residual/rebound heparin *(verify dose — commonly ACT-guided or weight/\n      dose-based, e.g. ~1 mg per 100 units heparin estimated remaining)* — give **slowly IV**; watch for\n      hypotension, pulmonary hypertension, and anaphylactoid reactions (higher risk with fish allergy,\n      prior NPH-insulin exposure, or vasectomy history) *(verify institutional protamine protocol)*\n- [ ] **Confirm effect** — ACT normalization, or TEG6s **CK-R correcting toward CKH-R** (see TEG guide)\n- [ ] **Consider heparin rebound** if bleeding recurs hours later (redistribution from peripheral\n      tissue) — small repeat protamine dose *(verify)*\n\n### Goal-directed transfusion — TEG/ROTEM-guided where available\n- [ ] **POC viscoelastic-guided goal-directed transfusion algorithms are recommended** to reduce\n      periprocedural bleeding and transfusion — *STS/SCA/AmSECT/SABM 2021, Class I, Level B–R*\n- [ ] **EACTS/EACTAIC 2024** notes TEG/ROTEM-guided algorithms associated with a **statistically\n      significant reduction in mortality** (meta-analysis figure cited: 7.3% vs 12.1%, RR 0.64) and\n      reduced AKI vs standard-lab-guided management *(verify against the primary meta-analyses cited\n      in the guideline before quoting the exact figure clinically)*\n- [ ] **Platelets** for thrombocytopenia/dysfunction if bleeding *(verify local trigger)* ± **DDAVP**\n      specifically for known-responsive platelet dysfunction (uremic or CPB-induced, or type I vWD) —\n      *STS 2021, Class IIB, Level B–NR (verify dose, commonly ~0.3 mcg/kg)*\n- [ ] **Cryoprecipitate or fibrinogen concentrate** if hypofibrinogenemia and bleeding *(verify trigger,\n      commonly cited as fibrinogen <1.5–2 g/L — confirm local threshold)*\n- [ ] **FFP** reasonable for serious bleeding with **multiple or single factor deficiencies when safer\n      fractionated products are unavailable** — *STS 2021, Class IIA, Level B–NR*\n- [ ] **Prophylactic FFP without demonstrated coagulopathy is NOT indicated** — does not reduce blood\n      loss and exposes the patient to unnecessary risk — *STS 2021, Class III: Harm, Level A*\n- [ ] **Prothrombin complex concentrate (PCC)** reasonable to consider **over FFP as first-line therapy\n      for refractory coagulopathy** in select situations — *STS 2021, Class IIA, Level B–NR*; also\n      recommended if a **DOAC-specific reversal agent is unavailable** — *Class IIA, Level C–LD (verify dose)*\n\n### Antifibrinolytic\n- [ ] **Tranexamic acid (TXA) or epsilon-aminocaproic acid (EACA)** reduces blood loss and transfusion —\n      *STS 2021, Class I, Level A* — also reduced need for re-exploration (1.4% vs 2.8%, RR 0.49,\n      p=0.001, per STS 2021) *(verify dosing regimen and renal-adjustment — TXA carries a seizure-risk\n      signal at higher doses in cardiac surgery)*\n- [ ] Reasonable for **off-pump CABG** specifically — *STS 2021, Class IIA, Level B–R*\n- [ ] **Topical antifibrinolytic** to the surgical site after CPB reasonable to limit chest-tube drainage\n      and transfusion — *STS 2021, Class IIA, Level B–R*\n\n### Rescue therapy\n- [ ] **Recombinant factor VIIa (rFVIIa)** may be considered for **intractable nonsurgical bleeding\n      unresponsive to routine hemostatic therapy** after CPB — *STS 2021, Class IIB, Level B–NR* — reserve\n      for refractory cases after surgical source excluded, discuss with surgery/hematology given\n      thrombosis risk *(verify dose)*\n\n### Re-exploration decision\n- [ ] **Persistent bleeding despite correction**, a **surgical-pattern bleed** (brisk/localized/step-up),\n      **hemodynamic compromise**, or **imaging evidence of large clot/tamponade** → call cardiac surgery\n      back for re-exploration *(verify institutional threshold — see Diagnosis above)*\n- [ ] **Do not delay** re-exploration for lab/coagulopathy correction if there is hemodynamic collapse or\n      tamponade physiology — correct coagulopathy **in parallel** while the OR is arranged\n\n## Pearls & pitfalls\n*(FOAMed practice tips — Deranged Physiology — expert opinion/practice, NOT guideline-level directives; verify against local protocol)*\n- **Pattern matters more than a single number**: diffuse multi-site oozing points toward coagulopathy;\n  a brisk, sudden, localized bleed (especially a step-up from previously low output) points back to the\n  OR — this is a clinical heuristic, not a validated rule (Deranged Physiology, Ch. 106)\n- **Don't chase the INR with FFP when fibrinogen is the real problem** — cryoprecipitate/fibrinogen\n  concentrate corrects clot strength more directly when the driver is hypofibrinogenemia rather than\n  multi-factor deficiency (Deranged Physiology, Ch. 107 — TEG angle/MA-fibrinogen link)\n- **TEG/ROTEM numbers lag and have documented imprecision** — cited coefficients of variance are wide\n  (roughly 7–40% for TEG per meta-analyses referenced by Deranged Physiology) — treat the patient, not\n  the trace, especially if hemodynamically unstable (Deranged Physiology, Ch. 107) *(verify)*\n- **Viscoelastic samples are warmed to 37°C to run** — a hypothermic patient's true in-vivo coagulopathy\n  will look better on TEG/ROTEM than it actually is; rewarm before over-interpreting a \"reassuring\" trace\n  (Deranged Physiology, Ch. 107)\n- **Protamine itself can cause hypotension, pulmonary hypertension, or an anaphylactoid reaction** — give\n  slowly and be ready to treat; this risk is a reason to titrate rather than empirically re-dose without\n  confirming ongoing heparin effect (general critical-care pharmacology teaching — verify institutional protocol)\n- **TXA reduces bleeding/transfusion/re-exploration but is not free of risk** — dose conservatively,\n  particularly with renal impairment, given the seizure-risk signal reported at higher doses in cardiac\n  surgery (general FOAMed/critical-care teaching — verify local dosing protocol)\n- **A \"normal\" coagulation panel does not rule out a surgical bleed** — if the pattern looks surgical,\n  escalate to surgery regardless of labs (Deranged Physiology, Ch. 106)\n\n## Commonly-missed on documentation\nChest-tube output **trend** charted (not just a spot value)? · surgical-vs-coagulopathic pattern\nexplicitly stated? · protamine given/dose documented, with **repeat dose considered for heparin\nrebound**? · fibrinogen checked (not just PT/INR/aPTT)? · TEG6s/ROTEM used to guide transfusion, and\n**CK vs CKH compared if heparin effect suspected**? · ionized Ca and temperature corrected and\ndocumented? · TXA given/dose documented? · surgical re-exploration **explicitly considered/discussed**\nwith CVT surgery if bleeding persists despite correction?\n\n*Sources: [STS/SCA/AmSECT/SABM Update to the Clinical Practice Guidelines on Patient Blood Management — J Extra Corpor Technol 2021 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC8220901/) · [2024 EACTS/EACTAIC Guidelines on Patient Blood Management in Adult Cardiac Surgery — Eur J Cardiothorac Surg 2025 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC12257489/) · [A five-minute drainage assessment prevents reexploration for bleeding — Yamashita et al., JTCVS Open 2024 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC11704565/) · [Deranged Physiology — Bleeding complications following coronary artery bypass grafting](https://derangedphysiology.com/main/required-reading/cardiothoracic-surgical-intensive-care/Chapter-106/bleeding-complications-following-coronary-artery-bypass-grafting) · [Deranged Physiology — Viscoelastic tests of clotting function (TEG and ROTEM)](https://derangedphysiology.com/main/required-reading/haematology-and-oncology/Chapter-107/viscoelastic-tests-clotting-function-teg-and-rotem)*\n"}, {"file": "rhabdomyolysis-aast-2022.md", "title": "Rhabdomyolysis", "system": "Renal / Metabolic / Endo", "body": "# Rhabdomyolysis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Rhabdomyolysis: an American Association for the Surgery of Trauma Critical Care Committee\n> Clinical Consensus Document (Long B et al.), *Trauma Surg Acute Care Open* 2022;7:e000836. Supplemented\n> by general-review consensus on pigment nephropathy prevention — no single-body numeric-threshold\n> guideline exists; **confirm against local trauma/critical-care protocol.**\n> https://pubmed.ncbi.nlm.nih.gov/35136842/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022\n\n## Why — physiology / first principles\n- Muscle injury (crush, ischemia, seizure, exertion, drugs/toxins) disrupts the sarcolemma → intracellular contents (myoglobin, K, phosphate, CK, urate) spill into the circulation.\n- Filtered myoglobin precipitates as casts in the acidic distal tubule, plus heme-iron drives direct oxidative tubular injury and released mediators cause renal vasoconstriction → the combination produces ATN.\n- Released K and phosphate cause hyperkalemia/hyperphosphatemia disproportionate to renal function alone — an early, independent danger before AKI is even established.\n- Rationale for aggressive early IV fluids ahead of the CK peak: restores tubular flow and dilutes the tubule lumen, limiting cast formation before the kidney is committed to injury.\n- Calcium initially deposits in injured muscle (transient hypocalcemia acutely) then is mobilized during recovery (rebound hypercalcemia) — rationale for monitoring rather than aggressively correcting Ca in the acute phase.\n\n## Diagnosis / definition\n- [ ] **Rhabdomyolysis** = skeletal muscle fiber breakdown with leakage of intracellular contents (CK, myoglobin,\n  potassium, phosphate, urate) into the circulation — diagnosis is biochemical (elevated CK), not purely\n  clinical; the classic triad (myalgia, weakness, dark/tea-colored urine) is present in only a **minority**\n  of cases *(verify — the definition and the CK level that predicts renal injury are debated in the\n  literature, per AAST consensus document itself)*\n- [ ] Cause identified (crush/trauma, exertional, toxic/drug, immobilization, seizure, compartment syndrome, metabolic myopathy)\n- [ ] **Compartment syndrome** actively excluded/monitored in crush or prolonged-immobilization mechanisms — clinical exam ± compartment pressures; ischemic muscle/nerve injury becomes irreversible roughly **4–8 h** after onset of complete ischemia, so this assessment is time-critical *(verify timeframe)*\n\n## Key labs & workup\n- [ ] **CK diagnostic threshold**: generally **CK >1000 U/L or ≥5× ULN**; AKI risk rises further above roughly\n  **~5000 U/L**, though no single cutoff reliably predicts who develops renal injury *(verify — evidence is\n  weak/heterogeneous on the exact threshold)*\n- [ ] **CK trended serially**, not a single value — CK typically peaks at 24–72 h post-insult and the trend\n  (rising vs falling) matters more than any one number for risk assessment *(verify timing)*\n- [ ] Baseline renal function, K+, Ca²⁺, phosphate, urate, CK, myoglobin (if available) sent\n- [ ] Urinalysis — blood on dipstick without RBCs on microscopy suggests myoglobinuria *(verify — supportive, not diagnostic alone)*\n- [ ] Serial electrolytes and renal function while CK remains markedly elevated, given the risk of rapid hyperkalemia\n\n## Management\n\n### Fluid resuscitation (primary intervention)\n- [ ] **Early, aggressive isotonic IV fluids** started as soon as diagnosis suspected — do not wait for peak CK\n- [ ] Example regimen: **~1–2 L/h for first 1–2 h**, then titrate to **~500 mL/h** *(verify against cardiac/renal reserve and local protocol — rates vary widely across sources)*\n- [ ] **Urine output target ~200–300 mL/h** while CK remains markedly elevated *(verify)*\n- [ ] Fluid choice — isotonic saline most studied; some protocols alternate saline with bicarbonate-containing dextrose solution *(verify local practice)*\n- [ ] Ongoing fluid therapy reassessed against urine output, weight, and signs of volume overload — avoid fixed-rate infusion without reassessment\n\n### Adjuncts (evidence limited — do not use routinely without indication)\n- [ ] **Sodium bicarbonate** — only to correct systemic acidosis, not routine urinary alkalinization *(verify indication/dose)*\n- [ ] **Mannitol** — only if urine output remains inadequate (e.g. **<300 mL/h**) despite adequate fluids; discontinue if diuresis not achieved or serum osmolal gap rises excessively *(verify threshold — evidence weak, avoid combining routinely with bicarbonate)*\n- [ ] No high-quality evidence supports routine mannitol+bicarbonate combination — reserve for select refractory cases per local protocol\n\n### Electrolyte & complication management\n- [ ] **Hyperkalemia** monitored closely and treated per hyperkalemia protocol — can be rapid and life-threatening in crush injury\n- [ ] **Hypocalcemia** — generally do NOT correct unless symptomatic/severe (risk of rebound hypercalcemia during recovery) *(verify)*\n- [ ] Hyperphosphatemia and hyperuricemia monitored\n- [ ] **AKI** tracked per AKI protocol; RRT indications as per AKI guideline (refractory hyperkalemia, acidosis, volume overload, uremia)\n- [ ] Cardiac monitoring while K+ abnormal or CK markedly elevated\n\n## Pearls & pitfalls\n- **There is no RCT-proven treatment for rhabdomyolysis** — from diagnosis threshold to fluid regimen to\n  bicarbonate/mannitol, essentially the entire management pathway rests on physiologic reasoning and\n  observational data rather than high-quality trials; treat protocol numbers as reasonable defaults, not\n  proven targets *(LITFL — Rhabdomyolysis CCC)*\n- **CK level does not reliably predict who gets AKI** — don't anchor management decisions on a single\n  threshold; trend CK and reassess renal function and volume status directly rather than treating a number\n  in isolation *(LITFL — Rhabdomyolysis CCC)*\n- **Watch the clock on compartment syndrome** — muscle and nerve ischemia becomes irreversible within\n  roughly 4–8 h of complete ischemia; a crush or prolonged-immobilization mechanism warrants active,\n  repeated reassessment, not a one-time check *(LITFL — Compartment Syndrome CCC / Crush Syndrome CCC)*\n- **Don't chase hypocalcemia early** — calcium and phosphate can rebound as damaged muscle releases stored\n  calcium during recovery; correcting asymptomatic hypocalcemia in the acute phase risks iatrogenic\n  hypercalcemia later *(EMCrit/IBCC — Rhabdomyolysis)*\n- **Mannitol/bicarbonate is not a package deal** — the historical practice of combining them for \"renal\n  protection\" lacks solid supporting evidence and each carries its own risk (osmotic diuresis/volume shifts\n  with mannitol, alkalosis/sodium load with bicarbonate); use only where a specific indication exists\n  *(EMCrit/IBCC — Rhabdomyolysis)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nCK trend documented (not just one value)? · fluids started before peak CK confirmed? · urine output target explicitly tracked? ·\ncompartment syndrome considered in crush mechanism? · hypocalcemia left uncorrected unless symptomatic? · mannitol/bicarb use justified, not routine?\n\n*Sources: [Rhabdomyolysis: an American Association for the Surgery of Trauma Critical Care Committee Clinical Consensus Document — PubMed](https://pubmed.ncbi.nlm.nih.gov/35136842/) · [Rhabdomyolysis: Pathogenesis, Diagnosis, and Treatment — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC4365849/) · [Role of Bicarbonates and Mannitol in Rhabdomyolysis: A Comprehensive Review — PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7490772/) · [Rhabdomyolysis — LITFL CCC Renal](https://litfl.com/rhabdomyolysis-ccc/) · [Compartment Syndrome — LITFL CCC Trauma](https://litfl.com/compartment-syndrome-ccc/) · [Crush Syndrome — LITFL CCC Trauma](https://litfl.com/crush-syndrome/) · [Rhabdomyolysis — EMCrit IBCC](https://emcrit.org/ibcc/rhabdo/)*\n"}, {"file": "sah-aha-asa-2023.md", "title": "Aneurysmal subarachnoid hemorrhage (SAH)", "system": "Neuro", "body": "# Aneurysmal subarachnoid hemorrhage (SAH) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2023 Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage,\n> American Heart Association/American Stroke Association, *Stroke* 2023.\n> https://www.ahajournals.org/doi/10.1161/STR.0000000000000436\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023 · see also Neurocritical Care Society\n> 2023 statement on seizure prophylaxis in aSAH (cited below)\n\n## Why — physiology / first principles\n- Aneurysmal SAH = rupture of an arterial wall at a branch point (congenital wall weakness plus hemodynamic stress) → sudden blood in the subarachnoid space causes an acute ICP surge and carries a high risk of early **rebleeding** from the unsecured aneurysm — rationale for urgent clipping/coiling to eliminate the rebleed source.\n- Breakdown products of subarachnoid blood (oxyhemoglobin and inflammatory mediators) trigger delayed cerebral vasospasm/delayed cerebral ischemia (DCI), typically peaking **day 4–14** *(verify)* via smooth-muscle constriction and endothelial dysfunction — distinct from the rebleeding risk, and on a different timeline.\n- Rationale for nimodipine: primarily neuroprotective (improves outcome even though it doesn't reliably reverse angiographic vasospasm) rather than a pure vasodilator fix.\n- Rationale for euvolemia ± induced hypertension during the vasospasm window: supports collateral perfusion of at-risk tissue when autoregulation is impaired by the ischemic insult.\n\n## Diagnosis / definition\n- [ ] **Presentation** — classic **thunderclap headache** (\"worst headache of life,\" peak intensity <1 min);\n      may have brief LOC, meningismus, vomiting, sentinel headache in preceding weeks *(verify — a minority\n      present atypically without headache)*\n- [ ] **Hunt-Hess grade** (I–V) documented — clinical severity: I asymptomatic/mild headache → V deep coma\n      *(verify exact descriptors against source)*\n- [ ] **WFNS grade** (I–V) documented — GCS + focal deficit based, more objective than Hunt-Hess\n      *(verify)*\n- [ ] **Modified Fisher grade** (0–4) documented from CT — thickness/distribution of subarachnoid blood\n      ± IVH — drives DCI/vasospasm risk stratification *(verify grading detail)*\n- [ ] **Aneurysmal vs. non-aneurysmal (perimesencephalic) SAH** distinguished — perimesencephalic pattern\n      with negative angiogram carries a substantially better prognosis and different surveillance path\n      *(verify local pathway)*\n\n## Key labs & workup\n- [ ] **Non-contrast head CT** → **CTA** (or catheter angiography) to identify aneurysm — CT sensitivity is\n      highest very early and **falls with time from onset** *(verify local imaging-window protocol)*\n- [ ] **LP** if CT negative but high clinical suspicion — send for **xanthochromia** and RBC count trend\n      across sequential collection tubes; **timing matters** (too early risks a false negative)\n      *(verify local protocol/timing)*\n- [ ] **Troponin/ECG** — screen for neurogenic stunned myocardium; **echo** if hemodynamically relevant\n- [ ] **Baseline TCD** — establishes a reference for later vasospasm surveillance trend\n- [ ] **Daily sodium** from admission — baseline for SIADH-vs-cerebral-salt-wasting workup (see Medical\n      management below)\n\n## Management\n\n### Rebleeding prevention (first hours)\n- [ ] **SBP <160 mmHg** *(verify)* maintained with titratable agent (nicardipine/labetalol/esmolol)\n      until aneurysm secured — avoid hypotension\n- [ ] **Aneurysm-treatment center transfer** if not already at a high-volume neurosurgical/neuroendovascular\n      center — outcomes are volume/expertise-dependent\n- [ ] **Aneurysm secured ASAP** — clipping or coiling, preferably **within 24 h** of presentation, to\n      reduce rebleeding *(verify timing per case)*\n- [ ] **Antifibrinolytic (short-course)** considered only if securing will be delayed >24–72h and no\n      contraindication *(verify — not routine once aneurysm secured)*\n\n### Hydrocephalus / ICP\n- [ ] **EVD placed** for acute symptomatic hydrocephalus\n- [ ] **ICP monitoring** if depressed consciousness/thick clot burden *(verify indication)*\n- [ ] **Neuro checks** at frequency per grade/course *(verify interval)*\n\n### Delayed cerebral ischemia (DCI) / vasospasm prevention & surveillance\n- [ ] **Oral nimodipine 60 mg q4h × 21 days** started on admission (dose-reduce for hypotension rather\n      than discontinue) *(verify dose/duration)*\n- [ ] **Euvolemia maintained** — avoid prophylactic hypervolemia and avoid hypovolemia/hypotension\n- [ ] **Daily clinical exams** for new focal deficit or decline; **daily TCD** surveillance *(verify frequency)*\n- [ ] **Threshold for vascular imaging/CT perfusion** defined if TCD/exam concerning for DCI\n- [ ] **Induced hypertension** (± other hemodynamic augmentation) considered first-line if DCI develops,\n      before endovascular rescue therapy *(verify)*\n\n### Medical management / complications\n- [ ] **Seizure prophylaxis NOT routine/continued** — short perioperative course only if used, per\n      NCS 2023 statement; no ongoing ASM without a clinical seizure *(verify local practice)*\n- [ ] **Hyponatremia monitoring** — daily sodium; distinguish SIADH vs cerebral salt wasting before\n      choosing fluid restriction vs. salt/volume repletion (fluid restriction risks worsening DCI — verify approach)\n- [ ] **Glucose management**, **temperature control** (avoid fever), **DVT prophylaxis** (mechanical\n      immediately; pharmacologic once aneurysm secured — verify timing)\n- [ ] **Cardiac monitoring** — troponin/ECG/echo screen for neurogenic stunned myocardium if indicated\n- [ ] **Rebleeding precautions** maintained until secured (stool softeners, pain/agitation control, avoid\n      Valsalva)\n\n### Anticipatory / disposition\n- [ ] **Multidisciplinary/neurocritical care unit** involvement documented\n- [ ] **Goals-of-care discussion** for poor-grade SAH\n- [ ] **Rehab/PT/OT/speech** evaluation; outcome expectations discussed with family\n\n## Pearls & pitfalls\n- **Sentinel headache is easy to miss** — a meaningful proportion of aneurysmal SAH patients report a\n  distinct \"warning\" headache in the weeks before rupture; treating an atypical headache as benign because\n  it \"resolved\" is a recognized miss *(verify local incidence figure)* — [LITFL CCC: Subarachnoid\n  Haemorrhage](https://litfl.com/subarachnoid-haemorrhage-sah/)\n- **A truly negative CT very early (~0–6 h) is highly reassuring** — sensitivity is reported near ~97% in\n  this window and falls substantially by ~18–24 h+ *(verify against current literature, not just the\n  original Perry-era data)* — once CT ± CTA are both negative, an LP adds comparatively little; a\n  thunderclap headache workup with negative CT+CTA should also prompt consideration of RCVS or arterial\n  dissection, not just \"SAH excluded, done\" — [EMCrit IBCC: Subarachnoid Hemorrhage](https://emcrit.org/ibcc/sah/)\n- **Xanthochromia timing is a real pitfall** — drawing the LP too early (well under ~12 h from headache\n  onset) risks a false negative; interpretation method (visual vs. spectrophotometric) also varies by lab,\n  so a borderline result should not be treated as definitively reassuring *(verify local lab method and\n  timing convention)* — [LITFL CCC: Subarachnoid Haemorrhage](https://litfl.com/subarachnoid-haemorrhage-sah/) ·\n  [EMCrit IBCC: Subarachnoid Hemorrhage](https://emcrit.org/ibcc/sah/)\n- **SIADH vs. cerebral salt wasting: don't let the differential delay treatment** — both are commonly\n  managed with hypertonic saline acutely, so IBCC argues the mechanistic distinction matters less\n  urgently than getting sodium correction started; this is a pragmatic FOAMed framing, not a substitute\n  for the guideline's own SIADH/CSW workup emphasis — cross-check against local practice before treating\n  as directive *(verify)* — [EMCrit IBCC: Subarachnoid Hemorrhage](https://emcrit.org/ibcc/sah/)\n- **Nimodipine-induced hypotension: reduce/fractionate the dose rather than stopping outright** — e.g.\n  more frequent smaller doses — consistent with the guideline's own \"dose-reduce rather than discontinue\"\n  instruction *(verify exact fractionation your pharmacy supports)* — [EMCrit IBCC: Subarachnoid\n  Hemorrhage](https://emcrit.org/ibcc/sah/)\n- **Angiographic vasospasm ≠ DCI** — only roughly half of patients with vasospasm on imaging/TCD go on to\n  have clinically apparent delayed cerebral ischemia; treat TCD/imaging trends as a trigger for closer\n  clinical correlation, not an automatic mandate for rescue therapy *(verify local threshold for\n  escalation)* — [EMCrit IBCC: Subarachnoid Hemorrhage](https://emcrit.org/ibcc/sah/)\n\n## Commonly-missed on documentation (what the gap-check flags)\nHunt-Hess/WFNS + modified Fisher grade recorded? · SBP target pre-securing documented? · time-to-securing\ntracked? · nimodipine started + dose-reduced (not stopped) for hypotension? · daily TCD/exam for DCI\ndocumented? · sodium trend + SIADH-vs-CSW distinction charted? · seizure ppx justified if continued past\nperioperative period?\n\n*Sources: [2023 AHA/ASA Guideline for Aneurysmal SAH — Stroke](https://www.ahajournals.org/doi/10.1161/STR.0000000000000436) · [NCS Guidelines for Seizure Prophylaxis in Aneurysmal SAH — PubMed](https://pubmed.ncbi.nlm.nih.gov/42552475/) · [Management of Aneurysmal SAH and its Complications: A Clinical Guide — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC10339744/) · FOAMed (Pearls & pitfalls only): [LITFL CCC — Subarachnoid Haemorrhage (SAH)](https://litfl.com/subarachnoid-haemorrhage-sah/) · [EMCrit IBCC — Subarachnoid Hemorrhage](https://emcrit.org/ibcc/sah/)*\n"}, {"file": "sepsis-ssc-2026.md", "title": "Sepsis / Septic shock", "system": "ID", "body": "# Sepsis / Septic shock — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic\n> Shock 2026 (SCCM/ESICM), jointly published *Critical Care Medicine* 2026 and *Intensive Care Medicine*\n> 2026 — supersedes the 2021 edition (`sepsis-ssc-2021.md`, superseded/removed).\n> https://link.springer.com/article/10.1007/s00134-026-08361-1\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026\n\n## Why — physiology / first principles\n- Sepsis = infection triggers a **dysregulated** host inflammatory response (not the infection itself directly causing organ failure) — cytokine release injures the vascular endothelium.\n- Endothelial injury → **vasoplegia** (loss of vasomotor tone) + **capillary leak** (third-spacing, relative hypovolemia) + **microvascular thrombosis** (overlapping with DIC) → **distributive shock**: tissue hypoperfusion/hypoxia can occur despite normal or high cardiac output.\n- Lactate rises as a marker of tissue hypoperfusion and anaerobic metabolism (also confounded by impaired clearance/adrenergic drive) — a surrogate for the physiologic problem, not the problem itself.\n- Why early source control + broad-spectrum antibiotics: removes the trigger driving the inflammatory cascade.\n- Why fluids first, then vasopressors (norepinephrine) if fluid-refractory: fluids address the relative hypovolemia from capillary leak; vasopressors restore vasomotor tone to re-establish MAP/perfusion once volume alone is insufficient.\n\n## Diagnosis / definition\n> The SSC guideline itself does not redefine sepsis — the definitions below are the widely-used\n> **Sepsis-3** adjunct criteria referenced alongside SSC guidance, not new 2026-specific content.\n- [ ] **Sepsis** = life-threatening organ dysfunction caused by a dysregulated host response to infection — operationalized as a **SOFA score increase ≥2 points** from baseline attributable to the infection *(verify)*\n- [ ] **qSOFA** (RR ≥22, altered mentation, SBP ≤100 mmHg — **≥2 of 3** positive) is a **bedside prompt for risk**, not a diagnostic or screening criterion per Sepsis-3 — a low qSOFA does not exclude sepsis *(verify)*\n- [ ] **Septic shock** = sepsis **plus** vasopressor requirement to maintain **MAP ≥65 mmHg** **and** **lactate >2 mmol/L** despite adequate fluid resuscitation *(verify — note both criteria are formally required, though see Pearls below for the clinical nuance)*\n\n## Key labs & workup\n- [ ] **Serial lactate** — see Initial bundle below for the resuscitation-target framing; here it's the diagnostic/severity marker feeding the septic-shock definition above\n- [ ] **Blood cultures ×2 sets** before antibiotics where feasible (cross-ref Initial bundle)\n- [ ] **CBC + procalcitonin**\n- [ ] **Renal and hepatic panel** — SOFA-score organ-dysfunction components\n- [ ] **Coagulation panel** — SOFA-score component; screen for DIC if indicated (see separate DIC checklist)\n- [ ] **Arterial or venous blood gas**\n- [ ] **Source-directed imaging**\n\n## Management\n\n### Initial bundle (begin immediately — sepsis/septic shock is an emergency)\n- [ ] **Measure lactate**; re-measure if initial elevated *(guideline suggests guiding resuscitation to normalize)*\n- [ ] **Blood cultures before antibiotics** where feasible without meaningfully delaying treatment (2026: continued emphasis on cultures-first to support stewardship/de-escalation — do not delay abx for cultures in unstable patients)\n- [ ] **Broad-spectrum empiric antimicrobials ASAP** — ideally within **1 hour** for septic shock / probable sepsis *(agent per suspected source + local antibiogram — verify)* — balanced against **antimicrobial stewardship**: avoid unnecessary broad coverage once source/risk is clarified\n- [ ] **IV crystalloid for hypoperfusion/shock** — SSC suggests **≥30 mL/kg in first 3 h** *(individualize + reassess — verify; guideline continues to favor dynamic reassessment over a fixed fluid target)*\n- [ ] **Balanced crystalloid** preferred over 0.9% saline *(weak rec)*\n- [ ] Consider **point-of-care ultrasound (POCUS)** to help guide resuscitation *(conditional/weak rec — new in 2026 — verify local expertise/availability)*\n- [ ] **Vasopressors** if hypotensive during/after fluids → target **MAP ≥65 mmHg**, with a **lower range (~60–65 mmHg) reasonable in patients ≥65 y** *(new nuance in 2026 — verify; avoid over-shooting BP target, which recent evidence links to harm)*; **norepinephrine first-line**; may start **peripherally** rather than delay for central access\n- [ ] **Reassess perfusion** (dynamic measures / lactate clearance / cap refill / POCUS), not a single static number\n\n### Source control & antimicrobial stewardship\n- [ ] **Identify the source** and achieve **source control ASAP** (drain/debride/remove device) when applicable\n- [ ] **Daily de-escalation review**; narrow once cultures back; document **antibiotic day-count** and planned duration\n- [ ] Consider **procalcitonin + clinical** to support stopping abx *(weak rec)*\n- [ ] **Antimicrobial optimization** (dosing, source-appropriate narrowing, duration) documented as an explicit stewardship step, not left implicit *(2026 emphasis — verify local antimicrobial stewardship program input)*\n\n### Adjuncts / ongoing\n- [ ] **IV corticosteroids** (e.g. hydrocortisone) if **ongoing vasopressor requirement** in septic shock *(weak rec — verify dose/criteria)*\n- [ ] **Stress-ulcer prophylaxis with a PPI** suggested for patients with sepsis/septic shock **who have GI-bleeding risk factors** *(2026 — more specific than a blanket \"consider ppx\"; verify risk-factor criteria)*\n- [ ] **Active fluid de-resuscitation** (diuretics ± escalation) once the initial resuscitation phase is complete and the patient is stabilizing, to **prevent/treat fluid overload** *(new in 2026 — a distinct, explicit phase after early resuscitation — verify trigger/criteria and diuretic regimen)*\n- [ ] **Glucose management** — protocolized, avoid extremes *(target per protocol — verify)*\n- [ ] **Lung-protective ventilation** if ARDS supervenes (see ARDS checklist)\n- [ ] **VTE prophylaxis** unless contraindicated\n- [ ] **Nutrition** — early enteral when feasible\n- [ ] **Goals of care / SDM** conversation for high-severity or poor-trajectory patients; post-discharge/post-sepsis follow-up planning noted as an increasing area of guideline focus\n\n## Pearls & pitfalls\n- [ ] Lactate reflects endogenous epinephrine release as much as tissue hypoperfusion — the ANDROMEDA-SHOCK trial found targeting peripheral perfusion (e.g. capillary refill) at least as effective as targeting lactate clearance; treat a persistently elevated lactate as a prompt to hunt for a missed source/diagnosis, not an automatic trigger for more fluid/inotropes — *EMCrit/IBCC (Farkas)* `(verify)`\n- [ ] Up to **~95%** of a crystalloid bolus can leak out of the vasculature into the interstitium in some studies — a reminder that reflexive fluid boluses carry a real cost (glycocalyx injury, impaired venous return), reinforcing this file's own de-resuscitation-phase bullet above — *EMCrit/IBCC* `(verify %)`\n- [ ] Peripheral norepinephrine is safer than traditionally taught — extravasation complications are rare with appropriate site/monitoring, supporting an early peripheral start rather than delaying pressors for central access — *EMCrit/IBCC*\n- [ ] In a large elderly-permissive-hypotension trial, **MAP >60 mmHg** was safe, but a **diastolic BP <50 mmHg** on vasopressors correlated with mortality and renal failure independent of MAP — worth tracking DBP, not just MAP, when individualizing pressor targets in the ≥65y cohort noted above — *EMCrit/IBCC* `(verify)`\n- [ ] Fear that stress-dose steroids increase superinfection risk has been described as debunked in meta-analyses and the ADRENAL trial — the main real tradeoff is hyperglycemia, which should be monitored rather than used as a reason to withhold steroids in pressor-dependent shock — *EMCrit/IBCC* `(verify)`\n- [ ] Septic shock (vasopressor-dependent hypotension due to infection) can be clinically present even when lactate is not elevated — Sepsis-3 formally requires both criteria (see Diagnosis above), but don't let a normal lactate alone override the clinical diagnosis of shock — *EMCrit/IBCC* `(verify — a real point of definitional tension)`\n\n## Commonly-missed on documentation (what the gap-check flags)\nSource control identified? · cultures-before-abx where feasible? · lactate + repeat/clearance? · MAP\ntarget stated (age-adjusted for ≥65 y)? · abx de-escalation plan + day-count/stewardship note? · steroids\nconsidered if pressor-dependent? · PPI stress-ulcer ppx if GI-bleed risk factors present? · **de-resuscitation\nplan documented once stabilized** (new)? · VTE ppx? · GoC documented?\n\n*Sources: [Surviving Sepsis Campaign 2026 — Intensive Care Medicine (Springer)](https://link.springer.com/article/10.1007/s00134-026-08361-1) · [SCCM — Surviving Sepsis Campaign 2026 guideline page](https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026) · [ESICM — 2026 SSC guidelines announcement](https://www.esicm.org/2026-surviving-sepsis-campaing-guidelines/) · [Prioritizing the patient through a continuum of personalized care — insights from the 2026 SSC guidelines (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC13268726/) · [IBCC — Septic Shock (EMCrit, Josh Farkas)](https://emcrit.org/ibcc/sepsis/)*\n"}, {"file": "severe-cap-ats-2025.md", "title": "Severe community-acquired pneumonia", "system": "Respiratory", "body": "# Severe community-acquired pneumonia — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Diagnosis and Treatment of Adults with Community-acquired Pneumonia: 2025 Update —\n> **American Thoracic Society (ATS)**, *American Journal of Respiratory and Critical Care Medicine*\n> 2025/2026. Supersedes the 2019 joint ATS/IDSA guideline (`severe-cap-ats-idsa-2019.md`,\n> superseded/removed).\n> https://academic.oup.com/ajrccm/article/212/1/24/8435770\n>\n> ## ⚠ Physician-confirm nuance — this is an ATS-only guideline, NOT joint ATS/IDSA\n> The 2019 predecessor was **joint ATS/IDSA**. This 2025 update was **reviewed and approved by ATS only —\n> IDSA did not endorse it**, specifically over a recommendation to give empiric antibacterials when a\n> respiratory **viral pathogen** is detected in some settings. IDSA published a formal **Position\n> Statement** explaining the non-endorsement, and independent authors published **\"We Dissent: Lessons\n> From the 2025 Community-Acquired Pneumonia Guidelines\"** (*Clinical Infectious Diseases*, 2026)\n> critiquing both the recommendation and the guideline-development process. **Confirm with your unit/ID\n> service which position has been locally adopted** — the ATS 2025 recommendation as written below, or\n> IDSA's narrower alternative (empiric antibiotics only for select outpatients with comorbidities / select\n> nonsevere inpatients with a positive viral assay, individualized to bacterial-coinfection concern) —\n> before this checklist drives antibiotic decisions.\n>\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025\n\n## Why — physiology / first principles\n- Alveolar infection → inflammatory exudate fills alveoli (consolidation) → **intrapulmonary shunt**\n  (perfused but unventilated units) → hypoxemia that responds poorly to raising FiO₂ alone, unlike pure\n  V/Q-mismatch hypoxemia.\n- Systemic release of cytokines/inflammatory mediators from the infected lung drives the same distributive\n  physiology as sepsis elsewhere (vasodilation, capillary leak) → can progress to septic shock independent of\n  bacteremia.\n- The **major/minor severity criteria** are essentially a checklist for organ dysfunction produced by this\n  inflammatory response (respiratory failure, shock, multiorgan involvement) — the mechanistic reason they\n  predict ICU-level mortality risk.\n\n## Diagnosis / definition\n- [ ] **Severe CAP** = **1 major criterion** OR **≥3 minor criteria** (unchanged framework from 2019) *(verify\n  full list before using to justify ICU triage)*\n  - Major: **septic shock requiring vasopressors**; **respiratory failure requiring mechanical\n    ventilation**\n  - Minor (examples): RR ≥30, PaO₂/FiO₂ ≤250, multilobar infiltrates, confusion/disorientation,\n    uremia, leukopenia, thrombocytopenia, hypothermia, hypotension requiring aggressive fluid\n    resuscitation *(verify exact thresholds)*\n- [ ] Severity scores (**CURB-65**, **PSI/PORT**) may be used as complementary risk-stratification tools\n  for site-of-care decisions — distinct from, and not a substitute for, the ATS major/minor severe-CAP\n  criteria above, which specifically drive the ICU-triage decision *(verify current ATS 2025 wording on\n  how these tools relate)*\n\n## Key labs & workup\n- [ ] **Blood cultures ×2** and **sputum Gram stain/culture** for severe CAP, or if MRSA/Pseudomonas\n  risk factors or prior resistant-organism isolation\n- [ ] **Legionella + pneumococcal urinary antigen** for severe CAP *(verify indication threshold)*\n- [ ] **Lung ultrasound** now an accepted alternative to chest radiography for diagnosis where operator\n  expertise exists *(new in 2025 — verify local expertise/availability)*\n- [ ] **Respiratory viral testing** (incl. influenza) when circulating locally\n- [ ] **CRP/procalcitonin** may support diagnosis and steroid-benefit assessment *(verify role/thresholds\n  — see Pearls below)*\n\n## Management\n\n### Empiric antibiotics — start ASAP, do not delay for cultures\n- [ ] Standard severe CAP: **β-lactam PLUS macrolide**, or **β-lactam plus respiratory\n  fluoroquinolone** *(agents/doses — verify)*\n- [ ] **Add MRSA coverage** (e.g., vancomycin/linezolid) if risk factors or prior MRSA isolation —\n  obtain **nasal MRSA PCR** to support early de-escalation *(verify)*\n- [ ] **Add antipseudomonal coverage** if risk factors or prior resistant Gram-negative isolation\n  *(verify local risk-factor definitions)*\n- [ ] **Positive respiratory viral pathogen identified** — 2025 ATS update gives **setting-specific**\n  guidance (⚠ **see physician-confirm nuance above — IDSA disputes this**): outpatients **without**\n  comorbidities → **suggest withholding empiric antibacterials**; patients **with comorbidities or any\n  hospitalized patient** → **suggest empiric antibacterials** *(verify locally adopted position before\n  applying — do not treat this as settled stewardship guidance without ID sign-off)*\n- [ ] **Reassess and de-escalate at 48–72 h** based on culture/PCR results\n\n### Adjuncts\n- [ ] **Corticosteroids**: 2025 update **recommends against** routine use in **nonsevere** CAP; **conditionally\n  suggests** consideration in **severe** CAP *(change from 2019's more uniformly cautious stance — verify\n  current wording/dose/duration and local practice)*\n- [ ] VTE prophylaxis · early mobilization\n- [ ] **Duration**: shorter courses (as short as 3 days, minimum evidence-supported floor) strengthened for\n  **outpatient/nonsevere inpatient** disease; **severe CAP still ≥5 days**, afebrile/clinically stable for\n  ≥48–72 h before stopping *(verify)*\n\n## Pearls & pitfalls\n- Don't anchor on the CAP diagnosis alone — mimics (PE, decompensated heart failure, diffuse alveolar\n  hemorrhage) are common; one FOAMed estimate puts the false-CAP-diagnosis rate as high as **10–30%**\n  *(verify)* — reconsider if the trajectory doesn't fit (IBCC/EMCrit)\n- Blood culture yield in severe CAP is low (**~10%** *(verify)*) but they're still guideline-indicated —\n  don't expect a high hit rate, and don't skip them anyway (IBCC/EMCrit)\n- Nasal MRSA PCR has a high negative predictive value (**~96–99%** *(verify)*) — a strong tool for early\n  de-escalation of empiric MRSA coverage, not just a nice-to-have (IBCC/EMCrit)\n- Avoid large-volume fluid resuscitation (e.g., **~30 mL/kg** *(verify)*) in a CAP patient teetering\n  toward respiratory failure — it can worsen hypoxemia; favor earlier vasopressor support over aggressive\n  fluids in this population (IBCC/EMCrit)\n- Clinical improvement is typically expected by **~day 3** *(verify)*, but radiographic clearing lags\n  weeks behind — a persistent infiltrate alone is not evidence of treatment failure (IBCC/EMCrit)\n- If considering steroids, a higher CRP (one cited threshold: **>150 mg/L** *(verify)*) may identify\n  patients more likely to benefit; a low CRP should also prompt reconsidering the pneumonia diagnosis\n  itself (IBCC/EMCrit)\n\n## Commonly-missed on documentation (what the gap-check flags)\nSeverity criteria explicitly counted (major/minor), not just \"looks sick\"? · cultures obtained before\nfirst antibiotic dose? · first-dose antibiotic timing documented? · MRSA/Pseudomonas risk assessed with\nan explicit de-escalation plan? · **viral-pathogen antibiotic decision explicitly reasoned (ATS vs IDSA\nposition — which was followed and why)?** · steroid use justified per current (2025) severe-CAP stance? ·\nstop-date/duration criteria documented?\n\n*Sources: [ATS 2025 CAP guideline update — AJRCCM](https://academic.oup.com/ajrccm/article/212/1/24/8435770) · [Infectious Diseases Society of America (IDSA) Position Statement: Why IDSA Did Not Endorse the CAP Guidelines 2025 Update — Clinical Infectious Diseases](https://academic.oup.com/cid/advance-article/doi/10.1093/cid/ciaf625/8364653) · [\"We Dissent: Lessons From the 2025 Community-Acquired Pneumonia Guidelines\" — Clinical Infectious Diseases](https://academic.oup.com/cid/advance-article-abstract/doi/10.1093/cid/ciaf626/8364680) · [Community-Acquired Pneumonia — IBCC, EMCrit](https://emcrit.org/ibcc/cap/) (Pearls & pitfalls)*\n"}, {"file": "status-asthmaticus-gina-2026.md", "title": "Status asthmaticus (acute severe asthma)", "system": "Respiratory", "body": "# Status asthmaticus (acute severe asthma) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physicia
