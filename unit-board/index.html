 in acute pancreatitis\"\n- [ ] Lactated Ringer's may reduce inflammatory markers and progression to moderate-severe disease compared with normal saline — a reasonable default crystalloid absent a contraindication *(verify)* — PulmCrit/EMCrit: \"The myth of large-volume resuscitation in acute pancreatitis\"\n- [ ] Don't titrate fluids to a BUN target — a \"targeted hemodilution\" strategy using BUN was associated with increased mortality in trial evidence; favor urine output, mentation, and capillary refill as endpoints instead *(verify)* — PulmCrit/EMCrit: \"The myth of large-volume resuscitation in acute pancreatitis\"\n- [ ] Persistent low-grade tachycardia is common in AP despite adequate resuscitation — don't chase heart-rate normalization with more fluid, and don't rely on CVP to guide therapy *(verify)* — PulmCrit/EMCrit: \"The myth of large-volume resuscitation in acute pancreatitis\"\n- [ ] The WATERFALL trial found a slower/moderate fluid-administration rate reduced fluid-overload complications without worsening clinical outcomes compared with more aggressive rates — further supporting a move away from historic aggressive-bolus regimens *(trial specifics — verify)* — REBEL EM: \"Less is More . . . Again: Speed of IV Fluid Administration in Pancreatitis (WATERFALL Trial)\"\n\n## Commonly-missed on documentation (what the gap-check flags)\nSeverity score documented and trended? · fluid resuscitation goal-directed and individualized (not a\nreflexive aggressive-bolus order)? · nutrition route decided (enteral preferred, parenteral avoided) and\ndocumented? · special etiology (pregnancy/trauma/metabolic) considered where relevant? · cholangitis\naddressed with ERCP timing? · necrosis intervention timing justified (late-phase/step-up, not early open\nsurgery)? · antibiotics given only for confirmed/suspected infection, not as prophylaxis? · discharge\ncriteria + recurrence-prevention plan documented, not just bed disposition?\n\n*Sources: [IAP Revised Guidelines on Acute Pancreatitis 2025 — PubMed](https://pubmed.ncbi.nlm.nih.gov/40651900/) · [IAP 2025 Guidelines — ScienceDirect](https://www.sciencedirect.com/science/article/pii/S1424390325000857) · [Updates From the 2025 IAP Acute Pancreatitis Guidelines — PubMed](https://pubmed.ncbi.nlm.nih.gov/41396828/) · [ACG Guidelines: Management of Acute Pancreatitis 2024 — corroborating](https://pubmed.ncbi.nlm.nih.gov/38857482/) · FOAMed pearls: [PulmCrit/EMCrit — The myth of large-volume resuscitation in acute pancreatitis](https://emcrit.org/pulmcrit/the-myth-of-large-volume-resuscitation-in-acute-pancreatitis/) · [REBEL EM — Speed of IV Fluid Administration in Pancreatitis (WATERFALL Trial)](https://rebelem.com/less-is-more-again-speed-of-iv-fluid-administration-in-pancreatitis-waterfall-trial/)*\n"}, {"file": "adhf-accahahfsa-2022.md", "title": "Acute decompensated heart failure (ADHF)", "system": "Cardiac", "body": "# Acute decompensated heart failure (ADHF) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure, American College of\n> Cardiology/American Heart Association/Heart Failure Society of America, 2022 —\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001063\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022 (cross-check against ESC 2021/2023\n> focused update if practicing outside a US-guideline context; check for a newer edition periodically)\n\n## Why — physiology / first principles\n- ADHF is usually a **congestion** problem, not a low-output problem — filling pressure rises faster than\n  the pulmonary/systemic venous bed tolerates (\"warm-and-wet\" far more common than \"cold-and-wet\").\n- A failing ventricle sits on a flat, downshifted Frank-Starling curve: added preload buys little extra\n  stroke volume but a steep rise in filling pressure — hence decongest first, don't fluid-load empirically.\n- Chronic compensatory RAAS/sympathetic activation drives Na⁺/water retention and vasoconstriction; this\n  same axis is what GDMT (ACEi/ARNI, β-blocker, MRA, SGLT2i) interrupts to slow remodeling long-term —\n  distinct from acute diuresis/vasodilation, which relieve wall stress and pulmonary pressure now.\n- HFrEF (impaired contractility) vs HFpEF (impaired relaxation/compliance) reach the same congested\n  end-state by different mechanisms — decongestion is shared, but GDMT benefit is strongest in\n  HFrEF/HFmrEF *(verify HFpEF-specific evidence per agent)*.\n\n## Diagnosis / definition\n- [ ] **HF is a clinical diagnosis** (congestion + evidence of structural/functional cardiac abnormality) —\n  natriuretic peptides and imaging support the diagnosis, they do not replace bedside assessment\n- [ ] **ACC/AHA HF staging**: Stage A = at risk (risk factors, no structural disease/symptoms) · Stage B =\n  pre-HF (structural disease and/or elevated biomarkers, asymptomatic) · Stage C = symptomatic HF\n  (structural disease + current/prior symptoms) · Stage D = advanced/refractory HF *(verify — staging is\n  a longitudinal framework, not an acute-presentation label)*\n- [ ] **EF-based phenotype** (drives GDMT selection): **HFrEF** EF ≤40% · **HFmrEF** EF 41–49% with\n  evidence of increased filling pressures · **HFpEF** EF ≥50% with evidence of increased filling\n  pressures *(verify local EF cutoffs/reporting convention)*\n- [ ] In **HFmrEF/HFpEF**, an elevated natriuretic peptide supports the diagnosis but a **normal value\n  does NOT exclude it** — do not anchor on a normal BNP/NT-proBNP in a preserved-EF patient with a\n  convincing clinical picture\n- [ ] Use **BNP or NT-proBNP — not interchangeably** — track the same assay serially for trend\n\n## Key labs & workup\n- [ ] **Natriuretic peptide** (BNP or NT-proBNP) — in the acute/ED setting, sensitivity exceeds\n  specificity, so it is more useful to **rule out** than to rule in HF *(verify local threshold;\n  NT-proBNP is age- and renal-function-adjusted)*\n- [ ] **CBC, electrolytes, BUN/creatinine, glucose, LFTs, TSH, iron studies, lipid profile** on initial\n  workup — informs etiology/precipitant and drives GDMT eligibility *(verify local panel)*\n- [ ] **Troponin** — screens for an ischemic precipitant/concurrent ACS; may also be chronically\n  mildly elevated in HF itself, interpret in context\n- [ ] **ECG** — arrhythmia, ischemia, or conduction disease as precipitant\n- [ ] **CXR** — supports the diagnosis (congestion, effusion) or suggests an alternate cause; **a\n  normal CXR does not exclude ADHF**\n- [ ] **Echocardiogram** (if not recently done) to (re)establish EF and structural findings that drive\n  GDMT selection\n\n## Management\n\n## Presentation assessment — congestion + precipitant\n- [ ] **Confirm the diagnosis / severity of congestion** clinically (JVP, edema, orthopnea, rales) ±\n  **point-of-care ultrasound** (lung B-lines, IVC) *(adjunct — verify local practice)*\n- [ ] **Natriuretic peptide** (BNP/NT-proBNP) at presentation — supports diagnosis; low-normal value\n  argues against ADHF *(Class I diagnostic use — verify threshold, age/renal-adjusted for NT-proBNP)*\n- [ ] **Classify hemodynamic profile** — wet/dry × warm/cold — to steer diuretic vs. vasodilator vs.\n  inotrope decision\n- [ ] **Identify the precipitant** — ACS/ischemia, arrhythmia (esp. AF with RVR), medication\n  non-adherence, dietary indiscretion, uncontrolled hypertension, infection, worsening renal\n  function, thyroid disease, new/worsening valve lesion, NSAID or other cardiotoxic drug exposure\n- [ ] **ECG** and **troponin** to screen for ischemic trigger; **CXR**; basic labs (renal function,\n  electrolytes, TSH if new diagnosis)\n\n## Decongestion — IV diuretic strategy\n- [ ] **IV loop diuretic** first-line for fluid overload *(Class I)* — if diuretic-naïve, dose per\n  guideline-referenced starting dose *(verify)*; if on chronic oral diuretic, IV dose ≥ home oral\n  dose-equivalent *(verify)*\n- [ ] **Reassess diuretic response early** (~6 h / first AM void) — urine output and/or **spot\n  urinary sodium** to confirm adequate natriuresis *(verify threshold — e.g. spot Na ~50–70 mmol/L)*\n- [ ] **Inadequate response** → escalate: increase loop dose, switch to continuous infusion, or add\n  **second-site nephron blockade** (thiazide-type, e.g. metolazone) *(Class IIa)*\n- [ ] **Daily reassessment of decongestion**: weight, strict ins/outs or net fluid balance, orthostatic\n  vitals, renal function/electrolytes — adjust diuretic dose daily, do not run on autopilot\n- [ ] **Track renal function trend** — a rising creatinine alongside good diuresis/hemoconcentration\n  is expected and should not automatically stop diuresis *(clinical judgment — verify)*\n\n## Vasoactive therapy\n- [ ] **IV vasodilator** (nitroglycerin/nitroprusside) as adjunct to diuretics if **hypertensive** or\n  persistently congested despite diuresis *(Class IIb)* — avoid if hypotensive\n- [ ] **Inotropic support** only if **cardiogenic shock / low-output state** with hypoperfusion\n  refractory to volume optimization *(Class I when shock present — reserve for shock/bridge, not\n  routine congestion)*\n- [ ] Consider **mechanical circulatory support / ICU-level care and early cardiology involvement**\n  if cardiogenic shock or refractory low output *(verify local escalation pathway)*\n\n## Avoid harm\n- [ ] **Discontinue/avoid NSAIDs** — worsen congestion and renal function\n- [ ] **Avoid non-dihydropyridine CCBs** (verapamil, diltiazem) in HFrEF\n- [ ] **Avoid thiazolidinediones**; use caution with other agents known to precipitate/worsen HF\n- [ ] Review medication list for **other cardiotoxic or fluid-retaining agents** on admission\n\n## GDMT — continue, initiate, do not routinely stop\n- [ ] **Continue home GDMT** through hospitalization unless hemodynamically contraindicated\n  (symptomatic hypotension, worsening AKI, hyperkalemia) — do not reflexively discontinue on\n  admission\n- [ ] **Beta-blocker**: continue if already tolerated; do not initiate during active/unstable\n  decongestion — start/resume once euvolemic and hemodynamically stable, before discharge\n- [ ] **SGLT2 inhibitor**: consider **initiating in-hospital** once stabilizing, regardless of\n  diabetes status — evidence supports early in-hospital start with acceptable safety *(verify\n  renal/hemodynamic criteria and local protocol)*\n- [ ] **ARNI/ACEi/ARB**: initiate or up-titrate toward target once stable and renal\n  function/potassium permit — ARNI preferred over ACEi/ARB where feasible *(Class I in HFrEF)*\n- [ ] **MRA**: add once renal function/potassium allow, if not already on board\n- [ ] Aim for **all four pillars of GDMT** to be addressed (initiated, continued, or explicitly\n  deferred with reason documented) **before discharge**, not deferred to outpatient follow-up\n\n## Discharge readiness & transition of care\n- [ ] **Objective euvolemia** achieved (or clear plan/weight documented) before discharge — not\n  symptom-based alone\n- [ ] **VTE thromboprophylaxis** during admission unless contraindicated\n- [ ] **Discharge weight, target dry weight, and oral diuretic regimen** documented explicitly\n- [ ] **Repeat labs pre-discharge** (renal function/electrolytes) after diuresis and GDMT changes\n- [ ] **Early follow-up visit** — target **within 7–14 days** of discharge *(Class I — verify local\n  target, some pathways target ≤7 days)*\n- [ ] **Referral to HF disease-management program / HF clinic**, particularly for HFrEF or recurrent\n  hospitalization *(Class I)*\n- [ ] **Patient education**: daily weights, sodium/fluid guidance, symptom action plan, medication\n  adherence counseling\n- [ ] **Cardiac rehab referral** where eligible\n- [ ] Address the **identified precipitant** with a concrete plan (e.g., rate/rhythm control,\n  revascularization workup, infection treatment completed, adherence support)\n\n## Pearls & pitfalls\n- [ ] **Diurese to the exam, not the number** — decongest based on symptoms/volume status, not weight\n  alone; continuing diuresis through a mild creatinine bump rarely reflects true intrinsic AKI (EMCrit IBCC)\n- [ ] **Don't chase a single lever** — treating ADHF as \"just give more diuretic\" without addressing\n  afterload/precipitant/GDMT is a common failure mode; cold-and-wet (cardiogenic shock) patients can\n  look deceptively well but are critically ill and worsen with diuresis/vasodilation alone (EMCrit IBCC)\n- [ ] **Reconsider routine morphine** for dyspnea/anxiety in acute HF — traditional practice is\n  increasingly questioned given lack of supporting evidence (REBEL EM)\n- [ ] **POCUS E/e′** can help rapidly distinguish cardiogenic pulmonary edema from other causes of\n  acute dyspnea by estimating LA filling pressure *(adjunct, not a stand-alone diagnostic threshold —\n  verify)* (REBEL EM)\n- [ ] **SCAPE (sympathetic crashing acute pulmonary edema)**: high-dose IV nitroglycerine\n  *(up to ~250 mcg/min — verify)* plus high-pressure BiPAP is front-line and may avoid intubation — a\n  distinct strategy from routine ADHF titration (EMCrit/PulmCrit)\n- [ ] Many patients treated with a standard IV loop-diuretic strategy are still discharged with\n  residual congestion — keep a low threshold to escalate/add second-site nephron blockade rather than\n  accepting a \"good enough\" diuresis (REBEL EM)\n\n## Commonly-missed on documentation (what the gap-check flags)\nPrecipitant explicitly named? · daily weight + net fluid balance charted? · diuretic response\nreassessed (UOP/spot Na) not just \"continue diuresis\"? · renal trend interpreted, not just flagged? ·\nNSAID/harmful-drug review done? · all 4 GDMT pillars addressed with reason if deferred? · SGLT2i\ninitiation considered in-hospital? · discharge weight/dry-weight documented? · follow-up visit booked\nwithin 7–14 days? · HF clinic/cardiac rehab referral placed?\n\n*Sources: [2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001063) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/35363499/) · [ACC/AHA/HFSA 2022 and ESC 2021 guidelines on heart failure — comparison (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC10192289/) · [2023 Focused Update of the 2021 ESC Guidelines for acute and chronic heart failure — Eur Heart J](https://academic.oup.com/eurheartj/article/44/37/3627/7246292) · [EMCrit IBCC — Acute decompensated heart failure (including cardiogenic shock)](https://emcrit.org/ibcc/chf/) · [EMCrit/PulmCrit — severe heart failure & cardiogenic shock](https://emcrit.org/pulmcrit/heart-failure/) · [REBEL EM — Heart Failure articles](https://rebelem.com/tag/heart-failure/)*\n"}, {"file": "adrenal-crisis-endocrine-society-2016.md", "title": "Adrenal crisis", "system": "Renal / Metabolic / Endo", "body": "# Adrenal crisis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Diagnosis and Treatment of Primary Adrenal Insufficiency: An Endocrine Society Clinical\n> Practice Guideline (Bornstein SR et al.), *J Clin Endocrinol Metab* 2016;101(2):364–389. Supplemented by\n> Guidance for the prevention and emergency management of adult patients with adrenal insufficiency\n> (Arlt W et al., UK), *Endocr Connect* 2020.\n> https://www.endocrine.org/clinical-practice-guidelines/primary-adrenal-insufficiency\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2016 / 2020\n\n## Why — physiology / first principles\n- Adrenal crisis = absolute or relative cortisol deficiency → loss of cortisol's permissive effect on vascular tone and catecholamine responsiveness → vasodilation and hypotension that is **refractory to fluids and pressors alone** until cortisol is replaced.\n- Loss of cortisol's gluconeogenic/counter-regulatory role → hypoglycemia, especially with reduced oral intake.\n- In **primary** adrenal insufficiency, concurrent aldosterone deficiency causes renal Na wasting and K retention → hyponatremia + hyperkalemia + volume depletion; in **secondary** (pituitary) insufficiency, the renin-angiotensin-aldosterone axis is intact, so these findings are typically absent.\n- Rationale for immediate empiric hydrocortisone without waiting for a cortisol level, plus aggressive IV saline and dextrose: the hypotension and hypoglycemia will not reliably respond until the hormone deficit is corrected — delay risks cardiovascular collapse.\n\n## Diagnosis / definition\n- [ ] **Adrenal crisis** = acute deterioration with hypotension/shock or hemodynamic instability not otherwise\n  explained, **plus** ≥2 typical features (GI symptoms, profound fatigue/weakness, fever, hypoglycemia,\n  hyponatremia), improving within 1–2 h of parenteral glucocorticoid *(verify — definition per Arlt 2020;\n  this is a clinical, not purely biochemical, diagnosis)*\n- [ ] **Primary vs secondary AI distinguished**: hyperpigmentation (skin creases, sun-unexposed areas — from\n  elevated ACTH) + hyperkalemia (mineralocorticoid deficiency) point to **primary**; hyperkalemia is\n  typically **absent** in secondary AI *(verify)*\n- [ ] **Critical-illness-related corticosteroid insufficiency (CIRCI)** recognized as a related but **distinct**\n  entity — relative/functional adrenal insufficiency in critically ill patients without known AI, reported\n  in up to ~30% of ICU patients; more controversial diagnostically and **not** the primary target of this\n  guideline, which covers established primary AI *(verify — separate literature/criteria apply)*\n- [ ] Random cortisol interpreted with acute-illness caveats: very low value supports AI; a normal/high value\n  in an acutely unwell patient does **not** exclude crisis if clinical picture fits — **treat regardless**\n  *(verify cortisol cut-points — vary by assay/context, do not delay treatment to obtain them)*\n\n## Key labs & workup\n- [ ] Random cortisol / ACTH drawn **before** first hydrocortisone dose **only if it does not delay treatment**\n- [ ] Electrolytes — **hyponatremia** and **hyperkalemia** (suggest primary AI/mineralocorticoid deficiency),\n  trend with treatment response *(verify severity thresholds against electrolyte-emergencies protocol)*\n- [ ] Glucose — **hypoglycemia** common, especially pediatric/fasting states\n- [ ] Renal function — urea/creatinine often elevated from volume depletion, expected to improve with fluids\n- [ ] Short Synacthen (ACTH stimulation) test deferred to **once stable**, for diagnosis confirmation — not\n  performed during the acute crisis and not a reason to delay treatment *(verify local endocrine protocol)*\n- [ ] If diagnosis still uncertain and dexamethasone is being considered instead of hydrocortisone (it does not\n  cross-react with most cortisol assays), confirm local practice before substituting *(verify)*\n\n## Management\n\n### Immediate treatment\n- [ ] **Hydrocortisone 100 mg IV/IM bolus immediately** (**50 mg/m² for children**) *(verify dose)*\n- [ ] **IV crystalloid resuscitation** — isotonic saline, volume per hemodynamic status *(verify rate — typically rapid initial bolus then reassess)*\n- [ ] **Continuing hydrocortisone**: **200 mg/24h continuous IV infusion**, OR **50 mg IV/IM every 6 h** if infusion unavailable *(verify — dose tapers over following days as clinical status allows)*\n- [ ] **Correct hypoglycemia** with IV dextrose as needed\n- [ ] Correct hyponatremia/hyperkalemia — largely responds to hydrocortisone + fluids; treat per separate electrolyte protocol if severe/symptomatic\n- [ ] Precipitating illness actively treated (e.g. antibiotics for sepsis) in parallel\n\n### Ongoing management & taper\n- [ ] Taper hydrocortisone to usual maintenance/stress dosing over **1–3 days** once clinically stable, guided by precipitant resolution *(verify schedule)*\n- [ ] Mineralocorticoid (fludrocortisone) resumed once hydrocortisone dose is ≤~50 mg/day (glucocorticoid dose at this level provides sufficient mineralocorticoid activity above that) *(verify)*\n- [ ] Underlying diagnosis (primary vs secondary AI) confirmed/reviewed once patient stable — do not delay treatment for this\n- [ ] ICU/HDU-level monitoring while hemodynamically unstable\n\n### Prevention — before discharge (crisis is often preventable)\n- [ ] **Sick-day rules education**: double/triple oral glucocorticoid dose during intercurrent illness/fever\n- [ ] **Steroid emergency self-injection kit** (IM hydrocortisone) prescribed and patient/family trained on use\n- [ ] **Medical alert** (bracelet/card) confirmed in place\n- [ ] Steroid dependence documented prominently in the chart to prevent future missed/delayed dosing during admissions or procedures\n- [ ] Peri-operative/procedural stress-dose steroid plan documented if further procedures anticipated\n- [ ] Follow-up with endocrinology arranged\n\n## Pearls & pitfalls\n- Hypotension/shock **refractory to fluids and vasopressors** is the hallmark red flag — think adrenal crisis\n  when shock isn't behaving as expected for the working diagnosis *(LITFL — Adrenal Insufficiency CCC)*\n- **Fewer than half** of patients presenting in crisis carry a prior diagnosis of AI — crisis can be the\n  **first presentation** of adrenal insufficiency *(verify — LITFL Adrenal Insufficiency CCC)*\n- Look for **hyperpigmentation** in sun-unexposed skin/creases as a bedside clue to primary AI with high ACTH\n  — easy to miss if not specifically examined for *(LITFL Adrenal Insufficiency CCC)*\n- **When in doubt, treat** — a single dose of hydrocortisone given to a patient who turns out not to have AI\n  is low-risk; withholding it from a patient who does have AI can be fatal *(Maimonides EM — Adrenal Crisis)*\n- **CIRCI is a different, murkier problem** from confirmed primary AI — consider it in the vasopressor-dependent\n  critically ill patient with no known AI history, but recognize the diagnostic criteria and treatment\n  thresholds are less settled than for this guideline's primary-AI population *(Deranged Physiology —\n  Relative adrenal insufficiency of critical illness)*\n- Postural hypotension may be present **without** frank supine hypotension — orthostatic vitals can unmask\n  early/evolving AI that a single supine BP misses *(LITFL Adrenal Insufficiency CCC)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nHydrocortisone given empirically without waiting for cortisol? · precipitant named and treated? · taper plan documented? ·\nsick-day rules + emergency kit reviewed before discharge? · medical alert confirmed?\n\n*Sources: [Diagnosis and Treatment of Primary Adrenal Insufficiency: An Endocrine Society Clinical Practice Guideline — PubMed](https://pubmed.ncbi.nlm.nih.gov/26760044/) · [Primary Adrenal Insufficiency Guideline Resources — Endocrine Society](https://www.endocrine.org/clinical-practice-guidelines/primary-adrenal-insufficiency) · [Guidance for the prevention and emergency management of adult patients with adrenal insufficiency — PubMed](https://pubmed.ncbi.nlm.nih.gov/32675141/) · [Adrenal insufficiency — LITFL CCC Endocrine](https://litfl.com/adrenal-insufficiency/) · [Relative adrenal insufficiency of critical illness — Deranged Physiology](https://derangedphysiology.com/main/required-reading/endocrine-intensive-care/Chapter-233/relative-adrenal-insufficiency-critical-illness) · [Adrenal Crisis — Maimonides Emergency Medicine Residency](https://www.maimonidesem.org/blog/adrenal-crisis)*\n"}, {"file": "afib-flutter-rvr-acchrs-2023.md", "title": "Atrial fibrillation / flutter with RVR", "system": "Cardiac", "body": "# Atrial fibrillation / flutter with RVR — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2023 ACC/AHA/ACCP/HRS Guideline for the Diagnosis and Management of Atrial Fibrillation\n> (Joglar JA et al., ACC/AHA Joint Committee on Clinical Practice Guidelines), *Circulation* 2023;148:e1–e156.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001193\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Why — physiology / first principles\n- AF = chaotic, disorganized atrial re-entry (no coordinated mechanical contraction); flutter = an\n  organized macro-re-entry circuit — both hand irregular/rapid impulses to the AV node.\n- The AV node's rate-dependent conduction/refractoriness is what actually sets ventricular rate at RVR —\n  AV-nodal blockers (β-blocker, non-DHP CCB, digoxin/amiodarone) work by slowing this gate, not the atria.\n- Loss of atrial systole removes the \"atrial kick\" (~20% of LV filling), and RVR shortens diastolic\n  filling time — both drop stroke volume, worse in a stiff/non-compliant LV — why rate control alone can\n  restore hemodynamics even without cardioversion.\n- Loss of organized atrial contraction → blood stasis, especially in the LAA → thrombus formation → why\n  stroke risk (CHA₂DS₂-VASc) and anticoagulation are independent of rate/rhythm control strategy.\n\n## Diagnosis / definition\n- [ ] **AF/flutter with RVR** = AF or atrial flutter with ventricular rate **>100 bpm** *(verify local\n  threshold)* — confirm rhythm on 12-lead ECG, not telemetry strip alone\n- [ ] **2023 staging framework** replaces duration-only classification: **Stage 1** at risk (risk\n  factors, no AF) · **Stage 2** pre-AF (structural/electrical substrate, no documented AF) ·\n  **Stage 3A** paroxysmal (episodes ≤7 days, self-terminating) · **Stage 3B** persistent (continuous\n  **>7 days**, requires intervention to terminate) · **Stage 3C** long-standing persistent\n  (continuous **>12 months**) · **Stage 3D** post-ablation/surgical AF-free · **Stage 4** permanent\n  (no further rhythm-control attempts pursued, by joint patient/clinician decision) *(verify)*\n- [ ] Distinguish **primary/established AF** from **new-onset AF secondary to critical illness** (sepsis,\n  post-op, acute PE, etc.) — different risk/anticoagulation calculus, see below\n- [ ] **Pre-excited AF (WPW)**: irregular, rapid (often **>200–250 bpm**), wide-and-variable QRS\n  morphology — a distinct diagnostic and management pathway *(verify rate cutoff)*\n\n## Key labs & workup\n- [ ] **12-lead ECG** — confirm AF/flutter vs. other irregular/rapid rhythm, screen for pre-excitation,\n  ischemia, prior infarct\n- [ ] **Electrolytes (K⁺, Mg²⁺)**, **TSH**, **troponin**, **BNP/NT-proBNP if HF suspected** — screen for\n  reversible precipitants and concurrent decompensation\n- [ ] **CBC, renal function** — sepsis/hypovolemia workup, renal-dose anticoagulant dosing\n- [ ] Consider **CXR, D-dimer/CTPA, blood/urine cultures, lactate** as directed by suspected precipitant\n  (infection, PE, hypovolemia)\n- [ ] **CHA2DS2-VASc** (or validated alternative — ATRIA, GARFIELD-AF) for stroke-risk stratification;\n  **HAS-BLED** or equivalent for bleeding-risk factor modification, not exclusion from anticoagulation\n- [ ] **Echocardiogram** — structural heart disease, EF, LA size — informs both acute rate-control agent\n  choice and longer-term rhythm-control candidacy\n\n## Management\n\n## Immediate assessment — hemodynamic stability first\n- [ ] Confirm rhythm on 12-lead ECG; look specifically for **pre-excitation (WPW)** — irregular, very rapid, wide-complex pattern changes management below\n- [ ] Screen for instability **attributable to the arrhythmia**: hypotension, altered mentation, ischemic pain, acute pulmonary edema/shock\n- [ ] **Unstable → immediate synchronized electrical cardioversion** *(COR 1)* — confirm shock is sync'd to QRS (avoid inducing VF); biphasic **≥200 J** initial energy reasonable for elective shocks *(verify)*\n- [ ] Continuous telemetry throughout acute management and cardioversion\n\n## Identify & treat the reversible precipitant\n- [ ] Screen for and treat trigger in parallel with rate/rhythm control: sepsis/infection, hypovolemia, hypoxia, electrolyte derangement (K⁺/Mg²⁺), thyrotoxicosis, PE, post-op state, alcohol/withdrawal, ACS\n- [ ] New AF discovered during **critical illness/sepsis** is common (~6–22% in severe sepsis) — treat as *acute/secondary AF*, distinct from established chronic AF, with high risk of recurrence and increased mortality\n- [ ] Correcting the precipitant and optimizing hemodynamics is part of the acute bundle, not a deferred step\n\n## Acute rate control (hemodynamically stable) / rhythm control\n- [ ] First-line: **beta-blocker OR non-dihydropyridine CCB** (diltiazem/verapamil) — restrict non-DHP CCB to **EF >40%** *(verify)*\n- [ ] **Harm — avoid non-DHP CCBs** in known moderate/severe LV systolic dysfunction, with or without decompensated HF\n- [ ] If beta-blocker/non-DHP CCB ineffective or contraindicated: **digoxin**, alone or in combination\n- [ ] **IV magnesium** as an adjunct to standard agents is reasonable to help achieve/maintain rate control\n- [ ] Critically ill and/or decompensated HF, with first-line agents ineffective/contraindicated: **IV amiodarone** may be considered *(weigh cardioversion/stroke risk if AF duration uncertain — verify dose)*\n- [ ] **Pre-excited AF (WPW) — contraindicated: AV-nodal blockers** (verapamil, diltiazem, amiodarone, digoxin, adenosine, beta-blockers) — risk of accelerated pathway conduction → VF. Unstable → electrical cardioversion; stable → IV ibutilide or procainamide; arrange accessory-pathway ablation\n- [ ] Rhythm-control alternative: electrical (or pharmacologic) cardioversion is reasonable as an initial strategy in stable patients too, e.g. if AV-dyssynchrony poorly tolerated or rate control inadequate — not reserved only for instability\n\n## Anticoagulation decision & follow-up planning\n- [ ] Assess stroke risk (**CHA2DS2-VASc**) and bleeding-risk factors — bleeding-risk scores (HAS-BLED etc.) guide risk-factor modification, **not** exclusion from anticoagulation\n- [ ] AF duration **≥48 h or unknown** → **≥3 weeks uninterrupted anticoagulation OR imaging (TEE/cardiac CT) to exclude LA/LAA thrombus** before elective cardioversion; continue anticoagulation **≥4 weeks post-cardioversion** regardless of rhythm outcome\n- [ ] AF duration **<48 h**: precardioversion imaging reasonable if CHA2DS2-VASc ≥2 (or equivalent); if low risk (0–1) and <12 h, benefit of imaging/pericardioversion anticoagulation is uncertain\n- [ ] **New-onset AF secondary to critical illness/sepsis**: benefit of anticoagulation *during* the acute illness for stroke prevention is **uncertain** *(COR 2b)* — CHA2DS2-VASc performs poorly in this population and anticoagulation has been associated with more bleeding without measured stroke reduction; individualize\n- [ ] Document plan for **outpatient rhythm/thromboembolic-risk reassessment and OAC decision** at discharge — recurrence after an acute precipitant is common (reported up to ~68% at 5 y), and recurrent AF carries elevated HF/stroke/mortality risk even after apparent resolution\n\n## Pearls & pitfalls\n- [ ] **Fibrillatory waves can mimic P waves** — a source of misdiagnosis on a busy strip; likewise\n  aberrantly-conducted (Ashman) beats in AF can be mistaken for ventricular ectopy (LITFL)\n- [ ] **Slow ventricular response in AF is not always reassuring** — consider digoxin toxicity, other\n  AV-nodal-blocking medications, or hypothermia rather than assuming benign spontaneous rate control (LITFL)\n- [ ] **A brief paroxysm still carries stroke risk** — AF episodes lasting **>48 h are unlikely to\n  spontaneously revert**, and anticoagulation should still be actively considered even for\n  self-terminating episodes, not just sustained AF (LITFL)\n- [ ] In the **hemodynamically crashing AF/RVR patient**, consider bridging blood pressure first (e.g.\n  push-dose phenylephrine) before attempting pharmacologic rate control — a hypotensive, tachycardic\n  patient may tolerate rate-control drugs poorly until perfusion pressure is restored (EMCrit)\n- [ ] **Dilute/slow IV diltiazem infusion** (rather than rapid push) achieves rate control with less\n  hypotension in the unstable patient *(verify local dosing/rate)* (EMCrit)\n- [ ] For **elective/attempted cardioversion of chronic or longstanding AF**, a first shock at or near\n  maximum device energy is reasonable — lower energies frequently fail without added safety benefit\n  *(verify — institution/device-specific)* (EMCrit)\n- [ ] **New AF in critical illness/sepsis is its own entity** — most of the AF evidence base is drawn\n  from chronic outpatient or post-cardiac-surgery populations and does not extrapolate cleanly to the\n  acutely septic/critically ill patient; expect more clinical judgment, less protocol (EMCrit IBCC)\n\n## Commonly-missed on documentation (what the gap-check flags)\nPrecipitant identified/treated? · hemodynamic instability explicitly assessed (not just rate)? · WPW/pre-excitation excluded on ECG before choosing an AV-nodal blocker? ·\nrate-control agent choice justified against EF/HF status? · CHA2DS2-VASc + bleeding risk documented? · anticoagulation plan (pre/post-cardioversion timing, or deferred-in-critical-illness rationale) stated? · outpatient follow-up/OAC-decision plan arranged?\n\n*Sources: [2023 ACC/AHA/ACCP/HRS Guideline for the Diagnosis and Management of Atrial Fibrillation — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001193) · [2023 Guideline for Diagnosis and Management of Atrial Fibrillation: Key Perspectives — ACC](https://www.acc.org/latest-in-cardiology/ten-points-to-remember/2023/11/27/19/46/2023-acc-guideline-for-af-gl-af) · [LITFL — Atrial Fibrillation (ECG Library)](https://litfl.com/atrial-fibrillation-ecg-library/) · [EMCrit 20 — The Crashing Atrial Fibrillation Patient](https://emcrit.org/emcrit/crashing-a-fib/) · [EMCrit IBCC — Atrial fibrillation in critical illness](https://emcrit.org/pulmcrit/af/)*\n"}, {"file": "ahrf-hfnc-niv-ers-ats-2017.md", "title": "Acute hypoxemic respiratory failure — general approach + HFNC/NIV", "system": "Respiratory", "body": "# Acute hypoxemic respiratory failure — general approach + HFNC/NIV — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Official ERS/ATS Clinical Practice Guidelines: Noninvasive Ventilation for Acute Respiratory\n> Failure (Rochwerg B et al.), *European Respiratory Journal* 2017; **plus** ERS Clinical Practice\n> Guidelines: High-Flow Nasal Cannula in Acute Respiratory Failure (Oczkowski S et al.), *European\n> Respiratory Journal* 2022.\n> https://www.thoracic.org/statements/guideline-implementation-tools/non-invasive-ventilation-for-acute-resp-failure.php\n> · https://pubmed.ncbi.nlm.nih.gov/34649974/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2017 (NIV) / 2022 (HFNC)\n\n## Why — physiology / first principles\n- Type 1 (hypoxemic) failure = V/Q mismatch, shunt, or diffusion limitation; Type 2 (hypercapnic) = alveolar\n  hypoventilation relative to CO₂ production, from load exceeding respiratory-pump capacity.\n- **HFNC**: high flow washes out nasopharyngeal dead space and matches/exceeds peak inspiratory flow demand,\n  reducing entrained room air (stable FiO₂) and work of breathing; generates modest, flow-dependent PEEP.\n- **NIV/CPAP**: applied PEEP recruits collapsed alveoli, raises FRC/compliance, and reduces shunt; pressure\n  support directly offloads inspiratory muscles, lowering work of breathing. In cardiogenic pulmonary edema,\n  positive intrathoracic pressure also reduces preload and LV afterload.\n- Early support aims to correct the physiologic derangement before muscle fatigue/failure supervenes; failure\n  to reverse the trigger (or a rising respiratory rate/muscle fatigue signature) is why escalation criteria\n  exist rather than trialing NIV/HFNC indefinitely.\n\n## Diagnosis / definition\n- [ ] **Acute respiratory failure** defined by gas exchange: **hypoxemic** (Type 1) = PaO₂ <60 mmHg\n  on room air (or PaO₂/FiO₂ <300) with normal/low PaCO₂; **hypercapnic** (Type 2) = PaCO₂ >45–50 mmHg\n  with respiratory acidosis (pH <7.35) *(verify exact cutoffs — ERS/ATS definitional framework)*\n- [ ] Classify **hypoxemic vs hypercapnic** failure and identify the driving cause — determines which\n  modality is favored\n- [ ] **HFNC over conventional oxygen** in de novo hypoxemic ARF *(strong rec, moderate certainty)*\n- [ ] **NIV first-line** for: **COPD exacerbation with respiratory acidosis**, **cardiogenic pulmonary\n  edema**, and **immunocompromised patients with hypoxemic ARF** *(strong recs per guideline)*\n- [ ] **NIV over HFNC** in patients at **high risk of extubation failure** unless NIV contraindicated\n\n## Key labs & workup\n- [ ] **ABG**: PaO₂, PaCO₂, pH, HCO₃⁻ — establishes hypoxemic vs hypercapnic pattern and acuity\n  (acidosis suggests acute-on-chronic process) *(verify — VBG may substitute for pH/PaCO₂ trending if\n  oxygenation assessed by SpO₂/co-oximetry)*\n- [ ] **ROX index** (SpO₂/FiO₂ ÷ respiratory rate) calculated at defined intervals on HFNC to help predict\n  failure risk *(cutoff — verify against current evidence/local protocol; not validated as a\n  stand-alone decision rule)*\n- [ ] **Chest X-ray** (± bedside ultrasound) to identify/confirm the underlying etiology (pneumonia,\n  pulmonary edema, effusion, pneumothorax)\n- [ ] **Bedside echocardiography** considered if a cardiogenic component (pulmonary edema, RV failure)\n  is suspected *(verify local availability/expertise)*\n\n## Management\n\n### Contraindication / suitability screen (before HFNC or NIV)\n- [ ] Airway protection intact — no impending arrest, uncontrolled vomiting, or inability to protect airway\n  *(verify local exclusion list)*\n- [ ] Hemodynamic stability adequate to trial noninvasive support\n- [ ] No facial trauma/surgery precluding mask interface (for NIV)\n- [ ] Clear plan for **immediate escalation to intubation** if trial fails — never a substitute for\n  necessary invasive ventilation\n\n### HFNC use\n- [ ] Flow and FiO₂ titrated to target SpO₂ *(verify device-specific protocol and target)*\n- [ ] Preferred over NIV in de novo hypoxemic ARF without significant hypercapnia\n- [ ] Reassess at a **defined interval** (e.g., 1–2 h) using an objective index (e.g., ROX index) *(verify\n  threshold — do not let a \"trial\" become an undocumented delay to intubation)*\n\n### NIV use\n- [ ] Interface and settings selected per etiology *(verify IPAP/EPAP or pressure-support/PEEP settings)*\n- [ ] **Postextubation prophylactic NIV** for high-risk patients (e.g., COPD, CHF, hypercapnia, obesity)\n  immediately after planned extubation *(strong rec — reduces reintubation)*\n- [ ] Monitor closely for signs of failure (worsening gas exchange, mental status, hemodynamics,\n  asynchrony) with a pre-set time-boxed reassessment\n\n### Escalation / failure criteria\n- [ ] Explicit, documented **failure criteria** and **time-to-reassess** set at initiation — not open-ended\n  *(verify local thresholds)*\n- [ ] Do not delay intubation in a deteriorating patient awaiting \"one more trial\"\n\n## Pearls & pitfalls\n- Favor **clinical trajectory over a single ABG/VBG value** when deciding whether NIV/HFNC is working —\n  oxygenation, work of breathing, and mentation trending in the right direction matter more than one gas;\n  don't wait on a repeat gas to escalate a visibly deteriorating patient *(EMCrit IBCC — Noninvasive\n  Respiratory Support)*\n- Titrate **BiPAP settings to the underlying diagnosis**, not a fixed default: prioritize higher EPAP for\n  cardiogenic pulmonary edema, balance driving pressure against auto-PEEP in COPD/asthma, and maximize\n  driving pressure in neuromuscular weakness *(EMCrit IBCC — Noninvasive Respiratory Support; example\n  pressure progressions given — `(verify)` against local protocol before use)*\n- Pitfall: reaching for BiPAP in a patient whose respiratory failure is from **drug intoxication or primary\n  CNS depression** — treat the underlying cause (antidote, reversal) rather than masking it with\n  noninvasive support *(EMCrit IBCC — Noninvasive Respiratory Support)*\n- If sedation is needed for NIV/mask tolerance, **avoid benzodiazepines** — one cited RCT showed midazolam\n  increased intubation risk; dexmedetomidine or low-dose IV droperidol/haloperidol are preferred, weighed\n  against respiratory drive and hemodynamics *(EMCrit IBCC — Noninvasive Respiratory Support; `(verify)`\n  current evidence and local sedation protocol)*\n- Consider a **helmet interface** over oronasal mask when available/tolerated — associated in one cited\n  RCT with lower intubation rates, and offers better communication, lower aspiration risk, and less\n  facial skin breakdown *(EMCrit IBCC — Noninvasive Respiratory Support; `(verify)` local device\n  availability/expertise)*\n- On HFNC, a practical de-escalation cue some clinicians use is tolerance of **~20 L/min at ~50% FiO₂**\n  before stepping down to standard nasal cannula *(EMCrit IBCC — Noninvasive Respiratory Support;\n  `(verify)` — not a validated cutoff, use clinical judgment)*\n- Pitfall: treating a noninvasive trial as open-ended — set the reassessment interval and failure\n  threshold *before* starting, so \"one more hour\" doesn't become the reason intubation is delayed in a\n  deteriorating patient (see Escalation/failure criteria above)\n\n## Commonly-missed on documentation (what the gap-check flags)\nEtiology (hypoxemic vs hypercapnic) documented to justify modality choice? · contraindications actively\nscreened, not assumed? · reassessment time and objective failure threshold specified? · escalation plan\ndocumented before starting HFNC/NIV? · prophylactic postextubation NIV considered for high-risk patients?\n\n*Sources: [ERS/ATS 2017 NIV for Acute Respiratory Failure — implementation tools, thoracic.org](https://www.thoracic.org/statements/guideline-implementation-tools/non-invasive-ventilation-for-acute-resp-failure.php) · [ERS 2022 HFNC in Acute Respiratory Failure — PubMed](https://pubmed.ncbi.nlm.nih.gov/34649974/) · [Guideline-based management of acute respiratory failure and ARDS — PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9998250/) · Pearls: [EMCrit IBCC — Noninvasive Respiratory Support](https://emcrit.org/ibcc/support/)*\n"}, {"file": "aki-kdigo-2012.md", "title": "Acute kidney injury (incl. RRT indications)", "system": "Renal / Metabolic / Endo", "body": "# Acute kidney injury (incl. RRT indications) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** KDIGO Clinical Practice Guideline for Acute Kidney Injury, Kidney Disease: Improving\n> Global Outcomes (KDIGO), 2012 — *Kidney International Supplements* 2(1).\n> https://kdigo.org/guidelines/acute-kidney-injury/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2012 (a KDIGO 2026 AKI/AKD update is in public\n> review as of this compilation — recheck kdigo.org for the finalized replacement)\n\n## Why — physiology / first principles\n- AKI = abrupt fall in GFR from **prerenal** (true or effective volume depletion → reduced renal perfusion, initially reversible via compensatory afferent arteriolar dilation and efferent constriction that preserve glomerular filtration pressure), **intrinsic** (sustained ischemia or nephrotoxin injury causing tubular cell injury/ATN, or other structural renal insult), or **postrenal** (obstruction → back-pressure transmitted to the glomerulus) causes.\n- Prerenal physiology explains why NSAIDs (block afferent dilation) and ACEi/ARBs (block efferent constriction) precipitate AKI specifically in volume-depleted or renally-marginal states — they remove the compensatory mechanism that was maintaining filtration.\n- Prolonged prerenal insult exhausts that compensation and progresses to ATN — the same clinical trajectory (rising creatinine, falling urine output) reflects a transition from a functional to a structural problem.\n- Staging by creatinine/urine output measures functional loss, not the underlying lesion — the same stage can reflect very different mechanisms and prognoses, which is why cause must still be worked out alongside the stage.\n\n## Diagnosis / definition & staging (document the stage — drives escalation)\n- [ ] **AKI defined** by any one of: creatinine rise **≥0.3 mg/dL (26.5 µmol/L) within 48 h**, creatinine\n  **≥1.5× baseline** known/presumed within the prior 7 days, or urine output **<0.5 mL/kg/h for 6 h** *(verify)*\n- [ ] **Stage 1** — creatinine **1.5–1.9× baseline** or **≥0.3 mg/dL (26.5 µmol/L) rise** *(verify local unit)*, OR urine output **<0.5 mL/kg/h × 6–12 h**\n- [ ] **Stage 2** — creatinine **2.0–2.9× baseline**, OR urine output **<0.5 mL/kg/h × ≥12 h**\n- [ ] **Stage 3** — creatinine **3.0× baseline** or rise to **≥4.0 mg/dL**, or **RRT initiated**, OR urine output **<0.3 mL/kg/h × ≥24 h** or **anuria ×≥12 h**\n- [ ] Baseline creatinine established/estimated (do not stage against an unknown baseline without noting the assumption)\n- [ ] Pre-renal / intrinsic-renal / post-renal category assigned — post-void residual or bladder scan checked in every AKI to exclude obstruction *(verify — post-renal is easily missed if not specifically sought)*\n\n## Key labs & workup\n- [ ] Serum creatinine + urine output trended (both required to stage correctly — either alone can understage)\n- [ ] Electrolytes: **K+, phosphate, bicarbonate**, acid-base status\n- [ ] Urinalysis + urine microscopy (muddy brown casts, cellular casts, hematuria/proteinuria pattern) to help\n  distinguish ATN vs glomerular/intrinsic causes *(verify utility in individual case)*\n- [ ] **FeNa/FeUrea** — of limited value once diuretics given, and does **not** reliably distinguish\n  pre-renal from ATN in many ICU contexts; interpret cautiously rather than as a rule-out test *(verify —\n  reflects an evolving view, not an absolute)*\n- [ ] Renal ultrasound if obstruction, unclear etiology, or no improvement as expected\n- [ ] Consider nephritic-picture screen (complement, ANCA, anti-GBM, etc.) if hematuria/proteinuria/hypertension\n  suggest glomerular disease rather than typical pre-renal/ATN pattern *(verify — case-specific)*\n- [ ] Medication levels/nephrotoxin exposure reviewed as part of the diagnostic workup, not only treatment\n\n## Management\n\n### Initial workup & prevention\n- [ ] Identify and treat pre-, intra-, post-renal cause; review med list for nephrotoxins (NSAIDs, aminoglycosides, contrast, ACEi/ARB — hold as appropriate)\n- [ ] Volume status assessed; **isotonic crystalloids preferred over colloids** for resuscitation *(1B — verify)*\n- [ ] **Avoid diuretics to prevent AKI** *(1B)*; use only for volume-overload management, not to \"treat\" AKI *(2C)*\n- [ ] Vasopressors added alongside fluids for vasomotor/septic shock *(1C — target MAP per local protocol, verify)*\n- [ ] Nephrotoxic drug dosing adjusted to renal function; aminoglycosides once-daily dosing preferred with levels if course >24 h *(verify)*\n- [ ] Contrast-associated AKI prevention considered where relevant (IV isotonic fluids periprocedure — dose/regimen *(verify)*; avoid N-acetylcysteine for post-surgical prophylaxis per guideline)\n\n### Monitoring & metabolic management\n- [ ] Daily creatinine, urine output, fluid balance trended and documented\n- [ ] Electrolytes (K+, phosphate, bicarbonate) and acid-base monitored — treat hyperkalemia per separate protocol\n- [ ] Nutrition plan — avoid unnecessary protein/fluid restriction unless RRT unavailable *(verify per local dietitian input)*\n- [ ] Bladder outlet obstruction excluded if oliguric/anuric\n\n### RRT — indications & modality (document the indication explicitly)\n- [ ] **Emergent indications** (any one): refractory hyperkalemia, severe metabolic acidosis, refractory volume overload (e.g. pulmonary edema unresponsive to diuretics), uremic complications (pericarditis, encephalopathy, uremic bleeding), certain intoxications *(specific thresholds — verify against local nephrology protocol; KDIGO does not fix a single creatinine/BUN cutoff)*\n- [ ] Decision to start RRT considers the **full clinical context and trend**, not laboratory values in isolation *(verify)*\n- [ ] Modality selected: CRRT vs intermittent HD vs hybrid — **CRRT suggested over intermittent RRT** for hemodynamically unstable patients and those with acute brain injury/raised ICP/cerebral edema *(2B — verify)*\n- [ ] CRRT effluent (dialysis) dose target **20–25 mL/kg/h delivered** *(1A — verify prescribed vs delivered dose)*\n- [ ] Intermittent/extended RRT dose target **Kt/V ≈3.9/week** *(1A — verify)*\n- [ ] **Bicarbonate-based (not lactate-based) dialysate/replacement fluid** if liver failure and/or lactic acidemia *(2B)*\n- [ ] Anticoagulation strategy for circuit chosen (citrate vs heparin vs none) and documented\n- [ ] Vascular access sited appropriately; line-associated complications monitored\n\n## Pearls & pitfalls\n- **Timing of RRT initiation** — per the AKIKI trial, early RRT (started within ~6 h of meeting stage-3\n  criteria) did **not** improve mortality versus waiting for a standard clinical/laboratory trigger; a\n  \"watchful waiting\" approach in the absence of an emergent indication is reasonable *(verify against local\n  nephrology practice — EMCrit/IBCC, Acute Kidney Injury chapter)*\n- **Don't reflexively blame stones** — unless the patient has a solitary kidney or bilateral obstruction,\n  nephrolithiasis essentially never causes clinically significant AKI on its own; keep looking for the real\n  cause *(EMCrit/IBCC — Acute Kidney Injury)*\n- **FeNa is oversold** — it's invalidated by prior diuretic use and doesn't reliably separate pre-renal\n  azotemia from early ATN in critically ill patients; don't let a \"pre-renal\" FeNa delay reassessment if the\n  patient isn't improving with fluids *(EMCrit/IBCC — Acute Kidney Injury)*\n- **Check the post-void residual/bladder scan in every AKI** — post-renal obstruction is a fully reversible\n  cause that's easy to skip when a septic/hypotensive picture seems to \"explain\" the AKI already *(EMCrit/IBCC\n  — Acute Kidney Injury)*\n- A **nephritic picture** (acute creatinine rise + hypertension + hematuria + proteinuria with no obvious\n  pre-/post-renal explanation) should trigger a glomerular-disease workup rather than being labeled\n  generic \"AKI\" *(EMCrit/IBCC — Acute Kidney Injury)*\n- Loop diuretics can be useful to **manage** volume overload once AKI is established but have never been shown\n  to prevent AKI, hasten renal recovery, or reduce RRT need — resist using them as a reflex \"renal-protective\"\n  measure *(KDIGO guideline itself, reinforced by EMCrit/IBCC teaching)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nAKI stage documented with baseline stated? · nephrotoxin review done? · fluid strategy (isotonic, no prophylactic diuretics)? ·\nRRT indication explicitly named (not just \"worsening labs\")? · modality + dose (effluent rate / Kt/V) specified? ·\nelectrolytes trended? · nephrology consulted for stage 2–3?\n\n*Sources: [KDIGO Clinical Practice Guideline for Acute Kidney Injury (2012)](https://kdigo.org/guidelines/acute-kidney-injury/) · [Diagnosis, evaluation, and management of acute kidney injury: a KDIGO summary (Part 1) — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC4057151/) · [KDIGO 2026 AKI/AKD Guideline — Public Review Draft](https://kdigo.org/wp-content/uploads/2026/03/KDIGO-2026-AKI-AKD-Guideline-Public-Review-Draft-March-2026.pdf) · [IBCC chapter & cast: Acute Kidney Injury — EMCrit/PulmCrit](https://emcrit.org/pulmcrit/acute-kidney-injury/) · [Acute Kidney Injury — EMCrit IBCC](https://emcrit.org/ibcc/aki/)*\n"}, {"file": "alcohol-withdrawal-asam-2020.md", "title": "Alcohol withdrawal (severe / DTs)", "system": "Other", "body": "# Alcohol withdrawal (severe / DTs) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** The ASAM Clinical Practice Guideline on Alcohol Withdrawal Management (American Society of\n> Addiction Medicine), *Journal of Addiction Medicine* 2020;14(3S Suppl 1):1–72.\n> https://www.asam.org/quality-care/clinical-guidelines/alcohol-withdrawal-management-guideline\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2020 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Chronic alcohol potentiates inhibitory GABA-A signaling and suppresses excitatory NMDA-glutamate signaling — chronic exposure drives neuroadaptation: GABA-A receptors downregulate, NMDA receptors upregulate, to maintain homeostasis under continuous alcohol exposure.\n- Abrupt cessation removes alcohol's GABA-ergic/NMDA-suppressive effect from an already-adapted (reduced-GABA, excess-NMDA) brain → net **unopposed CNS hyperexcitability**.\n- This drives the staged clinical progression: autonomic hyperactivity/tremor → hallucinations → withdrawal seizures → delirium tremens, as excitatory tone escalates unchecked.\n- Why benzodiazepines are the mainstay: they are cross-tolerant GABA-A agonists that directly replace the lost inhibitory tone, addressing the actual receptor-level deficit.\n- Why symptom-triggered (CIWA-guided) dosing: titrates medication to the individual's real-time degree of receptor mismatch rather than a fixed schedule.\n\n## Diagnosis / definition\n- [ ] **Identify risk factors for severe/complicated withdrawal** — prior DTs/seizures, heavy/prolonged use, concurrent illness, older age\n- [ ] Use a **validated severity scale (CIWA-Ar or equivalent)** to guide symptom-triggered dosing — *verify unit's tool of choice*; approximate score bands: **mild ~8–10**, **moderate ~10–15**, **severe >15**, with escalating seizure/DT risk at higher scores *(verify exact bands — vary by source/institution)*\n- [ ] Recognize **staged progression** — tremulousness/anxiety → hallucinations → withdrawal seizures → delirium tremens, classically evolving over the first **~48 hours** from last drink *(verify timeline per patient)*\n- [ ] **Screen for and treat concurrent conditions** masking or mimicking withdrawal (infection, GI bleed, hepatic encephalopathy, head injury, other substance co-ingestion)\n\n## Key labs & workup\n- [ ] **Electrolytes** — Na, K, **Mg, PO4** (commonly depleted in chronic alcohol use, worsen seizure/arrhythmia risk)\n- [ ] **Glucose** — screen and correct; give **thiamine before/with glucose** (see Management)\n- [ ] **LFTs/GGT** — chronic-use marker; assess hepatic synthetic function (INR, albumin) if cirrhosis suspected\n- [ ] **Blood alcohol level** — correlate with symptom timing/severity (withdrawal can begin while level is still detectable, especially in heavy chronic users)\n- [ ] **Urine toxicology screen** for co-ingestants that may alter presentation or management\n- [ ] **ECG** — baseline, and **QTc** surveillance if using agents that prolong it (e.g. certain antipsychotics, methadone)\n\n## Management\n\n### Immediate management\n- [ ] **Thiamine before/with any glucose** administration — <verify dose/route, e.g. 200–500 mg IV — prevent precipitating Wernicke's>\n- [ ] **Benzodiazepines are first-line** — symptom-triggered (CIWA-guided) dosing preferred over fixed schedule where feasible — <agent/dose — verify local protocol>\n- [ ] **Escalate dosing aggressively** for severe withdrawal/DTs — front-load rather than under-dose\n- [ ] **Correct electrolyte abnormalities** (Mg, K, PO4) — common in withdrawal and worsen seizure/arrhythmia risk\n\n### Refractory / severe withdrawal (DTs, benzodiazepine-resistant)\n- [ ] Consider **phenobarbital** as an adjunct or alternative strategy in benzodiazepine-refractory withdrawal — *verify dosing/protocol*\n- [ ] Consider **adjunctive alpha-2 agonists (dexmedetomidine/clonidine)** for autonomic symptoms — **not as monotherapy** for seizure/DT prevention\n- [ ] Consider **propofol infusion + intubation** for truly refractory DTs unresponsive to escalating benzodiazepine/phenobarbital dosing\n- [ ] Avoid **antipsychotics as sole agent** — do not lower seizure threshold as primary/only therapy\n\n### Ongoing ICU management\n- [ ] **Continuous reassessment** of withdrawal severity and sedation depth — avoid oversedation/respiratory depression\n- [ ] **Seizure precautions**; treat seizures per protocol and reassess adequacy of withdrawal regimen\n- [ ] **Nutrition** — assess for malnutrition, ongoing thiamine/folate/multivitamin repletion\n- [ ] **Plan for taper and transition** — de-escalation plan once symptoms controlled; addiction medicine / social work referral before discharge\n\n## Pearls & pitfalls\n- [ ] **CIWA-Ar is effort-intensive and confounded** by non-withdrawal physiologic variables (e.g. tachycardia from atrial fibrillation) and is hard to apply in nonverbal/intubated patients — **RASS-based titration** has been proposed as more reproducible for phenobarbital dosing in critically ill patients — EMCrit/IBCC *(verify local tool choice)*\n- [ ] **Phenobarbital loading**: a single **10 mg/kg IV** load has been described as safe and associated with reduced ICU admission, given up front rather than only after symptom escalation; **20 mg/kg** cumulative is a \"soft stop\" (reassess diagnosis), **30 mg/kg** a \"hard stop\" ceiling (~40 µg/mL, upper therapeutic epilepsy range) — EMCrit/IBCC *(verify local protocol/dosing weight basis)*\n- [ ] **Why phenobarbital works when benzodiazepines don't**: benzodiazepines require endogenous presynaptic GABA release, while barbiturates directly open GABA-A receptors and also dampen glutamate excess — a proposed mechanism for benzodiazepine-refractory response — EMCrit/IBCC *(verify)*\n- [ ] **Dexmedetomidine pitfall**: lacks anticonvulsant activity — it can mask the autonomic signs used to judge withdrawal severity without protecting against seizures or progression to DTs; reserve as an adjunct (e.g. nocturnal agitation control) rather than primary therapy — EMCrit/IBCC\n- [ ] **Staged symptom progression** (tremor → hallucinations → seizures → DTs) classically unfolds over the first ~48 h from last drink — helps anticipate trajectory rather than just reacting to the current CIWA score — LITFL *(verify timeline per patient)*\n- [ ] **Beta-blockers are not first-line** for autonomic symptoms and are generally avoided routinely (can mask worsening tachycardia as a withdrawal severity marker) — reserve for selected cases only — LITFL\n- [ ] **Environment matters**: quiet room, frequent reorientation, and reassurance are foundational supportive measures, not an afterthought to pharmacotherapy — LITFL\n\n## Commonly-missed on documentation (what the gap-check flags)\nThiamine given before/with glucose? · CIWA-Ar (or equivalent) scoring documented? · symptom-triggered vs fixed dosing rationale stated? ·\nelectrolytes (Mg/K/PO4) corrected? · escalation plan for refractory DTs (phenobarbital/propofol) documented? ·\naddiction medicine/social work referral arranged?\n\n*Sources: [ASAM Clinical Practice Guideline on Alcohol Withdrawal Management (PubMed)](https://pubmed.ncbi.nlm.nih.gov/32511109/) · [Executive Summary — ASAM Guideline (PubMed)](https://pubmed.ncbi.nlm.nih.gov/32909985/) · FOAMed pearls: [EMCrit/IBCC — Alcohol Withdrawal & Alcohol Use Disorder](https://emcrit.org/ibcc/etoh/) · [LITFL — Alcohol Withdrawal](https://litfl.com/alcohol-withdrawal/)*\n"}, {"file": "anaphylaxis-aaaai-acaai-2023.md", "title": "Anaphylaxis", "system": "Other", "body": "# Anaphylaxis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Anaphylaxis: A 2023 Practice Parameter Update (Golden DBK, Wang J, Waserman S, Akin C, et\n> al., Joint Task Force on Practice Parameters: AAAAI/ACAAI/JCAAI), *Annals of Allergy, Asthma &\n> Immunology* 2023 (in press/2024).\n> https://www.annallergy.org/article/S1081-1206(23)01304-2/fulltext\n> **This 2023 update explicitly COMPLEMENTS, and does NOT replace, the 2020 GRADE guideline** (Anaphylaxis\n> — A 2020 Practice Parameter Update, Systematic Review, and GRADE Analysis) — the authors state it is\n> \"meant to update the selected topics ... does not entirely replace or supersede\" the 2020 document.\n> **This checklist therefore integrates both**: the 2020 GRADE guideline remains the base for immediate\n> management, refractory treatment, and disposition; the 2023 update adds/revises the 7 areas below\n> (diagnosis/tryptase, infants/toddlers, community settings, epinephrine autoinjectors, beta-blockers/ACEIs,\n> mast cell disorders, perioperative anaphylaxis) where new evidence has emerged since 2020.\n> **Compiled:** 06-Sep-2026 · Claude Code · base guideline 2020 GRADE + 2023 practice parameter update\n> (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Re-exposure to an allergen cross-links IgE on mast cells/basophils (or triggers direct non-IgE mast-cell activation) → rapid, massive degranulation releasing histamine, tryptase, leukotrienes, prostaglandins, and platelet-activating factor.\n- These mediators cause systemic vasodilation + dramatically increased vascular permeability (capillary leak) → distributive shock; concurrently, bronchoconstriction + mucosal edema + increased secretions → upper/lower airway obstruction.\n- Both the circulatory and respiratory threats arise from the same mediator cascade and can progress within minutes — hence the risk of biphasic or fatal reactions when treatment is delayed.\n- Why **epinephrine** is first-line and time-critical: **α1** reverses vasodilation/capillary leak, **β1** provides inotropy/chronotropy to support the failing circulation, and **β2** bronchodilates and blunts further mediator release — no other agent addresses all three mechanisms.\n- Antihistamines and corticosteroids are adjunctive only — they blunt histamine-mediated itch/urticaria and later-phase inflammation but do not reverse hemodynamic collapse or airway obstruction.\n\n## Diagnosis / definition\n- [ ] **Classic NIAID/FAAN 2006 criteria** — anaphylaxis is likely when **any one** of the following is met *(verify exact wording against source)*:\n  1. **Acute onset** (minutes–hours) with **skin/mucosal involvement** (hives, itch/flush, swollen lips-tongue-uvula) **plus** either **respiratory compromise** or **reduced BP/end-organ dysfunction**\n  2. **≥2** of the following occurring rapidly after exposure to a **likely allergen**: skin/mucosal involvement, respiratory compromise, reduced BP/associated symptoms, **persistent GI symptoms** (severe GI symptoms alone can qualify per current guidance)\n  3. **Reduced BP** after exposure to a **known allergen** for that patient (minutes–hours)\n- [ ] **2023 update**: notes ongoing **WAO/Brighton/Delphi harmonization work** toward a single, more universally accepted diagnostic definition — *verify current wording in local use*; the criteria above remain the operative diagnostic framework pending that harmonization\n- [ ] **This is a clinical diagnosis** — do not delay epinephrine to obtain confirmatory labs\n\n## Key labs & workup\n- [ ] **No routine labs are required to diagnose or treat anaphylaxis** — labs are adjunctive/retrospective-confirmatory, not part of the acute diagnostic pathway\n- [ ] **Serum total tryptase (bST)** — see \"Tryptase testing detail — 2023 update\" below for indications and interpretation; briefly: **acute (peri-event)** tryptase drawn within a defined post-onset window *(verify timing, e.g. ~15 min–3 h)*, plus a **baseline** tryptase after full resolution (**≥24 h** later or at a separate visit), interpreted **relative to the patient's own baseline**\n- [ ] Consider **cardiac monitoring/ECG** if cardiovascular involvement, particularly in patients with cardiac risk factors or receiving repeated epinephrine dosing\n\n## Management\n\n### Immediate management — epinephrine is first-line, do not delay for anything *(2020 GRADE base, unchanged)*\n- [ ] **Epinephrine IM, anterolateral thigh, immediately** — standard dosing **0.01 mg/kg**, up to **0.3 mg** for children/teens <30 kg (2023 update notes a **0.1 mg** dose option available for infants/toddlers **7.5–15 kg**), **0.5 mg max for ≥30 kg/adults** *(verify weight-based dose against device availability)* — **first-line, no absolute contraindication**\n- [ ] **Repeat epinephrine every 5–15 min** if inadequate response — *verify interval*\n- [ ] **Position supine (or per tolerance/respiratory status) with legs elevated** unless respiratory distress dictates otherwise; avoid sudden standing (empty ventricle syndrome risk)\n- [ ] **High-flow oxygen** and **IV access** established immediately\n- [ ] **IV crystalloid bolus** for hypotension/poor perfusion\n\n### Refractory anaphylaxis *(2020 GRADE base, unchanged)*\n- [ ] **Epinephrine infusion** if inadequate response to repeated IM doses — <dose/titration — verify local protocol>\n- [ ] **Glucagon** if patient on beta-blockers and refractory to epinephrine — <dose — verify>\n- [ ] **Vasopressor support** if shock persists despite epinephrine + fluids\n- [ ] **Bronchodilators (inhaled beta-agonist)** as adjunct for persistent bronchospasm — **not a substitute for epinephrine**\n\n### Adjunctive therapy (secondary — never delay epinephrine for these) *(2020 GRADE base, unchanged)*\n- [ ] **H1 antihistamine** for cutaneous symptom relief only — does not treat airway/hemodynamic compromise\n- [ ] **H2 antihistamine** — adjunctive, weak evidence\n- [ ] **Corticosteroids** — adjunctive, **not first-line and not proven to prevent biphasic reactions** — *verify institutional practice*\n\n### Tryptase testing detail — 2023 update\n- [ ] **Serum total tryptase (bST) measured** in patients presenting with **recurrent, idiopathic, or\n  severe anaphylaxis**, **Hymenoptera venom anaphylaxis**, or **suspected mastocytosis** — not a\n  routine test for every mild/first-episode presentation\n- [ ] **Hereditary alpha-tryptasemia (HaT) / clonal mast cell disease evaluation** considered if\n  baseline serum tryptase **>8 ng/mL** *(verify against local lab reference range/timing)*\n- [ ] **Acute (peri-event) tryptase** interpreted relative to the patient's own **baseline** — an acute\n  rise supports the diagnosis; a normal acute tryptase does **not** rule out anaphylaxis\n\n### Special populations — infants/toddlers and community settings — new in 2023\n- [ ] **Infant/toddler anaphylaxis**: age is **not correlated with reaction severity**; anaphylaxis is\n  **unlikely to be the first reaction on first allergen exposure**; use **NIAID/FAAN or WAO** age-appropriate\n  diagnostic criteria (no infant-specific criteria set exists) — signs may be non-specific/age-atypical\n- [ ] **Community-setting preparedness** (school, childcare, dining, travel) counseled — undesignated\n  epinephrine autoinjector stocking supported for childcare/schools; caregivers counseled on early\n  administration — **early epinephrine use reduces biphasic-reaction risk and hospitalization need**,\n  there is no evidence pre-emptive epinephrine in an asymptomatic patient prevents anaphylaxis\n\n### Beta-blockers / ACE inhibitors — updated guidance in 2023\n- [ ] **Do NOT reflexively stop beta-blockers/ACEIs** in patients at anaphylaxis risk — for most\n  indications the risk of stopping/changing the medication may **exceed** the risk of more severe\n  anaphylaxis if continued, especially for **insect-sting anaphylaxis on venom immunotherapy (VIT)**\n- [ ] **Shared decision-making** applied when balancing cardiac indication vs theoretical anaphylaxis-severity\n  risk — document the discussion rather than stopping/continuing by default\n\n### Mast cell disorders — new in 2023\n- [ ] **Suspected mastocytosis/clonal mast cell disease evaluated** in adults with **severe insect sting\n  anaphylaxis** (particularly with hypotension and/or absence of urticaria) or **recurrent idiopathic\n  anaphylaxis** — consider **REMA score** to guide bone marrow biopsy decision\n- [ ] Patients with mastocytosis **continue VIT indefinitely** if on it (higher systemic-reaction rate\n  but reduced frequency/severity of reactions vs no VIT)\n\n### Perioperative anaphylaxis (POA) — new in 2023\n- [ ] **Acute tryptase rise interpreted against baseline** — a value ≥120% of baseline bST + 2 ng/mL\n  supports systemic mast cell activation *(verify exact formula against source)*\n- [ ] **Skin testing (percutaneous/intradermal) and/or in-vitro specific-IgE testing** performed for all\n  potential pharmacologic/nonpharmacologic culprits used during the perioperative period, where available\n- [ ] **Repeat anesthesia** proceeds via **shared decision-making**, informed by testing/challenge results\n  when feasible; avoidance of culprit agents considered if testing/challenge not feasible\n\n### Observation & disposition *(2020 GRADE base, unchanged)*\n- [ ] **Individualize observation duration by severity/risk factors** — 2020 update moved away from a universal fixed period; consider risk factors: need for >1 epinephrine dose, delayed initial epinephrine, severe initial presentation\n- [ ] **Extended observation (up to 6 h or longer)** for higher biphasic-reaction risk; **~1 h** may suffice for a mild, fully-resolved reaction with no risk factors — *verify against source and local practice*\n- [ ] **Prescribe/ensure epinephrine auto-injector** and teach use before discharge\n- [ ] **Allergy follow-up referral** for trigger identification and testing\n- [ ] **Document trigger, timeline, and treatment response** clearly for future risk counseling\n\n## Pearls & pitfalls\n- [ ] **Wean epinephrine deliberately once resolving** — an easily overlooked pitfall is continuing IM/infusion epinephrine reflexively after clinical resolution, prolonging unnecessary exposure/ICU stay; actively step down once stable — EMCrit/IBCC\n- [ ] **Biphasic reactions occur in ~5% of cases, but clinically significant ones are probably <2%** *(verify)* — risk factors include a severe initial episode, delayed epinephrine, and prior biphasic history; manage a biphasic recurrence the same as the initial episode — EMCrit/IBCC\n- [ ] **True refractory anaphylaxis (ongoing despite appropriate epinephrine dosing) is rare (<0.5% of severe cases)** *(verify)* and is more often seen with drug-triggered anaphylaxis — consider methylene blue for vasodilatory-shock-pattern refractory cases in select centers — EMCrit/IBCC *(verify local availability/expertise)*\n- [ ] **Glucagon evidence is weak** — based on scattered case reports, carries a high emesis/aspiration risk without a secured airway, and its rationale (bypassing beta-1 blockade) matters mainly in truly epinephrine-refractory, beta-blocked patients — don't reach for it reflexively — EMCrit/IBCC\n- [ ] **Beta-blocked patients may need higher-than-usual epinephrine doses** or adjuncts (methylene blue, isoproterenol infusion) if the standard approach fails — reinforces why beta-blockers should not be reflexively stopped, but flags a harder-to-treat phenotype if anaphylaxis occurs — EMCrit/IBCC\n- [ ] **IM injection technique matters** — anterolateral thigh (vastus lateralis), not deltoid; needle length needs to be adequate to reach muscle, particularly in patients with more subcutaneous tissue, or the dose may end up subcutaneous with slower, less reliable absorption — general FOAMed teaching *(verify device/needle-length specifics)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nEpinephrine IM given first (not antihistamine/steroid first)? · time-to-first-epinephrine documented? ·\nrepeat dosing/infusion escalation documented if refractory? · glucagon considered if on beta-blocker? ·\nbeta-blocker/ACEI continued/stopped decision explicitly reasoned (not reflexive)? · tryptase drawn when\nindicated (recurrent/idiopathic/severe/venom/suspected mastocytosis)? · observation duration\nindividualized by risk factors (not just fixed default)? · auto-injector prescribed + allergy follow-up\narranged?\n\n*Sources: [Anaphylaxis: A 2023 Practice Parameter Update — Ann Allergy Asthma Immunol](https://www.annallergy.org/article/S1081-1206(23)01304-2/fulltext) · [Anaphylaxis: A 2023 practice parameter update — PubMed](https://pubmed.ncbi.nlm.nih.gov/38108678/) · [Anaphylaxis — A 2020 Practice Parameter Update, Systematic Review, and GRADE Analysis (AAAAI PDF)](https://www.aaaai.org/Aaaai/media/MediaLibrary/PDF%20Documents/Practice%20and%20Parameters/Anaphylaxis-2020-grade-document.pdf) · [A Clinical Practice Guideline for the Emergency Management of Anaphylaxis (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC8996305/) · FOAMed pearls: [EMCrit/IBCC — Anaphylaxis](https://emcrit.org/ibcc/anaphylaxis/)*\n"}, {"file": "aortic-dissection-accaha-2022.md", "title": "Acute aortic dissection", "system": "Cardiac", "body": "# Acute aortic dissection — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease (Isselbacher EM et al.,\n> ACC/AHA Joint Committee on Clinical Practice Guidelines), *Circulation* / *JACC* 2022.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001106\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022\n\n## Why — physiology / first principles\n- An intimal tear lets pulsatile aortic pressure dissect into the media, creating a false lumen — ongoing\n  propagation is driven by the **rate of rise of pressure (dP/dt)**, not mean arterial pressure alone.\n- This is why β-blockade is given **before/with** vasodilators: dropping HR and contractility lowers\n  dP/dt directly, whereas a vasodilator alone (reflex tachycardia) can raise dP/dt and worsen propagation.\n- Target is impulse control (HR ~60, SBP ~100-120mmHg) sufficient to perfuse end-organs while minimizing\n  shear stress on the dissection flap — not maximal BP lowering *(verify targets)*.\n- Type A (ascending) risks pericardial rupture/tamponade and coronary/valve involvement → surgical\n  emergency; Type B (descending) is usually managed medically unless malperfusion/rupture — the anatomy\n  determines urgency because ascending rupture is intrapericardial and rapidly fatal.\n\n## Diagnosis / definition\n- [ ] **Acute aortic syndrome (AAS)** = umbrella term for **classic dissection, intramural hematoma\n  (IMH), and penetrating atherosclerotic ulcer (PAU)** — all managed on the same urgent pathway\n  pending classification\n- [ ] Blood enters/tracks within the aortic media by one of three mechanisms: **de novo intimal tear**,\n  **atherosclerotic ulcer progressing to intimal disruption**, or **vasa vasorum rupture** (→ IMH\n  without a discrete intimal tear)\n- [ ] **Stanford classification**: **Type A** = any ascending aortic involvement (surgical emergency,\n  regardless of where the primary tear is) · **Type B** = descending only, distal to the left\n  subclavian — drives the entire management pathway\n- [ ] **DeBakey classification** (I/II/III) is a finer-grained extent descriptor — record alongside\n  Stanford type, does not replace it for triage decisions\n- [ ] **Pretest-probability/risk assessment** (e.g. history of connective tissue disease, family history,\n  known aneurysm, recent aortic instrumentation, pulse deficit, focal neuro deficit with pain, syncope\n  with pain, hypotension/shock, or a widened mediastinum) should be used to gauge urgency of imaging —\n  *(consider a structured aortic-dissection risk score to standardize this — verify local practice; not\n  every \"low-risk\" presentation excludes AAS)*\n- [ ] **~5% present without pain**, disproportionately older patients, diabetics, those with altered\n  consciousness, or recent cardiac surgery — absence of pain does not exclude AAS *(verify)*\n\n## Key labs & workup\n- [ ] **CT angiography chest/abdomen/pelvis** — diagnostic test of choice when the patient is stable\n  enough to transport; ECG-gated CTA improves accuracy at the aortic root\n- [ ] **D-dimer**: a normal value in a **low pretest-probability** patient has a high negative\n  predictive value and may help exclude dissection, but does **not** reliably exclude IMH or PAU —\n  image if suspicion persists *(verify local threshold and role — adjunct, not primary)*\n- [ ] **Type and crossmatch** — anticipate need for emergent transfusion/OR if Type A or complicated\n  Type B\n- [ ] **Troponin, ECG** — coronary malperfusion can mimic/coexist with MI; dissection extending into a\n  coronary ostium is a recognized STEMI mimic\n- [ ] **Creatinine/lactate** — baseline for renal and mesenteric malperfusion surveillance (trend, not\n  single value)\n- [ ] **Bedside TTE/POCUS** — pericardial effusion, aortic root dilation, intimal flap, AR — useful\n  rapid triage in the unstable patient who cannot leave the resuscitation area *(adjunct — verify local\n  credentialing/practice)*\n\n## Management\n\n## Rapid recognition\n- [ ] Suspect with **abrupt, severe chest/back/abdominal pain** (\"tearing\"/\"ripping\") — pain intensity peaks at onset (unlike ACS)\n- [ ] Check **pulse and BP in both arms** — pulse deficit or **>20 mmHg interarm SBP differential** raises suspicion\n- [ ] Auscultate for **new diastolic murmur of aortic regurgitation**\n- [ ] CXR may show **widened mediastinum** — normal CXR does NOT exclude AAS\n- [ ] Consider acute aortic syndrome (dissection / intramural hematoma / penetrating ulcer) in any undifferentiated shock, syncope, stroke, or MI-mimic with atypical features\n\n## Emergent imaging & classification\n- [ ] **CT angiography chest/abdomen/pelvis** — first-line if patient stable enough to transport\n- [ ] **TEE at bedside** if hemodynamically unstable / cannot leave resuscitation area\n- [ ] MRI generally avoided acutely (acquisition time, limited monitoring access)\n- [ ] Classify **Stanford A (ascending involved) vs Stanford B (descending only)** — drives the management pathway\n- [ ] Note DeBakey type, entry tear location, extent, and any periaortic/pericardial fluid\n\n## Immediate stabilization — anti-impulse therapy & pain control\n- [ ] **Arterial line** for continuous BP monitoring as soon as feasible (do not delay initial therapy to place)\n- [ ] **IV beta-blocker first** to control heart rate and reduce dP/dt/aortic wall stress — target HR **60–80 bpm** *(verify)*\n- [ ] **Add IV vasodilator** (e.g. nitroprusside/nicardipine) only after beta-blockade if BP remains elevated — target SBP **<120 mmHg or lowest tolerated preserving end-organ perfusion** *(verify)*\n- [ ] Do **not** start a vasodilator alone first (unopposed vasodilation → reflex tachycardia → increased wall stress)\n- [ ] **Adequate analgesia** (IV opioids) — pain itself drives sympathetic tone/HR/BP\n- [ ] Avoid **anticoagulants/antiplatelets/thrombolytics** once dissection is suspected/c
