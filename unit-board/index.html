<!DOCTYPE html>
<!-- ICU Unit Board · v1 · Claude Code · 25-Aug-2026
     Reuses the real ICU Daily tool (embedded below as base64, injected per bed into an iframe).
     Build with build-board.sh (injects the tool + roundsheet.js + version). Self-contained, opens as a local file.
     Storage model: beds[n] = { d:<D schema>, stay:<id>, state:'preround'|'rounded', overnight:'', taskDone:[] }. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU Unit Board</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif}
  body{display:flex;flex-direction:column;background:#eef2f8;color:#1a1d21;font-size:15px}
  header{background:#1a3c8f;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:700}
  .fzb{font:inherit;font-weight:800;background:#2a4ea0;color:#fff;border:0;border-radius:5px;width:26px;height:24px;cursor:pointer;line-height:1}
  header select{font:inherit;padding:4px 8px;border-radius:5px;border:0}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .syncst{margin-left:auto;cursor:pointer;font-size:11px;font-weight:700;padding:4px 11px;border-radius:12px;background:#2a4ea0;color:#cfe;white-space:nowrap;user-select:none}
  .syncst.ok{background:#1e7a3a;color:#fff}
  .syncst.err{background:#b31414;color:#fff}
  .syncst.busy{background:#8a5a00;color:#fff}
  #robar{display:none;align-items:center;gap:12px;background:#fff3cd;border-bottom:1px solid #f0c85a;color:#664d03;padding:7px 14px;font-size:13px}
  #robar button{font:inherit;font-weight:700;background:#6e40c9;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
  #robar button.sec{background:#8a6d3b}
  .tabs button{font:inherit;font-weight:600;background:#2a4ea0;color:#cfe;border:0;border-radius:6px 6px 0 0;padding:6px 14px;cursor:pointer}
  .tabs button.on{background:#eef2f8;color:#1a3c8f}
  #wrap{flex:1;display:flex;min-height:0}
  #rail{flex:0 0 274px;background:#dbe6f6;padding:8px 7px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .raillbl{font-size:10px;font-weight:800;color:#1a3c8f;text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:2px 0 1px}
  .railgrp{display:flex;flex-direction:column;gap:6px;border:2px solid #9fbce8;border-radius:8px;padding:6px;background:#eaf1fb}
  .bedbtn{position:relative;display:block;width:100%;font:inherit;background:#fff;border:1px solid #b6cff0;border-radius:8px;padding:7px 8px 8px;cursor:pointer;text-align:left;color:#1a3c8f;line-height:1.25}
  .bedbtn.cur{background:#1a73e8;color:#fff;border-color:#1a73e8}
  .bedbtn.cur .idl,.bedbtn.cur .chip{color:#fff;background:rgba(255,255,255,.18)}
  .bedbtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#cbd5e6}
  .bedbtn.filled .dot{background:#28a745}
  .bedbtn .bn{font-weight:800;font-size:13px}
  .bedbtn .st{position:absolute;top:23px;right:6px;font-size:9px;font-weight:800;border-radius:4px;padding:0 3px}
  .bedbtn .st.pr{background:#ffe6b3;color:#8a5a00}
  .bedbtn .st.done{background:#cdeccd;color:#155f2e}
  .bedbtn .st.hv{background:#dbeafe;color:#1a5aa8}
  .bedbtn .idl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:400;font-size:10.5px;opacity:.92;margin-top:2px;line-height:1.3;padding-right:26px}
  .bedbtn .idl .ag{font-weight:700;color:#1a3c8f}
  .bedbtn.cur .idl .ag{color:#fff}
  .bedbtn .idl.empty{display:block;opacity:.5;font-style:italic;padding-right:0}
  .bedbtn .meta{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
  .bedbtn .chip{font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px;background:#e6ecf7;color:#1a3c8f}
  .bedbtn .chip.tsk{background:#ffd9d9;color:#a11}
  .bedbtn .chip.tx{background:#dfeee0;color:#1a6b2e}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  #pastebar{background:#dbe6f6;border-bottom:1px solid #c3d4ee;padding:11px 14px;display:flex;gap:10px;align-items:stretch}
  #pjson{flex:1;font-family:'Consolas','Courier New',monospace;font-size:12px;min-height:54px;padding:10px 12px;border:2px dashed #a9c4ec;border-radius:8px;resize:vertical;background:#fff;line-height:1.45}
  #pjson:focus{outline:none;border-color:#1a73e8}
  #pastebar button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:8px;padding:0 20px;cursor:pointer;font-size:14px}
  #msg{font-size:11px;color:#666;align-self:center;min-width:110px}
  #bedbar{display:none;gap:8px;align-items:center;background:#eaf1fb;border-bottom:1px solid #c3d4ee;padding:7px 14px;flex-wrap:wrap}
  #bedbar .bbtag{font-weight:800;color:#1a3c8f}
  #bedbar button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
  #bedbar button.sec{background:#6b7a90}
  #bedbar button.rnd{background:#6e40c9}
  #bedbar button.asg{background:#28a745}
  #bedbar .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  #bedbar .spacer{flex:1}
  #bedbar .provchip{font-size:11px;font-weight:600;color:#8a97a8;background:#f0f3f8;border:1px solid #dbe3ef;border-radius:10px;padding:2px 8px;white-space:nowrap}
  .taskchip{font-size:11px;font-weight:600;border-radius:12px;padding:3px 9px;cursor:pointer;background:#e6ecf7;color:#1a3c8f;border:1px solid #cdd9ee}
  .taskchip.k-new{background:#e3f0ff} .taskchip.k-stop{background:#f3e0e0} .taskchip.k-watch{background:#fff0d6}
  .taskchip.done{text-decoration:line-through;opacity:.5}
  #view{flex:1;min-height:0;position:relative}
  iframe{width:100%;height:100%;border:0;background:#fff;position:absolute;inset:0}
  #hvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eaf1fb;border-bottom:1px solid #c3d4ee;padding:8px 14px;font-size:12.5px}
  #hvbar b{color:#1a3c8f}
  #hvbar .hvsp{flex:1}
  #hvbar .grp{display:flex;align-items:center;gap:3px;color:#556}
  #hvbar span.val{font-weight:700;color:#1a3c8f;min-width:40px;text-align:center}
  #hvbar button.go{font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
  #hvbar button.prt{background:#6e40c9}
  #hvbar button.sec2{background:#e6ecf7;color:#1a3c8f;border:1px solid #cdd9ee;border-radius:5px;padding:4px 9px;cursor:pointer;font-weight:600}
  #hvview{flex:1;position:relative;background:#e9edf3}
  #hvview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #collarea{background:#f3f7fd;border-top:1px solid #c3d4ee;padding:8px 14px;max-height:150px;overflow:auto;flex:0 0 auto}
  #collarea .collhdr{font-size:11px;color:#556;margin-bottom:6px;font-weight:600}
  #collarea .collrow{display:flex;align-items:flex-start;gap:8px}
  #collarea select{font:inherit;padding:5px;border-radius:5px;border:1px solid #b6cff0}
  #collarea textarea{flex:1;font-family:'Consolas','Courier New',monospace;font-size:11px;min-height:34px;padding:6px 8px;border:1px dashed #a9c4ec;border-radius:6px;resize:vertical}
  #collarea button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:0 14px;cursor:pointer}
  .panel{position:absolute;inset:0;overflow:auto;padding:20px;background:#eef2f8}
  .census{background:#fff;border:1px solid #d7e0ee;border-radius:8px;padding:14px 18px;max-width:680px}
  .census b{color:#1a3c8f}
  .stub{color:#667;background:#fff;border:1px dashed #b6cff0;border-radius:8px;padding:18px;max-width:680px}
  code{background:#e6ecf7;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>🏥 ICU Unit Board <span style="font-weight:400;opacity:.7;font-size:11px">v1.46 · 06-Sep-2026</span></h1>
  Unit <select id="unitSel" onchange="switchUnit()"></select>
  <span style="display:flex;gap:5px;align-items:center;font-size:12px;opacity:.95">· <input type="date" id="dateInp" onchange="onDatePick()" title="Pick a date to look back" style="font:inherit;padding:2px 6px;border-radius:5px;border:0"><button id="todayBtn" onclick="goToday()" style="display:none;font:inherit;font-weight:700;background:#2a4ea0;color:#fff;border:0;border-radius:5px;padding:3px 9px;cursor:pointer">Today</button><button id="histBtn" onclick="openHist()" title="Jump to a unit + date you entered before" style="font:inherit;font-weight:700;background:#1f3a78;color:#cfe0ff;border:0;border-radius:5px;padding:3px 9px;cursor:pointer">🕑 History</button></span>
  <span id="syncst" class="syncst" onclick="syncSetup()" title="Cross-device sync — click to set your private passphrase (same on every device)">sync off</span>
  <div class="tabs">
    <button data-sec="daily" class="on" onclick="showSec('daily')">Daily</button>
    <button data-sec="handover" onclick="showSec('handover')">Handover</button>
    <button data-sec="concise" onclick="showSec('concise')">Concise</button>
    <button data-sec="reference" onclick="showSec('reference')">📖 Reference</button>
    <button data-sec="angela" id="angtab" onclick="showSec('angela')" hidden>Angela</button>
    <button data-sec="prompts" onclick="showSec('prompts')">Prompts</button>
    <label id="anglbl" style="display:flex;align-items:center;gap:3px;margin-left:6px;font-size:11px;color:#cfe0ff;cursor:pointer" title="Angela handover — engineer-style terse view with status boxes"><input type="checkbox" id="angchk" onchange="toggleAngela()" style="cursor:pointer"> 🔬 Angela</label>
  </div>
  <span style="display:flex;gap:3px;align-items:center;margin-left:8px" title="Text size"><button class="fzb" onclick="fz(-0.08)">A&minus;</button><button class="fzb" onclick="fz(0.08)">A+</button></span>
</header>
<div id="robar"></div>
<div id="wrap">
  <aside id="rail"></aside>
  <section id="stage">
    <div id="pastebar">
      <textarea id="pjson" placeholder='Paste a bed&#39;s JSON here — it loads automatically on paste (or press ⌘/Ctrl+Enter). Routes by the "bed" field.'></textarea>
      <button onclick="loadPaste()">⤵ Load bed</button>
      <span id="msg"></span>
    </div>
    <div id="bedbar"></div>
    <div id="view"></div>
  </section>
</div>

<script>/* roundsheet.js — §23 Rounding Sheet renderer for the Unit Board.
   renderRoundingSheet(d) -> full A4-print-optimised HTML string, matching the
   24-Aug Bed-4 gold standard. Deterministic from the bed's structured data (d).
   The "Today / tasks" callout is a best-effort heuristic from plan/overnight lines
   (chat-Claude's `icu rounds` produces the full-judgment version). Print-CSS
   invariants (§23) are baked in and must not be removed. */
function rsEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// visible safety cap for the flag boxes — the JSON should already be condensed (rules §23); this is the net.
function rsCap(s,n){ s=String(s==null?'':s).replace(/\s+/g,' ').trim(); return (n&&s.length>n)?s.slice(0,n-1).replace(/[·\s—-]+$/,'')+'…':s; }
function rsShiftNow(){ var d=new Date(); if(d.getHours()<8)d.setDate(d.getDate()-1); return d; }   // 08:00→08:00 shift date
function rsDay(admit){ if(!admit)return '?'; var a=new Date(admit),t=rsShiftNow(); t.setHours(0,0,0,0); var n=Math.floor((t-a)/86400000)+1; return isNaN(n)?'?':n; }
function rsDBt(a,b){ if(!a||!b)return 0; var d1=new Date(a),d2=new Date(b); d1.setHours(0,0,0,0); d2.setHours(0,0,0,0); var n=Math.round((d2-d1)/86400000); return isNaN(n)?0:n; }
var RS_UN={sicu:'SICU',ccu:'CCU',micu:'MICU',csu:'CSU',pasqua:'PICU',picu:'PICU',picusu:'PICUSU'};
// Total hospital + ICU stay (optional §10 fields hospital_admit / prior_icu_stays). null → single-unit, unchanged.
function rsIcuTot(d){
  if(!d)return null;
  var prior=(d.prior_icu_stays||[]).filter(function(s){return s&&s.admit&&s.discharge;});
  if(!d.hospital_admit && !prior.length)return null;
  var t=rsShiftNow(); t.setHours(0,0,0,0);
  var curUnit=(d.unit||'').toUpperCase(), curDay=rsDay(d.icu_admit);
  var priorTotal=0, parts=[];
  prior.forEach(function(s){ var n=rsDBt(s.admit,s.discharge); if(n<0)n=0; priorTotal+=n;
    parts.push((RS_UN[s.unit]||String(s.unit||'ICU').toUpperCase())+' '+n+'d'); });
  parts.push(curUnit+' '+(typeof curDay==='number'?curDay:0)+'d');
  return { totalIcu: priorTotal+(typeof curDay==='number'?curDay:0),
           hospDay: d.hospital_admit ? rsDBt(d.hospital_admit,t)+1 : null,
           breakdown: parts.join(' + ') };
}
function rsDate(){ var d=rsShiftNow(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(); }
function rsFile(){ var d=rsShiftNow(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return String(d.getDate()).padStart(2,'0')+'-'+m[d.getMonth()]+'-'+d.getFullYear(); }
function rsLines(v){ if(!v)return []; if(Array.isArray(v))return v.filter(function(x){return x!=null&&String(x).trim();}); return String(v).split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean); }
function rsWarn(t){ return /^⚠|threshold|avoid|risk|allerg|airway|unsecured|bleed|deteriorat|watch/i.test(t); }
function rsFlag(v){ // wrap (H)/(L) etc in colour spans
  return rsEsc(v).replace(/\((HH|LL|H|L)\)/g,function(m,g){ var c=(g[0]==='H')?'hi':'lo'; return '<span class="'+c+'">('+g+')</span>'; }); }

// flatten strings / arrays / {allergen,reaction}-style objects to one display string
function rsFlat(v){
  if(v==null) return '';
  if(Array.isArray(v)) return v.map(rsFlat).filter(Boolean).join(' · ');
  if(typeof v==='object'){
    var a=v.allergen||v.name||v.drug||v.substance||v.text||'';
    var r=v.reaction||v.rxn||''; a=String(a).trim(); r=String(r).trim();
    if(a) return a+(r?' ('+r+')':'');
    return Object.keys(v).map(function(k){return v[k];}).filter(function(x){return typeof x==='string'||typeof x==='number';}).join(' ').trim();
  }
  return String(v).trim();
}
function rsFlagsBlock(d){
  var aro=rsFlat(d.aro); aro=aro?aro:'None';
  var alg=rsFlat(d.allergies); alg=alg?alg:'NKA';
  var gocP=(d.problems||[]).filter(function(p){return p&&p.type==='goc';})[0];
  var goc=gocP?((gocP.goc_status||'?')+(gocP.goc_note?' — '+rsCap(gocP.goc_note,300):'')):'Unknown';
  var aroCls=/none|neg/i.test(aro)?'ok':'';
  var algCls=/^nka|none|nil/i.test(alg)?'ok':'warn';
  return '<div class="flags">'
    +'<div class="flag '+aroCls+'"><span class="lbl">ARO / Isolation</span><span class="val">'+rsEsc(aro)+'</span></div>'
    +'<div class="flag '+algCls+'"><span class="lbl">Allergies</span><span class="val">'+rsEsc(alg)+'</span></div>'
    +'<div class="flag"><span class="lbl">Goals of Care</span><span class="val">'+rsEsc(goc)+'</span></div></div>';
}

function rsTodayBlock(d){
  var pend=[],mods=[],warns=[],fromTasks=false;
  // Preferred: structured tasks[] (kind: new|stop|pending|watch)
  if(Array.isArray(d.tasks)&&d.tasks.length){
    fromTasks=true;
    d.tasks.forEach(function(t){ if(!t)return; var txt=(t.text||'').trim(); if(!txt)return;
      var k=(t.kind||'pending').toLowerCase();
      if(k==='watch')warns.push(txt);
      else if(k==='pending')pend.push(txt);
      else mods.push((k==='stop'?'STOP: ':k==='new'?'NEW: ':'')+txt);
    });
  } else {
    // Fallback heuristic: bucket from plan lines + overnight text
    (d.problems||[]).forEach(function(p){
      rsLines(p&&p.plan).forEach(function(l){
        if(rsWarn(l)){ warns.push(l); return; }
        if(/pending|await|f\/u|follow.?up|repeat|echo|consult|refer|result|culture|reassess|recheck/i.test(l)){ pend.push(l); }
        else if(/^start|^new|^begin|^add |^increase|^up-?titrat|^stop|^hold|^d\/?c|^discontinu|^decreas|^wean/i.test(l)){ mods.push(l); }
      });
    });
    if(d.overnight){ rsLines(d.overnight).forEach(function(l){ pend.push(l); }); }
  }
  function ul(arr){ return arr.length?('<ul>'+arr.map(function(l){ return '<li'+(rsWarn(l)?' class="warn"':'')+'>'+rsFlag(l.replace(/^⚠\s*/,''))+'</li>'; }).join('')+'</ul>'):'<ul><li style="color:#999">—</li></ul>'; }
  var note=fromTasks?'':' <span style="font-weight:400;font-size:7.4pt;color:#a06a1a">(auto-draft — verify &amp; edit)</span>';
  return '<div class="today"><h2>⚡ Today · Key changes &amp; tasks'+note+'</h2>'
    +'<div class="today-grid">'
    +'<div class="today-cell"><span class="k">Pending / awaiting</span>'+ul(pend)+'</div>'
    +'<div class="today-cell"><span class="k">New / stop / watch</span>'+ul(mods.concat(warns))+'</div>'
    +'</div></div>';
}

function rsSnapBlock(d){
  var v=d.vitals||{}, fl=d.fluids||{};
  // Vitals + support + fluids as ONE horizontal strip (was a 4-box grid)
  var vit=[];
  if(v.bp)vit.push('BP '+rsFlag(v.bp)+(v.map?' (MAP '+rsEsc(v.map)+')':''));
  if(v.hr)vit.push('HR '+rsFlag(v.hr));
  if(v.sats)vit.push('SpO2 '+rsFlag(v.sats));
  if(v.rr)vit.push('RR '+rsFlag(v.rr));
  if(v.tmax)vit.push('Tmax '+rsFlag(v.tmax));
  if(v.gcs)vit.push('GCS '+rsEsc(v.gcs));
  if(v.resp)vit.push('Resp '+rsEsc(v.resp));
  if(v.cvs)vit.push('CVS '+rsEsc(v.cvs));
  if(v.abd)vit.push('Abd '+rsEsc(v.abd));
  if(fl.fb)vit.push('FB '+rsEsc(fl.fb));
  if(fl.uo)vit.push('UO '+rsEsc(fl.uo));
  if(fl.note)vit.push(rsEsc(fl.note));
  if(v.other)vit.push(rsEsc(v.other));
  var out=vit.length?'<div class="strip"><span class="sl">Vitals</span> '+vit.join(' &nbsp;·&nbsp; ')+'</div>':'';
  // ABG/VBG as ONE line from the labs (was its own box)
  var abg=(d.labs||[]).filter(function(s){return /abg|vbg|gas/i.test(s.section||'');})[0];
  if(abg&&abg.items&&abg.items.length){
    var parts=abg.items.filter(function(it){return it&&it.v!=null&&String(it.v).trim();}).map(function(it){
      var suf=(it.f==='hi'?' (H)':it.f==='lo'?' (L)':''); return (it.l?rsEsc(it.l)+' ':'')+rsFlag(String(it.v)+suf); });
    if(parts.length)out+='<div class="strip"><span class="sl">ABG</span> '+parts.join(' &nbsp;·&nbsp; ')+'</div>';
  }
  return out;
}

function rsLabsBlock(d){
  var labs=(d.labs||[]).filter(function(s){return !/abg|vbg|gas/i.test(s.section||'');});
  if(!labs.length)return '';
  var lines=labs.map(function(sec){
    var items=(sec.items||[]).filter(function(it){return it&&(it.v!=null&&String(it.v).trim());}).map(function(it){
      var val=String(it.v); var suf=(it.f==='hi'&&!/\(H/.test(val))?' (H)':(it.f==='lo'&&!/\(L/.test(val))?' (L)':'';
      var disp=rsFlag(val+suf);
      return (it.l?rsEsc(it.l)+' ':'')+disp;
    });
    if(!items.length)return '';
    return '<div class="line"><span class="pn">'+rsEsc((sec.section||'').replace(/\s*\(.*\)$/,''))+'</span> '+items.join(' &nbsp;·&nbsp; ')+'</div>';
  }).filter(Boolean).join('');
  return lines?('<div class="labs"><h3>Labs</h3>'+lines+'</div>'):'';
}

function rsProblemsBlock(d){
  // GoC is shown in the flags row above — NOT repeated as a problem row (de-dup, 26-Aug-2026)
  var probs=(d.problems||[]).filter(function(p){return p&&p.name&&p.type!=='goc';});
  var rows=probs.map(function(p,i){
    var isDispo=p.type==='dispo';
    var cls=isDispo?' class="dispo"':'';
    var badge=p.badge&&p.badge.text?'<span class="badge '+({b:'bl',g:'gr',o:'',r:''}[(p.badge.type||'o')]||'')+'">'+rsEsc(p.badge.text)+'</span>':'';
    // doing now = tx (+ key_labs summary); plan = plan (+ bp)
    var doing=rsLines(p.tx);
    if(p.key_labs&&p.key_labs.length){ var kl=p.key_labs.filter(function(k){return k&&k.v;}).map(function(k){return (k.l?k.l+' ':'')+k.v;}); if(kl.length)doing.push(kl.join(' | ')); }
    if(isDispo){ doing=rsLines(p.dispo_summary||p.context); }
    var plan=rsLines(p.plan).concat(rsLines(p.bp).map(function(b){return b;}));
    function ul(arr){ return arr.length?('<ul>'+arr.map(function(l){return '<li'+(rsWarn(l)?' class="warn"':'')+'>'+rsFlag(l.replace(/^⚠\s*/,''))+'</li>';}).join('')+'</ul>'):''; }
    return '<tr'+cls+'>'
      +'<td class="name">'+(i+1)+'. '+rsEsc(p.name)+badge+'</td>'
      +'<td class="doing">'+ul(doing)+'</td>'
      +'<td class="plan">'+ul(plan)+'</td></tr>';
  }).filter(Boolean).join('');
  return '<table class="prob"><thead><tr><th>Problem</th><th>Doing now</th><th>Plan</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

</script>
<script>/* handover.js — build the ICU-Handover-Universal D object from the board's per-bed Daily data.
   buildHandoverD(boardUnit, bedsMap) -> {unit, beds:{ "1":{...}|{empty:true} }} or null (CSU/MSU = no handover).
   The transform is a best-effort AUTO-DRAFT of the §2 editorial rules (pipeline + judgment briefs, 25-Aug-2026);
   the rendered handover tool is fully contenteditable, so the receiving physician fixes anything imperfect.
   Ordering is POSITIONAL (bed number) — never re-sorted. Privacy: pt = "Age·Sex·Day N" only. */

function hvClean(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
function hvLines(v){ if(!v)return []; if(Array.isArray(v))return v.map(hvClean).filter(Boolean);
  return String(v).split(/\r?\n/).map(hvClean).filter(Boolean); }
// Extract a terse cath/PCI summary from hospital_course / presentation / problem contexts — e.g. "PCI 2 DES RCA/PDA".
// Surfaces the vessels+stents into the working-dx headline (esp. CCU) without needing a regenerate.
function hvProc(d){
  var src=hvLines(d.hospital_course).concat(hvLines(d.presentation)).concat((d.problems||[]).map(function(p){return (p&&p.context)||'';}));
  // require an ACTUAL stent mention (not just "PCI"/"POBA"/"cath") to avoid false positives (SCAD-POBA, cath-pending)
  var line=src.filter(function(l){return /\b(des|stent|drug[- ]?elut)/i.test(l);})[0];
  if(!line) return '';
  // only vessels sitting within ~22 chars of a stent token — excludes vessels named in disease descriptions (e.g. "3VD")
  var vessels=[], vre=/\b(LMCA|LAD|LCx|Cx|RCA|pRCA|dRCA|PDA|PLV|OM\d?|D[12]|ramus)\b/gi, m;
  while((m=vre.exec(line))){ var i=m.index, ctx=line.slice(Math.max(0,i-22), i+m[0].length+22);
    if(/\b(des|stent|drug[- ]?elut)\b/i.test(ctx)){ var v=m[0].toUpperCase().replace(/^[PD]RCA$/,'RCA'); if(vessels.indexOf(v)<0)vessels.push(v); } }
  var cnt=(line.match(/\b(des|drug[- ]?elut(?:ing)?\s*stent|stent)\b/gi)||[]).length;
  var word=/\bbms\b/i.test(line)?'BMS':'DES';
  if(!vessels.length && !cnt) return '';
  return ('PCI'+(cnt?' '+cnt+' '+word:'')+(vessels.length?' '+vessels.slice(0,3).join('/'):'')).trim();
}
function hvJoin(arr, sep, cap){ var s=arr.filter(Boolean).join(sep); return cap&&s.length>cap ? s.slice(0,cap-1).replace(/[·\s]+$/,'')+'…' : s; }
function hvCap(s, n){ s=hvClean(s); return (n&&s.length>n) ? s.slice(0,n-1).replace(/[·\s—-]+$/,'')+'…' : s; }
// per-field caps tuned to the 67 mm handover cell — keeps content from silently clipping.
// The JSON should already be authored within these (rules §handover); this is the visible safety net.
var HVCAP={ admit:95, event:210, dx:170, pmhx:170, tx:185, plan:180, goc_text:95 };
function hvDay(admit){ if(!admit)return '?'; var a=new Date(admit),t=new Date(); if(t.getHours()<8)t.setDate(t.getDate()-1); t.setHours(0,0,0,0);  // 08:00 shift boundary
  var n=Math.floor((t-a)/86400000)+1; return (isNaN(n)||n<1)?'?':n; }

// Principle-10 filters: drop continuations / monitor-only / nursing routines / standing PPO orders; keep ACTIVE decisions + safety flags.
function hvTxKeep(l){
  if(/^\*\*/.test(l)) return true;                                             // safety flag — always keep
  if(/^\s*(continue|cont\.|ongoing|routine|standing|per protocol)\b/i.test(l)) return false;
  if(/foley|hob\b|head of bed|oral care|turn q|skin care|pressure area|nursing|mouth care/i.test(l)) return false;
  // routine ICU / PPO standing orders & monitoring targets — background noise, not "what we're actively doing"
  if(/icu mobility|mobility protocol|mobili[sz]|aspiration precaution|\bprecautions?\b|spo2 (goal|target|>|≥)|sat[s]? (goal|target)|o2 (goal|target)|map (goal|target|>|≥)|\bgoal\b|prophylax|\bvte\b|\bdvt\b|stress ulcer|\bppi\b|cam-?icu|neuro vitals?|q\d+h vitals?|bowel regimen|glycemic|insulin sliding|sliding scale/i.test(l)) return false;
  if(/^\s*(stopped|discontinued|d\/?c'?d|completed)\b/i.test(l)) return false;  // fully stopped
  return true;
}
function hvPlanKeep(l){
  if(/^\*\*/.test(l)) return true;                                             // safety flag
  if(/^\s*(continue|cont\.|monitor|observe|reassess|ongoing|routine|maintain|keep )\b/i.test(l)) return false;
  if(/^\s*consider\b.*\bif\b/i.test(l)) return false;                          // conditional pre-emptive
  return /transfer|wean|extubat|consult|discharg|chase|review|follow|start|stop|d\/?c|repeat|refer|book|call|optimi|titrat|target|await|trial|escalat|de-?escalat|switch|convert|remove|insert|plan for|for /i.test(l);
}
// SMOST (June 2023): 7 designations, each its OWN class. NEVER collapse M→R or M→comfort.
// R1=Full · R2=no CPR · R3=no CPR/intub · M1=medical+transfer · M2=medical on-site · C1=comfort · C2=comfort/imminent
function hvGocClass(status){
  var s=hvClean(status).toUpperCase();
  if(/^R1/.test(s) || /^FULL/.test(s)) return 'goc-r1';
  if(/^R2/.test(s)) return 'goc-r2';
  if(/^R3/.test(s)) return 'goc-r3';
  if(/^M1/.test(s)) return 'goc-m1';
  if(/^M2/.test(s)) return 'goc-m2';
  if(/^C1/.test(s)) return 'goc-c1';
  if(/^C2/.test(s)) return 'goc-c2';
  return 'goc-uk';
}
// verbatim short-forms — M is never "comfort"; comfort begins at C1
var GOC_SHORT={R1:'Full code',R2:'No CPR',R3:'No CPR/intub · NIPPV OK',M1:'Medical + transfer',M2:'Medical · on-site only',C1:'Comfort care',C2:'Comfort · imminent'};
function hvGocCode(status){ var m=hvClean(status).toUpperCase().match(/^(R[123]|M[12]|C[12])/); return m?m[1]:(/^FULL/.test(hvClean(status).toUpperCase())?'R1':''); }
function hvGocShort(status){ var c=hvGocCode(status); return c?(c+' — '+GOC_SHORT[c]):hvClean(status); }
// Transfer tag — unambiguous DIRECTION (→ leaving to / ← came from) + SPECIFIC destination + DATE. Never a bare "Transfer".
var HV_MONc={jan:'Jan',feb:'Feb',mar:'Mar',apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'};
function hvTransferTag(s){
  var sl=s.toLowerCase();
  var dm=s.match(/\b(\d{1,2})\s?(?:st|nd|rd|th)?[-\s]?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i)
       || s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[-\s]?(\d{1,2})\b/i);
  var date='';
  if(dm){
    var dNum, mName; if(/^\d/.test(dm[1])){ dNum=+dm[1]; mName=dm[2]; } else { dNum=+dm[2]; mName=dm[1]; }
    var mIdx={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11}[mName.toLowerCase()];
    var now=new Date(); now.setHours(0,0,0,0);
    var dt=new Date(now.getFullYear(), mIdx, dNum); dt.setHours(0,0,0,0);
    if(dt-now>300*86400000) dt=new Date(now.getFullYear()-1, mIdx, dNum);   // rolled into future → last year
    var diff=Math.round((now-dt)/86400000);
    if(diff>=1 && diff<=120) date=' · '+diff+'d';                           // boarding / pending N days
    else if(diff===0) date=' · today';
    else date=' · '+dNum+' '+HV_MONc[mName.toLowerCase()];                  // future/planned → show the date
  }
  var inbound=/\b(from|repatriat|received from|transferred? in\b|accepted from)\b/.test(sl)
    && !/\bto\s+(the\s+)?(ward|floor|home|medicine|hospitalist|step|or|surgery|oncolog|surveillance)/.test(sl);
  var dest;
  if(/hospitalist/.test(sl)) dest='Hospitalist ward';
  else if(/internal medicine|general medicine|\bmedicine\b|\bgim\b|\bim\b/.test(sl)) dest='Medicine ward';
  else if(/surg/.test(sl)) dest='Surgery ward';
  else if(/surveillance|\bpsu\b/.test(sl)) dest='Pasqua Surveillance';
  else if(/oncolog|cancer/.test(sl)) dest='Oncology';
  else if(/step[\s-]?down|\bhdu\b/.test(sl)) dest='Step-down';
  else if(/home|discharge/.test(sl)) dest='Home';
  else if(/\bor\b|theatre|operat/.test(sl)) dest='OR';
  else if(/\bm?icu\b|\bsicu\b|\bpicu\b|\bccu\b|\bcsu\b/i.test(s)){ var um=s.match(/\b(m?icu|sicu|picu|ccu|csu)\b/i); dest=um?um[1].toUpperCase():'ICU'; }
  else if(/\bward\b|\bfloor\b/.test(sl)) dest='Ward';
  else { var mm=s.match(/(?:to|from|→|←)\s+([A-Z][A-Za-z /]{2,22})/); dest=mm?mm[1].trim():hvCap(s,22); }
  return (inbound?'← from ':'→ ')+dest+date;
}

function bedToHandover(d, overnight, uncap){
  d=d||{}; var CAP=uncap?{}:HVCAP;   // uncap:true (Concise view) → no field caps, full text wraps
  var day=hvDay(d.icu_admit);
  var probs=(d.problems||[]);
  var goc=probs.filter(function(p){return p&&p.type==='goc';})[0];
  var dispo=probs.filter(function(p){return p&&p.type==='dispo';})[0];
  var active=probs.filter(function(p){return p&&p.name&&p.type!=='goc'&&p.type!=='dispo';});  // regular problems = anything not goc/dispo (robust to type:"problem" that captureToD stamps on edit)

  var pt=hvClean(d.age_sex)+' · Day '+day;
  var subA=hvClean(d.subtitle||(d.diagnoses||[])[0]||'').replace(/^\d+[.)]\s*/,'');
  var proc = /\bpci\b|\bstent|\bdes\b|\bcath/i.test(subA) ? '' : hvProc(d);   // fold cath/PCI vessels+stents into the headline if not already stated
  var admit=hvCap(subA+(proc?' · '+proc:''), CAP.admit);

  // event: prefer Claude's handover_line; else presentation + hospital-course
  var event=hvClean(d.handover_line);
  if(!event){
    var pres=hvLines(d.presentation).slice(0,3).join(' ');
    var hc=hvLines(d.hospital_course).slice(0,2).join(' ');
    event=hvClean(pres+(hc?' '+hc:''));
  }
  event=hvCap(event, CAP.event);

  // dx = problem HEADLINES only — strip the " — descriptor" tail so names don't overflow/clip
  var dx=hvJoin(active.map(function(p){return hvClean(p.name).replace(/\s*—.*$/,'').replace(/\s*\(.*$/,'');}), ' · ', CAP.dx);
  // pmhx = the MAIN thing per comorbidity — keep dates, drop pathology/genetics minutiae. Per-item cap + first 6.
  var pmhx=hvJoin(hvLines(d.pmhx).slice(0,uncap?99:6).map(function(l){return hvCap(hvClean(l), uncap?0:46);}), ' · ', CAP.pmhx);
  var txAll=[]; active.forEach(function(p){ hvLines(p.tx).filter(hvTxKeep).forEach(function(l){txAll.push(l);}); });
  var tx=hvJoin(txAll, ' · ', CAP.tx);
  var planAll=[]; active.forEach(function(p){ hvLines(p.plan).filter(hvPlanKeep).forEach(function(l){planAll.push(l);}); });
  (d.tasks||[]).forEach(function(t){ if(t&&t.kind==='new')planAll.push(hvClean(t.text)); else if(t&&t.kind==='stop')planAll.push('Stop '+hvClean(t.text)); });
  if(dispo&&dispo.dispo_summary) planAll.push(hvClean(dispo.dispo_summary));
  var plan=hvJoin(planAll, ' · ', CAP.plan);

  var gocClass=hvGocClass(goc&&goc.goc_status);
  var gocStat=hvClean(goc&&goc.goc_status).toUpperCase();
  // goc_text = a short PROMPT (code + what's pending/to confirm), NOT the ceiling-of-care essay (that lives in the SCM note).
  var goc_text='';
  if(goc){ var gs=hvGocShort(goc.goc_status)||hvClean(goc.goc_status);
    var gn=hvClean(goc.goc_note); if(gn) gn=hvCap(gn.split(/\.\s|;\s/)[0], 58);   // first clause only, tight
    goc_text=hvCap(gs+(gn?' — '+gn:''), CAP.goc_text); }

  // tags: transfer (DIRECTION + specific destination + date) · M/C-level GoC alert · new · ARO
  var tags=[];
  if(dispo&&dispo.dispo_summary){ tags.push({cls:'transfer-tag',text:hvTransferTag(hvClean(dispo.dispo_summary))}); }
  // GoC ceiling tag: M2/C1/C2 = escalation-limited → ⚠ alert; R3/M1 = a plain info chip (still active/aggressive care)
  if(/^(M2|C1|C2)/.test(gocStat)) tags.push({cls:'alert-tag',text:'⚠ '+hvGocShort(gocStat)});
  else if(/^(R3|M1)/.test(gocStat)) tags.push({cls:'goc-tag',text:hvGocShort(gocStat)});
  if(day===1) tags.push({cls:'new-tag',text:'New Admit'});
  if(hvClean(d.aro)) tags.push({cls:'aro-tag',text:'ARO: '+hvClean(d.aro)});

  var ovn=hvClean(overnight);
  // alert border for beds a receiving MD should walk first: M/C-level GoC, or a ⚠ watch task
  var hasWatch=(d.tasks||[]).some(function(t){return t&&t.kind==='watch';});
  var alertFlag=/^(M2|C1|C2)/.test(gocStat)||hasWatch;   // escalation-limited ceilings only (M1/R3 still get active care)

  var bed={ pt:pt, goc:gocClass, alert:alertFlag, tags:tags.slice(0,3),
    admit:admit, event:event, overnight:ovn, dx:dx, pmhx:pmhx, tx:tx, goc_text:goc_text, plan:plan };
  if(ovn) bed._ovn_show=true;   // auto-reveal the green strip
  return bed;
}

// board unit -> handover tool unit + bed count (CSU/MSU = no handover sheet)
function hvUnitCfg(boardUnit){
  var u=String(boardUnit||'').toUpperCase();
  if(u.indexOf('PICU')>=0) return {tool:'picu', n:11};   // PICU+PICUSU combined 1–11
  if(u==='MICU') return {tool:'micu', n:10};
  if(u==='SICU') return {tool:'sicu', n:12};
  if(u==='CCU')  return {tool:'ccu', n:12};
  return null;                                            // CSU, MSU → admission-only
}

// a Claude-condensed mini-card (hv:1) — normalise to the tool's bed shape, apply board overnight
function normHvCard(c, overnight){
  c=c||{};

// pre-authored handover card baked into the bed's §10 JSON (d.handover) — the gold path.
// Claude authored it with full context; the board only derives pt + GoC colour + overnight.
function authoredCard(d, overnight, uncap){
  var h=d.handover||{}; var CAP=uncap?{}:HVCAP;
  var day=hvDay(d.icu_admit);
  var goc=(d.problems||[]).filter(function(p){return p&&p.type==='goc';})[0];
  var ovn=hvClean(overnight||h.overnight);
  var bed={ pt:hvClean(d.age_sex)+' · Day '+day,
    goc: h.goc || hvGocClass(goc&&goc.goc_status),
    alert: !!h.alert,
    tags: (h.tags||[]).slice(0,3),
    admit: hvCap(h.admit||d.subtitle, CAP.admit),
    event: hvCap(h.event, CAP.event),
    overnight: ovn,
    dx: hvCap(h.dx, CAP.dx),
    pmhx: hvCap(h.pmhx, CAP.pmhx),
    tx: hvCap(h.tx, CAP.tx),
    goc_text: hvCap(h.goc_text || (goc?((goc.goc_status||'')+(goc.goc_note?' — '+goc.goc_note:'')):''), CAP.goc_text),
    plan: hvCap(h.plan, CAP.plan) };
  if(ovn) bed._ovn_show=true;
  return bed;
}

function buildHandoverD(boardUnit, bedsMap, uncap){
  var cfg=hvUnitCfg(boardUnit); if(!cfg) return null;
  var beds={};
  for(var n=1;n<=cfg.n;n++){
    var w=bedsMap&&bedsMap[n];
    beds[String(n)] = (w&&w.hvcard)          ? normHvCard(w.hvcard, w.overnight)       // colleague mini-card
                    : (w&&w.d&&w.d.handover) ? authoredCard(w.d, w.overnight, uncap)   // pre-authored (gold)
                    : (w&&w.d)               ? bedToHandover(w.d, w.overnight, uncap)  // transform (fallback)
                    :                          {empty:true};
  }
  return {unit:cfg.tool, beds:beds};
}

function shiftNow(){ var d=new Date(); if(d.getHours()<SHIFT_START_HR)d.setDate(d.getDate()-1); return d; }   // the current shift's calendar date

function dmyToIso(s){ var p=String(s).split('-'); var mi=MON.indexOf(p[1]); if(mi<0)return null;
  return p[2]+'-'+String(mi+1).padStart(2,'0')+'-'+String(+p[0]).padStart(2,'0'); }
function collectHistory(){
  var map={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    var m=k&&k.match(/^unitboard_([A-Za-z]+)_(\d{2}-[A-Za-z]{3}-\d{4})$/);
    if(!m)continue;
    var iso=dmyToIso(m[2]); if(!iso)continue;
    var n=0; try{var b=JSON.parse(localStorage.getItem(k)||'{}'); n=Object.keys(b).filter(function(x){return b[x];}).length;}catch(e){}
    if(!n)continue;   // skip empty local shells
    var at=parseInt(localStorage.getItem('ub_stateAt_'+m[1]+'_'+m[2])||'0',10)||0;
    map[m[1]+'|'+m[2]]={unit:m[1],date:m[2],iso:iso,beds:n,at:at};
  }
  return map;
}

function routeEntry(d){ // slot one parsed object into its bed; returns {ok,bed} or {ok:false,err}

function cCap(s,n){ s=(''+(s==null?'':s)).replace(/\s+/g,' ').trim(); return (n&&s.length>n)?s.slice(0,n-1).replace(/[·\s—-]+$/,'')+'…':s; }
// concise: previous density (char budget) but truncate ONLY at a complete ` · ` item — never mid-sentence. Trailing "…" if more.
function cFit(s,max){ s=(''+(s==null?'':s)).replace(/\s+/g,' ').trim(); if(!s)return ''; var p=s.split(' · '); var out=[],len=0;
  for(var i=0;i<p.length;i++){ if(out.length&&len+3+p[i].length>max)break; out.push(p[i]); len+=p[i].length+3; }
  return out.join(' · ')+(out.length<p.length?' …':''); }
function conciseCards(D){

  // Each card: left 2/3 = concise glance · right 1/3 = blank write-in notes column (type on screen or handwrite after print).
  return Object.keys(D.beds).sort(function(a,b){return (+a)-(+b);}).map(function(k){
    var b=D.beds[k]||{};

        +'<span class="cempty">— open —</span></div></div>'+notes+'</div>';

    var dx=cFit(b.admit||b.dx,170), rx=cFit(b.tx,185), pend=cFit(b.plan,180), ovn=cCap(b.overnight,120);  // previous density, clean item-boundary cut (no mid-sentence)

      .map(function(t){return '<span class="cflag '+t.cls+'">'+esc(t.text)+'</span>';}).join('');
    function crow(fld,lbl,val){ return '<div class="crow"><span class="ck">'+lbl+'</span><span class="cv" data-f="'+fld+'" contenteditable="true">'+esc(val||'')+'</span></div>'; }

    var main='<div class="cmain">'
      +'<div class="chd"><span class="cbed">Bed '+k+'</span><span class="cpt">'+esc(b.pt||'')+'</span>'
      +'<span class="cchip" style="background:'+g.bg+';color:'+g.fg+'">'+g.code+' · '+g.lbl+'</span></div>'
      +rows+(flags?'<div class="cflags">'+flags+'</div>':'')+'</div>';

  });

// ---- 🔬 Angela handover: engineer-terse, one concept per line, two-cell status boxes ----
// Box = [ordered? , result-back?].  ◼◻ ordered/awaiting · ◼◼ ordered+result · ◻◻ not ordered yet.  Toggle via header checkbox.
function angOn(){ try{ return localStorage.getItem('ub_angela')==='1'; }catch(e){ return false; } }  // default OFF (disabled 5-Sep; re-enable via the 🔬 Angela checkbox)

function angClean(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }

function angBox(state){ var c1=(state==='pending'||state==='done')?'o':'', c2=(state==='done')?'r':'';

function angIsPend(l){ return /await|chase|pending|repeat|recheck|trend|\border\b|consult|refer|book|arrange|obtain|f\/u|follow|\bwean|extubat|discharg|transfer|\bstart|\bstop|d\/?c\b|titrat|repeat|review|for /i.test(l); }
function buildAngelaHTML(D){

    return '<div class="acard'+(b.alert?' alert':'')+'" style="border-left-color:'+g.bar+'">'
      +'<div class="ah"><span class="abd">Bed '+k+'</span><span class="apt">'+esc(b.pt||'')+'</span>'
      +'<span class="achip" style="background:'+g.bg+';color:'+g.fg+'" title="'+esc(g.lbl)+'">'+g.code+'</span></div>'+body+'</div>';
  });
  var css='<style>*{box-sizing:border-box}body{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#12213f;background:#f4f7fc;padding:9px;font-size:11.5px}'
    +'.leg{display:flex;gap:14px;align-items:center;font-size:10px;color:#556;margin-bottom:8px;flex-wrap:wrap}'
    +'.leg .abox{margin-right:4px}'
    +'.alist{display:flex;flex-direction:column;gap:6px}'
    +'.acard{border:1px solid #cbd5e6;border-left:6px solid #90a4ae;border-radius:6px;background:#fff;padding:6px 10px;break-inside:avoid;page-break-inside:avoid}'
    +'.acard.empty{background:#fbfcfe;border-left-color:#d3dced;padding:4px 10px}'
    +'.acard.alert{box-shadow:inset 3px 0 0 #d9342b}'
    +'.ah{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;border-bottom:1px solid #eef2f8;padding-bottom:3px}'
    +'.abd{font-weight:800;font-size:13.5px;color:#12213f;white-space:nowrap}'
    +'.apt{font-size:11px;color:#3a4657;font-weight:600}.aopen{font-size:10.5px;color:#9aa7b8}'
    +'.achip{margin-left:auto;font-size:11px;font-weight:800;padding:1px 8px;border-radius:9px;white-space:nowrap}'
    +'.arow{display:flex;gap:8px;margin-top:2px;line-height:1.4;align-items:flex-start}'
    +'.al{flex:0 0 40px;font-weight:800;color:#98a4b4;text-transform:uppercase;font-size:9px;letter-spacing:.5px;padding-top:2px}'
    +'.av{flex:1;min-width:0}.ai{line-height:1.45;padding-left:26px;text-indent:-26px}'
    +'.abox{display:inline-flex;gap:2px;margin-right:7px;vertical-align:-1px;text-indent:0}'
    +'.abox i{width:9px;height:9px;border-radius:2px;border:1.3px solid #9aa7b8;display:inline-block;background:#fff}'
    +'.abox i.o{background:#2a4ea0;border-color:#2a4ea0}.abox i.r{background:#2c9a48;border-color:#2c9a48}'
    +'@page{size:A4 portrait;margin:8mm}@media print{body{background:#fff;padding:0}.acard{border-color:#999}}'
    +'</style>';
  var legend='<div class="leg"><b style="color:#12213f">Status:</b>'
    +'<span>'+angBox('pending')+'ordered · awaiting</span>'
    +'<span>'+angBox('done')+'ordered + result</span>'
    +'<span>'+angBox('todo')+'not ordered</span></div>';
  return '<!doctype html><html><head><meta charset="utf-8">'+css+'</head><body>'+legend+'<div class="alist">'+rows.join('')+'</div></body></html>';
}

var REFDATA=[{"file": "acute-liver-failure-aasld-2023.md", "title": "Acute liver failure", "system": "GI / Hepatic", "body": "# Acute liver failure — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** AASLD Guideline: Management of Acute Liver Failure, American Association for the Study of\n> Liver Diseases, 2023 — https://www.aasld.org/practice-guidelines/management-acute-liver-failure\n> (see also https://pubmed.ncbi.nlm.nih.gov/37377263/)\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Diagnosis & early workup\n- [ ] Confirm ALF definition: acute liver injury + coagulopathy (**INR ≥1.5**) + **any encephalopathy**, no prior cirrhosis, illness duration **<26 weeks** *(exact cutoffs — verify)*\n- [ ] Prompt etiology workup: acetaminophen level, viral hepatitis serologies (A-E), autoimmune markers, ceruloplasmin/Wilson's workup if age/features suggest, pregnancy-related causes if applicable, drug/herbal/supplement history, ischemic/vascular causes\n- [ ] **Early contact with a transplant center** — do not delay referral pending completion of full workup\n- [ ] Cross-sectional contrast imaging to assess hepatic anatomy/vasculature and inform potential transplant/surgical planning\n\n## Medical & ICU management\n- [ ] **N-acetylcysteine infusion** — treatment of choice for acetaminophen toxicity; consider empirically for non-acetaminophen ALF pending etiology, as it may improve transplant-free survival if started early *(dose/regimen — verify)*\n- [ ] Grade encephalopathy serially; escalate care/airway protection as grade rises *(intubation threshold — verify)*\n- [ ] Manage **cerebral edema / elevated ICP risk**: head-of-bed elevation, avoid hypotonic fluids and hypercapnia, consider hyperosmolar therapy (mannitol/hypertonic saline), targeted sedation/temperature as needed *(specific triggers/agents/monitoring — verify)*\n- [ ] **Continuous renal replacement therapy** preferred over intermittent hemodialysis when renal support is needed, to avoid metabolic/hemodynamic swings that worsen cerebral edema\n- [ ] Correct/monitor glucose, electrolytes, and lactate; correct coagulopathy only for active bleeding or before invasive procedures — avoid \"normalizing\" INR purely for its own sake (masks a prognostic marker) *(verify)*\n- [ ] Empiric/targeted infection surveillance and treatment — infection risk is high in ALF *(threshold/regimen — verify)*\n- [ ] Stress-ulcer prophylaxis and nutrition support per general critical-care standards\n\n## Prognosis & transplant listing\n- [ ] Apply a validated prognostic tool (e.g. King's College Criteria or equivalent) to guide urgency of transplant evaluation/listing *(criteria/version — verify)*\n- [ ] List for emergency/highest-priority liver transplant per organ-allocation criteria when threshold met; involve transplant hepatology/surgery early\n- [ ] Reassess transplant candidacy dynamically as clinical trajectory evolves (spontaneous recovery vs. deterioration)\n\n## Commonly-missed on documentation (what the gap-check flags)\nEtiology workup complete (acetaminophen level + autoimmune + viral panel)? · transplant center contacted\nearly, not deferred? · NAC started/considered regardless of etiology? · encephalopathy grade trended? ·\ncerebral edema precautions addressed? · CRRT-vs-IHD choice justified? · prognostic score applied to the\nlisting decision?\n\n*Sources: [AASLD Guideline: Management of Acute Liver Failure](https://www.aasld.org/practice-guidelines/management-acute-liver-failure) · [Acute Liver Failure Guidelines — PubMed 2023](https://pubmed.ncbi.nlm.nih.gov/37377263/)*\n"}, {"file": "acute-pancreatitis-iap-2025.md", "title": "Severe acute pancreatitis", "system": "GI / Hepatic", "body": "# Severe acute pancreatitis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** International Association of Pancreatology (IAP) Revised Guidelines on Acute Pancreatitis\n> 2025 — supported/endorsed by the American Pancreatic Association (APA), European Pancreatic Club (EPC),\n> Indian Pancreas Club (IPC), and Japan Pancreas Society (JPS), *Pancreatology* 2025;25(6):770-814.\n> https://pubmed.ncbi.nlm.nih.gov/40651900/\n> Corroborated by: American College of Gastroenterology (ACG) Guidelines: Management of Acute Pancreatitis,\n> *Am J Gastroenterol* 2024 — https://pubmed.ncbi.nlm.nih.gov/38857482/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (IAP, primary) / 2024 (ACG, corroborating)\n\n## Diagnosis & initial severity assessment\n- [ ] Diagnosis requires **≥2 of 3**: characteristic epigastric pain, lipase/amylase **>3× ULN**, or characteristic imaging findings\n- [ ] Reserve contrast-enhanced CT/MRI for diagnostic uncertainty or failure to improve clinically — not routine at admission; if performed, optimal at **48-72 h** for necrosis delineation *(timing — verify)*\n- [ ] Severity/organ-dysfunction scoring on admission and serially *(tool — verify local choice, e.g. SIRS/BISAP/Ranson)*\n- [ ] Identify etiology early: RUQ ultrasound for gallstones, triglycerides, alcohol history, medication review, consider need for ERCP\n- [ ] **Special-population etiologies actively considered**: pregnancy-associated, trauma-associated, and\n  metabolic (hypertriglyceridemia/hypercalcemia) AP — each has distinct management nuances *(2025 IAP\n  expanded scope — verify pathway)*\n\n## Early resuscitation & supportive care\n- [ ] **Goal-directed IV fluid resuscitation** in the first **12-24 h** (urine output, hematocrit/BUN trend)\n  — benefit diminishes beyond this window; **avoid aggressive/high-volume bolus regimens** — moderate,\n  individualized resuscitation favored *(fluid choice/rate — verify local protocol; direction of change\n  from older \"aggressive\" wording — verify)*\n- [ ] Structured **pain control protocol** followed (opioid/non-opioid choice per local practice) *(verify)*\n- [ ] **Early enteral nutrition** in severe AP to reduce infectious complications; oral feeding as soon as tolerated in mild AP; **avoid parenteral nutrition** unless enteral route is not feasible\n- [ ] Concurrent **acute cholangitis** → ERCP within **24 h** of admission\n- [ ] Monitor for and manage evolving organ dysfunction (respiratory/renal/cardiovascular); escalate level of care per severity criteria\n\n## Local complications & necrotizing pancreatitis\n- [ ] Suspect infected necrosis with clinical deterioration or failure to improve — favor CT ± selective FNA/empiric antibiotics over reflexive intervention\n- [ ] **Delay intervention** on necrotic collections into the late phase (walled-off, generally >4 weeks) unless infected necrosis with instability forces earlier action\n- [ ] **Step-up approach** preferred for infected necrosis: percutaneous or endoscopic drainage first, escalate to minimally-invasive necrosectomy only if needed — avoid primary open necrosectomy\n- [ ] Antibiotics targeted to confirmed/strongly suspected infected necrosis — **not** given prophylactically for sterile necrosis *(agent — verify)*\n- [ ] Post-ERCP pancreatitis prevention in high-risk patients: pancreatic duct stent and/or rectal NSAID *(agent/dose — verify)*\n\n## Discharge, follow-up & recurrence prevention (2025 IAP expanded domain)\n- [ ] **Discharge criteria explicitly assessed** (tolerating oral intake, pain controlled, no evidence of\n  ongoing organ dysfunction) rather than a fixed length-of-stay *(verify local criteria)*\n- [ ] **Etiology-directed recurrence prevention** planned before discharge — e.g. cholecystectomy timing\n  for gallstone AP, alcohol/lifestyle counseling, triglyceride management *(verify timing/referral pathway)*\n- [ ] **Structured follow-up** arranged (pancreatic function, imaging if indicated, nutrition) *(verify\n  local pathway)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nSeverity score documented and trended? · fluid resuscitation goal-directed and individualized (not a\nreflexive aggressive-bolus order)? · nutrition route decided (enteral preferred, parenteral avoided) and\ndocumented? · special etiology (pregnancy/trauma/metabolic) considered where relevant? · cholangitis\naddressed with ERCP timing? · necrosis intervention timing justified (late-phase/step-up, not early open\nsurgery)? · antibiotics given only for confirmed/suspected infection, not as prophylaxis? · discharge\ncriteria + recurrence-prevention plan documented, not just bed disposition?\n\n*Sources: [IAP Revised Guidelines on Acute Pancreatitis 2025 — PubMed](https://pubmed.ncbi.nlm.nih.gov/40651900/) · [IAP 2025 Guidelines — ScienceDirect](https://www.sciencedirect.com/science/article/pii/S1424390325000857) · [Updates From the 2025 IAP Acute Pancreatitis Guidelines — PubMed](https://pubmed.ncbi.nlm.nih.gov/41396828/) · [ACG Guidelines: Management of Acute Pancreatitis 2024 — corroborating](https://pubmed.ncbi.nlm.nih.gov/38857482/)*\n"}, {"file": "adhf-accahahfsa-2022.md", "title": "Acute decompensated heart failure (ADHF)", "system": "Cardiac", "body": "# Acute decompensated heart failure (ADHF) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure, American College of\n> Cardiology/American Heart Association/Heart Failure Society of America, 2022 —\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001063\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022 (cross-check against ESC 2021/2023\n> focused update if practicing outside a US-guideline context; check for a newer edition periodically)\n\n## Presentation assessment — congestion + precipitant\n- [ ] **Confirm the diagnosis / severity of congestion** clinically (JVP, edema, orthopnea, rales) ±\n  **point-of-care ultrasound** (lung B-lines, IVC) *(adjunct — verify local practice)*\n- [ ] **Natriuretic peptide** (BNP/NT-proBNP) at presentation — supports diagnosis; low-normal value\n  argues against ADHF *(Class I diagnostic use — verify threshold, age/renal-adjusted for NT-proBNP)*\n- [ ] **Classify hemodynamic profile** — wet/dry × warm/cold — to steer diuretic vs. vasodilator vs.\n  inotrope decision\n- [ ] **Identify the precipitant** — ACS/ischemia, arrhythmia (esp. AF with RVR), medication\n  non-adherence, dietary indiscretion, uncontrolled hypertension, infection, worsening renal\n  function, thyroid disease, new/worsening valve lesion, NSAID or other cardiotoxic drug exposure\n- [ ] **ECG** and **troponin** to screen for ischemic trigger; **CXR**; basic labs (renal function,\n  electrolytes, TSH if new diagnosis)\n\n## Decongestion — IV diuretic strategy\n- [ ] **IV loop diuretic** first-line for fluid overload *(Class I)* — if diuretic-naïve, dose per\n  guideline-referenced starting dose *(verify)*; if on chronic oral diuretic, IV dose ≥ home oral\n  dose-equivalent *(verify)*\n- [ ] **Reassess diuretic response early** (~6 h / first AM void) — urine output and/or **spot\n  urinary sodium** to confirm adequate natriuresis *(verify threshold — e.g. spot Na ~50–70 mmol/L)*\n- [ ] **Inadequate response** → escalate: increase loop dose, switch to continuous infusion, or add\n  **second-site nephron blockade** (thiazide-type, e.g. metolazone) *(Class IIa)*\n- [ ] **Daily reassessment of decongestion**: weight, strict ins/outs or net fluid balance, orthostatic\n  vitals, renal function/electrolytes — adjust diuretic dose daily, do not run on autopilot\n- [ ] **Track renal function trend** — a rising creatinine alongside good diuresis/hemoconcentration\n  is expected and should not automatically stop diuresis *(clinical judgment — verify)*\n\n## Vasoactive therapy\n- [ ] **IV vasodilator** (nitroglycerin/nitroprusside) as adjunct to diuretics if **hypertensive** or\n  persistently congested despite diuresis *(Class IIb)* — avoid if hypotensive\n- [ ] **Inotropic support** only if **cardiogenic shock / low-output state** with hypoperfusion\n  refractory to volume optimization *(Class I when shock present — reserve for shock/bridge, not\n  routine congestion)*\n- [ ] Consider **mechanical circulatory support / ICU-level care and early cardiology involvement**\n  if cardiogenic shock or refractory low output *(verify local escalation pathway)*\n\n## Avoid harm\n- [ ] **Discontinue/avoid NSAIDs** — worsen congestion and renal function\n- [ ] **Avoid non-dihydropyridine CCBs** (verapamil, diltiazem) in HFrEF\n- [ ] **Avoid thiazolidinediones**; use caution with other agents known to precipitate/worsen HF\n- [ ] Review medication list for **other cardiotoxic or fluid-retaining agents** on admission\n\n## GDMT — continue, initiate, do not routinely stop\n- [ ] **Continue home GDMT** through hospitalization unless hemodynamically contraindicated\n  (symptomatic hypotension, worsening AKI, hyperkalemia) — do not reflexively discontinue on\n  admission\n- [ ] **Beta-blocker**: continue if already tolerated; do not initiate during active/unstable\n  decongestion — start/resume once euvolemic and hemodynamically stable, before discharge\n- [ ] **SGLT2 inhibitor**: consider **initiating in-hospital** once stabilizing, regardless of\n  diabetes status — evidence supports early in-hospital start with acceptable safety *(verify\n  renal/hemodynamic criteria and local protocol)*\n- [ ] **ARNI/ACEi/ARB**: initiate or up-titrate toward target once stable and renal\n  function/potassium permit — ARNI preferred over ACEi/ARB where feasible *(Class I in HFrEF)*\n- [ ] **MRA**: add once renal function/potassium allow, if not already on board\n- [ ] Aim for **all four pillars of GDMT** to be addressed (initiated, continued, or explicitly\n  deferred with reason documented) **before discharge**, not deferred to outpatient follow-up\n\n## Discharge readiness & transition of care\n- [ ] **Objective euvolemia** achieved (or clear plan/weight documented) before discharge — not\n  symptom-based alone\n- [ ] **VTE thromboprophylaxis** during admission unless contraindicated\n- [ ] **Discharge weight, target dry weight, and oral diuretic regimen** documented explicitly\n- [ ] **Repeat labs pre-discharge** (renal function/electrolytes) after diuresis and GDMT changes\n- [ ] **Early follow-up visit** — target **within 7–14 days** of discharge *(Class I — verify local\n  target, some pathways target ≤7 days)*\n- [ ] **Referral to HF disease-management program / HF clinic**, particularly for HFrEF or recurrent\n  hospitalization *(Class I)*\n- [ ] **Patient education**: daily weights, sodium/fluid guidance, symptom action plan, medication\n  adherence counseling\n- [ ] **Cardiac rehab referral** where eligible\n- [ ] Address the **identified precipitant** with a concrete plan (e.g., rate/rhythm control,\n  revascularization workup, infection treatment completed, adherence support)\n\n## Commonly-missed on documentation (what the gap-check flags)\nPrecipitant explicitly named? · daily weight + net fluid balance charted? · diuretic response\nreassessed (UOP/spot Na) not just \"continue diuresis\"? · renal trend interpreted, not just flagged? ·\nNSAID/harmful-drug review done? · all 4 GDMT pillars addressed with reason if deferred? · SGLT2i\ninitiation considered in-hospital? · discharge weight/dry-weight documented? · follow-up visit booked\nwithin 7–14 days? · HF clinic/cardiac rehab referral placed?\n\n*Sources: [2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001063) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/35363499/) · [ACC/AHA/HFSA 2022 and ESC 2021 guidelines on heart failure — comparison (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC10192289/) · [2023 Focused Update of the 2021 ESC Guidelines for acute and chronic heart failure — Eur Heart J](https://academic.oup.com/eurheartj/article/44/37/3627/7246292)*\n"}, {"file": "adrenal-crisis-endocrine-society-2016.md", "title": "Adrenal crisis", "system": "Renal / Metabolic / Endo", "body": "# Adrenal crisis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Diagnosis and Treatment of Primary Adrenal Insufficiency: An Endocrine Society Clinical\n> Practice Guideline (Bornstein SR et al.), *J Clin Endocrinol Metab* 2016;101(2):364–389. Supplemented by\n> Guidance for the prevention and emergency management of adult patients with adrenal insufficiency\n> (Arlt W et al., UK), *Endocr Connect* 2020.\n> https://www.endocrine.org/clinical-practice-guidelines/primary-adrenal-insufficiency\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2016 / 2020\n\n## Recognition — treat before confirming\n- [ ] **Do not wait for cortisol result** — treat empirically on clinical suspicion (hypotension/shock, vomiting, abdominal pain, hyponatremia/hyperkalemia, hypoglycemia, known steroid-dependent patient with intercurrent illness)\n- [ ] Random cortisol / ACTH drawn **before** first hydrocortisone dose if it does not delay treatment\n- [ ] Precipitant identified (infection, surgery, trauma, missed doses, GI illness limiting absorption, physiological stress)\n\n## Immediate treatment\n- [ ] **Hydrocortisone 100 mg IV/IM bolus immediately** (**50 mg/m² for children**) *(verify dose)*\n- [ ] **IV crystalloid resuscitation** — isotonic saline, volume per hemodynamic status *(verify rate — typically rapid initial bolus then reassess)*\n- [ ] **Continuing hydrocortisone**: **200 mg/24h continuous IV infusion**, OR **50 mg IV/IM every 6 h** if infusion unavailable *(verify — dose tapers over following days as clinical status allows)*\n- [ ] **Correct hypoglycemia** with IV dextrose as needed\n- [ ] Correct hyponatremia/hyperkalemia — largely responds to hydrocortisone + fluids; treat per separate electrolyte protocol if severe/symptomatic\n- [ ] Precipitating illness actively treated (e.g. antibiotics for sepsis) in parallel\n\n## Ongoing management & taper\n- [ ] Taper hydrocortisone to usual maintenance/stress dosing over **1–3 days** once clinically stable, guided by precipitant resolution *(verify schedule)*\n- [ ] Mineralocorticoid (fludrocortisone) resumed once hydrocortisone dose is ≤~50 mg/day (glucocorticoid dose at this level provides sufficient mineralocorticoid activity above that) *(verify)*\n- [ ] Underlying diagnosis (primary vs secondary AI) confirmed/reviewed once patient stable — do not delay treatment for this\n- [ ] ICU/HDU-level monitoring while hemodynamically unstable\n\n## Prevention — before discharge (crisis is often preventable)\n- [ ] **Sick-day rules education**: double/triple oral glucocorticoid dose during intercurrent illness/fever\n- [ ] **Steroid emergency self-injection kit** (IM hydrocortisone) prescribed and patient/family trained on use\n- [ ] **Medical alert** (bracelet/card) confirmed in place\n- [ ] Steroid dependence documented prominently in the chart to prevent future missed/delayed dosing during admissions or procedures\n- [ ] Peri-operative/procedural stress-dose steroid plan documented if further procedures anticipated\n- [ ] Follow-up with endocrinology arranged\n\n## Commonly-missed on documentation (what the gap-check flags)\nHydrocortisone given empirically without waiting for cortisol? · precipitant named and treated? · taper plan documented? ·\nsick-day rules + emergency kit reviewed before discharge? · medical alert confirmed?\n\n*Sources: [Diagnosis and Treatment of Primary Adrenal Insufficiency: An Endocrine Society Clinical Practice Guideline — PubMed](https://pubmed.ncbi.nlm.nih.gov/26760044/) · [Primary Adrenal Insufficiency Guideline Resources — Endocrine Society](https://www.endocrine.org/clinical-practice-guidelines/primary-adrenal-insufficiency) · [Guidance for the prevention and emergency management of adult patients with adrenal insufficiency — PubMed](https://pubmed.ncbi.nlm.nih.gov/32675141/)*\n"}, {"file": "afib-flutter-rvr-acchrs-2023.md", "title": "Atrial fibrillation / flutter with RVR", "system": "Cardiac", "body": "# Atrial fibrillation / flutter with RVR — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2023 ACC/AHA/ACCP/HRS Guideline for the Diagnosis and Management of Atrial Fibrillation\n> (Joglar JA et al., ACC/AHA Joint Committee on Clinical Practice Guidelines), *Circulation* 2023;148:e1–e156.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001193\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Immediate assessment — hemodynamic stability first\n- [ ] Confirm rhythm on 12-lead ECG; look specifically for **pre-excitation (WPW)** — irregular, very rapid, wide-complex pattern changes management below\n- [ ] Screen for instability **attributable to the arrhythmia**: hypotension, altered mentation, ischemic pain, acute pulmonary edema/shock\n- [ ] **Unstable → immediate synchronized electrical cardioversion** *(COR 1)* — confirm shock is sync'd to QRS (avoid inducing VF); biphasic **≥200 J** initial energy reasonable for elective shocks *(verify)*\n- [ ] Continuous telemetry throughout acute management and cardioversion\n\n## Identify & treat the reversible precipitant\n- [ ] Screen for and treat trigger in parallel with rate/rhythm control: sepsis/infection, hypovolemia, hypoxia, electrolyte derangement (K⁺/Mg²⁺), thyrotoxicosis, PE, post-op state, alcohol/withdrawal, ACS\n- [ ] New AF discovered during **critical illness/sepsis** is common (~6–22% in severe sepsis) — treat as *acute/secondary AF*, distinct from established chronic AF, with high risk of recurrence and increased mortality\n- [ ] Correcting the precipitant and optimizing hemodynamics is part of the acute bundle, not a deferred step\n\n## Acute rate control (hemodynamically stable) / rhythm control\n- [ ] First-line: **beta-blocker OR non-dihydropyridine CCB** (diltiazem/verapamil) — restrict non-DHP CCB to **EF >40%** *(verify)*\n- [ ] **Harm — avoid non-DHP CCBs** in known moderate/severe LV systolic dysfunction, with or without decompensated HF\n- [ ] If beta-blocker/non-DHP CCB ineffective or contraindicated: **digoxin**, alone or in combination\n- [ ] **IV magnesium** as an adjunct to standard agents is reasonable to help achieve/maintain rate control\n- [ ] Critically ill and/or decompensated HF, with first-line agents ineffective/contraindicated: **IV amiodarone** may be considered *(weigh cardioversion/stroke risk if AF duration uncertain — verify dose)*\n- [ ] **Pre-excited AF (WPW) — contraindicated: AV-nodal blockers** (verapamil, diltiazem, amiodarone, digoxin, adenosine, beta-blockers) — risk of accelerated pathway conduction → VF. Unstable → electrical cardioversion; stable → IV ibutilide or procainamide; arrange accessory-pathway ablation\n- [ ] Rhythm-control alternative: electrical (or pharmacologic) cardioversion is reasonable as an initial strategy in stable patients too, e.g. if AV-dyssynchrony poorly tolerated or rate control inadequate — not reserved only for instability\n\n## Anticoagulation decision & follow-up planning\n- [ ] Assess stroke risk (**CHA2DS2-VASc**) and bleeding-risk factors — bleeding-risk scores (HAS-BLED etc.) guide risk-factor modification, **not** exclusion from anticoagulation\n- [ ] AF duration **≥48 h or unknown** → **≥3 weeks uninterrupted anticoagulation OR imaging (TEE/cardiac CT) to exclude LA/LAA thrombus** before elective cardioversion; continue anticoagulation **≥4 weeks post-cardioversion** regardless of rhythm outcome\n- [ ] AF duration **<48 h**: precardioversion imaging reasonable if CHA2DS2-VASc ≥2 (or equivalent); if low risk (0–1) and <12 h, benefit of imaging/pericardioversion anticoagulation is uncertain\n- [ ] **New-onset AF secondary to critical illness/sepsis**: benefit of anticoagulation *during* the acute illness for stroke prevention is **uncertain** *(COR 2b)* — CHA2DS2-VASc performs poorly in this population and anticoagulation has been associated with more bleeding without measured stroke reduction; individualize\n- [ ] Document plan for **outpatient rhythm/thromboembolic-risk reassessment and OAC decision** at discharge — recurrence after an acute precipitant is common (reported up to ~68% at 5 y), and recurrent AF carries elevated HF/stroke/mortality risk even after apparent resolution\n\n## Commonly-missed on documentation (what the gap-check flags)\nPrecipitant identified/treated? · hemodynamic instability explicitly assessed (not just rate)? · WPW/pre-excitation excluded on ECG before choosing an AV-nodal blocker? ·\nrate-control agent choice justified against EF/HF status? · CHA2DS2-VASc + bleeding risk documented? · anticoagulation plan (pre/post-cardioversion timing, or deferred-in-critical-illness rationale) stated? · outpatient follow-up/OAC-decision plan arranged?\n\n*Sources: [2023 ACC/AHA/ACCP/HRS Guideline for the Diagnosis and Management of Atrial Fibrillation — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001193) · [2023 Guideline for Diagnosis and Management of Atrial Fibrillation: Key Perspectives — ACC](https://www.acc.org/latest-in-cardiology/ten-points-to-remember/2023/11/27/19/46/2023-acc-guideline-for-af-gl-af)*\n"}, {"file": "ahrf-hfnc-niv-ers-ats-2017.md", "title": "Acute hypoxemic respiratory failure — general approach + HFNC/NIV", "system": "Respiratory", "body": "# Acute hypoxemic respiratory failure — general approach + HFNC/NIV — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Official ERS/ATS Clinical Practice Guidelines: Noninvasive Ventilation for Acute Respiratory\n> Failure (Rochwerg B et al.), *European Respiratory Journal* 2017; **plus** ERS Clinical Practice\n> Guidelines: High-Flow Nasal Cannula in Acute Respiratory Failure (Oczkowski S et al.), *European\n> Respiratory Journal* 2022.\n> https://www.thoracic.org/statements/guideline-implementation-tools/non-invasive-ventilation-for-acute-resp-failure.php\n> · https://pubmed.ncbi.nlm.nih.gov/34649974/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2017 (NIV) / 2022 (HFNC)\n\n## Initial assessment & etiology-driven choice\n- [ ] Classify **hypoxemic vs hypercapnic** failure and identify the driving cause — determines which\n  modality is favored\n- [ ] **HFNC over conventional oxygen** in de novo hypoxemic ARF *(strong rec, moderate certainty)*\n- [ ] **NIV first-line** for: **COPD exacerbation with respiratory acidosis**, **cardiogenic pulmonary\n  edema**, and **immunocompromised patients with hypoxemic ARF** *(strong recs per guideline)*\n- [ ] **NIV over HFNC** in patients at **high risk of extubation failure** unless NIV contraindicated\n\n## Contraindication / suitability screen (before HFNC or NIV)\n- [ ] Airway protection intact — no impending arrest, uncontrolled vomiting, or inability to protect airway\n  *(verify local exclusion list)*\n- [ ] Hemodynamic stability adequate to trial noninvasive support\n- [ ] No facial trauma/surgery precluding mask interface (for NIV)\n- [ ] Clear plan for **immediate escalation to intubation** if trial fails — never a substitute for\n  necessary invasive ventilation\n\n## HFNC use\n- [ ] Flow and FiO₂ titrated to target SpO₂ *(verify device-specific protocol and target)*\n- [ ] Preferred over NIV in de novo hypoxemic ARF without significant hypercapnia\n- [ ] Reassess at a **defined interval** (e.g., 1–2 h) using an objective index (e.g., ROX index) *(verify\n  threshold — do not let a \"trial\" become an undocumented delay to intubation)*\n\n## NIV use\n- [ ] Interface and settings selected per etiology *(verify IPAP/EPAP or pressure-support/PEEP settings)*\n- [ ] **Postextubation prophylactic NIV** for high-risk patients (e.g., COPD, CHF, hypercapnia, obesity)\n  immediately after planned extubation *(strong rec — reduces reintubation)*\n- [ ] Monitor closely for signs of failure (worsening gas exchange, mental status, hemodynamics,\n  asynchrony) with a pre-set time-boxed reassessment\n\n## Escalation / failure criteria\n- [ ] Explicit, documented **failure criteria** and **time-to-reassess** set at initiation — not open-ended\n  *(verify local thresholds)*\n- [ ] Do not delay intubation in a deteriorating patient awaiting \"one more trial\"\n\n## Commonly-missed on documentation (what the gap-check flags)\nEtiology (hypoxemic vs hypercapnic) documented to justify modality choice? · contraindications actively\nscreened, not assumed? · reassessment time and objective failure threshold specified? · escalation plan\ndocumented before starting HFNC/NIV? · prophylactic postextubation NIV considered for high-risk patients?\n\n*Sources: [ERS/ATS 2017 NIV for Acute Respiratory Failure — implementation tools, thoracic.org](https://www.thoracic.org/statements/guideline-implementation-tools/non-invasive-ventilation-for-acute-resp-failure.php) · [ERS 2022 HFNC in Acute Respiratory Failure — PubMed](https://pubmed.ncbi.nlm.nih.gov/34649974/) · [Guideline-based management of acute respiratory failure and ARDS — PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9998250/)*\n"}, {"file": "aki-kdigo-2012.md", "title": "Acute kidney injury (incl. RRT indications)", "system": "Renal / Metabolic / Endo", "body": "# Acute kidney injury (incl. RRT indications) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** KDIGO Clinical Practice Guideline for Acute Kidney Injury, Kidney Disease: Improving\n> Global Outcomes (KDIGO), 2012 — *Kidney International Supplements* 2(1).\n> https://kdigo.org/guidelines/acute-kidney-injury/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2012 (a KDIGO 2026 AKI/AKD update is in public\n> review as of this compilation — recheck kdigo.org for the finalized replacement)\n\n## Staging (document the stage — drives escalation)\n- [ ] **Stage 1** — creatinine **1.5–1.9× baseline** or **≥0.3 mg/dL (26.5 µmol/L) rise** *(verify local unit)*, OR urine output **<0.5 mL/kg/h × 6–12 h**\n- [ ] **Stage 2** — creatinine **2.0–2.9× baseline**, OR urine output **<0.5 mL/kg/h × ≥12 h**\n- [ ] **Stage 3** — creatinine **3.0× baseline** or rise to **≥4.0 mg/dL**, or **RRT initiated**, OR urine output **<0.3 mL/kg/h × ≥24 h** or **anuria ×≥12 h**\n- [ ] Baseline creatinine established/estimated (do not stage against an unknown baseline without noting the assumption)\n\n## Initial workup & prevention\n- [ ] Identify and treat pre-, intra-, post-renal cause; review med list for nephrotoxins (NSAIDs, aminoglycosides, contrast, ACEi/ARB — hold as appropriate)\n- [ ] Volume status assessed; **isotonic crystalloids preferred over colloids** for resuscitation *(1B — verify)*\n- [ ] **Avoid diuretics to prevent AKI** *(1B)*; use only for volume-overload management, not to \"treat\" AKI *(2C)*\n- [ ] Vasopressors added alongside fluids for vasomotor/septic shock *(1C — target MAP per local protocol, verify)*\n- [ ] Nephrotoxic drug dosing adjusted to renal function; aminoglycosides once-daily dosing preferred with levels if course >24 h *(verify)*\n- [ ] Contrast-associated AKI prevention considered where relevant (IV isotonic fluids periprocedure — dose/regimen *(verify)*; avoid N-acetylcysteine for post-surgical prophylaxis per guideline)\n\n## Monitoring & metabolic management\n- [ ] Daily creatinine, urine output, fluid balance trended and documented\n- [ ] Electrolytes (K+, phosphate, bicarbonate) and acid-base monitored — treat hyperkalemia per separate protocol\n- [ ] Nutrition plan — avoid unnecessary protein/fluid restriction unless RRT unavailable *(verify per local dietitian input)*\n- [ ] Bladder outlet obstruction excluded if oliguric/anuric\n\n## RRT — indications & modality (document the indication explicitly)\n- [ ] **Emergent indications** (any one): refractory hyperkalemia, severe metabolic acidosis, refractory volume overload (e.g. pulmonary edema unresponsive to diuretics), uremic complications (pericarditis, encephalopathy, uremic bleeding), certain intoxications *(specific thresholds — verify against local nephrology protocol; KDIGO does not fix a single creatinine/BUN cutoff)*\n- [ ] Decision to start RRT considers the **full clinical context and trend**, not laboratory values in isolation *(verify)*\n- [ ] Modality selected: CRRT vs intermittent HD vs hybrid — **CRRT suggested over intermittent RRT** for hemodynamically unstable patients and those with acute brain injury/raised ICP/cerebral edema *(2B — verify)*\n- [ ] CRRT effluent (dialysis) dose target **20–25 mL/kg/h delivered** *(1A — verify prescribed vs delivered dose)*\n- [ ] Intermittent/extended RRT dose target **Kt/V ≈3.9/week** *(1A — verify)*\n- [ ] **Bicarbonate-based (not lactate-based) dialysate/replacement fluid** if liver failure and/or lactic acidemia *(2B)*\n- [ ] Anticoagulation strategy for circuit chosen (citrate vs heparin vs none) and documented\n- [ ] Vascular access sited appropriately; line-associated complications monitored\n\n## Commonly-missed on documentation (what the gap-check flags)\nAKI stage documented with baseline stated? · nephrotoxin review done? · fluid strategy (isotonic, no prophylactic diuretics)? ·\nRRT indication explicitly named (not just \"worsening labs\")? · modality + dose (effluent rate / Kt/V) specified? ·\nelectrolytes trended? · nephrology consulted for stage 2–3?\n\n*Sources: [KDIGO Clinical Practice Guideline for Acute Kidney Injury (2012)](https://kdigo.org/guidelines/acute-kidney-injury/) · [Diagnosis, evaluation, and management of acute kidney injury: a KDIGO summary (Part 1) — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC4057151/) · [KDIGO 2026 AKI/AKD Guideline — Public Review Draft](https://kdigo.org/wp-content/uploads/2026/03/KDIGO-2026-AKI-AKD-Guideline-Public-Review-Draft-March-2026.pdf)*\n"}, {"file": "alcohol-withdrawal-asam-2020.md", "title": "Alcohol withdrawal (severe / DTs)", "system": "Other", "body": "# Alcohol withdrawal (severe / DTs) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** The ASAM Clinical Practice Guideline on Alcohol Withdrawal Management (American Society of\n> Addiction Medicine), *Journal of Addiction Medicine* 2020;14(3S Suppl 1):1–72.\n> https://www.asam.org/quality-care/clinical-guidelines/alcohol-withdrawal-management-guideline\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2020 (check for a newer edition periodically)\n\n## Assessment\n- [ ] **Identify risk factors for severe/complicated withdrawal** — prior DTs/seizures, heavy/prolonged use, concurrent illness, older age\n- [ ] Use a **validated severity scale (CIWA-Ar or equivalent)** to guide symptom-triggered dosing — *verify unit's tool of choice*\n- [ ] **Screen for and treat concurrent conditions** masking or mimicking withdrawal (infection, GI bleed, hepatic encephalopathy, head injury, other substance co-ingestion)\n- [ ] **Baseline labs** — electrolytes (incl. Mg, PO4), glucose, LFTs, consider hepatic synthetic function if cirrhosis suspected\n\n## Immediate management\n- [ ] **Thiamine before/with any glucose** administration — <verify dose/route, e.g. 200–500 mg IV — prevent precipitating Wernicke's>\n- [ ] **Benzodiazepines are first-line** — symptom-triggered (CIWA-guided) dosing preferred over fixed schedule where feasible — <agent/dose — verify local protocol>\n- [ ] **Escalate dosing aggressively** for severe withdrawal/DTs — front-load rather than under-dose\n- [ ] **Correct electrolyte abnormalities** (Mg, K, PO4) — common in withdrawal and worsen seizure/arrhythmia risk\n\n## Refractory / severe withdrawal (DTs, benzodiazepine-resistant)\n- [ ] Consider **phenobarbital** as an adjunct or alternative strategy in benzodiazepine-refractory withdrawal — *verify dosing/protocol*\n- [ ] Consider **adjunctive alpha-2 agonists (dexmedetomidine/clonidine)** for autonomic symptoms — **not as monotherapy** for seizure/DT prevention\n- [ ] Consider **propofol infusion + intubation** for truly refractory DTs unresponsive to escalating benzodiazepine/phenobarbital dosing\n- [ ] Avoid **antipsychotics as sole agent** — do not lower seizure threshold as primary/only therapy\n\n## Ongoing ICU management\n- [ ] **Continuous reassessment** of withdrawal severity and sedation depth — avoid oversedation/respiratory depression\n- [ ] **Seizure precautions**; treat seizures per protocol and reassess adequacy of withdrawal regimen\n- [ ] **Nutrition** — assess for malnutrition, ongoing thiamine/folate/multivitamin repletion\n- [ ] **Plan for taper and transition** — de-escalation plan once symptoms controlled; addiction medicine / social work referral before discharge\n\n## Commonly-missed on documentatio
