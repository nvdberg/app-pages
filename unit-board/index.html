min** for recurrent HE or inadequate response to lactulose alone *(dose — verify)*\n- [ ] Airway protection if high-grade HE (grade III-IV) impairs protective reflexes\n- [ ] Avoid protein restriction — maintain adequate nutrition throughout\n\n### Variceal bleed in decompensated cirrhosis (rescue / ongoing care)\n- [ ] Initial UGIB bundle applies (see `upper-gi-bleed-acg-2021.md`) — vasoactive drug + antibiotics + EVL within 12 h\n- [ ] For refractory/recurrent bleeding or a high-risk profile (e.g. Child-Pugh C, or B with active bleeding at endoscopy): consider **early/pre-emptive TIPS** *(criteria — verify)*\n- [ ] Assess candidacy for TIPS/variceal embolization/BRTO per hepatic reserve and shunt-related risk (especially HE risk)\n- [ ] Establish secondary prophylaxis (non-selective beta-blocker + EVL) before discharge\n\n## Pearls & pitfalls\n- [ ] Bacterial infection/sepsis is a **precipitant** of HRS, not an exclusion criterion — don't rule out HRS just because an infection is found; treat the infection **and** pursue the HRS workup in parallel *(verify)* — Deranged Physiology: \"Hepatorenal syndrome\"\n- [ ] Albumin monotherapy for established HRS has a low reported response rate (~10% resolution in some series); terlipressin + albumin achieves substantially higher reversal rates in comparative data — don't rely on albumin alone once HRS is established *(dose/local availability — verify)* — Deranged Physiology: \"Hepatorenal syndrome\"\n- [ ] Cirrhotic coagulopathy is \"rebalanced\" — an elevated INR does not equal bleeding risk and does not reliably predict procedural bleeding; routine FFP to \"correct\" the INR is of unproven benefit and risks volume overload — consider platelet count and fibrinogen instead if intervening (reported targets: platelets ~50-60k, fibrinogen >150-200 mg/dL) *(verify)* — EMCrit/PulmCrit: \"Coagulopathy management in the bleeding cirrhotic: Seven pearls and one crazy idea\"\n- [ ] Ammonia has poor sensitivity/specificity for hepatic encephalopathy in general — a very low ammonia in a stuporous/comatose patient should prompt a search for an alternative diagnosis, but a normal level does **not** exclude mild-moderate HE *(verify)* — EMCrit IBCC: \"Hepatic encephalopathy (HE) in chronic liver disease\"\n- [ ] Polyethylene glycol (PEG) lavage may resolve HE faster than lactulose alone in moderate-severe cases and avoids the hypernatremia/volume-depletion risk of aggressive lactulose dosing — consider as an adjunct or alternative *(local protocol — verify)* — EMCrit IBCC: \"Hepatic encephalopathy (HE) in chronic liver disease\"\n- [ ] Patients with HE are exquisitely sensitive to sedatives — avoid benzodiazepines/opioids where possible; if intubation is required, ultra-short-acting agents (propofol/dexmedetomidine) allow more predictable neuro reassessment *(verify)* — EMCrit IBCC: \"Hepatic encephalopathy (HE) in chronic liver disease\"\n\n## Commonly-missed on documentation (what the gap-check flags)\nDiagnostic paracentesis performed on admission for any decompensation sign? · SBP albumin given on the\ncorrect days? · secondary SBP prophylaxis planned? · HRS work-up includes precipitant search + volume\nchallenge before vasoconstrictor started? · HE precipitant actively searched (not just lactulose given\nreflexively)? · rifaximin considered for recurrent HE? · TIPS candidacy addressed for high-risk variceal\nbleed?\n\n*Sources: [AASLD 2021 Practice Guidance: Ascites, SBP, and Hepatorenal Syndrome](https://pubmed.ncbi.nlm.nih.gov/33942342/) · [EASL Clinical Practice Guidelines: Hepatic Encephalopathy 2022](https://pubmed.ncbi.nlm.nih.gov/35724930/) · [AASLD Practice Guidance: Portal Hypertension and Varices in Cirrhosis 2023](https://pubmed.ncbi.nlm.nih.gov/37870298/) · FOAMed pearls: [Deranged Physiology — Hepatorenal syndrome](https://derangedphysiology.com/main/required-reading/gastrointestinal-intensive-care/Chapter-522/hepatorenal-syndrome) · [EMCrit/PulmCrit — Coagulopathy management in the bleeding cirrhotic](https://emcrit.org/pulmcrit/coagulopathy-bleeding-cirrhotic-inr/) · [EMCrit IBCC — Hepatic encephalopathy](https://emcrit.org/ibcc/he/)*\n"}, {"file": "dic-isth-2025.md", "title": "Disseminated intravascular coagulation (DIC)", "system": "Other", "body": "# Disseminated intravascular coagulation (DIC) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Updated definition and scoring of disseminated intravascular coagulation in 2025:\n> communication from the ISTH SSC Subcommittee on Disseminated Intravascular Coagulation,\n> *Journal of Thrombosis and Haemostasis* 2025 (DOI 10.1016/j.jtha.2025.03.038).\n> https://pubmed.ncbi.nlm.nih.gov/40216223/\n> **Supersedes** the 2013 harmonized ISTH/Wada criteria (previous file, archived) — the 2001 fixed\n> \"overt-DIC-only\" model is replaced by a **phase-based framework** (pre-DIC → early-phase DIC → overt\n> DIC) intended to enable earlier detection and treatment.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Systemic tissue-factor exposure (sepsis, trauma, malignancy, obstetric catastrophe) drives uncontrolled, widespread thrombin generation → simultaneous, paradoxical microthrombosis **and** consumptive coagulopathy.\n- Microthrombi occlude small vessels → organ ischemia/dysfunction; concurrent consumption of platelets, fibrinogen, and clotting factors plus secondary (consumptive) fibrinolysis → bleeding tendency.\n- Both processes run in parallel, not sequentially — the same patient can thrombose and bleed at once, which is why the phase-based (pre-DIC → overt) framework aims to catch the compensated stage before decompensation.\n- Why treat the underlying trigger first: DIC is a downstream consequence, not a primary disease — it resolves only when the trigger is controlled.\n- Why replace consumed factors/platelets selectively (bleeding or pre-procedure) rather than empirically: replacement without source control just refuels the thrombotic process.\n\n## Diagnosis / definition — updated definition & phase-based framework\n- [ ] **Treat DIC as a clinical + laboratory diagnosis** — never lab values in isolation\n- [ ] New ISTH definition applied: DIC is an **acquired, life-threatening intravascular disorder**\n  characterized by **systemic coagulation activation, dysregulated fibrinolysis, and endothelial\n  injury**, resulting in **microthrombosis** — progressing from a potentially asymptomatic early\n  phase to an advanced phase with hemorrhage and/or organ dysfunction\n- [ ] **Phase assigned and documented** — pre-DIC / early-phase / overt — not just \"DIC present/absent\"\n- [ ] **Identify and document the underlying trigger** (sepsis, trauma, malignancy/APL, obstetric\n  catastrophe, severe trauma/burns) — this determines both prognosis and specific management\n- [ ] **Serial coagulation panels** (platelets, PT/INR, fibrinogen, D-dimer) to trend trajectory and\n  phase transition — not a one-off test\n\n### Pre-DIC (at-risk stage)\n- [ ] Patient identified as **at-risk by underlying condition** (e.g. sepsis, major trauma, APL) before\n  any formal score threshold is met — triggers heightened surveillance, not yet treatment *(verify —\n  no dedicated ISTH point-score for this stage; identification is clinical/risk-factor based)*\n\n### Early-phase DIC — use the ISTH **SIC (Sepsis-Induced Coagulopathy) score** as the early marker\n- [ ] Platelet count: **<100 ×10⁹/L = 2 pts**, **100–<150 ×10⁹/L = 1 pt**\n- [ ] PT-INR: **>1.4 = 2 pts**, **>1.2–≤1.4 = 1 pt**\n- [ ] SOFA score: **≥2 = 2 pts**, **1 = 1 pt**\n- [ ] **SIC score ≥4** (with platelet + PT-INR subtotal **>2**) **= early-phase DIC / SIC** *(verify —\n  D-dimer/fibrinogen intentionally omitted at this stage)*\n\n### Overt DIC — updated ISTH score (max 8 pts; ≥5 = overt DIC)\n- [ ] Platelet count: **<50 ×10⁹/L = 2 pts**, **50–<100 ×10⁹/L = 1 pt**\n- [ ] **D-dimer** (revised for 2025): **>7× ULN = 3 pts**, **>3× ULN = 2 pts** *(replaces the old\n  qualitative \"moderate/strong rise\" fibrin-marker scoring)*\n- [ ] PT prolongation: **≥6 s = 2 pts**, **≥3–<6 s = 1 pt**\n- [ ] Fibrinogen (Clauss): **<1 g/L (100 mg/dL) = 1 pt**\n- [ ] **Total ≥5 = consistent with overt DIC** *(verify against source; modified score exists for pregnancy)*\n\n## Key labs & workup\n- [ ] **Serial platelet count** — often the earliest-falling marker, ahead of other coagulopathy signs; trend it, not just a single value\n- [ ] **PT/INR and aPTT** — can be **normal in >50% of DIC cases**, so a normal coag panel does **not** exclude DIC *(verify)* — do not rely on these alone for true anticoagulant/procoagulant balance\n- [ ] **Fibrinogen (Clauss)** — only **~25% sensitive** for DIC; a normal fibrinogen does not exclude the diagnosis (infection itself raises fibrinogen as an acute-phase reactant, so a *falling* trend from an elevated baseline is more informative than a single \"normal\" value) *(verify)*\n- [ ] **D-dimer** — essentially always elevated in true DIC; a normal D-dimer argues strongly against the diagnosis *(verify against local assay characteristics)*\n- [ ] **Peripheral blood smear** — screen for schistocytes (microangiopathic picture) and to help distinguish DIC from other consumptive/microangiopathic processes (TTP/HUS, HLH)\n- [ ] **Antithrombin level** where available — low levels can precede overt consumptive coagulopathy and drive **heparin resistance**; not routine everywhere — *verify local availability*\n- [ ] **Blood gas/lactate** for organ-dysfunction context (feeds SOFA component of the SIC score above)\n- [ ] **Cultures/imaging directed at the underlying trigger** — sepsis source, malignancy workup (incl. APL if leukemia suspected), obstetric cause, trauma burden — identifying the driver is itself part of the workup, not just the treatment step below\n\n## Management\n### Cornerstone of management\n- [ ] **Treat the underlying condition aggressively** — this is the single most important intervention;\n  DIC will not resolve on transfusion alone\n- [ ] Classify the patient as **bleeding-predominant** vs **thrombosis-predominant** vs **non-bleeding\n  critically ill** — management diverges significantly regardless of phase\n\n### Bleeding-predominant DIC\n- [ ] **Transfuse platelets/plasma/cryoprecipitate only in patients who are actively bleeding** (or at\n  high procedural bleeding risk) — **do not correct labs alone in a non-bleeding patient**\n- [ ] **Fresh frozen plasma** to replace clotting factors if bleeding with prolonged PT/aPTT — *verify dose/trigger*\n- [ ] **Cryoprecipitate/fibrinogen concentrate** if fibrinogen critically low and bleeding — *verify trigger, e.g. <1.5 g/L*\n- [ ] **Platelet transfusion** if bleeding and thrombocytopenic — *verify institutional threshold*\n- [ ] **Avoid antifibrinolytics (e.g. tranexamic acid)** in typical DIC — reserve for specific\n  hyperfibrinolysis-predominant presentations (e.g. APL-associated DIC) under specialist guidance\n\n### Non-bleeding / thrombosis-predominant DIC (incl. early-phase/SIC)\n- [ ] **VTE prophylaxis with prophylactic-dose heparin or LMWH** in critically ill, non-bleeding\n  DIC/SIC patients — *verify contraindications*\n- [ ] **Do not withhold VTE prophylaxis** purely because the coagulation panel is abnormal, if the\n  patient is not actively bleeding\n- [ ] Consider **antithrombin or recombinant thrombomodulin** only per specialist/hematology guidance\n  in select cases — evidence limited, **not routine** — *verify local availability/indication*\n- [ ] **Early-phase/pre-DIC identification prompts earlier hematology discussion**, consistent with the\n  2025 rationale that earlier detection/treatment may reduce DIC-associated mortality *(verify local uptake)*\n\n## Ongoing ICU management\n- [ ] **Hematology consult** for complex/refractory DIC, any early-phase/SIC score trending up, or when\n  the underlying trigger is unclear\n- [ ] **Reassess coagulation panel trend and phase** with each change in clinical status, not on a fixed\n  schedule alone\n- [ ] **Avoid unnecessary invasive procedures** while actively coagulopathic; plan product support\n  proactively if a procedure is required\n\n## Pearls & pitfalls\n- [ ] **TEG/ROTEM often shows an early hypercoagulable pattern (reduced R-time)** in early DIC even when traditional labs look \"reassuring\" — viscoelastic testing can reveal the true procoagulant/anticoagulant balance better than PT/INR alone; **late/fulminant DIC** can flip to a hypocoagulable tracing — Deranged Physiology / IBCC (EMCrit) *(verify local TEG/ROTEM protocol)*\n- [ ] **Don't transfuse platelets reflexively on a low number alone** — reserve for active bleeding, a planned procedure, or a very low count (some protocols cite **<10 ×10⁹/L** as an absolute floor even without bleeding) — cross-checks the guideline's \"don't correct labs alone\" point above — IBCC (EMCrit) *(verify institutional threshold)*\n- [ ] **Suspect primary hyperfibrinolysis (e.g. APL) rather than typical DIC** when fibrinogen collapses out of proportion to other markers and factor VIII is preserved/elevated (low factor VIII instead favors classic DIC) — bleeding-predominant, thrombosis-sparse phenotype — IBCC (EMCrit) *(verify — specialist/hematology interpretation)*\n- [ ] **Antithrombin depletion is a plausible driver of unexplained heparin resistance** in a DIC/sepsis patient — if UFH isn't achieving target anti-Xa/PTT despite dose escalation, consider checking antithrombin rather than just pushing the heparin dose further — IBCC (EMCrit) *(verify local availability of antithrombin assay/concentrate)*\n- [ ] **A single \"normal\" fibrinogen or coag panel doesn't clear a patient** — in sepsis, fibrinogen is an acute-phase reactant, so a *falling trend* from an elevated baseline is the meaningful signal, not the absolute value — IBCC (EMCrit)\n- [ ] **DDAVP is relatively contraindicated** if hyperfibrinolysis is suspected — it can worsen the fibrinolytic drive rather than help — IBCC (EMCrit) *(verify — specialist input before use in any DIC-adjacent bleeding)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nUnderlying trigger identified and being treated? · phase (pre-DIC/early-phase/overt) explicitly staged,\nnot just \"DIC yes/no\"? · SIC score used to flag early-phase disease in sepsis? · updated D-dimer\nthresholds applied in the overt score? · bleeding vs non-bleeding phenotype stated? · transfusion given\nonly for bleeding/procedural risk (not lab-value alone)? · VTE prophylaxis addressed in non-bleeding\npatients? · hematology consulted for refractory/unclear/early-phase cases?\n\n*Sources: [Updated definition and scoring of disseminated intravascular coagulation in 2025 — J Thromb Haemost / PubMed](https://pubmed.ncbi.nlm.nih.gov/40216223/) · [ISTH DIC Score 2025 — Practical Haemostasis](https://practical-haemostasis.com/Clinical%20Prediction%20Scores/Formulae%20code%20and%20formulae/Formulae/DIC/isth_dic_score_2025.html) · [ISTH SIC Score 2025 — Practical Haemostasis](https://practical-haemostasis.com/Clinical%20Prediction%20Scores/Formulae%20code%20and%20formulae/Formulae/DIC/isth_sic_score_2025.html) · [Introducing the New Definition and Diagnostic Criteria of DIC Released by ISTH in 2025 — PubMed](https://pubmed.ncbi.nlm.nih.gov/40829630/) · **Pearls & pitfalls:** [Disseminated Intravascular Coagulation (DIC) — IBCC (EMCrit)](https://emcrit.org/ibcc/dic/)*\n"}, {"file": "dka-hhs-ada-2024.md", "title": "Diabetic ketoacidosis / hyperosmolar hyperglycemic state", "system": "Renal / Metabolic / Endo", "body": "# Diabetic ketoacidosis / hyperosmolar hyperglycemic state — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Hyperglycemic Crises in Adults With Diabetes: A Consensus Report (ADA/EASD/JBDS/AACE/DTS),\n> *Diabetes Care* 2024;47:1257–1275.\n> https://diabetesjournals.org/care/article/47/8/1257/156808/Hyperglycemic-Crises-in-Adults-With-Diabetes-A\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2024\n\n## Why — physiology / first principles\n- DKA = absolute (T1DM) or profound relative (T2DM under severe stress) insulin deficiency plus counter-regulatory hormone excess (glucagon, catecholamines, cortisol) → unrestrained lipolysis → free fatty acids delivered to the liver → ketogenesis → ketoacidosis.\n- Concurrently, hyperglycemia exceeds the renal reabsorption threshold → osmotic diuresis → profound total-body water, Na, K, and phosphate depletion — **despite serum K often being normal or high**, because insulin deficiency and acidosis shift K out of cells, masking the true total-body deficit.\n- Rationale for fluids first (restore volume/perfusion and renal clearance), insulin to switch off lipolysis and ketogenesis (its primary job here, not just lowering glucose), and mandatory K monitoring/repletion before or alongside insulin — insulin drives K back intracellularly and can precipitate dangerous hypokalemia in an already K-depleted patient.\n- Resolution is tracked by **anion gap closure**, not glucose normalization — glucose falls faster than ketoacidosis resolves.\n- HHS = insulin sufficient to suppress ketogenesis but insufficient to prevent hyperglycemia → pure osmotic diuresis and dehydration without significant ketoacidosis, explaining its slower, fluid-dominant (rather than insulin-first) approach.\n\n## Diagnosis / definition & classification\n- [ ] **DKA** — glucose **≥11.1 mmol/L (200 mg/dL)** (or known diabetes) + ketosis (**β-hydroxybutyrate ≥3.0 mmol/L** *(verify)* or significant ketonuria) + acidosis (**pH <7.30** or **HCO₃⁻ <18 mmol/L**)\n- [ ] DKA severity graded — **mild** (pH 7.25–7.30, HCO₃⁻ 15–18), **moderate** (pH 7.00–<7.25, HCO₃⁻ 10–<15),\n  **severe** (pH <7.00, HCO₃⁻ <10) — grade drives monitoring intensity and care setting *(verify bands)*\n- [ ] **HHS** — glucose **>22.2 mmol/L (400 mg/dL)** *(verify)* + **serum osmolality >320 mOsm/kg** + minimal/absent ketosis + **pH ≥7.30**, **HCO₃⁻ ≥18 mmol/L**\n- [ ] **Euglycemic DKA** recognized (glucose may be near-normal, especially with SGLT2 inhibitor use, pregnancy,\n  or prolonged fasting) — do not exclude DKA on glucose alone if acidosis + ketosis present *(verify)*\n- [ ] Mixed DKA/HHS picture recognized and documented where present\n- [ ] Precipitant identified and treated (infection, MI, non-adherence, new-onset, SGLT2i, other)\n\n## Key labs & workup\n- [ ] Venous/arterial blood gas, **anion gap** calculated ([Na⁺] − [Cl⁻ + HCO₃⁻]; normal ~8–12, elevated in DKA) *(verify local reference range)*\n- [ ] **β-hydroxybutyrate** (point-of-care where available) preferred over urine ketones for diagnosis and trending resolution *(verify availability/threshold)*\n- [ ] **Effective serum osmolality** calculated (2×[Na⁺] + glucose in mmol/L) for HHS diagnosis/severity *(verify formula/units)*\n- [ ] **Corrected sodium** calculated to account for hyperglycemia-driven dilutional effect before interpreting true Na⁺ status — add ~1.6–2.4 mmol/L to measured Na⁺ per 5.6 mmol/L (100 mg/dL) glucose above normal *(verify correction factor — sources vary)*\n- [ ] **Potassium** checked before first insulin dose — mandatory (see Management)\n- [ ] Phosphate, creatinine/BUN, lactate, and a search for precipitant (cultures, ECG/troponin, imaging) as indicated\n- [ ] Mental status/GCS documented at baseline, especially in HHS where osmolality correlates with encephalopathy risk\n\n## Management\n\n### Fluids\n- [ ] Initial isotonic crystalloid (0.9% saline or balanced) — **500–1000 mL/h for first 2–4 h** *(verify against volume status/cardiac/renal function)*\n- [ ] Ongoing rate individualized to correct estimated deficit over **24–48 h**\n- [ ] Switch to **dextrose-containing fluid (5–10%)** once glucose **<13.9 mmol/L (250 mg/dL)**, continuing insulin until resolution\n- [ ] HHS — avoid dropping glucose faster than **~5 mmol/L/h (≈90 mg/dL/h)** *(verify)* given osmotic risk\n\n### Insulin\n- [ ] IV regular insulin infusion — **0.1 U/kg/h** (DKA) or **0.05 U/kg/h** (HHS without significant ketosis) *(verify — initial bolus of 0.1 U/kg optional if infusion start delayed)*\n- [ ] **Do not start insulin if K+ <3.5 mmol/L** — replete potassium first *(verify threshold)*\n- [ ] Reduce infusion (e.g. to ~0.05 U/kg/h) once glucose **<13.9 mmol/L**, keeping glucose ~**11.1 mmol/L** until DKA resolved\n- [ ] Basal insulin started **1–2 h before** stopping IV infusion to prevent rebound ketosis/hyperglycemia *(verify dose ~0.15–0.3 U/kg/day)*\n- [ ] Mild/moderate uncomplicated DKA — subcutaneous rapid-acting insulin protocol acceptable in appropriate settings; **not for severe DKA or HHS**\n\n### Electrolytes\n- [ ] **Potassium** — start repletion once K+ **<5.0 mmol/L** (with adequate urine output), target **4–5 mmol/L**; typical **20–30 mmol per L** of IV fluid *(verify against local protocol)*; recheck **q2–4h**\n- [ ] **Phosphate** — routine replacement **not indicated**; consider only with severe hypophosphatemia (**<1.0 mmol/L** *(verify)*) plus muscle weakness/respiratory compromise/cardiac dysfunction\n- [ ] **Bicarbonate** — routine use **not recommended**; consider only for severe acidosis **pH <7.0** *(verify)*, with careful re-dosing and monitoring\n\n### Resolution & transition\n- [ ] DKA resolution: ketones/β-hydroxybutyrate normalized, venous **pH ≥7.30** or **HCO₃⁻ ≥18 mmol/L**, anion gap closed\n- [ ] HHS resolution: osmolality **<300 mOsm/kg**, glucose **<13.9 mmol/L**, mental status improved, adequate urine output\n- [ ] Transition to subcutaneous basal-bolus insulin with overlap; total daily dose estimated (**~0.5–0.6 U/kg/day** insulin-naive; lower if hypoglycemia risk) *(verify)*\n- [ ] Precipitant fully addressed; diabetes education / follow-up arranged before discharge\n- [ ] VTE prophylaxis considered per usual critical-care practice\n\n## Pearls & pitfalls\n- **Never stop the insulin infusion just because glucose has normalized** — insulin is what shuts off ongoing\n  ketogenesis; add/increase dextrose instead so the infusion can continue until the anion gap closes and\n  ketosis resolves *(EMCrit/IBCC — Diabetic Ketoacidosis; PulmCrit — Four DKA Pearls)*\n- **Skip the bolus dose in most adults** — an initial IV insulin bolus adds hypoglycemia risk without clearly\n  speeding gap closure or shortening length of stay; a straight infusion is generally preferred outside\n  peri-arrest situations *(PulmCrit — Four DKA Pearls, EMCrit)*\n- **Normal saline can worsen the numbers** — large-volume 0.9% saline resuscitation can produce a\n  non-anion-gap hyperchloremic acidosis stacked on the closing ketoacidosis, making the bicarbonate look\n  falsely \"stuck\"; a balanced crystalloid (lactated Ringer's/Plasma-Lyte) for fluids after the first liter or\n  two avoids this artifact *(REBEL EM — DKA Tips and Tricks / SCOPE-DKA; PulmCrit)*\n- **Bicarbonate boluses make the numbers look better without changing outcomes** — evidence does not support\n  routine bicarbonate even in fairly severe acidosis; reserve for the guideline's severe-acidosis threshold\n  and reassess *(REBEL EM — Any Benefit to Sodium Bicarbonate in DKA?)*\n- **Don't anchor on glucose alone** — euglycemic DKA (SGLT2 inhibitors, pregnancy, prolonged fasting/low\n  carbohydrate intake) can present with a near-normal glucose but true ketoacidosis; check the gap and\n  ketones if the clinical picture fits *(UMEM Educational Pearls — Euglycemic DKA Pitfalls and Pearls)*\n- **Early basal insulin alongside the IV infusion** (rather than only starting it 1–2 h before stopping the\n  drip) has been suggested to ease the transition and reduce rebound hyperglycemia in select patients — check\n  local protocol before deviating from guideline timing *(PulmCrit — Early basal insulin in DKA)* *(verify —\n  practice-variable)*\n- **HHS insulin dosing is gentler** — start at roughly half the DKA rate (~0.05 U/kg/h) and stop the infusion\n  once glucose approaches target, transitioning to scheduled subcutaneous insulin rather than chasing glucose\n  all the way to normal with the drip *(EMCrit/IBCC — Hyperosmolar hyperglycemic state)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nPrecipitant named? · K+ checked before first insulin dose? · dextrose added at correct glucose threshold? ·\nresolution criteria explicitly met before stopping infusion? · basal insulin overlap with IV insulin documented? ·\nphosphate/bicarbonate use justified (not routine)?\n\n*Sources: [Hyperglycemic Crises in Adults With Diabetes: A Consensus Report — Diabetes Care 2024](https://diabetesjournals.org/care/article/47/8/1257/156808/Hyperglycemic-Crises-in-Adults-With-Diabetes-A) · [PMC full text](https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/) · [Diabetic Ketoacidosis (DKA) — EMCrit IBCC](https://emcrit.org/ibcc/dka/) · [Hyperosmolar hyperglycemic state (HHS) — EMCrit IBCC](https://emcrit.org/ibcc/hhs/) · [PulmCrit — Four DKA Pearls](https://emcrit.org/pulmcrit/four-dka-pearls/) · [PulmCrit — Early basal insulin in DKA](https://emcrit.org/pulmcrit/early-basal-insulin/) · [REBEL Core Cast 18.0 — DKA Tips and Tricks](https://rebelem.com/rebel-core-cast-18-0-dka-tips-and-tricks/) · [REBEL EM — Any Benefit to Sodium Bicarbonate in DKA?](https://rebelem.com/benefit-sodium-bicarbonate-dka/) · [UMEM Educational Pearls — Euglycemic DKA Pitfalls and Pearls](https://www.medschool.umaryland.edu/em/cme/umem-educational-pearls/?id=4584)*\n"}, {"file": "electrolyte-emergencies-hyperk-hypona-hyperca-2024.md", "title": "Severe electrolyte derangements (hyperkalemia · hyponatremia · hypercalcemia)", "system": "Renal / Metabolic / Endo", "body": "# Severe electrolyte derangements (hyperkalemia · hyponatremia · hypercalcemia) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Sources:** UK Kidney Association Clinical Practice Guideline — Treatment of Acute Hyperkalaemia in\n> Adults, 2023 (ukkidney.org); European Society of Endocrinology Clinical Practice Guideline on Hyponatraemia,\n> 2014 (*Eur J Endocrinol*); Endocrine Society Clinical Practice Guideline — Treatment of Hypercalcemia of\n> Malignancy in Adults, 2022 (*J Clin Endocrinol Metab* 2023).\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2023 / 2014 / 2022 (three separate society\n> guidelines combined into one checklist — verify each section against its own primary source)\n\n## Why — physiology / first principles\n- **Hyperkalemia** widens the resting-to-threshold membrane potential gap in excitable (cardiac) tissue, slowing conduction and risking fatal arrhythmia. Treatment hits three distinct mechanisms: membrane stabilization (Ca²⁺ — restores the threshold gap, does **not** lower K), transcellular shift (insulin/glucose, β-agonists, bicarbonate — drives K intracellularly, temporary), and true removal (diuretics, resins, dialysis — the only mechanisms that actually clear K).\n- **Hyponatremia** almost always reflects free water excess relative to Na (ADH-mediated), rarely a true Na deficit. Brain cells swell inside the fixed cranial vault → cerebral edema drives the urgency in acute/severe cases. Chronic hyponatremia undergoes osmotic adaptation (brain cells extrude intracellular osmolytes to limit swelling) — correcting **too fast** outpaces re-accumulation of those osmolytes and causes osmotic demyelination, which is why correction-rate limits and hypertonic saline are reserved for severe/symptomatic cases.\n- **Hypercalcemia** impairs renal concentrating ability (nephrogenic-DI-like effect) → polyuria → volume depletion → reduced renal Ca clearance → worsens hypercalcemia in a self-amplifying cycle — rationale for volume repletion as first-line, before slower-acting antiresorptive therapy (bisphosphonates/calcitonin) targets the underlying bone turnover.\n\n## Diagnosis / definition\n\n### Hyperkalemia\n- [ ] Severity classified: **mild** ~5.5–5.9, **moderate** **6.0–6.4 mmol/L** (treat if any cardiac instability), **severe** **>6.5 mmol/L** or any ECG changes *(verify thresholds against UKKA/local protocol)*\n- [ ] Classified as **acute** (poorly tolerated, higher arrhythmia risk at a given level) vs **chronic** (e.g. dialysis patients, often better tolerated at the same number) — treat the trend/context, not the number alone *(verify)*\n- [ ] **Pseudohyperkalemia excluded** where the result is discordant with the clinical picture — hemolyzed sample, marked thrombocytosis/leukocytosis, or prolonged tourniquet time; repeat on a fresh non-hemolyzed sample before treating an unexpected result *(verify — do not delay treatment if clinical picture is consistent)*\n\n### Hyponatremia\n- [ ] Severity + acuity classified: mild/moderate/severe by symptoms **and** onset (<48 h acute vs chronic/unknown) — acuity, not the absolute Na⁺ level alone, sets how fast correction may proceed *(verify)*\n- [ ] Volume status classified (hypovolemic / euvolemic / hypervolemic) as the first branch point for etiology and fluid choice\n\n### Hypercalcemia (malignancy-associated / severe)\n- [ ] **Corrected calcium** calculated for albumin (measured Ca²⁺ + 0.02 mmol/L per g/L albumin below 40 g/L, or use ionized calcium directly) before classifying severity *(verify formula/units — local lab may report corrected value directly)*\n- [ ] Severity graded by **corrected calcium level** *and* symptom burden (neuro: confusion/lethargy/coma; cardiac: short QT, arrhythmia; renal: AKI, nephrogenic DI) — symptomatic/severe hypercalcemia (e.g. corrected Ca²⁺ **>3.5 mmol/L (14 mg/dL)** or significant symptoms) is a medical emergency *(verify threshold)*\n- [ ] Mechanism considered (PTHrP-mediated humoral hypercalcemia of malignancy, osteolytic bone metastases, calcitriol-mediated) — informs choice of adjunct therapy (e.g. steroids for calcitriol-driven disease)\n\n## Key labs & workup\n\n### Hyperkalemia\n- [ ] **12-lead ECG** obtained on every case — peaked T waves, widened QRS, loss of P waves, sine wave pattern; treat as emergency if present regardless of exact level\n- [ ] Repeat K+ **1 h and hourly** until stable *(verify interval)*; confirm on a non-hemolyzed sample if result is unexpected\n- [ ] Renal function, acid-base status, and a cause-directed workup (medication review, tissue breakdown markers, cortisol if adrenal insufficiency suspected) sent alongside\n\n### Hyponatremia\n- [ ] Serum Na⁺, serum osmolality, **urine osmolality**, and **urine sodium** sent before treatment starts — these define the SIADH-vs-hypovolemic-vs-hypervolemic differential and the fluid-restriction-vs-saline decision\n- [ ] Serial serum Na⁺ rechecked frequently during active correction (e.g. **q2–4h**) with an explicit ceiling documented for the current 24 h window\n- [ ] TSH, cortisol considered as part of the SIADH work-up where appropriate (hypothyroidism, adrenal insufficiency can mimic/contribute to SIADH picture)\n\n### Hypercalcemia\n- [ ] Corrected/ionized calcium, phosphate, **PTH** (to distinguish PTH-dependent [hyperparathyroidism] from PTH-independent [malignancy] causes — PTH is suppressed in humoral hypercalcemia of malignancy), renal function\n- [ ] PTHrP, vitamin D/calcitriol levels considered if malignancy mechanism unclear\n- [ ] ECG for QT interval and arrhythmia risk\n\n## Management\n\n### Hyperkalemia\n- [ ] **Membrane stabilization**: **calcium gluconate 10%, ~30 mL (or per local: 10 mL repeated)** IV if ECG changes; repeat at **~5 min** if changes persist *(verify dose/product — chloride vs gluconate differ)*\n- [ ] **Shift K+ intracellularly**: insulin-dextrose (e.g. **10 units soluble insulin + 25 g glucose**, some protocols use lower insulin dose) *(verify local dose — hypoglycemia risk, monitor glucose)*\n- [ ] **Adjunct**: nebulized salbutamol **10–20 mg** *(verify dose)*\n- [ ] Sodium bicarbonate considered only if concurrent metabolic acidosis *(verify — not first-line for K+ shift alone)*\n- [ ] **Remove potassium**: loop diuretic if volume replete/overloaded; potassium binder (patiromer/SZC) for sustained lowering *(verify agent/dose)*; **dialysis** if refractory, severe AKI, or life-threatening\n- [ ] Underlying cause addressed (AKI, RAASi, acidosis, tissue breakdown, adrenal insufficiency); repeat K+ **1 h and hourly** until stable *(verify interval)*\n- [ ] Culprit medications (ACEi/ARB/MRA/NSAIDs) held/reviewed\n\n### Hyponatremia\n- [ ] **Severe symptomatic** hyponatremia → **hypertonic saline (3%) bolus, e.g. ~150 mL over ~20 min**, repeated up to 2–3× while reassessing symptoms *(verify dose/volume — low-quality evidence per ESE 2014)*\n- [ ] Target correction: **~5 mmol/L rise (or symptom relief) within first hour**, cumulative **≤10 mmol/L in 24 h**, **≤8 mmol/L per subsequent 24 h** *(verify limits — high risk of osmotic demyelination if exceeded)*\n- [ ] Frequent Na+ recheck (e.g. **q2–4h** during active correction) with explicit stop/slow rules if trending too fast *(verify interval)*\n- [ ] If overcorrection occurs — re-lowering strategy considered (e.g. desmopressin ± free water) *(verify institutional protocol)*\n- [ ] Etiology work-up (volume status, urine osmolality/sodium, SIADH vs hypovolemic vs hypervolemic) documented before choosing fluid-restriction vs saline vs vaptan strategy\n- [ ] Chronic/asymptomatic hyponatremia — avoid overly rapid correction; treat underlying cause, fluid restriction as first line where appropriate *(verify)*\n\n### Hypercalcemia (malignancy-associated / severe)\n- [ ] **IV isotonic saline** to restore volume — e.g. **~1.5–2 L bolus** then maintenance **~100–150 mL/h**, targeting **~3–4 L/24 h** *(verify rate against cardiac/renal reserve)*\n- [ ] **Calcitonin ~4 IU/kg** IM/SC for rapid but short-lived effect while bisphosphonate takes effect *(verify dose — tachyphylaxis expected within days)*\n- [ ] **IV bisphosphonate** (e.g. **zoledronic acid 4 mg IV over 15–30 min**, dose-adjusted for renal function) OR **denosumab** (e.g. **120 mg SC**), denosumab preferred if bisphosphonate-refractory or significant renal impairment *(verify agent/dose/renal adjustment)*\n- [ ] Loop diuretic **only** after volume repletion and **only** for fluid overload — not routine to lower calcium *(verify)*\n- [ ] Glucocorticoids considered if calcitriol-mediated (lymphoma, granulomatous disease)\n- [ ] Hemodialysis considered for severe/refractory hypercalcemia with renal failure or if fluids/bisphosphonates contraindicated\n- [ ] Underlying malignancy/cause treatment addressed as the definitive measure to prevent recurrence\n\n## Pearls & pitfalls\n\n### Hyperkalemia\n- **The ECG is insensitive** — the textbook peaked-T → widened-QRS → sine-wave sequence often doesn't play\n  out in order, and hyperkalemia can mimic STEMI or any conduction block; a \"normal-looking\" ECG does not\n  exclude dangerous hyperkalemia *(EMCrit/IBCC — Hyperkalemia)*\n- **Chronic hyperkalemia is tolerated differently** — dialysis patients living at K+ 6.0 chronically are not\n  the same risk as a patient acutely rising to 6.0; weigh acuity, not just the number *(EMCrit/IBCC —\n  Hyperkalemia)*\n- **Insulin must be given IV, not SC** — a well-described dosing error; confirm the route explicitly on the\n  order and monitor glucose after *(EMCrit/IBCC — Hyperkalemia)*\n- **Rule out pseudohyperkalemia** before committing to aggressive treatment of a result that doesn't fit the\n  clinical picture (hemolysis, marked thrombocytosis/leukocytosis) — but don't use this as an excuse to delay\n  treatment when the clinical context is consistent *(EMCrit/IBCC — Hyperkalemia; WikEM)*\n\n### Hyponatremia\n- **Most overcorrection is not caused by giving too much hypertonic saline** — it's caused by the underlying\n  driver of hyponatremia resolving (e.g. volume repletion abruptly switching off ADH), leading to a brisk\n  endogenous free-water diuresis; anticipate this in hypovolemic/adrenal/thiazide-related hyponatremia\n  *(EMCrit — A Better Management Strategy for Symptomatic Hyponatremia [DDAVP clamp])*\n- **The DDAVP-clamp technique** — scheduled exogenous desmopressin given alongside careful hypertonic saline\n  dosing can pre-empt this autocorrection phenomenon in patients felt to be at high overcorrection risk,\n  turning free-water excretion off so the rate of rise stays controlled and predictable *(EMCrit/PulmCrit —\n  DDAVP Clamp-Bolus technique)* *(verify — advanced technique, confirm local protocol/experience before use)*\n- **3% saline is safer than it's often perceived to be** when dosed and monitored properly — fear of it should\n  not lead to under-treating genuinely symptomatic severe hyponatremia *(EMCrit — IBCC Hyponatremia)*\n- **Vaptans carry a real overcorrection risk** of their own (unpredictable free-water loss) — this is part of\n  why European guidance favors hypertonic saline over vaptans for severe/symptomatic hyponatremia *(EMCrit/IBCC\n  — Hyponatremia)*\n\n### Hypercalcemia\n- **Malignancy and primary hyperparathyroidism together explain >90%** of hypercalcemia presentations — a\n  focused PTH-based workup usually gets to the mechanism quickly *(LITFL — Hypercalcaemia CCC)*\n- **Suppressed PTH with no evident bone metastases** points to humoral hypercalcemia of malignancy (PTHrP-driven)\n  rather than local osteolysis — this changes which adjunct (e.g. steroids for calcitriol-mediated disease)\n  is likely to help *(LITFL — Hypercalcaemia DDx)*\n- **Volume repletion comes first** — calcitonin and bisphosphonates both work faster and better once the\n  patient is no longer volume-down from the polyuria hypercalcemia itself causes; don't reach for calcitonin\n  before fluids are underway *(LITFL — Hypercalcaemia CCC)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nECG done for hyperkalemia? · repeat K+ timing documented? · hyponatremia acuity (acute vs chronic) stated before choosing correction speed? ·\n24 h correction limit explicitly tracked? · hypercalcemia — volume repletion done before/with calcitonin? · bisphosphonate renal-dose-adjusted? · underlying cause named for all three?\n\n*Sources: [UK Kidney Association — Management of Hyperkalaemia in Adults](https://www.ukkidney.org/health-professionals/guidelines) · [Recommendations for the management of hyperkalemia in the emergency department — PubMed](https://pubmed.ncbi.nlm.nih.gov/35833768/) · [Clinical practice guideline on diagnosis and treatment of hyponatraemia — ESE/ERA-EDTA 2014 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC4276109/) · [Treatment of Hypercalcemia of Malignancy in Adults: An Endocrine Society Clinical Practice Guideline — PubMed](https://pubmed.ncbi.nlm.nih.gov/36545746/) · [Hyperkalemia — EMCrit IBCC](https://emcrit.org/ibcc/hyperkalemia/) · [Hyponatremia — EMCrit IBCC](https://emcrit.org/ibcc/hyponatremia/) · [EMCrit 178 — A Better Management Strategy for Symptomatic Hyponatremia (dDAVP Clamp)](https://emcrit.org/emcrit/better-management-hyponatremia/) · [PulmCrit wee — DDAVP Clamp-Bolus technique for severe hyponatremia](https://emcrit.org/pulmcrit/ddavp-clamp-bolus/) · [Hypercalcaemia — LITFL CCC Electrolytes](https://litfl.com/hypercalcaemia/) · [Hypercalcaemia DDx — LITFL CCC Electrolytes](https://litfl.com/hypercalcaemia-ddx/)*\n"}, {"file": "endocarditis-esc-2023.md", "title": "Infective endocarditis", "system": "ID", "body": "# Infective endocarditis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2023 ESC Guidelines for the management of endocarditis, developed by the Task Force on the\n> Management of Endocarditis of the European Society of Cardiology (ESC), endorsed by EACTS and EANM,\n> *European Heart Journal* 2023;44(39):3948–4042. **Different body from the prior source**\n> (`endocarditis-aha-2015.md`, 2015 AHA Scientific Statement, superseded/removed) — adopted as primary\n> here as the newer, more current guideline; the AHA 2015 statement was the prior operative source.\n> https://academic.oup.com/eurheartj/article/44/39/3948/7243107\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Why — physiology / first principles\n- Endothelial injury or turbulent flow (native valve disease, prosthetic material, indwelling lines) exposes subendothelial matrix → sterile platelet-fibrin thrombus forms (nonbacterial thrombotic endocarditis).\n- Transient bacteremia (dental work, skin/GI/GU source, line infection) seeds this thrombus → organisms become embedded in a protective fibrin/platelet vegetation matrix (biofilm-like), shielded from both immune clearance and antibiotic penetration.\n- Ongoing vegetation growth causes local valve destruction (regurgitation, abscess, conduction disease if annular) plus embolization of infected fragments (septic emboli to brain/spleen/kidney/lung) plus immune-complex deposition distally (glomerulonephritis, Osler nodes, Roth spots).\n- Why blood cultures **before** antibiotics: sterilizing blood first can make the microbiologic diagnosis (and targeted therapy) impossible.\n- Why prolonged **bactericidal** IV therapy (not bacteriostatic, not short-course oral): organisms are protected within an avascular matrix and need sustained high bactericidal exposure to be eradicated.\n- Why surgery for large vegetation/abscess/heart failure: mechanical/structural destruction and a protected bacterial reservoir cannot be resolved by antibiotics alone.\n\n## Diagnosis / definition\n- [ ] **Blood cultures ×3** from separate sites **before antibiotics** (if patient stable enough to permit brief delay) — ≥2 sets drawn ~12 h apart, or ≥3–4 sets with the first and last separated by >1 h, satisfy the microbiologic-criterion requirement *(verify exact local protocol)*\n- [ ] Apply **modified Duke criteria** (clinical + microbiologic + imaging) to classify definite/possible/rejected — 2023 update **incorporates advanced imaging (CT, PET/CT, nuclear imaging) as major criteria**, not just adjunctive, alongside echo and microbiology *(verify per current criteria table)*\n  - [ ] **Major criteria (summary)**: positive blood cultures with typical IE organisms or persistently positive cultures; evidence of endocardial involvement on echo/imaging (vegetation, abscess, new dehiscence) or new valvular regurgitation; **2023 adds qualifying advanced imaging findings as major**, not just adjunctive *(verify exact wording)*\n  - [ ] **Minor criteria (summary)**: predisposing heart condition or IV drug use; fever ≥38°C; vascular phenomena (emboli, mycotic aneurysm, Janeway lesions); immunologic phenomena (glomerulonephritis, Osler nodes, Roth spots); microbiological evidence not meeting major criteria — **classify as definite (2 major, or 1 major + 3 minor, or 5 minor), possible, or rejected** *(verify exact point combinations against current criteria table)*\n- [ ] **Echocardiography** — **TTE first**; **TEE** if TTE non-diagnostic, prosthetic valve, suspected complication, or high clinical suspicion despite negative TTE\n- [ ] Use the **2023 diagnostic algorithm appropriate to valve type** — native valve, prosthetic valve, and cardiac-device-related (CIED) endocarditis now each have **distinct pathways** *(verify which applies)*\n- [ ] Consider **PET/CT or cardiac CT** — now a **formal diagnostic criterion**, especially for prosthetic-valve/device-related IE where echo is equivocal *(verify local availability)*\n- [ ] **Screen for embolic phenomena** (neuro imaging if any neuro symptom; consider even if asymptomatic per local practice)\n\n## Key labs & workup\n- [ ] **Blood cultures ×3** — see Diagnosis above; do not duplicate the draw, just ensure it's actually resulted and trended\n- [ ] **Inflammatory markers** (CRP/ESR, ± procalcitonin) — CRP is reported as highly sensitive and useful for trending response to therapy, not for diagnosis alone *(verify)*\n- [ ] **Renal function** — screen for immune-complex glomerulonephritis or embolic AKI, both minor/major-adjacent findings\n- [ ] **Urinalysis** — hematuria supports an immunologic-phenomenon minor criterion\n- [ ] **12-lead ECG at baseline and serially** — new conduction delay/heart block raises concern for perivalvular abscess extension\n- [ ] **Document specific echo findings** — vegetation size/mobility, abscess, new or worsened regurgitation — these drive both the diagnostic classification and the surgical-urgency decision below\n- [ ] **PET-CT/cardiac CT** — cross-reference the Diagnosis bullet above; order specifically when TTE/TEE are equivocal, especially for prosthetic valve/CIED-related IE\n\n## Management\n### Antimicrobial therapy & source control\n- [ ] **Empiric regimen** selected per suspected organism (native vs prosthetic valve, community vs healthcare-associated) — <agents/doses, EUCAST-based> — verify against guideline tables and local antibiogram\n- [ ] **Targeted therapy** once organism/susceptibilities known; document **planned total duration** (native vs prosthetic valve durations differ) — *verify*\n- [ ] **Outpatient parenteral antibiotic therapy (OPAT)**, incl. partial oral step-down, now **formally supported** for stable patients completing therapy after the acute/complication-prone phase — screen eligibility before discharge planning *(new emphasis in 2023 — verify local OPAT pathway)*\n- [ ] **Identify and control any removable source** (line, device, abscess) — early ID/cardiology/CT surgery involvement\n- [ ] **Serial blood cultures** to confirm clearance\n\n### Surgical evaluation — do not defer this decision\n- [ ] **Early cardiac surgery consult** — do not wait for antibiotic course completion if any indication present\n- [ ] **Surgical urgency now explicitly categorized**: **emergency** (within 24 h), **urgent** (within 3–5 days), **non-urgent** (within the same hospital stay) — document which applies *(new explicit definitions in 2023 — verify)*\n- [ ] **Class I: urgent surgery (3–5 days)** for **vegetation ≥10 mm plus another surgical indication**; also a **new urgent-surgery indication for early prosthetic-valve endocarditis** *(verify criteria)*\n- [ ] Indications to actively screen for: **heart failure due to valve dysfunction**, **uncontrolled infection** (perivalvular abscess, persistent bacteremia/fever despite appropriate abx, fungal/resistant organism), **high embolic risk** (large/mobile vegetation ≥10 mm, prior embolic event) — *verify exact thresholds against source*\n- [ ] **Ischemic stroke**: surgery should **not be delayed** — upgraded to a **Class I** recommendation in 2023 *(verify timing specifics)*\n- [ ] **Hemorrhagic stroke**: waiting **~1 month** before surgery is generally preferred (**Class IIa**) *(verify per case — neurosurgery/neurology input)*\n- [ ] Document the **multidisciplinary Endocarditis Team** discussion/decision, even if surgery deferred — structured team framework is a core emphasis of the 2023 guideline\n\n### Ongoing ICU management\n- [ ] **Monitor for new murmur, conduction abnormality (new heart block → abscess), or heart failure** — daily exam ± telemetry\n- [ ] **Repeat echo** if clinical change or to guide surgical timing\n- [ ] **Anticoagulation management** — individualize in patients on chronic anticoagulation (bleeding vs embolic risk) — *verify per case, avoid new initiation in most acute native-valve IE*; continuing a pre-existing anticoagulation indication has not been shown to worsen outcomes at ~10 weeks — embolic stroke alone is a weaker contraindication than a large territorial infarct — IBCC (EMCrit) *(verify)*\n- [ ] **Dental/hygiene and prophylaxis counseling** before discharge per current ESC/AHA prophylaxis indications\n- [ ] **Substance-use/OUD management plan** if IV-drug-use-associated IE — medication-assisted treatment is reported as offered to a minority of these patients at discharge in published series; document the plan explicitly rather than leaving it implicit — IBCC (EMCrit) *(verify local addiction-medicine pathway)*\n\n## Pearls & pitfalls\n- [ ] **~50% of IE cases occur on a previously normal valve** — don't let the absence of known valvulopathy lower suspicion — LITFL\n- [ ] **TTE sensitivity is only ~50–70%** (poor windows lower it further); **TEE sensitivity is ~90–99%** with ~90% specificity — a negative TTE with ongoing high suspicion is a TEE indication, not a reason to stop looking — LITFL / IBCC (EMCrit) *(verify)*\n- [ ] **Classic exam findings (Osler nodes, Janeway lesions, splinter hemorrhages) are seen in <5% of acute presentations** — their absence does not lower suspicion in a genuinely high-risk patient — IBCC (EMCrit) *(verify)*\n- [ ] **Vancomycin/daptomycin monotherapy has pitfalls**: vancomycin levels are often subtherapeutic in the first 1–2 days and it underperforms for MSSA; daptomycin monotherapy risks emergent heteroresistance and does not treat pneumonia (relevant in right-sided IE with septic pulmonary emboli) — most empiric regimens pair one of these with a beta-lactam — IBCC (EMCrit) *(verify local empiric protocol)*\n- [ ] **Cerebral microbleeds and embolic (non-territorial) infarcts are generally not a contraindication to proceeding with cardiac surgery** — it is large territorial ischemic infarcts and intracranial hemorrhage that push toward delay — don't over-extrapolate \"don't operate after a stroke\" to every neuroimaging abnormality — IBCC (EMCrit) *(verify per neurosurgery/neurology input, case-by-case)*\n- [ ] **Right-sided IE with septic pulmonary emboli** classically shows **multiple peripheral, lower-lobe lesions in different stages of cavitation** (~50% cavitate) — a distinct radiographic pattern from typical pneumonia — IBCC (EMCrit) *(verify)*\n- [ ] **Mycotic aneurysms occur in ~10% of IE** and carry ~80% mortality if they rupture; roughly 30% resolve spontaneously on antibiotics while ~20% enlarge — aneurysms **>7 mm are unlikely to resolve without intervention**, which can inform imaging follow-up/referral timing — IBCC (EMCrit) *(verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\n3 sets of cultures before abx? · Duke criteria classification stated (incl. imaging as major criterion where used)? ·\nTEE and/or PET-CT done/considered when TTE negative but suspicion high? · surgical urgency category\n(emergency/urgent/non-urgent) explicitly documented? · surgical indications actively screened (HF /\nuncontrolled infection / embolic risk ≥10 mm)? · stroke-timing rule followed (ischemic — don't delay;\nhemorrhagic — ~1 month)? · antibiotic duration + de-escalation + OPAT-eligibility plan? · source\n(line/device) addressed? · endocarditis team discussion documented?\n\n*Sources: [2023 ESC Guidelines for the management of endocarditis — European Heart Journal](https://academic.oup.com/eurheartj/article/44/39/3948/7243107) · [2023 ESC Clinical Practice Guidelines for endocarditis — ESC Congress news](https://www.escardio.org/Congresses-Events/ESC-Congress/Congress-resources/Congress-news/2023-ESC-Clinical-Practice-Guidelines-for-the-management-of-endocarditis) · [Surgical Implications of the 2023 ESC Endocarditis Guidelines Endorsed by EACTS — European Journal of Cardio-Thoracic Surgery](https://academic.oup.com/ejcts/article-abstract/67/7/ezaf225/8185406) · *(prior source, retained for reference only:* [Infective Endocarditis in Adults — AHA Scientific Statement 2015 (Circulation)](https://www.ahajournals.org/doi/10.1161/CIR.0000000000000296)*)* · **Pearls & pitfalls:** [Infective Endocarditis — LITFL CCC Cardiology](https://litfl.com/infective-endocarditis/) · [Endocarditis — IBCC (EMCrit)](https://emcrit.org/ibcc/endo/)*\n"}, {"file": "febrile-neutropenia-asco-idsa-2018.md", "title": "Febrile neutropenia", "system": "ID", "body": "# Febrile neutropenia — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Outpatient Management of Fever and Neutropenia in Adults Treated for Malignancy: American\n> Society of Clinical Oncology and Infectious Diseases Society of America Clinical Practice Guideline\n> Update (Taplitz RA, Kennedy EB, Bow EJ, et al.), *Journal of Clinical Oncology* 2018;36(14):1443–1453.\n> https://www.idsociety.org/practice-guideline/fever-and-neutropenia-in-adults-with-cancer/\n> **This is an outpatient-management-focused update — it does NOT replace the inpatient/empiric-IV-antibiotic\n> guidance.** The **2018 ASCO/IDSA update governs risk stratification and outpatient (oral) therapy**;\n> the **empiric IV antibiotic selection, cultures, and inpatient escalation structure below is retained\n> from the 2010 IDSA guideline** (Freifeld AG et al., *Clin Infect Dis* 2011;52:e56–93), which has not\n> been superseded for that scope — say so explicitly in any output using this checklist.\n> **Compiled:** 06-Sep-2026 · Claude Code · outpatient guidance year 2018; inpatient/empiric structure\n> year 2010 (check periodically for a full inpatient-scope update)\n\n## Why — physiology / first principles\n- Chemotherapy/malignancy suppresses bone marrow output → ANC <500 removes the primary innate cellular defense against bacterial/fungal invasion.\n- Without neutrophils, the normal inflammatory containment response is blunted — gut/skin flora translocate and invasive infection can progress with **minimal or no localizing signs** (no pus, minimal erythema); fever may be the *only* sign of serious infection.\n- Absent neutrophil-mediated containment also means unchecked bacterial proliferation can progress to sepsis far faster than in an immunocompetent host.\n- Why fever + neutropenia is a medical emergency: the usual clinical buffer (localized inflammation before systemic spread) is gone.\n- Why **empiric broad-spectrum antibiotics within 1 hour**, including antipseudomonal coverage, without waiting for culture results: the host cannot contain the infection while diagnostics catch up.\n\n## Diagnosis / definition\n- [ ] Confirm **fever** (single temp ≥38.3°C, or ≥38.0°C sustained ≥1 h — *verify exact threshold*) **+ neutropenia** (ANC <500, or <1000 with expected fall — *verify*)\n- [ ] Calculate **MASCC score** (or CISNE for solid-tumor outpatients) — **≥21 = low risk**, **<21 = high risk** *(verify cutoff/tool against source)*\n- [ ] High-risk patients → **admit for IV empiric therapy**; low-risk patients evaluated against 2018\n  ASCO/IDSA outpatient eligibility (below) — *verify eligibility criteria*\n\n## Key labs & workup\n- [ ] **CBC with differential** — trend ANC serially, not a one-off value\n- [ ] **Blood cultures ×2** — peripheral **plus** any central line (see Immediate empiric therapy below for timing relative to antibiotics)\n- [ ] **Urinalysis + urine culture**\n- [ ] **Chest imaging** if respiratory symptoms present\n- [ ] **Lactate** if hemodynamically abnormal\n- [ ] **Procalcitonin/CRP** as optional adjuncts to trend response — *verify local utility, not a substitute for cultures/exam*\n\n## Management\n\n### Outpatient pathway — low-risk patients (ASCO/IDSA 2018)\n- [ ] **Formal risk assessment documented** (clinical judgment or validated tool, e.g. MASCC) before\n  committing to outpatient management\n- [ ] **Logistic/psychosocial suitability confirmed** — reliable access to care, caregiver support,\n  ability to return promptly if worsening — explicitly part of the 2018 selection criteria\n- [ ] **First dose of empirical antibacterial therapy given within 1 hour of triage**, same as inpatient timing\n- [ ] **Observed ≥4 hours** after first dose before discharge home\n- [ ] **Oral empiric regimen**: **fluoroquinolone (e.g. ciprofloxacin) PLUS amoxicillin-clavulanate**\n  (or **clindamycin** if penicillin-allergic) *(verify dose against local antibiogram/allergy)*\n- [ ] **Do NOT use this oral fluoroquinolone-based regimen** in patients who were already receiving\n  **fluoroquinolone prophylaxis** — treat as high-risk/inpatient instead\n- [ ] **Re-evaluated at 48–72 hours** (in person or by structured follow-up) — persistent fever or\n  clinical deterioration → **escalate to inpatient IV therapy**\n\n### Immediate empiric therapy (inpatient / high-risk) — treat before source is known *(retained: 2010 IDSA scope, not updated by 2018)*\n- [ ] **Blood cultures ×2** (incl. from any central line + peripheral) **before antibiotics**; other cultures per site of symptoms\n- [ ] **Empiric antibiotics within 1 hour** of triage/presentation\n- [ ] **Antipseudomonal beta-lactam monotherapy** — e.g. cefepime, piperacillin-tazobactam, or a carbapenem — <agent/dose — verify against local antibiogram/allergy>\n- [ ] **Add vancomycin/MRSA coverage** only for specific indications (hemodynamic instability, suspected line infection, skin/soft-tissue infection, known MRSA colonization, severe mucositis) — not routine — *verify indications*\n- [ ] **Add antifungal coverage** if persistent fever ≥4–7 days despite broad-spectrum antibiotics and no identified source — *verify timing/agent*\n\n### Source evaluation & ongoing management\n- [ ] **Focused exam + imaging** for likely sources (line site, lungs, perianal, skin) — avoid rectal exam/manipulation if profoundly neutropenic\n- [ ] **Daily reassessment** — de-escalate/narrow once culture data and clinical trajectory allow (inpatient), or confirm improvement at 48–72h reassessment (outpatient)\n- [ ] **Central line management** — evaluate for removal if line-associated infection suspected (esp. *S. aureus*, fungal, persistent bacteremia)\n- [ ] **G-CSF** — consider per hematology/oncology if not already on it and high-risk features — *verify indication, not routine for uncomplicated FN*\n- [ ] **Antifungal/antiviral prophylaxis review** — confirm patient's prior prophylaxis regimen and whether breakthrough is a concern\n- [ ] **Duration of therapy** — continue until ANC recovery **and** afebrile **and** source addressed; document plan — *verify*\n\n## Pearls & pitfalls\n- [ ] Local signs of inflammation may be minimal or absent in neutropenia — infection foci can be \"unusually subtle\" on exam; a reassuring exam does not exclude a serious source — *EMCrit/IBCC (Farkas), \"Approach to Fever in the ICU\"*\n- [ ] Extended-infusion (rather than standard bolus) beta-lactam dosing may improve outcomes in this population — *EMCrit/IBCC* `(verify local pharmacy protocol)`\n- [ ] Empiric MRSA coverage (vancomycin/linezolid/daptomycin) is easy to add reflexively but easy to forget to stop — actively reassess and **discontinue by ~48 h if no objective evidence of MRSA** is found, rather than letting it run for the full course — *EMCrit/IBCC* `(verify)`\n- [ ] Median time to defervescence on appropriate empiric therapy is **~3–5 days** — don't panic-escalate before that window closes; antifungal consideration typically starts once fever persists **~5–7 days** with ongoing neutropenia — *EMCrit/IBCC* `(verify exact windows)`\n- [ ] Emerging teaching favors stopping antibiotics after **~3 days of defervescence and clinical recovery, irrespective of ANC recovery** — a shift from older practice of continuing until ANC normalizes (this file's guideline-sourced bullet above reflects the more conservative \"until ANC recovery\" stance) — *EMCrit/IBCC* `(verify against current local practice — a real point of practice variation)`\n\n## Commonly-missed on documentation (what the gap-check flags)\nMASCC/risk stratification documented, including logistic/psychosocial suitability if outpatient path\nconsidered? · cultures before antibiotics? · door-to-antibiotic time ≤1 h (either pathway)? · fluoroquinolone\nprophylaxis status checked before choosing oral outpatient regimen? · 48–72h outpatient reassessment\nscheduled and documented? · rationale for/against vancomycin stated (not reflexive)? · antifungal\nescalation timing considered if fever persists (inpatient)? · line source actively assessed? · G-CSF\nindication addressed? · daily de-escalation review (inpatient)?\n\n*Sources: [ASCO/IDSA 2018 Outpatient Fever and Neutropenia Guideline — IDSA](https://www.idsociety.org/practice-guideline/fever-and-neutropenia-in-adults-with-cancer/) · [Outpatient Management of Fever and Neutropenia in Adults Treated for Malignancy — J Clin Oncol 2018 (PubMed)](https://pubmed.ncbi.nlm.nih.gov/29461916/) · [IDSA 2010 Update: Antimicrobial Agents in Neutropenic Patients with Cancer (retained inpatient/empiric scope) — PubMed](https://pubmed.ncbi.nlm.nih.gov/21258094/) · [Clinical Implications of Febrile Neutropenia Guidelines (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC6333383/) · [IBCC — Approach to Fever in the ICU (EMCrit, Josh Farkas)](https://emcrit.org/ibcc/fever/)*\n"}, {"file": "hypertensive-emergency-aha-2024.md", "title": "Hypertensive emergency", "system": "Cardiac", "body": "# Hypertensive emergency — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** The Management of Elevated Blood Pressure in the Acute Care Setting: A Scientific\n> Statement From the American Heart Association (Bress AP et al., AHA), *Hypertension* 2024;81(8):e94–e106.\n> https://www.ahajournals.org/doi/10.1161/HYP.0000000000000238\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2024\n\n## Why — physiology / first principles\n- Hypertensive **emergency** is defined by acute BP elevation exceeding target-organ autoregulatory\n  capacity (brain, heart, kidney, retina, aorta) causing active injury — the BP number itself is not the\n  diagnosis; the same number without end-organ injury is urgency, not emergency.\n- Cerebral/renal autoregulation curves are chronically **rightward-shifted** in longstanding hypertension\n  — organs adapted to perfuse at higher pressures — so dropping BP too far/fast below the adapted\n  autoregulatory floor causes hypoperfusion (e.g. watershed stroke), which is why controlled, graded\n  reduction (~10-25% MAP in the first hour *(verify)*) is the rule, not normalization.\n- The organ at risk dictates the target and agent: aortic dissection wants both HR and BP down fast\n  (dP/dt), ischemic stroke tolerates higher pressures to preserve penumbral perfusion, pre-eclampsia\n  needs rapid but titratable control — one BP number does not fit every end-organ mechanism.\n\n## Diagnosis / definition\n- [ ] **Hypertensive emergency = severe BP elevation + new/worsening acute target-organ damage (TOD)** —\n  BP threshold alone, even very high, without TOD is **NOT** an emergency\n- [ ] **Target-organ damage — mnemonic \"BARKH\"** *(verify mnemonic against source)*: **B**rain\n  (hypertensive encephalopathy, ICH, acute ischemic stroke) · **A**rteries (aortic dissection) ·\n  **R**etina (high-grade/malignant retinopathy — papilledema, flame haemorrhages) · **K**idney (AKI) ·\n  **H**eart (ACS, unstable angina, acute LV failure/pulmonary oedema) — plus microangiopathic\n  haemolytic anaemia/thrombocytopenia (TMA-pattern)\n- [ ] Confirm the **elevated reading is accurate** (correct cuff size/position, repeat measurement)\n  before committing to an emergency work-up *(verify local protocol)*\n- [ ] **2024 AHA terminology**: \"hypertensive urgency\" is retired; severe asymptomatic elevation\n  without TOD = **\"asymptomatic markedly elevated BP\"** — do **not** manage as an emergency\n\n## Key labs & workup\n- [ ] **Renal**: BMP/creatinine (AKI) + urinalysis (proteinuria, haematuria — glomerular/TMA pattern)\n- [ ] **Cardiac**: troponin, BNP/NT-proBNP, 12-lead ECG in all patients\n- [ ] **Microangiopathy screen if suspected**: peripheral smear (schistocytes), LDH, haptoglobin,\n  platelet count — evaluate for hypertensive TMA\n- [ ] **Neuro-imaging** if any neuro deficit/AMS/vision change: non-contrast head CT ± MRI\n- [ ] **Chest imaging** if dissection suspected (tearing pain, pulse/BP differential, new murmur):\n  CXR then CT-angiogram chest (± abdomen)\n- [ ] **Secondary-cause screen when indicated**: urine toxicology (stimulants), pregnancy test (any\n  female of reproductive age), plasma free metanephrines/urine catecholamines if pheochromocytoma\n  suspected *(verify indication threshold)*\n- [ ] **Fundoscopy** — papilledema/flame haemorrhages/exudates support the TOD diagnosis directly at\n  the bedside\n\n## Classify before treating\n- [ ] **Hypertensive emergency** = severe BP elevation (commonly cited threshold **≥180/110–120 mmHg** *(verify)*) **WITH acute target-organ damage** — treat emergently\n- [ ] No end-organ damage → **\"asymptomatic markedly elevated BP\"** (2024 AHA statement retires the term \"hypertensive urgency\") — do **NOT** rapidly lower; resume/optimize oral therapy, arrange outpatient follow-up\n- [ ] Identify the **specific end-organ syndrome** driving management (below) — this sets the target BP, agent, and rate, not the number alone\n\n## Initial workup\n- [ ] Targeted exam for end-organ damage: neuro deficit/AMS, chest/back pain, dyspnea/rales, decreased UOP, vision change, fundoscopy (papilledema/hemorrhage), pregnancy status\n- [ ] Labs/imaging as indicated: BMP/creatinine + UA, troponin, BNP, ECG in all; head CT for any neuro sign; CXR ± CT-angiogram chest/abdo if dissection suspected\n- [ ] Screen for a reversible cause/precipitant: medication non-adherence, NSAID/illicit stimulant (cocaine/amphetamine) use, abrupt clonidine withdrawal, renal artery stenosis, pheochromocytoma\n\n## General BP-reduction strategy (default — absent a specific syndrome below)\n- [ ] **IV, titratable, short-acting agent** (e.g. labetalol, nicardipine, clevidipine, esmolol, nitroglycerin, nitroprusside — verify choice/dose) in a monitored/ICU bed\n- [ ] **Arterial line** for continuous BP monitoring while titrating *(verify institutional threshold for placement)*\n- [ ] Reduce **MAP by ≤25% in the first hour** *(verify)*, then toward ~160/100–110 mmHg over 2–6 h, normalize over 24–48 h — avoid overshoot/hypotension\n- [ ] **Avoid rapid-acting oral/sublingual agents** (e.g. sublingual nifedipine) — unpredictable, precipitous drops\n\n## Syndrome-specific overrides — supersede the general rule\n- [ ] **Aortic dissection**: SBP target **<120 mmHg**, HR 60–80, within minutes; IV **beta-blocker first** (esmolol/labetalol) before any vasodilator to blunt reflex tachycardia/shear; treat pain as part of hemodynamic control\n- [ ] **Ischemic stroke, thrombolysis/thrombectomy candidate**: BP **<185/110** pre-treatment, **<180/105** for 24 h after *(verify)* — nicardipine/labetalol\n- [ ] **Ischemic stroke, not receiving reperfusion therapy**: withhold antihypertensives unless **>220/120** *(verify)* — permissive hypertension\n- [ ] **Intracerebral hemorrhage**: SBP target **~140 mmHg** (range 130–150), reached within ~1 h if feasible *(verify)* — nicardipine\n- [ ] **Acute pulmonary edema/ADHF**: nitroglycerin ± nitroprusside, loop diuretic; avoid beta-blockade in decompensated failure\n- [ ] **ACS**: nitroglycerin ± beta-blocker (if not contraindicated) to reduce myocardial O2 demand\n- [ ] **Eclampsia/severe preeclampsia**: IV labetalol or hydralazine (or oral nifedipine); **magnesium sulfate for seizure prophylaxis**; obstetric consult re: delivery; avoid ACEi/ARB\n- [ ] **Pheochromocytoma / catecholamine excess / sympathomimetic toxicity (e.g. cocaine)**: **alpha-blockade before beta-blockade** (phentolamine) — unopposed alpha-stimulation risk if a beta-blocker is given first\n\n## Precipitant, transition, disposition\n- [ ] Address the identified precipitant (see workup) before discharge\n- [ ] Once controlled and stable, **transition to oral agents with overlap** before stopping the IV infusion\n- [ ] Restart/optimize home antihypertensives; arrange follow-up (nephrology/cardiology/obstetrics as relevant) before discharge\n\n## Pearls & pitfalls\n- [ ] Calcium-channel blocker infusions (nicardipine/clevidipine) are favoured by some as first-line —\n  most hypertensive emergencies are driven by excessive vasoconstriction, which CCBs address directly\n  (EMCrit IBCC) *(verify agent choice/availability locally)*\n- [ ] Titrate to **MAP, not an isolated SBP/DBP number** — the relative drop from the patient's baseline\n  matters more than the absolute reading (EMCrit IBCC)\n- [ ] Look for and treat **pain, agitation, volume overload, or medication withdrawal first** — these\n  can drop BP substantially on their own; treating them only after an antihypertensive infusion is\n  already running risks overshoot hypotension (EMCrit IBCC)\n- [ ] In aortic dissection, **avoid hydralazine monotherapy** — reflex tachycardia increases aortic\n  wall shear stress (EMCrit IBCC)\n- [ ] **Amlodipine has little role for acute IV-to-oral transition** — onset is far too slow for this\n  setting (EMCrit IBCC)\n- [ ] Routine arterial-line placement for every hypertensive emergency **lacks strong prospective\n  evidence of benefit** — reserve for cases where continuous titration will genuinely change management\n  (EMCrit IBCC) *(verify institutional threshold — differs from a blanket \"arterial line in all\" practice)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nEnd-organ syndrome named explicitly (not just \"elevated BP\")? · target BP/rate stated, not generic \"lower BP\"? ·\narterial line documented? · sublingual/oral rapid agent avoided? · beta-before-alpha error screened in\npheo/stimulant cases? · precipitant/secondary-cause workup documented? · magnesium given if eclampsia? ·\noral overlap + follow-up arranged?\n\n*Sources: [The Management of Elevated Blood Pressure in the Acute Care Setting — AHA Scientific Statement, Hypertension 2024](https://www.ahajournals.org/doi/10.1161/HYP.0000000000000238) · [Hypertensive Emergency — StatPearls, NCBI Bookshelf](https://www.ncbi.nlm.nih.gov/books/NBK470371/) · [2017 ACC/AHA Hypertension Guideline — Hypertension](https://www.ahajournals.org/doi/10.1161/hyp.0000000000000065) · [IBCC — Hypertensive Emergencies, EMCrit](https://emcrit.org/ibcc/htn/)*\n"}, {"file": "ich-aha-asa-2022-eso-2025.md", "title": "Intracerebral hemorrhage (ICH)", "system": "Neuro", "body": "# Intracerebral hemorrhage (ICH) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Primary source (unchanged, still current — 4y old, retained):** 2022 Guideline for the Management of\n> Patients With Spontaneous Intracerebral Hemorrhage, American Heart Association/American Stroke\n> Association, *Stroke* 2022. https://www.ahajournals.org/doi/10.1161/STR.0000000000000407\n> **Complementary source (added):** European Stroke Organisation (ESO) & European Association of\n> Neurosurgical Societies (EANS) Guideline on Stroke Due to Spontaneous Intracerebral Haemorrhage,\n> *European Stroke Journal* 2025 (Steiner T, Purrucker JC, Aguiar de Sousa D, et al.), an update of the\n> 2014 ESO ICH guideline. DOI 10.1177/23969873251340815 · PMID 40401775 ·\n> https://journals.sagepub.com/doi/full/10.1177/23969873251340815 — citation verified directly against\n> the ESO guideline directory at https://eso-stroke.org/guidelines/eso-guideline-directory/. A related\n> companion document, *2025 update to the ESO guideline on blood pressure management in acute ischaemic\n> stroke and intracerebral haemorrhage* (*European Stroke Journal* 2025), covers BP specifically —\n> flagged separately below where its BP framing differs from AHA/ASA's.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022 (AHA/ASA, primary) + 2025 (ESO/EANS,\n> complementary) · applies to spontaneous ICH only (not trauma, AVM, aneurysm, or tumor-related hemorrhage)\n\n## Why — physiology / first principles\n- Primary ICH = rupture of small penetrating arteries damaged by chronic hypertension (lipohyalinosis — deep/basal ganglia/thalamus/pons) or cerebral amyloid angiopathy (amyloid deposition in cortical/leptomeningeal vessels — lobar hemorrhage).\n- Outcome is driven less by the initial bleed than by **hematoma expansion** in the first 24h (continued bleeding from the ruptured vessel plus secondary rupture of adjacent stressed microvessels at the hematoma margin) and by secondary injury (perihematomal edema, thrombin/hemoglobin breakdown toxicity, inflammation).\n- Rationale for early aggressive BP lowering: reduces the pressure head driving expansion of a still-leaking vessel.\n- Rationale for urgent anticoagulation/antiplatelet reversal: removes the substrate sustaining ongoing hemorrhage.\n- Surgical/ICP-directed care targets mass effect; medical care targets the secondary-injury cascade — the two are complementary, not competing, strategies.\n\n## ⚠ Where AHA/ASA 2022 and ESO/EANS 2025 differ — verify locally before acting\n- **BP lowering strength of evidence**: AHA/ASA gives a fairly assertive **SBP 130–140 mmHg** target\n  (below). ESO/EANS 2025 grades the evidence for **acute BP lowering as weak** and frames it with more\n  caution — a genuine area of trans-Atlantic divergence, not just phrasing. *Follow your unit's adopted\n  standard; do not silently average the two.*\n- **Surgical evacuation evidence**: ESO/EANS 2025 explicitly grades **open craniotomy, minimally invasive\n  surgery, and decompressive surgery for supratentorial ICH as weak-evidence**, and **cerebellar ICH\n  evacuation for volume >15 mL as weak-evidence** — a **volume-based** cerebellar threshold, vs. AHA/ASA's\n  **diameter-based (>3 cm)** threshold below. *(verify both — they are not necessarily numerically\n  equivalent; confirm which your neurosurgical service uses)*\n\n## Diagnosis / definition\n- [ ] **Spontaneous (non-traumatic) ICH** — distinguish from trauma, AVM, aneurysm, or tumor-related hemorrhage (this checklist does not apply to those)\n- [ ] **Location noted** — deep/basal ganglia (typically hypertensive etiology) vs. **lobar** (raises suspicion for **cerebral amyloid angiopathy**, esp. if elderly/recurrent) — drives etiology workup below\n- [ ] **GCS documented** at presentation and trended\n- [ ] **Hematoma volume estimated** — **ABC/2 method** on non-contrast CT *(verify calculation against local practice/software)*\n- [ ] **ICH Score calculated** for mortality risk stratification — GCS, age ≥80, infratentorial origin, ICH volume ≥30 mL, IVH presence *(verify point weighting — do not use as sole basis for care-limitation decisions, see GoC note below)*\n- [ ] **CT \"spot sign\"** on CTA noted if present — predicts hematoma expansion risk *(verify — sensitivity/specificity are imperfect; a negative spot sign does not exclude expansion)*\n\n## Key labs & workup\n- [ ] **Non-contrast head CT** — first-line, diagnostic gold standard\n- [ ] **CTA head** (± CT venogram if venous thrombosis suspected) — spot sign assessment + secondary vascular cause screen\n- [ ] **Coagulation panel** — INR, PTT, platelet count — drives reversal-agent choice; **draw immediately, do not wait for result to start empiric reversal** if on known anticoagulant *(verify local turnaround)*\n- [ ] **MRI (GRE/SWI sequences)** once stable — microbleed burden, amyloid angiopathy workup\n- [ ] **Vessel imaging** (CTA/MRA or catheter angiography) if suspicion of underlying vascular lesion — young age, lobar location, atypical pattern/edema\n- [ ] **Toxicology screen** if sympathomimetic-associated ICH suspected (cocaine, amphetamines)\n\n## Management\n\n### First hour — limit hematoma expansion\n- [ ] **Non-contrast head CT** ± CTA (\"spot sign\") to assess expansion risk *(verify local protocol)*\n- [ ] **BP lowering initiated within the first hour** — AHA/ASA target **SBP 130–140 mmHg** for presenting SBP\n      150–220 mmHg *(verify — do not treat below ~130 acutely; ESO/EANS 2025 grades this evidence as\n      weak — see divergence note above)*; smooth, sustained control preferred over\n      bolus dosing — continuous infusion agent\n- [ ] **Anticoagulant identified and stopped immediately**\n- [ ] **Rapid reversal of anticoagulation**:\n  - [ ] Warfarin + INR ≥2.0 → **4-factor PCC + vitamin K** *(verify dose)*\n  - [ ] DOAC → **specific reversal agent** (e.g. andexanet/idarucizumab) or PCC per agent *(verify)*\n  - [ ] Antiplatelet-associated ICH → **platelet transfusion NOT routinely recommended** *(verify — guideline direction, confirm current stance)*\n- [ ] **Coagulopathy correction** (factor deficiency, severe thrombocytopenia) if present\n- [ ] **Repeat CT** if neurologic decline or to confirm stability of hematoma size\n\n### ICP / mass effect / hydrocephalus\n- [ ] **Neuro checks** (GCS + focal exam) at frequency per severity *(verify interval)*\n- [ ] **EVD placed** for hydrocephalus with decreased level of consciousness\n- [ ] **ICP monitoring/treatment** considered for GCS ≤8, evidence of transtentorial herniation, or\n      significant IVH/hydrocephalus *(verify indication)*\n- [ ] **Surgical evacuation considered** — posterior fossa/cerebellar ICH **>3 cm** (AHA/ASA, diameter) /\n      **>15 mL** (ESO/EANS 2025, volume) with brainstem compression or hydrocephalus is a **surgical\n      emergency**; supratentorial evacuation individualized — **minimally invasive evacuation may be\n      considered** per AHA/ASA 2022, though **ESO/EANS 2025 grades supratentorial surgical evidence\n      (open, minimally invasive, and decompressive) as weak across the board** *(verify criteria and which\n      society's framing your neurosurgical service follows)*\n- [ ] **Head of bed ≥30°**, midline positioning\n\n### Medical management\n- [ ] **Seizure prophylaxis NOT routine** — treat clinical seizures; continuous **EEG** if depressed\n      consciousness out of proportion to injury *(verify)*\n- [ ] **Glucose management** — avoid hypo- and hyperglycemia *(target per protocol — verify)*\n- [ ] **Temperature control** — treat fever aggressively\n- [ ] **VTE prophylaxis** — intermittent pneumatic compression from admission; pharmacologic ppx once\n      bleeding stability documented (commonly ~48 h) *(verify timing)*\n- [ ] **Avoid hypotonic/hypoosmolar IV fluids**\n- [ ] **Nutrition** — dysphagia screen before oral intake; early enteral if NPO prolonged\n- [ ] **Organized stroke-unit level of care** — ESO/EANS 2025 notes this carries **strong evidence** for\n      improved outcomes; confirm ICU/stroke-unit pathway is engaged, not just \"medical ICU generic care\"\n\n### Anticipatory / disposition\n- [ ] **Etiology workup** — vascular imaging if suspicion of secondary cause (young age, lobar location, atypical pattern)\n- [ ] **Goals-of-care discussion** — avoid premature \"do-not-resuscitate\" driven early withdrawal bias; use\n      validated prognostic scores cautiously, not as sole basis for care limitation\n- [ ] **Anticoagulation resumption timing** discussed with relevant specialty if indication persists (e.g. mechanical valve, high-risk AF) *(verify — individualized, no single fixed interval)*\n- [ ] **Secondary-prevention BP control** — ESO/EANS 2025 notes **strong evidence** for long-ter
