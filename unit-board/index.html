<!DOCTYPE html>
<!-- ICU Unit Board · v1 · Claude Code · 25-Aug-2026
     Reuses the real ICU Daily tool (embedded below as base64, injected per bed into an iframe).
     Build with build-board.sh (injects the tool + roundsheet.js + version). Self-contained, opens as a local file.
     Storage model: beds[n] = { d:<D schema>, stay:<id>, state:'preround'|'rounded', overnight:'', taskDone:[] }. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU Unit Board</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif}
  body{display:flex;flex-direction:column;background:#eef2f8;color:#1a1d21;font-size:15px}
  header{background:#1a3c8f;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:700}
  .fzb{font:inherit;font-weight:800;background:#2a4ea0;color:#fff;border:0;border-radius:5px;width:26px;height:24px;cursor:pointer;line-height:1}
  header select{font:inherit;padding:4px 8px;border-radius:5px;border:0}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .syncst{margin-left:auto;cursor:pointer;font-size:11px;font-weight:700;padding:4px 11px;border-radius:12px;background:#2a4ea0;color:#cfe;white-space:nowrap;user-select:none}

  .syncst.err{background:#b31414;color:#fff}
  .syncst.busy{background:#8a5a00;color:#fff}

  #robar button{font:inherit;font-weight:700;background:#6e40c9;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
  #robar button.sec{background:#8a6d3b}
  .tabs button{font:inherit;font-weight:600;background:#2a4ea0;color:#cfe;border:0;border-radius:6px 6px 0 0;padding:6px 14px;cursor:pointer}

  .raillbl{font-size:10px;font-weight:800;color:#1a3c8f;text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:2px 0 1px}
  .railgrp{display:flex;flex-direction:column;gap:6px;border:2px solid #9fbce8;border-radius:8px;padding:6px;background:#eaf1fb}
  .bedbtn{position:relative;display:block;width:100%;font:inherit;background:#fff;border:1px solid #b6cff0;border-radius:8px;padding:7px 8px 8px;cursor:pointer;text-align:left;color:#1a3c8f;line-height:1.25}
  .bedbtn.cur{background:#1a73e8;color:#fff;border-color:#1a73e8}
  .bedbtn.cur .idl,.bedbtn.cur .chip{color:#fff;background:rgba(255,255,255,.18)}
  .bedbtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#cbd5e6}
  .bedbtn.filled .dot{background:#28a745}
  .bedbtn .bn{font-weight:800;font-size:13px}
  .bedbtn .st{position:absolute;top:23px;right:6px;font-size:9px;font-weight:800;border-radius:4px;padding:0 3px}
  .bedbtn .st.pr{background:#ffe6b3;color:#8a5a00}
  .bedbtn .st.done{background:#cdeccd;color:#155f2e}
  .bedbtn .st.hv{background:#dbeafe;color:#1a5aa8}
  .bedbtn .idl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:400;font-size:10.5px;opacity:.92;margin-top:2px;line-height:1.3;padding-right:26px}

  .bedbtn .meta{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}

  .bedbtn .chip.tsk{background:#ffd9d9;color:#a11}
  .bedbtn .chip.tx{background:#dfeee0;color:#1a6b2e}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  #pastebar{background:#dbe6f6;border-bottom:1px solid #c3d4ee;padding:11px 14px;display:flex;gap:10px;align-items:stretch}

  #pjson:focus{outline:none;border-color:#1a73e8}
  #pastebar button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:8px;padding:0 20px;cursor:pointer;font-size:14px}
  #msg{font-size:11px;color:#666;align-self:center;min-width:110px}
  #bedbar{display:none;gap:8px;align-items:center;background:#eaf1fb;border-bottom:1px solid #c3d4ee;padding:7px 14px;flex-wrap:wrap}
  #bedbar .bbtag{font-weight:800;color:#1a3c8f}
  #bedbar button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
  #bedbar button.sec{background:#6b7a90}
  #bedbar button.rnd{background:#6e40c9}
  #bedbar button.asg{background:#28a745}
  #bedbar .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  #bedbar .spacer{flex:1}
  #bedbar .provchip{font-size:11px;font-weight:600;color:#8a97a8;background:#f0f3f8;border:1px solid #dbe3ef;border-radius:10px;padding:2px 8px;white-space:nowrap}
  .taskchip{font-size:11px;font-weight:600;border-radius:12px;padding:3px 9px;cursor:pointer;background:#e6ecf7;color:#1a3c8f;border:1px solid #cdd9ee}
  .taskchip.k-new{background:#e3f0ff} .taskchip.k-stop{background:#f3e0e0} .taskchip.k-watch{background:#fff0d6}
  .taskchip.done{text-decoration:line-through;opacity:.5}
  #view{flex:1;min-height:0;position:relative}
  iframe{width:100%;height:100%;border:0;background:#fff;position:absolute;inset:0}
  #hvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eaf1fb;border-bottom:1px solid #c3d4ee;padding:8px 14px;font-size:12.5px}
  #hvbar b{color:#1a3c8f}
  #hvbar .hvsp{flex:1}
  #hvbar .grp{display:flex;align-items:center;gap:3px;color:#556}
  #hvbar span.val{font-weight:700;color:#1a3c8f;min-width:40px;text-align:center}
  #hvbar button.go{font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
  #hvbar button.prt{background:#6e40c9}
  #hvbar button.sec2{background:#e6ecf7;color:#1a3c8f;border:1px solid #cdd9ee;border-radius:5px;padding:4px 9px;cursor:pointer;font-weight:600}
  #hvview{flex:1;position:relative;background:#e9edf3}
  #hvview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #collarea{background:#f3f7fd;border-top:1px solid #c3d4ee;padding:8px 14px;max-height:150px;overflow:auto;flex:0 0 auto}
  #collarea .collhdr{font-size:11px;color:#556;margin-bottom:6px;font-weight:600}
  #collarea .collrow{display:flex;align-items:flex-start;gap:8px}
  #collarea select{font:inherit;padding:5px;border-radius:5px;border:1px solid #b6cff0}
  #collarea textarea{flex:1;font-family:'Consolas','Courier New',monospace;font-size:11px;min-height:34px;padding:6px 8px;border:1px dashed #a9c4ec;border-radius:6px;resize:vertical}
  #collarea button{font:inherit;font-weight:700;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:0 14px;cursor:pointer}
  .panel{position:absolute;inset:0;overflow:auto;padding:20px;background:#eef2f8}
  .census{background:#fff;border:1px solid #d7e0ee;border-radius:8px;padding:14px 18px;max-width:680px}
  .census b{color:#1a3c8f}
  .stub{color:#667;background:#fff;border:1px dashed #b6cff0;border-radius:8px;padding:18px;max-width:680px}
  code{background:#e6ecf7;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>🏥 ICU Unit Board <span style="font-weight:400;opacity:.7;font-size:11px">v1.57 · 12-Sep-2026</span></h1>
  Unit <select id="unitSel" onchange="switchUnit()"></select>
  <span style="display:flex;gap:5px;align-items:center;font-size:12px;opacity:.95">· <input type="date" id="dateInp" onchange="onDatePick()" title="Pick a date to look back" style="font:inherit;padding:2px 6px;border-radius:5px;border:0"><button id="todayBtn" onclick="goToday()" style="display:none;font:inherit;font-weight:700;background:#2a4ea0;color:#fff;border:0;border-radius:5px;padding:3px 9px;cursor:pointer">Today</button><button id="histBtn" onclick="openHist()" title="Jump to a unit + date you entered before" style="font:inherit;font-weight:700;background:#1f3a78;color:#cfe0ff;border:0;border-radius:5px;padding:3px 9px;cursor:pointer">🕑 History</button></span>
  <span id="syncst" class="syncst" onclick="syncSetup()" title="Cross-device sync — click to set your private passphrase (same on every device)">sync off</span>
  <div class="tabs">
    <button data-sec="daily" class="on" onclick="showSec('daily')">Daily</button>
    <button data-sec="handover" onclick="showSec('handover')">Handover</button>
    <button data-sec="concise" onclick="showSec('concise')">Concise</button>
    <button data-sec="reference" onclick="showSec('reference')">📖 Reference</button>
    <button data-sec="park" onclick="showSec('park')">🅿️ Park</button>
    <button data-sec="angela" id="angtab" onclick="showSec('angela')" hidden>Angela</button>
    <button data-sec="prompts" onclick="showSec('prompts')">Prompts</button>
    <label id="anglbl" style="display:flex;align-items:center;gap:3px;margin-left:6px;font-size:11px;color:#cfe0ff;cursor:pointer" title="Angela handover — engineer-style terse view with status boxes"><input type="checkbox" id="angchk" onchange="toggleAngela()" style="cursor:pointer"> 🔬 Angela</label>
  </div>
  <span style="display:flex;gap:3px;align-items:center;margin-left:8px" title="Text size"><button class="fzb" onclick="fz(-0.08)">A&minus;</button><button class="fzb" onclick="fz(0.08)">A+</button></span>
</header>
<div id="robar"></div>
<div id="wrap">
  <aside id="rail"></aside>
  <section id="stage">
    <div id="pastebar">
      <textarea id="pjson" placeholder='Paste a bed&#39;s JSON here — it loads automatically on paste (or press ⌘/Ctrl+Enter). Routes by the "bed" field.'></textarea>
      <button onclick="loadPaste()">⤵ Load bed</button>
      <span id="msg"></span>
    </div>
    <div id="bedbar"></div>
    <div id="view"></div>
  </section>
</div>

<script>/* roundsheet.js — §23 Rounding Sheet renderer for the Unit Board.
   renderRoundingSheet(d) -> full A4-print-optimised HTML string, matching the
   24-Aug Bed-4 gold standard. Deterministic from the bed's structured data (d).
   The "Today / tasks" callout is a best-effort heuristic from plan/overnight lines
   (chat-Claude's `icu rounds` produces the full-judgment version). Print-CSS
   invariants (§23) are baked in and must not be removed. */
function rsEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// visible safety cap for the flag boxes — the JSON should already be condensed (rules §23); this is the net.
function rsCap(s,n){ s=String(s==null?'':s).replace(/\s+/g,' ').trim();
  if(!n||s.length<=n) return s;
  var cut=s.slice(0,n-1), sp=cut.lastIndexOf(' '); if(sp>n*0.6) cut=cut.slice(0,sp);   // word boundary, never mid-word (#10)
  return cut.replace(/[·\s—-]+$/,'')+'…'; }
// SMOST short-form so the rounding sheet matches the handover (M ≠ comfort) — no bare "M2" (#6)
var RS_GOC={R1:'Full code',R2:'No CPR',R3:'No CPR/intub · NIPPV OK',M1:'Medical + transfer',M2:'Medical · on-site only',C1:'Comfort care',C2:'Comfort · imminent'};
function rsGocShort(status){ var s=String(status==null?'':status).toUpperCase().trim();
  var m=s.match(/^(R[123]|M[12]|C[12])/)||(/^FULL/.test(s)?['','R1']:null);
  return m ? m[1]+' — '+RS_GOC[m[1]] : String(status==null?'':status).trim(); }
function rsShiftNow(){ var d=new Date(); if(d.getHours()<8)d.setDate(d.getDate()-1); return d; }   // 08:00→08:00 shift date
function rsDay(admit){ if(!admit)return '?'; var a=new Date(admit),t=rsShiftNow(); t.setHours(0,0,0,0); var n=Math.floor((t-a)/86400000)+1; return isNaN(n)?'?':n; }
function rsDBt(a,b){ if(!a||!b)return 0; var d1=new Date(a),d2=new Date(b); d1.setHours(0,0,0,0); d2.setHours(0,0,0,0); var n=Math.round((d2-d1)/86400000); return isNaN(n)?0:n; }
var RS_UN={sicu:'SICU',ccu:'CCU',micu:'MICU',csu:'CSU',pasqua:'PICU',picu:'PICU',picusu:'PICUSU'};
// Total hospital + ICU stay (optional §10 fields hospital_admit / prior_icu_stays). null → single-unit, unchanged.
function rsIcuTot(d){
  if(!d)return null;
  var prior=(d.prior_icu_stays||[]).filter(function(s){return s&&s.admit&&s.discharge;});
  if(!d.hospital_admit && !prior.length)return null;
  var t=rsShiftNow(); t.setHours(0,0,0,0);
  var curUnit=(d.unit||'').toUpperCase(), curDay=rsDay(d.icu_admit);
  var priorTotal=0, parts=[];
  prior.forEach(function(s){ var n=rsDBt(s.admit,s.discharge); if(n<0)n=0; priorTotal+=n;
    parts.push((RS_UN[s.unit]||String(s.unit||'ICU').toUpperCase())+' '+n+'d'); });
  parts.push(curUnit+' '+(typeof curDay==='number'?curDay:0)+'d');
  return { totalIcu: priorTotal+(typeof curDay==='number'?curDay:0),
           hospDay: d.hospital_admit ? rsDBt(d.hospital_admit,t)+1 : null,
           breakdown: parts.join(' + ') };
}
function rsDate(){ var d=rsShiftNow(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(); }
function rsFile(){ var d=rsShiftNow(),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return String(d.getDate()).padStart(2,'0')+'-'+m[d.getMonth()]+'-'+d.getFullYear(); }
function rsLines(v){ if(!v)return []; if(Array.isArray(v))return v.filter(function(x){return x!=null&&String(x).trim();}); return String(v).split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean); }
function rsWarn(t){ return /^⚠|threshold|avoid|risk|allerg|airway|unsecured|bleed|deteriorat|watch/i.test(t); }
function rsFlag(v){ // wrap (H)/(L) etc in colour spans
  return rsEsc(v).replace(/\((HH|LL|H|L)\)/g,function(m,g){ var c=(g[0]==='H')?'hi':'lo'; return '<span class="'+c+'">('+g+')</span>'; }); }

// flatten strings / arrays / {allergen,reaction}-style objects to one display string
function rsFlat(v){
  if(v==null) return '';
  if(Array.isArray(v)) return v.map(rsFlat).filter(Boolean).join(' · ');
  if(typeof v==='object'){
    var a=v.allergen||v.name||v.drug||v.substance||v.text||'';
    var r=v.reaction||v.rxn||''; a=String(a).trim(); r=String(r).trim();
    if(a) return a+(r?' ('+r+')':'');
    return Object.keys(v).map(function(k){return v[k];}).filter(function(x){return typeof x==='string'||typeof x==='number';}).join(' ').trim();
  }
  return String(v).trim();
}
function rsFlagsBlock(d){
  var aro=rsFlat(d.aro); aro=aro?aro:'None';
  var alg=rsFlat(d.allergies); alg=alg?alg:'NKA';
  var gocP=(d.problems||[]).filter(function(p){return p&&p.type==='goc';})[0];
  var goc=gocP?(rsGocShort(gocP.goc_status||'?')+(gocP.goc_note?' — '+rsCap(gocP.goc_note,300):'')):'Unknown';
  var aroCls=/none|neg/i.test(aro)?'ok':'';
  var algCls=/^nka|none|nil/i.test(alg)?'ok':'warn';
  return '<div class="flags">'
    +'<div class="flag '+aroCls+'"><span class="lbl">ARO / Isolation</span><span class="val">'+rsEsc(aro)+'</span></div>'
    +'<div class="flag '+algCls+'"><span class="lbl">Allergies</span><span class="val">'+rsEsc(alg)+'</span></div>'
    +'<div class="flag"><span class="lbl">Goals of Care</span><span class="val">'+rsEsc(goc)+'</span></div></div>';
}

function rsTodayBlock(d){
  var pend=[],mods=[],warns=[],fromTasks=false;
  // Preferred: structured tasks[] (kind: new|stop|pending|watch)
  if(Array.isArray(d.tasks)&&d.tasks.length){
    fromTasks=true;
    d.tasks.forEach(function(t){ if(!t)return; var txt=(t.text||'').trim(); if(!txt)return;
      var k=(t.kind||'pending').toLowerCase();
      if(k==='watch')warns.push(txt);
      else if(k==='pending')pend.push(txt);
      else mods.push((k==='stop'?'STOP: ':k==='new'?'NEW: ':'')+txt);
    });
  } else {
    // Fallback heuristic: bucket from plan lines + overnight text
    (d.problems||[]).forEach(function(p){
      rsLines(p&&p.plan).forEach(function(l){
        if(rsWarn(l)){ warns.push(l); return; }
        if(/pending|await|f\/u|follow.?up|repeat|echo|consult|refer|result|culture|reassess|recheck/i.test(l)){ pend.push(l); }
        else if(/^start|^new|^begin|^add |^increase|^up-?titrat|^stop|^hold|^d\/?c|^discontinu|^decreas|^wean/i.test(l)){ mods.push(l); }
      });
    });
    if(d.overnight){ rsLines(d.overnight).forEach(function(l){ pend.push(l); }); }
  }
  function ul(arr){ return arr.length?('<ul>'+arr.map(function(l){ return '<li'+(rsWarn(l)?' class="warn"':'')+'>'+rsFlag(l.replace(/^⚠\s*/,''))+'</li>'; }).join('')+'</ul>'):'<ul><li style="color:#999">—</li></ul>'; }
  var note=fromTasks?'':' <span style="font-weight:400;font-size:7.4pt;color:#a06a1a">(auto-draft — verify &amp; edit)</span>';
  return '<div class="today"><h2>⚡ Today · Key changes &amp; tasks'+note+'</h2>'
    +'<div class="today-grid">'
    +'<div class="today-cell"><span class="k">Pending / awaiting</span>'+ul(pend)+'</div>'
    +'<div class="today-cell"><span class="k">New / stop / watch</span>'+ul(mods.concat(warns))+'</div>'
    +'</div></div>';
}

function rsSnapBlock(d){
  var v=d.vitals||{}, fl=d.fluids||{};
  // Vitals + support + fluids as ONE horizontal strip (was a 4-box grid)
  var vit=[];
  if(v.bp)vit.push('BP '+rsFlag(v.bp)+(v.map?' (MAP '+rsEsc(v.map)+')':''));
  if(v.hr)vit.push('HR '+rsFlag(v.hr));
  if(v.sats)vit.push('SpO2 '+rsFlag(v.sats));
  if(v.rr)vit.push('RR '+rsFlag(v.rr));
  if(v.tmax)vit.push('Tmax '+rsFlag(v.tmax));
  if(v.gcs)vit.push('GCS '+rsEsc(v.gcs));
  if(v.resp)vit.push('Resp '+rsEsc(v.resp));
  if(v.cvs)vit.push('CVS '+rsEsc(v.cvs));
  if(v.abd)vit.push('Abd '+rsEsc(v.abd));
  if(fl.fb)vit.push('FB '+rsEsc(fl.fb));
  if(fl.uo)vit.push('UO '+rsEsc(fl.uo));
  if(fl.note)vit.push(rsEsc(fl.note));
  if(v.other)vit.push(rsEsc(v.other));
  var out=vit.length?'<div class="strip"><span class="sl">Vitals</span> '+vit.join(' &nbsp;·&nbsp; ')+'</div>':'';
  // ABG/VBG as ONE line from the labs (was its own box)
  var abg=(d.labs||[]).filter(function(s){return /abg|vbg|gas/i.test(s.section||'');})[0];
  if(abg&&abg.items&&abg.items.length){
    var parts=abg.items.filter(function(it){return it&&it.v!=null&&String(it.v).trim();}).map(function(it){
      var suf=(it.f==='hi'?' (H)':it.f==='lo'?' (L)':''); return (it.l?rsEsc(it.l)+' ':'')+rsFlag(String(it.v)+suf); });
    if(parts.length)out+='<div class="strip"><span class="sl">ABG</span> '+parts.join(' &nbsp;·&nbsp; ')+'</div>';
  }
  return out;
}

function rsLabsBlock(d){
  var labs=(d.labs||[]).filter(function(s){return !/abg|vbg|gas/i.test(s.section||'');});
  if(!labs.length)return '';
  var lines=labs.map(function(sec){
    var items=(sec.items||[]).filter(function(it){return it&&(it.v!=null&&String(it.v).trim());}).map(function(it){
      var val=String(it.v); var suf=(it.f==='hi'&&!/\(H/.test(val))?' (H)':(it.f==='lo'&&!/\(L/.test(val))?' (L)':'';
      var disp=rsFlag(val+suf);
      return (it.l?rsEsc(it.l)+' ':'')+disp;
    });
    if(!items.length)return '';
    return '<div class="line"><span class="pn">'+rsEsc((sec.section||'').replace(/\s*\(.*\)$/,''))+'</span> '+items.join(' &nbsp;·&nbsp; ')+'</div>';
  }).filter(Boolean).join('');
  return lines?('<div class="labs"><h3>Labs</h3>'+lines+'</div>'):'';
}

function rsProblemsBlock(d){
  // GoC is shown in the flags row above — NOT repeated as a problem row (de-dup, 26-Aug-2026)
  var probs=(d.problems||[]).filter(function(p){return p&&p.name&&p.type!=='goc';});
  var rows=probs.map(function(p,i){
    var isDispo=p.type==='dispo';
    var cls=isDispo?' class="dispo"':'';
    var badge=p.badge&&p.badge.text?'<span class="badge '+({b:'bl',g:'gr',o:'',r:''}[(p.badge.type||'o')]||'')+'">'+rsEsc(p.badge.text)+'</span>':'';
    // doing now = tx (+ key_labs summary); plan = plan (+ bp)
    var doing=rsLines(p.tx);
    if(p.key_labs&&p.key_labs.length){ var kl=p.key_labs.filter(function(k){return k&&k.v;}).map(function(k){return (k.l?k.l+' ':'')+k.v;}); if(kl.length)doing.push(kl.join(' | ')); }
    if(isDispo){ doing=rsLines(p.dispo_summary||p.context); }
    var plan=rsLines(p.plan).concat(rsLines(p.bp).map(function(b){return b;}));
    function ul(arr){ return arr.length?('<ul>'+arr.map(function(l){return '<li'+(rsWarn(l)?' class="warn"':'')+'>'+rsFlag(l.replace(/^⚠\s*/,''))+'</li>';}).join('')+'</ul>'):''; }
    return '<tr'+cls+'>'
      +'<td class="name">'+(i+1)+'. '+rsEsc(p.name)+badge+'</td>'
      +'<td class="doing">'+ul(doing)+'</td>'
      +'<td class="plan">'+ul(plan)+'</td></tr>';
  }).filter(Boolean).join('');
  return '<table class="prob"><thead><tr><th>Problem</th><th>Doing now</th><th>Plan</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

<script>/* handover.js — build the ICU-Handover-Universal D object from the board's per-bed Daily data.
   buildHandoverD(boardUnit, bedsMap) -> {unit, beds:{ "1":{...}|{empty:true} }} or null (CSU/MSU = no handover).
   The transform is a best-effort AUTO-DRAFT of the §2 editorial rules (pipeline + judgment briefs, 25-Aug-2026);
   the rendered handover tool is fully contenteditable, so the receiving physician fixes anything imperfect.
   Ordering is POSITIONAL (bed number) — never re-sorted. Privacy: pt = "Age·Sex·Day N" only. */

function hvClean(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
function hvLines(v){ if(!v)return []; if(Array.isArray(v))return v.map(hvClean).filter(Boolean);
  return String(v).split(/\r?\n/).map(hvClean).filter(Boolean); }
// flatten allergies (string | [str] | [{allergen,reaction}]) → "penicillin (rash) · sulfa" ; drops NKDA/none
function hvAllergy(a){
  if(!a) return '';
  var items=Array.isArray(a) ? a.map(function(x){ return (x&&typeof x==='object')
        ? hvClean((x.allergen||x.name||x.drug||'')+(x.reaction?' ('+x.reaction+')':'')) : hvClean(x); })
      : hvLines(a);
  return items.filter(Boolean).filter(function(s){ return !/^(nkda|nka|none|no known|nil|denies)\b/i.test(s); }).join(' · ');
}
// safety-flagged (**) lines first, so the length caps trim non-flagged content before a safety line
function hvPrioritize(arr){ var f=[],r=[]; arr.forEach(function(l){ (/^\s*\*\*/.test(l)?f:r).push(l); }); return f.concat(r); }
// Extract a terse cath/PCI summary from hospital_course / presentation / problem contexts — e.g. "PCI 2 DES RCA/PDA".
// Surfaces the vessels+stents into the working-dx headline (esp. CCU) without needing a regenerate.
function hvProc(d){
  var src=hvLines(d.hospital_course).concat(hvLines(d.presentation)).concat((d.problems||[]).map(function(p){return (p&&p.context)||'';}));
  // require an ACTUAL stent mention (not just "PCI"/"POBA"/"cath") to avoid false positives (SCAD-POBA, cath-pending)
  var line=src.filter(function(l){return /\b(des|stent|drug[- ]?elut)/i.test(l);})[0];
  if(!line) return '';
  // only vessels sitting within ~22 chars of a stent token — excludes vessels named in disease descriptions (e.g. "3VD")
  var vessels=[], vre=/\b(LMCA|LAD|LCx|Cx|RCA|pRCA|dRCA|PDA|PLV|OM\d?|D[12]|ramus)\b/gi, m;
  while((m=vre.exec(line))){ var i=m.index, ctx=line.slice(Math.max(0,i-22), i+m[0].length+22);
    if(/\b(des|stent|drug[- ]?elut)\b/i.test(ctx)){ var v=m[0].toUpperCase().replace(/^[PD]RCA$/,'RCA'); if(vessels.indexOf(v)<0)vessels.push(v); } }
  // COUNT: only from an EXPLICIT quantifier adjacent to a stent word ("2 DES", "1x DES", "DES x2", "two stents").
  // NEVER count raw keyword occurrences (the word "stent" repeats in prose → fabricated counts). No quantifier → no number.
  var W={one:1,two:2,three:3,four:4,five:5};
  var cm=line.match(/\b(\d+)\s*x?\s*(?:des|bms|drug[- ]?elut\w*(?:\s*stent)?|stents?)\b/i)
       || line.match(/\b(?:des|bms|stents?)\s*x\s*(\d+)\b/i)
       || line.match(/\b(one|two|three|four|five)\s+(?:des|bms|drug[- ]?elut\w*|stents?)\b/i);
  var cnt=cm ? (W[String(cm[1]).toLowerCase()]||parseInt(cm[1],10)||0) : 0;
  var word=/\bbms\b/i.test(line)?'BMS':'DES';
  if(!vessels.length && !cnt) return '';
  return ('PCI'+(cnt?' '+cnt+' '+word:'')+(vessels.length?' '+vessels.slice(0,3).join('/'):'')).trim();
}
// truncate at an ITEM (· ) boundary if possible, else a WORD boundary — never mid-word (matches Concise cFit behaviour)
function hvJoin(arr, sep, cap){ var s=arr.filter(Boolean).join(sep);
  if(!cap || s.length<=cap) return s;
  var cut=s.slice(0,cap-1), ls=cut.lastIndexOf(' · ');
  if(ls>cap*0.5) cut=cut.slice(0,ls); else { var sp=cut.lastIndexOf(' '); if(sp>0) cut=cut.slice(0,sp); }
  return cut.replace(/[·\s—-]+$/,'')+'…'; }
function hvCap(s, n){ s=hvClean(s);
  if(!n || s.length<=n) return s;
  var cut=s.slice(0,n-1), sp=cut.lastIndexOf(' ');
  if(sp>n*0.6) cut=cut.slice(0,sp);                       // prefer a word boundary; keep short caps usable
  return cut.replace(/[·\s—-]+$/,'')+'…'; }
// per-field caps tuned to the 67 mm handover cell — keeps content from silently clipping.
// The JSON should already be authored within these (rules §handover); this is the visible safety net.
var HVCAP={ admit:95, event:210, dx:170, pmhx:170, tx:185, plan:180, goc_text:95 };
function hvDay(admit){ if(!admit)return '?'; var a=new Date(admit),t=new Date(); if(t.getHours()<8)t.setDate(t.getDate()-1); t.setHours(0,0,0,0);  // 08:00 shift boundary
  var n=Math.floor((t-a)/86400000)+1; return (isNaN(n)||n<1)?'?':n; }

// Principle-10 filters: drop continuations / monitor-only / nursing routines / standing PPO orders; keep ACTIVE decisions + safety flags.
function hvTxKeep(l){
  if(/^\*\*/.test(l)) return true;                                             // safety flag — always keep
  if(/^\s*(continue|cont\.|ongoing|routine|standing|per protocol)\b/i.test(l)) return false;
  if(/foley|hob\b|head of bed|oral care|turn q|skin care|pressure area|nursing|mouth care/i.test(l)) return false;
  // routine ICU / PPO standing orders & monitoring targets — background noise, not "what we're actively doing"
  if(/icu mobility|mobility protocol|mobili[sz]|aspiration precaution|\bprecautions?\b|spo2 (goal|target|>|≥)|sat[s]? (goal|target)|o2 (goal|target)|map (goal|target|>|≥)|\bgoal\b|prophylax|\bvte\b|\bdvt\b|stress ulcer|\bppi\b|cam-?icu|neuro vitals?|q\d+h vitals?|bowel regimen|glycemic|insulin sliding|sliding scale/i.test(l)) return false;
  // fully-stopped lines are usually routine — BUT keep any that carry a safety reason/warning (e.g. "d/c heparin due to HIT — do NOT restart")
  if(/^\s*(stopped|discontinued|d\/?c'?d|completed|held)\b/i.test(l))
    return /\b(due to|because|secondary to|do ?not|don'?t|avoid|hold|allerg|\bhit\b|reaction|hypersensitiv|contraindicat|bleed|overdose|toxic)/i.test(l);
  return true;
}
function hvPlanKeep(l){
  if(/^\*\*/.test(l)) return true;                                             // safety flag
  if(/^\s*(continue|cont\.|monitor|observe|reassess|ongoing|routine|maintain|keep )\b/i.test(l)) return false;
  if(/^\s*consider\b.*\bif\b/i.test(l)) return false;                          // conditional pre-emptive
  return /transfer|wean|extubat|consult|discharg|chase|review|follow|start|stop|d\/?c|repeat|refer|book|call|optimi|titrat|target|await|trial|escalat|de-?escalat|switch|convert|remove|insert|plan for|for /i.test(l);
}
// SMOST (June 2023): 7 designations, each its OWN class. NEVER collapse M→R or M→comfort.
// R1=Full · R2=no CPR · R3=no CPR/intub · M1=medical+transfer · M2=medical on-site · C1=comfort · C2=comfort/imminent
function hvGocClass(status){
  var s=hvClean(status).toUpperCase();
  if(/^R1/.test(s) || /^FULL/.test(s)) return 'goc-r1';
  if(/^R2/.test(s)) return 'goc-r2';
  if(/^R3/.test(s)) return 'goc-r3';
  if(/^M1/.test(s)) return 'goc-m1';
  if(/^M2/.test(s)) return 'goc-m2';
  if(/^C1/.test(s)) return 'goc-c1';
  if(/^C2/.test(s)) return 'goc-c2';
  return 'goc-uk';
}
// verbatim short-forms — M is never "comfort"; comfort begins at C1
var GOC_SHORT={R1:'Full code',R2:'No CPR',R3:'No CPR/intub · NIPPV OK',M1:'Medical + transfer',M2:'Medical · on-site only',C1:'Comfort care',C2:'Comfort · imminent'};
function hvGocCode(status){ var m=hvClean(status).toUpperCase().match(/^(R[123]|M[12]|C[12])/); return m?m[1]:(/^FULL/.test(hvClean(status).toUpperCase())?'R1':''); }
function hvGocShort(status){ var c=hvGocCode(status); return c?(c+' — '+GOC_SHORT[c]):hvClean(status); }
// Transfer tag — unambiguous DIRECTION (→ leaving to / ← came from) + SPECIFIC destination + DATE. Never a bare "Transfer".
var HV_MONc={jan:'Jan',feb:'Feb',mar:'Mar',apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'};
function hvTransferTag(s){
  var sl=s.toLowerCase();
  var dm=s.match(/\b(\d{1,2})\s?(?:st|nd|rd|th)?[-\s]?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i)
       || s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[-\s]?(\d{1,2})\b/i);
  var date='';
  if(dm){
    var dNum, mName; if(/^\d/.test(dm[1])){ dNum=+dm[1]; mName=dm[2]; } else { dNum=+dm[2]; mName=dm[1]; }
    var mIdx={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11}[mName.toLowerCase()];
    var now=new Date(); now.setHours(0,0,0,0);
    var dt=new Date(now.getFullYear(), mIdx, dNum); dt.setHours(0,0,0,0);
    if(dt-now>300*86400000) dt=new Date(now.getFullYear()-1, mIdx, dNum);   // rolled into future → last year
    var diff=Math.round((now-dt)/86400000);
    if(diff>=1 && diff<=120) date=' · '+diff+'d';                           // boarding / pending N days
    else if(diff===0) date=' · today';
    else date=' · '+dNum+' '+HV_MONc[mName.toLowerCase()];                  // future/planned → show the date
  }
  // DIRECTION (#2): dispo_summary is almost always an OUTBOUND plan. Only call it inbound on a
  // movement-verb-adjacent "from"/"in" cue, AND only if there's no explicit outbound "to/out" cue.
  // (Fixes "Transfer TO Rehab … weaned FROM O2" flipping to "← from Rehab" on the bare word "from".)
  var outCue=/\b(?:transfer(?:red)?|discharg\w*|d\/?c'?\w*|send|sent|step[- ]?down|refer\w*|dispo\w*)\s+(?:the\s+patient\s+)?(?:to|out)\b/.test(sl)
    || /\b(?:to|out to)\s+(?:the\s+)?(?:ward|floor|home|medicine|hospitalist|step|or\b|surgery|oncolog|surveillance|rehab|ltac|palliat|hospice|psych|another|outside)/.test(sl)
    || /→/.test(s);
  var inCue=/\b(?:transfer(?:red)?|repatriat\w*|received|accepted|admitted|arriv\w*)\s+(?:from|in)\b/.test(sl)
    || /\bfrom\s+(?:an?\s+)?(?:outside|referring|another|other|osh\b)/.test(sl)
    || /←/.test(s);
  var inbound=inCue && !outCue;
  var dest;
  if(/hospitalist/.test(sl)) dest='Hospitalist ward';
  else if(/internal medicine|general medicine|\bmedicine\b|\bgim\b|\bim\b/.test(sl)) dest='Medicine ward';
  else if(/surg/.test(sl)) dest='Surgery ward';
  else if(/surveillance|\bpsu\b/.test(sl)) dest='Pasqua Surveillance';
  else if(/oncolog|cancer/.test(sl)) dest='Oncology';
  else if(/step[\s-]?down|\bhdu\b/.test(sl)) dest='Step-down';
  else if(/\brehab/.test(sl)) dest='Rehab';
  else if(/ltac|long[\s-]?term/.test(sl)) dest='LTACH';
  else if(/palliat|hospice/.test(sl)) dest='Palliative';
  else if(/psych/.test(sl)) dest='Psychiatry';
  else if(/home|discharge/.test(sl)) dest='Home';
  else if(/\bor\b|theatre|operat/.test(sl)) dest='OR';
  else if(/\bm?icu\b|\bsicu\b|\bpicu\b|\bccu\b|\bcsu\b/i.test(s)){ var um=s.match(/\b(m?icu|sicu|picu|ccu|csu)\b/i); dest=um?um[1].toUpperCase():'ICU'; }
  else if(/\bward\b|\bfloor\b/.test(sl)) dest='Ward';
  // fallback: capture the destination after a to/from, stopping at a clause boundary (comma, once/when/if/for/pending/after)
  else { var mm=s.match(/(?:to|from|→|←)\s+([A-Za-z][A-Za-z /'-]{1,28}?)(?=\s*(?:,|;|\bonce\b|\bwhen\b|\bif\b|\bfor\b|\bpending\b|\bafter\b|\bwhen\b|$))/i);
         dest=mm?mm[1].trim():hvCap(s,22); }
  return (inbound?'← from ':'→ ')+dest+date;
}

function bedToHandover(d, overnight, uncap){
  d=d||{}; var CAP=uncap?{}:HVCAP;   // uncap:true (Concise view) → no field caps, full text wraps
  var day=hvDay(d.icu_admit);
  var probs=(d.problems||[]);
  var goc=probs.filter(function(p){return p&&p.type==='goc';})[0];
  var dispo=probs.filter(function(p){return p&&p.type==='dispo';})[0];
  var active=probs.filter(function(p){return p&&p.name&&p.type!=='goc'&&p.type!=='dispo';});  // regular problems = anything not goc/dispo (robust to type:"problem" that captureToD stamps on edit)

  var pt=hvClean(d.age_sex)+' · Day '+day;
  var subA=hvClean(d.subtitle||hvLines(d.diagnoses)[0]||'').replace(/^\d+[.)]\s*/,'');   // hvLines() tolerates diagnoses as string OR array (#7)
  var proc = /\bpci\b|\bstent|\bdes\b|\bcath/i.test(subA) ? '' : hvProc(d);   // fold cath/PCI vessels+stents into the headline if not already stated
  var admit=hvCap(subA+(proc?' · '+proc:''), CAP.admit);

  // event: prefer Claude's handover_line; else presentation + hospital-course
  var event=hvClean(d.handover_line);
  if(!event){
    var pres=hvLines(d.presentation).slice(0,3).join(' ');
    var hc=hvLines(d.hospital_course).slice(0,2).join(' ');
    event=hvClean(pres+(hc?' '+hc:''));
  }
  event=hvCap(event, CAP.event);

  // dx = problem HEADLINES only — strip the " — descriptor" tail so names don't overflow/clip
  var dx=hvJoin(active.map(function(p){return hvClean(p.name).replace(/\s*—.*$/,'').replace(/\s*\(.*$/,'');}), ' · ', CAP.dx);
  // pmhx = the MAIN thing per comorbidity — keep dates, drop pathology/genetics minutiae. Per-item cap + first 6.
  var pmhx=hvJoin(hvLines(d.pmhx).slice(0,uncap?99:6).map(function(l){return hvCap(hvClean(l), uncap?0:46);}), ' · ', CAP.pmhx);
  var txAll=[]; active.forEach(function(p){ hvLines(p.tx).filter(hvTxKeep).forEach(function(l){txAll.push(l);}); });
  var tx=hvJoin(hvPrioritize(txAll), ' · ', CAP.tx);   // ** safety lines first so caps never slice them (#5)
  var planAll=[]; active.forEach(function(p){ hvLines(p.plan).filter(hvPlanKeep).forEach(function(l){planAll.push(l);}); });
  (d.tasks||[]).forEach(function(t){ if(t&&t.kind==='new')planAll.push(hvClean(t.text)); else if(t&&t.kind==='stop')planAll.push('Stop '+hvClean(t.text)); });
  if(dispo&&dispo.dispo_summary) planAll.push(hvClean(dispo.dispo_summary));
  var plan=hvJoin(hvPrioritize(planAll), ' · ', CAP.plan);

  var gocClass=hvGocClass(goc&&goc.goc_status);
  var gocStat=hvClean(goc&&goc.goc_status).toUpperCase();
  // goc_text = a short PROMPT (code + what's pending/to confirm), NOT the ceiling-of-care essay (that lives in the SCM note).
  var goc_text='';
  if(goc){ var gs=hvGocShort(goc.goc_status)||hvClean(goc.goc_status);
    var gn=hvClean(goc.goc_note); if(gn) gn=hvCap(gn.split(/\.\s|;\s/)[0], 58);   // first clause only, tight
    goc_text=hvCap(gs+(gn?' — '+gn:''), CAP.goc_text); }

  // tags: ALLERGY (never-miss, leads) · transfer (DIRECTION + destination + date) · M/C-level GoC alert · new · ARO
  var tags=[];
  var alg=hvAllergy(d.allergies);
  if(alg) tags.push({cls:'alert-tag',text:'⚠ Allergy: '+alg});   // #3 — allergies reach the auto-handover card (was rounding-sheet only)
  if(dispo&&dispo.dispo_summary){ tags.push({cls:'transfer-tag',text:hvTransferTag(hvClean(dispo.dispo_summary))}); }
  // GoC ceiling tag: M2/C1/C2 = escalation-limited → ⚠ alert; R3/M1 = a plain info chip (still active/aggressive care)
  if(/^(M2|C1|C2)/.test(gocStat)) tags.push({cls:'alert-tag',text:'⚠ '+hvGocShort(gocStat)});
  else if(/^(R3|M1)/.test(gocStat)) tags.push({cls:'goc-tag',text:hvGocShort(gocStat)});
  if(day===1) tags.push({cls:'new-tag',text:'New Admit'});
  if(hvClean(d.aro)) tags.push({cls:'aro-tag',text:'ARO: '+hvClean(d.aro)});

  var ovn=hvClean(overnight);
  // alert border for beds a receiving MD should walk first: M/C-level GoC, or a ⚠ watch task
  var hasWatch=(d.tasks||[]).some(function(t){return t&&t.kind==='watch';});
  var alertFlag=/^(M2|C1|C2)/.test(gocStat)||hasWatch;   // escalation-limited ceilings only (M1/R3 still get active care)

  var bed={ pt:pt, goc:gocClass, alert:alertFlag, tags:tags.slice(0,3),
    admit:admit, event:event, overnight:ovn, dx:dx, pmhx:pmhx, tx:tx, goc_text:goc_text, plan:plan };
  if(ovn) bed._ovn_show=true;   // auto-reveal the green strip
  return bed;
}

// board unit -> handover tool unit + bed count (CSU/MSU = no handover sheet)
function hvUnitCfg(boardUnit){
  var u=String(boardUnit||'').toUpperCase();
  if(u.indexOf('PICU')>=0) return {tool:'picu', n:11};   // PICU+PICUSU combined 1–11
  if(u==='MICU') return {tool:'micu', n:10};
  if(u==='SICU') return {tool:'sicu', n:12};
  if(u==='CCU')  return {tool:'ccu', n:12};
  return null;                                            // CSU, MSU → admission-only
}

// a Claude-condensed mini-card (hv:1) — normalise to the tool's bed shape, apply board overnight
function normHvCard(c, overnight){
  c=c||{};
  var ovn=hvClean(overnight||c.overnight);
  var bed={ pt:hvClean(c.pt), goc:c.goc||'goc-uk', alert:!!c.alert, tags:(c.tags||[]).slice(0,3),
    admit:hvClean(c.admit), event:hvClean(c.event), overnight:ovn, dx:hvClean(c.dx),
    pmhx:hvClean(c.pmhx), tx:hvClean(c.tx), goc_text:hvClean(c.goc_text), plan:hvClean(c.plan) };
  if(ovn) bed._ovn_show=true;
  return bed;
}

// pre-authored handover card baked into the bed's §10 JSON (d.handover) — the gold path.
// Claude authored it with full context; the board only derives pt + GoC colour + overnight.
function authoredCard(d, overnight, uncap){
  var h=d.handover||{}; var CAP=uncap?{}:HVCAP;
  var day=hvDay(d.icu_admit);
  var goc=(d.problems||[]).filter(function(p){return p&&p.type==='goc';})[0];
  var ovn=hvClean(overnight||h.overnight);
  var bed={ pt:hvClean(d.age_sex)+' · Day '+day,
    goc: h.goc || hvGocClass(goc&&goc.goc_status),
    alert: !!h.alert,
    tags: (h.tags||[]).slice(0,3),
    admit: hvCap(h.admit||d.subtitle, CAP.admit),
    event: hvCap(h.event, CAP.event),
    overnight: ovn,
    dx: hvCap(h.dx, CAP.dx),
    pmhx: hvCap(h.pmhx, CAP.pmhx),
    tx: hvCap(h.tx, CAP.tx),
    goc_text: hvCap(h.goc_text || (goc?((goc.goc_status||'')+(goc.goc_note?' — '+goc.goc_note:'')):''), CAP.goc_text),
    plan: hvCap(h.plan, CAP.plan) };
  if(ovn) bed._ovn_show=true;
  return bed;
}

function buildHandoverD(boardUnit, bedsMap, uncap){
  var cfg=hvUnitCfg(boardUnit); if(!cfg) return null;
  var beds={};
  for(var n=1;n<=cfg.n;n++){
    var w=bedsMap&&bedsMap[n];
    // #8 — per-bed isolation: one malformed bed must never blank the whole unit's handover at shift change
    try {
      beds[String(n)] = (w&&w.hvcard)          ? normHvCard(w.hvcard, w.overnight)       // colleague mini-card
                      : (w&&w.d&&w.d.handover) ? authoredCard(w.d, w.overnight, uncap)   // pre-authored (gold)
                      : (w&&w.d)               ? bedToHandover(w.d, w.overnight, uncap)  // transform (fallback)
                      :                          {empty:true};
    } catch(e){
      beds[String(n)] = { pt:'Bed '+n, admit:'⚠ render error — open this bed and re-paste', _err:String(e&&e.message||e), goc:'goc-uk', tags:[] };
    }
  }
  return {unit:cfg.tool, beds:beds};
}

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function bd(n){ return beds[n]?beds[n].d:null; }               // the D (schema) object for a bed

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var SHIFT_START_HR=8;   // shifts run 08:00 → 08:00; a time before 08:00 still belongs to YESTERDAY's shift
function shiftNow(){ var d=new Date(); if(d.getHours()<SHIFT_START_HR)d.setDate(d.getDate()-1); return d; }   // the current shift's calendar date
function today(){var d=shiftNow();return String(d.getDate()).padStart(2,'0')+'-'+MON[d.getMonth()]+'-'+d.getFullYear();}
function isoToday(){var d=shiftNow();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function boardDate(iso){var p=String(iso).split('-');return p[2]+'-'+MON[(+p[1])-1]+'-'+p[0];}   // YYYY-MM-DD -> DD-Mon-YYYY
var viewIso=isoToday(), readOnly=false;

function isTodayView(){ return viewIso===isoToday(); }

// ---- Entry history: every unit+date you've entered, newest first, click to jump ----
function dmyToIso(s){ var p=String(s).split('-'); var mi=MON.indexOf(p[1]); if(mi<0)return null;
  return p[2]+'-'+String(mi+1).padStart(2,'0')+'-'+String(+p[0]).padStart(2,'0'); }
function collectHistory(){
  var map={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    var m=k&&k.match(/^unitboard_(.+)_(\d{2}-[A-Za-z]{3}-\d{4})$/);   // unit may contain space/+ (Rapid Response, PICU+PICUSU) — was [A-Za-z]+ which dropped them from History
    if(!m)continue;
    var iso=dmyToIso(m[2]); if(!iso)continue;
    var n=0; try{var b=JSON.parse(localStorage.getItem(k)||'{}'); n=Object.keys(b).filter(function(x){return b[x];}).length;}catch(e){}
    if(!n)continue;   // skip empty local shells
    var at=parseInt(localStorage.getItem('ub_stateAt_'+m[1]+'_'+m[2])||'0',10)||0;
    map[m[1]+'|'+m[2]]={unit:m[1],date:m[2],iso:iso,beds:n,at:at};
  }
  return map;
}
function gotoUnitDate(u,iso){
  captureCurrentBed(); current=null;
  var sel=document.getElementById('unitSel'); if(sel)sel.value=u; unit=u;
  viewIso=iso; readOnly=!isTodayView();
  document.getElementById('dateInp').value=iso;
  document.getElementById('todayBtn').style.display=isTodayView()?'none':'inline-block';
  beds={}; load(); renderRail(); renderRoBar();
  setSync(syncOn()?'⇅ syncing…':'sync off', syncOn()?'busy':''); if(syncOn())syncPull();
  showSec('daily'); closeHist();
}
function renderHistList(map){
  var body=document.getElementById('histbody'); if(!body)return;
  var items=Object.keys(map).map(function(k){return map[k];})
    .sort(function(a,b){ if(a.iso!==b.iso)return a.iso<b.iso?1:-1; return a.unit<b.unit?-1:1; });
  if(!items.length){ body.innerHTML='<div style="padding:24px;text-align:center;color:#889">No entries yet. As you chart beds, each unit + date shows up here.</div>'; return; }
  var todayIso=isoToday(), rows='', lastDate='';
  items.forEach(function(it){
    if(it.date!==lastDate){ rows+='<div class="hdate">'+esc(it.date)+(it.iso===todayIso?' · today':'')+'</div>'; lastDate=it.date; }
    var meta=(it.beds!=null?(it.beds+' bed'+(it.beds===1?'':'s')):'☁ synced')
      +(it.at?' · '+new Date(it.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'')
      +(it.remote&&it.beds==null?'':(it.remote?' · ☁':''));
    rows+='<div class="hrow" onclick="gotoUnitDate(\''+it.unit+'\',\''+it.iso+'\')">'
      +'<span class="hunit">'+esc(it.unit)+'</span><span class="hmeta">'+esc(meta)+'</span><span class="hgo">↦</span></div>';
  });
  body.innerHTML=rows;
}
function openHist(){

      +'<div id="histbody" style="overflow:auto;padding:6px 0"></div></div>';
    document.body.appendChild(mo);

    st.textContent='#histmodal .hdate{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#8a97a8;padding:9px 16px 3px}'
      +'#histmodal .hrow{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-top:1px solid #eef2f8}'

      +'#histmodal .hmeta{flex:1;color:#556;font-size:12.5px}'
      +'#histmodal .hgo{color:#2a4ea0;font-weight:800}';
    document.head.appendChild(st);
  }
  var map=collectHistory();
  renderHistList(map);
  mo.style.display='flex';
  if(syncOn()){
    fetch(SB_URL+'?select=unit,date,updated_at&space=eq.'+encodeURIComponent(syncSpace)+'&limit=800',{headers:sbH()})
      .then(function(r){return r.json();})
      .then(function(rows){ if(!Array.isArray(rows))return;
        rows.forEach(function(row){ var iso=dmyToIso(row.date); if(!iso)return; var key=row.unit+'|'+row.date;
          var at=Date.parse(row.updated_at)||0;
          if(!map[key])map[key]={unit:row.unit,date:row.date,iso:iso,beds:null,at:at,remote:true};
          else map[key].at=Math.max(map[key].at,at); });
        renderHistList(map);
      }).catch(function(){});
  }
}

function taskCount(w){ if(!w||!w.d||!w.d.tasks)return 0; var done=w.taskDone||[],c=0;

function dispoMark(d){ if(!d)return ''; var s=''; (d.problems||[]).forEach(function(p){ if(p&&p.type==='dispo')s+=' '+(p.dispo_summary||''); });

var SHIFT_ICS='https://qbtnxkzpddexczhcvxre.supabase.co/storage/v1/object/public/calendars/wb-nvdb-09e26658c4a643a6.ics';
var SHIFT_TZ_OFF=-6;   // Regina is UTC−6 all year (no DST)
// SUMMARY (emoji + unit) → {unit:<board dropdown key or null>, label}. Matched on TEXT (robust to emoji encoding).
function shiftMap(summary){
  var s=String(summary||'');
  if(/pasqua[\s-]*rapid|(^|[^-])\bMSU\b/i.test(s) && /MSU|pasqua/i.test(s)) return {unit:'MSU', label:'Pasqua-Rapid / MSU (day+night)'};
  if(/PHICU|\bPICU/i.test(s)) return {unit:'PICU+PICUSU', label:'PHICU (24h call)'};
  if(/\bMICU\b/i.test(s)) return {unit:'MICU', label:'MICU (24h call)'};
  if(/\bSICU\b/i.test(s)) return {unit:'SICU', label:'SICU (24h call)'};
  if(/\bCCU\b/i.test(s))  return {unit:'CCU',  label:'CCU (24h call)'};
  if(/\bRR\b|rapid\s*response/i.test(s)) return {unit:'Rapid Response', label:'Rapid Response (day 08:00–17:00)'};   // now a real board view (§27)
  return {unit:null, label:s.replace(/^[^\w]+/,'').trim()||'(shift)'};
}
// find the event whose LOCAL (UTC−6) start-date equals today's shift date; return {map, ev} or null
function shiftForToday(ics){
  var today=shiftNow(); var ty=today.getFullYear(), tm=today.getMonth(), td=today.getDate();
  var evs=ics.split(/BEGIN:VEVENT/).slice(1), hit=null;
  evs.forEach(function(block){
    var ds=(block.match(/DTSTART[^:]*:(\d{8}T\d{6}Z)/)||[])[1];
    var sm=(block.match(/SUMMARY:(.*)/)||[])[1];
    if(!ds||!sm) return;
    var m=ds.match(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z$/);
    var loc=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]) + SHIFT_TZ_OFF*3600000);
    if(loc.getUTCFullYear()===ty && loc.getUTCMonth()===tm && loc.getUTCDate()===td) hit={map:shiftMap(sm.trim()), sum:sm.trim()};
  });
  return hit;
}

function loadJSONText(t, srcMsg){
  var msg=document.getElementById('msg');
  var parsed; try{ parsed=JSON.parse(t); }catch(e){ if(msg)msg.textContent='⚠ Not valid JSON: '+e.message; return {loaded:[],err:e.message}; }
  var arr=Array.isArray(parsed)?parsed:[parsed];
  // switch unit once, from the first entry that names a known unit — BUT not while in RR (entries stay in RR) and not for prep drafts (they go to Park)
  if(!isRR()) for(var i=0;i<arr.length;i++){ if(arr[i]&&arr[i].prep===true)continue; var u=arr[i]&&normUnit(arr[i].unit); if(arr[i]&&arr[i].unit&&UNITS[u]&&u!==unit){ unit=u; document.getElementById('unitSel').value=unit; load(); break; } }
  var loaded=[], errs=[];
  arr.forEach(function(d){ var r=routeEntry(d); if(r.ok)loaded.push(r.bed); else errs.push(r.err); });
  save();
  if(msg) msg.textContent=(loaded.length?'✓ '+(srcMsg||'Loaded')+' '+loaded.length+' bed'+(loaded.length>1?'s':'')+' ('+loaded.join(', ')+')':'')+(errs.length?' · ⚠ '+errs.join('; '):'');
  return {loaded:loaded, errs:errs};
}
function loadPaste(){
  if(!guardEdit())return;
  var t=document.getElementById('pjson').value.trim();
  if(!t){ document.getElementById('msg').textContent='Paste a bed JSON (or an array) first.'; return; }
  captureCurrentBed();                 // persist whatever's open BEFORE the paste overwrites bed data…
  var res=loadJSONText(t);             // …then routeEntry replaces beds[n].d with the fresh paste (+ clears stale _scm)
  if(res.loaded===undefined) return;
  document.getElementById('pjson').value='';
  // prep draft(s) → landed in Park: jump to the Park tab so the user sees them
  if(res.loaded.length && res.loaded.every(function(k){return String(k).charAt(0)==='p';}) && !isRR()){
    document.getElementById('msg').textContent='🅿️ Parked '+res.loaded.length+' prep draft'+(res.loaded.length>1?'s':'')+' — see the Park tab.';
    showSec('park'); return; }
  renderRail();
  // NB: set current + render directly — do NOT call openBed() here, its captureCurrentBed() would clobber the fresh paste
  if(res.loaded.length>=1 && section==='daily'){ current=res.loaded[res.loaded.length-1]; setTab('daily'); renderRail(); renderView(); }
  else renderView();
}

function setTab(s){ document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.sec===s); }); }
function renderView(){
  var view=document.getElementById('view'); view.innerHTML='';
  if(section==='daily'){
    if(current!=null){
      if(!beds[current]){ view.innerHTML='<div class="panel"><div class="stub">Bed '+current+' is empty — paste this bed&rsquo;s JSON in the box above to load it.</div></div>'; }
      else if(beds[current].rr && (beds[current].kind==='consult'||beds[current].kind==='code')){ view.innerHTML=rrCardHTML(current); bindRRCard(current); }
      else if(beds[current].hvcard && !beds[current].d){
        view.innerHTML='<div class="panel"><div class="stub"><b>Bed '+current+' — handover-only.</b><br>A colleague / uncharted bed (mini handover card, <code>hv:1</code>). It appears on the <b>Handover</b> tab. To add a full daily note, paste this bed&rsquo;s §10 JSON.</div></div>';
      }
      else {
        var d=bd(current), f=document.createElement('iframe'), html;
        if(d && d.note_type==='admission'){
          // board owns persistence → neutralise the admission tool's resume/autosave; inject zoom
          html=admissionToolHTML()
            .replace("if(D&&typeof D==='object'){","maybeRestoreState=function(){};saveState=function(){};if(D&&typeof D==='object'){")
            .replace("</head>","<style>body{zoom:"+fontScale+"}#jp{display:none!important}</style></head>")
            .replace(ADM_NEEDLE, "var D="+JSON.stringify(d)+",SCM='',U='"+admUnitCode(d)+"';");
        } else {
          html=toolHTML()
            .replace("if(D){","checkSavedState=function(d){return d;};saveState=function(){};attachSaveListeners=function(){};if(D){")
            .replace("</head>","<style>body{zoom:"+fontScale+"}#jp{display:none!important}</style></head>")
            .replace(NEEDLE, "var D="+JSON.stringify(d)+",SCM='';");
        }
        f.srcdoc=html; view.appendChild(f);
        // restore a previously-generated SCM block on return to this bed (Item 2 fix)
        if(beds[current]._scm){ (function(scm){ f.addEventListener('load',function(){ try{ var doc=f.contentDocument, s=doc.getElementById('scm'), p=doc.getElementById('sp'); if(s&&p){ s.textContent=scm; p.style.display='block'; if(doc.defaultView)doc.defaultView.SCM=scm; } }catch(e){} }); })(beds[current]._scm); }
      }
    } else {
      view.innerHTML='<div class="panel"><div class="stub">Pick a bed on the left, or paste a bed JSON above. It auto-routes by the <code>bed</code> field.</div></div>';
    }
  } else if(section==='handover'){ renderHandover(view); }
  else if(section==='concise'){ renderConcise(view); }
  else if(section==='reference'){ renderReference(view); }
  else if(section==='park'){ renderPark(view); }
  else if(section==='angela'){ renderAngela(view); }
  else if(section==='prompts'){ view.innerHTML=promptsPanel(); }
  renderBedBar();
}
// capture the OUTGOING bed's iframe state (edited fields via captureToD + the SCM block) before it's re-mounted
function captureCurrentBed(){
  if(current==null||!beds[current]||!beds[current].d||readOnly)return;
  try{
    var ifr=document.querySelector('#view iframe'); if(!ifr)return;
    if(ifr.contentWindow&&typeof ifr.contentWindow.captureToD==='function'){ var ed=ifr.contentWindow.captureToD();
      if(ed&&ed.bed!=null){
        var o=beds[current].d;
        // if you actually edited the structured content, the pre-authored handover card is now stale → drop it so Handover/Concise re-derive from your edit
        var changed=JSON.stringify([o.problems,o.pmhx,o.subtitle,o.diagnoses,o.vitals,o.aro])!==JSON.stringify([ed.problems,ed.pmhx,ed.subtitle,ed.diagnoses,ed.vitals,ed.aro]);
        if(changed){ delete ed.handover; delete ed.handover_line; }
        beds[current].d=ed;
      } }
    var doc=ifr.contentDocument;
    if(doc){ var s=doc.getElementById('scm'), p=doc.getElementById('sp'); if(s&&p&&p.style.display==='block'&&(s.textContent||'').trim())beds[current]._scm=s.textContent; }
    save();
  }catch(e){}
}
function openBed(n){ captureCurrentBed(); current=n; section='daily'; setTab('daily'); renderRail(); renderView(); }
function showSec(s){ if(section==='daily')captureCurrentBed(); section=s; setTab(s); renderView(); }

function toggleRounded(){ if(!guardEdit())return; var w=beds[current]; if(!w)return; w.state=(w.state==='rounded')?'preround':'rounded'; save(); renderRail(); renderBedBar(); }
function toggleTask(i){ if(!guardEdit())return; var w=beds[current]; if(!w)return; w.taskDone=w.taskDone||[]; var k=w.taskDone.indexOf(i);
  if(k>=0)w.taskDone.splice(k,1); else w.taskDone.push(i); save(); renderRail(); renderBedBar(); }
function addTask(){ if(!guardEdit())return; var w=beds[current]; if(!w)return; var t=prompt('New task / watch-item for Bed '+current+':'); if(!t)return;
  w.d.tasks=w.d.tasks||[]; w.d.tasks.push({text:t,kind:'pending'}); save(); renderRail(); renderBedBar(); }
function archiveBed(n,reason){ try{ var h=JSON.parse(localStorage.getItem(histKey())||'[]'); var w=beds[n];
  h.push({date:today(),unit:unit,bed:n,reason:reason,stay:w.stay,state:w.state,overnight:w.overnight||'',d:w.d,archivedAt:Date.now()});
  localStorage.setItem(histKey(), JSON.stringify(h)); }catch(e){} }
function newAdmission(n){ if(!guardEdit())return; if(!beds[n])return; if(!confirm('Start a NEW admission in Bed '+n+'?\nThe current note is archived to history and the bed is cleared.'))return;
  archiveBed(n,'new-admission'); delete beds[n]; save(); renderRail(); renderView();
  document.getElementById('msg').textContent='Bed '+n+' cleared — paste the new patient’s JSON.'; }
function transferBed(n){ if(!guardEdit())return; if(!beds[n])return; var r=prompt('Transfer / discharge Bed '+n+' — reason?\n(ward / step-down / home / died)','ward'); if(r===null)return;
  archiveBed(n, r||'transfer'); delete beds[n]; if(current===n)current=n; save(); renderRail(); renderView();
  document.getElementById('msg').textContent='Bed '+n+' transferred ('+(r||'—')+') → archived to history.'; }

    +'<span class="grp">Row <button class="fzb" onclick="hvAdj(\'rowmm\',-2)">&minus;</button><span class="val">'+hvOpts.rowmm+'mm</span><button class="fzb" onclick="hvAdj(\'rowmm\',2)">+</button></span>'
    +'<span class="grp">Margin <button class="fzb" onclick="hvAdj(\'margin\',-1)">&minus;</button><span class="val">'+hvOpts.margin+'mm</span><button class="fzb" onclick="hvAdj(\'margin\',1)">+</button></span>'

    +consumeDateBar()
    +'<button class="sec2" onclick="hvTips()">Print tips</button>'
    +hovBadge()
    +'<button class="go" style="background:#1f8a4c" onclick="saveHovFromHandover()" title="Save your edits as version 2 (syncs across devices)">💾 Save as v2</button>'
    +'<button class="go prt" onclick="printHandover()">🖨 Print</button>'

  var coll='<div id="collarea"><div class="collhdr">Add a bed you didn’t chart — paste a mini-JSON / an array (from <code>handover beds:</code>, routes by bed) or a raw progress note (pick the bed):</div>'
    +'<div class="collrow"><select id="collbed">'+(opts||'<option>—</option>')+'</select>'

  view.innerHTML='<div style="position:absolute;inset:0;display:flex;flex-direction:column">'+bar+'<div id="hvview"></div>'+coll+'</div>';

    +'@page{size:A4 portrait;margin:'+hvOpts.margin+'mm 3mm}'
    +'.bed-card,.notes-cell-content{height:'+hvOpts.rowmm+'mm!important;max-height:'+hvOpts.rowmm+'mm!important}'
    +'</style></head>';
  // cascade the consumption-date offset onto day-counters before injecting into the handover tool
  var Dh=hvDayOffset ? (function(){ var c=JSON.parse(JSON.stringify(D)); Object.keys(c.beds).forEach(function(k){ var b=c.beds[k]; if(b&&!b.empty){ if(b.pt)b.pt=refShiftPtDay(b.pt); ['admit','event','dx','tx','plan','goc_text'].forEach(function(f){ if(b[f])b[f]=refShiftText(b[f]); }); } }); return c; })() : D;
  var html=handoverToolHTML().replace('</head>',over).replace('var D = null;','var D = '+JSON.stringify(Dh)+';');

function hvAdj(k,delta){
  var lo={font:0.7,rowmm:55,margin:2}[k], hi={font:1.4,rowmm:85,margin:20}[k];
  hvOpts[k]=Math.max(lo,Math.min(hi, Math.round(((hvOpts[k]||0)+delta)*100)/100));
  hvSave(); renderView();
}
function hvReset(){ hvOpts={font:1,rowmm:67,margin:7}; hvSave(); renderView(); }
function printHandover(){ var f=document.getElementById('hvframe');
  if(f&&f.contentWindow){ try{f.contentWindow.focus();f.contentWindow.print();}catch(e){alert('Use the sheet’s own Print button, or Ctrl/Cmd+P inside it.');} } }

function hovBadge(){ return hovOverride
  ? '<span style="font-weight:800;color:#1f8a4c;background:#e4f5ea;border:1px solid #a5d9ba;border-radius:10px;padding:3px 9px">✏ v2 · your edits</span>'

  if(f&&f.contentWindow&&f.contentWindow.captureD){ try{ var D2=f.contentWindow.captureD(); D2.unit=unit; hovOverride=D2; saveHov(); renderView(); hovFlash('Saved as v2'+(syncOn()?' · syncing':'')); }catch(e){ alert('Could not read the edited cards — try again.'); } }
  else alert('Handover not ready yet.'); }
function revertHov(){ if(!confirm('Revert to the auto-generated version? Your edited v2 is discarded'+(syncOn()?' on all your devices':'')+'.'))return;

function hovFlash(msg){ var d=document.createElement('div'); d.textContent=msg;
  d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12285e;color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;z-index:10000;box-shadow:0 6px 20px rgba(0,0,0,.3)';
  document.body.appendChild(d); setTimeout(function(){try{d.remove();}catch(e){}},2200); }
function hvTips(){ alert('Print settings (Chrome print dialog):\n• Paper: A4 · Portrait\n• Margins: Default\n• Scale: 100%  (NOT Fit to page)\n• Headers and footers: OFF   ← the usual top-clipping culprit\n• Background graphics: ON     ← colours + GoC badges\n\nIf cards clip at the bottom, nudge Row − or Font − in the bar above.'); }

  if(!guardEdit())return;

// ---- Concise handover: 5-second-glance cards (same buildHandoverD data, stripped to bare bones) ----
// SMOST 7-level palette (light theme, for the printed concise sheet). M-family = orange (never red/comfort).
var GOC_META={
  'goc-r1':  {code:'R1',lbl:'Full code',        bg:'#e3f3e8',fg:'#1b7a37',bar:'#2c9a48'},
  'goc-r2':  {code:'R2',lbl:'No CPR',           bg:'#eef6dc',fg:'#5c7a12',bar:'#8fbf28'},
  'goc-r3':  {code:'R3',lbl:'No CPR/intub',     bg:'#fbf1d3',fg:'#8a6600',bar:'#e0b020'},
  'goc-m1':  {code:'M1',lbl:'Medical+transfer', bg:'#fde6d2',fg:'#a5540d',bar:'#ef8b30'},
  'goc-m2':  {code:'M2',lbl:'Medical·on-site',  bg:'#f6dcc0',fg:'#8a3f08',bar:'#cc6a1a'},
  'goc-c1':  {code:'C1',lbl:'Comfort',          bg:'#fbdedb',fg:'#a51f1a',bar:'#d9342b'},
  'goc-c2':  {code:'C2',lbl:'Comfort·imminent', bg:'#eddaf5',fg:'#6a1b9a',bar:'#8e24aa'},
  'goc-full':{code:'R1',lbl:'Full code',        bg:'#e3f3e8',fg:'#1b7a37',bar:'#2c9a48'},
  'goc-uk':  {code:'?', lbl:'GoC unknown',      bg:'#eceff1',fg:'#54606b',bar:'#90a4ae'}
};
function cCap(s,n){ s=(''+(s==null?'':s)).replace(/\s+/g,' ').trim(); return (n&&s.length>n)?s.slice(0,n-1).replace(/[·\s—-]+$/,'')+'…':s; }
// concise: previous density (char budget) but truncate ONLY at a complete ` · ` item — never mid-sentence. Trailing "…" if more.
function cFit(s,max){ s=(''+(s==null?'':s)).replace(/\s+/g,' ').trim(); if(!s)return ''; var p=s.split(' · '); var out=[],len=0;
  for(var i=0;i<p.length;i++){ if(out.length&&len+3+p[i].length>max)break; out.push(p[i]); len+=p[i].length+3; }
  return out.join(' · ')+(out.length<p.length?' …':''); }
// ---- Handover "consumption date" offset (feedback 7-Sep): handover is read the AM AFTER the shift → default +1 ----
// The stepper shifts every DAY-COUNTER by hvDayOffset (ICU Day, POD, abx D3/8, vent/CRRT/ECMO day). Dated event lines (DD Mon) are untouched.
var hvDayOffset=(function(){ try{ var v=parseInt(localStorage.getItem('ub_hvdayoff'),10); return isNaN(v)?1:v; }catch(e){ return 1; } })();
function setDayOffset(delta){ hvDayOffset=Math.max(0,Math.min(7,hvDayOffset+delta)); try{localStorage.setItem('ub_hvdayoff',String(hvDayOffset));}catch(e){} renderView(); }
function refDayShift(n){ var x=parseInt(n,10); return isNaN(x)?n:(x+hvDayOffset); }
// increment only CLEARLY-LABELED day counters — never generic "day N" in prose, never dated (DD Mon) lines
function refShiftText(s){ if(s==null||!hvDayOffset) return s; s=''+s; var off=hvDayOffset;
  var bump=function(re){ s=s.replace(re,function(m,pre,a){return pre+(+a+off);}); };
  bump(/\b(D)(\d+)(?=\/\d)/g);                                                          // antibiotic  D3/8 → D4/8 (first # only)
  bump(/\b(POD ?)(\d+)/gi);                                                             // POD n
  bump(/\b((?:vent|crrt|cvvh|cvvhdf|ecmo|iabp|impella|hd)\s+day\s+)(\d+)/gi);           // CRRT day 3
  bump(/\b((?:vent|crrt|cvvh|cvvhdf|ecmo|iabp|impella)\s*D)(\d+)\b/gi);                 // CRRT D3 / vent D4
  return s; }
function refShiftPtDay(pt){ return hvDayOffset ? String(pt).replace(/· Day (\d+)/,function(m,a){return '· Day '+(+a+hvDayOffset);}) : pt; }
function dayOffLabel(){ return hvDayOffset===0?'shift date':('shift+'+hvDayOffset); }
function consumeDateBar(){ // the header stepper shown on Handover + Concise
  return '<span class="grp" title="Handover is read the morning AFTER the shift — counters shift by this many days (ICU Day, POD, abx day, vent/CRRT/ECMO). Dated event lines are untouched.">Read on '
    +'<button class="fzb" onclick="setDayOffset(-1)">&minus;</button><span class="val">'+dayOffLabel()+'</span><button class="fzb" onclick="setDayOffset(1)">+</button></span>'; }

function conciseCards(D){
  // ALL beds, positional (bed-number) order — empty beds keep their place as light placeholders.
  // Each card: left 2/3 = concise glance · right 1/3 = blank write-in notes column (type on screen or handwrite after print).
  return Object.keys(D.beds).sort(function(a,b){return (+a)-(+b);}).map(function(k){
    var b=D.beds[k]||{};
    var notes='<div class="cnotes"><div class="nlbl">Notes</div><div class="narea" data-f="notes" contenteditable="true">'+esc(b.notes||'')+'</div></div>';
    if(b.empty){
      return '<div class="ccard empty" data-bed="'+k+'"><div class="cmain"><div class="chd"><span class="cbed">Bed '+k+'</span>'
        +'<span class="cempty">— open —</span></div></div>'+notes+'</div>';
    }
    var g=GOC_META[b.goc]||GOC_META['goc-uk'];
    var dx=cFit(refShiftText(b.admit||b.dx),170), rx=cFit(refShiftText(b.tx),185), pend=cFit(refShiftText(b.plan),180), ovn=cCap(b.overnight,120);  // day-counters cascaded by the consumption-date offset
    var flags=(b.tags||[]).filter(function(t){return t&&/alert-tag|aro-tag|transfer-tag|new-tag/.test(t.cls);})
      .map(function(t){return '<span class="cflag '+t.cls+'">'+esc(t.text)+'</span>';}).join('');
    function crow(fld,lbl,val){ return '<div class="crow"><span class="ck">'+lbl+'</span><span class="cv" data-f="'+fld+'" contenteditable="true">'+esc(val||'')+'</span></div>'; }
    // Surg row (SICU/CSU post-op) — procedure + POD from the bed's §10 data; only shows when a procedure is present (never an empty row)
    var _d=(beds[k]&&beds[k].d)?beds[k].d:null;
    var _surg=''; if(_d&&_d.procedure){ var pd=(_d.pod!=null&&_d.pod!=='')?' · POD '+(refDayShift(_d.pod)):''; _surg=cFit(hvClean?hvClean(_d.procedure):(''+_d.procedure),120)+pd; }
    var rows=crow('admit','Dx',dx)+(_surg?crow('surg','Surg',_surg):'')+crow('overnight','O/N',ovn)+crow('tx','Rx',rx)+crow('plan','Pend',pend);
    var main='<div class="cmain">'
      +'<div class="chd"><span class="cbed">Bed '+k+'</span><span class="cpt">'+esc(refShiftPtDay(b.pt||''))+'</span>'
      +'<span class="cchip" style="background:'+g.bg+';color:'+g.fg+'">'+g.code+' · '+g.lbl+'</span></div>'
      +rows+(flags?'<div class="cflags">'+flags+'</div>':'')+'</div>';
    return '<div class="ccard'+(b.alert?' alert':'')+'" data-bed="'+k+'" style="border-left-color:'+g.bar+'">'+main+notes+'</div>';
  });
}
function buildConciseHTML(D){
  var cards=conciseCards(D);
  var css='<style>*{box-sizing:border-box}'
    +'body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1a2233;background:#f4f7fc;padding:9px}'
    +'.clist{display:flex;flex-direction:column;gap:7px}'
    +'.ccard{display:flex;align-items:stretch;border:1px solid #cbd5e6;border-left:6px solid #90a4ae;border-radius:7px;background:#fff;overflow:hidden;min-height:23mm;break-inside:avoid;page-break-inside:avoid}'
    +'.ccard.empty{min-height:15mm;background:#fbfcfe;border-left-color:#d3dced}'
    +'.ccard.alert{box-shadow:inset 3px 0 0 #d9342b}'
    +'.cmain{flex:1;padding:7px 10px;min-width:0}'
    +'.cnotes{flex:0 0 32%;border-left:1px dashed #b7c2d4;background:#fcfdff;padding:5px 8px;display:flex;flex-direction:column}'
    +'.nlbl{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#a7b2c2;margin-bottom:2px}'
    +'.narea{flex:1;min-height:14mm;font-size:11px;color:#12213f;outline:none;line-height:1.4}'
    +'.chd{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}'

      +'<span class="achip" style="background:'+g.bg+';color:'+g.fg+'" title="'+esc(g.lbl)+'">'+g.code+'</span></div>'+body+'</div>';
  });
  var css='<style>*{box-sizing:border-box}body{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#12213f;background:#f4f7fc;padding:9px;font-size:11.5px}'

    +'.arow{display:flex;gap:8px;margin-top:2px;line-height:1.4;align-items:flex-start}'
    +'.al{flex:0 0 40px;font-weight:800;color:#98a4b4;text-transform:uppercase;font-size:9px;letter-spacing:.5px;padding-top:2px}'

var REFDATA=[{"file": "acute-liver-failure-aasld-2023.md", "title": "Acute liver failure", "system": "GI / Hepatic", "body": "# Acute liver failure — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** AASLD Guideline: Management of Acute Liver Failure, American Association for the Study of\n> Liver Diseases, 2023 — https://www.aasld.org/practice-guidelines/management-acute-liver-failure\n> (see also https://pubmed.ncbi.nlm.nih.gov/37377263/)\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023\n\n## Why — physiology / first principles\n- Massive hepatocyte necrosis/apoptosis → loss of synthetic function (coagulation factors → rising INR) and\n  loss of detoxification capacity (ammonia clearance failure) → hyperammonemia driving **hepatic\n  encephalopathy** via astrocyte glutamine accumulation and osmotic swelling.\n- Loss of Kupffer-cell/reticuloendothelial clearance plus SIRS from dying hepatocytes produces vasoplegia and\n  multiorgan dysfunction resembling sepsis physiology.\n- In hyperacute failure, cerebral edema/raised ICP from ammonia-driven astrocyte swelling is the immediate\n  life threat — the physiologic basis for ICP surveillance, ammonia-lowering measures, and urgency of\n  transplant evaluation.\n\n## Diagnosis / definition\n- [ ] Confirm ALF definition: acute liver injury + coagulopathy (**INR ≥1.5**) + **any encephalopathy**, no prior cirrhosis, illness duration **<26 weeks** *(exact cutoffs — verify)*\n- [ ] Classify by jaundice-to-encephalopathy interval — **hyperacute** (<1 week: highest cerebral-edema risk, but best chance of spontaneous recovery if the patient survives the acute illness), **acute** (1-4 weeks), **subacute** (4-26 weeks: lower cerebral-edema risk but worse spontaneous-recovery rate) *(exact cutoffs — verify)*\n- [ ] Grade hepatic encephalopathy serially (e.g. West Haven criteria, grade I-IV) and trend — don't rely on a single spot-check *(verify)*\n- [ ] Apply **King's College Criteria** (or equivalent) to flag transplant urgency — acetaminophen: arterial pH <7.3 (any HE grade) OR all three of INR >6.5 (PT >100s), creatinine >3.4 mg/dL, grade III/IV HE; non-acetaminophen: INR >6.5 OR any 3 of age <10 or >40, indeterminate/drug-induced etiology, jaundice-to-HE interval >7 days, INR >3.5, bilirubin >17.5 mg/dL *(exact version/numbers — verify; reported high specificity ~95% but modest sensitivity ~58%, so failing to meet criteria does not guarantee a good outcome)*\n\n## Key labs & workup\n- [ ] Etiology panel: acetaminophen level, viral hepatitis serologies (A-E), autoimmune markers, ceruloplasmin if Wilson's suspected, pregnancy test, toxicology/drug-herbal-supplement history, ischemic/vascular workup\n- [ ] **Ammonia** — trend rather than a single value; levels in the **150-200 µmol/L** range have been associated with increased herniation/cerebral-edema risk in some series *(cutoff and local assay — verify)*\n- [ ] Coagulation panel (INR/PT, fibrinogen) — note ALF patients can be functionally rebalanced/hypercoagulable despite an elevated INR; avoid correcting INR purely to \"normalize\" it *(verify; consider TEG/ROTEM over isolated INR if active bleeding or pre-procedure)*\n- [ ] Cross-sectional contrast imaging for hepatic vasculature/anatomy; consider head imaging if the neuro exam raises concern for mass effect/herniation\n- [ ] Blood type & screen, lactate, phosphate, glucose, electrolytes\n\n## Management\n### Medical & ICU management\n- [ ] **N-acetylcysteine infusion** — treatment of choice for acetaminophen toxicity; consider empirically for non-acetaminophen ALF pending etiology, as it may improve transplant-free survival if started early *(dose/regimen — verify)*\n- [ ] Manage **cerebral edema / elevated ICP risk**: head-of-bed elevation, avoid hypotonic fluids and hypercapnia, consider hyperosmolar therapy (mannitol/hypertonic saline), targeted sedation/temperature as needed *(specific triggers/agents/monitoring — verify)*\n- [ ] **Continuous renal replacement therapy** preferred over intermittent hemodialysis when renal support is needed, to avoid metabolic/hemodynamic swings that worsen cerebral edema\n- [ ] Correct/monitor glucose, electrolytes, and lactate; correct coagulopathy only for active bleeding or before invasive procedures — avoid \"normalizing\" INR purely for its own sake (masks a prognostic marker) *(verify)*\n- [ ] Empiric/targeted infection surveillance and treatment — infection risk is high in ALF *(threshold/regimen — verify)*\n- [ ] Stress-ulcer prophylaxis and nutrition support per general critical-care standards\n\n### Prognosis & transplant listing\n- [ ] **Early contact with a transplant center** — do not delay referral pending completion of full workup\n- [ ] List for emergency/highest-priority liver transplant per organ-allocation criteria when threshold met; involve transplant hepatology/surgery early\n- [ ] Reassess transplant candidacy dynamically as clinical trajectory evolves (spontaneous recovery vs. deterioration)\n\n## Pearls & pitfalls\n- [ ] NAC likely improves transplant-free survival even in non-acetaminophen ALF, not only APAP toxicity — reasonable to give empirically pending etiology *(dose — verify)* — EMCrit IBCC: \"Acute Liver Failure (ALF)\"\n- [ ] Ammonia *trend* (not a one-off value) drives cerebral-edema risk stratification; levels **>150-200 µmol/L** correlate with herniation risk in some series, and a *normal* ammonia in a stuporous/comatose patient should prompt reconsideration of the diagnosis *(cutoffs — verify)* — EMCrit IBCC: \"Acute Liver Failure (ALF)\"\n- [ ] Target **high-normal glucose (~150-180 mg/dL)** rather than tight glycemic control — hypoglycemia is poorly tolerated and easily masked by encephalopathy *(verify)* — EMCrit IBCC: \"Acute Liver Failure (ALF)\"\n- [ ] Despite an elevated INR, ALF patients are often functionally hypercoagulable (rebalanced hemostasis) — avoid reflexive FFP to \"fix\" the INR; it removes a prognostic marker without proven benefit *(verify; consider TEG/ROTEM instead)* — EMCrit IBCC: \"Acute Liver Failure (ALF)\"\n- [ ] CRRT may reasonably be started for hyperammonemia/grade 2+ HE even before conventional renal indications are met; avoid citrate anticoagulation given impaired hepatic citrate clearance — use heparin instead *(local practice — verify)* — EMCrit IBCC: \"Acute Liver Failure (ALF)\"\n- [ ] Late signs of herniation (Cushing's triad, fixed/dilated pupils) appear late in the course — don't wait for them before escalating ICP-directed therapy — EMCrit IBCC: \"Acute Liver Failure (ALF)\"\n\n## Commonly-missed on documentation (what the gap-check flags)\nEtiology workup complete (acetaminophen level + autoimmune + viral panel)? · transplant center contacted\nearly, not deferred? · NAC started/considered regardless of etiology? · encephalopathy grade trended? ·\ncerebral edema precautions addressed? · CRRT-vs-IHD choice justified? · prognostic score applied to the\nlisting decision?\n\n*Sources: [AASLD Guideline: Management of Acute Liver Failure](https://www.aasld.org/practice-guidelines/management-acute-liver-failure) · [Acute Liver Failure Guidelines — PubMed 2023](https://pubmed.ncbi.nlm.nih.gov/37377263/) · FOAMed pearls: [EMCrit IBCC — Acute Liver Failure (ALF)](https://emcrit.org/ibcc/alf/)*\n"}, {"file": "acute-pancreatitis-iap-2025.md", "title": "Severe acute pancreatitis", "system": "GI / Hepatic", "body": "# Severe acute pancreatitis — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** International Association of Pancreatology (IAP) Revised Guidelines on Acute Pancreatitis\n> 2025 — supported/endorsed by the American Pancreatic Association (APA), European Pancreatic Club (EPC),\n> Indian Pancreas Club (IPC), and Japan Pancreas Society (JPS), *Pancreatology* 2025;25(6):770-814.\n> https://pubmed.ncbi.nlm.nih.gov/40651900/\n> Corroborated by: American College of Gastroenterology (ACG) Guidelines: Management of Acute Pancreatitis,\n> *Am J Gastroenterol* 2024 — https://pubmed.ncbi.nlm.nih.gov/38857482/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (IAP, primary) / 2024 (ACG, corroborating)\n\n## Why — physiology / first principles\n- Premature intra-acinar activation of trypsinogen → autodigestion of pancreatic tissue → local inflammation\n  that, with severe injury, spills systemically as activated proteases/cytokines → capillary leak,\n  third-spacing, and SIRS.\n- Fluid sequestration into the retroperitoneum/peripancreatic space is the mechanistic reason early, adequate\n  (but not excessive) fluid resuscitation is central to management.\n- **Necrosis** (vs. interstitial edema) reflects the degree of microvascular compromise/ischemia to pancreatic\n  parenchyma and sets up the later-phase risk of infected necrosis — the dominant driver of mortality beyond\n  the initial SIRS window.\n\n## Diagnosis / definition\n- [ ] Diagnosis requires **≥2 of 3**: characteristic epigastric pain, lipase/amylase **>3× ULN**, or characteristic imaging findings\n- [ ] Severity classification (revised Atlanta): **mild** (no organ failure, no complications), **moderately severe** (transient organ failure <48 h and/or local complications), **severe** (persistent organ failure >48 h) *(verify)*\n- [ ] Severity/organ-dysfunction scoring on admission and serially — e.g. **BISAP** (≥3 associated with higher mortality), **Ranson's criteria** (≥3 severe), **SIRS**, or **APACHE II** *(tool choice and exact cutoffs — verify local protocol)*\n\n## Key labs & workup\n- [ ] Lipase/amylase; **CRP** trend (a peak **>150 mg/L at 48 h** has been associated with severe disease in some cohorts) *(cutoff — verify)*\n- [ ] Hematocrit/BUN trend to guide fluid responsiveness during the first 24 h\n- [ ] Triglycerides and calcium — screen for hypertriglyceridemia/hypercalcemia etiology\n- [ ] RUQ ultrasound for gallstones; consider MRCP/EUS if choledocholithiasis is suspected but not confirmed on ultrasound\n- [ ] Reserve contrast-enhanced CT/MRI for diagnostic uncertainty or failure to improve clinically — not routine at admission; if performed, optimal at **48-72 h** for necrosis delineation *(timing — verify)*\n- [ ] CT-guided FNA and/or procalcitonin as adjuncts when infected necrosis is suspected *(role/threshold — verify)*\n\n## Management\n### Early resuscitation & supportive care\n- [ ] **Goal-directed IV fluid resuscitation** in the first **12-24 h** (urine output, hematocrit/BUN trend)\n  — benefit diminishes beyond this window; **avoid aggressive/high-volume bolus regimens** — moderate,\n  individualized resuscitation favored *(fluid choice/rate — verify local protocol; direction of change\n  from older \"aggressive\" wording — verify)*\n- [ ] Structured **pain control protocol** followed (opioid/non-opioid choice per local practice) *(verify)*\n- [ ] **Early enteral nutrition** in severe AP to reduce infectious complications; oral feeding as soon as tolerated in mild AP; **avoid parenteral nutrition** unless enteral route is not feasible\n- [ ] Concurrent **acute cholangitis** → ERCP within **24 h** of admission\n- [ ] Monitor for and manage evolving organ dysfunction (respiratory/renal/cardiovascular); escalate level of care per severity criteria\n- [ ] Identify etiology early: RUQ ultrasound for gallstones, triglycerides, alcohol history, medication review, consider need for ERCP\n- [ ] **Special-population etiologies actively considered**: pregnancy-associated, trauma-associated, and\n  metabolic (hypertriglyceridemia/hypercalcemia) AP — each has distinct management nuances *(2025 IAP\n  expanded scope — verify pathway)*\n\n### Local complications & necrotizing pancreatitis\n- [ ] Suspect infected necrosis with clinical deterioration or failure to improve — favor CT ± selective FNA/empiric antibiotics over reflexive intervention\n- [ ] **Delay intervention** on necrotic collections into the late phase (walled-off, generally >4 weeks) unless infected necrosis with instability forces earlier action\n- [ ] **Step-up approach** preferred for infected necrosis: percutaneous or endoscopic drainage first, escalate to minimally-invasive necrosectomy only if needed — avoid primary open necrosectomy\n- [ ] Antibiotics targeted to confirmed/strongly suspected infected necrosis — **not** given prophylactically for sterile necrosis *(agent — verify)*\n- [ ] Post-ERCP pancreatitis prevention in high-risk patients: pancreatic duct stent and/or rectal NSAID *(agent/dose — verify)*\n\n### Discharge, follow-up & recurrence prevention (2025 IAP expanded domain)\n- [ ] **Discharge criteria explicitly assessed** (tolerating oral intake, pain controlled, no evidence of\n  ongoing organ dysfunction) rather than a fixed length-of-stay *(verify local criteria)*\n- [ ] **Etiology-directed recurrence prevention** planned before discharge — e.g. cholecystectomy timing\n  for gallstone AP, alcohol/lifestyle counseling, triglyceride management *(verify timing/referral pathway)*\n- [ ] **Structured follow-up** arranged (pancreatic function, imaging if indicated, nutrition) *(verify\n  local pathway)*\n\n## Pearls & pitfalls\n- [ ] Historic \"aggressive\" fluid regimens (e.g. 250-500 mL/hr, ~8-14 L over the first day) are now considered harmful — associated with more respiratory failure, renal failure, abdominal compartment syndrome, and death; current evidence favors a moderate, continuous, response-guided rate (one reported target ~2.5-4 L over the first 24 h, roughly 125 mL/hr) rather than large boluses *(rate/local protocol — verify)* — PulmCrit/EMCrit: \"The myth of large-volume resuscitation
