itation control, avoid\n      Valsalva)\n\n## Anticipatory / disposition\n- [ ] **Multidisciplinary/neurocritical care unit** involvement documented\n- [ ] **Goals-of-care discussion** for poor-grade SAH\n- [ ] **Rehab/PT/OT/speech** evaluation; outcome expectations discussed with family\n\n## Commonly-missed on documentation (what the gap-check flags)\nHunt-Hess/WFNS + modified Fisher grade recorded? · SBP target pre-securing documented? · time-to-securing\ntracked? · nimodipine started + dose-reduced (not stopped) for hypotension? · daily TCD/exam for DCI\ndocumented? · sodium trend + SIADH-vs-CSW distinction charted? · seizure ppx justified if continued past\nperioperative period?\n\n*Sources: [2023 AHA/ASA Guideline for Aneurysmal SAH — Stroke](https://www.ahajournals.org/doi/10.1161/STR.0000000000000436) · [NCS Guidelines for Seizure Prophylaxis in Aneurysmal SAH — PubMed](https://pubmed.ncbi.nlm.nih.gov/42552475/) · [Management of Aneurysmal SAH and its Complications: A Clinical Guide — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC10339744/)*\n"}, {"file": "sepsis-ssc-2026.md", "title": "Sepsis / Septic shock", "system": "ID", "body": "# Sepsis / Septic shock — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic\n> Shock 2026 (SCCM/ESICM), jointly published *Critical Care Medicine* 2026 and *Intensive Care Medicine*\n> 2026 — supersedes the 2021 edition (`sepsis-ssc-2021.md`, superseded/removed).\n> https://link.springer.com/article/10.1007/s00134-026-08361-1\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026\n\n## Initial bundle (begin immediately — sepsis/septic shock is an emergency)\n- [ ] **Measure lactate**; re-measure if initial elevated *(guideline suggests guiding resuscitation to normalize)*\n- [ ] **Blood cultures before antibiotics** where feasible without meaningfully delaying treatment (2026: continued emphasis on cultures-first to support stewardship/de-escalation — do not delay abx for cultures in unstable patients)\n- [ ] **Broad-spectrum empiric antimicrobials ASAP** — ideally within **1 hour** for septic shock / probable sepsis *(agent per suspected source + local antibiogram — verify)* — balanced against **antimicrobial stewardship**: avoid unnecessary broad coverage once source/risk is clarified\n- [ ] **IV crystalloid for hypoperfusion/shock** — SSC suggests **≥30 mL/kg in first 3 h** *(individualize + reassess — verify; guideline continues to favor dynamic reassessment over a fixed fluid target)*\n- [ ] **Balanced crystalloid** preferred over 0.9% saline *(weak rec)*\n- [ ] Consider **point-of-care ultrasound (POCUS)** to help guide resuscitation *(conditional/weak rec — new in 2026 — verify local expertise/availability)*\n- [ ] **Vasopressors** if hypotensive during/after fluids → target **MAP ≥65 mmHg**, with a **lower range (~60–65 mmHg) reasonable in patients ≥65 y** *(new nuance in 2026 — verify; avoid over-shooting BP target, which recent evidence links to harm)*; **norepinephrine first-line**; may start **peripherally** rather than delay for central access\n- [ ] **Reassess perfusion** (dynamic measures / lactate clearance / cap refill / POCUS), not a single static number\n\n## Source control & antimicrobial stewardship\n- [ ] **Identify the source** and achieve **source control ASAP** (drain/debride/remove device) when applicable\n- [ ] **Daily de-escalation review**; narrow once cultures back; document **antibiotic day-count** and planned duration\n- [ ] Consider **procalcitonin + clinical** to support stopping abx *(weak rec)*\n- [ ] **Antimicrobial optimization** (dosing, source-appropriate narrowing, duration) documented as an explicit stewardship step, not left implicit *(2026 emphasis — verify local antimicrobial stewardship program input)*\n\n## Adjuncts / ongoing\n- [ ] **IV corticosteroids** (e.g. hydrocortisone) if **ongoing vasopressor requirement** in septic shock *(weak rec — verify dose/criteria)*\n- [ ] **Stress-ulcer prophylaxis with a PPI** suggested for patients with sepsis/septic shock **who have GI-bleeding risk factors** *(2026 — more specific than a blanket \"consider ppx\"; verify risk-factor criteria)*\n- [ ] **Active fluid de-resuscitation** (diuretics ± escalation) once the initial resuscitation phase is complete and the patient is stabilizing, to **prevent/treat fluid overload** *(new in 2026 — a distinct, explicit phase after early resuscitation — verify trigger/criteria and diuretic regimen)*\n- [ ] **Glucose management** — protocolized, avoid extremes *(target per protocol — verify)*\n- [ ] **Lung-protective ventilation** if ARDS supervenes (see ARDS checklist)\n- [ ] **VTE prophylaxis** unless contraindicated\n- [ ] **Nutrition** — early enteral when feasible\n- [ ] **Goals of care / SDM** conversation for high-severity or poor-trajectory patients; post-discharge/post-sepsis follow-up planning noted as an increasing area of guideline focus\n\n## Commonly-missed on documentation (what the gap-check flags)\nSource control identified? · cultures-before-abx where feasible? · lactate + repeat/clearance? · MAP\ntarget stated (age-adjusted for ≥65 y)? · abx de-escalation plan + day-count/stewardship note? · steroids\nconsidered if pressor-dependent? · PPI stress-ulcer ppx if GI-bleed risk factors present? · **de-resuscitation\nplan documented once stabilized** (new)? · VTE ppx? · GoC documented?\n\n*Sources: [Surviving Sepsis Campaign 2026 — Intensive Care Medicine (Springer)](https://link.springer.com/article/10.1007/s00134-026-08361-1) · [SCCM — Surviving Sepsis Campaign 2026 guideline page](https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026) · [ESICM — 2026 SSC guidelines announcement](https://www.esicm.org/2026-surviving-sepsis-campaing-guidelines/) · [Prioritizing the patient through a continuum of personalized care — insights from the 2026 SSC guidelines (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC13268726/)*\n"}, {"file": "severe-cap-ats-2025.md", "title": "Severe community-acquired pneumonia", "system": "Respiratory", "body": "# Severe community-acquired pneumonia — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Diagnosis and Treatment of Adults with Community-acquired Pneumonia: 2025 Update —\n> **American Thoracic Society (ATS)**, *American Journal of Respiratory and Critical Care Medicine*\n> 2025/2026. Supersedes the 2019 joint ATS/IDSA guideline (`severe-cap-ats-idsa-2019.md`,\n> superseded/removed).\n> https://academic.oup.com/ajrccm/article/212/1/24/8435770\n>\n> ## ⚠ Physician-confirm nuance — this is an ATS-only guideline, NOT joint ATS/IDSA\n> The 2019 predecessor was **joint ATS/IDSA**. This 2025 update was **reviewed and approved by ATS only —\n> IDSA did not endorse it**, specifically over a recommendation to give empiric antibacterials when a\n> respiratory **viral pathogen** is detected in some settings. IDSA published a formal **Position\n> Statement** explaining the non-endorsement, and independent authors published **\"We Dissent: Lessons\n> From the 2025 Community-Acquired Pneumonia Guidelines\"** (*Clinical Infectious Diseases*, 2026)\n> critiquing both the recommendation and the guideline-development process. **Confirm with your unit/ID\n> service which position has been locally adopted** — the ATS 2025 recommendation as written below, or\n> IDSA's narrower alternative (empiric antibiotics only for select outpatients with comorbidities / select\n> nonsevere inpatients with a positive viral assay, individualized to bacterial-coinfection concern) —\n> before this checklist drives antibiotic decisions.\n>\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025\n\n## Severity assessment — drives everything downstream\n- [ ] **Severe CAP** = **1 major criterion** OR **≥3 minor criteria** (unchanged framework from 2019) *(verify\n  full list before using to justify ICU triage)*\n  - Major: **septic shock requiring vasopressors**; **respiratory failure requiring mechanical\n    ventilation**\n  - Minor (examples): RR ≥30, PaO₂/FiO₂ ≤250, multilobar infiltrates, confusion/disorientation,\n    uremia, leukopenia, thrombocytopenia, hypothermia, hypotension requiring aggressive fluid\n    resuscitation *(verify exact thresholds)*\n\n## Diagnostics bundle\n- [ ] **Blood cultures ×2** and **sputum Gram stain/culture** for severe CAP, or if MRSA/Pseudomonas\n  risk factors or prior resistant-organism isolation\n- [ ] **Legionella + pneumococcal urinary antigen** for severe CAP *(verify indication threshold)*\n- [ ] **Lung ultrasound** now an accepted alternative to chest radiography for diagnosis where operator\n  expertise exists *(new in 2025 — verify local expertise/availability)*\n- [ ] **Respiratory viral testing** (incl. influenza) when circulating locally\n\n## Empiric antibiotics — start ASAP, do not delay for cultures\n- [ ] Standard severe CAP: **β-lactam PLUS macrolide**, or **β-lactam plus respiratory\n  fluoroquinolone** *(agents/doses — verify)*\n- [ ] **Add MRSA coverage** (e.g., vancomycin/linezolid) if risk factors or prior MRSA isolation —\n  obtain **nasal MRSA PCR** to support early de-escalation *(verify)*\n- [ ] **Add antipseudomonal coverage** if risk factors or prior resistant Gram-negative isolation\n  *(verify local risk-factor definitions)*\n- [ ] **Positive respiratory viral pathogen identified** — 2025 ATS update gives **setting-specific**\n  guidance (⚠ **see physician-confirm nuance above — IDSA disputes this**): outpatients **without**\n  comorbidities → **suggest withholding empiric antibacterials**; patients **with comorbidities or any\n  hospitalized patient** → **suggest empiric antibacterials** *(verify locally adopted position before\n  applying — do not treat this as settled stewardship guidance without ID sign-off)*\n- [ ] **Reassess and de-escalate at 48–72 h** based on culture/PCR results\n\n## Adjuncts\n- [ ] **Corticosteroids**: 2025 update **recommends against** routine use in **nonsevere** CAP; **conditionally\n  suggests** consideration in **severe** CAP *(change from 2019's more uniformly cautious stance — verify\n  current wording/dose/duration and local practice)*\n- [ ] VTE prophylaxis · early mobilization\n- [ ] **Duration**: shorter courses (as short as 3 days, minimum evidence-supported floor) strengthened for\n  **outpatient/nonsevere inpatient** disease; **severe CAP still ≥5 days**, afebrile/clinically stable for\n  ≥48–72 h before stopping *(verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nSeverity criteria explicitly counted (major/minor), not just \"looks sick\"? · cultures obtained before\nfirst antibiotic dose? · first-dose antibiotic timing documented? · MRSA/Pseudomonas risk assessed with\nan explicit de-escalation plan? · **viral-pathogen antibiotic decision explicitly reasoned (ATS vs IDSA\nposition — which was followed and why)?** · steroid use justified per current (2025) severe-CAP stance? ·\nstop-date/duration criteria documented?\n\n*Sources: [ATS 2025 CAP guideline update — AJRCCM](https://academic.oup.com/ajrccm/article/212/1/24/8435770) · [Infectious Diseases Society of America (IDSA) Position Statement: Why IDSA Did Not Endorse the CAP Guidelines 2025 Update — Clinical Infectious Diseases](https://academic.oup.com/cid/advance-article/doi/10.1093/cid/ciaf625/8364653) · [\"We Dissent: Lessons From the 2025 Community-Acquired Pneumonia Guidelines\" — Clinical Infectious Diseases](https://academic.oup.com/cid/advance-article-abstract/doi/10.1093/cid/ciaf626/8364680)*\n"}, {"file": "status-asthmaticus-gina-2026.md", "title": "Status asthmaticus (acute severe asthma)", "system": "Respiratory", "body": "# Status asthmaticus (acute severe asthma) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Global Strategy for Asthma Management and Prevention — 2026 Strategy Report, Global Initiative for\n> Asthma (GINA), released May 2026.\n> https://ginasthma.org/2026-gina-strategy-report/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026 (annually updated — check for newer edition)\n\n## Assessment — screen for life-threatening features\n- [ ] Severity assessed: ability to speak, RR, HR, accessory muscle use, PEF (if feasible), SpO₂\n  *(verify thresholds per severity tier)*\n- [ ] **Life-threatening features actively screened**: silent chest, cyanosis, exhaustion/poor\n  respiratory effort, confusion/drowsiness, bradycardia, hypotension, **SpO₂ <92%** *(verify full list)*\n- [ ] Consider validated severity/impairment tools where applicable — **PRAM** (pediatric acute severity),\n  **Peds-AIRQ**, or **CAAT** (chronic control context) *(2026 additions — verify local adoption)*\n\n## Initial ED/ICU bundle\n- [ ] **Controlled oxygen — revised target**: supplemental O₂ **not required unless SpO₂ <92%**; once given,\n  titrate to **SpO₂ 92–95%** in adults/adolescents/children 6–11y, **≥92%** in children ≤5y *(2026 change —\n  narrower/lower target than prior editions — verify against local protocol)*\n- [ ] **Repeated/continuous nebulized SABA**\n- [ ] **Ipratropium bromide** added for severe exacerbations\n- [ ] Consider **ICS-formoterol** as an alternative reliever strategy for mild exacerbations per updated\n  dosing guidance *(agent/dose — verify, most-available formulation)*\n- [ ] **Systemic corticosteroids early** — oral if tolerated, IV if severe/vomiting/impending respiratory\n  failure *(dose — verify)*; **minimize OCS course/dose** where response allows — 2026 emphasis on OCS\n  stewardship\n- [ ] Consider **high-dose ICS** in the ED as adjunct *(verify)*\n- [ ] **Reassess response at 1 h or earlier**; document trajectory, not just a single snapshot\n\n## Refractory / severe exacerbation\n- [ ] **IV magnesium sulfate** considered if poor response to initial intensive treatment *(dose — verify)*\n- [ ] Heliox considered in select refractory cases *(verify availability/evidence)*\n- [ ] **NIV** used only cautiously and selectively — significant risk from air-trapping/dynamic\n  hyperinflation; not a substitute for timely intubation if deteriorating *(verify local practice)*\n- [ ] **Intubation indications**: respiratory or cardiac arrest, altered consciousness, hemodynamic\n  instability, exhaustion despite maximal therapy *(verify criteria)*\n- [ ] Post-intubation ventilation: permissive hypercapnia, prolonged expiratory time, minimize breath\n  stacking/dynamic hyperinflation *(vent settings — verify)*\n- [ ] **Anaphylaxis as a differential/co-trigger** actively considered in atypical or rapidly progressive\n  presentations *(2026 emphasis — verify)*\n\n## Disposition\n- [ ] **ICU admission criteria** documented: poor/no response to initial therapy, worsening or\n  life-threatening features, need for ventilatory support *(verify local criteria)*\n- [ ] **Fatality-risk indicators** reviewed and documented (prior near-fatal attack, ICU/intubation history,\n  recent OCS use, poor adherence, psychosocial factors) *(verify current list)*\n- [ ] Discharge bundle: written asthma action plan, controller therapy reviewed/escalated (**biologics\n  eligibility considered** if frequent severe exacerbations), inhaler technique checked, follow-up arranged\n  *(2026: structured follow-up and OCS-minimization plan emphasized)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nLife-threatening features explicitly screened (not just \"severe\")? · revised SpO₂ target (92–95%, not\nblanket high-flow O₂) applied and documented? · ipratropium added for severe presentations? · magnesium\nconsidered and documented if poor initial response? · ICU criteria stated? · fatality-risk indicators\nreviewed? · written action plan + follow-up (incl. biologics eligibility) arranged at discharge?\n\n*Sources: [GINA 2026 Strategy Report](https://ginasthma.org/2026-gina-strategy-report/) · [GINA 2026 Strategy Report PDF (May 2026)](https://ginasthma.org/wp-content/uploads/2026/05/GINA-2026-Strategy-Report-WMS.pdf) · [GINA 2026 Update: Key Highlights — Guideline Central](https://www.guidelinecentral.com/insights/may-2026-gina-asthma-guideline-spotlight/) · [Acute Severe Asthma in Adolescent and Adult Patients — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC6780340/)*\n"}, {"file": "status-epilepticus-aes-2016.md", "title": "Status epilepticus", "system": "Neuro", "body": "# Status epilepticus — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Evidence-Based Guideline: Treatment of Convulsive Status Epilepticus in Children and\n> Adults, American Epilepsy Society, *Epilepsy Currents* 2016.\n> https://aesnet.org/clinical-care/clinical-guidance/guideline-prolonged-seizures\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2016 · defines status epilepticus operationally\n> as ≥5 min continuous/repeated convulsive activity without recovery (treat at 5 min, don't wait for 30)\n\n## Stabilization (0–5 min)\n- [ ] **Time seizure onset** — start the clock; **ABCs** — airway/positioning, O2, monitor\n- [ ] **Fingerstick glucose**; treat hypoglycemia if present (**verify** dose: e.g. dextrose ± thiamine first if malnourished/alcohol use)\n- [ ] **IV access**; send labs (electrolytes, Ca/Mg, AED levels if applicable, tox screen as indicated)\n- [ ] **Identify/treat reversible cause** in parallel (hyponatremia, hypoglycemia, eclampsia, overdose, meningitis/encephalitis)\n\n## Initial therapy — benzodiazepine (5–20 min, \"first therapy\")\n- [ ] **First-line benzodiazepine given without delay** — one of:\n  - [ ] **IM midazolam** *(weight-based dose — verify)* — preferred if no IV access\n  - [ ] **IV lorazepam** *(dose — verify)*\n  - [ ] **IV diazepam** *(dose — verify)*\n- [ ] **Repeat dose** if seizure continues past a defined interval *(verify — do not under-dose)*\n- [ ] Document **time-to-first-dose** — delay is the single most modifiable driver of refractoriness\n\n## Second therapy — urgent control (20–40 min)\n- [ ] If seizure persists after adequate benzodiazepine dosing, give **one** urgent-control agent:\n  - [ ] **IV fosphenytoin/phenytoin** *(loading dose — verify)*\n  - [ ] **IV valproic acid** *(loading dose — verify)*\n  - [ ] **IV levetiracetam** *(loading dose — verify)*\n  - [ ] (no high-quality evidence favors one agent — guideline notes equipoise; choose per comorbidity/allergy)\n\n## Third therapy — refractory status (>40 min)\n- [ ] If seizure continues, **repeat a second-therapy agent** or proceed to **anesthetic-dose therapy**:\n  - [ ] **Continuous infusion** — midazolam, propofol, or pentobarbital *(dose/titration — verify)*\n  - [ ] **Continuous EEG monitoring** initiated (mandatory once on continuous infusion / paralyzed / not\n        rapidly awakening)\n- [ ] **ICU admission**, mechanical ventilation as needed, hemodynamic support for infusion agents\n- [ ] **Neurology/epilepsy consultation**\n\n## Ongoing / super-refractory\n- [ ] **cEEG** to titrate to burden reduction (burst-suppression vs seizure-suppression per unit protocol — verify target)\n- [ ] **Etiology workup completed** — neuroimaging, LP if indicated, autoimmune/infectious panel if unexplained\n- [ ] **Maintenance ASM** established with a plan for wean of anesthetic infusion\n- [ ] **Complication surveillance** — rhabdomyolysis, aspiration, hyperthermia, propofol infusion syndrome if applicable\n\n## Commonly-missed on documentation (what the gap-check flags)\nSeizure onset time + time-to-first-benzodiazepine documented? · adequate (not under-) dose given? ·\nsecond-therapy agent given if still seizing at ~20 min? · cEEG started before/at anesthetic infusion? ·\nreversible-cause workup (glucose/lytes) charted? · etiology workup for new-onset/unexplained SE?\n\n*Sources: [Evidence-Based Guideline: Treatment of Convulsive Status Epilepticus — AES / Epilepsy Currents 2016](https://aesnet.org/clinical-care/clinical-guidance/guideline-prolonged-seizures) · [Proposed Algorithm for Convulsive Status Epilepticus — AES](https://aesnet.org/docs/default-source/press-releases-assets/cse-treatment-chart-final_rerelease.pdf) · [Treatment of Refractory Convulsive Status Epilepticus — AES Treatments Committee, PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7576920/)*\n"}, {"file": "stemi-acs-accaha-2025.md", "title": "STEMI / Acute Coronary Syndrome", "system": "Cardiac", "body": "# STEMI / Acute Coronary Syndrome — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary\n> Syndromes (Joint Committee on Clinical Practice Guidelines), *Circulation* / *JACC* 2025 — first major\n> update since 2013 STEMI / 2014 NSTE-ACS guidelines.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001309\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025\n\n## Initial evaluation & reperfusion decision\n- [ ] **12-lead ECG within 10 min** of first medical contact (verify); repeat/serial ECGs if initial non-diagnostic + high suspicion\n- [ ] **Troponin** — hs-cTn preferred; repeat at ~1–2 h (hs-cTn) or ~3–6 h (conventional) — verify assay-specific cutoffs/protocol\n- [ ] **STEMI, PCI-capable site:** FMC-to-device ≤90 min (verify) · **transfer to PCI centre:** ≤120 min (verify) — else fibrinolysis if <12 h from onset\n- [ ] **Fibrinolysis** if STEMI <12 h and anticipated PCI delay >120 min (verify) — screen contraindications; if given, still plan transfer for rescue/early angio\n- [ ] **STEMI 12–24 h** from onset with ongoing ischemia/instability — PCI still reasonable (verify local threshold)\n- [ ] **Radial access preferred** over femoral for PCI (bleeding/vascular complication/mortality reduction)\n- [ ] Admit to CICU/monitored bed per risk; **telemetry** duration per risk stratification (verify unit protocol)\n\n## Antithrombotic therapy\n- [ ] **Aspirin** loading dose then daily low-dose, unless contraindicated (verify dose)\n- [ ] **P2Y12 inhibitor:** prasugrel or ticagrelor preferred over clopidogrel for STEMI/NSTE-ACS undergoing PCI (verify — prasugrel contraindicated if prior stroke/TIA); clopidogrel if preferred agents unavailable/contraindicated, or as fibrinolysis-based DAPT partner\n- [ ] **DAPT duration** — at least 12 months as default if not high bleeding risk (verify); consider de-escalation/monotherapy transition (e.g. ticagrelor monotherapy) from ~1 month post-PCI in high-bleeding-risk patients (verify)\n- [ ] **Anticoagulation** — UFH (PCI or upstream medical), or enoxaparin/fondaparinux upstream if early-invasive not planned; bivalirudin as an alternative, particularly STEMI (verify agent/dose per local protocol); avoid fondaparinux as sole anticoagulant for PCI support\n- [ ] If on **oral anticoagulant + PCI** (AF etc.): plan triple- vs dual-therapy duration up front — default to early aspirin discontinuation (~1–4 wk) with P2Y12 + OAC continued (verify)\n- [ ] **Intracoronary imaging (IVUS/OCT)** for left main or complex lesions — now a stronger recommendation (verify institutional capability)\n- [ ] **Complete revascularization** of significant non-culprit disease in stable patients (STEMI and NSTE-ACS) — avoid routine non-culprit PCI if cardiogenic shock\n\n## Adjunctive medical therapy\n- [ ] **Beta-blocker**, oral, within 24 h unless contraindicated (verify — caution in overt HF/low-output states)\n- [ ] **ACEi/ARB** — indicated in higher-risk (LVEF ≤40%, anterior MI, HTN, DM); reasonable more broadly (verify)\n- [ ] **MRA** if LVEF ≤40% plus HF symptoms and/or diabetes (verify renal function/K+ first)\n- [ ] **High-intensity statin** for all ACS; add non-statin agent if LDL-C remains ≥70 mg/dL (≥1.8 mmol/L) on maximal statin (verify); recheck lipids at 4–8 wk\n- [ ] **Oxygen** only if SpO2 <90% — avoid routine supplemental O2 if saturating normally\n- [ ] Consider **low-dose colchicine** for secondary MACE reduction (verify — weak recommendation, check contraindications)\n- [ ] **Annual influenza vaccination** before/at discharge\n\n## Complications, shock, and discharge planning\n- [ ] **Cardiogenic shock:** emergency revascularization regardless of time from symptom onset; microaxial flow pump reasonable for severe/refractory shock in STEMI (verify eligibility); avoid routine IABP/VA-ECMO\n- [ ] **Mechanical complications** (free wall rupture, VSD, papillary muscle rupture) — manage at a surgical-capable centre; short-term mechanical circulatory support as a bridge (verify)\n- [ ] **Arrhythmia/conduction monitoring** — pacing for Mobitz II/high-grade/3rd-degree AV block (verify); ICD timing referenced to LVEF ≤40% at ≥40 days post-MI / ≥90 days post-revascularization (verify)\n- [ ] **LVEF assessment** prior to discharge to guide therapy\n- [ ] **Cardiac rehabilitation referral** prior to discharge (or home-based alternative) — do not defer to outpatient follow-up alone\n- [ ] Anemia/transfusion threshold individualized (verify — no routine liberal transfusion above ~10 g/dL)\n\n## Commonly-missed on documentation (what the gap-check flags)\nDoor-to-ECG time · troponin trend documented · reperfusion strategy + timing rationale · P2Y12 choice + DAPT\nduration plan · anticoagulant + PCI-access route · beta-blocker/ACEi/statin all addressed (or contraindication\nnoted) · LVEF documented pre-discharge · cardiac rehab referral placed · triple-therapy duration plan if on OAC\n\n*Sources: [2025 ACC/AHA/ACEP/NAEMSP/SCAI ACS Guideline — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001309) · [ACC guideline hub](https://www.acc.org/guidelines/guidelines/2025/02/27/17/21/acute-coronary-syndromes-2025) · [Antiplatelet/Anticoagulant key recommendations — JACC](https://www.jacc.org/doi/10.1016/j.jacc.2025.04.002) · [Guideline Central summary](https://www.guidelinecentral.com/guideline/4374545/)*\n"}, {"file": "tbi-btf-2016.md", "title": "Severe traumatic brain injury (TBI)", "system": "Neuro", "body": "# Severe traumatic brain injury (TBI) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Guidelines for the Management of Severe Traumatic Brain Injury, 4th Edition, Brain Trauma\n> Foundation, *Neurosurgery* 2016 (decompressive craniectomy chapter updated 2020).\n> https://braintrauma.org/coma/guidelines/severe-tbi\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2016 (DC recommendations updated 2020) ·\n> BTF operates a \"living guideline\" model — confirm no newer chapter update\n\n## Primary/secondary injury prevention (early)\n- [ ] **Avoid hypotension and hypoxia** — these are the dominant secondary-injury drivers; document\n      SBP/SpO2 trend from earliest contact\n- [ ] **ICP monitor placed** if GCS 3–8 with abnormal CT, or normal CT + risk factors (age >40, posturing,\n      SBP <90) *(indication threshold — verify; BTF 4th ed notes insufficient evidence for a graded\n      recommendation on monitoring itself, but treatment-threshold evidence assumes monitoring is in place)*\n- [ ] **CPP monitoring** established alongside ICP\n\n## ICP / CPP management\n- [ ] **Treat ICP >22 mmHg** *(verify — level IIB)*\n- [ ] **Target CPP 60–70 mmHg** *(verify — level IIB)* — avoid aggressive CPP elevation >70 with fluids/pressors (ARDS risk)\n- [ ] **Head of bed 30°**, neutral neck position, avoid jugular venous compression (tight collar/lines)\n- [ ] **Hyperosmolar therapy** used for ICP crisis — mannitol or hypertonic saline *(agent/dose/serum\n      osmolality target — verify; guideline notes insufficient evidence to mandate a specific agent/dose)*\n- [ ] **CSF diversion (EVD)** considered as ICP-lowering measure\n- [ ] **Sedation/analgesia** adequate to blunt ICP surges; avoid untreated pain/agitation\n- [ ] **Avoid prophylactic hyperventilation** — do not target PaCO2 ≤25 mmHg; use only as temporizing\n      measure for acute herniation *(verify)*\n- [ ] **Decompressive craniectomy** — secondary DC (for refractory ICP after medical therapy fails) has a\n      role; **large fronto-temporo-parietal** flap (≥12×15 cm) preferred over smaller; DC for **early**\n      prophylactic use not recommended *(verify criteria/timing)*\n\n## Systemic / medical management\n- [ ] **High-dose corticosteroids CONTRAINDICATED** — do not give (associated with increased mortality)\n- [ ] **Early post-traumatic seizure prophylaxis** (≤7 days) considered — e.g. phenytoin/levetiracetam\n      *(agent/dose — verify)*; **do not continue past 7 days** without a clinical seizure\n- [ ] **Prophylactic hypothermia NOT recommended** for diffuse injury (early, short-duration) *(verify — level IIB)*\n- [ ] **Nutrition** — reach basal caloric replacement by **day 5–7** post-injury *(verify)*\n- [ ] **VTE prophylaxis** — mechanical from admission; pharmacologic timing individualized to bleeding\n      stability *(verify local protocol)*\n- [ ] **Glucose and temperature control** per unit protocol — avoid hyper/hypoglycemia, treat fever\n\n## Multidisciplinary / disposition\n- [ ] **Neurosurgery involved** in monitoring/surgical decisions\n- [ ] **Serial neuro exam / imaging** for evolving lesion or ICP refractoriness\n- [ ] **Goals-of-care discussion** — avoid premature prognostication before adequate resuscitation/sedation washout\n- [ ] **Rehab/PT/OT/speech** evaluation\n\n## Commonly-missed on documentation (what the gap-check flags)\nHypotension/hypoxia avoidance charted from earliest contact? · ICP threshold (22) + CPP target (60–70)\ndocumented? · hyperventilation NOT used prophylactically? · steroids NOT given? · seizure ppx stopped by\nday 7 without clinical seizure? · DC flap size + timing (secondary, not early-prophylactic) documented?\n· nutrition target by day 5–7 tracked?\n\n*Sources: [Guidelines for the Management of Severe TBI, 4th Edition — Brain Trauma Foundation](https://braintrauma.org/coma/guidelines/severe-tbi) · [Guidelines for Severe TBI, 4th Ed — PubMed](https://pubmed.ncbi.nlm.nih.gov/27654000/) · [2020 Update of the Decompressive Craniectomy Recommendations — PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7426189/)*\n"}, {"file": "thyroid-storm-myxedema-coma-joint-consensus-2026.md", "title": "Thyroid storm & myxedema coma", "system": "Renal / Metabolic / Endo", "body": "# Thyroid storm & myxedema coma — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Sources:** Management of thyroid emergencies: joint consensus statement on management of thyroid storm\n> (Society for Endocrinology / British Thyroid Association / European Thyroid Association), *European\n> Thyroid Journal* 2026; Management of endocrine emergencies: joint consensus statement for management of\n> myxoedema coma, *European Thyroid Journal* 2026.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026 (both are recently-published joint\n> consensus statements — confirm no subsequent erratum/update)\n\n## Thyroid storm — diagnosis & scoring\n- [ ] **Burch-Wartofsky Point Scale** (or JTA/JES criteria) calculated: **<25** unlikely, **25–44** impending crisis, **≥45** highly suggestive of storm *(verify score components — thermoregulatory, CNS, GI/hepatic, cardiovascular, precipitant history)*\n- [ ] Precipitant sought and treated (infection, surgery, iodine load, DKA, parturition, medication non-adherence)\n- [ ] Managed in HDU/ICU with multidisciplinary (endocrine + critical care) input\n\n## Thyroid storm — treatment (strict order matters)\n- [ ] **Beta-blockade** first/early — e.g. **propranolol 40–80 mg PO q4–6h** (or IV titrated) for rate control and to reduce peripheral T4→T3 conversion *(verify dose; caution in decompensated heart failure)*\n- [ ] **High-dose thionamide**: **PTU load 500–1000 mg then 250 mg q4h** OR **methimazole 20 mg q4–6h** *(verify — PTU preferred in first trimester/thyroid storm per some protocols for its additional T4→T3 blockade; max PTU ~1600 mg/day)*\n- [ ] **Iodine solution (SSKI/Lugol's) started ≥1 h AFTER thionamide** — never before, to avoid fueling new hormone synthesis *(verify timing/dose)*\n- [ ] **Glucocorticoids** (e.g. hydrocortisone) — blocks T4→T3 conversion and covers possible relative adrenal insufficiency *(verify dose)*\n- [ ] Supportive care: aggressive cooling for hyperthermia, fluid/electrolyte correction, treat precipitant, avoid aspirin (displaces thyroid hormone from binding protein)\n- [ ] Definitive therapy (radioiodine/surgery) planned once stabilized, not during acute crisis\n\n## Myxedema coma — diagnosis\n- [ ] Popoveniuc (or equivalent) diagnostic score applied — thermoregulatory, CNS, GI, cardiovascular, precipitant, metabolic domains; **score ≥60 highly suggestive**, **45–59 possible**, **<45 unlikely** *(verify score bands)*\n- [ ] Precipitant identified (infection, cold exposure, sedatives/opioids, non-adherence, stroke, MI)\n- [ ] Managed in HDU/ICU\n\n## Myxedema coma — treatment\n- [ ] **Stress-dose hydrocortisone given BEFORE or WITH levothyroxine** (e.g. **100 mg IV bolus then ~50 mg q6h or ~200 mg/24h infusion**) to cover possible coexisting adrenal insufficiency *(verify dose — never give thyroid hormone alone first)*\n- [ ] **IV levothyroxine loading**: **200–400 mcg** in average adult; **lower end (100–200 mcg)** if elderly/small/cardiac risk *(verify — reduce IV dose to ~75% of oral equivalent)*\n- [ ] Maintenance **levothyroxine ~1.6 mcg/kg/day IV**, transitioning to oral once conscious/absorbing *(verify)*\n- [ ] Liothyronine (T3) addition considered only if no improvement by ~24 h, small doses, caution in cardiac disease *(verify dose ~2.5–10 mcg q8h)*\n- [ ] Passive warming only — **avoid active/rapid external rewarming** (risk of vasodilation/cardiovascular collapse)\n- [ ] Correct hypoglycemia, hyponatremia (per hyponatremia protocol — avoid overcorrection), and hypoventilation; anticipate need for mechanical ventilation\n- [ ] Empiric broad-spectrum antibiotics considered until infection excluded (blunted febrile response can mask sepsis)\n- [ ] Discontinue stress steroids once adrenal axis cleared (random cortisol/cosyntropin test), not before\n\n## Commonly-missed on documentation (what the gap-check flags)\nStorm: score calculated + documented? · iodine given AFTER (not before/with) thionamide? · precipitant named? ·\nMyxedema coma: steroids given before/with levothyroxine (never after)? · active rewarming avoided? · infection covered empirically despite normal temp?\n\n*Sources: [Management of thyroid emergencies: joint consensus statement on management of thyroid storm — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC13506520/) · [Management of endocrine emergencies: joint consensus statement for management of myxoedema coma — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC13452032/) · [2016 ATA Guidelines for Diagnosis and Management of Hyperthyroidism and Other Causes of Thyrotoxicosis — PubMed](https://pubmed.ncbi.nlm.nih.gov/27521067/)*\n"}, {"file": "toxic-ingestion-overdose-general-2024.md", "title": "Toxic ingestion / overdose (general ICU approach)", "system": "Other", "body": "# Toxic ingestion / overdose (general ICU approach) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** No single binding \"guideline\" governs the undifferentiated poisoned patient; this checklist\n> follows the general standard-of-care framework endorsed by clinical toxicology consensus (AACT/EAPCCT\n> position statements on decontamination) and the general-approach literature (e.g. \"Approach to the\n> Poisoned Patient,\" *Emerg Med Clin North Am* / PMC reviews; Indian Society of Critical Care Medicine\n> Position Statement on poisoning in the ED/ICU). **Confirm against local poison-control protocol and\n> your regional Poison Control Centre before acting.**\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC10334441/ · https://pmc.ncbi.nlm.nih.gov/articles/PMC11369925/\n> **Compiled:** 06-Sep-2026 · Claude Code · general standard-of-care — confirm against local protocol\n\n## Immediate stabilization (\"treat the patient, not the toxin\")\n- [ ] **Airway/breathing/circulation first** — continuous cardiac + pulse oximetry monitoring; secure airway if reduced consciousness/risk of aspiration\n- [ ] **Point-of-care glucose** — treat hypoglycemia empirically if altered mental status\n- [ ] **Core temperature** — screen for hyper/hypothermia from the toxin or environment\n- [ ] **12-lead ECG** — screen for QRS/QTc prolongation (sodium-channel/potassium-channel toxicity)\n- [ ] **Call regional Poison Control / Toxicology** early — do this on every significant ingestion, not just unusual ones\n\n## Assessment\n- [ ] **Obtain collateral history** — agent(s), quantity, time of ingestion, co-ingestants, intent (self-harm screen)\n- [ ] **Targeted labs**: acetaminophen + salicylate levels on essentially all intentional overdoses (often clinically silent early), plus agent-specific levels; VBG/ABG, electrolytes, anion/osmolar gap, creatinine\n- [ ] **Toxidrome recognition** (anticholinergic, cholinergic, sympathomimetic, opioid, sedative-hypnotic, serotonergic) to guide empiric management pending confirmation\n\n## Decontamination & elimination — judicious, not routine\n- [ ] **Activated charcoal** only if within the appropriate window post-ingestion, airway protected, and agent is charcoal-adsorbable — **not routine for every overdose** — *verify agent-specific eligibility with poison control*\n- [ ] **Whole-bowel irrigation** only for specific agents (e.g. sustained-release preparations, iron, body packers) — *verify indication*\n- [ ] **Avoid ipecac** — not part of modern management\n- [ ] **Enhanced elimination** (multi-dose charcoal, alkalinization, hemodialysis) only for specific toxins with known indication — *verify per agent with toxicology*\n\n## Antidotes & specific therapy\n- [ ] **Administer specific antidote as early as possible** wherever indicated (e.g. N-acetylcysteine for acetaminophen, naloxone for opioids, flumazenil rarely/with caution for benzodiazepines, sodium bicarbonate for TCA/sodium-channel blockade, fomepizole for toxic alcohols, hydroxocobalamin for cyanide) — <agent/dose per toxin — verify>\n- [ ] **Confirm antidote availability/stocking** and dosing weight-based where applicable\n\n## Ongoing ICU management & disposition\n- [ ] **Serial reassessment** — repeat levels/ECG as appropriate for the specific agent's kinetics (e.g. repeat acetaminophen level, serial ECGs for cardiotoxic agents)\n- [ ] **Monitor for delayed toxicity** specific to the agent (e.g. delayed hepatotoxicity, delayed cardiotoxicity) before declaring safe for step-down\n- [ ] **Psychiatric evaluation** before discharge for any intentional ingestion — do not omit because \"medically cleared\"\n- [ ] **Document disposition plan and safety plan** explicitly\n\n## Commonly-missed on documentation (what the gap-check flags)\nPoison control/toxicology contacted? · acetaminophen + salicylate levels sent on intentional overdose? · ECG reviewed for QRS/QTc? ·\nantidote considered and timing documented? · decontamination decision justified (not reflexive charcoal)? ·\npsychiatric evaluation arranged before discharge? · delayed-toxicity monitoring plan stated?\n\n*Sources: [Approach to the Poisoned Patient (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC10334441/) · [ISCCM Position Statement: Approach to Poisoning in ED/ICU (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC11369925/) · [Emergency Management of Poisoning (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC7315350/)*\n"}, {"file": "trauma-hemorrhagic-shock-eutg-2023.md", "title": "Major trauma / hemorrhagic shock (massive transfusion)", "system": "Other", "body": "# Major trauma / hemorrhagic shock (massive transfusion) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** The European Guideline on Management of Major Bleeding and Coagulopathy Following Trauma:\n> Sixth Edition (Rossaint R et al.), *Critical Care* 2023;27:80. Structure consistent with ATLS\n> (American College of Surgeons Committee on Trauma) principles.\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023 (check for a newer edition periodically)\n\n## Primary survey — <C>ABCDE\n- [ ] **<C> — catastrophic/critical external bleeding controlled first**: direct pressure, tourniquet, hemostatic dressing — before proceeding to standard ABCDE\n- [ ] **Airway, Breathing, Circulation, Disability, Exposure** per ATLS sequence\n- [ ] **Rapid transport to an appropriate trauma center** without delay for non-essential interventions\n- [ ] Use **shock index / narrow pulse pressure** to help flag occult hemorrhage — *verify local thresholds*\n\n## Resuscitation strategy\n- [ ] **Permissive hypotension** until hemorrhage controlled — target **SBP ~80–90 mmHg / MAP ~50–60 mmHg** — <verify> — **except** with suspected severe TBI, where higher MAP is targeted to preserve cerebral perfusion (**≥80 mmHg — verify**)\n- [ ] **Minimize crystalloid**; prioritize **blood products** early in significant hemorrhage\n- [ ] **Activate massive transfusion protocol** early if ongoing major bleeding — balanced ratio of **RBC:plasma:platelets** (commonly cited **~1:1:1** — verify local MTP ratio)\n- [ ] **Hemoglobin target 70–90 g/L** during active management — *verify*\n\n## Coagulopathy management\n- [ ] **Tranexamic acid** as early as possible, **within 3 hours of injury** — <1 g bolus then 1 g over 8 h — verify local dosing/protocol>\n- [ ] **Viscoelastic testing (TEG/ROTEM)** where available to guide targeted product replacement, alongside PT/INR, fibrinogen, platelets\n- [ ] **Fibrinogen/cryoprecipitate replacement** if fibrinogen low (Clauss <1.5–2.0 g/L associated with worse outcomes — *verify local trigger*)\n- [ ] **Calcium replacement** — correct ionized hypocalcemia during massive transfusion (citrate toxicity) — *verify target/monitoring frequency*\n- [ ] **Reverse anticoagulants/antiplatelets** promptly if patient was on them (specific reversal agent per drug) — *verify per agent*\n\n## Adjuncts & ongoing ICU care\n- [ ] **Prevent/treat the lethal triad** — actively manage **hypothermia** (target normothermia 36–37°C), **acidosis**, and **coagulopathy** together\n- [ ] **Damage-control surgery** considered early if shock, ongoing bleeding, coagulopathy, or hypothermia/acidosis present\n- [ ] **Serial reassessment** of hemorrhage control, coagulation status, and end-organ perfusion (lactate clearance)\n- [ ] **VTE prophylaxis** timing revisited once hemostasis secured\n\n## Commonly-missed on documentation (what the gap-check flags)\nCatastrophic bleeding addressed before rest of primary survey? · TXA given within 3 h of injury? · MTP ratio documented? ·\nviscoelastic/coagulation panel trending? · calcium monitored/corrected during MTP? · temperature actively managed? ·\npermissive-hypotension target individualized for TBI status?\n\n*Sources: [European guideline on major bleeding & coagulopathy following trauma, 6th edition — Critical Care 2023 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/)*\n"}, {"file": "tumor-lysis-syndrome-bsh-2025.md", "title": "Tumor lysis syndrome", "system": "Renal / Metabolic / Endo", "body": "# Tumor lysis syndrome — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** British Society for Haematology updated guidelines for the diagnosis and management of\n> tumour lysis syndrome in adults and children with haematological malignancies: a focus on patient\n> safety (Chan YLT, El-Sharkawi D, Shah P, Chanouzas D, O'Connor D, Marks SD, Jones G, et al., on\n> behalf of the BSH Committee), *British Journal of Haematology* 2025;207(4):1248–1258\n> (doi:10.1111/bjh.70092).\n> https://pubmed.ncbi.nlm.nih.gov/40903841/\n> **Replaces** the 2015 BCSH guideline (previous file, archived). The **Cairo-Bishop diagnostic\n> criteria are unchanged**; what's new is **risk stratification** (novel targeted/immunotherapy agents\n> now recognized as raising TLS risk in diseases previously considered low-risk), an explicit\n> **fixed-dose rasburicase prophylaxis regimen**, and a **patient-safety focus** driven by an NHS\n> England analysis of medication-delay incidents.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (check for a newer edition periodically)\n\n## Diagnosis — Cairo-Bishop criteria (unchanged in 2025 update)\n- [ ] **Laboratory TLS**: ≥2 of the following within the same 24 h period, 3 days before to 7 days after cytotoxic therapy —\n  - [ ] Uric acid **≥476 µmol/L (8 mg/dL)** or **≥25% rise** from baseline *(verify)*\n  - [ ] Potassium **≥6.0 mmol/L** or **≥25% rise** from baseline *(verify)*\n  - [ ] Phosphate **≥1.45 mmol/L (adult)** or **≥25% rise** from baseline *(verify — pediatric threshold differs, ≥2.1 mmol/L)*\n  - [ ] Calcium **≤1.75 mmol/L** or **≥25% fall** from baseline *(verify)*\n- [ ] **Clinical TLS** = Laboratory TLS **+ one of**: AKI/rising creatinine, cardiac arrhythmia, seizure, or death — document explicitly which criterion is met\n\n## Risk stratification — updated for novel therapies (2025)\n- [ ] Risk category assigned — **low / intermediate / high** — **individualized**, incorporating\n  disease-specific *and* patient-specific factors (tumor burden is the principal driver across\n  disease types), not read off the old tumor-type table alone *(verify against current disease-specific\n  risk tables — e.g. Burkitt/ALL high risk, indolent lymphoma low risk)*\n- [ ] **Novel targeted/immunotherapy agents** (e.g. venetoclax, CAR-T, other high tumor-lytic-potential\n  agents) explicitly considered — these can push a disease previously deemed low-risk into\n  intermediate/high risk *(verify agent-specific risk against local protocol — this is the main\n  substantive change from 2015)*\n- [ ] Risk category documented in the chart **before chemotherapy/SACT start**, not retrospectively\n\n## Prevention (before/during cytotoxic therapy)\n- [ ] **IV hydration** started prior to therapy in intermediate/high-risk patients — target high urine\n  output; avoid unnecessary potassium/phosphate in IV fluids *(verify rate)*\n- [ ] **Low/intermediate risk** → **allopurinol** (xanthine oxidase inhibitor — prevents new uric acid\n  formation, does not clear existing) *(verify dose, renal adjustment)*\n- [ ] **High risk (or high baseline uric acid)** → **rasburicase**: BSH 2025 specifies a **fixed\n  prophylactic dose of 3 mg** pre-SACT in high-risk patients (not routinely weight-based), with a\n  **second 3 mg dose if needed** on reassessment *(verify against local formulary/protocol)*;\n  contraindicated in **G6PD deficiency — screen first**\n- [ ] Uric acid, K+, phosphate, calcium, creatinine monitored at **increased frequency** (e.g. **q6–8h**\n  in high-risk during the at-risk window) *(verify interval per risk category)*\n- [ ] Avoid concurrent nephrotoxins; correct volume depletion before chemotherapy\n\n## Patient safety — new emphasis (2025)\n- [ ] **Rasburicase/allopurinol availability confirmed at ward and pharmacy level before SACT starts**\n  — the 2025 update follows an NHS England Patient Safety analysis of 64 reported medication-delay\n  incidents (2016–2020), 16 associated with harm, driven by **staff knowledge gaps** and **medication\n  non-availability**\n- [ ] **No delay in first-dose rasburicase/allopurinol administration** once a high-risk patient is\n  identified — treat as a time-critical order, not routine pharmacy queue\n- [ ] Staff (medical/nursing/pharmacy) TLS-management competency assumed **not** guaranteed — confirm\n  local unit education/protocol is current *(verify)*\n\n## Management of established TLS\n- [ ] Continue/escalate aggressive IV hydration; diuretics only after volume repletion if oliguric with fluid overload\n- [ ] **Rasburicase** started/continued for hyperuricemia in established TLS — treatment dosing\n  **0.2 mg/kg IV once daily for 3–7 days as needed** *(verify; G6PD status checked)*\n- [ ] **Hyperkalemia** treated per hyperkalemia protocol — high vigilance, can be rapidly fatal\n- [ ] **Hyperphosphatemia** — phosphate binders; avoid calcium administration for asymptomatic\n  hypocalcemia (risk of calcium-phosphate precipitation) unless symptomatic/severe\n- [ ] **RRT** initiated for refractory hyperkalemia, severe hyperphosphatemia, oligoanuric AKI, or fluid\n  overload unresponsive to medical management — early nephrology involvement in high-risk/established TLS\n- [ ] Continuous cardiac monitoring while electrolytes deranged\n- [ ] Serial labs continued through resolution, not just at onset\n\n## Commonly-missed on documentation (what the gap-check flags)\nRisk category assigned before SACT start, incorporating agent-specific risk (not just tumor type)? ·\nrasburicase vs allopurinol choice justified by risk tier, with dose (fixed 3 mg prophylactic vs weight-based\ntreatment) specified? · G6PD status checked before rasburicase? · Cairo-Bishop criterion explicitly cited\nwhen labeling as TLS? · medication availability/no-delay confirmed for high-risk patients? · calcium\nwithheld for asymptomatic hypocalcemia? · nephrology involved early if high-risk?\n\n*Sources: [BSH updated TLS guideline 2025 — PubMed](https://pubmed.ncbi.nlm.nih.gov/40903841/) · [BSH updated TLS guideline 2025 — Wiley/Br J Haematol](https://onlinelibrary.wiley.com/doi/10.1111/bjh.70092) · [BSH Guidelines — official listing](https://b-s-h.org.uk/guidelines/guidelines/updated-guidelines-for-the-diagnosis-and-management-of-tumour-lysis-syndrome-in-adults-and-children) · [Guidelines for the management of tumour lysis syndrome (2015, superseded) — PubMed](https://pubmed.ncbi.nlm.nih.gov/25876990/)*\n"}, {"file": "upper-gi-bleed-acg-2021.md", "title": "Upper GI bleed (variceal + non-variceal)", "system": "GI / Hepatic", "body": "# Upper GI bleed (variceal + non-variceal) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** ACG Clinical Guideline: Upper Gastrointestinal and Ulcer Bleeding (Laine L et al., American\n> College of Gastroenterology), *Am J Gastroenterol* 2021 — https://pubmed.ncbi.nlm.nih.gov/33929377/\n> Variceal component: AASLD Practice Guidance on Risk Stratification and Management of Portal\n> Hypertension and Varices in Cirrhosis (Garcia-Tsao G et al.), 2023 —\n> https://pubmed.ncbi.nlm.nih.gov/37870298/ · AASLD Practice Guidance on TIPS, Variceal Embolization,\n> and Retrograde Transvenous Obliteration in Variceal Hemorrhage, 2023 —\n> https://pubmed.ncbi.nlm.nih.gov/37390489/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2021 (non-variceal) / 2023 (variceal)\n\n## Initial resuscitation & risk stratification (both etiologies)\n- [ ] Hemodynamic assessment + IV access ×2 large-bore, volume resuscitation as needed\n- [ ] Risk-stratify (e.g. Glasgow-Blatchford score) — score **0-1** may support ED discharge *(verify local pathway)*\n- [ ] RBC transfusion threshold **7 g/dL** *(restrictive strategy; verify per comorbidity — e.g. higher target if active cardiac ischemia)*\n- [ ] Correct coagulopathy/thrombocytopenia only per active bleeding severity — do not over-correct pre-endoscopy *(verify)*\n- [ ] Hold/reverse anticoagulation per bleeding severity — individualize by agent *(verify agent-specific reversal)*\n- [ ] Hematochezia + hemodynamic instability may indicate an **upper GI source** — warrants upper endoscopy\n\n## Non-variceal ulcer bleeding pathway\n- [ ] Pre-endoscopic **IV PPI** infusion *(dose/duration — verify)*\n- [ ] Consider **IV erythromycin** pre-endoscopy to improve mucosal visualization, reduce need for repeat endoscopy\n- [ ] **Endoscopy within 24 h** of presentation\n- [ ] Endoscopic hemostasis mandatory for high-risk stigmata (Forrest Ia/Ib active bleeding, IIa visible vessel) — **combination therapy** (epinephrine injection + a second thermal/mechanical modality) preferred over injection alone\n- [ ] Post-hemostasis high-dose PPI course *(regimen/duration — verify)*; test-and-treat *H. pylori* before discharge\n- [ ] Second-look endoscopy only selectively, not routine *(verify)*\n\n## Variceal bleeding pathway (known/suspected cirrhosis)\n- [ ] **Vasoactive drug** (octreotide/terlipressin/somatostatin) started ASAP, before endoscopy, continued **~2-5 days** *(agent + duration — verify)*\n- [ ] **Antibiotic prophylaxis** (e.g. ceftriaxone) started at presentation for all cirrhotic UGIB regardless of ascites — continue up to 7 days *(agent/dose/duration — verify)*\n- [ ] **Endoscopy within 12 h** of presentation, once hemodynamically resuscitated\n- [ ] **Endoscopic variceal ligation (EVL)** first-line; EVL + vasoactive drug + antibiotics together = standard bundle (superior to any single modality)\n- [ ] Maintain restrictive transfusion strategy — over-transfusion raises portal pressure and rebleeding risk\n- [ ] **Rescue therapy** for refractory/recurrent bleeding: balloon tamponade or self-expanding esophageal stent as a **bridge only** → escalate to **early/rescue TIPS** if high-risk (e.g. Child-Pugh C, or B with active bleeding at endoscopy) *(criteria — verify)*\n- [ ] Establish **secondary prophylaxis** plan before discharge: non-selective beta-blocker + EVL program *(verify)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nRisk score documented? · transfusion threshold stated? · anticoagulation held/reversed with rationale? ·\ntime-to-endoscopy documented? · (variceal) vasoactive drug AND antibiotics BOTH started pre-endoscopy? ·\nrescue/TIPS criteria addressed if first-line therapy fails? · secondary prophylaxis plan at discharge?\n\n*Sources: [ACG Clinical Guideline: Upper GI and Ulcer Bleeding — Laine et al. 2021](https://pubmed.ncbi.nlm.nih.gov/33929377/) · [AASLD Practice Guidance: Portal Hypertension and Varices in Cirrhosis 2023](https://pubmed.ncbi.nlm.nih.gov/37870298/) · [AASLD Practice Guidance: TIPS, Variceal Embolization, and RTO 2023](https://pubmed.ncbi.nlm.nih.gov/37390489/)*\n"}, {"file": "vent-weaning-sbt-aarc-2024.md", "title": "Mechanical ventilation weaning & spontaneous breathing trial", "system": "Respiratory", "body": "# Mechanical ventilation weaning & spontaneous breathing trial — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** AARC Clinical Practice Guideline: Spontaneous Breathing Trials for Liberation From Adult\n> Mechanical Ventilation (Roberts KJ, Goodfellow LT, Battey-Muse CM, et al.), *Respiratory Care* 2024;69(7):891-901.\n> https://rc.rcjournal.com/content/69/7/891\n> Complementary/broader-bundle reference: Liberation from Mechanical Ventilation in Critically Ill Adults —\n> Official ATS/CHEST Clinical Practice Guideline, *AJRCCM* 2017 — covers the wider liberation bundle\n> (sedation, cuff-leak, post-extubation support) not re-litigated by the 2024 AARC update.\n> https://www.atsjournals.org/doi/10.1164/rccm.201610-2075ST\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2024 (AARC, SBT-specific) / 2017 (ATS/CHEST,\n> broader liberation bundle — still current for domains AARC did not re-address)\n\n## Daily readiness screening\n- [ ] Screen **daily** for SBT readiness once ventilated **>24 h**: adequate oxygenation *(FiO₂/PEEP\n  thresholds — verify, commonly FiO₂ ≤0.4–0.5, PEEP ≤5–8)*, hemodynamic stability off/minimal\n  vasopressors, no heavy sedation, adequate mental status/cough *(verify full criteria — ATS/CHEST 2017)*\n- [ ] **Rapid shallow breathing index (RSBI) is NOT required** to determine SBT readiness — 2024 AARC\n  conditional recommendation (moderate certainty); do not gate an otherwise-ready patient on RSBI alone\n- [ ] **Perform an SBT** once readiness criteria are met — strong rec (do not skip screening by default)\n- [ ] **Standardized approach to complete the SBT before noon each day** — 2024 AARC conditional\n  recommendation (very low certainty) *(verify local workflow supports this)*\n\n## SBT technique\n- [ ] SBT may be conducted **with or without low-level pressure support (≤8 cmH₂O)** — 2024 AARC\n  conditional recommendation (moderate certainty); no technique shown superior — T-piece and CPAP remain\n  acceptable alternatives *(verify local protocol choice)*\n- [ ] **Do not increase FiO₂** during the SBT to mask deterioration — 2024 AARC conditional recommendation\n- [ ] Duration *(verify local protocol — commonly 30–120 min)*\n- [ ] **Objective failure criteria** pre-defined and documented (RR, SpO₂, HR, BP, distress signs)\n  *(verify thresholds)*\n\n## Protocols & sedation\n- [ ] Use **protocol-driven ventilator liberation** (nurse/RT-driven) rather than ad hoc\n  physician-only timing — strong rec (ATS/CHEST 2017)\n- [ ] Pair SBT with a **daily sedation minimization/interruption protocol** for patients ventilated\n  >24 h — conditional rec (ATS/CHEST 2017)\n\n## Extubation decision & post-extubation support\n- [ ] **Cuff leak test** in patients at elevated risk of post-extubation stridor (e.g., traumatic or\n  prolonged intubation) — conditional rec; consider corticosteroids if leak test positive but\n  extubation still indicated *(dose/timing — verify)*\n- [ ] **Prophylactic NIV immediately after extubation** for high-risk patients (COPD, CHF,\n  hypercapnia, obesity) — strong rec, reduces reintubation\n- [ ] **HFNC** considered as an alternative for lower-risk hypoxemic patients post-extubation *(verify\n  per HFNC guideline — see companion checklist)*\n\n## Rehabilitation\n- [ ] **Early mobilization/rehabilitation** incorporated as part of the liberation bundle —\n  conditional rec (ATS/CHEST 2017)\n\n## Commonly-missed on documentation (what the gap-check flags)\nDaily SBT-readiness screen documented (not just \"not ready\" with no criteria listed)? · SBT not\ninappropriately gated on RSBI? · SBT technique (± low-level PS) and FiO₂-held-constant documented? · SBT\ncompletion targeted before noon per unit workflow? · sedation minimization paired with SBT attempts? ·\ncuff leak test performed in high-risk patients before extubation? · prophylactic NIV/HFNC planned for\nhigh-risk patients post-extubation?\n\n*Sources: [AARC Clinical Practice Guideline: Spontaneous Breathing Trials for Liberation From Adult Mechanical Ventilation — Respiratory Care 2024](https://rc.rcjournal.com/content/69/7/891) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/38443142/) · [AARC guideline summary — Guideline Central](https://www.guidelinecentral.com/guideline/3533896/) · [Prior/complementary edition — ATS/CHEST 2017 Liberation from Mechanical Ventilation — AJRCCM](https://www.atsjournals.org/doi/10.1164/rccm.201610-2075ST)*\n"}, {"file": "vt-vf-electrical-storm-esc-2022.md", "title": "Ventricular tachycardia/fibrillation & electrical storm", "system": "Cardiac", "body": "# Ventricular tachycardia/fibrillation & electrical storm — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the\n> prevention of sudden cardiac death, European Society of Cardiology, 2022.\n> https://academic.oup.com/eurheartj/article/43/40/3997/6675633 (also https://pubmed.ncbi.nlm.nih.gov/36017572/)\n> **Secondary:** 2017 AHA/ACC/HRS Guideline for Management of Patients With Ventricular Arrhythmias and\n> the Prevention of Sudden Cardiac Death — used for acute/pulseless algorithm cross-reference and\n> pharmacologic detail not itemized in the ESC electrical-storm summary.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000000549\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022 (check for a newer edition periodically)\n\n## Pulseless VT/VF — do not delay for this checklist\n- [ ] **Immediate defibrillation + ACLS algorithm** — this document does not duplicate the pulseless\n  arrest pathway; follow current **AHA ACLS VF/pulseless-VT algorithm** *(verify against institutional ACLS card)*\n\n## Hemodynamically unstable VT with a pulse\n- [ ] **Synchronized cardioversion** without delay *(energy per device/local protocol — verify)*\n- [ ] Brief sedation if time permits, but do not delay shock for a stable patient in extremis\n\n## Stable sustained monomorphic VT\n- [ ] **12-lead ECG** before treatment if tolerated (morphology aids later ablation planning)\n- [ ] **Antiarrhythmic drug vs elective cardioversion** — options include **amiodarone, procainamide, or\n  sotalol** *(agent/dose — verify against source and local formulary; procainamide avoided in significant\n  structural heart disease/reduced EF)*\n- [ ] Correct reversible/contributing factors in parallel (see below) — do not treat the rhythm in isolation\n\n## Correct reversible causes (all VT/VF presentations)\n- [ ] **Electrolytes** — K⁺ and Mg²⁺ to target *(level — verify)*\n- [ ] **Ischemia workup** — ECG, troponin; consider urgent angiography if ACS suspected\n- [ ] **Review QT-prolonging drugs** and stop/replace culprits\n- [ ] **Hypoxia and acid-base status** corrected\n- [ ] Consider drug toxicity/withdrawal, digoxin, or other reversible triggers per clinical context\n\n## Electrical storm — recognition\n- [ ] **Definition:** **≥3 separate sustained ventricular arrhythmia episodes within 24 h**, each requiring\n  termination by an intervention (shock, ATP, or drug) — ESC 2022\n- [ ] Distinguish **monomorphic VT** (usually scar-related, structural heart disease) vs **polymorphic\n  VT/VF** — management pathway differs per ESC algorithm\n\n## Electrical storm — management bundle (monomorphic VT + structural heart disease)\n- [ ] **Amiodarone IV** (bolus + infusion) — *(dose — verify)* — Class I\n- [ ] **Non-selective beta-blocker** (e.g. propranolol or metoprolol bolus) — Class I; combine with\n  amiodarone rather than using either alone\n- [ ] **Mild-to-moderate sedation** to blunt sympathetic surge — Class I; escalate to **general\n  anesthesia/intubation** if refractory\n- [ ] **ICD interrogation and reprogramming** if device present (detection zones, ATP settings)\n- [ ] **Identify and correct triggers** (ischemia, electrolytes, heart-failure decompensation, device lead issue)\n- [ ] **Urgent EP consultation** — for recurrent/refractory storm, **catheter ablation at an experienced\n  centre is preferred over continued escalation of sedation/autonomic modulation/mechanical support**\n- [ ] **Mechanical circulatory support** if hemodynamically compromised or storm precludes drug/ablation therapy\n- [ ] **Sympathetic modulation** (e.g. stellate ganglion block) or other autonomic modulation in refractory cases\n- [ ] **Refer to specialized/tertiary centre** if additional treatment needed beyond initial measures\n\n## Polymorphic VT / Torsades de Pointes (treat as distinct pathway)\n- [ ] **Avoid further QT-prolonging polypharmacy** — review and stop offending agents first\n- [ ] **IV magnesium** first-line regardless of measured level *(dose — verify)*\n- [ ] Correct **K⁺** to high-normal *(target — verify)*\n- [ ] For **bradycardia-dependent** Torsades: consider **isoproterenol** and/or **temporary pacing** to\n  increase heart rate and shorten QT *(verify — contraindicated in congenital LQTS)*\n- [ ] If structurally normal heart and no clear acquired cause, consider a primary channelopathy\n  (congenital LQTS, Brugada, CPVT) — see workup below\n\n## Post-event workup (once stabilized)\n- [ ] **Echocardiogram** — assess structural heart disease, EF\n- [ ] **Ischemia evaluation** (angiography/functional testing as indicated)\n- [ ] **Cardiac MRI** — ESC 2022 Class I in survivors of sudden cardiac arrest without a clear cause\n- [ ] **Genetic/channelopathy screening** if structurally normal heart and no cause identified; family\n  evaluation recommended if a pathogenic variant is found (including post-mortem cascade testing)\n- [ ] **ICD evaluation for secondary prevention** in survivors of VT/VF arrest without a fully reversible\n  cause *(indication/timing — verify against source)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nElectrical storm definition met/counted? · monomorphic vs polymorphic distinguished? · amiodarone +\nbeta-blocker both given? · sedation escalation documented? · reversible triggers (lytes/ischemia/QT\ndrugs/hypoxia) addressed? · ICD interrogated/reprogrammed if present? · EP/ablation referral for\nrecurrent storm? · echo + ischemia workup + genetic screen post-event? · secondary-prevention ICD addressed?\n\n*Sources: [2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death](https://pubmed.ncbi.nlm.nih.gov/36017572/) · [Spotlight on the 2022 ESC guideline — 10 novel key aspects (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC10228619/) · [2017 AHA/ACC/HRS Guideline for Management of Patients With Ventricular Arrhythmias and the Prevention of Sudden Cardiac Death](https://www.ahajournals.org/doi/10.1161/CIR.0000000000000549)*\n"}];
var refSel=null;
// minimal, safe markdown → HTML for the checklist files (headings, blockquote, - [ ] lists, bold/italic, links)
function refMd(md){
  var esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var inline=function(s){ s=esc(s);
    s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    return s; };
  var lines=md.split(/\r?\n/), out=[], inList=false, inBq=false;
  function closeList(){ if(inList){out.push('</ul>');inList=false;} }
  function closeBq(){ if(inBq){out.push('</blockquote>');inBq=false;} }
  lines.forEach(function(l){
    if(/^\s*$/.test(l)){ closeList(); closeBq(); return; }
    if(/^>\s?/.test(l)){ if(!inBq){out.push('<blockquote>');inBq=true;} out.push(inline(l.replace(/^>\s?/,''))+'<br>'); return; }
    closeBq();
    var h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){ closeList(); var lv=h[1].length; out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'); return; }
    var li=l.match(/^\s*[-*]\s+(?:\[[ x]\]\s+)?(.*)/);
    if(li){ if(!inList){out.push('<ul>');inList=true;} out.push('<li>'+inline(li[1])+'</li>'); return; }
    closeList(); out.push('<p>'+inline(l)+'</p>');
  });
  closeList(); closeBq(); return out.join('\n');
}
function renderReference(view){
  if(!REFDATA||!REFDATA.length){ view.innerHTML='<div class="panel"><div class="stub">No reference library embedded in this build.</div></div>'; return; }
  var SYS=['Cardiac','Respiratory','Neuro','GI / Hepatic','Renal / Metabolic / Endo','ID','Other'];
  view.innerHTML='<div style="position:absolute;inset:0;display:flex;flex-direction:column">'
    +'<div id="hvbar"><b>📖 Reference — ICU guideline library</b> <span style="color:#667">'+REFDATA.length+' conditions · offline · AI-compiled, verify before use</span>'
    +'<span class="hvsp"></span><input id="refq" placeholder="Search condition or text…" oninput="refFilter()" style="font:inherit;padding:5px 10px;border:1px solid #cdd9ee;border-radius:6px;min-width:240px"></div>'
    +'<div style="flex:1;display:flex;min-height:0">'
    +'<div id="reflist" style="flex:0 0 300px;overflow:auto;border-right:1px solid #c3d4ee;background:#f3f7fd;padding:6px 0"></div>'
    +'<div id="refbody" style="flex:1;overflow:auto;padding:16px 22px;background:#fff"></div>'
    +'</div></div>';
  var st=document.getElementById('refstyle');
  if(!st){ st=document.createElement('style'); st.id='refstyle';
    st.textContent='#reflist .rsys{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#8a97a8;padding:9px 14px 3px}'
     +'#reflist .ritem{padding:6px 14px;cursor:pointer;font-size:13px;color:#12285e;border-top:1px solid #e7eef9}'
     +'#reflist .ritem:hover{background:#e8f0fd}#reflist .ritem.on{background:#dbe6f6;font-weight:700}'
     +'#refbody h1{font-size:19px;color:#12285e;margin:0 0 6px}#refbody h2{font-size:14px;color:#1a3c8f;margin:16px 0 5px;border-bottom:1px solid #e7eef9;padding-bottom:3px}'
     +'#refbody blockquote{background:#fff8ec;border-left:4px solid #e0b020;margin:0 0 12px;padding:8px 12px;font-size:12px;color:#7a5a00;border-radius:0 6px 6px 0}'
     +'#refbody ul{margin:4px 0 10px;padding-left:22px}#refbody li{margin:3px 0;line-height:1.4}#refbody a{color:#1a73e8}#refbody code{background:#eef2f8;padding:1px 4px;border-radius:3px;font-size:12px}'
     +'#refbody .rstub{color:#889;padding:30px;text-align:center}';
    document.head.appendChild(st); }
  refRenderList('');
  var body=document.getElementById('refbody');
  body.innerHTML='<div class="rstub">← Pick a condition, or search. Each is an AI-compiled checklist from a reputable society guideline — <b>verify before clinical use</b>.</div>';
  function bySys(){ var g={}; REFDATA.forEach(function(r){ (g[r.system]=g[r.system]||[]).push(r); }); return g; }
  window._refBySys=bySys; window._refSYS=SYS;
}
function refRenderList(q){
  var list=document.getElementById('reflist'); if(!list)return;
  q=(q||'').toLowerCase();
  var g=window._refBySys(), html='';
  window._refSYS.forEach(function(sys){
    var items=(g[sys]||[]).filter(function(r){ return !q || r.title.toLowerCase().indexOf(q)>=0 || r.body.toLowerCase().indexOf(q)>=0; })
      .sort(function(a,b){return a.title<b.title?-1:1;});
    if(!items.length)return;
    html+='<div class="rsys">'+esc(sys)+'</div>';
    items.forEach(function(r){ html+='<div class="ritem'+(refSel===r.file?' on':'')+'" onclick="refOpen(\''+r.file+'\')">'+esc(r.title)+'</div>'; });
  });
  list.innerHTML=html||'<div class="rstub" style="padding:20px;font-size:12px">No match.</div>';
}
function refFilter(){ var q=document.getElementById('refq').value; refRenderList(q); }
function refOpen(file){
  refSel=file; var r=REFDATA.filter(function(x){return x.file===file;})[0]; if(!r)return;
  document.getElementById('refbody').innerHTML=refMd(r.body);
  refRenderList(document.getElementById('refq')?document.getElementById('refq').value:'');
}

// §23 rounding sheet for the current bed (uses live edits via the tool's captureToD when reachable)
function roundSheetForCurrent(){
  if(current==null||!beds[current]){ alert('Load a bed first (paste its JSON).'); return; }
  var d=bd(current);
  try{ var ifr=document.querySelector('#view iframe'); if(ifr&&ifr.contentWindow&&typeof ifr.contentWindow.captureToD==='function'){ var ed=ifr.contentWindow.captureToD(); if(ed&&ed.bed!=null)d=ed; } }catch(e){}
  var html=renderRoundingSheet(d);
  var w=window.open('','_blank');
  if(w){ w.document.open(); w.document.write(html); w.document.close(); }
  else { alert('Popup blocked — allow popups for this page to open the rounding sheet.'); }
}
