n verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Global Strategy for Asthma Management and Prevention — 2026 Strategy Report, Global Initiative for\n> Asthma (GINA), released May 2026.\n> https://ginasthma.org/2026-gina-strategy-report/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026 (annually updated — check for newer edition)\n\n## Why — physiology / first principles\n- Bronchospasm + airway wall inflammation + mucus plugging → severe, diffuse **expiratory** flow limitation\n  → air trapping/dynamic hyperinflation → high intrinsic PEEP and inspiratory work of breathing.\n- Unlike COPD, the airway wall is structurally normal at baseline, so bronchodilator response is typically\n  faster/more complete.\n- **Silent chest** = airflow so limited that turbulence can no longer generate wheeze — a sign of impending\n  failure, not improvement.\n- Ventilator strategy (low RR, long expiratory time, permissive hypercapnia) exists to counter breath-stacking\n  and barotrauma from air trapping; beta-agonists relax smooth muscle, steroids reduce inflammatory\n  edema/mucus, and magnesium/anticholinergics add relaxation via separate mechanisms.\n\n## Diagnosis / definition\n- [ ] **Terminology**: acute asthma exacerbation (worsening symptoms/lung function from baseline) vs\n  **life-threatening asthma** (features below) vs **near-fatal asthma** (raised PaCO₂ and/or requiring\n  mechanical ventilation) — status asthmaticus generally refers to a severe exacerbation refractory to\n  initial bronchodilator therapy *(verify current GINA terminology — 2026 report may not use \"status\n  asthmaticus\" as a formal term)*\n- [ ] Severity assessed: ability to speak, RR, HR, accessory muscle use, PEF (if feasible), SpO₂\n  *(verify thresholds per severity tier)*\n- [ ] **Life-threatening features actively screened**: silent chest, cyanosis, exhaustion/poor\n  respiratory effort, confusion/drowsiness, bradycardia, hypotension, **SpO₂ <92%** *(verify full list)*\n- [ ] Consider validated severity/impairment tools where applicable — **PRAM** (pediatric acute severity),\n  **Peds-AIRQ**, or **CAAT** (chronic control context) *(2026 additions — verify local adoption)*\n\n## Key labs & workup\n- [ ] **ABG/VBG**: goal of initial treatment is reducing work of breathing, **not** normalizing the\n  gas immediately — an initially elevated PaCO₂ is less concerning than a **rising** PaCO₂ on repeat\n  sampling despite treatment, which signals fatigue/impending failure *(verify — do not treat a single\n  \"normal\" PaCO₂ in a tachypneic asthmatic as reassuring)*\n- [ ] **CXR** to exclude pneumothorax/pneumonia/other precipitant, especially before intubation or if\n  asymmetric exam findings *(verify indication threshold)*\n- [ ] **Lactate**: beta-agonist therapy (inhaled/IV/IM) is a recognized cause of a **type B lactic\n  acidosis**; lactate **>3–5 mmol/L** in this setting more often reflects beta-agonist dosing than\n  sepsis/shock — do not reflexively broaden for infection without other supporting signs *(verify\n  threshold, and still exclude shock as a contributor)*\n- [ ] **Potassium**: beta-agonists drive intracellular K⁺ shift — monitor for hypokalemia, especially\n  with repeated/continuous nebulized SABA *(verify frequency of monitoring)*\n- [ ] PEF/spirometry if feasible, trended against personal best *(verify)*\n\n## Management\n\n## Initial ED/ICU bundle\n- [ ] **Controlled oxygen — revised target**: supplemental O₂ **not required unless SpO₂ <92%**; once given,\n  titrate to **SpO₂ 92–95%** in adults/adolescents/children 6–11y, **≥92%** in children ≤5y *(2026 change —\n  narrower/lower target than prior editions — verify against local protocol)*\n- [ ] **Repeated/continuous nebulized SABA**\n- [ ] **Ipratropium bromide** added for severe exacerbations\n- [ ] Consider **ICS-formoterol** as an alternative reliever strategy for mild exacerbations per updated\n  dosing guidance *(agent/dose — verify, most-available formulation)*\n- [ ] **Systemic corticosteroids early** — oral if tolerated, IV if severe/vomiting/impending respiratory\n  failure *(dose — verify)*; **minimize OCS course/dose** where response allows — 2026 emphasis on OCS\n  stewardship\n- [ ] Consider **high-dose ICS** in the ED as adjunct *(verify)*\n- [ ] **Reassess response at 1 h or earlier**; document trajectory, not just a single snapshot\n\n## Refractory / severe exacerbation\n- [ ] **IV magnesium sulfate** considered if poor response to initial intensive treatment *(dose — verify)*\n- [ ] Heliox considered in select refractory cases *(verify availability/evidence)*\n- [ ] **NIV** used only cautiously and selectively — significant risk from air-trapping/dynamic\n  hyperinflation; not a substitute for timely intubation if deteriorating *(verify local practice)*\n- [ ] **Intubation indications**: respiratory or cardiac arrest, altered consciousness, hemodynamic\n  instability, exhaustion despite maximal therapy *(verify criteria)*\n- [ ] Post-intubation ventilation: permissive hypercapnia, prolonged expiratory time, minimize breath\n  stacking/dynamic hyperinflation *(vent settings — verify)*\n- [ ] **Anaphylaxis as a differential/co-trigger** actively considered in atypical or rapidly progressive\n  presentations *(2026 emphasis — verify)*\n\n## Disposition\n- [ ] **ICU admission criteria** documented: poor/no response to initial therapy, worsening or\n  life-threatening features, need for ventilatory support *(verify local criteria)*\n- [ ] **Fatality-risk indicators** reviewed and documented (prior near-fatal attack, ICU/intubation history,\n  recent OCS use, poor adherence, psychosocial factors) *(verify current list)*\n- [ ] Discharge bundle: written asthma action plan, controller therapy reviewed/escalated (**biologics\n  eligibility considered** if frequent severe exacerbations), inhaler technique checked, follow-up arranged\n  *(2026: structured follow-up and OCS-minimization plan emphasized)*\n\n## Pearls & pitfalls\n- Rising lactate in a wheezing patient on heavy beta-agonist dosing may be **type B lactic acidosis\n  from the beta-agonist itself**, not sepsis/shock — check whether easing bronchodilator dosing (once\n  clinically able) trends it down before broadening the workup *(verify — IBCC/EMCrit, Farkas)*\n- A **stable or \"normal\" PaCO₂ is not reassuring** on its own in a severely tachypneic asthmatic — the\n  trend (rising despite treatment) is what predicts impending respiratory failure, not a single value\n  *(verify — IBCC/EMCrit)*\n- If intubation is needed, **connect to the ventilator promptly and avoid aggressive bag-mask\n  ventilation** beforehand — over-bagging can precipitate severe gas-trapping and hemodynamic collapse\n  *(verify local practice — IBCC/EMCrit)*\n- **Auto-PEEP/dynamic hyperinflation is the dominant post-intubation problem**, not oxygenation — a\n  deliberately **slow respiratory rate (~12–14/min)** with a long expiratory time is generally the most\n  effective way to limit gas-trapping *(verify vent settings — IBCC/EMCrit)*\n- **Permissive hypercapnia is a deliberate strategy** post-intubation — there is no single universal\n  pH threshold below which patients uniformly deteriorate, so avoid chasing a \"normal\" pH with\n  aggressive minute ventilation; use caution with this approach in raised ICP, pregnancy, or severe\n  pulmonary hypertension *(verify contraindications and local pH target — IBCC/EMCrit)*\n- Sudden **hemodynamic collapse or loss of pulses immediately after intubation** in a severe asthmatic\n  should prompt disconnecting the circuit to allow passive exhalation (relieving breath-stacking/\n  tension physiology) before assuming arrest/PEA management *(verify — IBCC/EMCrit)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nLife-threatening features explicitly screened (not just \"severe\")? · revised SpO₂ target (92–95%, not\nblanket high-flow O₂) applied and documented? · ipratropium added for severe presentations? · magnesium\nconsidered and documented if poor initial response? · ICU criteria stated? · fatality-risk indicators\nreviewed? · written action plan + follow-up (incl. biologics eligibility) arranged at discharge?\n\n*Sources: [GINA 2026 Strategy Report](https://ginasthma.org/2026-gina-strategy-report/) · [GINA 2026 Strategy Report PDF (May 2026)](https://ginasthma.org/wp-content/uploads/2026/05/GINA-2026-Strategy-Report-WMS.pdf) · [GINA 2026 Update: Key Highlights — Guideline Central](https://www.guidelinecentral.com/insights/may-2026-gina-asthma-guideline-spotlight/) · [Acute Severe Asthma in Adolescent and Adult Patients — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC6780340/) · [IBCC — Asthma (EMCrit, Josh Farkas)](https://emcrit.org/ibcc/asthma/) — Pearls & pitfalls section*\n"}, {"file": "status-epilepticus-aes-2016.md", "title": "Status epilepticus", "system": "Neuro", "body": "# Status epilepticus — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Evidence-Based Guideline: Treatment of Convulsive Status Epilepticus in Children and\n> Adults, American Epilepsy Society, *Epilepsy Currents* 2016.\n> https://aesnet.org/clinical-care/clinical-guidance/guideline-prolonged-seizures\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2016 · defines status epilepticus operationally\n> as ≥5 min continuous/repeated convulsive activity without recovery (treat at 5 min, don't wait for 30)\n\n## Why — physiology / first principles\n- Status epilepticus = failure of the normal seizure-termination mechanisms → sustained excitatory (glutamatergic) drive overwhelms inhibitory (GABAergic) tone.\n- With prolonged seizure activity, GABA-A receptors internalize and desensitize — the seizing brain becomes progressively **less** responsive to GABAergic drugs the longer it seizes, which is the physiologic basis for treating early and escalating fast rather than repeating the same drug class.\n- Prolonged seizure activity causes independent excitotoxic neuronal injury as metabolic demand outstrips supply — this continues even once visible motor activity stops (non-convulsive SE), justifying aggressive treatment and EEG confirmation of true termination, not just clinical quiescence.\n- Rationale for the staged protocol (benzodiazepine → second-line antiseizure drug → anesthetic infusion by ~40 min): each step targets a different point of failure as the first-line mechanism becomes progressively less effective.\n\n## Diagnosis / definition\n- **Operational definition (per header)**: ≥5 min continuous convulsive activity, or ≥2 discrete seizures\n  without return to baseline consciousness between them — treat at 5 min, do not wait for the traditional\n  30-min definition\n- **T1/T2 conceptual framework** *(ILAE framework AES draws on — verify exact figures against AES 2016\n  text)*: **T1** = time point beyond which a seizure should be treated as SE (**~5 min** for convulsive SE);\n  **T2** = time point beyond which ongoing seizure activity risks long-term neuronal injury/consequences\n  (**~30 min** for convulsive SE) *(verify)*\n- **Refractory SE**: seizure activity persists despite adequate first-line **and** second-line therapy\n- **Super-refractory SE**: SE persists or recurs **≥24 h** after onset of anesthetic (third-line) therapy,\n  including recurrence on withdrawal of anesthesia *(verify)*\n- **Scope note**: this guideline addresses **convulsive** SE specifically. **Non-convulsive SE (NCSE)**\n  requires **EEG confirmation** — do not diagnose electrographically-silent \"SE\" on clinical grounds alone\n- **Differential**: psychogenic non-epileptic seizures (PNES) should remain on the differential, especially\n  if activity is atypical or fails to respond to escalating anesthetic doses — do not anesthetize indefinitely\n  without reconsidering the diagnosis\n\n## Key labs & workup\n- [ ] **Fingerstick glucose** (already first-line above)\n- [ ] **Electrolytes** — Na, Ca, Mg, phosphate *(verify local panel)*\n- [ ] **AED/ASM drug level(s)** if patient on maintenance therapy — subtherapeutic level is a common\n      precipitant\n- [ ] **CBC, renal & hepatic function**\n- [ ] **Toxicology screen** if clinical suspicion (ingestion/overdose)\n- [ ] **Neuroimaging** — **CT emergently** if new-onset/unexplained/focal exam; **MRI once stabilized**\n      for further characterization *(verify timing)*\n- [ ] **LP** if infectious etiology (meningitis/encephalitis) suspected — do not delay first-line\n      anticonvulsant therapy to obtain it\n- [ ] **Continuous EEG** — see Third-therapy section below; essential to confirm true seizure termination\n      and exclude non-convulsive/subtle SE once convulsive motor activity stops\n\n## Management\n\n### Stabilization (0–5 min)\n- [ ] **Time seizure onset** — start the clock; **ABCs** — airway/positioning, O2, monitor\n- [ ] **Fingerstick glucose**; treat hypoglycemia if present (**verify** dose: e.g. dextrose ± thiamine first if malnourished/alcohol use)\n- [ ] **IV access**; send labs (electrolytes, Ca/Mg, AED levels if applicable, tox screen as indicated)\n- [ ] **Identify/treat reversible cause** in parallel (hyponatremia, hypoglycemia, eclampsia, overdose, meningitis/encephalitis)\n\n### Initial therapy — benzodiazepine (5–20 min, \"first therapy\")\n- [ ] **First-line benzodiazepine given without delay** — one of:\n  - [ ] **IM midazolam** *(weight-based dose — verify)* — preferred if no IV access\n  - [ ] **IV lorazepam** *(dose — verify)*\n  - [ ] **IV diazepam** *(dose — verify)*\n- [ ] **Repeat dose** if seizure continues past a defined interval *(verify — do not under-dose)*\n- [ ] Document **time-to-first-dose** — delay is the single most modifiable driver of refractoriness\n\n### Second therapy — urgent control (20–40 min)\n- [ ] If seizure persists after adequate benzodiazepine dosing, give **one** urgent-control agent:\n  - [ ] **IV fosphenytoin/phenytoin** *(loading dose — verify)*\n  - [ ] **IV valproic acid** *(loading dose — verify)*\n  - [ ] **IV levetiracetam** *(loading dose — verify)*\n  - [ ] (no high-quality evidence favors one agent — guideline notes equipoise; choose per comorbidity/allergy)\n\n### Third therapy — refractory status (>40 min)\n- [ ] If seizure continues, **repeat a second-therapy agent** or proceed to **anesthetic-dose therapy**:\n  - [ ] **Continuous infusion** — midazolam, propofol, or pentobarbital *(dose/titration — verify)*\n  - [ ] **Continuous EEG monitoring** initiated (mandatory once on continuous infusion / paralyzed / not\n        rapidly awakening)\n- [ ] **ICU admission**, mechanical ventilation as needed, hemodynamic support for infusion agents\n- [ ] **Neurology/epilepsy consultation**\n\n### Ongoing / super-refractory\n- [ ] **cEEG** to titrate to burden reduction (burst-suppression vs seizure-suppression per unit protocol — verify target)\n- [ ] **Etiology workup completed** — neuroimaging, LP if indicated, autoimmune/infectious panel if unexplained\n- [ ] **Maintenance ASM** established with a plan for wean of anesthetic infusion\n- [ ] **Complication surveillance** — rhabdomyolysis, aspiration, hyperthermia, propofol infusion syndrome if applicable\n\n## Pearls & pitfalls\n*FOAMed-sourced tips, not guideline directives — verify locally.*\n- **IM midazolam is often faster in practice than IV benzodiazepine** when IV access isn't already\n  established — the RAMPART trial (referenced widely by LITFL and EMCrit) showed IM midazolam\n  non-inferior to IV lorazepam, in part because it skips the IV-access delay — *(LITFL Critical Care\n  Compendium — Status Epilepticus; EMCrit)*\n- **Benzodiazepine under-dosing is one of the most common preventable errors** — clinicians frequently\n  give doses well below weight-based targets out of unfounded fear of hypotension/respiratory depression;\n  under-treated SE is more dangerous than an adequately dosed benzodiazepine — *(EMCrit; LITFL)*\n- **Don't wait indefinitely to escalate** — if the seizure hasn't stopped by the defined re-assessment\n  point, move to the next therapy tier promptly rather than repeatedly re-dosing the same class off-protocol\n  — *(LITFL Critical Care Compendium — Status Epilepticus)*\n- **Convulsive activity stopping ≠ seizure over** — after motor activity resolves, persistent\n  non-convulsive/subtle SE is common and only detectable on EEG; a patient who \"looks post-ictal\" may\n  still be seizing electrographically — *(LITFL Critical Care Compendium; Deranged Physiology)*\n- **No clear \"best\" second-line agent** — the ESETT trial (widely discussed on EMCrit and LITFL) found\n  fosphenytoin, valproate, and levetiracetam broadly comparable in efficacy; choose by comorbidity/allergy/\n  hemodynamic profile rather than presumed superiority — *(EMCrit; LITFL)*\n- **Watch for propofol-related infusion syndrome** with high-dose/prolonged propofol infusions for\n  refractory SE — trend lactate, CK, triglycerides, and acid-base status — *(LITFL Critical Care\n  Compendium; Deranged Physiology)*\n- **Ketamine is an increasingly discussed adjunct** in refractory/super-refractory SE — NMDA-receptor\n  antagonism is mechanistically attractive given receptor trafficking changes with prolonged seizures,\n  though the evidence base is smaller than for first/second-line agents — *(LITFL; EMCrit)*\n- **If \"SE\" isn't responding despite adequate anesthetic dosing, reconsider the diagnosis** —\n  psychogenic non-epileptic seizures can mimic refractory SE and shouldn't be anesthetized indefinitely\n  — *(LITFL Critical Care Compendium — Status Epilepticus)*\n\n*Note: EMCrit IBCC — Status Epilepticus (https://emcrit.org/ibcc/status-epilepticus/) verified live and\ncorroborates the benzodiazepine-underdosing, IM-route, and PNES-mimicry pearls above (including its own\n~15% ICU pseudoseizure figure and GABA-receptor-internalization rationale for early adequate dosing).\nLITFL and Deranged Physiology URLs could not be live-verified this session (LITFL blocks automated\nfetch with HTTP 403; Deranged Physiology page path unconfirmed) — content is consistent with material\ncommonly published on those sites but confirm the specific article link before circulating.*\n\n## Commonly-missed on documentation (what the gap-check flags)\nSeizure onset time + time-to-first-benzodiazepine documented? · adequate (not under-) dose given? ·\nsecond-therapy agent given if still seizing at ~20 min? · cEEG started before/at anesthetic infusion? ·\nreversible-cause workup (glucose/lytes) charted? · etiology workup for new-onset/unexplained SE?\n\n*Sources: [Evidence-Based Guideline: Treatment of Convulsive Status Epilepticus — AES / Epilepsy Currents 2016](https://aesnet.org/clinical-care/clinical-guidance/guideline-prolonged-seizures) · [Proposed Algorithm for Convulsive Status Epilepticus — AES](https://aesnet.org/docs/default-source/press-releases-assets/cse-treatment-chart-final_rerelease.pdf) · [Treatment of Refractory Convulsive Status Epilepticus — AES Treatments Committee, PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7576920/) · [EMCrit IBCC — Status Epilepticus](https://emcrit.org/ibcc/status-epilepticus/) (Pearls & pitfalls, verified) · Pearls & pitfalls also reference LITFL Critical Care Compendium (Status Epilepticus) and Deranged Physiology by name — specific article URLs not live-verified this session (LITFL blocks automated fetch), confirm before circulating.*\n"}, {"file": "stemi-acs-accaha-2025.md", "title": "STEMI / Acute Coronary Syndrome", "system": "Cardiac", "body": "# STEMI / Acute Coronary Syndrome — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary\n> Syndromes (Joint Committee on Clinical Practice Guidelines), *Circulation* / *JACC* 2025 — first major\n> update since 2013 STEMI / 2014 NSTE-ACS guidelines.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000001309\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025\n\n## Why — physiology / first principles\n- STEMI = acute atherosclerotic plaque rupture/erosion → platelet-rich thrombus → abrupt coronary\n  occlusion → the myocardium it supplies becomes ischemic and begins necrosing as a **wavefront**\n  spreading from subendocardium (highest O2 demand, worst collateral supply) outward to epicardium over\n  hours — this is the entire rationale for \"time is muscle\" and door-to-balloon urgency.\n- Antiplatelets (aspirin, P2Y12 inhibitor) and anticoagulation limit thrombus propagation/re-occlusion;\n  they do not dissolve/remove the culprit clot — only reperfusion (PCI or fibrinolysis) does that, which\n  is why antithrombotics are adjuncts to, not substitutes for, timely reperfusion.\n- β-blockade and nitrates reduce myocardial oxygen demand (MVO2 = HR × contractility × wall stress) in\n  the surviving/at-risk myocardium — symptom and demand-side management, not clot-directed therapy.\n- NSTEMI/unstable angina share the plaque-rupture mechanism but with sub-occlusive or transient thrombus\n  — less absolute urgency than a fully occluded artery, hence risk-stratified (not universally emergent)\n  invasive timing.\n\n## Diagnosis / definition\n- [ ] **ACS spectrum** — STEMI vs NSTEMI vs unstable angina, differentiated by ECG (ST elevation) plus\n  troponin (rise/fall pattern with **≥1 value >99th percentile URL**) *(verify)*\n- [ ] **STEMI ECG criteria** *(verify against source/local criteria)* — new ST elevation at the J-point\n  in **≥2 contiguous leads**: **≥1 mm** in most leads; **≥2 mm (men ≥40y) / ≥2.5 mm (men <40y) / ≥1.5 mm\n  (women)** in V2–V3 — new/presumed-new **LBBB alone is no longer treated as an automatic\n  STEMI-equivalent**; assess with clinical context ± Sgarbossa/modified-Sgarbossa criteria *(verify)*\n- [ ] **STEMI-equivalents to actively screen for** — posterior MI (ST depression V1–V3 + posterior lead\n  V7–V9 elevation), **de Winter T-waves**, **Wellens' syndrome**, hyperacute T-waves, diffuse ST\n  depression with **ST elevation in aVR** (left main/multivessel pattern) *(verify each)*\n- [ ] **Type 1 vs Type 2 MI** distinguished — Type 1 = plaque rupture/thrombosis (this guideline's\n  primary focus); Type 2 = supply–demand mismatch without acute atherothrombosis — management differs\n  substantially *(verify classification before applying the full ACS pathway)*\n- [ ] **Universal definition of MI applied** — acute myocardial injury (troponin rise/fall, ≥1 value\n  >99th percentile URL) **plus** clinical evidence of acute ischemia (symptoms, new ischemic ECG\n  changes, pathologic Q waves, imaging evidence of new regional wall motion abnormality/loss of viable\n  myocardium, or angiographic/autopsy thrombus) *(verify)*\n- [ ] **Repeat/serial ECG mandatory** if initial non-diagnostic but suspicion remains high — up to\n  **~15% of additional STEMI** cases identified only on a repeat/serial (e.g. EMS transport) ECG *(verify)*\n\n## Key labs & workup\n- [ ] **High-sensitivity troponin preferred** — draw immediately; repeat per a validated **0/1-h or\n  0/2-h** (0/3-h if hs-cTn unavailable) algorithm rather than a single fixed cutoff *(verify local\n  assay/algorithm)*\n- [ ] **Posterior leads (V7–V9)** applied if ongoing symptoms + non-diagnostic standard 12-lead\n- [ ] **Lipid panel** within 24 h of presentation (untreated baseline) to guide statin intensity *(verify)*\n- [ ] **Renal function (eGFR/Cr)** before contrast load and for medication dosing (P2Y12, anticoagulant, ACEi/ARB)\n- [ ] **CBC** — baseline Hb for bleeding-risk stratification before antithrombotic therapy\n- [ ] **Electrolytes (K⁺, Mg²⁺)** — arrhythmia risk in acute MI\n- [ ] **Echocardiogram** — LVEF, wall motion, mechanical complications (early if shock/murmur; otherwise\n  pre-discharge per Management below)\n- [ ] **Coagulation profile** if anticoagulation/thrombolysis being considered or bleeding risk uncertain\n- [ ] **HbA1c/glucose** — diabetes screening, common comorbidity affecting risk stratification *(verify)*\n\n## Management\n\n## Initial evaluation & reperfusion decision\n- [ ] **12-lead ECG within 10 min** of first medical contact (verify); repeat/serial ECGs if initial non-diagnostic + high suspicion\n- [ ] **Troponin** — hs-cTn preferred; repeat at ~1–2 h (hs-cTn) or ~3–6 h (conventional) — verify assay-specific cutoffs/protocol\n- [ ] **STEMI, PCI-capable site:** FMC-to-device ≤90 min (verify) · **transfer to PCI centre:** ≤120 min (verify) — else fibrinolysis if <12 h from onset\n- [ ] **Fibrinolysis** if STEMI <12 h and anticipated PCI delay >120 min (verify) — screen contraindications; if given, still plan transfer for rescue/early angio\n- [ ] **STEMI 12–24 h** from onset with ongoing ischemia/instability — PCI still reasonable (verify local threshold)\n- [ ] **Radial access preferred** over femoral for PCI (bleeding/vascular complication/mortality reduction)\n- [ ] Admit to CICU/monitored bed per risk; **telemetry** duration per risk stratification (verify unit protocol)\n\n## Antithrombotic therapy\n- [ ] **Aspirin** loading dose then daily low-dose, unless contraindicated (verify dose)\n- [ ] **P2Y12 inhibitor:** prasugrel or ticagrelor preferred over clopidogrel for STEMI/NSTE-ACS undergoing PCI (verify — prasugrel contraindicated if prior stroke/TIA); clopidogrel if preferred agents unavailable/contraindicated, or as fibrinolysis-based DAPT partner\n- [ ] **DAPT duration** — at least 12 months as default if not high bleeding risk (verify); consider de-escalation/monotherapy transition (e.g. ticagrelor monotherapy) from ~1 month post-PCI in high-bleeding-risk patients (verify)\n- [ ] **Anticoagulation** — UFH (PCI or upstream medical), or enoxaparin/fondaparinux upstream if early-invasive not planned; bivalirudin as an alternative, particularly STEMI (verify agent/dose per local protocol); avoid fondaparinux as sole anticoagulant for PCI support\n- [ ] If on **oral anticoagulant + PCI** (AF etc.): plan triple- vs dual-therapy duration up front — default to early aspirin discontinuation (~1–4 wk) with P2Y12 + OAC continued (verify)\n- [ ] **Intracoronary imaging (IVUS/OCT)** for left main or complex lesions — now a stronger recommendation (verify institutional capability)\n- [ ] **Complete revascularization** of significant non-culprit disease in stable patients (STEMI and NSTE-ACS) — avoid routine non-culprit PCI if cardiogenic shock\n\n## Adjunctive medical therapy\n- [ ] **Beta-blocker**, oral, within 24 h unless contraindicated (verify — caution in overt HF/low-output states)\n- [ ] **ACEi/ARB** — indicated in higher-risk (LVEF ≤40%, anterior MI, HTN, DM); reasonable more broadly (verify)\n- [ ] **MRA** if LVEF ≤40% plus HF symptoms and/or diabetes (verify renal function/K+ first)\n- [ ] **High-intensity statin** for all ACS; add non-statin agent if LDL-C remains ≥70 mg/dL (≥1.8 mmol/L) on maximal statin (verify); recheck lipids at 4–8 wk\n- [ ] **Oxygen** only if SpO2 <90% — avoid routine supplemental O2 if saturating normally\n- [ ] Consider **low-dose colchicine** for secondary MACE reduction (verify — weak recommendation, check contraindications)\n- [ ] **Annual influenza vaccination** before/at discharge\n\n## Complications, shock, and discharge planning\n- [ ] **Cardiogenic shock:** emergency revascularization regardless of time from symptom onset; microaxial flow pump reasonable for severe/refractory shock in STEMI (verify eligibility); avoid routine IABP/VA-ECMO\n- [ ] **Mechanical complications** (free wall rupture, VSD, papillary muscle rupture) — manage at a surgical-capable centre; short-term mechanical circulatory support as a bridge (verify)\n- [ ] **Arrhythmia/conduction monitoring** — pacing for Mobitz II/high-grade/3rd-degree AV block (verify); ICD timing referenced to LVEF ≤40% at ≥40 days post-MI / ≥90 days post-revascularization (verify)\n- [ ] **LVEF assessment** prior to discharge to guide therapy\n- [ ] **Cardiac rehabilitation referral** prior to discharge (or home-based alternative) — do not defer to outpatient follow-up alone\n- [ ] Anemia/transfusion threshold individualized (verify — no routine liberal transfusion above ~10 g/dL)\n\n## Pearls & pitfalls\n- Nearly one-third of NSTEMI patients harbor an unrecognized acute total coronary occlusion (OMI) on\n  delayed angiography — \"STEMI(-) OMI\" carries similar infarct size/mortality to STEMI(+) OMI but with\n  longer delays to angiography; a non-diagnostic ECG should not stop the workup if the story is\n  textbook *(REBEL EM)*\n- Look beyond millimeter ST-elevation thresholds — hyperacute T-waves, terminal QRS distortion,\n  reciprocal ST depression/T-wave inversion, and pathologic Q-waves are common in occlusion MI that\n  never meets formal STEMI criteria on any serial ECG *(REBEL EM)*\n- ST-elevation morphology (concave/convex/obliquely straight) is not reliable on its own to separate\n  STEMI from mimics (pericarditis, benign early repolarization, LVH, LBBB) — reciprocal ST depression is\n  a more useful discriminator *(LITFL)*\n- **De Winter T-waves** are a STEMI-equivalent pattern with high specificity for proximal LAD occlusion\n  — recognize it even without frank ST elevation *(LITFL)*\n- In LBBB/paced rhythm, the original Sgarbossa criteria are highly specific but poorly sensitive\n  (~36% (verify)) for missed MI; the Smith-modified criteria (proportionally excessive discordant ST\n  elevation ≥25% (verify) of the preceding S-wave) improve sensitivity — favor serial ECGs over a single\n  tracing when uncertain *(LITFL)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nDoor-to-ECG time · troponin trend documented · reperfusion strategy + timing rationale · P2Y12 choice + DAPT\nduration plan · anticoagulant + PCI-access route · beta-blocker/ACEi/statin all addressed (or contraindication\nnoted) · LVEF documented pre-discharge · cardiac rehab referral placed · triple-therapy duration plan if on OAC\n\n*Sources: [2025 ACC/AHA/ACEP/NAEMSP/SCAI ACS Guideline — Circulation](https://www.ahajournals.org/doi/10.1161/CIR.0000000000001309) · [ACC guideline hub](https://www.acc.org/guidelines/guidelines/2025/02/27/17/21/acute-coronary-syndromes-2025) · [Antiplatelet/Anticoagulant key recommendations — JACC](https://www.jacc.org/doi/10.1016/j.jacc.2025.04.002) · [Guideline Central summary](https://www.guidelinecentral.com/guideline/4374545/) · [LITFL — ST Segment](https://litfl.com/st-segment-ecg-library/) · [LITFL — Sgarbossa Criteria](https://litfl.com/sgarbossa-criteria-ecg-library/) · [REBEL EM — Upping Our ECG Game: OMI vs STEMI](https://rebelem.com/upping-our-ecg-game-omi-vs-stemi/)*\n"}, {"file": "tbi-btf-2016.md", "title": "Severe traumatic brain injury (TBI)", "system": "Neuro", "body": "# Severe traumatic brain injury (TBI) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** Guidelines for the Management of Severe Traumatic Brain Injury, 4th Edition, Brain Trauma\n> Foundation, *Neurosurgery* 2016 (decompressive craniectomy chapter updated 2020).\n> https://braintrauma.org/coma/guidelines/severe-tbi\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2016 (DC recommendations updated 2020) ·\n> BTF operates a \"living guideline\" model — confirm no newer chapter update\n\n## Why — physiology / first principles\n- TBI = primary mechanical injury (fixed at the moment of impact, not modifiable) plus secondary injury evolving over hours-days from ischemia, edema, excitotoxicity, and raised ICP — management targets only the secondary phase.\n- Monro-Kellie doctrine: the cranial vault is a fixed volume (brain + blood + CSF) — a rise in any one compartment must be offset by another or ICP rises, initially compensated then exponentially once compensation is exhausted.\n- Cerebral perfusion pressure (CPP) = MAP − ICP; autoregulation is often impaired after TBI, so cerebral blood flow becomes passively pressure-dependent — rationale for CPP-targeted management (avoiding both ischemia from CPP too low and hyperemia/edema from CPP too high).\n- Rationale for avoiding hypotension/hypoxia: these are secondary insults that convert marginally-perfused tissue into infarct, on top of the primary injury.\n- Rationale for hyperosmolar therapy (mannitol/hypertonic saline): creates an osmotic gradient pulling free water out of relatively uninjured brain tissue, buying intracranial volume without treating the underlying lesion.\n\n## Diagnosis / definition\n- [ ] **GCS documented** (Eye 1–4 + Verbal 1–5 + Motor 1–6, total 3–15) — **severe TBI = GCS ≤8**\n      *(verify — post-resuscitation GCS, not pre-hospital, is the defining value)*\n- [ ] **Marshall CT classification** noted where used — diffuse injury I–IV (based on midline shift,\n      cisternal compression, mass lesion) vs. evacuated/non-evacuated mass lesion categories; informs\n      ICP-monitoring/prognosis discussion *(verify local use — not mandated by BTF 4th ed, but widely\n      referenced in the trial literature underlying it)*\n- [ ] **Rotterdam CT score** considered as an alternative prognostic CT scoring system where used\n      *(verify — not a BTF-mandated tool; some units prefer it for its added granularity)*\n- [ ] **Pupillary exam** — size, reactivity, and **asymmetry >1 mm** documented at each check *(verify\n      threshold)*; a core exam component tied to herniation risk, tracked serially not just at admission\n- [ ] **Primary vs secondary injury** distinguished in framing — primary injury (the impact itself) is\n      fixed at time of injury; secondary injury (hypotension, hypoxia, raised ICP, hyperthermia) is the\n      only target intervention can modify — this is why hypotension/hypoxia avoidance is emphasized above\n      all else in early management\n\n## Key labs & workup\n- [ ] **Non-contrast CT head** — first-line; **repeat CT** for any neurologic decline or before major\n      management decisions (e.g. ICP monitor removal)\n- [ ] **Coagulation panel** (INR/PTT/platelets) — essential given trauma/anticoagulant-drug interaction;\n      drives reversal decisions *(agent/dose per local massive-transfusion/reversal protocol — verify)*\n- [ ] **Type & screen / crossmatch** if polytrauma or ongoing hemorrhage suspected\n- [ ] **ICP monitor placement** — itself a monitoring/workup step, not just a treatment; see indication\n      thresholds above\n- [ ] **Serum osmolality / sodium** — monitored during hyperosmolar therapy; **avoid Na⁺ >155 mEq/L**\n      and rises **>6–8 mEq/L per day**; **osmolal gap >55 mOsm** suggests mannitol accumulation\n      *(verify all thresholds — not BTF-mandated numbers, drawn from adjacent osmotherapy literature)*\n- [ ] **ABG for PaCO2** — trend given hyperventilation-avoidance guidance; do not let PaCO2 drift low\n      incidentally on the ventilator\n- [ ] **Brain tissue oxygen monitoring (PbtO2)** considered as an adjunct in select high-acuity centers\n      *(verify local availability/protocol — evidence for PbtO2-guided therapy over ICP/CPP-guided\n      therapy alone remains an active area, not a clear BTF 4th-ed mandate)*\n\n## Management\n\n### Primary/secondary injury prevention (early)\n- [ ] **Avoid hypotension and hypoxia** — these are the dominant secondary-injury drivers; document\n      SBP/SpO2 trend from earliest contact\n- [ ] **ICP monitor placed** if GCS 3–8 with abnormal CT, or normal CT + risk factors (age >40, posturing,\n      SBP <90) *(indication threshold — verify; BTF 4th ed notes insufficient evidence for a graded\n      recommendation on monitoring itself, but treatment-threshold evidence assumes monitoring is in place)*\n- [ ] **CPP monitoring** established alongside ICP\n\n### ICP / CPP management\n- [ ] **Treat ICP >22 mmHg** *(verify — level IIB)*\n- [ ] **Target CPP 60–70 mmHg** *(verify — level IIB)* — avoid aggressive CPP elevation >70 with fluids/pressors (ARDS risk)\n- [ ] **Head of bed 30°**, neutral neck position, avoid jugular venous compression (tight collar/lines)\n- [ ] **Hyperosmolar therapy** used for ICP crisis — mannitol or hypertonic saline *(agent/dose/serum\n      osmolality target — verify; guideline notes insufficient evidence to mandate a specific agent/dose)*\n- [ ] **CSF diversion (EVD)** considered as ICP-lowering measure\n- [ ] **Sedation/analgesia** adequate to blunt ICP surges; avoid untreated pain/agitation\n- [ ] **Avoid prophylactic hyperventilation** — do not target PaCO2 ≤25 mmHg; use only as temporizing\n      measure for acute herniation *(verify)*\n- [ ] **Decompressive craniectomy** — secondary DC (for refractory ICP after medical therapy fails) has a\n      role; **large fronto-temporo-parietal** flap (≥12×15 cm) preferred over smaller; DC for **early**\n      prophylactic use not recommended *(verify criteria/timing)*\n\n### Systemic / medical management\n- [ ] **High-dose corticosteroids CONTRAINDICATED** — do not give (associated with increased mortality)\n- [ ] **Early post-traumatic seizure prophylaxis** (≤7 days) considered — e.g. phenytoin/levetiracetam\n      *(agent/dose — verify)*; **do not continue past 7 days** without a clinical seizure\n- [ ] **Prophylactic hypothermia NOT recommended** for diffuse injury (early, short-duration) *(verify — level IIB)*\n- [ ] **Nutrition** — reach basal caloric replacement by **day 5–7** post-injury *(verify)*\n- [ ] **VTE prophylaxis** — mechanical from admission; pharmacologic timing individualized to bleeding\n      stability *(verify local protocol)*\n- [ ] **Glucose and temperature control** per unit protocol — avoid hyper/hypoglycemia, treat fever\n\n### Multidisciplinary / disposition\n- [ ] **Neurosurgery involved** in monitoring/surgical decisions\n- [ ] **Serial neuro exam / imaging** for evolving lesion or ICP refractoriness\n- [ ] **Goals-of-care discussion** — avoid premature prognostication before adequate resuscitation/sedation washout\n- [ ] **Rehab/PT/OT/speech** evaluation\n\n## Pearls & pitfalls\n- [ ] **Hypocapnia harms** — low PaCO2 causes cerebral vasoconstriction and reduced cerebral blood flow;\n      hypocapnia has been shown to cause harm in a prospective RCT — reserve hyperventilation for acute\n      herniation, not routine ICP control *(verify — [EMCrit IBCC: TBI](https://emcrit.org/ibcc/tbi/))*\n- [ ] **Hypertonic saline over mannitol** favored empirically for acute ICP crisis by several FOAMed\n      sources — e.g. 250–500 mL of 3% saline or 30–60 mL of 23.5% saline; normal saline preferred for\n      general fluid resuscitation over hypotonic fluids *(verify dose/agent —\n      [EMCrit IBCC: TBI](https://emcrit.org/ibcc/tbi/))*\n- [ ] **ICP thresholds need clinical context** — an ICP modestly above threshold in a patient with intact\n      autoregulation and adequate CPP may not need aggressive treatment; don't chase the number in\n      isolation, and don't react to brief coughing-related spikes *(verify —\n      [EMCrit IBCC: ICP management](https://emcrit.org/ibcc/icp/))*\n- [ ] **Zero arterial line at the tragus, not the heart**, when CPP is being used to titrate therapy —\n      zeroing at the heart can overestimate CPP by up to 10 mmHg, risking under-treatment of true\n      hypoperfusion *(verify — [EMCrit IBCC: ICP management](https://emcrit.org/ibcc/icp/))*\n- [ ] **Taper, don't abruptly stop, prolonged hypertonic therapy** — cerebral adaptation to sustained\n      hypernatremia means abrupt sodium normalization risks rebound ICP elevation; wean gradually if\n      hypernatremia has persisted >1–2 days *(verify — [EMCrit IBCC: ICP management](https://emcrit.org/ibcc/icp/))*\n- [ ] **Levetiracetam commonly preferred for seizure prophylaxis** in patients with risk factors\n      (penetrating injury, hematomas, cortical contusions, GCS ≤10); extend beyond the standard 7-day\n      window only if seizure activity occurs, and consider EEG to exclude nonconvulsive seizures\n      confounding the exam *(verify — [EMCrit IBCC: TBI](https://emcrit.org/ibcc/tbi/))*\n- [ ] **Don't declare futility before adequate resuscitation** — fixed pupils plus absent corneal\n      reflexes only support a poor-prognosis discussion once assessed *despite* adequate resuscitation\n      and correction of confounders; premature declaration before that point is a documented pitfall\n      *(verify — [EMCrit IBCC: TBI](https://emcrit.org/ibcc/tbi/))*\n\n## Commonly-missed on documentation (what the gap-check flags)\nHypotension/hypoxia avoidance charted from earliest contact? · ICP threshold (22) + CPP target (60–70)\ndocumented? · hyperventilation NOT used prophylactically? · steroids NOT given? · seizure ppx stopped by\nday 7 without clinical seizure? · DC flap size + timing (secondary, not early-prophylactic) documented?\n· nutrition target by day 5–7 tracked?\n\n*Sources: [Guidelines for the Management of Severe TBI, 4th Edition — Brain Trauma Foundation](https://braintrauma.org/coma/guidelines/severe-tbi) · [Guidelines for Severe TBI, 4th Ed — PubMed](https://pubmed.ncbi.nlm.nih.gov/27654000/) · [2020 Update of the Decompressive Craniectomy Recommendations — PMC](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7426189/) · [EMCrit IBCC: Traumatic Brain Injury](https://emcrit.org/ibcc/tbi/) · [EMCrit IBCC: Intracranial Pressure (ICP) & Cerebral Perfusion Pressure (CPP)](https://emcrit.org/ibcc/icp/)*\n"}, {"file": "teg-interpretation-guide.md", "title": "TEG 6s (Global Hemostasis cartridge) interpretation guide — SICU/CVT quick reference", "system": "Other", "body": "# TEG 6s (Global Hemostasis cartridge) interpretation guide — SICU/CVT quick reference\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline/manufacturer IFU.**\n> Physician verifies before any clinical use. Values marked *(verify)* must be confirmed against the\n> source, your lab's own reference ranges, and local protocol.\n> **Primary sources (parameter/reference-range grounding):** Erdoes G et al., \"Next generation\n> viscoelasticity assays in cardiothoracic surgery: Feasibility of the TEG6s system,\" *PLoS One*\n> 2018;13(12):e0209360 — describes the **CK/CKH/CFF/CRT Global Hemostasis cartridge** in routine clinical\n> use (the cartridge this guide is built around). https://pmc.ncbi.nlm.nih.gov/articles/PMC6301661/\n> Hartmann J et al., \"TEG 6s coagulation testing with a novel heparin neutralization cartridge: Technical\n> validation and determination of normal reference ranges,\" *Am J Clin Pathol* 2025;163(1):12–19 —\n> reference-range study on the **newer 4-channel \"HN\" cartridge** (heparinase on every channel, not just\n> CKH); cited here for the general heparin-neutralization concept only — **its numeric ranges are for a\n> different cartridge and must not be applied directly to CK/CKH/CFF/CRT results** *(verify which\n> cartridge your lab actually runs)*. https://pmc.ncbi.nlm.nih.gov/articles/PMC11775113/\n> **FOAMed pearls layer:** Deranged Physiology (Alex Yartsev), \"Viscoelastic tests of clotting function\n> (TEG and ROTEM)\" — cited explicitly below, expert opinion, not authoritative for numeric cutoffs.\n> https://derangedphysiology.com/main/required-reading/haematology-and-oncology/Chapter-107/viscoelastic-tests-clotting-function-teg-and-rotem\n> **Compiled:** 06-Sep-2026 · Claude Code · built for the **TEG 6s (Haemonetics, cartridge-based)** system\n> — **NOT classic TEG 5000**; numeric ranges and cartridge chemistry differ between the two, confirm\n> which platform your unit's numbers came from before applying anything here *(verify)*\n> **Companion file:** `post-cardiac-surgery-bleeding-sts-sca-2021.md` — this guide is the TEG6s reference\n> for that checklist's coagulopathy workup.\n\n## Why — what viscoelastic testing measures (first principles)\n- TEG measures clot formation **mechanically, in real time, in whole blood** — a pin/cup system tracks the physical resistance a forming clot generates as it develops, strengthens, and eventually breaks down.\n- Because whole blood (not isolated plasma) is used, the tracing reflects the combined, interacting contributions of clotting factors, platelets, fibrinogen, and the fibrinolytic system acting together — the same components that determine hemostasis in vivo.\n- Each phase of the tracing maps to a mechanism: **R time** = time to initial thrombin/fibrin generation (clotting factor activity); **K/angle** = kinetics of clot strengthening (fibrinogen cross-linking); **MA** = maximum clot strength (platelet-fibrin interaction, platelet-dominant); **LY30** = clot breakdown over time (fibrinolysis).\n- This is fundamentally different from static plasma tests (PT/INR, aPTT, fibrinogen level) which test only the plasma clotting cascade in isolation, in a fixed endpoint, with no platelets and no measure of clot strength or lysis.\n- Why this guides **targeted component therapy**: an abnormal segment of the tracing points to the specific deficient component (prolonged R → factor deficiency → FFP; low angle → fibrinogen deficiency → cryoprecipitate; low MA → platelet deficiency/dysfunction → platelets; high LY30 → hyperfibrinolysis → antifibrinolytic/TXA) rather than empiric, undifferentiated transfusion.\n\n## The channels & the numbers (what each means → what corrects it)\nThe **Global Hemostasis cartridge** runs four channels off one blood draw. Only **CKH** contains\nheparinase — that is the one channel purpose-built to \"see through\" heparin.\n\n| Channel (chemistry) | Parameter | Plain English — what it measures | If abnormal → consider *(verify local cutoffs)* |\n|---|---|---|---|\n| **CK** (kaolin) | **R** (reaction time) | Time to the *start* of clot formation — reflects the enzymatic clotting-factor cascade | Prolonged → factor deficiency **if CKH-R is also prolonged** → FFP/PCC. Prolonged on CK alone, normal on CKH → heparin — see ⭐ below |\n| **CK** | **K time & Angle** | How fast the clot builds once it starts — driven mainly by fibrinogen, with early platelet input | Prolonged K / narrow angle → low fibrinogen → cryoprecipitate or fibrinogen concentrate |\n| **CK** | **MA** (maximum amplitude) | Peak clot strength — the combined contribution of platelet number/function **and** fibrinogen | Low → could be platelets, fibrinogen, or both — use CFF-MA below to tell them apart |\n| **CFF** (kaolin + platelet inhibitor, abciximab) | **MA** | Peak clot strength with **platelets pharmacologically blocked** — isolates the fibrinogen contribution | Low CFF-MA → hypofibrinogenemia → cryoprecipitate/fibrinogen concentrate *(verify local trigger, commonly cited ~<1.5–2 g/L)* |\n| — | **Platelet contribution ≈ CK-MA − CFF-MA** | Back-calculates the platelet-specific share of clot strength | Low platelet contribution with a *normal* CFF-MA → thrombocytopenia/platelet dysfunction, not fibrinogen → platelets ± DDAVP *(verify — classic teaching, confirm against your lab's own algorithm)* |\n| **CK** | **LY30** | % of clot lost 30 min after MA — fibrinolysis | Elevated → hyperfibrinolysis → tranexamic acid (TXA) *(verify cutoff, commonly cited low single-digit %)* |\n| **CKH** (kaolin + heparinase) | **R** | Same reaction time as CK-R, but heparin is chemically neutralized in this channel before it runs | **Compare directly to CK-R** — this comparison is the whole point of the channel, see ⭐ below |\n| **CRT** (kaolin + tissue factor) | R / MA | Same information as CK, just tissue-factor-accelerated for a faster turnaround | Used for speed in urgent settings; interpret the same way as CK *(verify local practice for when CRT vs CK is used)* |\n\n## Pattern → interpretation → action\n| Pattern | Interpretation | Action |\n|---|---|---|\n| **CK-R long, CKH-R normal** | Residual/rebound **heparin** effect | **Protamine** — repeat TEG6s to confirm CK-R normalizes toward CKH-R |\n| **CK-R long, CKH-R also long** (no correction) | True **factor deficiency** (or other non-heparin coagulopathy) | **FFP/PCC** — more protamine will not help and risks harm |\n| Narrow CK-angle / low CFF-MA, platelet contribution preserved | **Hypofibrinogenemia** | Cryoprecipitate / fibrinogen concentrate |\n| Low CK-MA, CFF-MA normal (low platelet contribution) | **Thrombocytopenia / platelet dysfunction** | Platelets ± DDAVP if known-responsive dysfunction |\n| High CK-LY30 | **Hyperfibrinolysis** | TXA |\n| Panel roughly normal but patient still oozing diffusely | Not a TEG-detectable defect — check **Ca / temperature / pH**, or reconsider a **surgical** source | See `post-cardiac-surgery-bleeding-sts-sca-2021.md` |\n\n## ⭐ Heparin effect vs NO heparin effect — the CK vs CKH comparison\nThis is the single most useful thing the Global Hemostasis cartridge does for a post-CPB/CVT patient:\nit runs a plain kaolin channel (**CK**) alongside a heparinase-treated channel (**CKH**) on the *same*\nblood draw, automatically, every time.\n\n- **If R is prolonged on CK but CORRECTS (normalizes) on CKH** → the prolongation was caused by\n  **residual heparin** sitting in the sample → treat with **protamine**, not more factor product.\n- **If R is prolonged on BOTH CK and CKH (no correction)** → heparin is not the explanation → this is a\n  **true factor deficiency** (or another coagulopathy) → treat with **FFP/PCC**, and giving more\n  protamine will not fix it (and can itself worsen bleeding/be harmful in excess — see companion file's\n  Pearls).\n\n**Worked example** *(illustrative numbers only — verify your lab's actual reference range before using\nclinically)*:\n\n```\nHeparin effect (protamine will fix this):\n  CK-R  : |───────────── 12 min (prolonged) ─────────────|\n  CKH-R : |───── 6 min (normal) ─────|\n  → heparinase channel corrects → residual heparin → give protamine\n\nTrue factor deficiency (protamine will NOT fix this):\n  CK-R  : |───────────── 12 min (prolonged) ─────────────|\n  CKH-R : |───────────── 11 min (still prolonged) ────────────|\n  → no correction with heparinase → true deficiency → give FFP/PCC\n```\n\nThis matters most in exactly the setting this file exists for: a **post-CPB cardiac surgery patient**\noozing in the SICU, where \"did we not give enough protamine\" and \"is this a real coagulopathy\" look\nidentical on a standard coag panel but are treated completely differently — the CK-vs-CKH comparison is\nwhat separates them in minutes, at the bedside, without waiting on a send-out fibrinogen/factor panel.\n\n## Pearls & pitfalls\n*(FOAMed practice tips — Deranged Physiology — expert opinion/practice, NOT directives; verify against local protocol)*\n- **TEG6s and TEG5000 numbers are not interchangeable** — different cartridge chemistry and reference\n  ranges; confirm which platform generated the value you're looking at before comparing to any printed\n  \"normal range\" (Deranged Physiology, Ch. 107) *(verify)*\n- **Correlate clinically, always** — cited meta-analyses report wide precision limits for viscoelastic\n  testing generally (coefficients of variance roughly 7–40% for TEG per Deranged Physiology's review);\n  a single borderline parameter is not a reason to transfuse a patient who looks clinically fine, nor a\n  reason to withhold product from one who is actively bleeding (Deranged Physiology, Ch. 107) *(verify)*\n- **The sample is warmed to 37°C to run** — in a hypothermic patient, the trace will look better than\n  their true in-vivo coagulation status; rewarm the patient, don't just rewarm your interpretation of\n  the number (Deranged Physiology, Ch. 107)\n- **TEG is not a substitute for surgical control** — a brisk, localized, surgical-pattern bleed needs the\n  OR regardless of what the trace shows; a \"reassuring\" TEG does not rule out a technical bleeding source\n  (Deranged Physiology, Ch. 107 general teaching, applied to the surgical-bleeding context)\n- **MA reflects both platelets and fibrinogen together** — don't reflexively transfuse platelets for a\n  low CK-MA without checking CFF-MA first; you may be treating a fibrinogen problem with the wrong product\n  (parameter relationship per the CK/CFF channel design, Erdoes 2018)\n- **During full heparinization (on-pump), most CK/CRT/CFF channels won't run at all** — only the\n  heparinase (CKH) channel typically reports a usable result during active CPB; don't expect a full panel\n  until after heparin is reversed (Erdoes 2018) *(verify against your lab's reporting)*\n- **Hyperfibrinolysis can be missed if LY30 isn't specifically checked** — a normal-looking R/K/Angle/MA\n  does not exclude fibrinolysis; scan LY30 on every trace in a bleeding post-CPB patient before assuming\n  the panel is unremarkable (general TEG teaching — verify local cutoff)\n\n*Sources: [Next generation viscoelasticity assays in cardiothoracic surgery: Feasibility of the TEG6s system — Erdoes et al., PLoS One 2018 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC6301661/) · [TEG 6s coagulation testing with a novel heparin neutralization cartridge: Technical validation and determination of normal reference ranges — Hartmann et al., Am J Clin Pathol 2025 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC11775113/) · [Deranged Physiology — Viscoelastic tests of clotting function (TEG and ROTEM)](https://derangedphysiology.com/main/required-reading/haematology-and-oncology/Chapter-107/viscoelastic-tests-clotting-function-teg-and-rotem)*\n"}, {"file": "thyroid-storm-myxedema-coma-joint-consensus-2026.md", "title": "Thyroid storm & myxedema coma", "system": "Renal / Metabolic / Endo", "body": "# Thyroid storm & myxedema coma — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Sources:** Management of thyroid emergencies: joint consensus statement on management of thyroid storm\n> (Society for Endocrinology / British Thyroid Association / European Thyroid Association), *European\n> Thyroid Journal* 2026; Management of endocrine emergencies: joint consensus statement for management of\n> myxoedema coma, *European Thyroid Journal* 2026.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2026 (both are recently-published joint\n> consensus statements — confirm no subsequent erratum/update)\n\n## Why — physiology / first principles\n- **Thyroid storm**: extreme excess of free thyroid hormone *action* (not necessarily the highest T4 level — reduced protein binding and heightened receptor/catecholamine sensitivity during physiologic stress matter as much) → hypermetabolic state with potentiated catecholamine sensitivity → hyperthermia, tachyarrhythmia, and progression from high-output to decompensated cardiac failure.\n- Rationale for the sequenced blockade: thionamide first (blocks new hormone synthesis), iodine only **after** the thionamide is on board (iodine given first can paradoxically fuel synthesis — Jod-Basedow — before the gland is blocked), beta-blockade (blunts peripheral catecholamine potentiation and reduces T4→T3 conversion), and steroids (further reduce T4→T3 conversion and cover possible relative adrenal insufficiency).\n- **Myxedema coma**: severe hypothyroidism → globally reduced metabolic rate, blunted respiratory drive, impaired thermogenesis, and reduced cardiac output → hypothermia, hypoventilation/CO2 retention, hypotension, and altered mentation.\n- Rationale for empiric IV levothyroxine ± T3 and stress-dose steroids before biochemical confirmation: profound decompensation is often fatal, and unmasking coexisting adrenal insufficiency with thyroid hormone alone can precipitate crisis.\n\n## Diagnosis / definition\n\n### Thyroid storm\n- [ ] **Clinical diagnosis** — thyroid storm cannot be confirmed or excluded on lab values alone; there is no\n  cut-off free T3/free T4 level that mandates treatment, and decision to treat rests on severity of the\n  clinical picture *(verify — reinforced across multiple FOAMed sources, consistent with guideline framing)*\n- [ ] **Burch-Wartofsky Point Scale** (or JTA/JES criteria) calculated: **<25** unlikely, **25–44** impending crisis, **≥45** highly suggestive of storm *(verify score components — thermoregulatory, CNS, GI/hepatic, cardiovascular, precipitant history)*\n- [ ] Precipitant sought and treated (infection, surgery, iodine load, DKA, parturition, medication non-adherence)\n- [ ] Managed in HDU/ICU with multidisciplinary (endocrine + critical care) input\n\n### Myxedema coma\n- [ ] **Also a clinical diagnosis** — defined by decreased level of consciousness, defective thermoregulation\n  (hypothermia), and cardiovascular collapse/decompensation in the setting of hypothyroidism; biochemistry\n  supports but does not solely define it *(verify)*\n- [ ] Popoveniuc (or equivalent) diagnostic score applied — thermoregulatory, CNS, GI, cardiovascular, precipitant, metabolic domains; **score ≥60 highly suggestive**, **45–59 possible**, **<45 unlikely** *(verify score bands)*\n- [ ] Precipitant identified (infection, cold exposure, sedatives/opioids, non-adherence, stroke, MI)\n- [ ] Managed in HDU/ICU\n\n## Key labs & workup\n- [ ] **TSH + free T4 + free T3** sent in both conditions — but treatment decision is driven by clinical\n  severity/scoring, not a specific hormone cut-off; do not delay empiric treatment awaiting results\n- [ ] Storm: cortisol (relative adrenal insufficiency may coexist), glucose, electrolytes, LFTs (hepatic\n  dysfunction is a Burch-Wartofsky domain), blood cultures/infectious workup per suspected precipitant\n- [ ] Myxedema coma: **random cortisol / cosyntropin (ACTH stim) test** sent before or concurrent with\n  starting steroids, to allow later discontinuation once adrenal axis cleared — do not wait for the result\n  to start empiric hydrocortisone\n- [ ] Myxedema coma: glucose (hypoglycemia common), sodium (hyponatremia common — manage per hyponatremia\n  protocol, avoid overcorrection), ABG/CO₂ (hypoventilation/CO₂ retention), ECG\n- [ ] Both: search for the precipitating illness explicitly, since blunted physiological responses (fever,\n  tachycardia) can mask a serious underlying process such as sepsis in myxedema coma\n\n## Management\n\n### Thyroid storm — treatment (strict order matters)\n- [ ] **Beta-blockade** first/early — e.g. **propranolol 40–80 mg PO q4–6h** (or IV titrated) for rate control and to reduce peripheral T4→T3 conversion *(verify dose; caution in decompensated heart failure)*\n- [ ] **High-dose thionamide**: **PTU load 500–1000 mg then 250 mg q4h** OR **methimazole 20 mg q4–6h** *(verify — PTU preferred in first trimester/thyroid storm per some protocols for its additional T4→T3 blockade; max PTU ~1600 mg/day)*\n- [ ] **Iodine solution (SSKI/Lugol's) started ≥1 h AFTER thionamide** — never before, to avoid fueling new hormone synthesis *(verify timing/dose)*\n- [ ] **Glucocorticoids** (e.g. hydrocortisone) — blocks T4→T3 conversion and covers possible relative adrenal insufficiency *(verify dose)*\n- [ ] Supportive care: aggressive cooling for hyperthermia, fluid/electrolyte correction, treat precipitant, avoid aspirin (displaces thyroid hormone from binding protein)\n- [ ] Definitive therapy (radioiodine/surgery) planned once stabilized, not during acute crisis\n\n### Myxedema coma — treatment\n- [ ] **Stress-dose hydrocortisone given BEFORE or WITH levothyroxine** (e.g. **100 mg IV bolus then ~50 mg q6h or ~200 mg/24h infusion**) to cover possible coexisting adrenal insufficiency *(verify dose — never give thyroid hormone alone first)*\n- [ ] **IV levothyroxine loading**: **200–400 mcg** in average adult; **lower end (100–200 mcg)** if elderly/small/cardiac risk *(verify — reduce IV dose to ~75% of oral equivalent)*\n- [ ] Maintenance **levothyroxine ~1.6 mcg/kg/day IV**, transitioning to oral once conscious/absorbing *(verify)*\n- [ ] Liothyronine (T3) addition considered only if no improvement by ~24 h, small doses, caution in cardiac disease *(verify dose ~2.5–10 mcg q8h)*\n- [ ] Passive warming only — **avoid active/rapid external rewarming** (risk of vasodilation/cardiovascular collapse)\n- [ ] Correct hypoglycemia, hyponatremia (per hyponatremia protocol — avoid overcorrection), and hypoventilation; anticipate need for mechanical ventilation\n- [ ] Empiric broad-spectrum antibiotics considered until infection excluded (blunted febrile response can mask sepsis)\n- [ ] Discontinue stress steroids once adrenal axis cleared (random cortisol/cosyntropin test), not before\n\n## Pearls & pitfalls\n- **Treat the patient, not a lab value** — both storm and myxedema coma are clinical diagnoses; a patient who\n  looks like they're in crisis should be treated as such even if free T3/T4 aren't dramatically abnormal, and\n  conversely a frightening thyroid panel alone doesn't mandate crisis-level treatment without the clinical\n  picture *(LITFL — Thyroid Storm CCC / Myxoedema Coma CCC)*\n- **Order fixed for thyroid storm: beta-blocker → thionamide → iodine (≥1 h later) → steroids** — giving\n  iodine before the thionamide is a classic, guideline-emphasized error that can fuel new hormone synthesis\n  (Wolff-Chaikoff escape) and worsen the crisis *(LITFL — Thyroid Storm CCC)*\n- **PTU is often favored over methimazole in true storm** because, beyond blocking new hormone synthesis, it\n  also inhibits peripheral T4→T3 conversion — an extra mechanism methimazole lacks *(LITFL — Thyroid Storm\n  CCC; Maimonides EM — Thyroid Emergencies)*\n- **Never give thyroid hormone before steroids in myxedema coma** — an undiagnosed coexisting adrenal\n  insufficiency can be unmasked/precipitated into adrenal crisis if levothyroxine ramps up metabolism before\n  glucocorticoid cover is on board; steroids go first or simultaneously, never after *(LITFL — Myxoedema\n  Coma CCC; Deranged Physiology — Myxoedema coma)*\n- **Active rewarming is a trap** — a hypothermic myxedema coma patient looks like they need warming blankets\n  and rewarming devices, but rapid external rewarming causes peripheral vasodilation that can precipitate\n  cardiovascular collapse in a patient with impaired cardiac reserve; passive warming only *(LITFL — Myxoedema\n  Coma CCC)*\n- **A normal or low temperature does not rule out infection** — the blunted febrile response in\n  hypothyroidism/myxedema coma can hide sepsis as the precipitant; maintain a low threshold for empiric\n  antibiotics while cultures are pending *(LITFL — Myxoedema Coma CCC)*\n- **Both conditions \"travel in pairs\" with another emergency** — thyroid storm and myxedema coma are\n  frequently precipitated by (and co-managed alongside) a second acute process, most often sepsis/infection;\n  actively hunting for and treating that precipitant is as important as the thyroid-directed therapy itself\n  *(Maimonides EM — Thyroid Emergencies)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nStorm: score calculated + documented? · iodine given AFTER (not before/with) thionamide? · precipitant named? ·\nMyxedema coma: steroids given before/with levothyroxine (never after)? · active rewarming avoided? · infection covered empirically despite normal temp?\n\n*Sources: [Management of thyroid emergencies: joint consensus statement on management of thyroid storm — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC13506520/) · [Management of endocrine emergencies: joint consensus statement for management of myxoedema coma — PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC13452032/) · [2016 ATA Guidelines for Diagnosis and Management of Hyperthyroidism and Other Causes of Thyrotoxicosis — PubMed](https://pubmed.ncbi.nlm.nih.gov/27521067/) · [Thyroid Storm — LITFL CCC Endocrine](https://litfl.com/thyroid-storm/) · [Myxoedema Coma — LITFL CCC Endocrine](https://litfl.com/myxoedema-coma/) · [Myxoedema coma — Deranged Physiology](https://derangedphysiology.com/main/required-reading/endocrine-intensive-care/Chapter-225/myxoedema-coma) · [Thyroid Emergencies — Maimonides Emergency Medicine Residency](https://www.maimonidesem.org/blog/thyroid-emergencies-1)*\n"}, {"file": "toxic-ingestion-overdose-general-2024.md", "title": "Toxic ingestion / overdose (general ICU approach)", "system": "Other", "body": "# Toxic ingestion / overdose (general ICU approach) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** No single binding \"guideline\" governs the undifferentiated poisoned patient; this checklist\n> follows the general standard-of-care framework endorsed by clinical toxicology consensus (AACT/EAPCCT\n> position statements on decontamination) and the general-approach literature (e.g. \"Approach to the\n> Poisoned Patient,\" *Emerg Med Clin North Am* / PMC reviews; Indian Society of Critical Care Medicine\n> Position Statement on poisoning in the ED/ICU). **Confirm against local poison-control protocol and\n> your regional Poison Control Centre before acting.**\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC10334441/ · https://pmc.ncbi.nlm.nih.gov/articles/PMC11369925/\n> **Compiled:** 06-Sep-2026 · Claude Code · general standard-of-care — confirm against local protocol\n\n## Why — physiology / first principles\n- Toxin kinetics (absorption, distribution, protein binding, elimination route) determine which interventions can work at all — decontamination (e.g. activated charcoal) only helps while toxin remains unabsorbed in the gut lumen.\n- Specific antidotes work by directly opposing the toxin's mechanism (e.g. naloxone = competitive opioid-receptor antagonism; N-acetylcysteine replenishes glutathione consumed by the toxic acetaminophen metabolite NAPQI) — most toxins have no such antidote.\n- Enhanced elimination (hemodialysis) is only effective for toxins with small volume of distribution, low protein binding, and water solubility — it cannot remove highly protein-bound or lipophilic/large-Vd toxins regardless of blood level.\n- Why supportive care (ABCs) is the default: since most ingestions lack a specific antidote, organ support (airway protection, hemodynamic support, seizure control) is what actually bridges the patient to the toxin's own metabolic clearance.\n\n## Immediate stabilization (\"treat the patient, not the toxin\")\n- [ ] **Airway/breathing/circulation first** — continuous cardiac + pulse oximetry monitoring; secure airway if reduced consciousness/risk of aspiration\n- [ ] **Point-of-care glucose** — treat hypoglycemia empirically if altered mental status\n- [ ] **Core temperature** — screen for hyper/hypothermia from the toxin or environment\n- [ ] **12-lead ECG** — screen for QRS/QTc prolongation (sodium-channel/potassium-channel toxicity)\n- [ ] **Call regional Poison Control / Toxicology** early — do this on every significant ingestion, not just unusual ones\n\n## Diagnosis / definition\n- [ ] **Obtain collateral history** — agent(s), quantity, time of ingestion, co-ingestants, intent (self-harm screen)\n- [ ] **Toxidrome recognition** to guide empiric management pending confirmation — *(verify exact feature lists against local reference)*:\n  - **Anticholinergic**: mydriasis, dry/flushed skin, tachycardia, urinary retention, delirium (\"hot as a hare, dry as a bone, red as a beet, mad as a hatter\")\n  - **Cholinergic**: SLUDGE (salivation/lacrimation/urination/diarrhea/GI upset/emesis), miosis, bradycardia, bronchorrhea\n  - **Sympathomimetic**: mydriasis, diaphoresis, tachycardia, hypertension, agitation\n  - **Opioid**: miosis, respiratory depression, decreased level of consciousness\n  - **Sedative-hypnotic**: CNS/respiratory depression, normal pupils, often without the bradycardia of opioid toxidrome\n  - **Serotonergic**: clonus, hyperreflexia, hyperthermia, agitation\n- [ ] No single \"diagnostic criterion\" governs undifferentiated poisoning — **diagnosis is clinical (toxidrome + history) and confirmed/refined by targeted labs** (see Key labs & workup)\n\n## Key labs & workup\n- [ ] **Acetaminophen + salicylate levels** on essentially all intentional overdoses (often clinically silent early), plus **agent-specific levels** where relevant and available\n- [ ] **VBG/ABG, electrolytes, creatinine**\n- [ ] **Anion gap and osmolar gap** calculated — differential for a widened gap includes toxic alcohols, salicylates, metformin-associated lactic acidosis; a normal osmolar gap does **not** exclude toxic alcohol ingestion (can normalize as parent alcohol is metabolized) — *(verify calculation/local reference ranges)*\n- [ ] **12-lead ECG** for QRS/QTc screening — cross-ref Immediate stabilization; repeat serially per agent kinetics (see Ongoing ICU management)\n\n## Management\n\n### Decontamination & elimination — judicious, not routine\n- [ ] **Activated charcoal** only if within the appropriate window post-ingestion, airway protected, and agent is charcoal-adsorbable — **not routine for every overdose** — *verify agent-specific eligibility with poison control*\n- [ ] **Whole-bowel irrigation** only for specific agents (e.g. sustained-release preparations, iron, body packers) — *verify indication*\n- [ ] **Avoid ipecac** — not part of modern management\n- [ ] **Enhanced elimination** (multi-dose charcoal, alkalinization, hemodialysis) only for specific toxins with known indication — *verify per agent with toxicology*\n\n### Antidotes & specific therapy\n- [ ] **Administer specific antidote as early as possible** wherever indicated (e.g. N-acetylcysteine for acetaminophen, naloxone for opioids, flumazenil rarely/with caution for benzodiazepines, sodium bicarbonate for TCA/sodium-channel blockade, fomepizole for toxic alcohols, hydroxocobalamin for cyanide) — <agent/dose per toxin — verify>\n- [ ] **Confirm antidote availability/stocking** and dosing weight-based where applicable\n\n### Ongoing ICU management & disposition\n- [ ] **Serial reassessment** — repeat levels/ECG as appropriate for the specific agent's kinetics (e.g. repeat acetaminophen level, serial ECGs for cardiotoxic agents)\n- [ ] **Monitor for delayed toxicity** specific to the agent (e.g. delayed hepatotoxicity, delayed cardiotoxicity) before declaring safe for step-down\n- [ ] **Psychiatric evaluation** before discharge for any intentional ingestion — do not omit because \"medically cleared\"\n- [ ] **Document disposition plan and safety plan** explicitly\n\n## Pearls & pitfalls\n- [ ] **Charcoal's \"1–2 h window\" is a floor, not a hard cutoff** — co-ingestants that slow gastric motility (opioids, anticholinergics) or sustained-release formulations can extend eligibility well beyond 2 h; don't reflexively dismiss charcoal on time alone — *(verify agent-specific eligibility)* — IBCC (EMCrit)\n- [ ] **GCS ≤8 is NOT an automatic intubation trigger in poisoning** — the \"GCS <8, intubate\" dogma is outdated for intoxicated patients; assess actual airway-protective reflexes (swallow, secretion handling, cough) rather than the number alone — IBCC (EMCrit)\n- [ ] **Bicarbonate response can be diagnostic, not just therapeutic**, in suspected sodium-channel blockade — QRS narrowing after a hypertonic bicarbonate bolus supports the diagnosis and can guide further dosing — *(verify QRS target, e.g. <100 ms)* — IBCC (EMCrit)\n- [ ] **Avoid phenytoin for toxicological seizures** — its class Ib antiarrhythmic activity can worsen sodium-channel-blocker toxicity; favor benzodiazepines/phenobarbital — IBCC (EMCrit)\n- [ ] **TCA and other rapidly-progressive ingestions can deteriorate suddenly** — a reasonably alert patient can crash quickly; consider earlier airway control than usual in these agents rather than waiting for overt decompensation — IBCC (EMCrit)\n- [ ] **Urine toxicology screens frequently mislead** — prescription drugs cause false positives and results reflect past, not necessarily acute, exposure; they add little over careful toxidrome-based clinical assessment and should rarely change acute management — IBCC (EMCrit)\n\n## Commonly-missed on documentation (what the gap-check flags)\nPoison control/toxicology contacted? · acetaminophen + salicylate levels sent on intentional overdose? · ECG reviewed for QRS/QTc? ·\nantidote considered and timing documented? · decontamination decision justified (not reflexive charcoal)? ·\npsychiatric evaluation arranged before discharge? · delayed-toxicity monitoring plan stated?\n\n*Sources: [Approach to the Poisoned Patient (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC10334441/) · [ISCCM Position Statement: Approach to Poisoning in ED/ICU (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC11369925/) · [Emergency Management of Poisoning (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC7315350/) · FOAMed pearls: [IBCC — Approach to the Poisoned Patient (EMCrit)](https://emcrit.org/ibcc/tox/)*\n"}, {"file": "trauma-hemorrhagic-shock-eutg-2023.md", "title": "Major trauma / hemorrhagic shock (massive transfusion)", "system": "Other", "body": "# Major trauma / hemorrhagic shock (massive transfusion) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** The European Guideline on Management of Major Bleeding and Coagulopathy Following Trauma:\n> Sixth Edition (Rossaint R et al.), *Critical Care* 2023;27:80. Structure consistent with ATLS\n> (American College of Surgeons Committee on Trauma) principles.\n> https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2023 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Blood loss reduces venous return/preload → reduced cardiac output; compensatory tachycardia and peripheral vasoconstriction maintain blood pressure until compensation fails (roughly 30–40% volume loss) *(verify)* — meaning normal vitals early do **not** exclude significant hemorrhage.\n- Ongoing hypoperfusion forces anaerobic metabolism → lactic acidosis, which — together with hypothermia (exposure, cold resuscitation fluids) and hemodilution/consumption of clotting factors — impairs the enzymatic clotting cascade (the \"lethal triad\"); tissue hypoperfusion itself also directly activates protein C, contributing to acute trauma-induced coagulopathy independent of dilution.\n- Each element of the triad worsens the others (acidosis → impaired clotting → more bleeding → more hypothermia/acidosis), a self-amplifying cycle unless interrupted.\n- Why **permissive hypotension**/damage-control resuscitation until hemorrhage is controlled: avoids \"popping the clot\" and diluting clotting factors with excess crystalloid.\n- Why balanced blood-product ratios (~1:1:1 RBC:FFP:platelets) rather than crystalloid-heavy resuscitation: replaces what was actually lost and avoids dilutional coagulopathy.\n- Why prevent hypothermia and correct acidosis, and give TXA early: enzymatic clotting factors function poorly when cold/acidotic, and TXA counters the hyperfibrinolysis that compounds bleeding.\n\n## Diagnosis / definition\n- [ ] **Classes of hemorrhagic shock (ATLS framework)** — used to anchor severity, though blood-loss estimates are imprecise clinically: **Class I** (<15% blood loss, minimal vital-sign change); **Class II** (~15–30%, tachycardia, narrowed pulse pressure); **Class III** (~30–40%, hypotension, tachypnea, altered mentation); **Class IV** (>40%, profound hypotension, near-pulseless) — *(verify exact % and vital-sign thresholds against current ATLS source)*\n- [ ] **Shock index (HR/SBP) >0.9–1.0** supports significant occult hemorrhage even with a \"normal\" isolated SBP — *(verify local cutoff)*\n- [ ] **Vital signs alone are insensitive and late**, especially in young/fit patients whose physiologic reserve masks early compensated shock — do not be falsely reassured by normal vitals early\n\n## Key labs & workup\n- [ ] **Serial lactate and base deficit** — more sensitive early markers of occult hypoperfusion than vital signs; trend, don't single-point\n- [ ] **Hemoglobin/hematocrit trend** — can be falsely reassuring immediately post-hemorrhage before hemodilution/equilibration; a normal early Hb does not exclude major blood loss\n- [ ] **Viscoelastic testing (TEG/ROTEM)** where available — cross-ref Coagulopathy management below\n- [ ] **Coagulation panel** (PT/INR, fibrinogen) and **ionized calcium** — cross-ref Coagulopathy management below\n- [ ] **Arterial/venous blood gas**\n- [ ] **FAST exam / CT** per hemodynamic stability and mechanism\n\n## Primary survey — <C>ABCDE\n- [ ] **<C> — catastrophic/critical external bleeding controlled first**: direct pressure, tourniquet, hemostatic dressing — before proceeding to standard ABCDE\n- [ ] **Airway, Breathing, Circulation, Disability, Exposure** per ATLS sequence\n- [ ] **Rapid transport to an appropriate trauma center** without delay for non-essential interventions\n- [ ] Use **shock index / narrow pulse pressure** to help flag occult hemorrhage — *verify local thresholds*\n\n## Management\n\n### Resuscitation strategy\n- [ ] **Permissive hypotension** until hemorrhage controlled — target **SBP ~80–90 mmHg / MAP ~50–60 mmHg** — <verify> — **except** with suspected severe TBI, where higher MAP is targeted to preserve cerebral perfusion (**≥80 mmHg — verify**)\n- [ ] **Minimize crystalloid**; prioritize **blood products** early in significant hemorrhage\n- [ ] **Activate massive transfusion protocol** early if ongoing major bleeding — balanced ratio of **RBC:plasma:platelets** (commonly cited **~1:1:1** — verify local MTP ratio)\n- [ ] **Hemoglobin target 70–90 g/L** during active management — *verify*\n\n### Coagulopathy management\n- [ ] **Tranexamic acid** as early as possible, **within 3 hours of injury** — <1 g bolus then 1 g over 8 h — verify local dosing/protocol>\n- [ ] **Viscoelastic testing (TEG/ROTEM)** where available to guide targeted product replacement, alongside PT/INR, fibrinogen, platelets\n- [ ] **Fibrinogen/cryoprecipitate replacement** if fibrinogen low (Clauss <1.5–2.0 g/L associated with worse outcomes — *verify local trigger*)\n- [ ] **Calcium replacement** — correct ionized hypocalcemia during massive transfusion (citrate toxicity) — *verify target/monitoring frequency*\n- [ ] **Reverse anticoagulants/antiplatelets** promptly if patient was on them (specific reversal agent per drug) — *verify per agent*\n\n### Adjuncts & ongoing ICU care\n- [ ] **Prevent/treat the lethal triad** — actively manage **hypothermia** (target normothermia 36–37°C), **acidosis**, and **coagulopathy** together\n- [ ] **Damage-control surgery** considered early if shock, ongoing bleeding, coagulopathy, or hypothermia/acidosis present\n- [ ] **Serial reassessment** of hemorrhage control, coagulation status, and end-organ perfusion (lactate clearance)\n- [ ] **VTE prophylaxis** timing revisited once hemostasis secured\n\n## Pearls & pitfalls\n- [ ] **Give calcium proactively, not reactively, during MTP** — citrate in blood products chelates calcium during rapid infusion; consider **~1–2 g CaCl₂ (or 3–6 g calcium gluconate) per MTP round (~6 PRBC units)**, targeting ionized calcium roughl
