y **1.0–1.3 mmol/L** — *(verify dose/target/monitoring frequency locally)* — IBCC (EMCrit)\n- [ ] **TXA's benefit is time-critical** — the evidence base is for **early traumatic hemorrhage, <3 h post-injury**; the guideline's <3 h rule (already in this checklist) reflects this — don't extrapolate the same confidence to non-trauma bleeding (e.g. GI hemorrhage), where TXA evidence is more contested — IBCC (EMCrit)\n- [ ] **Permissive hypotension has real limits** — target **MAP ~50–60 mmHg** until hemostasis, but over-correct with caution: excess pressure/volume risks dislodging early clot and worsening venous-source bleeding; the TBI exception (higher MAP target) already in this checklist is the main carve-out — IBCC (EMCrit)\n- [ ] **Crystalloid dilutes more than it resuscitates** — early crystalloid loading dilutes coagulation factors and red cell mass, undermining the coagulopathy-prevention goal of balanced-ratio transfusion — reinforces the \"minimize crystalloid\" bullet above — IBCC (EMCrit)\n- [ ] **Fixed transfusion ratios (e.g. ~1:1:1) are a starting point, not a destination** — used empirically because lab-guided dosing lags behind real-time bleeding (\"by the time labs return, they're already obsolete\"); adjust for known pre-existing coagulopathy (e.g. anticoagulant use, baseline low fibrinogen) rather than following the ratio blindly — IBCC (EMCrit)\n- [ ] **Fibrinogen is often the first factor to critically drop** in major hemorrhage — consider an early, proactive fibrinogen/cryoprecipitate replacement threshold rather than waiting for it to fall further, particularly in obstetric hemorrhage — cross-ref Coagulopathy management above — *(verify local trigger)* — IBCC (EMCrit)\n\n## Commonly-missed on documentation (what the gap-check flags)\nCatastrophic bleeding addressed before rest of primary survey? · TXA given within 3 h of injury? · MTP ratio documented? ·\nviscoelastic/coagulation panel trending? · calcium monitored/corrected during MTP? · temperature actively managed? ·\npermissive-hypotension target individualized for TBI status?\n\n*Sources: [European guideline on major bleeding & coagulopathy following trauma, 6th edition — Critical Care 2023 (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/) · FOAMed pearls: [IBCC — Massive Transfusion Protocol (EMCrit)](https://emcrit.org/ibcc/mtp/)*\n"}, {"file": "tumor-lysis-syndrome-bsh-2025.md", "title": "Tumor lysis syndrome", "system": "Renal / Metabolic / Endo", "body": "# Tumor lysis syndrome — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** British Society for Haematology updated guidelines for the diagnosis and management of\n> tumour lysis syndrome in adults and children with haematological malignancies: a focus on patient\n> safety (Chan YLT, El-Sharkawi D, Shah P, Chanouzas D, O'Connor D, Marks SD, Jones G, et al., on\n> behalf of the BSH Committee), *British Journal of Haematology* 2025;207(4):1248–1258\n> (doi:10.1111/bjh.70092).\n> https://pubmed.ncbi.nlm.nih.gov/40903841/\n> **Replaces** the 2015 BCSH guideline (previous file, archived). The **Cairo-Bishop diagnostic\n> criteria are unchanged**; what's new is **risk stratification** (novel targeted/immunotherapy agents\n> now recognized as raising TLS risk in diseases previously considered low-risk), an explicit\n> **fixed-dose rasburicase prophylaxis regimen**, and a **patient-safety focus** driven by an NHS\n> England analysis of medication-delay incidents.\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2025 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Rapid lysis of malignant cells (spontaneous, or after cytotoxic therapy in high-turnover tumors) releases massive intracellular contents — K, phosphate, and nucleic acids — all at once.\n- Nucleic acids are catabolized to uric acid, which is poorly soluble and precipitates in the acidic distal renal tubule → AKI; hyperphosphatemia independently drives calcium-phosphate precipitation → secondary hypocalcemia and further nephron deposition.\n- The resulting AKI reduces clearance of K, phosphate, and urate — a self-amplifying cycle where the metabolic derangement worsens the kidney injury that would otherwise clear it.\n- Rationale for risk-stratified **prophylaxis before** cytoreduction begins (rasburicase/allopurinol to lower the uric acid burden pre-emptively, aggressive hydration to maintain tubular flow and dilute concentration) rather than treating established TLS.\n- Rationale for correcting symptomatic hypocalcemia cautiously rather than to a normal level: raising Ca can worsen calcium-phosphate precipitation while phosphate remains high.\n\n## Diagnosis / definition\n\n### Cairo-Bishop criteria (unchanged in 2025 update)\n- [ ] **Laboratory TLS**: ≥2 of the following within the same 24 h period, 3 days before to 7 days after cytotoxic therapy —\n  - [ ] Uric acid **≥476 µmol/L (8 mg/dL)** or **≥25% rise** from baseline *(verify)*\n  - [ ] Potassium **≥6.0 mmol/L** or **≥25% rise** from baseline *(verify)*\n  - [ ] Phosphate **≥1.45 mmol/L (adult)** or **≥25% rise** from baseline *(verify — pediatric threshold differs, ≥2.1 mmol/L)*\n  - [ ] Calcium **≤1.75 mmol/L** or **≥25% fall** from baseline *(verify)*\n- [ ] **Clinical TLS** = Laboratory TLS **+ one of**: AKI/rising creatinine, cardiac arrhythmia, seizure, or death — document explicitly which criterion is met\n\n### Risk stratification — updated for novel therapies (2025)\n- [ ] Risk category assigned — **low / intermediate / high** — **individualized**, incorporating\n  disease-specific *and* patient-specific factors (tumor burden is the principal driver across\n  disease types), not read off the old tumor-type table alone *(verify against current disease-specific\n  risk tables — e.g. Burkitt/ALL high risk, indolent lymphoma low risk)*\n- [ ] **Novel targeted/immunotherapy agents** (e.g. venetoclax, CAR-T, other high tumor-lytic-potential\n  agents) explicitly considered — these can push a disease previously deemed low-risk into\n  intermediate/high risk *(verify agent-specific risk against local protocol — this is the main\n  substantive change from 2015)*\n- [ ] Risk category documented in the chart **before chemotherapy/SACT start**, not retrospectively\n- [ ] Baseline tumor-type risk framework recognized as approximate — general teaching bands risk as\n  roughly **<1% (low)**, **1–5% (intermediate)**, **>5% (high)** by disease/agent, individualized further\n  by tumor burden and renal function *(verify — not a BSH-specific numeric cutoff, cross-check local table)*\n\n## Key labs & workup\n- [ ] **Uric acid, potassium, phosphate, calcium, creatinine** form the core TLS panel — all sent at\n  baseline before SACT starts and repeated at risk-adjusted intervals\n- [ ] Monitoring frequency scaled to risk category — general teaching: **low risk** daily, **intermediate\n  risk** ~q12h, **high risk** ~q6–8h during the at-risk window (typically the first 24–72 h after\n  cytoreductive therapy) *(verify interval per local protocol and BSH risk table)*\n- [ ] **LDH** and lactate as adjunct markers of tumor bulk/turnover where relevant *(verify utility —\n  not a Cairo-Bishop criterion itself)*\n- [ ] **G6PD status** checked before any rasburicase dose (screen first — contraindicated in deficiency)\n- [ ] Volume status/urine output tracked as part of the workup, since oliguria changes both risk and\n  the finding threshold for \"clinical TLS via AKI\"\n- [ ] ECG/cardiac monitoring status documented while potassium or calcium is deranged\n\n## Management\n\n### Prevention (before/during cytotoxic therapy)\n- [ ] **IV hydration** started prior to therapy in intermediate/high-risk patients — target high urine\n  output; avoid unnecessary potassium/phosphate in IV fluids *(verify rate)*\n- [ ] **Low/intermediate risk** → **allopurinol** (xanthine oxidase inhibitor — prevents new uric acid\n  formation, does not clear existing) *(verify dose, renal adjustment)*\n- [ ] **High risk (or high baseline uric acid)** → **rasburicase**: BSH 2025 specifies a **fixed\n  prophylactic dose of 3 mg** pre-SACT in high-risk patients (not routinely weight-based), with a\n  **second 3 mg dose if needed** on reassessment *(verify against local formulary/protocol)*;\n  contraindicated in **G6PD deficiency — screen first**\n- [ ] Uric acid, K+, phosphate, calcium, creatinine monitored at **increased frequency** (e.g. **q6–8h**\n  in high-risk during the at-risk window) *(verify interval per risk category)*\n- [ ] Avoid concurrent nephrotoxins; correct volume depletion before chemotherapy\n\n### Patient safety — new emphasis (2025)\n- [ ] **Rasburicase/allopurinol availability confirmed at ward and pharmacy level before SACT starts**\n  — the 2025 update follows an NHS England Patient Safety analysis of 64 reported medication-delay\n  incidents (2016–2020), 16 associated with harm, driven by **staff knowledge gaps** and **medication\n  non-availability**\n- [ ] **No delay in first-dose rasburicase/allopurinol administration** once a high-risk patient is\n  identified — treat as a time-critical order, not routine pharmacy queue\n- [ ] Staff (medical/nursing/pharmacy) TLS-management competency assumed **not** guaranteed — confirm\n  local unit education/protocol is current *(verify)*\n\n### Management of established TLS\n- [ ] Continue/escalate aggressive IV hydration; diuretics only after volume repletion if oliguric with fluid overload\n- [ ] **Rasburicase** started/continued for hyperuricemia in established TLS — treatment dosing\n  **0.2 mg/kg IV once daily for 3–7 days as needed** *(verify; G6PD status checked)*\n- [ ] **Hyperkalemia** treated per hyperkalemia protocol — high vigilance, can be rapidly fatal\n- [ ] **Hyperphosphatemia** — phosphate binders; avoid calcium administration for asymptomatic\n  hypocalcemia (risk of calcium-phosphate precipitation) unless symptomatic/severe\n- [ ] **RRT** initiated for refractory hyperkalemia, severe hyperphosphatemia, oligoanuric AKI, or fluid\n  overload unresponsive to medical management — early nephrology involvement in high-risk/established TLS\n- [ ] Continuous cardiac monitoring while electrolytes deranged\n- [ ] Serial labs continued through resolution, not just at onset\n\n## Pearls & pitfalls\n- **TLS is rare with most cancers, especially solid tumors** — don't reflexively label every post-chemo\n  renal or electrolyte abnormality as TLS; keep the differential open (drug nephrotoxicity, sepsis, obstruction)\n  *(EMCrit/IBCC — Tumor Lysis Syndrome)*\n- **Uric acid is largely a \"solved\" problem in the rasburicase era** — the harder, less appreciated driver of\n  organ damage in modern TLS is **calcium-phosphate precipitation**, not uric acid crystal deposition; this\n  is why calcium is withheld in asymptomatic hypocalcemia — giving it can worsen precipitation and AKI\n  *(EMCrit/IBCC — Tumor Lysis Syndrome)*\n- **Rasburicase converts uric acid to allantoin, not the reverse** — once given, standard uric-acid assays\n  can read falsely low/undetectable because the sample continues reacting ex vivo unless handled correctly\n  (send on ice per lab protocol) — don't over-interpret a dramatically \"normal\" post-rasburicase uric acid\n  without accounting for this artifact *(general laboratory-medicine teaching reinforced by EMCrit/IBCC —\n  verify local lab handling protocol)* *(verify)*\n- **Monitoring frequency should track risk category, not be uniform** — a low-risk patient doesn't need q6h\n  labs, and a high-risk patient shouldn't be on a once-daily schedule; matching frequency to risk avoids both\n  under-monitoring and alarm fatigue from unnecessary draws *(EMCrit/IBCC — Tumor Lysis Syndrome)*\n- **Medication availability is a systems failure point, not just a clinical one** — the 2025 BSH update's own\n  evidence base (NHS England's incident analysis) shows delayed rasburicase/allopurinol from stock or\n  knowledge gaps has caused patient harm; confirming the drug is physically available is as much a\n  \"treatment step\" as ordering it *(BSH 2025 guideline itself, reinforced by its patient-safety framing)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nRisk category assigned before SACT start, incorporating agent-specific risk (not just tumor type)? ·\nrasburicase vs allopurinol choice justified by risk tier, with dose (fixed 3 mg prophylactic vs weight-based\ntreatment) specified? · G6PD status checked before rasburicase? · Cairo-Bishop criterion explicitly cited\nwhen labeling as TLS? · medication availability/no-delay confirmed for high-risk patients? · calcium\nwithheld for asymptomatic hypocalcemia? · nephrology involved early if high-risk?\n\n*Sources: [BSH updated TLS guideline 2025 — PubMed](https://pubmed.ncbi.nlm.nih.gov/40903841/) · [BSH updated TLS guideline 2025 — Wiley/Br J Haematol](https://onlinelibrary.wiley.com/doi/10.1111/bjh.70092) · [BSH Guidelines — official listing](https://b-s-h.org.uk/guidelines/guidelines/updated-guidelines-for-the-diagnosis-and-management-of-tumour-lysis-syndrome-in-adults-and-children) · [Guidelines for the management of tumour lysis syndrome (2015, superseded) — PubMed](https://pubmed.ncbi.nlm.nih.gov/25876990/) · [Tumor Lysis Syndrome — EMCrit IBCC](https://emcrit.org/ibcc/tls/) · [IBCC chapter & cast: Tumor Lysis Syndrome — PulmCrit](https://emcrit.org/pulmcrit/tumor-lysis-syndrome/)*\n"}, {"file": "upper-gi-bleed-acg-2021.md", "title": "Upper GI bleed (variceal + non-variceal)", "system": "GI / Hepatic", "body": "# Upper GI bleed (variceal + non-variceal) — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** ACG Clinical Guideline: Upper Gastrointestinal and Ulcer Bleeding (Laine L et al., American\n> College of Gastroenterology), *Am J Gastroenterol* 2021 — https://pubmed.ncbi.nlm.nih.gov/33929377/\n> Variceal component: AASLD Practice Guidance on Risk Stratification and Management of Portal\n> Hypertension and Varices in Cirrhosis (Garcia-Tsao G et al.), 2023 —\n> https://pubmed.ncbi.nlm.nih.gov/37870298/ · AASLD Practice Guidance on TIPS, Variceal Embolization,\n> and Retrograde Transvenous Obliteration in Variceal Hemorrhage, 2023 —\n> https://pubmed.ncbi.nlm.nih.gov/37390489/\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline years 2021 (non-variceal) / 2023 (variceal)\n\n## Why — physiology / first principles\n- Bleeding proximal to the ligament of Treitz, dominated by two mechanistically distinct sources: **peptic\n  ulcer disease** (acid-pepsin erosion through mucosa into a submucosal vessel — bleeding severity tracks\n  vessel caliber, hence stigmata like a visible vessel or active spurting predict rebleeding) versus\n  **variceal hemorrhage** (portal hypertension → high-pressure submucosal/adventitial collaterals → rupture,\n  often massive and pressure-dependent).\n- This split is why **PPI therapy** (raising gastric pH to stabilize clot) treats ulcers, whereas variceal\n  bleeding instead requires **lowering portal pressure** (vasoactive drugs, banding) — different lesions,\n  different physiologic levers.\n\n## Diagnosis / definition\n- [ ] Risk-stratify with **Glasgow-Blatchford score** — score **0-1** may support ED discharge *(verify local pathway)*\n- [ ] **Rockall score** (post-endoscopy) as an adjunct to estimate rebleeding/mortality risk *(components/cutoffs — verify)*\n- [ ] **Forrest classification** of endoscopic stigmata — high-risk: Ia/Ib (active spurting/oozing), IIa (visible vessel); lower-risk: IIb/IIc/III *(exact grade definitions — verify)*\n- [ ] **Child-Pugh class** (A/B/C) used to risk-stratify variceal bleeders for rescue therapy escalation (e.g. early TIPS candidacy) *(scoring components — verify)*\n\n## Key labs & workup\n- [ ] Hgb/Hct trend, coagulation panel — note cirrhotic \"rebalanced\" coagulopathy; INR alone does not reliably predict bleeding risk *(verify)*\n- [ ] BUN:Cr ratio elevated (e.g. **>30**) as an adjunct clue suggesting an upper source *(cutoff — verify)*\n- [ ] Fibrinogen level in cirrhotic/variceal bleeding — target **>150-200 mg/dL** if intervening, in preference to routine FFP for INR correction *(verify)*\n- [ ] Type & crossmatch; consider TEG/ROTEM in cirrhotic coagulopathy rather than isolated INR *(verify)*\n- [ ] *H. pylori* testing before discharge for non-variceal ulcer bleeding\n\n## Management\n### Initial resuscitation (both etiologies)\n- [ ] Hemodynamic assessment + IV access ×2 large-bore, volume resuscitation as needed\n- [ ] RBC transfusion threshold **7 g/dL** *(restrictive strategy; verify per comorbidity — e.g. higher target if active cardiac ischemia)*\n- [ ] Correct coagulopathy/thrombocytopenia only per active bleeding severity — do not over-correct pre-endoscopy *(verify)*\n- [ ] Hold/reverse anticoagulation per bleeding severity — individualize by agent *(verify agent-specific reversal)*\n- [ ] Hematochezia + hemodynamic instability may indicate an **upper GI source** — warrants upper endoscopy\n\n### Non-variceal ulcer bleeding pathway\n- [ ] Pre-endoscopic **IV PPI** infusion *(dose/duration — verify)*\n- [ ] Consider **IV erythromycin** pre-endoscopy to improve mucosal visualization, reduce need for repeat endoscopy\n- [ ] **Endoscopy within 24 h** of presentation\n- [ ] Endoscopic hemostasis mandatory for high-risk stigmata (Forrest Ia/Ib active bleeding, IIa visible vessel) — **combination therapy** (epinephrine injection + a second thermal/mechanical modality) preferred over injection alone\n- [ ] Post-hemostasis high-dose PPI course *(regimen/duration — verify)*; test-and-treat *H. pylori* before discharge\n- [ ] Second-look endoscopy only selectively, not routine *(verify)*\n\n### Variceal bleeding pathway (known/suspected cirrhosis)\n- [ ] **Vasoactive drug** (octreotide/terlipressin/somatostatin) started ASAP, before endoscopy, continued **~2-5 days** *(agent + duration — verify)*\n- [ ] **Antibiotic prophylaxis** (e.g. ceftriaxone) started at presentation for all cirrhotic UGIB regardless of ascites — continue up to 7 days *(agent/dose/duration — verify)*\n- [ ] **Endoscopy within 12 h** of presentation, once hemodynamically resuscitated\n- [ ] **Endoscopic variceal ligation (EVL)** first-line; EVL + vasoactive drug + antibiotics together = standard bundle (superior to any single modality)\n- [ ] Maintain restrictive transfusion strategy — over-transfusion raises portal pressure and rebleeding risk\n- [ ] **Rescue therapy** for refractory/recurrent bleeding: balloon tamponade or self-expanding esophageal stent as a **bridge only** → escalate to **early/rescue TIPS** if high-risk (e.g. Child-Pugh C, or B with active bleeding at endoscopy) *(criteria — verify)*\n- [ ] Establish **secondary prophylaxis** plan before discharge: non-selective beta-blocker + EVL program *(verify)*\n\n## Pearls & pitfalls\n- [ ] Variceal bleeding is a setup for over-resuscitation: because it's a venous-source bleed, raising CVP with aggressive fluids/blood directly increases the driving pressure across the varix and can worsen hemorrhage — resuscitate judiciously, don't chase a normal blood pressure *(verify)* — EMCrit/PulmCrit: \"Coagulopathy management in the bleeding cirrhotic: Seven pearls and one crazy idea\"\n- [ ] Cirrhotic coagulopathy is \"rebalanced\" — an elevated INR does not reliably predict bleeding risk because anticoagulant factors fall in parallel with procoagulant factors; routine FFP to \"correct\" the INR usually doesn't help and adds volume that can worsen portal pressure — consider platelets (target ~50-60k) and fibrinogen (target >150-200 mg/dL) instead if intervention is needed *(verify)* — EMCrit/PulmCrit: \"Coagulopathy management in the bleeding cirrhotic: Seven pearls and one crazy idea\"\n- [ ] Tranexamic acid is not recommended in GI bleeding generally — the HALT-IT trial found no mortality benefit and a signal of harm; don't reach for TXA as a reflexive addition to the bundle *(verify)* — First10EM: \"Management of the massive GI bleed\"\n- [ ] Before intubating an actively bleeding/vomiting patient, resuscitate first where possible (\"resuscitate before you intubate\") and use nasal-cannula-under-non-rebreather preoxygenation with dual suction ready — avoid bag-mask ventilation, which can distend the stomach and worsen aspiration/regurgitation risk *(technique/local practice — verify)* — First10EM: \"Management of the massive GI bleed\"\n- [ ] Some critical-care FOAMed sources flag the mortality benefit of antibiotic prophylaxis in variceal hemorrhage as more equivocal than commonly taught — continue to follow the guideline-directed antibiotic bundle, but recognize this as an area of active debate rather than settled dogma *(current evidence — verify)* — EMCrit IBCC: \"GI Bleeding\"\n- [ ] Prokinetic pre-endoscopy: erythromycin **250 mg IV**, given **20-90 minutes** before EGD, improves mucosal visualization and reduces need for repeat endoscopy *(dose/timing — verify)* — EMCrit IBCC: \"GI Bleeding\"\n\n## Commonly-missed on documentation (what the gap-check flags)\nRisk score documented? · transfusion threshold stated? · anticoagulation held/reversed with rationale? ·\ntime-to-endoscopy documented? · (variceal) vasoactive drug AND antibiotics BOTH started pre-endoscopy? ·\nrescue/TIPS criteria addressed if first-line therapy fails? · secondary prophylaxis plan at discharge?\n\n*Sources: [ACG Clinical Guideline: Upper GI and Ulcer Bleeding — Laine et al. 2021](https://pubmed.ncbi.nlm.nih.gov/33929377/) · [AASLD Practice Guidance: Portal Hypertension and Varices in Cirrhosis 2023](https://pubmed.ncbi.nlm.nih.gov/37870298/) · [AASLD Practice Guidance: TIPS, Variceal Embolization, and RTO 2023](https://pubmed.ncbi.nlm.nih.gov/37390489/) · FOAMed pearls: [EMCrit/PulmCrit — Coagulopathy management in the bleeding cirrhotic](https://emcrit.org/pulmcrit/coagulopathy-bleeding-cirrhotic-inr/) · [First10EM — Management of the massive GI bleed](https://first10em.com/management-of-the-massive-gi-bleed/) · [EMCrit IBCC — GI Bleeding](https://emcrit.org/ibcc/gib/)*\n"}, {"file": "vent-weaning-sbt-aarc-2024.md", "title": "Mechanical ventilation weaning & spontaneous breathing trial", "system": "Respiratory", "body": "# Mechanical ventilation weaning & spontaneous breathing trial — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** AARC Clinical Practice Guideline: Spontaneous Breathing Trials for Liberation From Adult\n> Mechanical Ventilation (Roberts KJ, Goodfellow LT, Battey-Muse CM, et al.), *Respiratory Care* 2024;69(7):891-901.\n> https://rc.rcjournal.com/content/69/7/891\n> Complementary/broader-bundle reference: Liberation from Mechanical Ventilation in Critically Ill Adults —\n> Official ATS/CHEST Clinical Practice Guideline, *AJRCCM* 2017 — covers the wider liberation bundle\n> (sedation, cuff-leak, post-extubation support) not re-litigated by the 2024 AARC update.\n> https://www.atsjournals.org/doi/10.1164/rccm.201610-2075ST\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2024 (AARC, SBT-specific) / 2017 (ATS/CHEST,\n> broader liberation bundle — still current for domains AARC did not re-address)\n\n## Why — physiology / first principles\n- Mechanical ventilation unloads the respiratory muscles; successful weaning requires the patient's\n  respiratory pump (muscle strength, drive) to meet the mechanical **load** (resistance, compliance) once\n  support is withdrawn — the SBT tests this balance directly by simulating unsupported breathing.\n- **RSBI (f/Vt)** approximates the rapid-shallow breathing pattern that signals impending respiratory muscle\n  fatigue.\n- Weaning failure reflects a load/capacity mismatch: poor lung/chest-wall mechanics or secretions raise the\n  load, while disuse atrophy, critical-illness myopathy, and sedation blunt capacity — the physiologic reason\n  strength, mechanics, and mental status are assessed before extubation, not oxygenation alone.\n\n## Diagnosis / definition\n- [ ] **SBT readiness** screened **daily** once ventilated **>24 h**: adequate oxygenation *(FiO₂/PEEP\n  thresholds — verify, commonly FiO₂ ≤0.4–0.5, PEEP ≤5–8)*, hemodynamic stability off/minimal\n  vasopressors, no heavy sedation, adequate mental status/cough *(verify full criteria — ATS/CHEST 2017)*\n- [ ] **Weaning/extubation failure** defined as a failed SBT, or reintubation/need for escalated\n  ventilatory support within **~48–72 h** of a planned extubation *(verify exact definition/window used\n  locally)*\n- [ ] **Rapid shallow breathing index (RSBI) is NOT required** to determine SBT readiness — 2024 AARC\n  conditional recommendation (moderate certainty); do not gate an otherwise-ready patient on RSBI alone\n- [ ] **Perform an SBT** once readiness criteria are met — strong rec (do not skip screening by default)\n- [ ] **Standardized approach to complete the SBT before noon each day** — 2024 AARC conditional\n  recommendation (very low certainty) *(verify local workflow supports this)*\n\n## Key labs & workup\n- [ ] **ABG** before/after SBT as needed to confirm gas exchange and detect occult hypercapnia — a rise\n  in end-tidal/arterial CO₂ of **>~10 mmHg** from baseline during the trial is a recognized failure\n  signal *(verify threshold)*\n- [ ] **RSBI (f/Vt)** — respiratory rate ÷ tidal volume (L), measured off ventilator support; **>105**\n  flags possible weaning difficulty but is low-specificity and NOT a required gate *(verify — see\n  Diagnosis section above)*\n- [ ] **Cuff leak test** — deflate cuff and compare inspired vs expired tidal volume (or listen for an\n  audible leak) in patients at elevated risk of post-extubation stridor *(volume threshold — verify\n  local protocol; test has limited predictive accuracy)*\n- [ ] **CXR reviewed** before extubation for interval changes (new infiltrate, effusion, atelectasis)\n  *(verify)*\n\n## Management\n\n## SBT technique\n- [ ] SBT may be conducted **with or without low-level pressure support (≤8 cmH₂O)** — 2024 AARC\n  conditional recommendation (moderate certainty); no technique shown superior — T-piece and CPAP remain\n  acceptable alternatives *(verify local protocol choice)*\n- [ ] **Do not increase FiO₂** during the SBT to mask deterioration — 2024 AARC conditional recommendation\n- [ ] Duration *(verify local protocol — commonly 30–120 min)*\n- [ ] **Objective failure criteria** pre-defined and documented (RR, SpO₂, HR, BP, distress signs)\n  *(verify thresholds)*\n\n## Protocols & sedation\n- [ ] Use **protocol-driven ventilator liberation** (nurse/RT-driven) rather than ad hoc\n  physician-only timing — strong rec (ATS/CHEST 2017)\n- [ ] Pair SBT with a **daily sedation minimization/interruption protocol** for patients ventilated\n  >24 h — conditional rec (ATS/CHEST 2017)\n\n## Extubation decision & post-extubation support\n- [ ] **Cuff leak test** in patients at elevated risk of post-extubation stridor (e.g., traumatic or\n  prolonged intubation) — conditional rec; consider corticosteroids if leak test positive but\n  extubation still indicated *(dose/timing — verify)*\n- [ ] **Prophylactic NIV immediately after extubation** for high-risk patients (COPD, CHF,\n  hypercapnia, obesity) — strong rec, reduces reintubation\n- [ ] **HFNC** considered as an alternative for lower-risk hypoxemic patients post-extubation *(verify\n  per HFNC guideline — see companion checklist)*\n\n## Rehabilitation\n- [ ] **Early mobilization/rehabilitation** incorporated as part of the liberation bundle —\n  conditional rec (ATS/CHEST 2017)\n\n## Pearls & pitfalls\n- Consider dexmedetomidine over heavier sedation before an SBT attempt — it suppresses respiratory\n  drive less than other sedatives, so some units continue it through the trial rather than routinely\n  holding all sedation (IBCC/EMCrit — Extubation) *(verify against local sedation protocol)*\n- RSBI >105 is a weak predictor in isolation — cited specificity for extubation failure is only\n  ~44%, so treat a high RSBI as a prompt to look closer, not a reason to cancel an otherwise-ready\n  trial (IBCC/EMCrit — Extubation) *(verify)*\n- The cuff leak test is an imperfect predictor of post-extubation stridor — a present leak doesn't\n  guarantee an uncomplicated extubation, and an absent leak alone shouldn't automatically cancel one;\n  use it alongside clinical judgment (IBCC/EMCrit — Extubation) *(verify)*\n- Watch for occult hypercapnia during an SBT — a rise in end-tidal CO₂ of more than ~10 mmHg from\n  baseline can signal impending failure before overt distress appears (IBCC/EMCrit — Extubation)\n  *(verify threshold)*\n- Common failure causes worth actively screening for before pulling the tube: volume\n  overload/pulmonary edema, bronchospasm, weak cough/poor secretion clearance, and altered mental\n  status — not just oxygenation numbers (IBCC/EMCrit — Extubation)\n- A reintubation rate around 15% is cited as consistent with acceptable extubation practice — an\n  unusually low rate may reflect over-conservative timing rather than safer practice (IBCC/EMCrit —\n  Extubation) *(verify against unit benchmarks)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nDaily SBT-readiness screen documented (not just \"not ready\" with no criteria listed)? · SBT not\ninappropriately gated on RSBI? · SBT technique (± low-level PS) and FiO₂-held-constant documented? · SBT\ncompletion targeted before noon per unit workflow? · sedation minimization paired with SBT attempts? ·\ncuff leak test performed in high-risk patients before extubation? · prophylactic NIV/HFNC planned for\nhigh-risk patients post-extubation?\n\n*Sources: [AARC Clinical Practice Guideline: Spontaneous Breathing Trials for Liberation From Adult Mechanical Ventilation — Respiratory Care 2024](https://rc.rcjournal.com/content/69/7/891) · [PubMed record](https://pubmed.ncbi.nlm.nih.gov/38443142/) · [AARC guideline summary — Guideline Central](https://www.guidelinecentral.com/guideline/3533896/) · [Prior/complementary edition — ATS/CHEST 2017 Liberation from Mechanical Ventilation — AJRCCM](https://www.atsjournals.org/doi/10.1164/rccm.201610-2075ST) · [IBCC/EMCrit — Extubation chapter (pearls source)](https://emcrit.org/ibcc/extubation/)*\n"}, {"file": "vt-vf-electrical-storm-esc-2022.md", "title": "Ventricular tachycardia/fibrillation & electrical storm", "system": "Cardiac", "body": "# Ventricular tachycardia/fibrillation & electrical storm — standard-of-care checklist\n\n> ⚠ **AI-COMPILED navigational aid — NOT a substitute for the primary guideline.** Physician verifies\n> before any clinical use. Values marked *(verify)* must be confirmed against the source and local protocol.\n> **Source:** 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the\n> prevention of sudden cardiac death, European Society of Cardiology, 2022.\n> https://academic.oup.com/eurheartj/article/43/40/3997/6675633 (also https://pubmed.ncbi.nlm.nih.gov/36017572/)\n> **Secondary:** 2017 AHA/ACC/HRS Guideline for Management of Patients With Ventricular Arrhythmias and\n> the Prevention of Sudden Cardiac Death — used for acute/pulseless algorithm cross-reference and\n> pharmacologic detail not itemized in the ESC electrical-storm summary.\n> https://www.ahajournals.org/doi/10.1161/CIR.0000000000000549\n> **Compiled:** 06-Sep-2026 · Claude Code · guideline year 2022 (check for a newer edition periodically)\n\n## Why — physiology / first principles\n- Scar/ischemic border zones create heterogeneous conduction velocity and refractoriness — the substrate\n  for re-entry circuits (monomorphic VT) or triggered/disorganized activity (polymorphic VT, VF); VF has\n  no organized mechanical contraction, so CO is ~zero — immediate defibrillation, not drugs, is definitive.\n- Defibrillation works by simultaneously depolarizing a critical mass of myocardium, extinguishing all\n  competing wavefronts at once so the native sinus pacemaker (fastest intrinsic rate) can resume control\n  — this is why shock timing/energy matters and why antiarrhythmics alone cannot terminate VF.\n- \"Electrical storm\" (≥3 episodes/24h) reflects a surge in sympathetic drive lowering the arrhythmic\n  threshold on top of the fixed scar substrate — which is why sedation and β-blockade (sympathetic\n  suppression), not just antiarrhythmic escalation, are first-line storm therapy alongside treating the\n  reversible trigger (ischemia, electrolytes, device malfunction).\n\n## Diagnosis / definition\n- [ ] **Sustained VT** — VT lasting **≥30 seconds**, or requiring termination by intervention before\n  30 s because of hemodynamic compromise *(verify — ESC 2022)*\n- [ ] **Non-sustained VT** — ≥3 consecutive ventricular beats, terminating spontaneously within 30 s *(verify)*\n- [ ] **Monomorphic VT** — uniform QRS morphology beat-to-beat; usually scar-related/structural heart disease\n- [ ] **Polymorphic VT** — continuously varying QRS morphology; includes **Torsades de Pointes**\n  (polymorphic VT in the setting of QT prolongation, with QRS complexes appearing to \"twist\" around the\n  isoelectric baseline)\n- [ ] **Ventricular fibrillation (VF)** — chaotic rhythm, irregular in both timing and morphology, no\n  discrete QRS complexes on the surface ECG\n- [ ] **Electrical storm** *(verify against source)* — **≥3 separate episodes of sustained ventricular\n  arrhythmia (VT/VF), each separated by ≥5 min, each requiring termination by an intervention (shock,\n  ATP, or drug), within a 24 h window** — ESC 2022 devotes a dedicated chapter/algorithm to this for the\n  first time, split by monomorphic vs polymorphic pathway\n- [ ] **Incessant VT** — ongoing/recurrent VT for **>12 h** (verify), or so frequent that a stable\n  rhythm cannot be restored/maintained — distinct from, but related to, storm\n\n## Key labs & workup\n- [ ] **12-lead ECG** — morphology (mono- vs polymorphic), QT interval, evidence of ischemia/structural\n  disease; interrogate ICD/pacemaker if present\n- [ ] **Electrolytes** — K⁺, Mg²⁺, Ca²⁺ corrected to target — hypokalemia/hypomagnesemia are major\n  reversible drivers of storm *(verify targets)*\n- [ ] **Troponin + ischemia workup** — ECG, consider urgent angiography if ACS suspected as the trigger\n- [ ] **TSH** — thyrotoxicosis is a recognized reversible trigger *(verify)*\n- [ ] **Drug levels/toxicology screen** as indicated — QT-prolonging drug review, digoxin level, illicit drug use\n- [ ] **Echocardiogram** — structural heart disease, LVEF, wall motion, once stabilized\n- [ ] **Cardiac MRI** — ESC 2022 Class I in sudden cardiac arrest survivors without a clear cause *(verify)*\n- [ ] **Genetic/channelopathy screening** — if structurally normal heart and no acquired cause found (see Post-event workup below)\n\n## Management\n\n## Pulseless VT/VF — do not delay for this checklist\n- [ ] **Immediate defibrillation + ACLS algorithm** — this document does not duplicate the pulseless\n  arrest pathway; follow current **AHA ACLS VF/pulseless-VT algorithm** *(verify against institutional ACLS card)*\n\n## Hemodynamically unstable VT with a pulse\n- [ ] **Synchronized cardioversion** without delay *(energy per device/local protocol — verify)*\n- [ ] Brief sedation if time permits, but do not delay shock for a stable patient in extremis\n\n## Stable sustained monomorphic VT\n- [ ] **12-lead ECG** before treatment if tolerated (morphology aids later ablation planning)\n- [ ] **Antiarrhythmic drug vs elective cardioversion** — options include **amiodarone, procainamide, or\n  sotalol** *(agent/dose — verify against source and local formulary; procainamide avoided in significant\n  structural heart disease/reduced EF)*\n- [ ] Correct reversible/contributing factors in parallel (see below) — do not treat the rhythm in isolation\n\n## Correct reversible causes (all VT/VF presentations)\n- [ ] **Electrolytes** — K⁺ and Mg²⁺ to target *(level — verify)*\n- [ ] **Ischemia workup** — ECG, troponin; consider urgent angiography if ACS suspected\n- [ ] **Review QT-prolonging drugs** and stop/replace culprits\n- [ ] **Hypoxia and acid-base status** corrected\n- [ ] Consider drug toxicity/withdrawal, digoxin, or other reversible triggers per clinical context\n\n## Electrical storm — recognition\n- [ ] **Definition:** **≥3 separate sustained ventricular arrhythmia episodes within 24 h**, each requiring\n  termination by an intervention (shock, ATP, or drug) — ESC 2022\n- [ ] Distinguish **monomorphic VT** (usually scar-related, structural heart disease) vs **polymorphic\n  VT/VF** — management pathway differs per ESC algorithm\n\n## Electrical storm — management bundle (monomorphic VT + structural heart disease)\n- [ ] **Amiodarone IV** (bolus + infusion) — *(dose — verify)* — Class I\n- [ ] **Non-selective beta-blocker** (e.g. propranolol or metoprolol bolus) — Class I; combine with\n  amiodarone rather than using either alone\n- [ ] **Mild-to-moderate sedation** to blunt sympathetic surge — Class I; escalate to **general\n  anesthesia/intubation** if refractory\n- [ ] **ICD interrogation and reprogramming** if device present (detection zones, ATP settings)\n- [ ] **Identify and correct triggers** (ischemia, electrolytes, heart-failure decompensation, device lead issue)\n- [ ] **Urgent EP consultation** — for recurrent/refractory storm, **catheter ablation at an experienced\n  centre is preferred over continued escalation of sedation/autonomic modulation/mechanical support**\n- [ ] **Mechanical circulatory support** if hemodynamically compromised or storm precludes drug/ablation therapy\n- [ ] **Sympathetic modulation** (e.g. stellate ganglion block) or other autonomic modulation in refractory cases\n- [ ] **Refer to specialized/tertiary centre** if additional treatment needed beyond initial measures\n\n## Polymorphic VT / Torsades de Pointes (treat as distinct pathway)\n- [ ] **Avoid further QT-prolonging polypharmacy** — review and stop offending agents first\n- [ ] **IV magnesium** first-line regardless of measured level *(dose — verify)*\n- [ ] Correct **K⁺** to high-normal *(target — verify)*\n- [ ] For **bradycardia-dependent** Torsades: consider **isoproterenol** and/or **temporary pacing** to\n  increase heart rate and shorten QT *(verify — contraindicated in congenital LQTS)*\n- [ ] If structurally normal heart and no clear acquired cause, consider a primary channelopathy\n  (congenital LQTS, Brugada, CPVT) — see workup below\n\n## Post-event workup (once stabilized)\n- [ ] **Echocardiogram** — assess structural heart disease, EF\n- [ ] **Ischemia evaluation** (angiography/functional testing as indicated)\n- [ ] **Cardiac MRI** — ESC 2022 Class I in survivors of sudden cardiac arrest without a clear cause\n- [ ] **Genetic/channelopathy screening** if structurally normal heart and no cause identified; family\n  evaluation recommended if a pathogenic variant is found (including post-mortem cascade testing)\n- [ ] **ICD evaluation for secondary prevention** in survivors of VT/VF arrest without a fully reversible\n  cause *(indication/timing — verify against source)*\n\n## Pearls & pitfalls\n- Deep sedation (propofol preferred for its sympatholytic effect) can itself help break VT storm — err\n  toward more aggressive analgesia/sedation until the storm is controlled, since unresolved pain drives\n  sympathetic tone and arrhythmia recurrence *(EMCrit IBCC)*\n- Non-selective, CNS-penetrant beta-blockade (propranolol) is favoured over cardioselective agents\n  (metoprolol/esmolol) for storm; one series found oral propranolol outperformed metoprolol by roughly\n  **2.7-fold** in event reduction *(verify dosing — EMCrit IBCC)*\n- Under-dosing beta-blockade and under-sedating are two of the most common pitfalls that let VT storm\n  perpetuate — a \"wait and see\" approach tends to fail, since storm behaves as a self-perpetuating cycle\n  that needs early, aggressive escalation *(EMCrit IBCC)*\n- Don't neglect electrolytes — aggressive potassium and magnesium repletion is a core, easily\n  under-prioritized component of storm management, not just an adjunct *(EMCrit IBCC)*\n- Stellate ganglion block is increasingly used for refractory storm; left-sided blockade is classic, but\n  bilateral blockade is being used more often in truly refractory cases *(EMCrit IBCC)*\n- Distinguish torsades-driven storm from non-torsades storm early — they need fundamentally different\n  management (magnesium/pacing/isoproterenol vs amiodarone/beta-blockade), and treating one pathway as\n  the other can worsen the arrhythmia *(EMCrit IBCC)*\n\n## Commonly-missed on documentation (what the gap-check flags)\nElectrical storm definition met/counted? · monomorphic vs polymorphic distinguished? · amiodarone +\nbeta-blocker both given? · sedation escalation documented? · reversible triggers (lytes/ischemia/QT\ndrugs/hypoxia) addressed? · ICD interrogated/reprogrammed if present? · EP/ablation referral for\nrecurrent storm? · echo + ischemia workup + genetic screen post-event? · secondary-prevention ICD addressed?\n\n*Sources: [2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death](https://pubmed.ncbi.nlm.nih.gov/36017572/) · [Spotlight on the 2022 ESC guideline — 10 novel key aspects (PMC)](https://pmc.ncbi.nlm.nih.gov/articles/PMC10228619/) · [2017 AHA/ACC/HRS Guideline for Management of Patients With Ventricular Arrhythmias and the Prevention of Sudden Cardiac Death](https://www.ahajournals.org/doi/10.1161/CIR.0000000000000549) · [EMCrit IBCC — Ventricular arrhythmias / VT storm](https://emcrit.org/ibcc/storm/)*\n"}];

// minimal, safe markdown → HTML for the checklist files (headings, blockquote, - [ ] lists, bold/italic, links)
function refMd(md){
  var esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var inline=function(s){ s=esc(s);
    s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    return s; };
  var lines=md.split(/\r?\n/), out=[], inList=false, inBq=false;
  function closeList(){ if(inList){out.push('</ul>');inList=false;} }
  function closeBq(){ if(inBq){out.push('</blockquote>');inBq=false;} }
  var isRow=function(s){ return /^\s*\|.*\|\s*$/.test(s); };
  var cells=function(s){ return s.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();}); };
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    // markdown table: a pipe-row followed by a |---|--- separator row
    if(isRow(l) && i+1<lines.length && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i+1]) && lines[i+1].indexOf('-')>=0){
      closeList(); closeBq();
      var head=cells(l); i+=2; var body=[];
      while(i<lines.length && isRow(lines[i])){ body.push(cells(lines[i])); i++; }
      i--;
      var t='<table class="reftbl"><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>';
      body.forEach(function(r){ t+='<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>'; });
      out.push(t+'</tbody></table>'); continue;
    }
    if(/^\s*$/.test(l)){ closeList(); closeBq(); continue; }
    if(/^>\s?/.test(l)){ if(!inBq){out.push('<blockquote>');inBq=true;} out.push(inline(l.replace(/^>\s?/,''))+'<br>'); continue; }
    closeBq();
    var h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){ closeList(); var lv=h[1].length; out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'); continue; }
    var li=l.match(/^\s*[-*]\s+(?:\[[ x]\]\s+)?(.*)/);
    if(li){ if(!inList){out.push('<ul>');inList=true;} out.push('<li>'+inline(li[1])+'</li>'); continue; }
    closeList(); out.push('<p>'+inline(l)+'</p>');
  }
  closeList(); closeBq(); return out.join('\n');
}

     +'#refbody ul{margin:4px 0 10px;padding-left:22px}#refbody li{margin:3px 0;line-height:1.4}#refbody a{color:#1a73e8}#refbody code{background:#eef2f8;padding:1px 4px;border-radius:3px;font-size:12px}'
     +'#refbody .rstub{color:#889;padding:30px;text-align:center}'
     +'#refbody table.reftbl{border-collapse:collapse;margin:8px 0 12px;font-size:12.5px;width:100%}'
     +'#refbody table.reftbl th{background:#eef2f8;text-align:left;padding:5px 8px;border:1px solid #cbd5e6;font-weight:700;color:#12285e}'

     +'#refbody table.reftbl tr:nth-child(even) td{background:#f8fafd}';
    document.head.appendChild(st); }
  window._refBySys=function(){ var g={}; REFDATA.forEach(function(r){ (g[r.system]=g[r.system]||[]).push(r); }); return g; };
  window._refSYS=SYS;
  refRenderList('');
  var body=document.getElementById('refbody');
  body.innerHTML='<div class="rstub">← Pick a condition, or search. Each is an AI-compiled checklist from a reputable society guideline — <b>verify before clinical use</b>.</div>';
}
function refRenderList(q){
  var list=document.getElementById('reflist'); if(!list)return;
  q=(q||'').toLowerCase();
  var g=window._refBySys(), html='';
  window._refSYS.forEach(function(sys){
    var items=(g[sys]||[]).filter(function(r){ return !q || r.title.toLowerCase().indexOf(q)>=0 || r.body.toLowerCase().indexOf(q)>=0; })
      .sort(function(a,b){return a.title<b.title?-1:1;});
    if(!items.length)return;
    html+='<div class="rsys">'+esc(sys)+'</div>';
    items.forEach(function(r){ html+='<div class="ritem'+(refSel===r.file?' on':'')+'" onclick="refOpen(\''+r.file+'\')">'+esc(r.title)+'</div>'; });
  });
  list.innerHTML=html||'<div class="rstub" style="padding:20px;font-size:12px">No match.</div>';
}
function refFilter(){ var q=document.getElementById('refq').value; refRenderList(q); }
function refOpen(file){
  refSel=file; var r=REFDATA.filter(function(x){return x.file===file;})[0]; if(!r)return;
  document.getElementById('refbody').innerHTML=refMd(r.body);
  refRenderList(document.getElementById('refq')?document.getElementById('refq').value:'');
}

   +'.rrbtns{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.rrbtns button{font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}'

   +'.parkwrap{max-width:900px;margin:4px auto}.parkitem{background:#fff;border:1px solid #cbd5e6;border-radius:8px;padding:11px 14px;margin:8px 0;display:flex;gap:12px;align-items:flex-start}'
   +'.parkitem .pi-main{flex:1;min-width:0}.parkitem .pi-u{display:inline-block;font-size:10px;font-weight:800;background:#12285e;color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px}'
   +'.parkitem .pi-sub{font-size:13.5px;color:#12213f;font-weight:600}.parkitem .pi-meta{font-size:11px;color:#889;margin-top:2px}.parkitem .pi-btns{display:flex;gap:6px;flex-wrap:wrap}'
   +'.parkitem button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}.parkitem .act{background:#1f8a4c;color:#fff}.parkitem .cpy{background:#1a73e8;color:#fff}.parkitem .del{background:#f3f4f7;color:#933}';
  document.head.appendChild(st); }
function rrGet(k){ return (beds[k]&&beds[k].d)||{}; }
function erow(k,label,field,val){ return '<div class="rrrow"><span class="k">'+label+'</span><span class="v" contenteditable="true" data-rf="'+field+'">'+esc(val||'')+'</span></div>'; }
function rrCardHTML(k){
  rrStyle(); var w=beds[k], d=w.d||{}, isC=w.kind==='consult';
  var t=new Date(w.ts); var tl=(isNaN(t)?'':t.toLocaleString());
  var h='<div class="rrcard" data-k="'+k+'">';
  if(isC){
    h+='<h2>🩺 Ward Consult</h2><div class="sub">'+esc(tl)+'</div>';
    h+=erow(k,'Location',   'location', d.location);
    h+=erow(k,'Age / Sex',  'age_sex',  d.age_sex);
    h+=erow(k,'Reason',     'reason',   d.reason);
    h+=erow(k,'Background',  'background',d.background);
    h+=erow(k,'Assessment', 'assessment',d.assessment);
    var oc=(d.outcome||'').toLowerCase();
    h+='<div class="rrrow"><span class="k">Outcome</span><div class="v" style="border:0;background:none;padding:0"><div class="rrout">'
      +['admit','watch','decline'].map(function(o){return '<button class="rrob'+(oc===o?' on-'+o:'')+'" onclick="rrSetOutcome(\''+k+'\',\''+o+'\')">'+o.toUpperCase()+'</button>';}).join('')+'</div></div></div>';
    if(oc==='admit') h+=erow(k,'Admit to','dest_unit',d.dest_unit);
    if(oc==='decline') h+=erow(k,'Not ICU because','not_candidate_reason',d.not_candidate_reason);
    h+=erow(k,'Plan',       'plan',     d.plan);
    h+=erow(k,'Return precautions','return_precautions',d.return_precautions);
    if(oc==='decline') h+='<div class="rrsafety">⚠ Not an ICU candidate at this point'+(d.not_candidate_reason?' ('+esc(d.not_candidate_reason)+')':'')+'. If '+(esc(d.return_precautions)||'condition changes')+' → recontact the ICU team.</div>';
    else if(oc==='admit') h+='<div class="rrsafety">→ Admitting to '+(esc(d.dest_unit)||'unit')+'. Do a separate <b>icu admission Bed N:</b> for the full note.</div>';
  } else {
    h+='<h2>🚑 Code Blue</h2><div class="sub">'+esc(tl)+'</div>';
    h+=erow(k,'Location','location',d.location);
    h+=erow(k,'Age / Sex','age_sex',d.age_sex);
    h+=erow(k,'Found','found',d.found);
    h+=erow(k,'Initial rhythm','initial_rhythm',d.initial_rhythm);
    h+=erow(k,'Downtime (min)','downtime_min',d.downtime_min);
    h+=erow(k,'CPR (min)','cpr_min',d.cpr_min);
    h+=erow(k,'Interventions','interventions',Array.isArray(d.interventions)?d.interventions.join(' · '):d.interventions);
    h+=erow(k,'ROSC','rosc',(d.rosc===true?'Yes':(d.rosc===false?'No':d.rosc))+(d.rosc_time?' @ '+d.rosc_time:''));
    h+=erow(k,'Outcome','outcome',d.outcome);
    h+=erow(k,'Dispo','dispo',d.dispo);
    h+=erow(k,'Summary','summary',d.summary);
  }
  h+='<div class="rrbtns"><button class="copy" onclick="rrCopy(\''+k+'\')">📋 Copy note</button>'
    +'<button class="del" onclick="rrDelete(\''+k+'\')">🗑 Delete entry</button></div></div>';
  return h;
}
function bindRRCard(k){
  var view=document.getElementById('view');
  view.querySelectorAll('[data-rf]').forEach(function(el){
    el.addEventListener('input', function(){ var f=el.getAttribute('data-rf'); var v=el.textContent.replace(/\s+/g,' ').trim();
      if(!beds[k])return; beds[k].d=beds[k].d||{};
      if(f==='interventions') beds[k].d[f]=v.split(' · ').filter(Boolean); else beds[k].d[f]=v;
      clearTimeout(window._rrsave); window._rrsave=setTimeout(save,600);
    });
  });
}
function rrSetOutcome(k,o){ if(!beds[k])return; beds[k].d=beds[k].d||{}; beds[k].d.outcome=o; save(); renderView(); }
function rrCopy(k){ var w=beds[k], d=w.d||{}, t=new Date(w.ts), tl=(isNaN(t)?'':t.toLocaleString()); var s;
  if(w.kind==='consult'){ var oc=(d.outcome||'').toLowerCase();
    s='RAPID RESPONSE CONSULT — '+tl+'\n'
     +'Location: '+(d.location||'')+' · '+(d.age_sex||'')+'\n'
     +'Reason for consult: '+(d.reason||'')+'\n'
     +(d.background?'Background: '+d.background+'\n':'')
     +'Assessment: '+(d.assessment||'')+'\n'
     +'Outcome: '+(oc==='admit'?('ADMIT to '+(d.dest_unit||'ICU')):oc==='watch'?'WATCH / reassess':'NOT for ICU at this time')+'\n'
     +(d.plan?'Plan: '+d.plan+'\n':'')
     +(oc==='decline'?('Not an ICU candidate at this point'+(d.not_candidate_reason?' ('+d.not_candidate_reason+')':'')+'. If '+(d.return_precautions||'condition changes')+' → recontact ICU team.\n'):'')
     +(oc!=='decline'&&d.return_precautions?('Return precautions: '+d.return_precautions+'\n'):'');
  } else {
    s='CODE BLUE — '+tl+'\nLocation: '+(d.location||'')+' · '+(d.age_sex||'')+'\n'
     +(d.found?'Found: '+d.found+'\n':'')
     +'Initial rhythm: '+(d.initial_rhythm||'?')+' · downtime ~'+(d.downtime_min||'?')+' min · CPR '+(d.cpr_min||'?')+' min\n'
     +'Interventions: '+(Array.isArray(d.interventions)?d.interventions.join(', '):(d.interventions||''))+'\n'
     +'ROSC: '+(d.rosc===true?('Yes'+(d.rosc_time?' @ '+d.rosc_time:'')):(d.rosc===false?'No':(d.rosc||'?')))+'\n'
     +'Outcome: '+(d.outcome||'')+' · Dispo: '+(d.dispo||'')+'\n'+(d.summary?d.summary+'\n':'');
  }
  copyText(s); flashMsg('📋 Note copied');
}
function rrDelete(k){ if(!confirm('Delete this Rapid Response entry?'))return; delete beds[k]; if(current===k)current=null; save(); renderRail(); renderView(); }
function copyText(s){ try{ navigator.clipboard.writeText(s); }catch(e){ var ta=document.createElement('textarea'); ta.value=s; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e2){} document.body.removeChild(ta); } }
function flashMsg(t){ var m=document.getElementById('msg'); if(m){ m.textContent=t; } }

var parkView='active';
function setParkView(v){ parkView=v; renderView(); }
function renderPark(view){
  rrStyle();
  var showing=parkView==='archived';
  var bar='<div id="hvbar"><b>🅿️ Park — prep drafts</b> <span style="color:#667">'+parkData.length+' active · '+parkHist.length+' archived</span>'
    +'<span class="hvsp"></span>'
    +'<button class="sec2" onclick="setParkView(\'active\')"'+(!showing?' style="font-weight:800"':'')+'>Active ('+parkData.length+')</button>'
    +'<button class="sec2" onclick="setParkView(\'archived\')"'+(showing?' style="font-weight:800"':'')+'>📜 Archived ('+parkHist.length+')</button>'
    +(!showing&&parkData.length?'<button class="sec2" style="color:#933" onclick="if(confirm(\'Clear all '+parkData.length+' parked draft(s)? They move to Archived (not deleted) — use this to start fresh for a new shift.\')){parkClearAll();renderView();}">🧹 Clear → archive</button>':'')
    +'<button class="sec2" onclick="parkPull(function(){renderView();})">↻ refresh</button></div>';
  var list=showing?parkHist:parkData;
  var body='<div class="parkwrap">';
  if(!list.length){ body+='<div class="stub" style="padding:24px">'+(showing?'No archived drafts yet. Activated or cleared parks land here — nothing is lost.':'No parked drafts. The day before a unit shift, run <b>icu prep Bed N:</b> for a complex/long-stay patient, paste the JSON here, and it waits until you activate it day-of.')+'</div>'; }
  list.slice().sort(function(a,b){return ((b.archivedAt||b.savedAt)||'').localeCompare((a.archivedAt||a.savedAt)||'');}).forEach(function(p){
    var d=p.d||{}, when=(p.savedAt||'').slice(0,10);
    body+='<div class="parkitem"'+(showing?' style="opacity:.75"':'')+'><div class="pi-main">'
      +'<div><span class="pi-u">'+esc((p.unit||d.unit||'?').toString().toUpperCase())+'</span>'
      +'<span class="pi-sub">'+esc(d.age_sex||'')+(d.subtitle?' · '+esc(d.subtitle):'')+(d.bed?' · bed '+esc(''+d.bed):'')+'</span></div>'
      +'<div class="pi-meta">parked '+esc(when)+(d.icu_admit?' · ICU admit '+esc(d.icu_admit):'')+(showing?' · '+esc(p.how||'archived')+' '+esc((p.archivedAt||'').slice(0,10)):'')+'</div></div>'
      +'<div class="pi-btns">'
      +(showing
          ? '<button class="cpy" onclick="copyPark(\''+p.id+'\',1)">📋 Copy JSON</button><button class="act" onclick="parkRestore(\''+p.id+'\');renderView()">♻ Restore</button>'
          : '<button class="act" onclick="activatePark(\''+p.id+'\')">⬆ Activate</button><button class="cpy" onclick="copyPark(\''+p.id+'\')">📋 Copy prep JSON</button><button class="del" onclick="if(confirm(\'Archive this parked draft? (recoverable under Archived)\')){parkArchive(\''+p.id+'\',\'removed\');renderView();}">🗑</button>')
      +'</div></div>';
  });
  body+='</div>';
  view.innerHTML='<div style="position:absolute;inset:0;display:flex;flex-direction:column">'+bar+'<div style="flex:1;overflow:auto;padding:12px 14px">'+body+'</div></div>';
}
function copyPark(id,fromHist){ var src=fromHist?parkHist:parkData; var p=src.filter(function(x){return x.id===id;})[0]; if(!p)return; copyText(JSON.stringify(p.d,null,2)); flashMsg('📋 Prep JSON copied — paste into an "icu daily update Bed N:" chat with the new day\'s data'); }
function activatePark(id){
  var p=parkData.filter(function(x){return x.id===id;})[0]; if(!p)return;
  var d=p.d||{}, u=normUnit(d.unit); if(!UNITS[u]){ u=prompt('Which unit? (MICU/SICU/CCU/PICU/CSU/MSU)','')||''; u=normUnit(u); if(!UNITS[u]){alert('Unknown unit.');return;} }
  var n=prompt('Activate "'+((d.age_sex||'')+(d.subtitle?' · '+d.subtitle:''))+'"\n\nInto '+u+' — bed number?', d.bed||'');
  if(n===null)return; n=String(n).trim(); if(!n){alert('Need a bed number.');return;}
  captureCurrentBed();
  unit=u; try{localStorage.setItem('ub_last_unit',unit);}catch(e){} document.getElementById('unitSel').value=unit;
  load();
  var nd=JSON.parse(JSON.stringify(d)); delete nd.prep; delete nd.prep_date; nd.bed=n; if(!nd.note_type)nd.note_type='daily';
  beds[n]={ d:nd, stay:mintStay(), state:'preround', overnight:'', taskDone:[] };
  save(); parkArchive(id,'activated');
  current=n; section='daily'; setTab('daily'); renderRail(); renderView(); if(syncOn())syncPull();
  flashMsg('✓ Activated to '+u+' bed '+n+' — now run "icu daily update Bed '+n+':" with today\'s data to consolidate.');
}

function promptsPanel(){
  var rows=[
    ['icu daily Bed N:','YOUR beds (you charted them) → full daily SCM note + rich card. Paste the JSON here.'],
    ['icu daily update Bed N:','Update an existing daily note (re-paste to refresh the bed).'],
    ['icu admission Bed N:','New ICU admission note (+ handover card).'],
    ['icu admission update Bed N:','Update an admission note.'],
    ['icu admission Bed unassigned:','Admission with no bed yet → Unassigned area (also accepts "pending").'],
    ['icu consult:','🚑 Rapid Response ward consult → timestamped card in the Rapid Response view. States reason + outcome (admit / watch / decline); a decline auto-adds the return-precautions safety-net line. Paste JSON (± photo).'],
    ['icu code blue:','🚑 Code-blue capture — paste the code-sheet photo → concise card (rhythm · downtime · ROSC · interventions · dispo). Lives in Rapid Response.'],
    ['icu prep Bed N:','🅿️ Next-day PARK draft — stable fields only (history / course / PMHx). Paste → Park tab; day-of Activate → "icu daily update Bed N:" merges the day\'s data (consolidates the note).'],
    ['(unit) Rapid Response','Pick from the Unit dropdown (auto-selected on RR days). A timestamped worklist of your consults / codes / admissions — all kept here, revisit/edit by time; own History per shift.'],
    ['(tab) 🅿️ Park','Parked prep drafts. Activate one day-of → it lands on its unit as a pre-round bed. "Clear → archive" starts a fresh list without deleting (Archived + Restore).'],
    ['handover bed N:','COLLEAGUE bed you did NOT chart → the FAST path: one condensed full-quality card (hv:1), no full note. Paste JSON → appears on Handover tab.'],
    ['handover beds:','Several colleague beds at once → ONE JSON array → ONE paste loads them all. The quick way to cover a colleague’s whole list.'],

  return '<div class="panel"><div class="census" style="max-width:760px"><b>ICU prompts / triggers</b>'+
    '<table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:13px">'+rows+'</table></div></div>';
}

// §23 rounding sheet for the current bed (uses live edits via the tool's captureToD when reachable)
function roundSheetForCurrent(){
  if(current==null||!beds[current]){ alert('Load a bed first (paste its JSON).'); return; }
  var d=bd(current);
  try{ var ifr=document.querySelector('#view iframe'); if(ifr&&ifr.contentWindow&&typeof ifr.contentWindow.captureToD==='function'){ var ed=ifr.contentWindow.captureToD(); if(ed&&ed.bed!=null)d=ed; } }catch(e){}
  var html=renderRoundingSheet(d);
  var w=window.open('','_blank');
  if(w){ w.document.open(); w.document.write(html); w.document.close(); }
  else { alert('Popup blocked — allow popups for this page to open the rounding sheet.'); }
}

// convenience: paste auto-loads; Cmd/Ctrl+Enter also loads

pj.addEventListener('paste', function(){ setTimeout(loadPaste, 40); });
